<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dock · 复刻自 21st.dev</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:linear-gradient(180deg,#fff1e6 0%,#ffe4d6 55%,#ffd9c2 100%);
    color:#5b3a2e; min-height:100vh; display:flex; flex-direction:column; align-items:center;
    overflow:hidden; user-select:none;
  }
  header { margin-top:64px; text-align:center; padding:0 24px; }
  header .tag {
    display:inline-block; font-size:12px; color:#b0715a; border:1px solid rgba(176,113,90,.4);
    border-radius:999px; padding:4px 12px; margin-bottom:14px; letter-spacing:.5px;
    background:rgba(255,255,255,.04);
  }
  header h1 { font-size:30px; font-weight:800; letter-spacing:2px; }
  header h1 .dot { color:#5aa9ff; }
  header p { margin-top:10px; font-size:13px; color:#b0715a; line-height:1.7; opacity:.85; }
  .stage { flex:1; width:100%; display:flex; align-items:flex-end; justify-content:center; padding-bottom:48px; }
  .dock-wrap { display:flex; flex-direction:column; align-items:center; }
  .tip {
    margin-bottom:14px; font-size:12px; color:#cfe0f7; background:rgba(255,251,245,.95);
    border:1px solid rgba(255,255,255,.14); border-radius:8px; padding:5px 12px;
    opacity:0; transform:translateY(6px); transition:opacity .18s, transform .18s; pointer-events:none;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .tip.show { opacity:1; transform:translateY(0); }
  .dock {
    display:flex; align-items:flex-end; gap:10px; padding:14px 16px;
    max-width:calc(100vw - 24px);
    background:rgba(255,248,240,.85);
    -webkit-backdrop-filter:blur(22px) saturate(1.6); backdrop-filter:blur(22px) saturate(1.6);
    border:1px solid rgba(255,255,255,.9); border-radius:26px;
    box-shadow:0 16px 0 rgba(217,160,130,.35), 0 24px 40px rgba(217,160,130,.3), inset 0 2px 0 #fff;
  }
  .app { position:relative; display:flex; flex-direction:column; align-items:center; cursor:pointer;
    transform-origin:bottom center; will-change:transform; }
  .icon {
    width:52px; height:52px; border-radius:20px; display:flex; align-items:center; justify-content:center;
    font-size:28px; box-shadow:0 8px 0 rgba(0,0,0,.08), 0 12px 22px rgba(217,160,130,.4), inset 0 2px 0 rgba(255,255,255,.9);
    border:2px solid rgba(255,255,255,.9);
  }
  .dot-run {
    width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.85); margin-top:5px;
    box-shadow:0 0 6px rgba(255,255,255,.6);
  }
  .sep { width:1px; align-self:stretch; background:rgba(176,113,90,.25); margin:6px 2px; border-radius:1px; }
  footer { padding-bottom:26px; font-size:11px; color:#c4a091; }
  @media (max-width:480px){
    .dock{ gap:5px; padding:8px 10px; border-radius:18px; }
    .icon{ width:32px; height:32px; font-size:18px; border-radius:9px; }
    .sep{ margin:4px 1px; }
  }
  .tip{color:#5b3a2e}.app{transform-origin:bottom center}
</style>
</head>
<body>
  <header>
    <div class="tag">复刻自 21st.dev · Dock</div>
    <h1>黏土风程序坞<span class="dot">.</span></h1>
    <p>圆润厚重 + 柔和阴影，像捏出来的橡皮泥<br>图标按下去软软弹弹</p>
  </header>
  <div class="stage">
    <div class="dock-wrap">
      <div class="tip" id="tip">积木</div>
      <div class="dock" id="dock">
        <div class="app" data-label="积木"><div class="icon" style="background:linear-gradient(135deg,#fca5a5,#f87171)">🧱</div><div class="dot-run"></div></div>
        <div class="app" data-label="橡皮鸭"><div class="icon" style="background:linear-gradient(135deg,#fde047,#facc15)">🦆</div></div>
        <div class="app" data-label="棒棒糖"><div class="icon" style="background:linear-gradient(135deg,#f9a8d4,#ec4899)">🍭</div><div class="dot-run"></div></div>
        <div class="sep"></div>
        <div class="app" data-label="甜甜圈"><div class="icon" style="background:linear-gradient(135deg,#fdba74,#fb923c)">🍩</div></div>
        <div class="app" data-label="气球"><div class="icon" style="background:linear-gradient(135deg,#93c5fd,#3b82f6)">🎈</div><div class="dot-run"></div></div>
        <div class="app" data-label="玩具熊"><div class="icon" style="background:linear-gradient(135deg,#d6a77a,#b0715a)">🧸</div></div>
        <div class="sep"></div>
        <div class="app" data-label="积木车"><div class="icon" style="background:linear-gradient(135deg,#86efac,#22c55e)">🚗</div><div class="dot-run"></div></div>
        <div class="app" data-label="彩虹糖"><div class="icon" style="background:linear-gradient(135deg,#c4b5fd,#a78bfa)">🍬</div></div>
        <div class="app" data-label="小花"><div class="icon" style="background:linear-gradient(135deg,#fde68a,#f59e0b)">🌼</div><div class="dot-run"></div></div>
      </div>
    </div>
  </div>
  <footer>纯手写 CSS · 零框架 · 零外部依赖</footer>
<script>
(function(){
  var dock = document.getElementById('dock');
  var tip  = document.getElementById('tip');
  var apps = Array.prototype.slice.call(dock.querySelectorAll('.app'));
  var MAX = 1.8, SIGMA = 62;
  function gauss(d){ return Math.exp(-(d*d)/(2*SIGMA*SIGMA)); }
  function render(mx){
    apps.forEach(function(a){
      var r = a.getBoundingClientRect();
      var cx = r.left + r.width/2;
      var d = Math.abs(mx - cx);
      var s = 1 + (MAX-1) * gauss(d);
      var lift = (s-1) * 34;
      a.style.transform = 'scale(' + s.toFixed(3) + ') translateY(' + (-lift).toFixed(1) + 'px)';
    });
  }
  function reset(){
    apps.forEach(function(a){ a.style.transform = 'scale(1) translateY(0)'; });
    tip.classList.remove('show');
  }
  dock.addEventListener('mousemove', function(e){ render(e.clientX); });
  dock.addEventListener('mouseleave', reset);
  dock.addEventListener('touchmove', function(e){
    if(e.touches.length){ render(e.touches[0].clientX); }
  }, {passive:true});
  dock.addEventListener('touchend', reset);
  apps.forEach(function(a){
    a.addEventListener('mouseenter', function(){
      tip.textContent = a.getAttribute('data-label');
      tip.classList.add('show');
    });
  });
  function adapt(){
    if(apps.length > 1){
      var r0 = apps[0].getBoundingClientRect(), r1 = apps[1].getBoundingClientRect();
      SIGMA = Math.max(46, (r1.left - r0.left) * 0.85);
    }
  }
  window.addEventListener('resize', adapt); adapt();
})();
</script>
</body>
</html>
