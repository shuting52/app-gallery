<style>

  html,body { height:100%; }

    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;

    height:100vh; display:flex; flex-direction:column; overflow:hidden; user-select:none;
  }
  .status { height:30px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:0 18px; font-size:13px; font-weight:600; }
  .status .r { display:flex; align-items:center; gap:6px; font-size:12px; }
  .bat { width:24px; height:12px; border:1.5px solid currentColor; border-radius:4px; position:relative; display:inline-block; }
  .bat i { position:absolute; left:2px; top:2px; bottom:2px; width:70%; background:currentColor; border-radius:2px; }
  .bat:after { content:""; position:absolute; right:-4px; top:4px; width:2px; height:4px; background:currentColor; border-radius:1px; }
  .topbar { height:56px; flex:none; display:flex; align-items:center; gap:10px; padding:0 16px; }
  .appname { font-size:18px; font-weight:800; letter-spacing:.5px; color:#dcfce7; white-space:nowrap; }
  .search { flex:1; height:34px; border-radius:17px; background:rgba(74,222,128,.18); color:#86efac; font-size:13px; display:flex; align-items:center; padding:0 12px; gap:6px; }
  .avatar { width:34px; height:34px; flex:none; border-radius:50%; background:linear-gradient(135deg,#4ade80,#166534); color:#fff; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; }
  .content { flex:1; padding:14px 16px 8px; display:flex; flex-direction:column; gap:14px; overflow:hidden; }
  .hero { border-radius:20px; background:linear-gradient(135deg,#166534,#052e16); color:#dcfce7; padding:18px; }
  .hero .t { font-size:20px; font-weight:800; }
  .hero .s { margin-top:6px; font-size:12px; color:#86efac; line-height:1.6; }
  .bar { margin-top:14px; height:8px; border-radius:4px; background:rgba(74,222,128,.25); overflow:hidden; }
  .bar i { display:block; height:100%; width:61%; background:#4ade80; border-radius:4px; }
  .hero .p { margin-top:8px; font-size:11px; color:#86efac; }
  .sect { font-size:13px; font-weight:700; color:#dcfce7; }
  .list { display:flex; flex-direction:column; gap:10px; }
  .row { display:flex; align-items:center; gap:12px; background:rgba(74,222,128,.12); border:1px solid rgba(134,239,172,.25); border-radius:16px; padding:12px; }
  .chip { width:40px; height:40px; flex:none; border-radius:12px; background:rgba(74,222,128,.12); border:1px solid rgba(134,239,172,.25); display:flex; align-items:center; justify-content:center; font-size:20px; }
  .row .nm { font-size:14px; font-weight:700; }
  .row .ds { margin-top:2px; font-size:11px; color:#86efac; }
  .row .mid { flex:1; min-width:0; }
  .tag { font-size:11px; background:rgba(74,222,128,.20); color:#bbf7d0; border-radius:999px; padding:4px 9px; white-space:nowrap; }
  .dock-zone { flex:none; padding:0 12px 16px; display:flex; justify-content:center; }
  .dock-wrap { display:flex; flex-direction:column; align-items:center; }
  .tip { margin-bottom:12px; font-size:12px; color:#cfe0f7; background:rgba(20,28,46,.85); border:1px solid rgba(255,255,255,.14); border-radius:8px; padding:5px 12px; opacity:0; transform:translateY(6px); transition:opacity .18s, transform .18s; pointer-events:none; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  .tip.show { opacity:1; transform:translateY(0); }
  .dock { display:flex; align-items:flex-end; gap:10px; padding:14px 16px; max-width:calc(100vw - 24px); border:1px solid rgba(255,255,255,.35); border-radius:26px; box-shadow:0 18px 50px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.4); background:radial-gradient(60% 120% at 15% 0%,rgba(250,204,21,.30),transparent 60%),radial-gradient(60% 120% at 85% 100%,rgba(74,222,128,.35),transparent 60%),rgba(5,46,22,.55);backdrop-filter:blur(22px) saturate(1.8);-webkit-backdrop-filter:blur(22px) saturate(1.8); }
  .app { position:relative; display:flex; flex-direction:column; align-items:center; cursor:pointer; transform-origin:bottom center; will-change:transform; }
  .icon { width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:28px; box-shadow:0 6px 16px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.35); border:1px solid rgba(255,255,255,.2); }
  .dot-run { width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.85); margin-top:5px; box-shadow:0 0 6px rgba(255,255,255,.6); }
  .sep { width:1px; align-self:stretch; background:rgba(255,255,255,.25); margin:6px 2px; border-radius:1px; }
  @media (max-width:480px){
    .dock{ gap:5px; padding:8px 10px; border-radius:18px; }
    .icon{ width:32px; height:32px; font-size:18px; border-radius:9px; }
    .sep{ margin:4px 1px; }
  }
  
</style>
</head>
<body>
  <div class="status"><span>9:41</span><span class="r"><span>▂▄▆</span><span>📶</span><span class="bat"><i></i></span></span></div>
  <div class="topbar"><div class="appname">懒得找了</div><div class="search">🔍 搜索站点 / 粘贴链接解析</div><div class="avatar">找</div></div>
  <main class="content">
    <div class="hero"><div class="t">森林站点</div><div class="s">绿调自然 · 呼吸感排版</div><div class="bar"><i></i></div><div class="p">森林覆盖率 61%</div></div>
    <div class="sect">常用功能</div>
    <div class="list">
      <div class="row"><div class="chip">🔗</div><div class="mid"><div class="nm">链接解析</div><div class="ds">短视频去水印 · 粘贴即解析</div></div><span class="tag">已完成</span></div>
      <div class="row"><div class="chip">⭐</div><div class="mid"><div class="nm">收藏站点</div><div class="ds">2,320 个站点 · 19 个分类</div></div><span class="tag">已同步</span></div>
      <div class="row"><div class="chip">⬇️</div><div class="mid"><div class="nm">下载管理</div><div class="ds">3 个进行中 · 12 个已完成</div></div><span class="tag">进行中</span></div>
      <div class="row"><div class="chip">⏱️</div><div class="mid"><div class="nm">工时打卡</div><div class="ds">本周 32 小时 · 今日 6.5 小时</div></div><span class="tag">已打卡</span></div>
    </div>
  </main>
  <div class="dock-zone">
    <div class="dock-wrap">
      <div class="tip" id="tip">松树</div>
      <div class="dock" id="dock">
        <div class="app" data-label="松树"><div class="icon" style="background:linear-gradient(135deg,#4ade80,#16a34a)">🌲</div><div class="dot-run"></div></div>
        <div class="app" data-label="树叶"><div class="icon" style="background:linear-gradient(135deg,#86efac,#22c55e)">🍃</div></div>
        <div class="app" data-label="蘑菇"><div class="icon" style="background:linear-gradient(135deg,#fda4af,#f43f5e)">🍄</div><div class="dot-run"></div></div>
        <div class="sep"></div>
        <div class="app" data-label="小鹿"><div class="icon" style="background:linear-gradient(135deg,#d6a77a,#a16207)">🦌</div></div>
        <div class="app" data-label="小鸟"><div class="icon" style="background:linear-gradient(135deg,#7dd3fc,#0284c7)">🐦</div><div class="dot-run"></div></div>
        <div class="app" data-label="露营"><div class="icon" style="background:linear-gradient(135deg,#fdba74,#ea580c)">⛺</div></div>
        <div class="sep"></div>
        <div class="app" data-label="篝火"><div class="icon" style="background:linear-gradient(135deg,#fca5a5,#ef4444)">🔥</div><div class="dot-run"></div></div>
        <div class="app" data-label="高山"><div class="icon" style="background:linear-gradient(135deg,#94a3b8,#475569)">⛰️</div></div>
        <div class="app" data-label="野花"><div class="icon" style="background:linear-gradient(135deg,#fde047,#eab308)">🌼</div><div class="dot-run"></div></div>
            </div>
    </div>
  </div>
<script>
(function(){
  var dock = document.getElementById('dock');
  var tip  = document.getElementById('tip');
  var apps = Array.prototype.slice.call(dock.querySelectorAll('.app'));
  var MAX = 1.8, SIGMA = 62;
  function gauss(d){ return Math.exp(-(d*d)/(2*SIGMA*SIGMA)); }
  function render(mx){
    apps.forEach(function(a){
      var r = a.getBoundingClientRect();
      var cx = r.left + r.width/2;
      var d = Math.abs(mx - cx);
      var s = 1 + (MAX-1) * gauss(d);
      var lift = (s-1) * 34;
      a.style.transform = 'scale(' + s.toFixed(3) + ') translateY(' + (-lift).toFixed(1) + 'px)';
    });
  }
  function reset(){
    apps.forEach(function(a){ a.style.transform = 'scale(1) translateY(0)'; });
    tip.classList.remove('show');
  }
  dock.addEventListener('mousemove', function(e){ render(e.clientX); });
  dock.addEventListener('mouseleave', reset);
  dock.addEventListener('touchmove', function(e){
    if(e.touches.length){ render(e.touches[0].clientX); }
  }, {passive:true});
  dock.addEventListener('touchend', reset);
  apps.forEach(function(a){
    a.addEventListener('mouseenter', function(){
      tip.textContent = a.getAttribute('data-label');
      tip.classList.add('show');
    });
  });
  function adapt(){
    if(apps.length > 1){
      var r0 = apps[0].getBoundingClientRect(), r1 = apps[1].getBoundingClientRect();
      SIGMA = Math.max(46, (r1.left - r0.left) * 0.85);
    }
  }
  window.addEventListener('resize', adapt); adapt();
})();</script>
</body>
</html>
