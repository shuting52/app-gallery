<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>代码工坊 · 程序坞</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:radial-gradient(120% 90% at 50% 0%, #1a2f3a 0%, #0b1a22 55%, #050d12 100%); color:#e8eef7; height:100vh; display:flex; flex-direction:column;
    overflow:hidden; user-select:none;
  }
  .status { height:30px; flex:none; display:flex; justify-content:space-between; align-items:center; padding:0 18px; font-size:13px; font-weight:600; }
  .status .r { font-size:12px; letter-spacing:1px; }
  .topbar { flex:none; display:flex; justify-content:space-between; align-items:center; padding:8px 18px 12px; }
  .topbar h1 { font-size:20px; font-weight:800; letter-spacing:1px; }
  .topbar h1 i { font-style:normal; color:#38bdf8; }
  .topbar .tools { display:flex; gap:8px; align-items:center; }
  .search { font-size:12px; color:rgba(232,238,247,.75); background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:6px 12px; }
  .avatar { width:30px; height:30px; border-radius:50%; background:#38bdf8; display:flex; align-items:center; justify-content:center; font-size:16px; }
  .content { flex:1; overflow:hidden; padding:2px 16px 0; display:flex; flex-direction:column; gap:12px; }
  .hero { background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.16); border-radius:18px; padding:14px; display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
  .hero .hb { flex:1; display:flex; flex-direction:column; gap:3px; }
  .hero .hb b { font-size:15px; }
  .hero .hb span { font-size:11px; color:rgba(232,238,247,.6); }
  .hero .ht { width:100%; font-size:13px; line-height:1.6; color:rgba(232,238,247,.85); }
  .av { width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,.16); display:flex; align-items:center; justify-content:center; font-size:20px; flex:none; }
  .av.sm { width:30px; height:30px; font-size:16px; }
  .more { font-size:18px; color:rgba(232,238,247,.6); }
  .badge { font-size:11px; color:#38bdf8; border:1px solid #38bdf8; border-radius:999px; padding:3px 9px; }
  .phimg { width:100%; height:76px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; }
  .phimg.big { height:104px; }
  .acts { width:100%; display:flex; gap:16px; font-size:12px; color:rgba(232,238,247,.7); }
  .sec { font-size:14px; font-weight:700; padding-top:2px; }
  .row { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:10px 12px; display:flex; align-items:center; gap:10px; }
  .row .rb { flex:1; display:flex; flex-direction:column; gap:2px; min-width:0; }
  .row .rb b { font-size:13px; }
  .row .rb span { font-size:11px; color:rgba(232,238,247,.6); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tm { font-size:11px; color:rgba(232,238,247,.55); flex:none; }
  .tag { font-size:11px; color:#38bdf8; border:1px solid rgba(255,255,255,.25); border-radius:8px; padding:3px 7px; flex:none; }
  .score { font-size:14px; font-weight:800; color:#38bdf8; flex:none; }
  .price { font-size:14px; font-weight:800; color:#38bdf8; flex:none; }
  .num { font-size:14px; font-weight:800; color:#38bdf8; width:18px; text-align:center; flex:none; }
  .gicon { width:40px; height:40px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:20px; flex:none; box-shadow:0 4px 10px rgba(0,0,0,.3); }
  .gicon.sm { width:32px; height:32px; font-size:16px; border-radius:9px; }
  .gicon.lg { width:48px; height:48px; font-size:24px; border-radius:13px; }
  .play { width:38px; height:38px; border-radius:50%; background:#38bdf8; color:#0b1020; display:flex; align-items:center; justify-content:center; font-size:16px; flex:none; }
  .bar { width:100%; height:5px; border-radius:99px; background:rgba(255,255,255,.15); overflow:hidden; }
  .bar i { display:block; height:100%; background:#38bdf8; border-radius:99px; }
  .pbar { width:64px; height:5px; border-radius:99px; background:rgba(255,255,255,.15); overflow:hidden; flex:none; }
  .pbar i { display:block; height:100%; background:#38bdf8; border-radius:99px; }
  .code { width:100%; font-size:11px; font-family:monospace; background:rgba(0,0,0,.3); border-radius:9px; padding:8px 10px; color:#a5f3fc; overflow:hidden; white-space:nowrap; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .cell { height:76px; border-radius:13px; display:flex; align-items:flex-end; padding:8px; font-size:12px; font-weight:700; box-shadow:0 4px 12px rgba(0,0,0,.3); }
  .dockbar { flex:none; display:flex; flex-direction:column; align-items:center; padding:6px 0 16px; }
  .tip {
    margin-bottom:10px; font-size:12px; color:#cfe0f7; background:rgba(20,28,46,.85);
    border:1px solid rgba(255,255,255,.14); border-radius:8px; padding:5px 12px;
    opacity:0; transform:translateY(6px); transition:opacity .18s, transform .18s; pointer-events:none;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .tip.show { opacity:1; transform:translateY(0); }
  .dock { display:flex; align-items:flex-end; gap:10px; padding:14px 16px;
    max-width:calc(100vw - 24px); border-radius:26px;
    background:linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,255,255,.02) 50%), rgba(8,16,26,.55);
    -webkit-backdrop-filter:blur(28px) saturate(1.4); backdrop-filter:blur(28px) saturate(1.4);
    border:1px solid rgba(255,255,255,.18);
    box-shadow:0 16px 44px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.25); }
  .app { position:relative; display:flex; flex-direction:column; align-items:center; cursor:pointer;
    transform-origin:bottom center; will-change:transform; }
  .icon {
    width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center;
    font-size:28px; box-shadow:0 6px 16px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.35);
    border:1px solid rgba(255,255,255,.2);
  }
  .dot-run {
    width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.85); margin-top:5px;
    box-shadow:0 0 6px rgba(255,255,255,.6);
  }
  .sep { width:1px; align-self:stretch; background:rgba(255,255,255,.25); margin:6px 2px; border-radius:1px; }
  @media (max-width:480px){
    .dock{ gap:5px; padding:8px 10px; border-radius:18px; }
    .icon{ width:32px; height:32px; font-size:18px; border-radius:9px; }
    .sep{ margin:4px 1px; }
  }
</style>
</head>
<body>
  <div class="status"><span>9:41</span><span class="r">📶 5G&nbsp;&nbsp;🔋 100%</span></div>
  <div class="topbar"><h1>代码工坊<i>.</i></h1><div class="tools"><span class="search">🔍 搜索</span><div class="avatar">😀</div></div></div>
  <div class="content">
  <div class="hero"><div class="hb"><b>去水印解析引擎</b><span>主项目 · 本周提交 24 次</span></div><div class="badge">进行中</div>
    <div class="code">{"status": "ok", "解析": "完成", "耗时": "1.2s"}</div>
    <div class="acts"><span>⭐ 1.2k</span><span>⑂ 86</span><span>● Python</span></div></div>
  <div class="sec">我的项目</div>
  <div class="row"><div class="rb"><b>站点导航聚合</b><span>2000+ 站点分类索引 · 更新于今天</span></div><span class="tag">TS</span></div>
  <div class="row"><div class="rb"><b>下载管理器</b><span>断点续传 + 多线程队列</span></div><span class="tag">Kotlin</span></div>
  <div class="row"><div class="rb"><b>工时打卡统计</b><span>周报自动生成 · 已上线</span></div><span class="tag">Go</span></div>
  <div class="row"><div class="rb"><b>图标素材库</b><span>500+ 液态玻璃图标组件</span></div><span class="tag">CSS</span></div>
  </div>
  <div class="dockbar">
    <div class="tip" id="tip">编辑器</div>
    <div class="dock" id="dock">
        <div class="app" data-label="编辑器"><div class="icon" style="background:linear-gradient(135deg,#38bdf8,#2563eb)">💻</div><div class="dot-run"></div></div>
        <div class="app" data-label="终端"><div class="icon" style="background:linear-gradient(135deg,#4b5563,#111827)">⌨️</div><div class="dot-run"></div></div>
        <div class="app" data-label="Git"><div class="icon" style="background:linear-gradient(135deg,#fb923c,#c2410c)">🌿</div><div class="dot-run"></div></div>
        <div class="app" data-label="容器"><div class="icon" style="background:linear-gradient(135deg,#67e8f9,#0284c7)">🐳</div></div>
        <div class="sep"></div>
        <div class="app" data-label="接口测试"><div class="icon" style="background:linear-gradient(135deg,#fdba74,#ea580c)">🚀</div></div>
        <div class="app" data-label="数据库"><div class="icon" style="background:linear-gradient(135deg,#93c5fd,#1e40af)">🗄️</div></div>
        <div class="app" data-label="虚拟机"><div class="icon" style="background:linear-gradient(135deg,#c4b5fd,#7c3aed)">🧊</div></div>
        <div class="app" data-label="包管理"><div class="icon" style="background:linear-gradient(135deg,#fde68a,#d97706)">📦</div></div>
        <div class="sep"></div>
        <div class="app" data-label="CI 流水线"><div class="icon" style="background:linear-gradient(135deg,#9ca3af,#374151)">⚙️</div><div class="dot-run"></div></div>
        <div class="app" data-label="服务器"><div class="icon" style="background:linear-gradient(135deg,#6ee7b7,#059669)">🖥️</div><div class="dot-run"></div></div>
        <div class="app" data-label="日志"><div class="icon" style="background:linear-gradient(135deg,#fda4af,#be123c)">📜</div></div>
      </div>
  </div>
<script>
(function(){
  var dock = document.getElementById('dock');
  var tip  = document.getElementById('tip');
  var apps = Array.prototype.slice.call(dock.querySelectorAll('.app'));
  var MAX = 1.8, SIGMA = 62;
  function gauss(d){ return Math.exp(-(d*d)/(2*SIGMA*SIGMA)); }
  function render(mx){
    apps.forEach(function(a){
      var r = a.getBoundingClientRect();
      var cx = r.left + r.width/2;
      var d = Math.abs(mx - cx);
      var s = 1 + (MAX-1) * gauss(d);
      var lift = (s-1) * 34;
      a.style.transform = 'scale(' + s.toFixed(3) + ') translateY(' + (-lift).toFixed(1) + 'px)';
    });
  }
  function reset(){
    apps.forEach(function(a){ a.style.transform = 'scale(1) translateY(0)'; });
    tip.classList.remove('show');
  }
  dock.addEventListener('mousemove', function(e){ render(e.clientX); });
  dock.addEventListener('mouseleave', reset);
  dock.addEventListener('touchmove', function(e){
    if(e.touches.length){ render(e.touches[0].clientX); }
  }, {passive:true});
  dock.addEventListener('touchend', reset);
  apps.forEach(function(a){
    a.addEventListener('mouseenter', function(){
      tip.textContent = a.getAttribute('data-label');
      tip.classList.add('show');
    });
  });
  function adapt(){
    if(apps.length > 1){
      var r0 = apps[0].getBoundingClientRect(), r1 = apps[1].getBoundingClientRect();
      SIGMA = Math.max(46, (r1.left - r0.left) * 0.85);
    }
  }
  window.addEventListener('resize', adapt); adapt();
})();
</script>
</body>
</html>
