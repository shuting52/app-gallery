<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>懒得找了 · 弹跳反馈程序坞</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
background:radial-gradient(120% 90% at 50% 0%,#1c2a44 0%,#0b1220 55%,#060a14 100%);
color:#e8eef7;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;user-select:none}
.status{height:30px;flex:0 0 30px;display:flex;align-items:center;justify-content:space-between;
padding:0 18px;font-size:13px;font-weight:600;color:#e8eef7}
.status .r{display:flex;align-items:center;gap:6px;font-size:12px}
.status .bat{width:24px;height:12px;border:1.5px solid rgba(255,255,255,.7);border-radius:3px;position:relative}
.status .bat::after{content:"";position:absolute;left:2px;top:2px;bottom:2px;width:14px;border-radius:1px;background:#7dd87d}
.topbar{flex:0 0 56px;display:flex;align-items:center;gap:10px;padding:0 16px}
.topbar .logo{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;
font-size:19px;background:linear-gradient(135deg,#5aa9ff,#1257c9);box-shadow:0 4px 12px rgba(18,87,201,.5)}
.topbar .name{font-size:17px;font-weight:800;letter-spacing:1px}
.topbar .search{flex:1;height:34px;border-radius:999px;display:flex;align-items:center;gap:6px;padding:0 14px;
font-size:12px;color:#9fb3d1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.topbar .avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
font-size:14px;font-weight:700;background:linear-gradient(135deg,#fda4af,#e11d48);flex:0 0 32px}
.content{flex:1;overflow:hidden;padding:14px 16px 16px}
.hero{border-radius:18px;padding:16px;background:linear-gradient(135deg,rgba(90,169,255,.28),rgba(139,92,246,.22));
border:1px solid rgba(255,255,255,.16)}
.hero h2{font-size:16px;font-weight:800}
.hero p{font-size:12px;color:#b9c8e2;margin-top:5px;line-height:1.6}
.hero .input{margin-top:12px;height:38px;border-radius:11px;display:flex;align-items:center;padding:0 12px;
font-size:12px;color:#8fa3c2;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.14)}
.hero .btn{margin-top:10px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
font-size:14px;font-weight:700;background:linear-gradient(135deg,#5aa9ff,#1257c9);cursor:pointer}
.sec{font-size:13px;font-weight:700;margin:16px 2px 10px;color:#cfe0f7}
.row{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:14px;margin-bottom:9px;
background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)}
.row .th{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;
font-size:20px;flex:0 0 40px}
.row .t1{font-size:13px;font-weight:700}
.row .t2{font-size:11px;color:#8fa3c2;margin-top:3px}
.row .rm{margin-left:auto;font-size:11px;color:#5aa9ff;flex:0 0 auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:14px;padding:13px 12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)}
.tile .e{font-size:22px}
.tile .t1{font-size:13px;font-weight:700;margin-top:7px}
.tile .t2{font-size:11px;color:#8fa3c2;margin-top:3px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:11px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#cfe0f7}
.tip{margin-bottom:14px;font-size:12px;color:#cfe0f7;background:rgba(20,28,46,.85);
border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:5px 12px;
opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s;pointer-events:none;
backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tip.show{opacity:1;transform:translateY(0)}
.dock{display:flex;align-items:flex-end;gap:10px;padding:14px 16px;max-width:calc(100vw - 24px);
background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);
border:1px solid rgba(255,255,255,.22);border-radius:26px;
box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.25)}
.app{position:relative;display:flex;flex-direction:column;align-items:center;cursor:pointer;
transform-origin:bottom center;will-change:transform}
.icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;
font-size:28px;box-shadow:0 6px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35);
border:1px solid rgba(255,255,255,.2)}
.dot-run{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.85);margin-top:5px;
box-shadow:0 0 6px rgba(255,255,255,.6)}
.sep{width:1px;align-self:stretch;background:rgba(255,255,255,.25);margin:6px 2px;border-radius:1px}
@media (max-width:480px){
.dock{gap:5px;padding:8px 10px;border-radius:18px}
.icon{width:32px;height:32px;font-size:18px;border-radius:9px}
.sep{margin:4px 1px}
}

.icon{ position:relative; overflow:hidden; }
  .icon.bounce{ animation:bk .55s cubic-bezier(.28,.84,.42,1); }
  @keyframes bk{ 0%{ transform:scale(1); } 30%{ transform:scale(1.25) translateY(-10px); } 55%{ transform:scale(.92); } 75%{ transform:scale(1.08); } 100%{ transform:scale(1); } }
  .ripple{ position:absolute; left:50%; top:50%; width:10px; height:10px; margin:-5px 0 0 -5px;
    border-radius:50%; background:rgba(255,255,255,.7); animation:rip .6s ease-out forwards; pointer-events:none; }
  @keyframes rip{ to{ transform:scale(9); opacity:0; } }

.dock-wrap{position:fixed;left:0;right:0;bottom:16px;display:flex;justify-content:center;z-index:20}
.fb{position:relative;overflow:hidden;cursor:pointer}
.fb:active{transform:scale(.97)}
.fb.bounce{animation:bk .55s cubic-bezier(.28,.84,.42,1)}
.content{padding-bottom:125px}
.dock{background:linear-gradient(135deg,rgba(255,255,255,.30),rgba(255,255,255,0) 45%),rgba(248,250,252,.38);
-webkit-backdrop-filter:blur(30px) saturate(1.5);backdrop-filter:blur(30px) saturate(1.5);
border:1px solid rgba(255,255,255,.35);box-shadow:0 16px 40px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.4)}
</style>
</head>
<body>
<div class="status"><span>9:41</span><span class="r">▂▄▆ 5G<span class="bat"></span></span></div>

<div class="topbar"><div class="logo">🔍</div><div class="name">懒得找了</div><div class="search">🔍&nbsp;搜索站点 / 粘贴链接</div><div class="avatar">懒</div></div>
<div class="content">
<div class="hero"><h2>粘贴链接，一键解析</h2><p>支持短视频去水印下载，解析后保存到本地相册</p>
<div class="input">🔗&nbsp;v.douyin.com/…&nbsp;粘贴视频链接</div><div class="btn">开始解析</div></div><div class="sec">点按试试</div><div class="row fb" id="fbcard"><div class="th" style="background:linear-gradient(135deg,#fda4af,#e11d48)">❤️</div><div><div class="t1">点我试试弹跳反馈</div><div class="t2">和底栏图标一样的弹跳 + 波纹</div></div><div class="rm" id="fbcount">0 次</div></div><div class="sec">下载任务</div><div class="row"><div class="th" style="background:linear-gradient(135deg,#7db4ff,#2f6fe4)">⬇️</div><div><div class="t1">烟花大会实拍</div><div class="t2">1080P · 47MB</div></div><div class="rm">已完成</div></div><div class="row"><div class="th" style="background:linear-gradient(135deg,#fef08a,#eab308)">⬇️</div><div><div class="t1">气球派对</div><div class="t2">720P · 18MB</div></div><div class="rm">63%</div></div>
</div>
<div class="dock-wrap">
      <div class="tip" id="tip"></div>
      <div class="dock" id="dock">
        <div class="app" data-label="喜欢"><div class="icon" style="background:linear-gradient(135deg,#7db4ff,#2f6fe4)">❤️</div><div class="dot-run"></div></div>
        <div class="app" data-label="点赞"><div class="icon" style="background:linear-gradient(135deg,#5eead4,#0ea5e9)">👍</div></div>
        <div class="app" data-label="庆祝"><div class="icon" style="background:linear-gradient(135deg,#a5b4fc,#6366f1)">🎉</div></div>
        <div class="app" data-label="热门"><div class="icon" style="background:linear-gradient(135deg,#fda4af,#e11d48)">🔥</div><div class="dot-run"></div></div>
        <div class="sep"></div>
        <div class="app" data-label="钻石"><div class="icon" style="background:linear-gradient(135deg,#c4b5fd,#8b5cf6)">💎</div></div>
        <div class="app" data-label="火箭"><div class="icon" style="background:linear-gradient(135deg,#fef08a,#eab308)">🚀</div><div class="dot-run"></div></div>
        <div class="app" data-label="目标"><div class="icon" style="background:linear-gradient(135deg,#4b5563,#111827)">🎯</div></div>
        <div class="app" data-label="奖杯"><div class="icon" style="background:linear-gradient(135deg,#9ca3af,#374151)">🏆</div></div>
        <div class="app" data-label="调色"><div class="icon" style="background:linear-gradient(135deg,#e2e8f0,#94a3b8)">🎨</div><div class="dot-run"></div></div>
      </div>
    </div>
<script>
(function(){

  var dock = document.getElementById('dock');
  var tip  = document.getElementById('tip');
  var apps = Array.prototype.slice.call(dock.querySelectorAll('.app'));
  var MAX = 1.8, SIGMA = 62;
  function gauss(d){ return Math.exp(-(d*d)/(2*SIGMA*SIGMA)); }
  function reset(){
    apps.forEach(function(a){ a.style.transform = ''; });
    tip.classList.remove('show');
  }
  apps.forEach(function(a){
    a.addEventListener('mouseenter', function(){
      tip.textContent = a.getAttribute('data-label');
      tip.classList.add('show');
    });
  });

  function render(mx){
    apps.forEach(function(a){
      var r = a.getBoundingClientRect();
      var cx = r.left + r.width/2;
      var d = Math.abs(mx - cx);
      var s = 1 + (MAX-1) * gauss(d);
      var lift = (s-1) * 34;
      a.style.transform = 'scale(' + s.toFixed(3) + ') translateY(' + (-lift).toFixed(1) + 'px)';
    });
  }
  dock.addEventListener('mousemove', function(e){ render(e.clientX); });
  dock.addEventListener('mouseleave', reset);
  dock.addEventListener('touchmove', function(e){
    if(e.touches.length){ render(e.touches[0].clientX); }
  }, {passive:true});
  dock.addEventListener('touchend', reset);
  function adapt(){
    if(apps.length > 1){
      var r0 = apps[0].getBoundingClientRect(), r1 = apps[1].getBoundingClientRect();
      SIGMA = Math.max(46, (r1.left - r0.left) * 0.85);
    }
  }
  window.addEventListener('resize', adapt); adapt();

  apps.forEach(function(a){
    a.addEventListener('click', function(){
      var ic = a.querySelector('.icon');
      ic.classList.remove('bounce'); void ic.offsetWidth; ic.classList.add('bounce');
      var rip = document.createElement('span');
      rip.className = 'ripple';
      a.appendChild(rip);
      setTimeout(function(){ rip.remove(); }, 600);
    });
  });

})();
</script>
<script>(function(){
var card=document.getElementById('fbcard'),n=0,cnt=document.getElementById('fbcount');
card.addEventListener('click',function(){
card.classList.remove('bounce');void card.offsetWidth;card.classList.add('bounce');
var rip=document.createElement('span');rip.className='ripple';card.appendChild(rip);
setTimeout(function(){rip.remove();},600);
n++;cnt.textContent=n+' 次';
});
})();</script>
</body>
</html>
