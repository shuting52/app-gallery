<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dock · 复刻自 21st.dev</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:radial-gradient(120% 90% at 50% 0%, #0e7490 0%, #155e75 40%, #082f49 100%);
    color:#e0f2fe; min-height:100vh; display:flex; flex-direction:column; align-items:center;
    overflow:hidden; user-select:none;
  }
  header { margin-top:64px; text-align:center; padding:0 24px; }
  header .tag {
    display:inline-block; font-size:12px; color:#7dd3fc; border:1px solid rgba(125,211,252,.4);
    border-radius:999px; padding:4px 12px; margin-bottom:14px; letter-spacing:.5px;
    background:rgba(255,255,255,.04);
  }
  header h1 { font-size:30px; font-weight:800; letter-spacing:2px; }
  header h1 .dot { color:#5aa9ff; }
  header p { margin-top:10px; font-size:13px; color:#7dd3fc; line-height:1.7; opacity:.85; }
  .stage { flex:1; width:100%; display:flex; align-items:flex-end; justify-content:center; padding-bottom:48px; }
  .dock-wrap { display:flex; flex-direction:column; align-items:center; }
  .tip {
    margin-bottom:14px; font-size:12px; color:#cfe0f7; background:rgba(8,47,73,.9);
    border:1px solid rgba(255,255,255,.14); border-radius:8px; padding:5px 12px;
    opacity:0; transform:translateY(6px); transition:opacity .18s, transform .18s; pointer-events:none;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .tip.show { opacity:1; transform:translateY(0); }
  .dock {
    display:flex; align-items:flex-end; gap:10px; padding:14px 16px;
    max-width:calc(100vw - 24px);
    background:rgba(8,47,73,.5);
    -webkit-backdrop-filter:blur(22px) saturate(1.6); backdrop-filter:blur(22px) saturate(1.6);
    border:1px solid rgba(125,211,252,.35); border-radius:26px;
    box-shadow:0 18px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.2);
  }
  .app { position:relative; display:flex; flex-direction:column; align-items:center; cursor:pointer;
    transform-origin:bottom center; will-change:transform; }
  .icon {
    width:52px; height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center;
    font-size:28px; box-shadow:0 6px 16px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.3);
    border:1px solid rgba(125,211,252,.4);
  }
  .dot-run {
    width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.85); margin-top:5px;
    box-shadow:0 0 6px rgba(255,255,255,.6);
  }
  .sep { width:1px; align-self:stretch; background:rgba(125,211,252,.3); margin:6px 2px; border-radius:1px; }
  footer { padding-bottom:26px; font-size:11px; color:#0369a1; }
  @media (max-width:480px){
    .dock{ gap:5px; padding:8px 10px; border-radius:18px; }
    .icon{ width:32px; height:32px; font-size:18px; border-radius:9px; }
    .sep{ margin:4px 1px; }
  }
  
</style>
</head>
<body>
  <header>
    <div class="tag">复刻自 21st.dev · Dock</div>
    <h1>深海蓝程序坞<span class="dot">.</span></h1>
    <p>从浅滩一路沉到深海，蓝得安静<br>图标像漂浮的海洋生物</p>
  </header>
  <div class="stage">
    <div class="dock-wrap">
      <div class="tip" id="tip">海浪</div>
      <div class="dock" id="dock">
        <div class="app" data-label="海浪"><div class="icon" style="background:linear-gradient(135deg,#38bdf8,#0284c7)">🌊</div><div class="dot-run"></div></div>
        <div class="app" data-label="鲸鱼"><div class="icon" style="background:linear-gradient(135deg,#7dd3fc,#0369a1)">🐋</div></div>
        <div class="app" data-label="海豚"><div class="icon" style="background:linear-gradient(135deg,#93c5fd,#3b82f6)">🐬</div><div class="dot-run"></div></div>
        <div class="sep"></div>
        <div class="app" data-label="珊瑚"><div class="icon" style="background:linear-gradient(135deg,#fda4af,#fb7185)">🪸</div></div>
        <div class="app" data-label="贝壳"><div class="icon" style="background:linear-gradient(135deg,#fbcfe8,#f9a8d4)">🐚</div><div class="dot-run"></div></div>
        <div class="app" data-label="章鱼"><div class="icon" style="background:linear-gradient(135deg,#c4b5fd,#8b5cf6)">🐙</div></div>
        <div class="sep"></div>
        <div class="app" data-label="鲨鱼"><div class="icon" style="background:linear-gradient(135deg,#94a3b8,#475569)">🦈</div><div class="dot-run"></div></div>
        <div class="app" data-label="小丑鱼"><div class="icon" style="background:linear-gradient(135deg,#fdba74,#f97316)">🐠</div></div>
        <div class="app" data-label="水母"><div class="icon" style="background:linear-gradient(135deg,#a5f3fc,#22d3ee)">🪼</div><div class="dot-run"></div></div>
      </div>
    </div>
  </div>
  <footer>纯手写 CSS · 零框架 · 零外部依赖</footer>
<script>
(function(){
  var dock = document.getElementById('dock');
  var tip  = document.getElementById('tip');
  var apps = Array.prototype.slice.call(dock.querySelectorAll('.app'));
  var MAX = 1.8, SIGMA = 62;
  function gauss(d){ return Math.exp(-(d*d)/(2*SIGMA*SIGMA)); }
  function render(mx){
    apps.forEach(function(a){
      var r = a.getBoundingClientRect();
      var cx = r.left + r.width/2;
      var d = Math.abs(mx - cx);
      var s = 1 + (MAX-1) * gauss(d);
      var lift = (s-1) * 34;
      a.style.transform = 'scale(' + s.toFixed(3) + ') translateY(' + (-lift).toFixed(1) + 'px)';
    });
  }
  function reset(){
    apps.forEach(function(a){ a.style.transform = 'scale(1) translateY(0)'; });
    tip.classList.remove('show');
  }
  dock.addEventListener('mousemove', function(e){ render(e.clientX); });
  dock.addEventListener('mouseleave', reset);
  dock.addEventListener('touchmove', function(e){
    if(e.touches.length){ render(e.touches[0].clientX); }
  }, {passive:true});
  dock.addEventListener('touchend', reset);
  apps.forEach(function(a){
    a.addEventListener('mouseenter', function(){
      tip.textContent = a.getAttribute('data-label');
      tip.classList.add('show');
    });
  });
  function adapt(){
    if(apps.length > 1){
      var r0 = apps[0].getBoundingClientRect(), r1 = apps[1].getBoundingClientRect();
      SIGMA = Math.max(46, (r1.left - r0.left) * 0.85);
    }
  }
  window.addEventListener('resize', adapt); adapt();
})();
</script>
</body>
</html>
