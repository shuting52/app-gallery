<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dock · 复刻自 21st.dev</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:radial-gradient(120% 90% at 50% 0%, #1c2a44 0%, #0b1220 55%, #060a14 100%);
    color:#e8eef7; min-height:100vh; display:flex; flex-direction:column; align-items:center;
    overflow:hidden; user-select:none;
  }
  header { margin-top:56px; text-align:center; padding:0 24px; }
  header .tag {
    display:inline-block; font-size:12px; color:#9fb3d1; border:1px solid rgba(159,179,209,.28);
    border-radius:999px; padding:4px 12px; margin-bottom:14px; letter-spacing:.5px;
    background:rgba(255,255,255,.04);
  }
  header h1 { font-size:30px; font-weight:800; letter-spacing:2px; }
  header h1 .dot { color:#5aa9ff; }
  header p { margin-top:10px; font-size:13px; color:#8fa3c2; line-height:1.7; }
  .stage { flex:1; width:100%; display:flex; align-items:flex-end; justify-content:center; padding-bottom:48px; }
  .dock-wrap { display:flex; flex-direction:column; align-items:center; }
  .tip {
    margin-bottom:14px; font-size:12px; color:#cfe0f7; background:rgba(20,28,46,.85);
    border:1px solid rgba(255,255,255,.14); border-radius:8px; padding:5px 12px;
    opacity:0; transform:translateY(6px); transition:opacity .18s, transform .18s; pointer-events:none;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .tip.show { opacity:1; transform:translateY(0); }
  .dock {
    display:flex; align-items:flex-end; gap:10px; padding:14px 16px;
    max-width:calc(100vw - 24px);
    background:rgba(255,255,255,.12);
    -webkit-backdrop-filter:blur(22px) saturate(1.6); backdrop-filter:blur(22px) saturate(1.6);
    border:1px solid rgba(255,255,255,.22); border-radius:26px;
    box-shadow:0 18px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .app { position:relative; display:flex; flex-direction:column; align-items:center; cursor:pointer;
    transform-origin:bottom center; will-change:transform; }
  .icon {
    width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center;
    font-size:28px; box-shadow:0 6px 16px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.35);
    border:1px solid rgba(255,255,255,.2);
  }
  .dot-run {
    width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.85); margin-top:5px;
    box-shadow:0 0 6px rgba(255,255,255,.6);
  }
  .sep { width:1px; align-self:stretch; background:rgba(255,255,255,.25); margin:6px 2px; border-radius:1px; }
  footer { padding-bottom:26px; font-size:11px; color:#5b6c88; }
  @media (max-width:480px){
    .dock{ gap:5px; padding:8px 10px; border-radius:18px; }
    .icon{ width:32px; height:32px; font-size:18px; border-radius:9px; }
    .sep{ margin:4px 1px; }
  }
.stage{ align-items:center; justify-content:center; padding-bottom:0; }
  #ring{ position:relative; width:340px; height:340px; }
  #ring::before{ content:""; position:absolute; inset:0; border-radius:50%;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.16);
    box-shadow:0 18px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.2); }
  .ring-app{ position:absolute; left:50%; top:50%; margin:-26px 0 0 -26px; }
  .ring-app .icon{ width:52px; height:52px; }
  @media (max-width:480px){
    #ring{ width:300px; height:300px; }
    .ring-app{ margin:-21px 0 0 -21px; }
    .ring-app .icon{ width:42px; height:42px; font-size:22px; }
  }
</style>
</head>
<body>
  <header>
    <div class="tag">复刻自 21st.dev · Dock</div>
    <h1>环形程序坞<span class="dot">.</span></h1>
    <p>8 个图标围成一圈，鼠标靠近谁谁就鼓起来<br>（触屏在圆环内拖动同样有效）</p>
  </header>
  <div class="stage">
    <div class="dock-wrap">
      <div class="tip" id="tip"></div>
      <div id="ring">
        <div class="app ring-app" data-label="太阳" style="transform:rotate(0deg) translate(128px) rotate(-0deg)"><div class="icon" style="background:linear-gradient(135deg,#7db4ff,#2f6fe4)">🌞</div></div>
        <div class="app ring-app" data-label="月亮" style="transform:rotate(45deg) translate(128px) rotate(-45deg)"><div class="icon" style="background:linear-gradient(135deg,#5eead4,#0ea5e9)">🌙</div></div>
        <div class="app ring-app" data-label="星星" style="transform:rotate(90deg) translate(128px) rotate(-90deg)"><div class="icon" style="background:linear-gradient(135deg,#a5b4fc,#6366f1)">⭐</div></div>
        <div class="app ring-app" data-label="地球" style="transform:rotate(135deg) translate(128px) rotate(-135deg)"><div class="icon" style="background:linear-gradient(135deg,#fda4af,#e11d48)">🌍</div></div>
        <div class="app ring-app" data-label="火焰" style="transform:rotate(180deg) translate(128px) rotate(-180deg)"><div class="icon" style="background:linear-gradient(135deg,#fde68a,#f59e0b)">🔥</div></div>
        <div class="app ring-app" data-label="水滴" style="transform:rotate(225deg) translate(128px) rotate(-225deg)"><div class="icon" style="background:linear-gradient(135deg,#c4b5fd,#8b5cf6)">💧</div></div>
        <div class="app ring-app" data-label="叶子" style="transform:rotate(270deg) translate(128px) rotate(-270deg)"><div class="icon" style="background:linear-gradient(135deg,#fef08a,#eab308)">🍃</div></div>
        <div class="app ring-app" data-label="闪电" style="transform:rotate(315deg) translate(128px) rotate(-315deg)"><div class="icon" style="background:linear-gradient(135deg,#4b5563,#111827)">⚡</div></div>
      </div>
    </div>
  </div>
  <footer>纯手写 CSS · 零框架 · 零外部依赖</footer>
<script>
(function(){

  var dock = document.getElementById('dock');
  var tip  = document.getElementById('tip');
  var apps = Array.prototype.slice.call(dock.querySelectorAll('.app'));
  var MAX = 1.8, SIGMA = 62;
  function gauss(d){ return Math.exp(-(d*d)/(2*SIGMA*SIGMA)); }
  function reset(){
    apps.forEach(function(a){ a.style.transform = ''; });
    tip.classList.remove('show');
  }
  apps.forEach(function(a){
    a.addEventListener('mouseenter', function(){
      tip.textContent = a.getAttribute('data-label');
      tip.classList.add('show');
    });
  });

  apps.forEach(function(a){ a.dataset.base = a.style.transform || ''; });
  var ring = document.getElementById('ring');
  function render(mx, my){
    apps.forEach(function(a){
      var r = a.getBoundingClientRect();
      var cx = r.left + r.width/2, cy = r.top + r.height/2;
      var d = Math.sqrt((mx-cx)*(mx-cx) + (my-cy)*(my-cy));
      var s = 1 + (MAX-1) * gauss(d);
      a.style.transform = a.dataset.base + ' scale(' + s.toFixed(3) + ')';
    });
  }
  ring.addEventListener('mousemove', function(e){ render(e.clientX, e.clientY); });
  ring.addEventListener('mouseleave', function(){
    apps.forEach(function(a){ a.style.transform = a.dataset.base; });
    tip.classList.remove('show');
  });
  ring.addEventListener('touchmove', function(e){
    if(e.touches.length){ render(e.touches[0].clientX, e.touches[0].clientY); }
  }, {passive:true});
  ring.addEventListener('touchend', function(){
    apps.forEach(function(a){ a.style.transform = a.dataset.base; });
  });

})();
</script>
</body>
</html>
