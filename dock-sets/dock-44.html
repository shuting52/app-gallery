<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>懒得找了 · 镜面倒影底栏</title>
<style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:radial-gradient(120% 90% at 50% 0%, #12283a 0%, #0a1622 55%, #050d16 100%);color:#e8eef7;min-height:100vh;display:flex;flex-direction:column;overflow:hidden;user-select:none}
.status{display:flex;justify-content:space-between;align-items:center;height:30px;padding:0 18px;font-size:13px;font-weight:600;flex:none}
.status .right{display:flex;align-items:center;gap:6px}
.sig{display:flex;align-items:flex-end;gap:2px}.sig i{display:block;width:3px;background:#fff;border-radius:1px}.sig i:nth-child(1){height:5px}.sig i:nth-child(2){height:8px}.sig i:nth-child(3){height:11px}.sig i:nth-child(4){height:14px}
.bat{width:24px;height:12px;border:1.5px solid rgba(255,255,255,.8);border-radius:3px;position:relative}.bat:after{content:"";position:absolute;left:2px;top:2px;bottom:2px;width:70%;background:#4ade80;border-radius:1px}.bat:before{content:"";position:absolute;right:-4px;top:4px;width:2px;height:4px;background:rgba(255,255,255,.8);border-radius:1px}
.topbar{display:flex;align-items:center;gap:10px;padding:8px 16px 12px;flex:none}
.topbar .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#38bdf8,#0284c7);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.35);flex:none}
.topbar h1{font-size:19px;font-weight:800;letter-spacing:1px}
.topbar .search{flex:1;height:34px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;padding:0 12px;font-size:12px;color:rgba(232,238,247,.75);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.topbar .ava{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.content{flex:1;padding:4px 16px 8px;overflow:hidden}
.hero{border-radius:20px;padding:18px;background:linear-gradient(135deg,#38bdf833,rgba(255,255,255,.10) 60%);border:1px solid rgba(255,255,255,.22);box-shadow:0 10px 30px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.25);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.hero .k{font-size:12px;color:rgba(232,238,247,.8);letter-spacing:1px}
.hero h2{font-size:22px;margin:6px 0 4px}
.hero p{font-size:12px;color:rgba(232,238,247,.75)}
.bar{height:8px;border-radius:99px;background:rgba(0,0,0,.3);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;width:78%;border-radius:99px;background:linear-gradient(90deg,#38bdf8,#0284c7)}
.sec{font-size:13px;font-weight:700;margin:18px 2px 10px;color:rgba(232,238,247,.9)}
.row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);margin-bottom:9px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.row .ic{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.row b{font-size:13px;display:block}.row span{font-size:11px;color:rgba(232,238,247,.65)}
.row .go{margin-left:auto;font-size:15px;color:rgba(232,238,247,.6)}
.dockbar{flex:none;padding:2px 12px 52px}
.dock-wrap{display:flex;flex-direction:column;align-items:center;position:relative}
.tip{margin-bottom:14px;font-size:12px;color:#cfe0f7;background:rgba(20,28,46,.85);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:5px 12px;opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s;pointer-events:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tip.show{opacity:1;transform:translateY(0)}
.dock{position:relative;display:flex;align-items:flex-end;gap:10px;padding:14px 16px;max-width:calc(100vw - 24px);border-radius:26px;background:linear-gradient(115deg,rgba(255,255,255,.26) 0%,rgba(255,255,255,.06) 30%,rgba(255,255,255,.24) 52%,rgba(255,255,255,.08) 75%);-webkit-backdrop-filter:blur(24px) saturate(1.9);backdrop-filter:blur(24px) saturate(1.9);border:1px solid rgba(255,255,255,.40);box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.65),inset 0 -1px 0 rgba(255,255,255,.15)}
.dock:after{content:"";position:absolute;inset:0;border-radius:26px;background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.20) 48%,rgba(255,255,255,0) 62%);pointer-events:none}
.app{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;cursor:pointer;transform-origin:bottom center;will-change:transform}
.icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 6px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.2)}
.dot-run{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.85);margin-top:5px;box-shadow:0 0 6px rgba(255,255,255,.6)}
.sep{width:1px;align-self:stretch;background:rgba(255,255,255,.25);margin:6px 2px;border-radius:1px}
@media (max-width:480px){.dock{gap:5px;padding:8px 10px;border-radius:18px}.icon{width:32px;height:32px;font-size:18px;border-radius:9px}.sep{margin:4px 1px}}
.app{-webkit-box-reflect:below 6px linear-gradient(transparent 55%,rgba(255,255,255,.28))}</style>
</head>
<body>
<div class="status"><span>9:41</span><span class="right"><span class="sig"><i></i><i></i><i></i><i></i></span><span>5G</span><span class="bat"></span></span></div>
<div class="topbar"><div class="logo">懒</div><h1>懒得找了</h1><div class="search">🔍 搜索站点 / 粘贴链接…</div><div class="ava">👤</div></div>
<div class="content">
<div class="hero"><div class="k">今日解析</div><h2>去水印解析进行中</h2><p>抖音短视频 · 正在去除水印</p><div class="bar"><i></i></div></div>
<div class="sec">最近任务</div>
<div class="row"><div class="ic">🎬</div><div><b>抖音视频解析完成</b><span>已保存到下载管理</span></div><div class="go">✓</div></div><div class="row"><div class="ic">🌐</div><div><b>站点导航 · 今日推荐</b><span>19 个新站点已更新</span></div><div class="go">›</div></div><div class="row"><div class="ic">⬇️</div><div><b>下载管理 · 3 个任务</b><span>2 个完成，1 个进行中</span></div><div class="go">›</div></div><div class="row"><div class="ic">⏱️</div><div><b>工时打卡 · 今日已打卡</b><span>连续打卡 12 天</span></div><div class="go">✓</div></div>
</div>
<div class="dockbar"><div class="dock-wrap">
<div class="tip" id="tip">访达</div>
<div class="dock" id="dock"><div class="app" data-label="地图"><div class="icon" style="background:linear-gradient(135deg,#4ade80,#15803d)">🗺️</div><div class="dot-run"></div></div><div class="app" data-label="航班"><div class="icon" style="background:linear-gradient(135deg,#7dd3fc,#0369a1)">✈️</div></div><div class="app" data-label="酒店"><div class="icon" style="background:linear-gradient(135deg,#fda4af,#be123c)">🏨</div><div class="dot-run"></div></div><div class="app" data-label="美食"><div class="icon" style="background:linear-gradient(135deg,#fdba74,#c2410c)">🍜</div></div><div class="sep"></div><div class="app" data-label="相机"><div class="icon" style="background:linear-gradient(135deg,#c4b5fd,#6d28d9)">📷</div></div><div class="app" data-label="耳机"><div class="icon" style="background:linear-gradient(135deg,#38bdf8,#1d4ed8)">🎧</div><div class="dot-run"></div></div><div class="app" data-label="攻略"><div class="icon" style="background:linear-gradient(135deg,#fde68a,#b45309)">📖</div></div><div class="sep"></div><div class="app" data-label="钱包"><div class="icon" style="background:linear-gradient(135deg,#a78bfa,#5b21b6)">💳</div></div><div class="app" data-label="电量"><div class="icon" style="background:linear-gradient(135deg,#86efac,#16a34a)">🔋</div></div><div class="app" data-label="废纸篓"><div class="icon" style="background:linear-gradient(135deg,#e2e8f0,#94a3b8)">🗑️</div></div></div>
</div></div>
<script>(function(){
var dock=document.getElementById('dock'),tip=document.getElementById('tip');
var apps=Array.prototype.slice.call(dock.querySelectorAll('.app'));
var MAX=1.8,SIGMA=62;
function gauss(d){return Math.exp(-(d*d)/(2*SIGMA*SIGMA));}
function render(mx){
  var near=null,nearD=1e9;
  apps.forEach(function(a){
    var r=a.getBoundingClientRect(),cx=r.left+r.width/2,d=Math.abs(mx-cx);
    var s=1+(MAX-1)*gauss(d),lift=(s-1)*34;
    a.style.transform='scale('+s.toFixed(3)+') translateY('+(-lift).toFixed(1)+'px)';
    if(d<nearD){nearD=d;near=a;}
  });
  
}
function reset(){apps.forEach(function(a){a.style.transform='scale(1) translateY(0)';});tip.classList.remove('show');}
dock.addEventListener('mousemove',function(e){render(e.clientX);});
dock.addEventListener('mouseleave',reset);
dock.addEventListener('touchmove',function(e){if(e.touches.length){render(e.touches[0].clientX);}}, {passive:true});
dock.addEventListener('touchend',reset);
apps.forEach(function(a){a.addEventListener('mouseenter',function(){tip.textContent=a.getAttribute('data-label');tip.classList.add('show');});});
function adapt(){if(apps.length>1){var r0=apps[0].getBoundingClientRect(),r1=apps[1].getBoundingClientRect();SIGMA=Math.max(46,(r1.left-r0.left)*0.85);}}
window.addEventListener('resize',adapt);adapt();
})();</script>
</body>
