const card=document.createElement('div');card.className='card';
card.innerHTML=`<div class="meta"><div><span class="n">${String(n).padStart(2,'0')}</span><h3 style="display:inline;margin-left:8px">${d.n}</h3><p>${d.d}</p></div><button class="copy">复制代码</button></div>
<div class="stage"><div class="screen"><div class="fake"><i></i><i></i><i></i></div><div class="mount"><style>${d.css}</style><div class="bar tb${n}"${d.ind?` data-ind="${d.ind}"`:''}${d.dock?' data-dock="1"':''}>${d.ind?'<div class="ind"></div>':''}${d.fan?fanMarkup():(idx===4?bulgeMarkup():tabMarkup())}</div></div></div></div>`;
grid.appendChild(card);
const bar=card.querySelector('.bar');
/* 切换 */
bar.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
bar.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');moveInd(bar);
if(bar.dataset.dock)resetDock(bar);
}));
/* 扇形 */
const fab=bar.querySelector('.fab');if(fab)fab.addEventListener('click',()=>bar.classList.toggle('open'));
/* dock 放大 */
if(bar.dataset.dock){bar.addEventListener('mousemove',e=>{const r=bar.getBoundingClientRect();bar.querySelectorAll('.tab').forEach(t=>{const tr=t.getBoundingClientRect();const dist=Math.abs(e.clientX-(tr.left+tr.width/2));const s=Math.max(1,1.7-dist/130);t.style.transform=`scale(${s})`})});bar.addEventListener('mouseleave',()=>resetDock(bar))}
moveInd(bar);
/* 复制 */
card.querySelector('.copy').addEventListener('click',ev=>{
navigator.clipboard.writeText(standalone(d,idx)).then(()=>{ev.target.textContent='已复制 ✓';ev.target.classList.add('ok');toast.classList.add('show');setTimeout(()=>{ev.target.textContent='复制代码';ev.target.classList.remove('ok');toast.classList.remove('show')},1400)})});
});
function resetDock(bar){bar.querySelectorAll('.tab').forEach(t=>t.style.transform='')}
function moveInd(bar){
const ind=bar.querySelector('.ind'),on=bar.querySelector('.tab.on');if(!ind||!on)return;
const kind=bar.dataset.ind,bl=bar.offsetLeft;
if(kind==='line'||kind==='capsule'||kind==='seg'){ind.style.left=(on.offsetLeft-bl+6)+'px';ind.style.width=(on.offsetWidth-12)+'px'}
else if(kind==='dot'){ind.style.left=(on.offsetLeft-bl+on.offsetWidth/2-3)+'px'}
else if(kind==='drop'){const s=ind.offsetWidth||52;ind.style.left=(on.offsetLeft-bl+on.offsetWidth/2-s/2)+'px'}
}
window.addEventListener('resize',()=>document.querySelectorAll('.bar').forEach(moveInd));
setTimeout(()=>document.querySelectorAll('.bar').forEach(moveInd),300);
</script>
</body>
</html>
