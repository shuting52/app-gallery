<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>像素风 · 底部Tab</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#20242e;display:flex;justify-content:center;min-height:100vh;font-family:"Courier New",monospace}
.phone{width:430px;height:900px;background:#fdf6e3;position:relative;overflow:hidden}
.phone::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.055) 0 2px,transparent 2px 4px);pointer-events:none;z-index:50}
.status{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:14px;font-weight:700;color:#1c1c1c}
.content{position:absolute;top:44px;left:0;right:0;bottom:0;overflow:hidden}
.feed{padding:14px 16px 130px}
.hero{border:4px solid #1c1c1c;background:#ff4757;color:#fff;padding:18px;margin-bottom:14px;box-shadow:6px 6px 0 #1c1c1c}
.hero h2{font-size:18px;letter-spacing:2px}
.hero p{font-size:12px;margin-top:6px}
.card{border:4px solid #1c1c1c;background:#fff;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:12px;box-shadow:5px 5px 0 #1c1c1c}
.sw{width:40px;height:40px;flex-shrink:0;border:3px solid #1c1c1c}
.ct{font-size:14px;font-weight:700;color:#1c1c1c}
.cs{font-size:12px;color:#666;margin-top:4px}
/* ---- 底栏 ---- */
.dock{position:absolute;left:0;right:0;bottom:0;height:92px;background:#fdf6e3;border-top:4px solid #1c1c1c}
.arrow{position:absolute;top:-18px;left:12.5%;width:22px;height:14px;transform:translateX(-50%);transition:left .32s steps(4,end)}
.tabs{position:absolute;inset:0;display:flex}
.tab{flex:1;background:none;border:0;border-right:3px solid #1c1c1c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.tab:last-child{border-right:0}
.px{width:24px;height:24px;transition:transform .12s}
.px svg{width:24px;height:24px;display:block}
.px svg rect{fill:#8a8578}
.tab.on .px svg rect{fill:#1c1c1c}
.tab.on .px{transform:translateY(3px)}
.tlabel{font-size:11px;font-weight:700;letter-spacing:2px;color:#8a8578}
.tab.on .tlabel{color:#ff4757}
.safe{position:absolute;bottom:0;left:0;right:0;height:10px;background:#fdf6e3;border-top:3px solid #1c1c1c}
</style>
</head>
<body>
<div class="phone">
  <div class="status"><span>9:41</span><span>5G ▮▮▮</span></div>
  <div class="content"><div class="feed">
    <div class="hero"><h2>PIXEL ARCADE</h2><p>8-BIT 游戏情报站 · LV.12</p></div>
    <div class="card"><div class="sw" style="background:#ff9a5a"></div><div><div class="ct">新作速报</div><div class="cs">本周 3 款像素新游</div></div></div>
    <div class="card"><div class="sw" style="background:#2fd48f"></div><div><div class="ct">高分攻略</div><div class="cs">隐藏关卡全收集</div></div></div>
    <div class="card"><div class="sw" style="background:#4aa8ff"></div><div><div class="ct">复古主机</div><div class="cs">CRT 显示器选购</div></div></div>
    <div class="card"><div class="sw" style="background:#9a6bff"></div><div><div class="ct">芯片音乐</div><div class="cs">8-bit 歌单更新</div></div></div>
    <div class="card"><div class="sw" style="background:#ff5a7a"></div><div><div class="ct">同人展会</div><div class="cs">周六开展 · 免费入场</div></div></div>
    <div class="card"><div class="sw" style="background:#f5c542"></div><div><div class="ct">速通纪录</div><div class="cs">新纪录 12:47</div></div></div>
  </div></div>
  <div class="dock">
    <svg class="arrow" id="arrow" viewBox="0 0 22 14" shape-rendering="crispEdges"><path d="M2 0h18v4h-4v4h-4v4H10V8H6V4H2z" fill="#ff4757"/></svg>
    <div class="tabs">
      <button class="tab on"><span class="px" data-ic="home"></span><span class="tlabel">首页</span></button>
      <button class="tab"><span class="px" data-ic="find"></span><span class="tlabel">发现</span></button>
      <button class="tab"><span class="px" data-ic="msg"></span><span class="tlabel">消息</span></button>
      <button class="tab"><span class="px" data-ic="me"></span><span class="tlabel">我</span></button>
    </div>
    <div class="safe"></div>
  </div>
</div>
<script>
var ICONS={
home:["..X..",".XXX.","XXXXX","X.X.X","X.X.X"],
find:[".XX..","X..X.","X..X.",".XX..","...XX"],
msg:["XXXXX","X...X","X...X","XXXXX",".X..."],
me:[".XXX.",".XXX.","XXXXX","XXXXX","XXXXX"]};
function pxSVG(map){var r='';map.forEach(function(row,y){row.split('').forEach(function(c,x){if(c==='X')r+='<rect x="'+(x*4)+'" y="'+(y*4)+'" width="4" height="4"/>';});});return '<svg viewBox="0 0 20 20" shape-rendering="crispEdges">'+r+'</svg>';}
document.querySelectorAll('.px').forEach(function(el){el.innerHTML=pxSVG(ICONS[el.getAttribute('data-ic')]);});
var tabs=Array.prototype.slice.call(document.querySelectorAll('.tab'));
var arrow=document.getElementById('arrow');
function go(i){
  tabs.forEach(function(t,k){t.classList.toggle('on',k===i);});
  arrow.style.left=(12.5+25*i)+'%';
}
tabs.forEach(function(t,i){t.addEventListener('click',function(){go(i);});});
var n=parseInt(new URLSearchParams(location.search).get('tab'),10);
go((n>=0&&n<4)?n:0);
</script>
</body>
</html>
