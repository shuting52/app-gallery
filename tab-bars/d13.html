<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>分段胶囊 · 底部Tab</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#cfd6e4;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center}
.preload *{transition:none!important;animation:none!important}
.phone{width:430px;height:900px;background:#f2f4fa;position:relative;display:flex;flex-direction:column;overflow:hidden}
.status{height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 24px;font-size:13px;font-weight:600;color:#111;flex-shrink:0}
.nav{height:52px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#111;flex-shrink:0}
.list{flex:1;overflow:hidden;padding:8px 0}
.chat{display:flex;align-items:center;background:#fff;margin:0 12px 8px;padding:11px 12px;border-radius:14px}
.av{width:46px;height:46px;border-radius:12px;color:#fff;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mid{flex:1;margin-left:11px;min-width:0}
.n{font-size:15px;color:#141414;font-weight:500}
.m{font-size:12.5px;color:#9a9a9a;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt{text-align:right;flex-shrink:0}
.t{font-size:11px;color:#b5b5b5}
.bdg{display:inline-block;min-width:17px;height:17px;line-height:17px;padding:0 5px;border-radius:9px;background:#fa5151;color:#fff;font-size:11px;margin-top:5px}
/* ---- 分段胶囊 ---- */
.dockzone{padding:10px 16px 28px;flex-shrink:0}
.seg{position:relative;display:flex;background:#dfe3ee;border-radius:22px;padding:4px;height:70px;box-shadow:inset 0 2px 6px rgba(40,55,100,.12)}
.pill{position:absolute;top:4px;bottom:4px;left:2px;width:calc(25% - 4px);background:#fff;border-radius:18px;box-shadow:0 4px 12px rgba(30,45,90,.20);transition:left .38s cubic-bezier(.34,1.45,.64,1)}
.seg .tab{flex:1;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#8a90a5;font-size:11px;cursor:pointer;transition:color .25s}
.seg .tab .ic{font-size:22px;line-height:1}
.seg .tab.on{color:#131828;font-weight:600}
.seg .tab.on .ic{animation:pop .42s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.65)}55%{transform:scale(1.22)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div class="phone">
<div class="status"><span>21:56</span><span>5G ▮▮▮</span></div>
<div class="nav">分段胶囊</div>
<div class="list">
<div class="chat"><div class="av" style="background:linear-gradient(135deg,#ff9a5a,#ff5a7a)">林</div><div class="mid"><div class="n">林晚</div><div class="m">那版海报我改好了，你看下</div></div><div class="rt"><div class="t">21:40</div><span class="bdg">2</span></div></div>
<div class="chat"><div class="av" style="background:linear-gradient(135deg,#4a9eff,#7a5aff)">产</div><div class="mid"><div class="n">产品交流群(12)</div><div class="m">@所有人 明天10点对需求</div></div><div class="rt"><div class="t">21:12</div><span class="bdg">12</span></div></div>
<div class="chat"><div class="av" style="background:linear-gradient(135deg,#2fd48f,#0ea5a5)">默</div><div class="mid"><div class="n">陈默</div><div class="m">[图片]</div></div><div class="rt"><div class="t">20:58</div></div></div>
<div class="chat"><div class="av" style="background:linear-gradient(135deg,#f5b942,#f07b3f)">周</div><div class="mid"><div class="n">老周</div><div class="m">团建投票截止今晚</div></div><div class="rt"><div class="t">20:31</div></div></div>
<div class="chat"><div class="av" style="background:linear-gradient(135deg,#ff7ab8,#c94b8f)">妈</div><div class="mid"><div class="n">妈妈</div><div class="m">天冷了多穿点</div></div><div class="rt"><div class="t">19:02</div><span class="bdg">5</span></div></div>
<div class="chat"><div class="av" style="background:linear-gradient(135deg,#8a93a8,#5d6a84)">快</div><div class="mid"><div class="n">快递小哥</div><div class="m">您的快递到驿站了</div></div><div class="rt"><div class="t">18:47</div></div></div>
<div class="chat"><div class="av" style="background:linear-gradient(135deg,#3ddad7,#2a9db8)">王</div><div class="mid"><div class="n">房东王姐</div><div class="m">水电费单发你了</div></div><div class="rt"><div class="t">17:20</div></div></div>
<div class="chat"><div class="av" style="background:linear-gradient(135deg,#b07df5,#7a4fe0)">十</div><div class="mid"><div class="n">十年同学群(3)</div><div class="m">老地方聚餐接龙</div></div><div class="rt"><div class="t">16:05</div><span class="bdg">3</span></div></div>
</div>
<div class="dockzone">
<div class="seg" id="seg">
<div class="pill" id="pill"></div>
<div class="tab" data-i="0"><span class="ic">🏠</span>首页</div>
<div class="tab" data-i="1"><span class="ic">🧭</span>发现</div>
<div class="tab" data-i="2"><span class="ic">💬</span>消息</div>
<div class="tab" data-i="3"><span class="ic">👤</span>我</div>
</div>
</div>
</div>
<script>
var tabs=document.querySelectorAll('#seg .tab'),pill=document.getElementById('pill');
function go(i){
  tabs.forEach(function(t,j){t.classList.toggle('on',i===j);});
  pill.style.left='calc('+(i*25)+'% + 2px)';
}
tabs.forEach(function(t){t.addEventListener('click',function(){go(+t.dataset.i);});});
document.body.classList.add('preload');
var n=parseInt(new URLSearchParams(location.search).get('tab')||'0',10);
go(n>=0&&n<4?n:0);
void document.body.offsetWidth;
document.body.classList.remove('preload');
</script>
</body>
</html>
