<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>底部Tab · 气泡上升</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:#0a1628;display:flex;justify-content:center}
.phone{width:430px;max-width:100%;height:900px;max-height:100vh;background:linear-gradient(180deg,#0e2140 0%,#0a1628 60%,#081120 100%);position:relative;overflow:hidden;display:flex;flex-direction:column;color:#e8f1ff}
.status{height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:600;color:#cfe3ff}
.nav{padding:6px 18px 12px;flex-shrink:0}
.nav h1{font-size:22px;letter-spacing:1px}
.nav p{font-size:12px;color:#7fa3d6;margin-top:4px}
.feed{flex:1;overflow:hidden;padding:4px 14px}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(140,190,255,.16);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.ava{width:46px;height:46px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;font-weight:700}
.txt{flex:1;min-width:0}
.txt .t{font-size:14px;font-weight:600}
.txt .d{font-size:12px;color:#8fb0d8;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-size:11px;color:#5f7ea8;flex-shrink:0}
/* ---- 底栏 ---- */
.dock{position:relative;flex-shrink:0;height:96px;margin:0 14px 18px;background:rgba(10,25,50,.72);border:1px solid rgba(140,190,255,.22);border-radius:26px;backdrop-filter:blur(8px);display:flex;z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#6f8db8;font-size:11px;cursor:pointer;position:relative}
.tab .ic{font-size:26px;line-height:1;transition:transform .25s}
.tab.on{color:#7fe7ff}
.tab.on .ic{animation:breathe 2.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.tab.on::after{content:"";position:absolute;bottom:10px;width:5px;height:5px;border-radius:50%;background:#7fe7ff;box-shadow:0 0 8px #7fe7ff}
/* 上升气泡粒子 */
.bub{position:absolute;bottom:70px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.9),rgba(127,231,255,.25) 60%,rgba(127,231,255,.05));border:1px solid rgba(160,230,255,.5);pointer-events:none;animation:rise 1.4s ease-out forwards;z-index:6}
@keyframes rise{
0%{transform:translateY(0) scale(.6);opacity:0}
15%{opacity:.95}
100%{transform:translateY(-190px) scale(1.15);opacity:0}
}
</style>
</head>
<body>
<div class="phone" id="phone">
<div class="status"><span>21:56</span><span>5G ▂▄▆ 🔋</span></div>
<div class="nav"><h1>深海电台</h1><p>今晚有 128 位潜水员在线</p></div>
<div class="feed">
<div class="card"><div class="ava" style="background:linear-gradient(135deg,#2e9dff,#7a5aff)">珊</div><div class="txt"><div class="t">珊瑚礁漫游指南</div><div class="d">新发现一片荧光珊瑚群，坐标已更新</div></div><div class="time">21:40</div></div>
<div class="card"><div class="ava" style="background:linear-gradient(135deg,#00d4a8,#00a3ff)">鲸</div><div class="txt"><div class="t">蓝鲸观察站</div><div class="d">今日声呐记录到三次鲸歌</div></div><div class="time">20:15</div></div>
<div class="card"><div class="ava" style="background:linear-gradient(135deg,#ff9a3d,#ff5a7a)">灯</div><div class="txt"><div class="t">灯塔守夜人</div><div class="d">雾天值班表出来了，大家认领一下</div></div><div class="time">19:02</div></div>
<div class="card"><div class="ava" style="background:linear-gradient(135deg,#b07df5,#5a3df5)">章</div><div class="txt"><div class="t">章鱼博士的实验室</div><div class="d">墨汁推进器 2.0 测试成功</div></div><div class="time">18:33</div></div>
<div class="card"><div class="ava" style="background:linear-gradient(135deg,#ffd23d,#ff7a3d)">贝</div><div class="txt"><div class="t">贝壳收藏家</div><div class="d">晒一晒今天捡到的粉色海扇</div></div><div class="time">17:21</div></div>
<div class="card"><div class="ava" style="background:linear-gradient(135deg,#3ddad7,#2a9db8)">潮</div><div class="txt"><div class="t">潮汐预报</div><div class="d">明日凌晨大潮，赶海集合啦</div></div><div class="time">16:05</div></div>
<div class="card"><div class="ava" style="background:linear-gradient(135deg,#ff6a9d,#c94b8f)">豚</div><div class="txt"><div class="t">海豚训练营</div><div class="d">新学员第一课：顶球入门</div></div><div class="time">15:12</div></div>
</div>
<div class="dock" id="dock">
<div class="tab" data-i="0"><span class="ic">🌊</span>首页</div>
<div class="tab" data-i="1"><span class="ic">🐚</span>发现</div>
<div class="tab" data-i="2"><span class="ic">💬</span>消息</div>
<div class="tab" data-i="3"><span class="ic">⚓</span>我的</div>
</div>
</div>
<script>
const dock=document.getElementById('dock');
const tabs=[...dock.querySelectorAll('.tab')];
function bubbles(tab){
  const r=tab.getBoundingClientRect(),dr=dock.getBoundingClientRect();
  const cx=r.left-dr.left+r.width/2;
  for(let k=0;k<7;k++){
    const b=document.createElement('span');
    b.className='bub';
    const s=8+Math.random()*14;
    b.style.width=b.style.height=s+'px';
    b.style.left=(cx-s/2+(Math.random()*56-28))+'px';
    b.style.animationDelay=(Math.random()*0.35)+'s';
    dock.appendChild(b);
    b.addEventListener('animationend',()=>b.remove());
  }
}
function activate(i){
  tabs.forEach((t,j)=>t.classList.toggle('on',i===j));
  bubbles(tabs[i]);
}
tabs.forEach((t,i)=>t.addEventListener('click',()=>activate(i)));
const q=new URLSearchParams(location.search);
const n=parseInt(q.get('tab'),10);
activate(!isNaN(n)&&n>=0&&n<4?n:0);
</script>
</body>
</html>
