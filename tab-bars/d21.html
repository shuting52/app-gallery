<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>底部Tab · 花瓣绽放</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:#1c0f16;display:flex;justify-content:center}
.phone{width:430px;max-width:100%;height:900px;max-height:100vh;background:linear-gradient(180deg,#fff5f7 0%,#ffeef2 55%,#fde4ea 100%);position:relative;overflow:hidden;display:flex;flex-direction:column;color:#5a2b3a}
.status{height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:600;color:#8a4a5e}
.nav{padding:8px 18px 12px;flex-shrink:0}
.nav h1{font-size:22px;color:#4a1f2e}
.nav h1 span{color:#e86a92}
.nav p{font-size:12px;color:#b0788a;margin-top:4px}
.feed{flex:1;overflow:hidden;padding:4px 14px}
.note{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;box-shadow:0 2px 8px rgba(232,106,146,.12)}
.stamp{width:46px;height:46px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;background:linear-gradient(135deg,#ffd9e4,#ffb3c8)}
.txt{flex:1;min-width:0}
.txt .t{font-size:14px;font-weight:600;color:#4a1f2e}
.txt .d{font-size:12px;color:#a4768a;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-size:11px;color:#c79aa8;flex-shrink:0}
/* ---- 底栏 ---- */
.dock{position:relative;flex-shrink:0;height:98px;margin:0 14px 18px;background:rgba(255,255,255,.85);border-radius:28px;box-shadow:0 8px 24px rgba(232,106,146,.18);display:flex;z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#b98a9a;font-size:11px;cursor:pointer;position:relative}
.tab .ic{font-size:26px;line-height:1;position:relative;z-index:2;transition:transform .3s}
.tab.on{color:#e0507e;font-weight:700}
.tab.on .ic{transform:scale(1.15)}
.tab.on::after{content:"";position:absolute;bottom:12px;width:6px;height:6px;border-radius:50%;background:#f7a8c0}
/* 花瓣 */
.petal{position:absolute;width:12px;height:18px;border-radius:60% 60% 60% 60%/70% 70% 50% 50%;background:linear-gradient(180deg,#ffc2d4,#f78fb0);pointer-events:none;z-index:1;animation:bloom 1.1s ease-out forwards}
@keyframes bloom{
0%{transform:translate(0,0) rotate(0deg) scale(.3);opacity:0}
25%{opacity:1}
100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rr)) scale(1);opacity:0}
}
.core{position:absolute;width:10px;height:10px;border-radius:50%;background:#ffd76a;box-shadow:0 0 10px #ffd76a;pointer-events:none;z-index:1;animation:corepop .8s ease-out forwards}
@keyframes corepop{0%{transform:scale(.3);opacity:0}30%{opacity:1}100%{transform:scale(1.4);opacity:0}}
</style>
</head>
<body>
<div class="phone">
<div class="status"><span>21:56</span><span>5G ▂▄▆ 🔋</span></div>
<div class="nav"><h1>花<span>信</span>手账</h1><p>记录今日份的心动瞬间</p></div>
<div class="feed">
<div class="note"><div class="stamp">🌸</div><div class="txt"><div class="t">樱花大道跑步打卡</div><div class="d">第 12 天，花瓣雨配速超常发挥</div></div><div class="time">21:40</div></div>
<div class="note"><div class="stamp">🌷</div><div class="txt"><div class="t">郁金香展览票根</div><div class="d">粉色那片花海必须二刷</div></div><div class="time">20:15</div></div>
<div class="note"><div class="stamp">🌻</div><div class="txt"><div class="t">向日葵田野餐</div><div class="d">带了三明治和汽水，完美周末</div></div><div class="time">19:02</div></div>
<div class="note"><div class="stamp">🌹</div><div class="txt"><div class="t">玫瑰花束养护笔记</div><div class="d">每天换水剪根，能开两周</div></div><div class="time">18:33</div></div>
<div class="note"><div class="stamp">💐</div><div class="txt"><div class="t">手工花束课程</div><div class="d">包了人生第一束满天星</div></div><div class="time">17:21</div></div>
<div class="note"><div class="stamp">🌼</div><div class="txt"><div class="t">雏菊耳环 DIY</div><div class="d">胶水差点粘住手指，成品很值</div></div><div class="time">16:05</div></div>
<div class="note"><div class="stamp">🪷</div><div class="txt"><div class="t">荷花池写生</div><div class="d">蜻蜓落在笔尖上，画里有了它</div></div><div class="time">15:12</div></div>
</div>
<div class="dock" id="dock">
<div class="tab" data-i="0"><span class="ic">🌷</span>首页</div>
<div class="tab" data-i="1"><span class="ic">🌸</span>花市</div>
<div class="tab" data-i="2"><span class="ic">💌</span>信件</div>
<div class="tab" data-i="3"><span class="ic">🌱</span>我的</div>
</div>
</div>
<script>
const dock=document.getElementById('dock');
const tabs=[...dock.querySelectorAll('.tab')];
function bloom(tab){
  const ic=tab.querySelector('.ic');
  const r=ic.getBoundingClientRect(),dr=dock.getBoundingClientRect();
  const cx=r.left-dr.left+r.width/2, cy=r.top-dr.top+r.height/2;
  const n=8;
  for(let k=0;k<n;k++){
    const p=document.createElement('span');
    p.className='petal';
    const ang=(k/n)*Math.PI*2, dist=34+Math.random()*10;
    p.style.setProperty('--dx',Math.cos(ang)*dist+'px');
    p.style.setProperty('--dy',Math.sin(ang)*dist+'px');
    p.style.setProperty('--rr',(Math.random()*160-80)+'deg');
    p.style.left=(cx-6)+'px'; p.style.top=(cy-9)+'px';
    dock.appendChild(p);
    p.addEventListener('animationend',()=>p.remove());
  }
  const c=document.createElement('span');
  c.className='core';
  c.style.left=(cx-5)+'px'; c.style.top=(cy-5)+'px';
  dock.appendChild(c);
  c.addEventListener('animationend',()=>c.remove());
}
function activate(i){
  tabs.forEach((t,j)=>t.classList.toggle('on',i===j));
  bloom(tabs[i]);
}
tabs.forEach((t,i)=>t.addEventListener('click',()=>activate(i)));
const q=new URLSearchParams(location.search);
const n=parseInt(q.get('tab'),10);
activate(!isNaN(n)&&n>=0&&n<4?n:0);
</script>
</body>
</html>
