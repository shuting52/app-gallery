<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>纸飞机 · 更新 v4.0.0</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #dbeafe 0%, #eff6ff 60%, #fefce8 100%);
    padding: 20px;
  }
  .backdrop { position: fixed; inset: 0; background: rgba(30, 58, 95, 0.16); }
  .modal {
    position: relative; width: 330px;
    background: rgba(255, 255, 255, 0.94);
    border-radius: 26px; padding: 22px;
    box-shadow: 0 18px 50px rgba(30, 64, 120, 0.20);
    border: 1px solid rgba(255, 255, 255, 0.8);
  }
  .modal.hidden { display: none; }
  .m-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .m-title { font-size: 17px; font-weight: 700; color: #1e3a5f; display: flex; align-items: center; gap: 8px; }
  .ver { font-size: 11px; font-weight: 600; color: #2563eb; background: #dbeafe; border-radius: 99px; padding: 3px 10px; }
  .x { background: none; border: none; font-size: 24px; color: #9ca3af; cursor: pointer; line-height: 1; padding: 2px 6px; }
  .x:hover { color: #4b5563; }
  .m-sub { font-size: 13.5px; color: #5b7a9d; margin-bottom: 2px; }
  .m-meta { font-size: 12px; color: #9db4cc; margin-bottom: 10px; font-variant-numeric: tabular-nums; }
  .stage { position: relative; height: 175px; margin: 4px 0 2px; }
  .fold { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .fold svg { width: 210px; height: 165px; }
  #flyG { transform-box: fill-box; transform-origin: center; }
  .stage-tag {
    position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: #7ba0c9; background: #eef4fd; border-radius: 99px; padding: 3px 12px;
    white-space: nowrap;
  }
  .flown { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; flex-direction: column; gap: 8px; }
  .flown.show { display: flex; }
  .flown .big { font-size: 30px; font-weight: 800; color: #1e3a5f; letter-spacing: 4px; }
  .flown .small { font-size: 12px; color: #7ba0c9; letter-spacing: 2px; }
  .pct { text-align: center; font-size: 34px; font-weight: 800; color: #1e3a5f; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .main-btn {
    width: 100%; margin-top: 12px; padding: 14px 0; border: none; border-radius: 99px;
    font-size: 16px; font-weight: 600; cursor: pointer; letter-spacing: 2px;
    background: #e0eaff; color: #2563eb; transition: background .2s;
  }
  .main-btn:hover { background: #cdddfc; }
  .main-btn.gold { background: linear-gradient(135deg, #60a5fa, #2563eb); color: #fff; box-shadow: 0 8px 22px rgba(37,99,235,.35); }
  .main-btn:disabled { opacity: .5; cursor: default; }
  .replay { display: block; margin: 10px auto 0; background: none; border: none; color: #9db4cc; font-size: 12.5px; cursor: pointer; letter-spacing: 1px; }
  .replay:hover { color: #2563eb; }
  .toast {
    position: fixed; top: 26px; left: 50%; transform: translateX(-50%) translateY(-16px);
    background: rgba(30,58,95,.92); color: #fff; padding: 10px 22px; border-radius: 99px;
    font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 60;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="backdrop"></div>
<div class="modal" id="modal">
  <div class="m-head">
    <div class="m-title">纸飞机 <span class="ver">v4.0.0</span></div>
    <button class="x" id="xBtn">×</button>
  </div>
  <div class="m-sub" id="statusText">正在折叠新版本…</div>
  <div class="m-meta" id="metaText">0.0MB / 156.8MB · -- MB/s</div>

  <div class="stage" id="stage">
    <div class="fold" id="fold0">
      <svg viewBox="0 0 200 160">
        <rect x="55" y="40" width="90" height="80" rx="4" fill="#ffffff" stroke="#b9cdea" stroke-width="2"/>
        <line x1="100" y1="40" x2="100" y2="120" stroke="#b9cdea" stroke-width="1.5" stroke-dasharray="5 4"/>
        <path d="M62 52 L78 52 M62 62 L72 62" stroke="#d7e4f7" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="fold" id="fold1" style="display:none">
      <svg viewBox="0 0 200 160">
        <polygon points="55,122 145,122 100,42" fill="#ffffff" stroke="#b9cdea" stroke-width="2"/>
        <line x1="100" y1="42" x2="100" y2="122" stroke="#b9cdea" stroke-width="1.5" stroke-dasharray="5 4"/>
      </svg>
    </div>
    <div class="fold" id="fold2" style="display:none">
      <svg viewBox="0 0 200 160">
        <polygon points="72,122 128,122 100,42" fill="#ffffff" stroke="#7ba7e0" stroke-width="2"/>
        <line x1="100" y1="42" x2="100" y2="122" stroke="#7ba7e0" stroke-width="1.5" stroke-dasharray="5 4"/>
        <polygon points="72,122 100,42 100,122" fill="#e3eefc"/>
      </svg>
    </div>
    <div class="fold" id="fold3" style="display:none">
      <svg viewBox="0 0 200 160">
        <g id="flyG">
          <polygon points="52,96 158,66 66,124" fill="#ffffff" stroke="#3b82f6" stroke-width="2.5" stroke-linejoin="round"/>
          <line x1="66" y1="124" x2="112" y2="82" stroke="#93c0f5" stroke-width="2"/>
          <path d="M40 132 Q70 126 96 132" stroke="#c9dcf5" stroke-width="2" fill="none" stroke-dasharray="4 5" stroke-linecap="round"/>
        </g>
      </svg>
    </div>
    <div class="flown" id="flown">
      <div class="big">已起飞</div>
      <div class="small">v4.0.0 正在飞向你</div>
    </div>
    <div class="stage-tag" id="stageTag">第 1 折 · 平整纸张</div>
  </div>

  <div class="pct" id="pctText">0%</div>
  <button class="main-btn" id="mainBtn">取消更新</button>
  <button class="replay" id="replayBtn">↺ 重新演示</button>
</div>
<div class="toast" id="toast"></div>

<script>
  const modal = document.getElementById('modal');
  const statusText = document.getElementById('statusText');
  const metaText = document.getElementById('metaText');
  const pctText = document.getElementById('pctText');
  const mainBtn = document.getElementById('mainBtn');
  const stageTag = document.getElementById('stageTag');
  const flown = document.getElementById('flown');
  const flyG = document.getElementById('flyG');
  const toast = document.getElementById('toast');
  const folds = [0, 1, 2, 3].map(i => document.getElementById('fold' + i));
  const STAGE_NAMES = ['第 1 折 · 平整纸张', '第 2 折 · 对角相折', '第 3 折 · 收窄机身', '第 4 折 · 飞机成型'];

  const TOTAL = 156.8;
  let progress = 0, state = 'downloading', timer = null, showSpeed = 0;
  let shownStage = -1, flyT = 0;

  function showToast(m) {
    toast.textContent = m; toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 1800);
  }
  function setMain(t, gold, dis) {
    mainBtn.textContent = t;
    mainBtn.classList.toggle('gold', !!gold);
    mainBtn.disabled = !!dis;
  }
  function setStage(s) {
    if (s === shownStage) return;
    shownStage = s;
    folds.forEach((el, i) => el.style.display = i === s ? 'flex' : 'none');
    stageTag.textContent = STAGE_NAMES[s];
    stageTag.style.display = 'block';
    flown.classList.remove('show');
  }
  function render(p) {
    const s = Math.min(3, Math.floor(p / 25));
    setStage(s);
    pctText.textContent = Math.floor(p) + '%';
    const mb = (p / 100 * TOTAL).toFixed(1);
    metaText.textContent = mb + 'MB / ' + TOTAL + 'MB · ' + (state === 'downloading' ? showSpeed.toFixed(1) + ' MB/s' : '-- MB/s');
  }
  function resetConcept() {
    flyT = 0;
    flyG.style.transform = ''; flyG.style.opacity = '';
    flown.classList.remove('show');
    stageTag.style.display = 'block';
    shownStage = -1; setStage(0);
  }

  function tick() {
    if (state !== 'downloading') return;
    const sp = 8 * (0.6 + Math.random() * 0.8);
    showSpeed = showSpeed * 0.7 + sp * 0.3;
    progress += sp * 0.1 / TOTAL * 100;
    if (progress >= 100) { progress = 100; render(progress); enterInstalling(); return; }
    render(progress);
  }
  function startTimer() { clearInterval(timer); timer = setInterval(tick, 100); }

  function enterDownloading() {
    state = 'downloading';
    statusText.textContent = '正在折叠新版本…';
    setMain('取消更新', false, false);
    startTimer(); render(progress);
  }
  function enterCancelled() {
    state = 'cancelled'; clearInterval(timer);
    statusText.textContent = '折叠已暂停';
    metaText.textContent = (progress / 100 * TOTAL).toFixed(1) + 'MB / ' + TOTAL + 'MB · 已停止';
    setMain('重新下载', false, false);
    showToast('已取消更新');
  }
  function enterInstalling() {
    state = 'installing'; clearInterval(timer);
    statusText.textContent = '折好了，准备起飞…';
    setMain('起飞中…', false, true);
    flyT = 0;
    timer = setInterval(() => {
      flyT += 1 / 14;
      const t = Math.min(flyT, 1);
      const x = t * 320, y = -(t * t * 260 + t * 30), rot = t * 38;
      flyG.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) rotate(' + rot.toFixed(1) + 'deg)';
      flyG.style.opacity = 1 - t * 0.7;
      if (t >= 1) { clearInterval(timer); enterDone(); }
    }, 100);
  }
  function enterDone() {
    state = 'done'; clearInterval(timer);
    folds.forEach(el => el.style.display = 'none');
    stageTag.style.display = 'none';
    flown.classList.add('show');
    statusText.textContent = '更新完成，纸飞机已起飞';
    metaText.textContent = 'v4.0.0 · 折叠 ' + TOTAL + 'MB 完成';
    pctText.textContent = '100%';
    setMain('立即体验', true, false);
    showToast('已更新到 v4.0.0');
  }

  mainBtn.addEventListener('click', () => {
    if (state === 'downloading') enterCancelled();
    else if (state === 'cancelled') { progress = 0; showSpeed = 0; resetConcept(); enterDownloading(); }
    else if (state === 'done') { modal.classList.add('hidden'); showToast('已进入 v4.0.0'); }
  });
  document.getElementById('xBtn').addEventListener('click', () => {
    if (state === 'downloading') enterCancelled();
    else modal.classList.add('hidden');
  });
  document.getElementById('replayBtn').addEventListener('click', () => {
    modal.classList.remove('hidden');
    progress = 0; showSpeed = 0; resetConcept(); enterDownloading();
    showToast('重新开始演示');
  });

  window.addEventListener('load', () => {
    if (location.hash === '#done') { progress = 100; render(100); enterDone(); }
    else enterDownloading();
  });
</script>
</body>
</html>
