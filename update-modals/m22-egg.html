<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>破壳孵化 · 更新 v4.0.0</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(165deg, #fdf3e3 0%, #fbeed7 55%, #f7e4c3 100%);
    padding: 20px;
  }
  .backdrop { position: fixed; inset: 0; background: rgba(120, 72, 20, 0.14); }
  .modal {
    position: relative; width: 330px;
    background: rgba(255, 253, 248, 0.95);
    border-radius: 26px; padding: 22px;
    box-shadow: 0 18px 50px rgba(150, 100, 40, 0.22);
    border: 1px solid #f3e2c4;
  }
  .modal.hidden { display: none; }
  .m-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .m-title { font-size: 17px; font-weight: 700; color: #7c4a1e; display: flex; align-items: center; gap: 8px; }
  .ver { font-size: 11px; font-weight: 600; color: #b45309; background: #fdeecd; border-radius: 99px; padding: 3px 10px; }
  .x { background: none; border: none; font-size: 24px; color: #c9a877; cursor: pointer; line-height: 1; padding: 2px 6px; }
  .x:hover { color: #7c4a1e; }
  .m-sub { font-size: 13.5px; color: #a3763f; margin-bottom: 2px; }
  .m-meta { font-size: 12px; color: #c9a877; margin-bottom: 10px; font-variant-numeric: tabular-nums; }
  .stage { position: relative; height: 210px; display: flex; align-items: center; justify-content: center; }
  .stage svg { width: 200px; height: 210px; overflow: visible; }
  #topShell { transform-box: fill-box; transform-origin: 50% 90%; }
  #rays line { stroke: #f5b93f; stroke-width: 5; stroke-linecap: round; }
  #chick { transform-box: fill-box; transform-origin: center; }
  .pct { text-align: center; font-size: 34px; font-weight: 800; color: #7c4a1e; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .main-btn {
    width: 100%; margin-top: 12px; padding: 14px 0; border: none; border-radius: 99px;
    font-size: 16px; font-weight: 600; cursor: pointer; letter-spacing: 2px;
    background: #fbeed3; color: #b45309; transition: background .2s;
  }
  .main-btn:hover { background: #f7e2b8; }
  .main-btn.gold { background: linear-gradient(135deg, #fbbf24, #d97706); color: #fff; box-shadow: 0 8px 22px rgba(217,119,6,.35); }
  .main-btn:disabled { opacity: .5; cursor: default; }
  .replay { display: block; margin: 10px auto 0; background: none; border: none; color: #c9a877; font-size: 12.5px; cursor: pointer; letter-spacing: 1px; }
  .replay:hover { color: #b45309; }
  .toast {
    position: fixed; top: 26px; left: 50%; transform: translateX(-50%) translateY(-16px);
    background: rgba(124, 74, 30, 0.94); color: #fff; padding: 10px 22px; border-radius: 99px;
    font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 60;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="backdrop"></div>
<div class="modal" id="modal">
  <div class="m-head">
    <div class="m-title">破壳孵化 <span class="ver">v4.0.0</span></div>
    <button class="x" id="xBtn">×</button>
  </div>
  <div class="m-sub" id="statusText">新版本正在破壳…</div>
  <div class="m-meta" id="metaText">0.0MB / 156.8MB · -- MB/s</div>

  <div class="stage">
    <svg viewBox="0 0 200 220">
      <ellipse cx="100" cy="205" rx="62" ry="10" fill="#e8d3a8" opacity="0.7"/>
      <g id="rays" opacity="0">
        <line x1="100" y1="18" x2="100" y2="38"/>
        <line x1="52" y1="36" x2="64" y2="52"/>
        <line x1="148" y1="36" x2="136" y2="52"/>
        <line x1="30" y1="80" x2="50" y2="86"/>
        <line x1="170" y1="80" x2="150" y2="86"/>
      </g>
      <g id="chick" opacity="0">
        <circle cx="100" cy="96" r="20" fill="#ffd94d"/>
        <circle cx="93" cy="92" r="2.6" fill="#5b3a12"/>
        <circle cx="107" cy="92" r="2.6" fill="#5b3a12"/>
        <polygon points="100,98 94,104 106,104" fill="#f59e0b"/>
        <path d="M84 78 q4 -8 10 -6 M116 78 q-4 -8 -10 -6" stroke="#f5b93f" stroke-width="3" fill="none" stroke-linecap="round"/>
      </g>
      <path id="shellBottom" d="M38,108 A62,80 0 0 0 162,108 L162,108 L38,108 Z"
            fill="#fff8ea" stroke="#d9b978" stroke-width="2.5"/>
      <g id="topShell">
        <path d="M38,108 A62,80 0 0 1 162,108 L162,108 L38,108 Z"
              fill="#fffdf6" stroke="#d9b978" stroke-width="2.5"/>
        <path d="M60,74 A52,62 0 0 1 78,52" stroke="#f3e2bd" stroke-width="7" fill="none" stroke-linecap="round"/>
      </g>
      <polyline id="crack" points="50,108 66,100 80,110 96,101 112,111 128,102 144,110 152,106"
                fill="none" stroke="#8a5a22" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="pct" id="pctText">0%</div>
  <button class="main-btn" id="mainBtn">取消更新</button>
  <button class="replay" id="replayBtn">↺ 重新演示</button>
</div>
<div class="toast" id="toast"></div>

<script>
  const modal = document.getElementById('modal');
  const statusText = document.getElementById('statusText');
  const metaText = document.getElementById('metaText');
  const pctText = document.getElementById('pctText');
  const mainBtn = document.getElementById('mainBtn');
  const toast = document.getElementById('toast');
  const crack = document.getElementById('crack');
  const topShell = document.getElementById('topShell');
  const rays = document.getElementById('rays');
  const chick = document.getElementById('chick');

  const TOTAL = 156.8;
  const crackLen = crack.getTotalLength();
  let progress = 0, state = 'downloading', timer = null, showSpeed = 0, popT = 0;

  crack.style.strokeDasharray = crackLen;
  crack.style.strokeDashoffset = crackLen;

  function showToast(m) {
    toast.textContent = m; toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 1800);
  }
  function setMain(t, gold, dis) {
    mainBtn.textContent = t;
    mainBtn.classList.toggle('gold', !!gold);
    mainBtn.disabled = !!dis;
  }
  function setPop(t) {  // t: 0 闭合 ~ 1 全开
    topShell.style.transform = 'translateY(' + (-t * 64).toFixed(1) + 'px) rotate(' + (-t * 24).toFixed(1) + 'deg)';
    topShell.style.opacity = 1 - t * 0.15;
    rays.setAttribute('opacity', (t * 0.95).toFixed(2));
    chick.setAttribute('opacity', t < 0.45 ? 0 : ((t - 0.45) / 0.55).toFixed(2));
    const cs = t < 0.45 ? 0.4 : 0.4 + 0.6 * ((t - 0.45) / 0.55);
    chick.style.transform = 'scale(' + cs.toFixed(2) + ')';
  }
  function render(p) {
    const cp = Math.min(p / 85, 1);   // 裂纹在 85% 时走完
    crack.style.strokeDashoffset = (crackLen * (1 - cp)).toFixed(1);
    pctText.textContent = Math.floor(p) + '%';
    const mb = (p / 100 * TOTAL).toFixed(1);
    metaText.textContent = mb + 'MB / ' + TOTAL + 'MB · ' + (state === 'downloading' ? showSpeed.toFixed(1) + ' MB/s' : '-- MB/s');
  }
  function resetConcept() {
    popT = 0; setPop(0);
    crack.style.strokeDashoffset = crackLen;
  }

  function tick() {
    if (state !== 'downloading') return;
    const sp = 8 * (0.6 + Math.random() * 0.8);
    showSpeed = showSpeed * 0.7 + sp * 0.3;
    progress += sp * 0.1 / TOTAL * 100;
    if (progress >= 100) { progress = 100; render(progress); enterInstalling(); return; }
    render(progress);
  }
  function startTimer() { clearInterval(timer); timer = setInterval(tick, 100); }

  function enterDownloading() {
    state = 'downloading';
    statusText.textContent = '新版本正在破壳…';
    setMain('取消更新', false, false);
    startTimer(); render(progress);
  }
  function enterCancelled() {
    state = 'cancelled'; clearInterval(timer);
    statusText.textContent = '孵化已暂停';
    metaText.textContent = (progress / 100 * TOTAL).toFixed(1) + 'MB / ' + TOTAL + 'MB · 已停止';
    setMain('重新下载', false, false);
    showToast('已取消更新');
  }
  function enterInstalling() {
    state = 'installing'; clearInterval(timer);
    statusText.textContent = '咔嚓——顶壳了！';
    setMain('破壳中…', false, true);
    popT = 0;
    timer = setInterval(() => {
      popT += 1 / 16;
      setPop(Math.min(popT, 1));
      if (popT >= 1) { clearInterval(timer); enterDone(); }
    }, 100);
  }
  function enterDone() {
    state = 'done'; clearInterval(timer);
    setPop(1);
    statusText.textContent = '破壳而出，欢迎回来';
    metaText.textContent = 'v4.0.0 · 孵化完成';
    pctText.textContent = '100%';
    setMain('立即体验', true, false);
    showToast('已更新到 v4.0.0');
  }

  mainBtn.addEventListener('click', () => {
    if (state === 'downloading') enterCancelled();
    else if (state === 'cancelled') { progress = 0; showSpeed = 0; resetConcept(); enterDownloading(); }
    else if (state === 'done') { modal.classList.add('hidden'); showToast('已进入 v4.0.0'); }
  });
  document.getElementById('xBtn').addEventListener('click', () => {
    if (state === 'downloading') enterCancelled();
    else modal.classList.add('hidden');
  });
  document.getElementById('replayBtn').addEventListener('click', () => {
    modal.classList.remove('hidden');
    progress = 0; showSpeed = 0; resetConcept(); enterDownloading();
    showToast('重新开始演示');
  });

  window.addEventListener('load', () => {
    if (location.hash === '#done') { progress = 100; render(100); enterDone(); }
    else enterDownloading();
  });
</script>
</body>
</html>
