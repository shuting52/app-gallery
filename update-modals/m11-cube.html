<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔方复原 · 版本更新</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(120% 100% at 50% 0%, #1c2138 0%, #0b0d18 60%, #06070d 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 20px; color: #fff;
  }
  .modal {
    width: 340px; background: rgba(255,255,255,.06);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.14); border-radius: 26px;
    padding: 24px; box-shadow: 0 24px 60px rgba(0,0,0,.5);
    display: flex; flex-direction: column; align-items: center;
  }
  .modal.hidden { display: none; }
  .head { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .ver { font-size: 11px; color: #8fd0ff; border: 1px solid rgba(143,208,255,.5); border-radius: 99px; padding: 3px 10px; background: rgba(143,208,255,.08); }
  .x { background: none; border: none; color: rgba(255,255,255,.4); font-size: 24px; cursor: pointer; line-height: 1; }
  .x:hover { color: #fff; }
  .sub { width: 100%; font-size: 14px; color: rgba(255,255,255,.72); margin-bottom: 4px; }
  .meta { width: 100%; font-size: 12px; color: rgba(255,255,255,.38); margin-bottom: 2px; font-variant-numeric: tabular-nums; }
  .pct { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; margin: 2px 0 4px; text-shadow: 0 0 24px rgba(143,208,255,.35); }
  .stage { width: 100%; display: flex; justify-content: center; padding: 6px 0 2px; }
  .scene { width: 190px; height: 190px; perspective: 700px; }
  .cube { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transform: rotateX(-24deg) rotateY(-32deg); }
  .cube.fast { animation: spinFast 1.1s linear infinite; }
  .cube.win { animation: spinWin 7s linear infinite; }
  @keyframes spinFast { from { transform: rotateX(-24deg) rotateY(-32deg); } to { transform: rotateX(-24deg) rotateY(328deg); } }
  @keyframes spinWin { from { transform: rotateX(-24deg) rotateY(-32deg); } to { transform: rotateX(-24deg) rotateY(328deg); } }
  .face {
    position: absolute; inset: 0; background: #14141c; border-radius: 16px;
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    gap: 5px; padding: 11px; border: 1px solid rgba(255,255,255,.08);
  }
  .f0 { transform: translateZ(95px); }
  .f1 { transform: rotateY(180deg) translateZ(95px); }
  .f2 { transform: rotateY(90deg) translateZ(95px); }
  .f3 { transform: rotateY(-90deg) translateZ(95px); }
  .f4 { transform: rotateX(90deg) translateZ(95px); }
  .f5 { transform: rotateX(-90deg) translateZ(95px); }
  .st { border-radius: 7px; transition: background-color .45s; }
  .done-badge {
    margin-top: 8px; font-size: 14px; color: #7dffb0; letter-spacing: 2px;
    opacity: 0; transform: scale(.8); transition: all .4s;
  }
  .done-badge.show { opacity: 1; transform: scale(1); }
  .main-btn {
    width: 100%; margin-top: 16px; padding: 15px 0; border: none; border-radius: 99px;
    font-size: 16px; font-weight: 600; letter-spacing: 2px; cursor: pointer;
    background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.16);
    transition: all .25s;
  }
  .main-btn:hover { background: rgba(255,255,255,.18); }
  .main-btn.gold { background: linear-gradient(135deg, #aee3ff, #5aa9ff); color: #08263f; border: none; box-shadow: 0 8px 28px rgba(90,169,255,.4); }
  .main-btn:disabled { opacity: .45; cursor: default; }
  .replay { margin-top: 12px; background: none; border: none; cursor: pointer; color: rgba(255,255,255,.35); font-size: 12.5px; letter-spacing: 1px; }
  .replay:hover { color: #8fd0ff; }
  .toast {
    position: fixed; top: 26px; left: 50%; transform: translateX(-50%) translateY(-16px);
    background: rgba(20,22,36,.94); color: #fff; border: 1px solid rgba(255,255,255,.14);
    padding: 10px 22px; border-radius: 99px; font-size: 14px; opacity: 0; pointer-events: none; z-index: 60;
    transition: opacity .25s, transform .25s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="modal" id="modal">
  <div class="head">
    <div class="title">🧊 魔方复原 <span class="ver">v4.0.0</span></div>
    <button class="x" id="xBtn">×</button>
  </div>
  <div class="sub" id="statusText">正在一块一块复原…</div>
  <div class="meta" id="metaText">0.0MB / 156.8MB · -- MB/s</div>
  <div class="pct" id="pctText">0%</div>
  <div class="stage">
    <div class="scene"><div class="cube" id="cube">
      <div class="face f0"></div><div class="face f1"></div><div class="face f2"></div>
      <div class="face f3"></div><div class="face f4"></div><div class="face f5"></div>
    </div></div>
  </div>
  <div class="done-badge" id="doneBadge">✦ 六面复原 · 安装成功 ✦</div>
  <button class="main-btn" id="mainBtn">取消更新</button>
  <button class="replay" id="replayBtn">↺ 重新演示</button>
</div>
<div class="toast" id="toast"></div>
<script>
  const cube = document.getElementById('cube');
  const pctText = document.getElementById('pctText');
  const statusText = document.getElementById('statusText');
  const metaText = document.getElementById('metaText');
  const mainBtn = document.getElementById('mainBtn');
  const modal = document.getElementById('modal');
  const doneBadge = document.getElementById('doneBadge');
  const toast = document.getElementById('toast');

  // 六面 solved 颜色：前绿 后蓝 右红 左橙 顶白 底黄
  const FACE_C = ['#00a651', '#0057b8', '#d22630', '#ff6a00', '#f2f2f2', '#ffd500'];
  const solvedCol = [], stickers = [];
  document.querySelectorAll('.face').forEach((f, fi) => {
    for (let i = 0; i < 9; i++) {
      const s = document.createElement('div');
      s.className = 'st';
      f.appendChild(s);
      stickers.push(s);
      solvedCol.push(FACE_C[fi]);
    }
  });
  // 确定性打乱（mulberry32）
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const scramCol = solvedCol.slice();
  const r = rng(20240613);
  for (let i = scramCol.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [scramCol[i], scramCol[j]] = [scramCol[j], scramCol[i]]; }

  const TOTAL = 156.8;
  let progress = 0, state = 'downloading', timer = null, showSpeed = 0;

  function render(p) {
    for (let i = 0; i < 54; i++) {
      const solved = p >= (i / 54) * 85;   // 按贴纸序号错峰复原
      if (stickers[i]._s !== solved) {
        stickers[i]._s = solved;
        stickers[i].style.background = solved ? solvedCol[i] : scramCol[i];
      }
    }
    if (!cube.classList.contains('fast') && !cube.classList.contains('win')) {
      cube.style.transform = 'rotateX(' + (-24 - p * 0.12) + 'deg) rotateY(' + (-32 + p * 1.6) + 'deg)';
    }
    pctText.textContent = Math.floor(p) + '%';
    const mb = (p / 100 * TOTAL).toFixed(1);
    metaText.textContent = mb + 'MB / ' + TOTAL + 'MB · ' + (state === 'downloading' ? showSpeed.toFixed(1) + ' MB/s' : '-- MB/s');
  }

  function showToast(m) { toast.textContent = m; toast.classList.add('show'); clearTimeout(showToast._t); showToast._t = setTimeout(() => toast.classList.remove('show'), 1800); }
  function setMain(t, gold, dis) { mainBtn.textContent = t; mainBtn.classList.toggle('gold', !!gold); mainBtn.disabled = !!dis; }

  function tick() {
    if (state !== 'downloading') return;
    const sp = 8 * (0.6 + Math.random() * 0.8);
    showSpeed = showSpeed * 0.7 + sp * 0.3;
    progress += sp * 0.1 / TOTAL * 100;
    if (progress >= 100) { progress = 100; render(progress); enterInstalling(); return; }
    render(progress);
  }
  function startTimer() { clearInterval(timer); timer = setInterval(tick, 100); }

  function enterDownloading(reset) {
    if (reset) { progress = 0; showSpeed = 0; cube.classList.remove('fast', 'win'); doneBadge.classList.remove('show'); }
    state = 'downloading';
    statusText.textContent = '正在一块一块复原…';
    setMain('取消更新', false, false);
    startTimer(); render(progress);
  }
  function enterCancelled() {
    state = 'cancelled'; clearInterval(timer);
    cube.classList.remove('fast', 'win');
    statusText.textContent = '复原已中断，魔方回到打乱态';
    setMain('重新下载', false, false);
    showToast('已取消更新');
  }
  function enterInstalling() {
    state = 'installing'; clearInterval(timer);
    cube.classList.add('fast');
    statusText.textContent = '六面归位，正在安装…';
    setMain('安装中…', false, true);
    setTimeout(() => { if (state === 'installing') enterDone(); }, 2000);
  }
  function enterDone() {
    state = 'done';
    cube.classList.remove('fast'); cube.classList.add('win');
    render(100);
    doneBadge.classList.add('show');
    statusText.textContent = '复原完成，欢迎体验新版本';
    setMain('立即体验', true, false);
    showToast('已更新到 v4.0.0');
  }

  mainBtn.addEventListener('click', () => {
    if (state === 'downloading') { progress = 0; render(0); enterCancelled(); }
    else if (state === 'cancelled') enterDownloading(true);
    else if (state === 'done') { modal.classList.add('hidden'); showToast('已进入 v4.0.0'); }
  });
  document.getElementById('xBtn').addEventListener('click', () => {
    if (state === 'downloading') { progress = 0; render(0); enterCancelled(); }
    else modal.classList.add('hidden');
  });
  document.getElementById('replayBtn').addEventListener('click', () => { modal.classList.remove('hidden'); enterDownloading(true); });

  window.addEventListener('load', () => {
    if (location.hash.includes('notrans')) { const st = document.createElement('style'); st.textContent = '*{transition:none!important;animation:none!important}'; document.head.appendChild(st); }
    enterDownloading(false);
    if (location.hash.includes('mid')) { clearInterval(timer); progress = 55; render(55); }
    if (location.hash.includes('done')) { progress = 100; render(100); enterInstalling(); }
  });
</script>
</body>
</html>
