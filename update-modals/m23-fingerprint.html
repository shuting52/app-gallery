<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>指纹解锁 · 更新 v4.0.0</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(120% 100% at 50% 0%, #101c3a 0%, #060a18 60%, #03050d 100%);
    padding: 20px;
  }
  .backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.35); }
  .modal {
    position: relative; width: 330px;
    background: rgba(13, 20, 40, 0.92);
    border-radius: 26px; padding: 22px;
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(120,170,255,.15);
    border: 1px solid rgba(90, 140, 255, 0.22);
  }
  .modal.hidden { display: none; }
  .m-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .m-title { font-size: 17px; font-weight: 700; color: #dbe7ff; display: flex; align-items: center; gap: 8px; }
  .ver { font-size: 11px; font-weight: 600; color: #8fb4ff; background: rgba(90,140,255,.16); border: 1px solid rgba(90,140,255,.35); border-radius: 99px; padding: 3px 10px; }
  .x { background: none; border: none; font-size: 24px; color: #4a5a80; cursor: pointer; line-height: 1; padding: 2px 6px; }
  .x:hover { color: #dbe7ff; }
  .m-sub { font-size: 13.5px; color: #8fa3cf; margin-bottom: 2px; }
  .m-meta { font-size: 12px; color: #4a5a80; margin-bottom: 10px; font-variant-numeric: tabular-nums; }
  .stage { position: relative; height: 250px; display: flex; align-items: center; justify-content: center; }
  .stage canvas { width: 240px; height: 240px; }
  .pct { text-align: center; font-size: 34px; font-weight: 800; color: #dbe7ff; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .pct.ok { color: #4ade80; }
  .main-btn {
    width: 100%; margin-top: 12px; padding: 14px 0; border: none; border-radius: 99px;
    font-size: 16px; font-weight: 600; cursor: pointer; letter-spacing: 2px;
    background: rgba(90,140,255,.16); color: #8fb4ff; border: 1px solid rgba(90,140,255,.3);
  }
  .main-btn:hover { background: rgba(90,140,255,.24); }
  .main-btn.gold { background: linear-gradient(135deg, #4ade80, #16a34a); color: #fff; border: none; box-shadow: 0 8px 22px rgba(34,197,94,.35); }
  .main-btn:disabled { opacity: .5; cursor: default; }
  .replay { display: block; margin: 10px auto 0; background: none; border: none; color: #4a5a80; font-size: 12.5px; cursor: pointer; letter-spacing: 1px; }
  .replay:hover { color: #8fb4ff; }
  .toast {
    position: fixed; top: 26px; left: 50%; transform: translateX(-50%) translateY(-16px);
    background: rgba(13,20,40,.95); color: #dbe7ff; border: 1px solid rgba(90,140,255,.3);
    padding: 10px 22px; border-radius: 99px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 60;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="backdrop"></div>
<div class="modal" id="modal">
  <div class="m-head">
    <div class="m-title">指纹解锁 <span class="ver">v4.0.0</span></div>
    <button class="x" id="xBtn">×</button>
  </div>
  <div class="m-sub" id="statusText">正在验证指纹…</div>
  <div class="m-meta" id="metaText">0.0MB / 156.8MB · -- MB/s</div>

  <div class="stage"><canvas id="cv" width="240" height="240"></canvas></div>

  <div class="pct" id="pctText">0%</div>
  <button class="main-btn" id="mainBtn">取消更新</button>
  <button class="replay" id="replayBtn">↺ 重新演示</button>
</div>
<div class="toast" id="toast"></div>

<script>
  const modal = document.getElementById('modal');
  const statusText = document.getElementById('statusText');
  const metaText = document.getElementById('metaText');
  const pctText = document.getElementById('pctText');
  const mainBtn = document.getElementById('mainBtn');
  const toast = document.getElementById('toast');
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const W = 240, CX = 120, CY = 120, RINGS = 12;

  const TOTAL = 156.8;
  let progress = 0, dispP = 0, state = 'downloading', timer = null, showSpeed = 0;
  let tickN = 0, greenBlend = 0, pulseT = 0, dim = 1;

  function showToast(m) {
    toast.textContent = m; toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 1800);
  }
  function setMain(t, gold, dis) {
    mainBtn.textContent = t;
    mainBtn.classList.toggle('gold', !!gold);
    mainBtn.disabled = !!dis;
  }
  function mixc(a, b, t) {
    return 'rgb(' + Math.round(a[0]+(b[0]-a[0])*t) + ',' + Math.round(a[1]+(b[1]-a[1])*t) + ',' + Math.round(a[2]+(b[2]-a[2])*t) + ')';
  }
  const BLUE = [96, 150, 255], GREEN = [74, 222, 128];

  function draw() {
    ctx.clearRect(0, 0, W, W);
    const p = dispP / 100;
    const col = mixc(BLUE, GREEN, greenBlend);
    // 12 圈波浪指纹纹路
    for (let i = 0; i < RINGS; i++) {
      const reveal = Math.min(Math.max(p * RINGS - i, 0), 1);
      if (reveal <= 0) continue;
      const R = 20 + i * 8.2;
      ctx.strokeStyle = col;
      ctx.globalAlpha = reveal * 0.9 * dim;
      ctx.lineWidth = 3.2;
      ctx.beginPath();
      const SEG = 72;
      for (let s = 0; s <= SEG; s++) {
        const a = (s / SEG) * Math.PI * 2;
        const rr = R + 5.5 * Math.sin(5 * a + i * 0.75) + 2.5 * Math.sin(9 * a + i * 1.3);
        const x = CX + rr * Math.cos(a), y = CY + rr * Math.sin(a);
        if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath(); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // 扫描线（tick 驱动，上下扫动）
    if (state === 'downloading') {
      const sy = CY + 105 * Math.sin(tickN * 0.16);
      const g = ctx.createLinearGradient(0, sy - 14, 0, sy + 14);
      g.addColorStop(0, 'rgba(96,150,255,0)');
      g.addColorStop(0.5, 'rgba(150,190,255,' + (0.35 * dim) + ')');
      g.addColorStop(1, 'rgba(96,150,255,0)');
      ctx.fillStyle = g;
      ctx.fillRect(14, sy - 14, W - 28, 28);
      ctx.fillStyle = 'rgba(150,190,255,' + (0.8 * dim) + ')';
      ctx.fillRect(14, sy - 1, W - 28, 2);
    }
    // 解锁脉冲波纹
    if (pulseT > 0) {
      for (let k = 0; k < 3; k++) {
        const pt = (pulseT + k * 0.33) % 1;
        ctx.strokeStyle = 'rgba(74,222,128,' + ((1 - pt) * 0.7) + ')';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(CX, CY, 30 + pt * 95, 0, Math.PI * 2); ctx.stroke();
      }
    }
  }

  function render(p) {
    pctText.textContent = Math.floor(p) + '%';
    const mb = (p / 100 * TOTAL).toFixed(1);
    metaText.textContent = mb + 'MB / ' + TOTAL + 'MB · ' + (state === 'downloading' ? showSpeed.toFixed(1) + ' MB/s' : '-- MB/s');
  }
  function resetConcept() {
    dispP = 0; greenBlend = 0; pulseT = 0; dim = 1; tickN = 0;
    pctText.classList.remove('ok');
    draw();
  }

  function tick() {
    tickN++;
    if (state === 'downloading') {
      const sp = 8 * (0.6 + Math.random() * 0.8);
      showSpeed = showSpeed * 0.7 + sp * 0.3;
      progress += sp * 0.1 / TOTAL * 100;
      if (progress >= 100) { progress = 100; dispP = 100; render(progress); draw(); enterInstalling(); return; }
    } else if (state === 'installing') {
      greenBlend = Math.min(greenBlend + 1 / 14, 1);
      pulseT += 1 / 22;
      if (greenBlend >= 1 && pulseT > 1.1) { enterDone(); return; }
    }
    dispP += (progress - dispP) * 0.25;
    if (Math.abs(progress - dispP) < 0.05) dispP = progress;
    render(progress); draw();
  }
  function startTimer() { clearInterval(timer); timer = setInterval(tick, 100); }

  function enterDownloading() {
    state = 'downloading';
    statusText.textContent = '正在验证指纹…';
    setMain('取消更新', false, false);
    startTimer();
  }
  function enterCancelled() {
    state = 'cancelled'; clearInterval(timer); dim = 0.35;
    statusText.textContent = '验证已取消';
    metaText.textContent = (progress / 100 * TOTAL).toFixed(1) + 'MB / ' + TOTAL + 'MB · 已停止';
    setMain('重新下载', false, false);
    draw();
    showToast('已取消更新');
  }
  function enterInstalling() {
    state = 'installing';
    statusText.textContent = '指纹匹配，正在解锁…';
    setMain('解锁中…', false, true);
  }
  function enterDone() {
    state = 'done'; clearInterval(timer);
    greenBlend = 1; pulseT = 0.01; dispP = 100;
    statusText.textContent = '解锁成功，欢迎回来';
    metaText.textContent = 'v4.0.0 · 指纹验证通过';
    pctText.textContent = '100%';
    pctText.classList.add('ok');
    setMain('立即体验', true, false);
    draw();
    showToast('已更新到 v4.0.0');
  }

  mainBtn.addEventListener('click', () => {
    if (state === 'downloading') enterCancelled();
    else if (state === 'cancelled') { progress = 0; showSpeed = 0; resetConcept(); enterDownloading(); }
    else if (state === 'done') { modal.classList.add('hidden'); showToast('已进入 v4.0.0'); }
  });
  document.getElementById('xBtn').addEventListener('click', () => {
    if (state === 'downloading') enterCancelled();
    else modal.classList.add('hidden');
  });
  document.getElementById('replayBtn').addEventListener('click', () => {
    modal.classList.remove('hidden');
    progress = 0; showSpeed = 0; resetConcept(); enterDownloading();
    showToast('重新开始演示');
  });

  window.addEventListener('load', () => {
    draw();
    if (location.hash === '#done') { progress = 100; dispP = 100; render(100); enterDone(); }
    else enterDownloading();
  });
</script>
</body>
</html>
