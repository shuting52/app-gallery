<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>开锁 · 版本更新</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(110% 90% at 50% 20%, #232a3d 0%, #12141d 60%, #0a0b11 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 20px; color: #fff;
  }
  .modal {
    width: 340px; background: rgba(255,255,255,.055);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.13); border-radius: 26px;
    padding: 24px; box-shadow: 0 24px 60px rgba(0,0,0,.55);
    display: flex; flex-direction: column; align-items: center;
  }
  .modal.hidden { display: none; }
  .head { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .ver { font-size: 11px; color: #ffd66e; border: 1px solid rgba(255,214,110,.5); border-radius: 99px; padding: 3px 10px; background: rgba(255,214,110,.08); }
  .x { background: none; border: none; color: rgba(255,255,255,.4); font-size: 24px; cursor: pointer; line-height: 1; }
  .x:hover { color: #fff; }
  .sub { width: 100%; font-size: 14px; color: rgba(255,255,255,.72); margin-bottom: 4px; }
  .meta { width: 100%; font-size: 12px; color: rgba(255,255,255,.38); margin-bottom: 2px; font-variant-numeric: tabular-nums; }
  .pct { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; margin: 2px 0 6px; text-shadow: 0 0 24px rgba(255,214,110,.3); }
  .stage { position: relative; width: 220px; }
  .stage svg { display: block; width: 100%; height: auto; }
  .pinmove { transition: transform .35s cubic-bezier(.3,1.4,.5,1); }
  .pinpulse.click { animation: pinClick .32s ease; transform-origin: center; transform-box: fill-box; }
  @keyframes pinClick { 0% { transform: scaleY(1); } 40% { transform: scaleY(1.22); } 100% { transform: scaleY(1); } }
  #shackleG { transform-origin: 138px 98px; transition: transform .55s cubic-bezier(.3,1.6,.5,1); }
  #shackleG.open { transform: rotate(-38deg); }
  .flash {
    position: absolute; left: 50%; top: 34%; width: 190px; height: 190px;
    margin: -95px 0 0 -95px; border-radius: 50%; pointer-events: none; opacity: 0;
    background: radial-gradient(circle, rgba(255,225,150,.9) 0%, rgba(255,200,90,.3) 45%, transparent 70%);
  }
  .flash.go { animation: flashA 1s ease-out forwards; }
  @keyframes flashA { 0% { opacity: 0; transform: scale(.4); } 30% { opacity: 1; } 100% { opacity: 0; transform: scale(1.9); } }
  .pins-label { text-align: center; font-size: 12px; color: rgba(255,255,255,.45); margin-top: 2px; letter-spacing: 1px; }
  .pins-label b { color: #ffd66e; }
  .main-btn {
    width: 100%; margin-top: 16px; padding: 15px 0; border: none; border-radius: 99px;
    font-size: 16px; font-weight: 600; letter-spacing: 2px; cursor: pointer;
    background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.16);
    transition: all .25s;
  }
  .main-btn:hover { background: rgba(255,255,255,.18); }
  .main-btn.gold { background: linear-gradient(135deg, #ffe9a8, #f0b73f); color: #3a2a08; border: none; box-shadow: 0 8px 28px rgba(240,183,63,.4); }
  .main-btn:disabled { opacity: .45; cursor: default; }
  .replay { margin-top: 12px; background: none; border: none; cursor: pointer; color: rgba(255,255,255,.35); font-size: 12.5px; letter-spacing: 1px; }
  .replay:hover { color: #ffd66e; }
  .toast {
    position: fixed; top: 26px; left: 50%; transform: translateX(-50%) translateY(-16px);
    background: rgba(20,22,36,.94); color: #fff; border: 1px solid rgba(255,255,255,.14);
    padding: 10px 22px; border-radius: 99px; font-size: 14px; opacity: 0; pointer-events: none; z-index: 60;
    transition: opacity .25s, transform .25s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="modal" id="modal">
  <div class="head">
    <div class="title">🔓 开锁 <span class="ver">v4.0.0</span></div>
    <button class="x" id="xBtn">×</button>
  </div>
  <div class="sub" id="statusText">正在逐个顶起弹子…</div>
  <div class="meta" id="metaText">0.0MB / 156.8MB · -- MB/s</div>
  <div class="pct" id="pctText">0%</div>
  <div class="stage">
    <svg viewBox="0 0 200 240" id="lockSvg">
      <defs>
        <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#7d8798"/><stop offset=".5" stop-color="#e6ebf4"/><stop offset="1" stop-color="#7d8798"/>
        </linearGradient>
        <linearGradient id="brassG" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#9a741f"/><stop offset=".5" stop-color="#f0cd6e"/><stop offset="1" stop-color="#9a741f"/>
        </linearGradient>
        <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#39415a"/><stop offset="1" stop-color="#1d2233"/>
        </linearGradient>
      </defs>
      <!-- 锁梁 -->
      <g id="shackleG">
        <path d="M62,100 L62,62 A38,38 0 0 1 138,62 L138,100" fill="none" stroke="url(#steel)" stroke-width="14" stroke-linecap="round"/>
      </g>
      <!-- 锁体 -->
      <rect x="42" y="94" width="116" height="106" rx="18" fill="url(#bodyG)" stroke="rgba(255,255,255,.14)" stroke-width="1.5"/>
      <!-- 剪切线 -->
      <line x1="52" y1="136" x2="148" y2="136" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="6 4" opacity=".85"/>
      <text x="152" y="139" font-size="9" fill="#ff6b6b" opacity=".8">剪切线</text>
      <!-- 弹子仓（JS 生成弹子） -->
      <g id="pins"></g>
      <!-- 钥匙孔装饰 -->
      <circle cx="100" cy="178" r="7" fill="#0c0e14" stroke="rgba(255,255,255,.2)" stroke-width="1.5"/>
      <rect x="97" y="182" width="6" height="10" rx="3" fill="#0c0e14"/>
    </svg>
    <div class="flash" id="flash"></div>
    <div class="pins-label" id="pinsLabel">已顶起 <b id="pinsCount">0</b> / 5 根弹子</div>
  </div>
  <button class="main-btn" id="mainBtn">取消更新</button>
  <button class="replay" id="replayBtn">↺ 重新演示</button>
</div>
<div class="toast" id="toast"></div>
<script>
  const pctText = document.getElementById('pctText');
  const statusText = document.getElementById('statusText');
  const metaText = document.getElementById('metaText');
  const mainBtn = document.getElementById('mainBtn');
  const modal = document.getElementById('modal');
  const toast = document.getElementById('toast');
  const shackleG = document.getElementById('shackleG');
  const flash = document.getElementById('flash');
  const pinsCount = document.getElementById('pinsCount');
  const pinsG = document.getElementById('pins');

  // 5 根弹子：剪切线 y=136；每根初始下沉 depth，set 后顶起到剪切线
  const SHEAR = 136, XS = [66, 86, 106, 126, 146], DEPTH = [16, 24, 12, 28, 20], TH = [15, 35, 55, 75, 95];
  const NS = 'http://www.w3.org/2000/svg';
  const pins = [];
  XS.forEach((x, i) => {
    const slot = document.createElementNS(NS, 'rect');
    slot.setAttribute('x', x - 8); slot.setAttribute('y', 100);
    slot.setAttribute('width', 16); slot.setAttribute('height', 66);
    slot.setAttribute('rx', 5); slot.setAttribute('fill', '#0c0e14');
    pinsG.appendChild(slot);
    const outer = document.createElementNS(NS, 'g');
    outer.setAttribute('transform', 'translate(' + x + ',' + (SHEAR - 20) + ')');
    const move = document.createElementNS(NS, 'g');
    move.setAttribute('class', 'pinmove');
    const pulse = document.createElementNS(NS, 'g');
    pulse.setAttribute('class', 'pinpulse');
    const driver = document.createElementNS(NS, 'rect');
    driver.setAttribute('x', -5); driver.setAttribute('y', 0);
    driver.setAttribute('width', 10); driver.setAttribute('height', 20); driver.setAttribute('rx', 3);
    driver.setAttribute('fill', '#8a93a5');
    const key = document.createElementNS(NS, 'rect');
    key.setAttribute('x', -5); key.setAttribute('y', 20);
    key.setAttribute('width', 10); key.setAttribute('height', 30); key.setAttribute('rx', 3);
    key.setAttribute('fill', 'url(#brassG)');
    pulse.appendChild(driver); pulse.appendChild(key);
    move.appendChild(pulse); outer.appendChild(move); pinsG.appendChild(outer);
    move.style.transform = 'translateY(' + DEPTH[i] + 'px)';
    pins.push({ move, pulse, set: false });
  });

  const TOTAL = 156.8;
  let progress = 0, state = 'downloading', timer = null, showSpeed = 0;

  function setPin(i, on) {
    const p = pins[i];
    if (p.set === on) return;
    p.set = on;
    p.move.style.transform = on ? 'translateY(0px)' : 'translateY(' + DEPTH[i] + 'px)';
    if (on) { p.pulse.classList.remove('click'); void p.pulse.getBoundingClientRect; p.pulse.classList.add('click'); }
  }
  function render(p) {
    let n = 0;
    TH.forEach((th, i) => { const on = p >= th; setPin(i, on); if (on) n++; });
    pinsCount.textContent = n;
    pctText.textContent = Math.floor(p) + '%';
    const mb = (p / 100 * TOTAL).toFixed(1);
    metaText.textContent = mb + 'MB / ' + TOTAL + 'MB · ' + (state === 'downloading' ? showSpeed.toFixed(1) + ' MB/s' : '-- MB/s');
  }
  function showToast(m) { toast.textContent = m; toast.classList.add('show'); clearTimeout(showToast._t); showToast._t = setTimeout(() => toast.classList.remove('show'), 1800); }
  function setMain(t, gold, dis) { mainBtn.textContent = t; mainBtn.classList.toggle('gold', !!gold); mainBtn.disabled = !!dis; }

  function tick() {
    if (state !== 'downloading') return;
    const sp = 8 * (0.6 + Math.random() * 0.8);
    showSpeed = showSpeed * 0.7 + sp * 0.3;
    progress += sp * 0.1 / TOTAL * 100;
    if (progress >= 100) { progress = 100; render(progress); enterInstalling(); return; }
    render(progress);
  }
  function startTimer() { clearInterval(timer); timer = setInterval(tick, 100); }

  function enterDownloading(reset) {
    if (reset) { progress = 0; showSpeed = 0; shackleG.classList.remove('open'); flash.classList.remove('go'); }
    state = 'downloading';
    statusText.textContent = '正在逐个顶起弹子…';
    setMain('取消更新', false, false);
    startTimer(); render(progress);
  }
  function enterCancelled() {
    state = 'cancelled'; clearInterval(timer);
    shackleG.classList.remove('open');
    statusText.textContent = '弹子落回，上锁了';
    setMain('重新下载', false, false);
    showToast('已取消更新');
  }
  function enterInstalling() {
    state = 'installing'; clearInterval(timer);
    shackleG.classList.add('open');
    flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
    statusText.textContent = '咔哒！锁开了，正在安装…';
    setMain('安装中…', false, true);
    setTimeout(() => { if (state === 'installing') enterDone(); }, 2000);
  }
  function enterDone() {
    state = 'done';
    render(100);
    statusText.textContent = '开锁成功，欢迎体验新版本';
    setMain('立即体验', true, false);
    showToast('已更新到 v4.0.0');
  }

  mainBtn.addEventListener('click', () => {
    if (state === 'downloading') { progress = 0; render(0); enterCancelled(); }
    else if (state === 'cancelled') enterDownloading(true);
    else if (state === 'done') { modal.classList.add('hidden'); showToast('已进入 v4.0.0'); }
  });
  document.getElementById('xBtn').addEventListener('click', () => {
    if (state === 'downloading') { progress = 0; render(0); enterCancelled(); }
    else modal.classList.add('hidden');
  });
  document.getElementById('replayBtn').addEventListener('click', () => { modal.classList.remove('hidden'); enterDownloading(true); });

  window.addEventListener('load', () => {
    if (location.hash.includes('notrans')) { const st = document.createElement('style'); st.textContent = '*{transition:none!important;animation:none!important}'; document.head.appendChild(st); }
    enterDownloading(false);
    if (location.hash.includes('mid')) { clearInterval(timer); progress = 55; render(55); }
    if (location.hash.includes('done')) { progress = 100; render(100); enterInstalling(); }
  });
</script>
</body>
</html>
