<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>版本更新 · 黏土可爱</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    background: #ffe9d6;
    background-image: radial-gradient(#f5d9bd 1.5px, transparent 1.5px);
    background-size: 26px 26px;
    padding: 24px 16px; position: relative;
  }
  .scrim { position: fixed; inset: 0; background: rgba(120,80,40,.12); pointer-events: none; }
  .modal {
    position: relative; z-index: 2;
    width: 340px; max-width: 100%;
    background: #fffdf9;
    border: 3px solid #4a3a32;
    border-radius: 30px;
    box-shadow: 8px 8px 0 #4a3a32;
    padding: 26px 24px;
  }
  .modal.hidden { display: none; }
  .header { display: flex; justify-content: space-between; align-items: center; }
  .title { font-size: 19px; font-weight: 800; color: #4a3a32; display: flex; align-items: center; gap: 8px; }
  .ver { font-size: 11px; font-weight: 800; color: #fff; background: #ff8fab; border: 2px solid #4a3a32; padding: 2px 10px; border-radius: 99px; }
  .close { background: #ffe9d6; border: 2px solid #4a3a32; border-radius: 50%; width: 30px; height: 30px; font-size: 16px; color: #4a3a32; cursor: pointer; line-height: 1; }
  .close:active { transform: scale(.92); }
  .status { font-size: 15px; font-weight: 700; color: #4a3a32; margin: 14px 0 4px; }
  .meta { font-size: 12px; color: #a08a76; margin-bottom: 18px; font-variant-numeric: tabular-nums; }
  .bignum { font-size: 42px; font-weight: 800; color: #4a3a32; text-align: center; font-variant-numeric: tabular-nums; margin-bottom: 12px; }
  .bignum small { font-size: 18px; }
  .bignum.hidden { display: none; }
  .bartrack { height: 30px; border: 3px solid #4a3a32; border-radius: 99px; background: #f3e2cf; box-shadow: inset 0 3px 0 rgba(0,0,0,.08); overflow: hidden; margin-bottom: 26px; }
  .bartrack.hidden { display: none; }
  .fill { height: 100%; width: 0%; border-radius: 99px; background: linear-gradient(180deg,#ffc7d9,#ff8fab); position: relative; transition: width .18s cubic-bezier(.34,1.4,.64,1); }
  .fill::after { content: ""; position: absolute; top: 4px; left: 10px; right: 10px; height: 8px; background: rgba(255,255,255,.55); border-radius: 99px; }
  .dots { display: none; justify-content: center; gap: 14px; margin: 20px 0 26px; }
  .dots.show { display: flex; }
  .dot { width: 24px; height: 24px; border-radius: 50%; border: 3px solid #4a3a32; animation: bnc .7s ease-in-out infinite; }
  .dot:nth-child(1) { background: #ff8fab; }
  .dot:nth-child(2) { background: #ffd166; animation-delay: .12s; }
  .dot:nth-child(3) { background: #8fd6b4; animation-delay: .24s; }
  @keyframes bnc { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  .badge { display: none; text-align: center; margin-bottom: 22px; }
  .badge.show { display: block; }
  .badge .c { width: 86px; height: 86px; border-radius: 50%; background: #8fd6b4; border: 3px solid #4a3a32; box-shadow: 4px 4px 0 #4a3a32; display: inline-flex; align-items: center; justify-content: center; }
  .mainbtn { width: 100%; padding: 14px; border: 3px solid #4a3a32; border-radius: 99px; font-size: 16px; font-weight: 800; color: #4a3a32; background: #ff8fab; cursor: pointer; box-shadow: 4px 4px 0 #4a3a32; }
  .mainbtn:disabled { opacity: .55; cursor: default; }
  .mainbtn:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 #4a3a32; }
  .replay { display: block; margin: 14px auto 0; background: none; border: none; color: #a08a76; font-size: 13px; font-weight: 700; cursor: pointer; }
  .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-12px); background: #4a3a32; color: #fffdf9; font-size: 14px; font-weight: 700; padding: 10px 22px; border-radius: 99px; border: 2px solid #4a3a32; box-shadow: 3px 3px 0 rgba(74,58,50,.35); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 10; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="scrim"></div>

<div class="modal" id="modal">
  <div class="header">
    <div class="title">🍰 版本更新 <span class="ver">v3.3.1</span></div>
    <button class="close" id="closeBtn">&times;</button>
  </div>
  <div class="status" id="statusText">正在下载 3.3.1</div>
  <div class="meta" id="metaText">0.0MB / 156.8MB · -- MB/s</div>
  <div class="bignum" id="bigNum"><span id="percentText">0</span><small>%</small></div>
  <div class="bartrack" id="bartrack"><div class="fill" id="fill"></div></div>
  <div class="dots" id="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="badge" id="badge">
    <div class="c">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#4a3a32" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
  </div>
  <button class="mainbtn" id="mainBtn">取消更新</button>
  <button class="replay" id="replayBtn">↺ 重新演示</button>
</div>

<div class="toast" id="toast"></div>

<script>
  const TOTAL_MB = 156.8, VERSION = '3.3.1';
  let progress = 0, state = 'downloading', timer = null, baseSpeed = 8, showSpeed = 0;
  const $ = id => document.getElementById(id);
  const percentText = $('percentText'), metaText = $('metaText'), statusText = $('statusText'),
        mainBtn = $('mainBtn'), toastEl = $('toast'), modal = $('modal'),
        fill = $('fill'), bartrack = $('bartrack'), bigNum = $('bigNum'),
        dots = $('dots'), badge = $('badge');

  function toast(m) {
    toastEl.textContent = m; toastEl.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }
  function render() {
    percentText.textContent = Math.floor(progress);
    fill.style.width = progress + '%';
    metaText.textContent = (progress / 100 * TOTAL_MB).toFixed(1) + 'MB / ' + TOTAL_MB + 'MB · ' + showSpeed.toFixed(1) + ' MB/s';
  }
  function tick() {
    if (state !== 'downloading') return;
    const sp = baseSpeed * (0.6 + Math.random() * 0.8);
    showSpeed = showSpeed * 0.7 + sp * 0.3;
    progress += sp * 0.1 / TOTAL_MB * 100;
    if (progress >= 100) { progress = 100; render(); enterInstalling(); return; }
    render();
  }
  function startTimer() { clearInterval(timer); timer = setInterval(tick, 100); }
  function stopTimer() { clearInterval(timer); timer = null; }
  function setMain(label, disabled) { mainBtn.textContent = label; mainBtn.disabled = !!disabled; }
  function showStage(s) {
    const dl = (s === 'downloading' || s === 'cancelled');
    bigNum.classList.toggle('hidden', !dl);
    bartrack.classList.toggle('hidden', !dl);
    dots.classList.toggle('show', s === 'installing');
    badge.classList.toggle('show', s === 'done');
  }

  function enterDownloading(fresh) {
    state = 'downloading';
    if (fresh) { progress = 0; showSpeed = 0; }
    showStage('downloading');
    statusText.textContent = '正在下载 ' + VERSION;
    setMain('取消更新', false);
    startTimer(); render();
  }
  function enterCancelled() {
    state = 'cancelled'; stopTimer();
    showStage('cancelled');
    statusText.textContent = '已取消下载';
    metaText.textContent = (progress / 100 * TOTAL_MB).toFixed(1) + 'MB / ' + TOTAL_MB + 'MB · 已停止';
    setMain('重新下载', false);
    toast('已取消下载');
  }
  function enterInstalling() {
    state = 'installing'; stopTimer();
    showStage('installing');
    statusText.textContent = '正在安装...';
    metaText.textContent = TOTAL_MB + 'MB / ' + TOTAL_MB + 'MB · 校验完成';
    setMain('安装中...', true);
    setTimeout(() => { if (state === 'installing') enterDone(); }, 2600);
  }
  function enterDone() {
    state = 'done';
    showStage('done');
    statusText.textContent = '更新完成';
    metaText.textContent = VERSION + ' 已安装 · 重启后生效';
    setMain('立即体验', false);
    toast('已更新到最新版本');
  }

  mainBtn.onclick = () => {
    if (state === 'downloading') enterCancelled();
    else if (state === 'cancelled') enterDownloading(true);
    else if (state === 'done') { modal.classList.add('hidden'); toast('已更新到 ' + VERSION); }
  };
  $('closeBtn').onclick = () => {
    if (state === 'downloading') enterCancelled();
    else modal.classList.add('hidden');
  };
  $('replayBtn').onclick = () => { modal.classList.remove('hidden'); enterDownloading(true); toast('重新开始演示'); };

  window.addEventListener('load', () => {
    if (location.hash === '#done') {
      enterDownloading(true); progress = 100; render(); enterInstalling();
      setTimeout(() => enterDone(), 400);
    } else enterDownloading(true);
  });
</script>
</body>
</html>
