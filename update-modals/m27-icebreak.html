<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>破冰更新 · v4.0.0</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(120% 100% at 50% 0%, #28425f 0%, #12253c 60%, #0a1626 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 20px; color: #0e2233;
  }
  .modal {
    width: 340px; background: rgba(232,241,250,.92);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,.7); border-radius: 26px;
    padding: 24px 24px 22px; display: flex; flex-direction: column; align-items: center;
    box-shadow: 0 24px 60px rgba(4,12,24,.45), inset 0 1px 0 #fff;
  }
  .modal.hidden { display: none; }
  .m-head { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .m-title { font-size: 18px; font-weight: 700; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; color: #0e2233; }
  .m-title .ic { color: #2b7bbb; }
  .ver { font-size: 11px; color: #1c6aa8; border: 1px solid rgba(43,123,187,.45); border-radius: 99px; padding: 3px 10px; background: rgba(43,123,187,.08); }
  .x { background: none; border: none; color: rgba(14,34,51,.4); font-size: 24px; cursor: pointer; line-height: 1; }
  .x:hover { color: #0e2233; }
  .m-sub { width: 100%; font-size: 14px; color: rgba(14,34,51,.75); margin-bottom: 4px; text-align: left; }
  .m-meta { width: 100%; font-size: 12px; color: rgba(14,34,51,.42); margin-bottom: 10px; text-align: left; font-variant-numeric: tabular-nums; }

  .stage { position: relative; width: 260px; height: 260px; margin: 4px 0 2px; border-radius: 18px; overflow: hidden; transition: opacity .4s; box-shadow: inset 0 0 0 1px rgba(43,123,187,.25), 0 8px 24px rgba(20,60,100,.18); }
  .stage.dim { opacity: .5; }
  .stage canvas { position: absolute; inset: 0; transition: opacity .8s; }
  .stage.shattered canvas { opacity: 0; }
  .stage.flash canvas { animation: iceflash .5s ease-in-out 3; }
  @keyframes iceflash { 50% { filter: brightness(1.6); } }
  .water {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, #0a2f56 0%, #06182e 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  }
  .water .wv { font-size: 34px; font-weight: 800; letter-spacing: 8px; color: #bfe3ff; text-shadow: 0 0 26px rgba(90,170,255,.6); }
  .water .wv2 { font-size: 13px; letter-spacing: 4px; color: rgba(191,227,255,.65); }
  .bubble { position: absolute; bottom: -16px; border-radius: 50%; background: rgba(160,210,250,.25); border: 1px solid rgba(160,210,250,.4); animation: rise linear infinite; }
  .bubble.b1 { left: 22%; width: 12px; height: 12px; animation-duration: 3.2s; }
  .bubble.b2 { left: 58%; width: 8px; height: 8px; animation-duration: 2.4s; animation-delay: 1s; }
  .bubble.b3 { left: 76%; width: 15px; height: 15px; animation-duration: 4s; animation-delay: .4s; }
  @keyframes rise { to { transform: translateY(-300px); opacity: 0; } }

  .pct-row { display: flex; align-items: baseline; gap: 8px; margin-top: 8px; }
  .pct { font-size: 40px; font-weight: 800; color: #1668a8; font-variant-numeric: tabular-nums; }
  .pct-lbl { font-size: 12px; color: rgba(14,34,51,.45); letter-spacing: 2px; }
  .done-badge { display: none; align-items: center; gap: 8px; margin-top: 8px; color: #1668a8; font-size: 15px; font-weight: 700; letter-spacing: 2px; }
  .done-badge.show { display: flex; animation: pop .5s cubic-bezier(.2,1.5,.4,1); }
  .done-badge .ck { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, #7cc4f5, #1c6aa8); color: #fff; font-weight: 900; display: flex; align-items: center; justify-content: center; }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .main-btn {
    width: 100%; margin-top: 16px; padding: 14px 0; border-radius: 99px; border: 1px solid rgba(22,104,168,.3);
    background: rgba(22,104,168,.08); color: #1668a8;
    font-size: 16px; font-weight: 600; letter-spacing: 2px; cursor: pointer; transition: all .25s;
  }
  .main-btn:hover { background: rgba(22,104,168,.15); }
  .main-btn.gold { background: linear-gradient(135deg, #2b8fd4, #1668a8); color: #fff; border: none; box-shadow: 0 8px 26px rgba(28,106,168,.35); }
  .main-btn:disabled { opacity: .45; cursor: default; }
  .replay { margin-top: 12px; background: none; border: none; color: rgba(14,34,51,.4); font-size: 12.5px; cursor: pointer; letter-spacing: 1px; }
  .replay:hover { color: #1668a8; }
  .toast {
    position: fixed; top: 26px; left: 50%; transform: translateX(-50%) translateY(-16px);
    background: rgba(10,25,42,.94); border: 1px solid rgba(120,180,230,.3); color: #e8f3fd;
    padding: 10px 22px; border-radius: 99px; font-size: 14px; opacity: 0; pointer-events: none; z-index: 60;
    transition: opacity .25s, transform .25s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="modal" id="modal">
  <div class="m-head">
    <div class="m-title"><span class="ic">❄</span> 破冰更新 <span class="ver">v4.0.0</span></div>
    <button class="x" id="xBtn">×</button>
  </div>
  <div class="m-sub" id="statusText">冰面正在裂开，新版本在水下等待</div>
  <div class="m-meta" id="metaText">0.0MB / 156.8MB · -- MB/s</div>

  <div class="stage" id="stage">
    <div class="water">
      <div class="wv">新版本</div>
      <div class="wv2">v4.0.0 · 破冰而出</div>
      <span class="bubble b1"></span><span class="bubble b2"></span><span class="bubble b3"></span>
    </div>
    <canvas id="cv" width="260" height="260"></canvas>
  </div>

  <div class="pct-row"><div class="pct" id="pctText">0%</div><div class="pct-lbl" id="stageLabel">碎裂中</div></div>
  <div class="done-badge" id="doneBadge"><span class="ck">✓</span> 破冰成功 · 安装完成</div>

  <button class="main-btn" id="mainBtn">取消更新</button>
  <button class="replay" id="replayBtn">↺ 重新演示</button>
</div>

<div class="toast" id="toast"></div>

<script>
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const pctText = document.getElementById('pctText'), stageLabel = document.getElementById('stageLabel');
  const statusText = document.getElementById('statusText'), metaText = document.getElementById('metaText');
  const mainBtn = document.getElementById('mainBtn'), modal = document.getElementById('modal');
  const stage = document.getElementById('stage'), doneBadge = document.getElementById('doneBadge');
  const toast = document.getElementById('toast');

  const W = 260, CX = 130, CY = 130;
  // 裂纹树：递归分叉，父先子后
  function genCracks() {
    const segs = [];
    function branch(x, y, ang, len, depth) {
      const x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len;
      segs.push({ x1: x, y1: y, x2: x2, y2: y2, depth: depth });
      if (depth <= 0) return;
      for (let i = 0; i < 2; i++)
        branch(x2, y2, ang + (Math.random() - .5) * 1.3, len * (0.5 + Math.random() * 0.3), depth - 1);
    }
    for (let i = 0; i < 9; i++) {
      const a = (i / 9) * Math.PI * 2 + Math.random() * .4;
      branch(CX, CY, a, 24 + Math.random() * 14, 2);
    }
    return segs;
  }
  let cracks = genCracks();

  function drawIce(p) {
    ctx.clearRect(0, 0, W, W);
    // 冰面
    const g = ctx.createLinearGradient(0, 0, W, W);
    g.addColorStop(0, '#dcebf8'); g.addColorStop(.5, '#c3d9ee'); g.addColorStop(1, '#d8e8f7');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, W);
    // 冰面高光纹理
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1;
    for (let i = 0; i < 5; i++) {
      ctx.beginPath();
      ctx.moveTo(0, 40 + i * 48);
      ctx.bezierCurveTo(80, 30 + i * 48, 170, 52 + i * 48, 260, 38 + i * 48);
      ctx.stroke();
    }
    // 撞击点
    const ig = ctx.createRadialGradient(CX, CY, 0, CX, CY, 16 + p * 0.1);
    ig.addColorStop(0, 'rgba(255,255,255,.95)'); ig.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = ig;
    ctx.beginPath(); ctx.arc(CX, CY, 16 + p * 0.1, 0, 7); ctx.fill();
    // 裂纹
    const n = Math.floor(p / 100 * cracks.length);
    ctx.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      const s = cracks[i];
      const w = s.depth === 2 ? 3.4 : s.depth === 1 ? 2.2 : 1.2;
      ctx.strokeStyle = 'rgba(170,205,235,.9)'; ctx.lineWidth = w + 2.4;
      ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
      ctx.strokeStyle = '#0d2c4e'; ctx.lineWidth = w;
      ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
    }
  }

  const TOTAL = 156.8;
  let progress = 0, state = 'downloading', timer = null, showSpeed = 0;

  function showToast(m) { toast.textContent = m; toast.classList.add('show'); clearTimeout(showToast._t); showToast._t = setTimeout(() => toast.classList.remove('show'), 1800); }
  function render() {
    pctText.textContent = Math.floor(progress) + '%';
    const mb = (progress / 100 * TOTAL).toFixed(1);
    metaText.textContent = mb + 'MB / ' + TOTAL + 'MB · ' + (state === 'downloading' ? showSpeed.toFixed(1) + ' MB/s' : '-- MB/s');
    drawIce(progress);
  }
  function setMain(t, gold, dis) { mainBtn.textContent = t; mainBtn.classList.toggle('gold', !!gold); mainBtn.disabled = !!dis; }

  function tick() {
    if (state !== 'downloading') return;
    const sp = 8 * (0.6 + Math.random() * 0.8);
    showSpeed = showSpeed * 0.7 + sp * 0.3;
    progress += sp * 0.1 / TOTAL * 100;
    if (progress >= 100) { progress = 100; render(); enterInstalling(); return; }
    render();
  }
  function startTimer() { clearInterval(timer); timer = setInterval(tick, 100); }

  function enterDownloading(reset) {
    if (reset) {
      progress = 0; showSpeed = 0; cracks = genCracks();
      stage.classList.remove('dim', 'shattered', 'flash');
      doneBadge.classList.remove('show'); stageLabel.textContent = '碎裂中';
    }
    state = 'downloading';
    statusText.textContent = '冰面正在裂开，新版本在水下等待';
    setMain('取消更新', false, false);
    startTimer(); render();
  }
  function enterCancelled() {
    state = 'cancelled'; clearInterval(timer); stage.classList.add('dim');
    statusText.textContent = '冰面冻结，裂纹停止蔓延'; stageLabel.textContent = '已取消';
    metaText.textContent = (progress / 100 * TOTAL).toFixed(1) + 'MB / ' + TOTAL + 'MB · 已停止';
    setMain('重新下载', false, false);
    render(); showToast('已取消更新');
  }
  function enterInstalling() {
    state = 'installing'; clearInterval(timer);
    statusText.textContent = '冰面正在碎裂…'; stageLabel.textContent = '安装中';
    metaText.textContent = TOTAL + 'MB / ' + TOTAL + 'MB · 校验完成';
    setMain('安装中…', false, true);
    stage.classList.add('flash');
    render();
    setTimeout(() => { if (state === 'installing') enterDone(); }, 1800);
  }
  function enterDone() {
    state = 'done';
    stage.classList.remove('flash'); stage.classList.add('shattered');
    statusText.textContent = '冰破水出，欢迎 v4.0.0'; stageLabel.textContent = '已完成';
    metaText.textContent = 'v4.0.0 已安装 · 破冰成功';
    doneBadge.classList.add('show');
    setMain('立即体验', true, false);
    showToast('已更新到 v4.0.0');
    render();
  }

  mainBtn.addEventListener('click', () => {
    if (state === 'downloading') enterCancelled();
    else if (state === 'cancelled') enterDownloading(true);
    else if (state === 'done') { modal.classList.add('hidden'); showToast('已进入 v4.0.0'); }
  });
  document.getElementById('xBtn').addEventListener('click', () => {
    if (state === 'downloading') enterCancelled();
    else modal.classList.add('hidden');
  });
  document.getElementById('replayBtn').addEventListener('click', () => { modal.classList.remove('hidden'); enterDownloading(true); });

  window.addEventListener('load', () => {
    if (location.hash === '#mid') { progress = 55; showSpeed = 8.1; render(); startTimer(); }
    else if (location.hash === '#done') { progress = 100; render(); enterInstalling(); setTimeout(() => enterDone(), 400); }
    else enterDownloading(false);
    render();
  });
</script>
</body>
</html>
