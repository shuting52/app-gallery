<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>版本更新 · 极简线条</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    background: #f7f7f5;
    padding: 24px 16px; position: relative;
  }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.08); pointer-events: none; }
  .modal {
    position: relative; z-index: 2;
    width: 340px; max-width: 100%;
    background: #ffffff;
    border: 1px solid #161616;
    border-radius: 10px;
    box-shadow: 0 16px 40px rgba(0,0,0,.08);
    padding: 28px 26px;
  }
  .modal.hidden { display: none; }
  .header { display: flex; justify-content: space-between; align-items: center; }
  .title { font-size: 15px; font-weight: 600; letter-spacing: .25em; color: #161616; }
  .close { background: none; border: none; font-size: 20px; color: #999; cursor: pointer; line-height: 1; padding: 4px; }
  .close:hover { color: #161616; }
  .rule { height: 1px; background: #161616; margin: 16px 0; opacity: .85; }
  .status { font-size: 13px; color: #555; letter-spacing: .08em; margin-bottom: 4px; }
  .meta { font-size: 12px; color: #999; margin-bottom: 22px; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
  .bignum { font-size: 56px; font-weight: 200; color: #161616; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1; margin-bottom: 6px; }
  .bignum small { font-size: 20px; font-weight: 300; }
  .bignum.hidden { display: none; }
  .checkline { display: none; align-items: center; gap: 12px; margin-bottom: 8px; }
  .checkline.show { display: flex; }
  .checkline span { font-size: 15px; letter-spacing: .2em; color: #161616; }
  .line { height: 2px; background: #e9e9e7; position: relative; margin: 20px 0 28px; overflow: hidden; }
  .linefill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #161616; }
  .line.indet .linefill { width: 32%; animation: slide 1.1s ease-in-out infinite alternate; }
  @keyframes slide { from { left: 0; } to { left: 68%; } }
  .mainbtn { width: 100%; padding: 13px; border-radius: 8px; font-size: 15px; letter-spacing: .3em; text-indent: .3em; background: #161616; color: #fff; border: 1px solid #161616; cursor: pointer; }
  .mainbtn:disabled { opacity: .4; cursor: default; }
  .mainbtn.ghost { background: #fff; color: #161616; }
  .replay { display: block; margin: 14px auto 0; background: none; border: none; color: #999; font-size: 12px; letter-spacing: .15em; cursor: pointer; }
  .replay:hover { color: #161616; }
  .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-12px); background: #161616; color: #fff; font-size: 13px; letter-spacing: .1em; padding: 10px 22px; border-radius: 99px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 10; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="scrim"></div>

<div class="modal" id="modal">
  <div class="header">
    <div class="title">版本更新</div>
    <button class="close" id="closeBtn">&times;</button>
  </div>
  <div class="rule"></div>
  <div class="status" id="statusText">正在下载 3.3.1</div>
  <div class="meta" id="metaText">0.0MB / 156.8MB · -- MB/s</div>
  <div class="bignum" id="bigNum"><span id="percentText">0</span><small>%</small></div>
  <div class="checkline" id="checkLine">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    <span>更新完成</span>
  </div>
  <div class="line" id="line"><div class="linefill" id="linefill"></div></div>
  <button class="mainbtn" id="mainBtn">取消更新</button>
  <button class="replay" id="replayBtn">↺ 重新演示</button>
</div>

<div class="toast" id="toast"></div>

<script>
  const TOTAL_MB = 156.8, VERSION = '3.3.1';
  let progress = 0, state = 'downloading', timer = null, baseSpeed = 8, showSpeed = 0;
  const $ = id => document.getElementById(id);
  const percentText = $('percentText'), metaText = $('metaText'), statusText = $('statusText'),
        mainBtn = $('mainBtn'), toastEl = $('toast'), modal = $('modal'),
        linefill = $('linefill'), line = $('line'), bigNum = $('bigNum'), checkLine = $('checkLine');

  function toast(m) {
    toastEl.textContent = m; toastEl.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }
  function render() {
    percentText.textContent = Math.floor(progress);
    linefill.style.width = progress + '%';
    metaText.textContent = (progress / 100 * TOTAL_MB).toFixed(1) + 'MB / ' + TOTAL_MB + 'MB · ' + showSpeed.toFixed(1) + ' MB/s';
  }
  function tick() {
    if (state !== 'downloading') return;
    const sp = baseSpeed * (0.6 + Math.random() * 0.8);
    showSpeed = showSpeed * 0.7 + sp * 0.3;
    progress += sp * 0.1 / TOTAL_MB * 100;
    if (progress >= 100) { progress = 100; render(); enterInstalling(); return; }
    render();
  }
  function startTimer() { clearInterval(timer); timer = setInterval(tick, 100); }
  function stopTimer() { clearInterval(timer); timer = null; }
  function setMain(label, disabled, ghost) {
    mainBtn.textContent = label; mainBtn.disabled = !!disabled;
    mainBtn.classList.toggle('ghost', !!ghost);
  }

  function enterDownloading(fresh) {
    state = 'downloading';
    if (fresh) { progress = 0; showSpeed = 0; }
    line.classList.remove('indet');
    bigNum.classList.remove('hidden'); checkLine.classList.remove('show');
    statusText.textContent = '正在下载 ' + VERSION;
    setMain('取消更新', false, false);
    startTimer(); render();
  }
  function enterCancelled() {
    state = 'cancelled'; stopTimer();
    line.classList.remove('indet');
    statusText.textContent = '已取消下载';
    metaText.textContent = (progress / 100 * TOTAL_MB).toFixed(1) + 'MB / ' + TOTAL_MB + 'MB · 已停止';
    setMain('重新下载', false, true);
    toast('已取消下载');
  }
  function enterInstalling() {
    state = 'installing'; stopTimer();
    line.classList.add('indet');
    statusText.textContent = '正在安装...';
    metaText.textContent = TOTAL_MB + 'MB / ' + TOTAL_MB + 'MB · 校验完成';
    setMain('安装中...', true, true);
    setTimeout(() => { if (state === 'installing') enterDone(); }, 2600);
  }
  function enterDone() {
    state = 'done';
    line.classList.remove('indet');
    linefill.style.width = '100%';
    bigNum.classList.add('hidden'); checkLine.classList.add('show');
    statusText.textContent = 'v' + VERSION + ' 已就绪';
    metaText.textContent = VERSION + ' 已安装 · 重启后生效';
    setMain('完成', false, true);
    toast('已更新到最新版本');
  }

  mainBtn.onclick = () => {
    if (state === 'downloading') enterCancelled();
    else if (state === 'cancelled') enterDownloading(true);
    else if (state === 'done') { modal.classList.add('hidden'); toast('已更新到 ' + VERSION); }
  };
  $('closeBtn').onclick = () => {
    if (state === 'downloading') enterCancelled();
    else modal.classList.add('hidden');
  };
  $('replayBtn').onclick = () => { modal.classList.remove('hidden'); enterDownloading(true); toast('重新开始演示'); };

  window.addEventListener('load', () => {
    if (location.hash === '#done') {
      enterDownloading(true); progress = 100; render(); enterInstalling();
      setTimeout(() => enterDone(), 400);
    } else enterDownloading(true);
  });
</script>
</body>
</html>
