<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>版本更新 · 暗黑霓虹</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    background: #06060c;
    padding: 24px 16px; position: relative; overflow: hidden;
    color: #e8e8f2;
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .28; pointer-events: none; }
  .g1 { width: 360px; height: 360px; background: #00f0ff; top: -100px; left: -80px; }
  .g2 { width: 320px; height: 320px; background: #ff2d95; bottom: -90px; right: -60px; }
  .modal {
    position: relative; z-index: 2;
    width: 340px; max-width: 100%;
    background: rgba(14,14,24,.94);
    border: 1px solid #2b2b40;
    border-radius: 20px;
    box-shadow: 0 0 44px rgba(0,240,255,.10), 0 24px 60px rgba(0,0,0,.6);
    padding: 26px 24px;
  }
  .modal.hidden { display: none; }
  .header { display: flex; justify-content: space-between; align-items: center; }
  .title { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: 2px; display: flex; align-items: center; gap: 8px; }
  .title .bolt { color: #00f0ff; text-shadow: 0 0 10px #00f0ff; }
  .ver { font-size: 11px; font-weight: 700; color: #ff2d95; border: 1px solid #ff2d95; padding: 3px 10px; border-radius: 99px; text-shadow: 0 0 8px rgba(255,45,149,.8); box-shadow: 0 0 12px rgba(255,45,149,.25); }
  .close { background: none; border: none; font-size: 22px; color: #55556e; cursor: pointer; line-height: 1; padding: 4px; }
  .close:hover { color: #ff2d95; }
  .status { font-size: 14px; color: #9a9ab5; margin: 12px 0 4px; }
  .meta { font-size: 12px; color: #55556e; margin-bottom: 18px; font-variant-numeric: tabular-nums; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .ringwrap { position: relative; width: 170px; height: 170px; margin: 0 auto 20px; }
  .ringwrap svg { display: block; }
  .ringwrap svg.spin { animation: rot 1s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 700; color: #00f0ff; text-shadow: 0 0 14px rgba(0,240,255,.9); font-variant-numeric: tabular-nums; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .pct.hidden { display: none; }
  .checksvg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; }
  .checksvg.show { display: flex; }
  .mainbtn { width: 100%; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 700; letter-spacing: 3px; background: transparent; border: 1px solid #00f0ff; color: #00f0ff; cursor: pointer; text-shadow: 0 0 10px rgba(0,240,255,.8); box-shadow: 0 0 18px rgba(0,240,255,.22), inset 0 0 14px rgba(0,240,255,.08); }
  .mainbtn:disabled { opacity: .45; cursor: default; }
  .mainbtn:active { transform: scale(.98); }
  .mainbtn.done { border-color: #00ff9d; color: #00ff9d; text-shadow: 0 0 10px rgba(0,255,157,.8); box-shadow: 0 0 18px rgba(0,255,157,.22), inset 0 0 14px rgba(0,255,157,.08); }
  .replay { display: block; margin: 14px auto 0; background: none; border: none; color: #55556e; font-size: 13px; cursor: pointer; letter-spacing: 1px; }
  .replay:hover { color: #00f0ff; }
  .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-12px); background: rgba(10,10,18,.95); border: 1px solid #00f0ff; color: #00f0ff; font-size: 14px; padding: 10px 22px; border-radius: 99px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 10; text-shadow: 0 0 8px rgba(0,240,255,.7); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>

<div class="modal" id="modal">
  <div class="header">
    <div class="title"><span class="bolt">⚡</span>版本更新 <span class="ver">v3.3.1</span></div>
    <button class="close" id="closeBtn">&times;</button>
  </div>
  <div class="status" id="statusText">正在下载 3.3.1</div>
  <div class="meta" id="metaText">0.0MB / 156.8MB · -- MB/s</div>
  <div class="ringwrap">
    <svg id="ringSvg" width="170" height="170" viewBox="0 0 170 170">
      <defs>
        <linearGradient id="neonGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#ff2d95"/>
        </linearGradient>
      </defs>
      <circle cx="85" cy="85" r="64" fill="none" stroke="#1c1c2e" stroke-width="10"/>
      <circle id="ringProg" cx="85" cy="85" r="64" fill="none" stroke="url(#neonGrad)" stroke-width="10"
              stroke-linecap="round" transform="rotate(-90 85 85)"
              style="filter: drop-shadow(0 0 6px rgba(0,240,255,.8));"/>
    </svg>
    <div class="pct" id="pctWrap"><span id="percentText">0</span>%</div>
    <div class="checksvg" id="checkWrap">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#00ff9d" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 8px rgba(0,255,157,.9));">
        <path d="M20 6L9 17l-5-5"/>
      </svg>
    </div>
  </div>
  <button class="mainbtn" id="mainBtn">取消更新</button>
  <button class="replay" id="replayBtn">↺ 重新演示</button>
</div>

<div class="toast" id="toast"></div>

<script>
  const TOTAL_MB = 156.8, VERSION = '3.3.1';
  const R = 64, C = 2 * Math.PI * R;
  let progress = 0, state = 'downloading', timer = null, baseSpeed = 8, showSpeed = 0;
  const $ = id => document.getElementById(id);
  const percentText = $('percentText'), metaText = $('metaText'), statusText = $('statusText'),
        mainBtn = $('mainBtn'), toastEl = $('toast'), modal = $('modal'),
        ringProg = $('ringProg'), ringSvg = $('ringSvg'),
        pctWrap = $('pctWrap'), checkWrap = $('checkWrap');

  ringProg.style.strokeDasharray = C.toFixed(1);
  ringProg.style.strokeDashoffset = C.toFixed(1);

  function toast(m) {
    toastEl.textContent = m; toastEl.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }
  function setRing(p) {
    ringProg.style.strokeDasharray = C.toFixed(1);
    ringProg.style.strokeDashoffset = (C - (p / 100) * C).toFixed(1);
  }
  function render() {
    percentText.textContent = Math.floor(progress);
    setRing(progress);
    metaText.textContent = (progress / 100 * TOTAL_MB).toFixed(1) + 'MB / ' + TOTAL_MB + 'MB · ' + showSpeed.toFixed(1) + ' MB/s';
  }
  function tick() {
    if (state !== 'downloading') return;
    const sp = baseSpeed * (0.6 + Math.random() * 0.8);
    showSpeed = showSpeed * 0.7 + sp * 0.3;
    progress += sp * 0.1 / TOTAL_MB * 100;
    if (progress >= 100) { progress = 100; render(); enterInstalling(); return; }
    render();
  }
  function startTimer() { clearInterval(timer); timer = setInterval(tick, 100); }
  function stopTimer() { clearInterval(timer); timer = null; }
  function setMain(label, disabled, done) {
    mainBtn.textContent = label; mainBtn.disabled = !!disabled;
    mainBtn.classList.toggle('done', !!done);
  }

  function enterDownloading(fresh) {
    state = 'downloading';
    if (fresh) { progress = 0; showSpeed = 0; }
    ringSvg.classList.remove('spin');
    pctWrap.classList.remove('hidden'); checkWrap.classList.remove('show');
    statusText.textContent = '正在下载 ' + VERSION;
    setMain('取消更新', false, false);
    startTimer(); render();
  }
  function enterCancelled() {
    state = 'cancelled'; stopTimer();
    ringSvg.classList.remove('spin');
    statusText.textContent = '已取消下载';
    metaText.textContent = (progress / 100 * TOTAL_MB).toFixed(1) + 'MB / ' + TOTAL_MB + 'MB · 已停止';
    setMain('重新下载', false, false);
    toast('已取消下载');
  }
  function enterInstalling() {
    state = 'installing'; stopTimer();
    ringProg.style.strokeDasharray = (C * 0.32).toFixed(1) + ' ' + C.toFixed(1);
    ringSvg.classList.add('spin');
    statusText.textContent = '正在安装...';
    metaText.textContent = TOTAL_MB + 'MB / ' + TOTAL_MB + 'MB · 校验完成';
    setMain('安装中...', true, false);
    setTimeout(() => { if (state === 'installing') enterDone(); }, 2600);
  }
  function enterDone() {
    state = 'done';
    ringSvg.classList.remove('spin');
    setRing(100);
    pctWrap.classList.add('hidden'); checkWrap.classList.add('show');
    statusText.textContent = '更新完成';
    metaText.textContent = VERSION + ' 已安装 · 重启后生效';
    setMain('立即体验', false, true);
    toast('已更新到最新版本');
  }

  mainBtn.onclick = () => {
    if (state === 'downloading') enterCancelled();
    else if (state === 'cancelled') enterDownloading(true);
    else if (state === 'done') { modal.classList.add('hidden'); toast('已更新到 ' + VERSION); }
  };
  $('closeBtn').onclick = () => {
    if (state === 'downloading') enterCancelled();
    else modal.classList.add('hidden');
  };
  $('replayBtn').onclick = () => { modal.classList.remove('hidden'); enterDownloading(true); toast('重新开始演示'); };

  window.addEventListener('load', () => {
    if (location.hash === '#done') {
      enterDownloading(true); progress = 100; render(); enterInstalling();
      setTimeout(() => enterDone(), 400);
    } else enterDownloading(true);
  });
</script>
</body>
</html>
