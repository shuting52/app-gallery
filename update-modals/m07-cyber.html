<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIRMWARE UPDATE · 赛博</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: #04060c;
    font-family: ui-monospace, "Courier New", monospace;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px 16px; color: #00ffcc;
    position: relative; overflow: hidden;
  }
  /* 扫描线 */
  body::after {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: repeating-linear-gradient(0deg, rgba(0,255,204,.045) 0 1px, transparent 1px 3px);
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
  }
  /* ===== HUD 弹窗 ===== */
  .hud-modal {
    width: 340px; max-width: 100%;
    background: rgba(8, 14, 24, .92);
    border: 1px solid rgba(0,255,204,.55);
    clip-path: polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px);
    box-shadow: 0 0 28px rgba(0,255,204,.18), inset 0 0 40px rgba(0,255,204,.05);
    padding: 22px 22px 24px;
    position: relative; z-index: 10;
  }
  .hud-modal.hidden { display: none; }
  .hud-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 4px; font-size: 12px; letter-spacing: 2px; color: #00ffcc;
  }
  .hud-head .live { color: #ff2d78; animation: blink 1.2s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .hud-close {
    background: none; border: 1px solid rgba(0,255,204,.5); color: #00ffcc;
    width: 26px; height: 26px; font-family: inherit; font-size: 15px;
    cursor: pointer; line-height: 1;
  }
  .hud-close:hover { background: rgba(0,255,204,.15); }
  .hud-title { font-size: 20px; font-weight: 700; letter-spacing: 4px; margin: 10px 0 4px; color: #eafffa; }
  .hud-sub { font-size: 12px; color: #4d7a72; letter-spacing: 1px; margin-bottom: 4px; }
  .hud-meta {
    font-size: 12px; color: #2b8a7c; margin-bottom: 18px;
    font-variant-numeric: tabular-nums;
  }
  /* ===== 分段进度条 ===== */
  .hud-track {
    display: flex; gap: 5px; margin-bottom: 14px;
    border: 1px solid rgba(0,255,204,.35); padding: 8px;
    background: rgba(0,20,18,.5);
  }
  .seg { flex: 1; height: 30px; background: #0e1a1c; transform: skewX(-12deg); }
  .seg.on {
    background: #00ffcc;
    box-shadow: 0 0 10px rgba(0,255,204,.9), 0 0 3px #00ffcc;
  }
  .hud-track.installing .seg.on { animation: scan 1s linear infinite; animation-delay: calc(var(--i) * 40ms); }
  @keyframes scan { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  .hud-pct-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .hud-pct { font-size: 34px; font-weight: 700; color: #eafffa; text-shadow: 0 0 12px rgba(0,255,204,.8); font-variant-numeric: tabular-nums; }
  .hud-hex { font-size: 11px; color: #2b8a7c; font-variant-numeric: tabular-nums; }
  .hud-hint { font-size: 12px; color: #4d7a72; letter-spacing: 2px; min-height: 18px; margin-bottom: 16px; }
  .hud-hint .run::after { content: '_'; animation: blink .8s steps(2) infinite; }
  /* ===== 按钮 ===== */
  .hud-btn {
    width: 100%; padding: 13px 0;
    font-family: inherit; font-size: 15px; font-weight: 700; letter-spacing: 6px;
    background: rgba(0,255,204,.12); color: #00ffcc;
    border: 1px solid #00ffcc; cursor: pointer;
    clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
    transition: background .15s;
  }
  .hud-btn:hover { background: rgba(0,255,204,.28); }
  .hud-btn.solid { background: #00ffcc; color: #04060c; }
  .hud-btn.solid:hover { background: #4dffd9; }
  .hud-btn.dim { opacity: .45; }
  .hud-btn:disabled { cursor: default; }
  .hud-done-title { animation: flicker 2.4s linear infinite; }
  @keyframes flicker {
    0%,100% { opacity: 1; } 92% { opacity: 1; } 93% { opacity: .4; }
    94% { opacity: 1; } 96% { opacity: .6; } 97% { opacity: 1; }
  }
  .replay {
    margin-top: 18px; background: none; border: none; cursor: pointer;
    color: #2b8a7c; font-family: inherit; font-size: 12px; letter-spacing: 2px; z-index: 10;
  }
  .replay:hover { color: #00ffcc; }
  .toast {
    position: fixed; top: 26px; left: 50%;
    transform: translateX(-50%) translateY(-12px);
    background: rgba(8,14,24,.95); color: #00ffcc;
    border: 1px solid #00ffcc; padding: 10px 20px;
    font-size: 13px; font-family: inherit; letter-spacing: 1px;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    z-index: 60; box-shadow: 0 0 16px rgba(0,255,204,.35);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="hud-modal" id="modal">
  <div class="hud-head">
    <span><span class="live">●</span> SYS // FIRMWARE UPDATE</span>
    <button class="hud-close" id="closeBtn">×</button>
  </div>
  <div class="hud-title" id="titleText">固件更新</div>
  <div class="hud-sub" id="statusText">正在下载 v3.3.1 …</div>
  <div class="hud-meta" id="metaText">0.0MB / 156.8MB · -- MB/s</div>
  <div class="hud-track" id="track"></div>
  <div class="hud-pct-row">
    <div class="hud-pct" id="pctText">0%</div>
    <div class="hud-hex" id="hexText">0x0000 :: PKG_0000</div>
  </div>
  <div class="hud-hint" id="hintText"></div>
  <button class="hud-btn" id="mainBtn">取消更新</button>
</div>
<button class="replay" id="replayBtn">↺ 重新演示</button>
<div class="toast" id="toast"></div>

<script>
  const N = 24;
  const track = document.getElementById('track');
  const segs = [];
  for (let i = 0; i < N; i++) {
    const s = document.createElement('div');
    s.className = 'seg';
    s.style.setProperty('--i', i);
    track.appendChild(s);
    segs.push(s);
  }
  const modal = document.getElementById('modal');
  const titleText = document.getElementById('titleText');
  const statusText = document.getElementById('statusText');
  const metaText = document.getElementById('metaText');
  const pctText = document.getElementById('pctText');
  const hexText = document.getElementById('hexText');
  const hintText = document.getElementById('hintText');
  const mainBtn = document.getElementById('mainBtn');
  const toast = document.getElementById('toast');

  const TOTAL_MB = 156.8, VERSION = 'v3.3.1';
  let progress = 0, state = 'downloading', timer = null, showSpeed = 0;

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 1800);
  }
  function render() {
    const n = Math.round(progress / 100 * N);
    segs.forEach((s, i) => s.classList.toggle('on', i < n));
    pctText.textContent = Math.floor(progress) + '%';
    metaText.textContent = (progress/100*TOTAL_MB).toFixed(1) + 'MB / ' + TOTAL_MB + 'MB · ' + showSpeed.toFixed(1) + ' MB/s';
    hexText.textContent = '0x' + Math.floor(progress/100*65535).toString(16).toUpperCase().padStart(4,'0')
      + ' :: PKG_' + String(Math.floor(progress/100*9999)).padStart(4,'0');
  }
  function setMain(label, cls, disabled) {
    mainBtn.textContent = label;
    mainBtn.className = 'hud-btn' + (cls ? ' ' + cls : '');
    mainBtn.disabled = !!disabled;
  }
  function tick() {
    if (state !== 'downloading') return;
    const sp = 8 * (0.6 + Math.random() * 0.8);
    showSpeed = showSpeed * 0.7 + sp * 0.3;
    progress += sp * 0.1 / TOTAL_MB * 100;
    if (progress >= 100) { progress = 100; render(); enterInstalling(); return; }
    render();
  }
  function startTimer() { clearInterval(timer); timer = setInterval(tick, 100); }
  function stopTimer() { clearInterval(timer); timer = null; }

  function enterDownloading(reset) {
    if (reset) {
      progress = 0; showSpeed = 0;
      track.classList.remove('installing');
      titleText.classList.remove('hud-done-title');
      modal.classList.remove('hidden');
    }
    state = 'downloading';
    titleText.textContent = '固件更新';
    statusText.textContent = '正在下载 ' + VERSION + ' …';
    hintText.innerHTML = '';
    setMain('取消更新', '', false);
    startTimer(); render();
  }
  function enterCancelled() {
    state = 'cancelled'; stopTimer();
    statusText.textContent = '// 传输已中止';
    hintText.textContent = '等待用户指令';
    setMain('重新下载', 'dim', false);
    showToast('下载已取消');
  }
  function enterInstalling() {
    state = 'installing'; stopTimer();
    statusText.textContent = '正在写入固件 …';
    hintText.innerHTML = '<span class="run">FLASHING · 请勿断电</span>';
    setMain('安装中...', 'dim', true);
    track.classList.add('installing');
    setTimeout(() => { if (state === 'installing') enterDone(); }, 2600);
  }
  function enterDone() {
    state = 'done';
    track.classList.remove('installing');
    titleText.textContent = '更新完成';
    titleText.classList.add('hud-done-title');
    statusText.textContent = '// 校验通过 · 系统就绪';
    hintText.textContent = 'ALL SYSTEMS NOMINAL';
    setMain('立即体验', 'solid', false);
    showToast('固件已更新到最新版本');
  }

  mainBtn.addEventListener('click', () => {
    if (state === 'downloading') enterCancelled();
    else if (state === 'cancelled') enterDownloading(true);
    else if (state === 'done') { modal.classList.add('hidden'); showToast('欢迎回来，指挥官'); }
  });
  document.getElementById('closeBtn').addEventListener('click', () => {
    if (state === 'downloading') enterCancelled();
    else modal.classList.add('hidden');
  });
  document.getElementById('replayBtn').addEventListener('click', () => {
    enterDownloading(true); showToast('重新开始演示');
  });

  window.addEventListener('load', () => {
    if (location.hash === '#done') {
      enterDownloading(true); progress = 100; render(); enterInstalling();
      setTimeout(enterDone, 400);
    } else enterDownloading(true);
  });
</script>
</body>
</html>
