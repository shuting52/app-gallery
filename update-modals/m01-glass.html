<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>版本更新 · 液态玻璃</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #a8c0ff 0%, #c9a8ff 55%, #ffc2e2 100%);
    padding: 24px 16px; position: relative; overflow: hidden;
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; pointer-events: none; }
  .b1 { width: 340px; height: 340px; background: #7aa2ff; top: -80px; left: -60px; }
  .b2 { width: 300px; height: 300px; background: #e08fff; bottom: -70px; right: -40px; }
  .scrim { position: fixed; inset: 0; background: rgba(40,30,80,.16); pointer-events: none; }
  .modal {
    position: relative; z-index: 2;
    width: 340px; max-width: 100%;
    background: rgba(255,255,255,.62);
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    border: 1px solid rgba(255,255,255,.85);
    border-radius: 28px;
    box-shadow: 0 20px 50px rgba(90,70,160,.25);
    padding: 26px 24px;
  }
  .modal.hidden { display: none; }
  .header { display: flex; justify-content: space-between; align-items: center; }
  .title { font-size: 18px; font-weight: 700; color: #2b2350; display: flex; align-items: center; gap: 8px; }
  .ver { font-size: 11px; font-weight: 700; color: #fff; background: linear-gradient(90deg,#3b82f6,#8b5cf6); padding: 3px 10px; border-radius: 99px; }
  .close { background: none; border: none; font-size: 22px; color: #8b86a8; cursor: pointer; line-height: 1; padding: 4px; }
  .status { font-size: 14px; color: #5b5480; margin: 12px 0 4px; }
  .meta { font-size: 12px; color: #8b86a8; margin-bottom: 20px; font-variant-numeric: tabular-nums; }
  .bignum { font-size: 44px; font-weight: 800; color: #2b2350; text-align: center; font-variant-numeric: tabular-nums; margin-bottom: 14px; }
  .bignum small { font-size: 18px; font-weight: 600; }
  .bignum.hidden, .check.hidden { display: none; }
  .check { text-align: center; margin-bottom: 16px; }
  .check .ring {
    width: 78px; height: 78px; border-radius: 50%;
    background: linear-gradient(135deg,#3b82f6,#a855f7);
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(99,102,241,.45);
  }
  .bar { height: 14px; border-radius: 99px; background: rgba(255,255,255,.55); box-shadow: inset 0 2px 6px rgba(90,70,160,.18); overflow: hidden; position: relative; margin-bottom: 26px; }
  .fill { height: 100%; width: 0%; border-radius: 99px; background: linear-gradient(90deg,#3b82f6,#8b5cf6,#d946ef); position: relative; overflow: hidden; transition: width .12s linear; }
  .fill::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg,transparent 20%,rgba(255,255,255,.75) 50%,transparent 80%); transform: translateX(-100%); animation: shimmer 1.6s ease-in-out infinite; }
  @keyframes shimmer { 60%, 100% { transform: translateX(100%); } }
  .bar.indet .fill { width: 100%; }
  .mainbtn { width: 100%; padding: 14px; border: none; border-radius: 99px; font-size: 16px; font-weight: 700; color: #fff; background: linear-gradient(90deg,#3b82f6,#8b5cf6); cursor: pointer; box-shadow: 0 8px 20px rgba(99,102,241,.4); }
  .mainbtn:disabled { opacity: .55; cursor: default; }
  .mainbtn:active { transform: scale(.98); }
  .replay { display: block; margin: 14px auto 0; background: none; border: none; color: #8b86a8; font-size: 13px; cursor: pointer; }
  .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-12px); background: rgba(30,25,60,.92); color: #fff; font-size: 14px; padding: 10px 22px; border-radius: 99px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 10; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="scrim"></div>

<div class="modal" id="modal">
  <div class="header">
    <div class="title">版本更新 <span class="ver">v3.3.1</span></div>
    <button class="close" id="closeBtn">&times;</button>
  </div>
  <div class="status" id="statusText">正在下载 3.3.1</div>
  <div class="meta" id="metaText">0.0MB / 156.8MB · -- MB/s</div>
  <div class="bignum" id="bigNum"><span id="percentText">0</span><small>%</small></div>
  <div class="check hidden" id="checkWrap">
    <div class="ring">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
  </div>
  <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
  <button class="mainbtn" id="mainBtn">取消更新</button>
  <button class="replay" id="replayBtn">↺ 重新演示</button>
</div>

<div class="toast" id="toast"></div>

<script>
  const TOTAL_MB = 156.8, VERSION = '3.3.1';
  let progress = 0, state = 'downloading', timer = null, baseSpeed = 8, showSpeed = 0;
  const $ = id => document.getElementById(id);
  const percentText = $('percentText'), metaText = $('metaText'), statusText = $('statusText'),
        mainBtn = $('mainBtn'), toastEl = $('toast'), modal = $('modal'),
        fill = $('fill'), bar = $('bar'), bigNum = $('bigNum'), checkWrap = $('checkWrap');

  function toast(m) {
    toastEl.textContent = m; toastEl.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }
  function render() {
    percentText.textContent = Math.floor(progress);
    fill.style.width = progress + '%';
    metaText.textContent = (progress / 100 * TOTAL_MB).toFixed(1) + 'MB / ' + TOTAL_MB + 'MB · ' + showSpeed.toFixed(1) + ' MB/s';
  }
  function tick() {
    if (state !== 'downloading') return;
    const sp = baseSpeed * (0.6 + Math.random() * 0.8);
    showSpeed = showSpeed * 0.7 + sp * 0.3;
    progress += sp * 0.1 / TOTAL_MB * 100;
    if (progress >= 100) { progress = 100; render(); enterInstalling(); return; }
    render();
  }
  function startTimer() { clearInterval(timer); timer = setInterval(tick, 100); }
  function stopTimer() { clearInterval(timer); timer = null; }
  function setMain(label, disabled) { mainBtn.textContent = label; mainBtn.disabled = !!disabled; }

  function enterDownloading(fresh) {
    state = 'downloading';
    if (fresh) { progress = 0; showSpeed = 0; }
    bar.classList.remove('indet');
    bigNum.classList.remove('hidden'); checkWrap.classList.add('hidden');
    statusText.textContent = '正在下载 ' + VERSION;
    setMain('取消更新', false);
    startTimer(); render();
  }
  function enterCancelled() {
    state = 'cancelled'; stopTimer();
    bar.classList.remove('indet');
    statusText.textContent = '已取消下载';
    metaText.textContent = (progress / 100 * TOTAL_MB).toFixed(1) + 'MB / ' + TOTAL_MB + 'MB · 已停止';
    setMain('重新下载', false);
    toast('已取消下载');
  }
  function enterInstalling() {
    state = 'installing'; stopTimer();
    bar.classList.add('indet');
    statusText.textContent = '正在安装...';
    metaText.textContent = TOTAL_MB + 'MB / ' + TOTAL_MB + 'MB · 校验完成';
    setMain('安装中...', true);
    setTimeout(() => { if (state === 'installing') enterDone(); }, 2600);
  }
  function enterDone() {
    state = 'done';
    bar.classList.remove('indet');
    fill.style.width = '100%';
    bigNum.classList.add('hidden'); checkWrap.classList.remove('hidden');
    statusText.textContent = '更新完成';
    metaText.textContent = VERSION + ' 已安装 · 重启后生效';
    setMain('立即体验', false);
    toast('已更新到最新版本');
  }

  mainBtn.onclick = () => {
    if (state === 'downloading') enterCancelled();
    else if (state === 'cancelled') enterDownloading(true);
    else if (state === 'done') { modal.classList.add('hidden'); toast('已更新到 ' + VERSION); }
  };
  $('closeBtn').onclick = () => {
    if (state === 'downloading') enterCancelled();
    else modal.classList.add('hidden');
  };
  $('replayBtn').onclick = () => { modal.classList.remove('hidden'); enterDownloading(true); toast('重新开始演示'); };

  window.addEventListener('load', () => {
    if (location.hash === '#done') {
      enterDownloading(true); progress = 100; render(); enterInstalling();
      setTimeout(() => enterDone(), 400);
    } else enterDownloading(true);
  });
</script>
</body>
</html>
