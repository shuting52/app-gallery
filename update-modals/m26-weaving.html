<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>织布更新 · v4.0.0</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(120% 100% at 50% 0%, #3a2a18 0%, #1d1409 65%, #100b05 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 20px; color: #f3e6c8;
  }
  .modal {
    width: 340px; background: rgba(46,32,18,.85);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(201,168,106,.3); border-radius: 26px;
    padding: 24px 24px 22px; display: flex; flex-direction: column; align-items: center;
    box-shadow: 0 24px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.07);
  }
  .modal.hidden { display: none; }
  .m-head { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .m-title { font-size: 18px; font-weight: 700; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
  .m-title .wv-ico { color: #c9a86a; }
  .ver { font-size: 11px; color: #c9a86a; border: 1px solid rgba(201,168,106,.5); border-radius: 99px; padding: 3px 10px; background: rgba(201,168,106,.08); }
  .x { background: none; border: none; color: rgba(243,230,200,.4); font-size: 24px; cursor: pointer; line-height: 1; }
  .x:hover { color: #fff; }
  .m-sub { width: 100%; font-size: 14px; color: rgba(243,230,200,.8); margin-bottom: 4px; text-align: left; }
  .m-meta { width: 100%; font-size: 12px; color: rgba(243,230,200,.4); margin-bottom: 10px; text-align: left; font-variant-numeric: tabular-nums; }

  /* 织布机 */
  .loom {
    position: relative; width: 248px; height: 264px; margin: 4px 0 2px;
    border: 10px solid #6b4a2a; border-radius: 8px;
    background: #17100a; overflow: hidden; transition: opacity .4s;
    box-shadow: inset 0 0 24px rgba(0,0,0,.7);
  }
  .loom.dim { opacity: .45; }
  .warp { position: absolute; top: 0; bottom: 0; width: 3px; background: repeating-linear-gradient(to bottom, #c9a86a 0 6px, #a8834e 6px 12px); opacity: .85; }
  .cloth { position: absolute; left: 0; right: 0; top: 0; transition: transform 1.1s cubic-bezier(.6,.05,.3,1), opacity .6s; transform-origin: 50% 100%; }
  .cloth.rolled { transform: translateY(46%) scaleY(.06); opacity: .9; }
  .weft {
    height: 12px; margin: 0 2px;
    transform: scaleX(0); opacity: 0;
    transition: transform .45s ease, opacity .3s;
  }
  .weft.woven { transform: scaleX(1); opacity: 1; }
  .weft.woven.ltr { transform-origin: 0 50%; }
  .weft.woven.rtl { transform-origin: 100% 50%; }
  .shuttle {
    position: absolute; top: 0; left: 8px; width: 34px; height: 12px; z-index: 5;
    transition: none;
  }
  .shuttle .boat {
    width: 34px; height: 12px; background: linear-gradient(180deg, #8a5f36, #5a3a20);
    border-radius: 50% / 60%; border: 1px solid #3d2712; position: relative;
    box-shadow: 0 2px 6px rgba(0,0,0,.5);
  }
  .shuttle .boat::after {
    content: ''; position: absolute; left: 4px; right: 4px; top: 5px; height: 2px;
    background: #e8d5a8; border-radius: 2px;
  }
  .rollbar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 0; z-index: 6;
    background: linear-gradient(180deg, #8a5f36, #4a2f16);
    border-top: 2px solid #2e1d0c; transition: height 1.1s cubic-bezier(.6,.05,.3,1);
    display: flex; align-items: center; justify-content: center;
    color: #f3e6c8; font-size: 11px; letter-spacing: 3px; overflow: hidden; white-space: nowrap;
  }
  .rollbar.show { height: 34px; }

  .pct-row { display: flex; align-items: baseline; gap: 8px; margin-top: 8px; }
  .pct { font-size: 40px; font-weight: 800; color: #e8c87e; font-variant-numeric: tabular-nums; }
  .pct-lbl { font-size: 12px; color: rgba(243,230,200,.45); letter-spacing: 2px; }
  .done-badge { display: none; align-items: center; gap: 8px; margin-top: 8px; color: #e8c87e; font-size: 15px; font-weight: 700; letter-spacing: 2px; }
  .done-badge.show { display: flex; animation: pop .5s cubic-bezier(.2,1.5,.4,1); }
  .done-badge .ck { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, #ffe9a8, #c9a86a); color: #3a2a10; font-weight: 900; display: flex; align-items: center; justify-content: center; }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .main-btn {
    width: 100%; margin-top: 16px; padding: 14px 0; border-radius: 99px; border: 1px solid rgba(243,230,200,.2);
    background: rgba(243,230,200,.08); color: #f3e6c8;
    font-size: 16px; font-weight: 600; letter-spacing: 2px; cursor: pointer; transition: all .25s;
  }
  .main-btn:hover { background: rgba(243,230,200,.14); }
  .main-btn.gold { background: linear-gradient(135deg, #ffe9a8, #c9a86a); color: #3a2a10; border: none; }
  .main-btn:disabled { opacity: .45; cursor: default; }
  .replay { margin-top: 12px; background: none; border: none; color: rgba(243,230,200,.35); font-size: 12.5px; cursor: pointer; letter-spacing: 1px; }
  .replay:hover { color: #e8c87e; }
  .toast {
    position: fixed; top: 26px; left: 50%; transform: translateX(-50%) translateY(-16px);
    background: rgba(30,20,10,.95); border: 1px solid rgba(201,168,106,.35); color: #f3e6c8;
    padding: 10px 22px; border-radius: 99px; font-size: 14px; opacity: 0; pointer-events: none; z-index: 60;
    transition: opacity .25s, transform .25s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="modal" id="modal">
  <div class="m-head">
    <div class="m-title"><span class="wv-ico">🧵</span> 织布更新 <span class="ver">v4.0.0</span></div>
    <button class="x" id="xBtn">×</button>
  </div>
  <div class="m-sub" id="statusText">梭子穿梭，一寸一寸织出新版本</div>
  <div class="m-meta" id="metaText">0.0MB / 156.8MB · -- MB/s</div>

  <div class="loom" id="loom">
    <div class="cloth" id="cloth"></div>
    <div class="shuttle" id="shuttle"><div class="boat"></div></div>
    <div class="rollbar" id="rollbar">✦ 布 已 织 就 ✦</div>
  </div>

  <div class="pct-row"><div class="pct" id="pctText">0%</div><div class="pct-lbl" id="stageLabel">织造中</div></div>
  <div class="done-badge" id="doneBadge"><span class="ck">✓</span> 织就 · 安装成功</div>

  <button class="main-btn" id="mainBtn">取消更新</button>
  <button class="replay" id="replayBtn">↺ 重新演示</button>
</div>

<div class="toast" id="toast"></div>

<script>
  const pctText = document.getElementById('pctText'), stageLabel = document.getElementById('stageLabel');
  const statusText = document.getElementById('statusText'), metaText = document.getElementById('metaText');
  const mainBtn = document.getElementById('mainBtn'), modal = document.getElementById('modal');
  const loom = document.getElementById('loom'), cloth = document.getElementById('cloth');
  const shuttle = document.getElementById('shuttle'), rollbar = document.getElementById('rollbar');
  const doneBadge = document.getElementById('doneBadge'), toast = document.getElementById('toast');

  const ROWS = 20, ROW_H = 12;
  const CREAM = '#f3e6c8', INDIGO = '#2e4a7a', RUST = '#c25e3a', GOLD = '#c9a86a';
  // 布纹图案：条纹 + 中央菱形
  function rowStyle(i) {
    if (i >= 8 && i <= 11) {
      const d = Math.abs(i - 9.5); // 0.5 / 1.5
      return 'background: repeating-linear-gradient(90deg,' + CREAM + ' 0 14px,' + (d < 1 ? RUST : INDIGO) + ' 14px 34px,' + CREAM + ' 34px 48px);';
    }
    if (i % 4 === 3) return 'background:' + GOLD + ';';
    return 'background: repeating-linear-gradient(90deg,' + (i % 2 ? INDIGO : CREAM) + ' 0 18px,' + (i % 2 ? CREAM : INDIGO) + ' 18px 36px);';
  }

  // 经线
  for (let i = 0; i < 12; i++) {
    const w = document.createElement('div');
    w.className = 'warp';
    w.style.left = (8 + i * 19) + 'px';
    loom.appendChild(w);
  }
  // 纬线行
  const wefts = [];
  for (let i = 0; i < ROWS; i++) {
    const r = document.createElement('div');
    r.className = 'weft';
    r.style.cssText += rowStyle(i);
    cloth.appendChild(r);
    wefts.push(r);
  }
  // 梭子初始位置
  shuttle.style.top = '0px';

  const TOTAL = 156.8;
  let progress = 0, state = 'downloading', timer = null, showSpeed = 0, wovenCount = 0;

  function layout() {
    // 已织行数
    const n = Math.min(ROWS, Math.floor(progress / 5));
    for (let i = 0; i < n; i++) {
      if (!wefts[i].classList.contains('woven')) {
        wefts[i].classList.add('woven', i % 2 ? 'rtl' : 'ltr');
      }
    }
    wovenCount = n;
    // 梭子位置：当前行内左右穿梭
    const rowFrac = (progress % 5) / 5;
    const dir = n % 2 === 0 ? 1 : -1; // 偶数行左→右
    const x = dir === 1 ? 8 + rowFrac * 190 : 198 - rowFrac * 190;
    const y = Math.min(n, ROWS - 1) * ROW_H;
    shuttle.style.transform = 'translateX(' + x + 'px)';
    shuttle.style.top = y + 'px';
    shuttle.style.opacity = (state === 'downloading' && progress < 100) ? 1 : 0;
  }

  function showToast(m) { toast.textContent = m; toast.classList.add('show'); clearTimeout(showToast._t); showToast._t = setTimeout(() => toast.classList.remove('show'), 1800); }
  function render() {
    pctText.textContent = Math.floor(progress) + '%';
    const mb = (progress / 100 * TOTAL).toFixed(1);
    metaText.textContent = mb + 'MB / ' + TOTAL + 'MB · ' + (state === 'downloading' ? showSpeed.toFixed(1) + ' MB/s' : '-- MB/s');
    layout();
  }
  function setMain(t, gold, dis) { mainBtn.textContent = t; mainBtn.classList.toggle('gold', !!gold); mainBtn.disabled = !!dis; }

  function tick() {
    if (state !== 'downloading') return;
    const sp = 8 * (0.6 + Math.random() * 0.8);
    showSpeed = showSpeed * 0.7 + sp * 0.3;
    progress += sp * 0.1 / TOTAL * 100;
    if (progress >= 100) { progress = 100; render(); enterInstalling(); return; }
    render();
  }
  function startTimer() { clearInterval(timer); timer = setInterval(tick, 100); }

  function enterDownloading(reset) {
    if (reset) {
      progress = 0; showSpeed = 0; wovenCount = 0;
      wefts.forEach(w => w.classList.remove('woven', 'ltr', 'rtl'));
      cloth.classList.remove('rolled'); rollbar.classList.remove('show');
      loom.classList.remove('dim'); doneBadge.classList.remove('show');
      stageLabel.textContent = '织造中';
    }
    state = 'downloading';
    statusText.textContent = '梭子穿梭，一寸一寸织出新版本';
    setMain('取消更新', false, false);
    startTimer(); render();
  }
  function enterCancelled() {
    state = 'cancelled'; clearInterval(timer); loom.classList.add('dim');
    statusText.textContent = '织机已停，布匹未竟'; stageLabel.textContent = '已取消';
    metaText.textContent = (progress / 100 * TOTAL).toFixed(1) + 'MB / ' + TOTAL + 'MB · 已停止';
    setMain('重新下载', false, false);
    render(); showToast('已取消更新');
  }
  function enterInstalling() {
    state = 'installing'; clearInterval(timer);
    statusText.textContent = '布已织就，正在收卷…'; stageLabel.textContent = '安装中';
    metaText.textContent = TOTAL + 'MB / ' + TOTAL + 'MB · 校验完成';
    setMain('安装中…', false, true);
    render();
    cloth.classList.add('rolled'); rollbar.classList.add('show');
    setTimeout(() => { if (state === 'installing') enterDone(); }, 1800);
  }
  function enterDone() {
    state = 'done';
    statusText.textContent = '一匹好布，欢迎 v4.0.0'; stageLabel.textContent = '已完成';
    metaText.textContent = 'v4.0.0 已安装 · 织造完毕';
    doneBadge.classList.add('show');
    setMain('立即体验', true, false);
    showToast('已更新到 v4.0.0');
    render();
  }

  mainBtn.addEventListener('click', () => {
    if (state === 'downloading') enterCancelled();
    else if (state === 'cancelled') enterDownloading(true);
    else if (state === 'done') { modal.classList.add('hidden'); showToast('已进入 v4.0.0'); }
  });
  document.getElementById('xBtn').addEventListener('click', () => {
    if (state === 'downloading') enterCancelled();
    else modal.classList.add('hidden');
  });
  document.getElementById('replayBtn').addEventListener('click', () => { modal.classList.remove('hidden'); enterDownloading(true); });

  window.addEventListener('load', () => {
    if (location.hash === '#mid') { progress = 55; showSpeed = 8.4; render(); startTimer(); }
    else if (location.hash === '#done') { progress = 100; render(); enterInstalling(); setTimeout(() => enterDone(), 400); }
    else enterDownloading(false);
    render();
  });
</script>
</body>
</html>
