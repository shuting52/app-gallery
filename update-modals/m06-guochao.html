<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>版本更新 · 国潮</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: #f2efe6;
    background-image: radial-gradient(rgba(166,139,138,.12) 1px, transparent 1px);
    background-size: 22px 22px;
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "楷体", serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px 16px; color: #3a2e28;
  }
  /* ===== 国潮弹窗 ===== */
  .gc-modal {
    width: 340px; max-width: 100%;
    background: #faf7ef;
    border: 2px solid #c73e1d;
    outline: 1px solid #d4af37;
    outline-offset: 4px;
    box-shadow: 0 14px 34px rgba(120, 40, 20, .18);
    padding: 26px 24px 24px;
    position: relative;
  }
  .gc-modal.hidden { display: none; }
  .gc-corner {
    position: absolute; width: 26px; height: 26px;
    border: 3px solid #d4af37;
  }
  .gc-corner.tl { top: -3px; left: -3px; border-right: none; border-bottom: none; }
  .gc-corner.tr { top: -3px; right: -3px; border-left: none; border-bottom: none; }
  .gc-corner.bl { bottom: -3px; left: -3px; border-right: none; border-top: none; }
  .gc-corner.br { bottom: -3px; right: -3px; border-left: none; border-top: none; }
  .gc-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
  .gc-title { font-size: 22px; font-weight: 700; color: #c73e1d; letter-spacing: 4px; }
  .gc-seal-mini {
    width: 34px; height: 34px; background: #c73e1d; color: #faf7ef;
    font-size: 13px; line-height: 1.25; text-align: center;
    padding-top: 4px; border-radius: 4px; transform: rotate(6deg);
    box-shadow: 0 2px 6px rgba(199,62,29,.4); flex: 0 0 auto;
  }
  .gc-close {
    background: none; border: none; cursor: pointer;
    font-size: 24px; color: #a89a8c; line-height: 1; padding: 0 0 0 8px;
    font-family: inherit;
  }
  .gc-close:hover { color: #c73e1d; }
  .gc-sub { font-size: 14px; color: #7a6a5e; margin-bottom: 4px; letter-spacing: 1px; }
  .gc-meta {
    font-size: 12px; color: #a89a8c; margin-bottom: 22px;
    font-variant-numeric: tabular-nums; font-family: -apple-system, "PingFang SC", sans-serif;
  }
  /* ===== 朱红进度条 ===== */
  .gc-track {
    height: 20px; border: 1px solid #d4af37; background: #efe6d4;
    padding: 3px; margin-bottom: 14px; position: relative; overflow: hidden;
  }
  .gc-fill {
    height: 100%; width: 0%;
    background: repeating-linear-gradient(-45deg, #c73e1d 0 8px, #a93218 8px 16px);
    transition: width .12s linear;
  }
  .gc-track.installing .gc-fill {
    width: 100% !important;
    background: linear-gradient(90deg, #c73e1d 30%, #e8b64c 50%, #c73e1d 70%);
    background-size: 200% 100%;
    animation: sweep 1.2s linear infinite;
  }
  @keyframes sweep { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .gc-pct {
    text-align: center; font-size: 34px; font-weight: 700; color: #c73e1d;
    margin-bottom: 4px; font-variant-numeric: tabular-nums; letter-spacing: 2px;
  }
  .gc-hint { text-align: center; font-size: 13px; color: #a89a8c; min-height: 20px; margin-bottom: 16px; letter-spacing: 2px; }
  .gc-hint .dotdot::after { content: ''; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
  /* ===== 印章 ===== */
  .gc-seal-big {
    display: none;
    width: 84px; height: 84px; margin: 0 auto 10px;
    background: #c73e1d; border-radius: 8px;
    color: #faf7ef; font-size: 21px; font-weight: 700;
    align-items: center; justify-content: center; text-align: center; line-height: 1.3;
    transform: rotate(-8deg);
    box-shadow: 0 4px 14px rgba(199,62,29,.45), inset 0 0 0 3px rgba(250,247,239,.35);
  }
  .gc-seal-big.show { display: flex; animation: stamp .45s cubic-bezier(.2,2.4,.4,1); }
  @keyframes stamp { 0% { transform: scale(2.6) rotate(-8deg); opacity: 0; } 60% { transform: scale(.92) rotate(-8deg); opacity: 1; } 100% { transform: scale(1) rotate(-8deg); } }
  /* ===== 按钮 ===== */
  .gc-btn {
    width: 100%; padding: 13px 0;
    font-family: inherit; font-size: 17px; font-weight: 700; letter-spacing: 6px;
    background: #c73e1d; color: #faf7ef;
    border: 1px solid #d4af37; cursor: pointer;
    box-shadow: 0 4px 0 #8f2a12;
    transition: transform .08s, box-shadow .08s;
  }
  .gc-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #8f2a12; }
  .gc-btn.plain { background: #efe6d4; color: #7a6a5e; box-shadow: 0 4px 0 #d8c9a8; }
  .gc-btn.plain:active { box-shadow: 0 1px 0 #d8c9a8; }
  .gc-btn:disabled { opacity: .55; cursor: default; }
  .gc-divider {
    display: flex; align-items: center; gap: 8px;
    margin: 0 0 18px; color: #d4af37; font-size: 12px;
  }
  .gc-divider::before, .gc-divider::after {
    content: ''; flex: 1; height: 1px; background: #d4af37; opacity: .6;
  }
  .replay {
    margin-top: 20px; background: none; border: none; cursor: pointer;
    color: #a89a8c; font-family: inherit; font-size: 13px; letter-spacing: 2px;
  }
  .replay:hover { color: #c73e1d; }
  .toast {
    position: fixed; top: 26px; left: 50%;
    transform: translateX(-50%) translateY(-12px);
    background: #3a2e28; color: #f2e6c8;
    border: 1px solid #d4af37;
    padding: 10px 22px; font-size: 14px; letter-spacing: 2px;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
    z-index: 60; border-radius: 4px;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="gc-modal" id="modal">
  <span class="gc-corner tl"></span><span class="gc-corner tr"></span>
  <span class="gc-corner bl"></span><span class="gc-corner br"></span>
  <div class="gc-head">
    <div>
      <div class="gc-title">版本更新</div>
    </div>
    <div style="display:flex;align-items:flex-start;">
      <div class="gc-seal-mini">版本<br>更新</div>
      <button class="gc-close" id="closeBtn">×</button>
    </div>
  </div>
  <div class="gc-divider">❖</div>
  <div class="gc-sub" id="statusText">正在下载 3.3.1</div>
  <div class="gc-meta" id="metaText">0.0MB / 156.8MB · -- MB/s</div>
  <div class="gc-seal-big" id="sealBig">更新<br>完成</div>
  <div class="gc-track" id="track"><div class="gc-fill" id="fill"></div></div>
  <div class="gc-pct" id="pctText">0%</div>
  <div class="gc-hint" id="hintText"></div>
  <button class="gc-btn" id="mainBtn">取消更新</button>
</div>
<button class="replay" id="replayBtn">↺ 重新演示</button>
<div class="toast" id="toast"></div>

<script>
  const modal = document.getElementById('modal');
  const track = document.getElementById('track');
  const fill = document.getElementById('fill');
  const pctText = document.getElementById('pctText');
  const statusText = document.getElementById('statusText');
  const metaText = document.getElementById('metaText');
  const hintText = document.getElementById('hintText');
  const mainBtn = document.getElementById('mainBtn');
  const sealBig = document.getElementById('sealBig');
  const toast = document.getElementById('toast');

  const TOTAL_MB = 156.8, VERSION = '3.3.1';
  let progress = 0, state = 'downloading', timer = null, showSpeed = 0;

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 1800);
  }
  function render() {
    fill.style.width = progress + '%';
    pctText.textContent = Math.floor(progress) + '%';
    metaText.textContent = (progress/100*TOTAL_MB).toFixed(1) + 'MB / ' + TOTAL_MB + 'MB · ' + showSpeed.toFixed(1) + ' MB/s';
  }
  function setMain(label, cls, disabled) {
    mainBtn.textContent = label;
    mainBtn.className = 'gc-btn' + (cls ? ' ' + cls : '');
    mainBtn.disabled = !!disabled;
  }
  function tick() {
    if (state !== 'downloading') return;
    const sp = 8 * (0.6 + Math.random() * 0.8);
    showSpeed = showSpeed * 0.7 + sp * 0.3;
    progress += sp * 0.1 / TOTAL_MB * 100;
    if (progress >= 100) { progress = 100; render(); enterInstalling(); return; }
    render();
  }
  function startTimer() { clearInterval(timer); timer = setInterval(tick, 100); }
  function stopTimer() { clearInterval(timer); timer = null; }

  function enterDownloading(reset) {
    if (reset) {
      progress = 0; showSpeed = 0;
      track.classList.remove('installing');
      sealBig.classList.remove('show');
      modal.classList.remove('hidden');
    }
    state = 'downloading';
    statusText.textContent = '正在下载 ' + VERSION;
    hintText.innerHTML = '';
    setMain('取消更新', '', false);
    startTimer(); render();
  }
  function enterCancelled() {
    state = 'cancelled'; stopTimer();
    statusText.textContent = '下载已取消';
    hintText.textContent = '可随时重新下载';
    setMain('重新下载', 'plain', false);
    showToast('已取消下载');
  }
  function enterInstalling() {
    state = 'installing'; stopTimer();
    statusText.textContent = '正在安装...';
    hintText.innerHTML = '<span class="dotdot">请稍候</span>';
    setMain('安装中...', 'plain', true);
    track.classList.add('installing');
    setTimeout(() => { if (state === 'installing') enterDone(); }, 2600);
  }
  function enterDone() {
    state = 'done';
    track.classList.remove('installing');
    fill.style.width = '100%';
    sealBig.classList.add('show');
    statusText.textContent = '更新完成';
    hintText.textContent = '大吉大利';
    setMain('立即体验', '', false);
    showToast('已更新到最新版本');
  }

  mainBtn.addEventListener('click', () => {
    if (state === 'downloading') enterCancelled();
    else if (state === 'cancelled') enterDownloading(true);
    else if (state === 'done') { modal.classList.add('hidden'); showToast('更新完成'); }
  });
  document.getElementById('closeBtn').addEventListener('click', () => {
    if (state === 'downloading') enterCancelled();
    else modal.classList.add('hidden');
  });
  document.getElementById('replayBtn').addEventListener('click', () => {
    enterDownloading(true); showToast('重新开始演示');
  });

  window.addEventListener('load', () => {
    if (location.hash === '#done') {
      enterDownloading(true); progress = 100; render(); enterInstalling();
      setTimeout(enterDone, 400);
    } else enterDownloading(true);
  });
</script>
</body>
</html>
