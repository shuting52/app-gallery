<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>花朵更新 · BLOOM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(150deg, #fde7ef 0%, #e8f4e5 60%, #dcefe8 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 20px 14px; color: #3a3a3a;
  }
  .modal {
    width: 340px; background: rgba(255,255,255,.92);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,.7); border-radius: 26px;
    padding: 24px 22px 20px; box-shadow: 0 24px 60px rgba(190,140,160,.28);
    display: flex; flex-direction: column; align-items: center;
  }
  .modal.hidden { display: none; }
  .m-head { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .m-title { font-size: 18px; font-weight: 700; letter-spacing: 1px; color: #4a3542; }
  .m-title .ver {
    font-size: 11px; color: #c2618f; border: 1px solid rgba(194,97,143,.5);
    border-radius: 99px; padding: 2px 9px; margin-left: 6px; vertical-align: 2px;
    background: rgba(194,97,143,.07);
  }
  .x { background: none; border: none; color: #b09aa5; font-size: 24px; cursor: pointer; line-height: 1; }
  .x:hover { color: #6b4a5a; }
  .m-sub { width: 100%; font-size: 14px; color: #7a6570; margin-bottom: 3px; text-align: left; }
  .m-meta { width: 100%; font-size: 12px; color: #a8949f; margin-bottom: 10px; text-align: left; font-variant-numeric: tabular-nums; }

  .stage { position: relative; width: 240px; height: 240px; margin-bottom: 6px; }
  .stage svg { width: 240px; height: 240px; display: block; overflow: visible; }
  .stage svg.sway { animation: sway 1.8s ease-in-out infinite; transform-origin: 50% 60%; }
  @keyframes sway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }

  .petal {
    transform-box: fill-box; transform-origin: 50% 100%;
    transform: scale(.16); fill: #d99ab8;
    transition: transform .55s cubic-bezier(.34,1.7,.5,1), fill .55s;
  }
  .petal.open { transform: scale(1); }
  .petal.open.cA { fill: #f9b1cd; }
  .petal.open.cB { fill: #f492bd; }

  .burst { position: absolute; left: 50%; top: 46%; width: 0; height: 0; pointer-events: none; }
  .burst span {
    position: absolute; width: 8px; height: 8px; border-radius: 50%;
    background: #f6c453; opacity: 0;
  }
  .burst.go span { animation: burst 1.1s ease-out forwards; }
  @keyframes burst {
    0% { opacity: 1; transform: translate(0,0) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.3); }
  }
  .badge {
    position: absolute; left: 50%; top: 46%; width: 58px; height: 58px;
    margin: -29px 0 0 -29px; border-radius: 50%;
    background: linear-gradient(135deg, #ffd97a, #f5a83f);
    box-shadow: 0 8px 24px rgba(245,168,63,.5);
    display: flex; align-items: center; justify-content: center;
    transform: scale(0); transition: transform .5s cubic-bezier(.2,1.6,.4,1);
  }
  .badge.on { transform: scale(1); }
  .badge svg { width: 30px; height: 30px; }
  .badge path { fill: none; stroke: #fff; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }

  .pct { font-size: 40px; font-weight: 800; color: #4a3542; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
  .petal-count { font-size: 12px; color: #b08ba0; letter-spacing: 3px; margin-top: 2px; }

  .main-btn {
    width: 100%; margin-top: 16px; padding: 14px 0; border-radius: 99px; border: none;
    font-size: 16px; font-weight: 600; letter-spacing: 2px; cursor: pointer;
    background: #f3e4ec; color: #c2618f; transition: all .25s;
  }
  .main-btn:hover { background: #ecd3e0; }
  .main-btn.go { background: linear-gradient(135deg, #f9b1cd, #ef7bab); color: #fff;
    box-shadow: 0 8px 24px rgba(239,123,171,.4); }
  .main-btn:disabled { opacity: .45; cursor: default; }
  .replay { margin-top: 10px; background: none; border: none; color: #b89fae;
    font-size: 12.5px; cursor: pointer; letter-spacing: 1px; }
  .replay:hover { color: #c2618f; }
  .toast {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-14px);
    background: rgba(74,53,66,.94); color: #fff;
    padding: 10px 22px; border-radius: 99px; font-size: 14px; opacity: 0;
    pointer-events: none; transition: all .25s; z-index: 60;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="modal" id="modal">
  <div class="m-head">
    <div class="m-title">🌸 花朵更新<span class="ver">v4.0.0</span></div>
    <button class="x" id="xBtn">×</button>
  </div>
  <div class="m-sub" id="statusText">正在下载 v4.0.0，花苞正在苏醒</div>
  <div class="m-meta" id="metaText">0.0MB / 156.8MB · -- MB/s</div>

  <div class="stage">
    <svg id="flowerSvg" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="26" fill="#8fce96"/>
      <g id="petals"></g>
      <circle cx="100" cy="100" r="15" fill="#fbbf24"/>
      <g fill="#f59e0b">
        <circle cx="100" cy="82" r="3.2"/><circle cx="116" cy="91" r="3.2"/>
        <circle cx="116" cy="109" r="3.2"/><circle cx="100" cy="118" r="3.2"/>
        <circle cx="84" cy="109" r="3.2"/><circle cx="84" cy="91" r="3.2"/>
      </g>
    </svg>
    <div class="burst" id="burst"></div>
    <div class="badge" id="badge">
      <svg viewBox="0 0 24 24"><path d="M4.5 12.5 L10 18 L19.5 6.5"/></svg>
    </div>
  </div>

  <div class="pct" id="pctText">0%</div>
  <div class="petal-count" id="petalCount">花开 0 / 10</div>

  <button class="main-btn" id="mainBtn">取消更新</button>
  <button class="replay" id="replayBtn">↺ 重新演示</button>
</div>
<div class="toast" id="toast"></div>

<script>
  const petalsG = document.getElementById('petals');
  const flowerSvg = document.getElementById('flowerSvg');
  const burst = document.getElementById('burst');
  const badge = document.getElementById('badge');
  const pctText = document.getElementById('pctText');
  const petalCount = document.getElementById('petalCount');
  const statusText = document.getElementById('statusText');
  const metaText = document.getElementById('metaText');
  const mainBtn = document.getElementById('mainBtn');
  const modal = document.getElementById('modal');
  const toast = document.getElementById('toast');

  // 10 花瓣
  const petalEls = [];
  for (let i = 0; i < 10; i++) {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('transform', `rotate(${i * 36} 100 100)`);
    const e = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
    e.setAttribute('cx', 100); e.setAttribute('cy', 50);
    e.setAttribute('rx', 19); e.setAttribute('ry', 44);
    e.setAttribute('class', 'petal ' + (i % 2 ? 'cB' : 'cA'));
    g.appendChild(e); petalsG.appendChild(g);
    petalEls.push(e);
  }

  const TOTAL_MB = 156.8;
  let progress = 0, state = 'downloading', timer = null, showSpeed = 0, fast = false;

  function openCount(p) { return Math.min(10, Math.floor(p / 10)); }

  function render() {
    const p = Math.min(Math.max(progress, 0), 100);
    pctText.textContent = Math.floor(p) + '%';
    const n = openCount(p);
    petalEls.forEach((el, i) => el.classList.toggle('open', i < n));
    petalCount.textContent = `花开 ${n} / 10`;
    const mb = (p / 100 * TOTAL_MB).toFixed(1);
    if (state === 'downloading') metaText.textContent = `${mb}MB / ${TOTAL_MB}MB · ${showSpeed.toFixed(1)} MB/s`;
  }

  function showToast(msg) {
    toast.textContent = msg; toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 1800);
  }
  function setMain(label, go, disabled) {
    mainBtn.textContent = label;
    mainBtn.classList.toggle('go', !!go);
    mainBtn.disabled = !!disabled;
  }
  function regressPetals() {
    // 取消：花瓣按逆序收回
    const n = openCount(progress);
    for (let i = n - 1; i >= 0; i--) {
      setTimeout(((idx) => () => petalEls[idx].classList.remove('open'))(i), (n - 1 - i) * 90);
    }
  }

  function tick() {
    if (state !== 'downloading') return;
    const sp = 8 * (0.6 + Math.random() * 0.8);
    showSpeed = showSpeed * 0.7 + sp * 0.3;
    progress += sp * 0.1 / TOTAL_MB * 100;
    if (progress >= 100) { progress = 100; render(); enterInstalling(); return; }
    render();
  }
  function startTimer() { clearInterval(timer); timer = setInterval(tick, 100); }

  function enterDownloading(reset) {
    if (reset) {
      progress = 0; showSpeed = 0;
      flowerSvg.classList.remove('sway');
      badge.classList.remove('on'); burst.classList.remove('go');
    }
    state = 'downloading';
    statusText.textContent = '正在下载 v4.0.0，花苞正在苏醒';
    setMain('取消更新', false, false);
    startTimer(); render();
  }
  function enterCancelled() {
    state = 'cancelled'; clearInterval(timer);
    regressPetals();
    progress = 0;
    setTimeout(render, openCount(100) * 90 + 100);
    statusText.textContent = '已取消更新，花瓣收回了';
    metaText.textContent = `0.0MB / ${TOTAL_MB}MB · 已停止`;
    setMain('重新下载', false, false);
    showToast('已取消更新');
  }
  function enterInstalling() {
    state = 'installing'; clearInterval(timer);
    flowerSvg.classList.add('sway');
    statusText.textContent = '正在安装…春风拂过花海';
    metaText.textContent = `${TOTAL_MB}MB / ${TOTAL_MB}MB · 校验完成`;
    setMain('安装中…', false, true);
    setTimeout(() => { if (state === 'installing') enterDone(); }, fast ? 400 : 2000);
    render();
  }
  function enterDone() {
    state = 'done';
    flowerSvg.classList.remove('sway');
    // 花粉 burst
    burst.innerHTML = '';
    for (let i = 0; i < 16; i++) {
      const s = document.createElement('span');
      const a = Math.random() * Math.PI * 2, d = 55 + Math.random() * 60;
      s.style.setProperty('--dx', (Math.cos(a) * d).toFixed(0) + 'px');
      s.style.setProperty('--dy', (Math.sin(a) * d).toFixed(0) + 'px');
      s.style.background = ['#f6c453', '#f9b1cd', '#f492bd'][i % 3];
      burst.appendChild(s);
    }
    burst.classList.remove('go'); void burst.offsetWidth; burst.classList.add('go');
    setTimeout(() => badge.classList.add('on'), 350);
    statusText.textContent = '更新完成，花开满园';
    petalCount.textContent = '花开 10 / 10 · 绽放成功';
    metaText.textContent = `v4.0.0 已安装 · 春满人间`;
    setMain('立即体验', true, false);
    showToast('已更新到 v4.0.0');
    render();
  }

  mainBtn.addEventListener('click', () => {
    if (state === 'downloading') enterCancelled();
    else if (state === 'cancelled') enterDownloading(true);
    else if (state === 'done') { modal.classList.add('hidden'); showToast('已进入 v4.0.0'); }
  });
  document.getElementById('xBtn').addEventListener('click', () => {
    if (state === 'downloading') enterCancelled();
    else modal.classList.add('hidden');
  });
  document.getElementById('replayBtn').addEventListener('click', () => {
    modal.classList.remove('hidden');
    enterDownloading(true);
    showToast('重新开始演示');
  });

  window.addEventListener('load', () => {
    if (location.hash === '#done') { fast = true; progress = 100; render(); enterInstalling(); }
    else if (location.hash === '#mid') { progress = 55; showSpeed = 8.2; enterDownloading(false); progress = 55; render(); }
    else enterDownloading(false);
  });
</script>
</body>
</html>
