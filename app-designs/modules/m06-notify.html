<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>通知中心 · 通知与提醒</title>
<style>
:root{
  --bg:#F2F4F8; --card:#FFFFFF; --ink:#1F2430; --ink2:#6B7280; --ink3:#9AA3B2;
  --line:#E7EAF1; --indigo:#4F46E5; --indigo-soft:#EEF0FE;
  --sys:#4F46E5; --promo:#F59E0B; --social:#10B981; --ship:#0EA5E9; --warn:#EF4444;
  --red:#FF3B30; --radius:14px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#D8DCE6}
body{font-family:var(--font);background:#D8DCE6;color:var(--ink);min-height:100vh;display:flex;justify-content:center}
.phone{width:100%;max-width:430px;background:var(--bg);min-height:100vh;position:relative;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(31,36,48,.18)}
.topbar{background:#fff;padding:14px 18px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar h1{font-size:20px;font-weight:700;letter-spacing:.5px}
.topbar .sub{font-size:12px;color:var(--ink3);margin-top:2px}
.topbar .actions{position:absolute;right:16px;top:16px;display:flex;gap:14px;font-size:20px}
.topbar .actions span{cursor:pointer}
.main{flex:1;overflow-y:auto;padding-bottom:96px}
/* ---------- 通知页 ---------- */
.group-title{font-size:13px;color:var(--ink2);padding:18px 18px 8px;font-weight:600}
.nitem{background:#fff;margin:0 14px;border-bottom:1px solid var(--line);padding:13px 14px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;position:relative;transition:background .15s}
.nitem:first-of-type{border-top-left-radius:var(--radius);border-top-right-radius:var(--radius)}
.nitem:last-child{border-bottom-left-radius:var(--radius);border-bottom-right-radius:var(--radius);border-bottom:none}
.nitem:active{background:#F7F8FC}
.nicon{width:40px;height:40px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff}
.nicon.sys{background:linear-gradient(135deg,#6366F1,#4F46E5)}
.nicon.promo{background:linear-gradient(135deg,#FBBF24,#F59E0B)}
.nicon.social{background:linear-gradient(135deg,#34D399,#10B981)}
.nicon.ship{background:linear-gradient(135deg,#38BDF8,#0EA5E9)}
.nicon.warn{background:linear-gradient(135deg,#F87171,#EF4444)}
.nbody{flex:1;min-width:0}
.ntitle{font-size:15px;font-weight:600;line-height:1.35;display:flex;align-items:center;gap:6px}
.ndesc{font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ntime{font-size:11px;color:var(--ink3);margin-top:5px}
.ntag{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600;flex:none}
.ntag.sys{background:var(--indigo-soft);color:var(--indigo)}
.ntag.promo{background:#FEF3C7;color:#B45309}
.ntag.social{background:#D1FAE5;color:#047857}
.ntag.ship{background:#E0F2FE;color:#0369A1}
.ndot{width:9px;height:9px;border-radius:50%;background:var(--red);flex:none;margin-top:6px}
.ndot.hidden{display:none}
.chevron{color:var(--ink3);font-size:18px;flex:none;margin-top:2px}
/* ---------- 站内信 ---------- */
.litem{background:#fff;margin:10px 14px;border-radius:var(--radius);padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;border:1px solid var(--line)}
.litem:active{background:#F7F8FC}
.avatar{width:46px;height:46px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:700}
.avatar.kf{background:linear-gradient(135deg,#6366F1,#8B5CF6)}
.avatar.xt{background:linear-gradient(135deg,#64748B,#334155)}
.lbody{flex:1;min-width:0}
.lname{font-size:15px;font-weight:600}
.lname .off{font-size:10px;color:var(--indigo);border:1px solid var(--indigo);border-radius:4px;padding:1px 5px;margin-left:6px;font-weight:600}
.lprev{font-size:13px;color:var(--ink2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ltime{font-size:11px;color:var(--ink3);flex:none;align-self:flex-start}
.unread-badge{min-width:20px;height:20px;border-radius:11px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px;margin-top:4px}
/* ---------- 详情页 ---------- */
.detail{background:#fff;margin:14px;border-radius:var(--radius);padding:20px 18px;border:1px solid var(--line)}
.detail .dt-tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;margin-bottom:10px;display:inline-block}
.detail h2{font-size:18px;line-height:1.45;margin-bottom:8px}
.detail .dtime{font-size:12px;color:var(--ink3);margin-bottom:14px}
.detail .dicon{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;margin-bottom:12px}
.detail p{font-size:14.5px;line-height:1.9;color:#374151;margin-bottom:12px}
.detail .btn{display:block;width:100%;padding:13px;border-radius:12px;border:none;background:var(--indigo);color:#fff;font-size:15px;font-weight:600;margin-top:8px;cursor:pointer}
.backbar{display:flex;align-items:center;gap:6px;padding:12px 14px 0;font-size:14px;color:var(--indigo);cursor:pointer;font-weight:600}
.letter-paper{background:#fff;margin:14px;border-radius:var(--radius);border:1px solid var(--line);overflow:hidden}
.letter-head{padding:18px;border-bottom:1px dashed var(--line)}
.letter-head h2{font-size:17px;margin-bottom:6px}
.letter-head .from{font-size:12.5px;color:var(--ink2)}
.letter-body{padding:18px;font-size:14.5px;line-height:2;color:#374151}
.letter-body p{margin-bottom:12px}
.letter-sign{text-align:right;padding:0 18px 18px;font-size:13px;color:var(--ink2)}
/* ---------- 提醒设置 ---------- */
.sec{background:#fff;margin:14px 14px 0;border-radius:var(--radius);border:1px solid var(--line);overflow:hidden}
.sec-title{font-size:13px;color:var(--ink2);padding:18px 18px 8px;font-weight:600}
.srow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:none}
.sicon{width:38px;height:38px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff}
.sbody{flex:1;min-width:0}
.stitle{font-size:15px;font-weight:600}
.sdesc{font-size:12px;color:var(--ink3);margin-top:2px;line-height:1.5}
/* iOS switch */
.switch{position:relative;width:52px;height:31px;flex:none;cursor:pointer}
.switch input{display:none}
.sw{position:absolute;inset:0;background:#D1D5DB;border-radius:17px;transition:.2s}
.sw:before{content:"";position:absolute;width:27px;height:27px;background:#fff;border-radius:50%;top:2px;left:2px;transition:.2s;box-shadow:0 2px 5px rgba(0,0,0,.25)}
.switch input:checked + .sw{background:var(--indigo)}
.switch input:checked + .sw:before{transform:translateX(21px)}
.timerow{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line);font-size:15px}
.timerow:last-child{border-bottom:none}
.timeselect{display:flex;align-items:center;gap:8px;color:var(--ink2)}
.timeselect select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:14px;color:var(--ink);background:#F8FAFC;font-family:var(--font)}
.note{font-size:12px;color:var(--ink3);padding:12px 20px;line-height:1.7}
/* ---------- 我的页 ---------- */
.me-head{background:linear-gradient(135deg,#4F46E5,#7C6CF0);padding:26px 20px;color:#fff}
.me-row{display:flex;align-items:center;gap:14px}
.me-avatar{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;border:2px solid rgba(255,255,255,.5)}
.me-name{font-size:19px;font-weight:700}
.me-id{font-size:12px;opacity:.8;margin-top:4px}
.me-menu{background:#fff;margin:14px;border-radius:var(--radius);border:1px solid var(--line);overflow:hidden}
.mrow{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer}
.mrow:last-child{border-bottom:none}
.mrow:active{background:#F7F8FC}
.micon{width:30px;text-align:center;margin-right:10px;font-size:18px}
.mrow .mval{margin-left:auto;font-size:13px;color:var(--ink3)}
.mrow .chev{color:var(--ink3);margin-left:6px}
.stat3{display:flex;background:#fff;margin:14px;border-radius:var(--radius);border:1px solid var(--line)}
.stat3 div{flex:1;text-align:center;padding:16px 0}
.stat3 b{font-size:20px;color:var(--indigo)}
.stat3 span{display:block;font-size:12px;color:var(--ink2);margin-top:4px}
/* ---------- 底部 Tab ---------- */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;text-align:center;padding:9px 0 8px;font-size:11px;color:var(--ink3);cursor:pointer}
.tab .tico{font-size:22px;display:block;margin-bottom:2px;position:relative}
.tab.on{color:var(--indigo);font-weight:700}
.tbadge{position:absolute;top:-4px;right:calc(50% - 20px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.page{display:none}
.page.on{display:block}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(31,36,48,.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:24px;opacity:0;transition:opacity .25s;z-index:50;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>

      <div class="sec" id="remindSec2"></div>
      <div class="note">修改将于保存后实时生效。关闭全部提醒后，你仍可在 App 内查看通知记录。</div>
      <button class="detail" id="saveBtn" style="border:none;cursor:pointer;font-size:15px;font-weight:700;color:var(--indigo);text-align:center">保存设置</button>

    <section class="page" id="page-mine">
      <div class="me-head">
        <div class="me-row">
          <div class="me-avatar">陈</div>
          <div><div class="me-name">陈淑婷</div><div class="me-id">账号 ID：CST-88214 · 通知中心会员</div></div>
        </div>
      </div>

      <div class="me-menu">

        <div class="mrow"><span class="micon">📬</span>信件回收站<span class="mval"></span><span class="chev">›</span></div>
        <div class="mrow"><span class="micon">🕒</span>通知历史<span class="mval">最近 30 天</span><span class="chev">›</span></div>
        <div class="mrow"><span class="micon">🛡</span>隐私与推送权限<span class="mval"></span><span class="chev">›</span></div>
        <div class="mrow"><span class="micon">❓</span>帮助与反馈<span class="mval"></span><span class="chev">›</span></div>
      </div>
    </section>
  </div>
  <nav class="tabbar" id="tabbar">

    <div class="tab" data-tab="letter"><span class="tico">✉️<span class="tbadge" id="badgeLetter">3</span></span>站内信</div>

  </nav>
  <div class="toast" id="toast"></div>
</div>

  body:"尊敬的用户：\n\n您的账号已于 10 月 18 日完成实名认证，账号信用分 +5，当前信用等级：良好。\n\n实名认证后您可享受：大额支付免验证、优先客服通道、专属活动报名资格。\n\n请妥善保管个人信息，切勿将验证码透露给他人。\n\n系统通知\n2026 年 10 月 18 日"},
 {id:"l3",from:"官方客服",off:true,avatar:"kf",avt:"服",preview:"欢迎使用通知中心！新手引导与常见问题…",time:"10-12",unread:0,
  title:"欢迎使用通知中心",
  body:"欢迎来到通知中心！\n\n在这里你可以：\n1. 接收订单物流、活动优惠等实时推送；\n2. 在站内信与官方客服直接沟通；\n3. 在「提醒」页自定义各类消息开关与免打扰时段。\n\n常见问题：\nQ：收不到推送怎么办？\nA：请检查手机系统设置中是否允许本 App 发送通知，并确认未开启省电模式限制。\n\n祝使用愉快！\n官方客服团队"}
];
var REMIND1=[
 {t:"订单物流提醒",d:"下单、发货、派送、签收全程跟踪",c:"#0EA5E9",i:"🚚",on:true},
 {t:"优惠活动提醒",d:"大促、秒杀、优惠券到账通知",c:"#F59E0B",i:"🎁",on:true},
 {t:"互动消息提醒",d:"点赞、评论、@你的消息",c:"#10B981",i:"💬",on:false},
 {t:"系统公告提醒",d:"版本更新、政策变更等重要公告",c:"#4F46E5",i:"📢",on:true}
];
var REMIND2=[
 {t:"声音提醒",d:"收到通知时播放提示音",on:true},
 {t:"振动提醒",d:"收到通知时振动",on:true},
 {t:"锁屏显示详情",d:"在锁屏上显示通知内容",on:false},
 {t:"横幅通知",d:"顶部弹出横幅并可快捷操作",on:true}
];
function el(html){var d=document.createElement("div");d.innerHTML=html;return d.firstChild;}
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("show");},1600);}
function badgeRefresh(){
 var u=NOTIFY.filter(function(n){return !n.read;}).length;
 var b=document.getElementById("badgeNotify");
 b.textContent=u;b.style.display=u?"flex":"none";
 document.getElementById("stUnread").textContent=u;
 var lu=LETTERS.reduce(function(a,l){return a+l.unread;},0);
 var bl=document.getElementById("badgeLetter");
 bl.textContent=lu;bl.style.display=lu?"flex":"none";
}
/* ---- 通知列表渲染 ---- */
function renderNotify(){
 ["today","yest"].forEach(function(day){
  var box=document.getElementById(day==="today"?"grpToday":"grpYest");
  box.innerHTML="";
  NOTIFY.filter(function(n){return n.day===day;}).forEach(function(n){
   var tg=TAGS[n.type];
   var item=el('<div class="nitem"><div class="nicon '+n.type+'">'+ICONS[n.type]+'</div><div class="nbody"><div class="ntitle">'+n.title+'</div><div class="ndesc">'+n.desc+'</div><div class="ntime">'+n.time+' · <span class="ntag '+tg[0]+'">'+tg[1]+'</span></div></div><div class="ndot'+(n.read?" hidden":"")+'"></div></div>');
   item.addEventListener("click",function(){openDetail(n.id);});
   box.appendChild(item);
  });
 });
 badgeRefresh();
}
/* ---- 通知详情 ---- */
function openDetail(id){
 var n=NOTIFY.filter(function(x){return x.id===id;})[0];if(!n)return;
 var tg=TAGS[n.type];
 document.getElementById("detailBox").innerHTML=
  '<div class="dicon '+n.type+'" style="background:linear-gradient(135deg,var(--'+n.type+'),var(--'+n.type+'))">'+ICONS[n.type]+'</div>'+
  '<span class="dt-tag ntag '+tg[0]+'">'+tg[1]+'</span>'+
  '<h2>'+n.title+'</h2><div class="dtime">'+n.time+' · 通知中心</div>'+
  n.body.split("\n").map(function(p){return "<p>"+p+"</p>";}).join("")+
  (n.type==="promo"?'<button class="btn" id="dBtn">去看看</button>':"")+
  (n.type==="warn"?'<button class="btn" id="dBtn">立即修改密码</button>':"");
 var b=document.getElementById("dBtn");
 if(b)b.addEventListener("click",function(){toast(n.type==="warn"?"已跳转至安全中心（演示）":"已跳转至活动页（演示）");});
 if(!n.read){n.read=true;renderNotify();}
 showPage("detail","通知详情","该通知的完整内容");
}
/* ---- 站内信 ---- */
function renderLetters(){
 var box=document.getElementById("letterList");box.innerHTML="";
 LETTERS.forEach(function(l){
  var item=el('<div class="litem"><div class="avatar '+l.avatar+'">'+l.avt+'</div><div class="lbody"><div class="lname">'+l.from+(l.off?'<span class="off">官方</span>':"")+'</div><div class="lprev">'+l.preview+'</div></div><div style="display:flex;flex-direction:column;align-items:flex-end"><div class="ltime">'+l.time+'</div>'+(l.unread?'<div class="unread-badge">'+l.unread+'</div>':"")+'</div></div>');
  item.addEventListener("click",function(){openLetter(l.id);});
  box.appendChild(item);
 });
 badgeRefresh();
}
function openLetter(id){
 var l=LETTERS.filter(function(x){return x.id===id;})[0];if(!l)return;
 document.getElementById("letterBox").innerHTML=
  '<div class="letter-head"><h2>'+l.title+'</h2><div class="from">发件人：'+l.from+(l.off?"（官方认证）":"")+' · '+l.time+'</div></div>'+
  '<div class="letter-body">'+l.body.split("\n").map(function(p){return p?("<p>"+p+"</p>"):"";}).join("")+'</div>'+
  '<div class="letter-sign">— 通知中心</div>';
 if(l.unread){l.unread=0;renderLetters();}
 showPage("letterdetail","站内信详情",l.from);
}
/* ---- 提醒设置 ---- */
function renderRemind(){
 function sec(list,boxId){
  var box=document.getElementById(boxId);box.innerHTML="";
  list.forEach(function(r){
   var row=el('<div class="srow"><div class="sicon" style="background:'+r.c+'">'+r.i+'</div><div class="sbody"><div class="stitle">'+r.t+'</div><div class="sdesc">'+r.d+'</div></div><label class="switch"><input type="checkbox"'+(r.on?" checked":"")+ '><span class="sw"></span></label></div>');
   var inp=row.querySelector("input");
   inp.addEventListener("change",function(){r.on=inp.checked;toast(r.t+(inp.checked?"已开启":"已关闭"));});
   box.appendChild(row);
  });
 }
 REMIND1.forEach(function(r,i){if(!r.c)r.c="#4F46E5";});
 sec(REMIND1,"remindSec1");
 sec(REMIND2.map(function(r){return {t:r.t,d:r.d,i:r.t.indexOf("声音")>=0?"🔊":r.t.indexOf("振动")>=0?"📳":r.t.indexOf("锁屏")>=0?"🔒":"💠",c:"#4F46E5",on:r.on};}),"remindSec2");
 var ds=document.getElementById("dndStart"),de=document.getElementById("dndEnd");
 if(!ds.options.length){
  for(var h=18;h<=23;h++){ds.add(new Option(h+":00",h+":00"));}
  ds.value="22:00";
  ["06:00","07:00","08:00"].forEach(function(t){de.add(new Option(t,t));});
  de.value="07:00";
 }
}
/* ---- 页面/Tab ---- */
var TITLES={notify:["通知","系统 · 活动 · 互动，一眼不错过"],detail:["通知详情","该通知的完整内容"],letter:["站内信","官方客服 · 系统信件"],letterdetail:["站内信详情",""],remind:["提醒设置","自定义你的消息偏好"],mine:["我的","账号与通知管理"]};
function showPage(name,title,sub){
 document.querySelectorAll(".page").forEach(function(p){p.classList.remove("on");});
 document.getElementById("page-"+name).classList.add("on");
 document.getElementById("topTitle").textContent=title;
 document.getElementById("topSub").textContent=sub;
 document.querySelector(".main").scrollTop=0;
}
function switchTab(tab){
 document.querySelectorAll(".tab").forEach(function(t){t.classList.toggle("on",t.dataset.tab===tab);});
 showPage(tab,TITLES[tab][0],TITLES[tab][1]);
 if(history.replaceState){history.replaceState(null,"","?tab="+tab);}
}
document.querySelectorAll(".tab").forEach(function(t){
 t.addEventListener("click",function(){switchTab(t.dataset.tab);});
});
document.querySelectorAll(".backbar").forEach(function(b){
 b.addEventListener("click",function(){switchTab(b.dataset.back);});
});
document.getElementById("markAll").addEventListener("click",function(){
 NOTIFY.forEach(function(n){n.read=true;});renderNotify();toast("全部通知已标为已读");
});
document.getElementById("saveBtn").addEventListener("click",function(){toast("提醒设置已保存");});
document.getElementById("dnd").addEventListener("change",function(e){toast("夜间免打扰"+(e.target.checked?"已开启":"已关闭"));});
document.getElementById("dndStart").addEventListener("change",function(e){toast("免打扰开始时间："+e.target.value);});
document.getElementById("dndEnd").addEventListener("change",function(e){toast("免打扰结束时间："+e.target.value);});
/* ---- init ---- */
renderNotify();renderLetters();renderRemind();
var q=(location.search.match(/tab=([a-z]+)/)||[])[1];
var ok={notify:1,letter:1,remind:1,mine:1};
switchTab(ok[q]?q:"notify");
})();
</script>
