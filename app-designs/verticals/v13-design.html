<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>灵感工坊 · 海报制作</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0e0d11; --panel:#17161c; --panel2:#1e1d24; --line:#2a2833;
  --mg:#ff2d78; --or:#ff5a2b; --grad:linear-gradient(120deg,#ff2d78,#ff5a2b);
  --txt:#f4f1f6; --dim:#a9a5b5; --dim2:#6f6b7c;
}
html{background:#050406}
body{background:var(--bg);color:var(--txt);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;min-height:100vh}
.phone{max-width:430px;margin:0 auto;background:var(--bg);min-height:100vh;position:relative;padding-bottom:86px}
/* 顶部栏 */
.topbar{position:sticky;top:0;z-index:20;background:rgba(14,13,17,.92);backdrop-filter:blur(12px);padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:13px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 18px rgba(255,45,120,.45)}
.brand h1{font-size:21px;font-weight:900;letter-spacing:1px}
.brand h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{font-size:10px;color:var(--dim2);letter-spacing:4px;margin-top:2px}
/* 页面 */
.page{display:none;animation:fade .25s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
section.pad{padding:16px 20px}
h2.big{font-size:30px;font-weight:900;line-height:1.25;letter-spacing:1px}
h2.big .hl{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--dim);font-size:13px;margin-top:6px}
/* 搜索 */
.search{margin:14px 0;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 14px;color:var(--dim2);font-size:14px}
.search input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-size:14px}
/* 分类横滑 */
.cats{display:flex;gap:10px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;padding:9px 18px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--dim);cursor:pointer;white-space:nowrap}
.cat.on{background:var(--grad);color:#fff;border:none;font-weight:700;box-shadow:0 4px 14px rgba(255,45,120,.4)}
/* 模板网格 */
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-bottom:10px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .15s}
.tcard:active{transform:scale(.97)}
.cover{height:150px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cover .ct{font-size:24px;font-weight:900;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.4);padding:0 12px;text-align:center;line-height:1.4}
.cover .tag{position:absolute;top:8px;left:8px;font-size:10px;background:rgba(0,0,0,.45);padding:3px 9px;border-radius:999px;color:#fff}
.tinfo{padding:10px 12px 12px}
.tinfo h4{font-size:14px;font-weight:700}
.tinfo p{font-size:11px;color:var(--dim2);margin-top:4px}
.tinfo .use{display:inline-block;margin-top:8px;font-size:11px;color:#ffb199;background:rgba(255,90,43,.12);padding:3px 10px;border-radius:999px}
/* 编辑页 */
.canvas-wrap{padding:16px 20px}
.canvas{width:100%;aspect-ratio:3/4;border-radius:18px;position:relative;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.55),0 0 0 1px var(--line);transition:filter .3s}
.canvas .layer{position:absolute;cursor:pointer;user-select:none}
.layer.sel{outline:2px dashed #fff;outline-offset:3px}
.canvas-hint{text-align:center;color:var(--dim2);font-size:12px;margin-top:10px}
.tools{position:sticky;bottom:74px;background:var(--panel);border-top:1px solid var(--line);padding:10px 8px 14px;z-index:15}
.toolrow{display:flex;justify-content:space-around}
.tool{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--dim);cursor:pointer;padding:6px 0;border-radius:10px;border:none;background:none;font-family:inherit}
.tool .ic{font-size:22px}
.tool.on{color:#fff}
.tool.on .ic{filter:drop-shadow(0 0 8px rgba(255,45,120,.8))}
.panelbox{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 14px 0;display:none}
.panelbox.on{display:block}
.optrow{display:flex;gap:8px;flex-wrap:wrap}
.opt{padding:8px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--dim);cursor:pointer}
.opt.on{background:var(--grad);color:#fff;border:none;font-weight:700}
.opt:active{transform:scale(.95)}
.swatch{width:44px;height:44px;border-radius:12px;cursor:pointer;border:2px solid transparent}
.swatch.on{border-color:#fff}
.stk{font-size:30px;cursor:pointer;padding:6px;background:var(--panel);border-radius:12px;border:1px solid var(--line)}
.layers{margin:8px 14px 0}
.litem{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:13px}
.litem .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.litem button{border:none;background:var(--panel2);color:var(--dim);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
.litem.sel{border-color:var(--mg)}
.savebtn{margin:14px 20px 0;width:calc(100% - 40px);padding:14px;border:none;border-radius:16px;background:var(--grad);color:#fff;font-size:16px;font-weight:800;letter-spacing:2px;cursor:pointer;box-shadow:0 6px 22px rgba(255,45,120,.4)}
.savebtn:active{transform:scale(.98)}
/* 作品页 */
.secttl{display:flex;justify-content:space-between;align-items:center;margin:6px 0 12px}
.secttl h3{font-size:18px;font-weight:800}
.secttl span{font-size:12px;color:var(--dim2)}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.wcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.wcover{height:130px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.wcover .ct{font-size:19px;font-weight:900;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.4);padding:0 10px;text-align:center;line-height:1.35}
.wcover .draft{position:absolute;top:8px;right:8px;font-size:10px;background:rgba(0,0,0,.55);color:#ffd9a8;padding:3px 9px;border-radius:999px}
.wact{display:flex;border-top:1px solid var(--line)}
.wact button{flex:1;padding:10px 0;border:none;background:none;color:var(--dim);font-size:12px;cursor:pointer;font-family:inherit}
.wact button:first-child{color:#ff8fb0}
.wact button+button{border-left:1px solid var(--line)}
.wact .del{color:#ff6b6b}
.empty{text-align:center;color:var(--dim2);font-size:13px;padding:26px 0;border:1px dashed var(--line);border-radius:14px;margin-bottom:6px}
/* 我的页 */
.me-head{display:flex;align-items:center;gap:14px}
.avatar{width:66px;height:66px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 4px 16px rgba(255,45,120,.4)}
.me-head h3{font-size:19px;font-weight:800}
.me-head p{font-size:12px;color:var(--dim);margin-top:4px}
.vip{margin-top:14px;border-radius:18px;padding:18px;background:linear-gradient(120deg,#3a0d22,#7a1030 45%,#c2410c);border:1px solid rgba(255,120,120,.35);position:relative;overflow:hidden}
.vip::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,120,150,.35),transparent 70%)}
.vip h4{font-size:16px;font-weight:800;letter-spacing:1px}
.vip p{font-size:12px;color:#ffd9c9;margin-top:6px}
.vip .btn{display:inline-block;margin-top:12px;font-size:13px;font-weight:700;background:#fff;color:#c2410c;padding:8px 20px;border-radius:999px;cursor:pointer}
.mlist{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.mitem{display:flex;align-items:center;gap:12px;padding:15px 16px;font-size:14px;cursor:pointer;border:none;background:none;width:100%;color:var(--txt);font-family:inherit;text-align:left}
.mitem+.mitem{border-top:1px solid var(--line)}
.mitem .ic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--panel2)}
.mitem .arr{margin-left:auto;color:var(--dim2)}
.mitem:active{background:var(--panel2)}
/* 底部 Tab */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(20,19,26,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 12px;font-size:11px;color:var(--dim2);cursor:pointer;border:none;background:none;font-family:inherit}
.tab .ic{font-size:22px}
.tab.on{color:#fff;font-weight:700}
.tab.on .ic{filter:drop-shadow(0 0 8px rgba(255,45,120,.9))}
/* toast */
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:#26242e;border:1px solid var(--line);color:var(--txt);font-size:13px;padding:11px 20px;border-radius:999px;opacity:0;transition:.25s;z-index:99;pointer-events:none;max-width:86%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="phone">
  <div class="topbar">
    <div class="brand">
      <div class="logo">🎨</div>
      <div><h1>灵感<span>工坊</span></h1><p>POSTER LAB</p></div>
    </div>
  </div>

  <!-- 模板 -->
  <div class="page on" id="p0">
    <section class="pad">
      <h2 class="big">今天，<span class="hl">造一张</span><br>刷爆朋友圈的海报</h2>
      <p class="sub">600+ 精选模板 · 一键换字换图 · 导出高清无水印</p>
      <div class="search">🔍 <input id="kw" placeholder="搜模板：双十一 / 奶茶 / 招聘…"></div>
      <div class="cats" id="cats"></div>
      <div class="tgrid" id="tgrid"></div>
    </section>
  </div>

  <!-- 编辑 -->
  <div class="page" id="p1">
    <section class="pad" style="padding-bottom:0">
      <h2 class="big">画布<span class="hl">编辑</span></h2>
      <p class="sub" id="curTpl">当前模板：双十一狂欢购</p>
    </section>
    <div class="canvas-wrap">
      <div class="canvas" id="canvas"></div>
      <p class="canvas-hint">点选图层可拖拽式移动？暂点选定位 · 用工具条增删图层</p>
    </div>
    <div class="tools">
      <div class="toolrow" id="toolrow">
        <button class="tool on" data-t="text"><span class="ic">🔤</span>文字</button>
        <button class="tool" data-t="sticker"><span class="ic">✨</span>贴纸</button>
        <button class="tool" data-t="bg"><span class="ic">🖌️</span>背景</button>
        <button class="tool" data-t="filter"><span class="ic">🎞️</span>滤镜</button>
        <button class="tool" data-t="layer"><span class="ic">📚</span>图层</button>
      </div>
      <div class="panelbox on" id="pp-text">
        <div class="optrow">
          <button class="opt" data-add="主标题：双十一 狂欢购">＋主标题</button>
          <button class="opt" data-add="副标题：全场 5 折起">＋副标题</button>
          <button class="opt" data-add="满 299 减 100">＋促销语</button>
          <button class="opt" data-add="11.1 – 11.11">＋日期</button>
        </div>
      </div>
      <div class="panelbox" id="pp-sticker">
        <div class="optrow">
          <span class="stk" data-stk="🎉">🎉</span><span class="stk" data-stk="🔥">🔥</span>
          <span class="stk" data-stk="⭐">⭐</span><span class="stk" data-stk="💥">💥</span>
          <span class="stk" data-stk="🎁">🎁</span><span class="stk" data-stk="💯">💯</span>
          <span class="stk" data-stk="🍰">🍰</span><span class="stk" data-stk="☕">☕</span>
        </div>
      </div>
      <div class="panelbox" id="pp-bg">
        <div class="optrow" id="bgrow"></div>
      </div>
      <div class="panelbox" id="pp-filter">
        <div class="optrow" id="filterrow"></div>
      </div>
      <div class="panelbox" id="pp-layer">
        <div class="layers" id="layerlist" style="margin:0"></div>
      </div>
      <button class="savebtn" id="saveBtn">保存到作品</button>
      <div style="height:16px"></div>
    </div>
  </div>

  <!-- 作品 -->
  <div class="page" id="p2">
    <section class="pad">
      <h2 class="big">我的<span class="hl">作品</span></h2>
      <p class="sub">灵感落地的地方</p>
      <div class="secttl" style="margin-top:16px"><h3>已完成</h3><span id="cntDone"></span></div>
      <div class="wgrid" id="doneGrid"></div>
      <div class="secttl" style="margin-top:18px"><h3>草稿箱</h3><span id="cntDraft"></span></div>
      <div id="draftWrap"></div>
    </section>
  </div>

  <!-- 我的 -->
  <div class="page" id="p3">
    <section class="pad">
      <div class="me-head">
        <div class="avatar">🧑‍🎨</div>
        <div><h3>追光的设计师</h3><p>ID 880213 · 已创作 128 张海报</p></div>
      </div>
      <div class="vip">
        <h4>✦ 创意会员 · PRO</h4>
        <p>解锁全部模板 · 高清导出 · 专属字体 48 款</p>
        <span class="btn" id="vipBtn">续费会员</span>
      </div>
      <div class="mlist">
        <button class="mitem" data-m="收藏"><span class="ic">❤️</span>我的收藏<span class="arr">›</span></button>
        <button class="mitem" data-m="下载记录"><span class="ic">⬇️</span>下载记录<span class="arr">›</span></button>
        <button class="mitem" data-m="设置"><span class="ic">⚙️</span>设置<span class="arr">›</span></button>
        <button class="mitem" data-m="帮助"><span class="ic">💬</span>帮助与反馈<span class="arr">›</span></button>
      </div>
      <p style="text-align:center;color:var(--dim2);font-size:11px;margin-top:22px">灵感工坊 v3.2.1 · 让每个人都能做设计</p>
    </section>
  </div>

  <nav class="tabbar">
    <button class="tab on" data-i="0"><span class="ic">🖼️</span>模板</button>
    <button class="tab" data-i="1"><span class="ic">✏️</span>编辑</button>
    <button class="tab" data-i="2"><span class="ic">📁</span>作品</button>
    <button class="tab" data-i="3"><span class="ic">👤</span>我的</button>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('show')},1800);}
/* ---------- 数据 ---------- */
var GRADS=[
 "linear-gradient(135deg,#ff2d78,#ff5a2b)","linear-gradient(135deg,#7b2ff7,#ff2d78)",
 "linear-gradient(135deg,#ff8a00,#ff2d78)","linear-gradient(135deg,#11998e,#38ef7d)",
 "linear-gradient(135deg,#1e3c72,#2a5298)","linear-gradient(135deg,#42275b,#734b6d)",
 "linear-gradient(135deg,#f857a6,#ff5858)","linear-gradient(135deg,#0ba360,#3cba92)"
];
var CATS=["全部","节日","促销","招聘","美食","教育"];
var TPLS=[
 {t:"双十一狂欢购",c:"促销",g:0,n:"12.6万人用过",s:"全场 5 折起"},
 {t:"中秋团圆礼",c:"节日",g:1,n:"8.3万人用过",s:"花好月圆人团圆"},
 {t:"奶茶店开业",c:"美食",g:2,n:"5.1万人用过",s:"第二杯半价"},
 {t:"春季招聘会",c:"招聘",g:4,n:"3.9万人用过",s:"五险一金 · 双休"},
 {t:"暑期招生季",c:"教育",g:3,n:"6.7万人用过",s:"名师 1 对 1"},
 {t:"圣诞狂欢夜",c:"节日",g:5,n:"4.2万人用过",s:"平安夜大促"},
 {t:"新品发布会",c:"促销",g:6,n:"2.8万人用过",s:"敬请期待"},
 {t:"火锅节",c:"美食",g:7,n:"3.3万人用过",s:"全场 8 折"}
];
var FILTERS=[
 {n:"原图",f:"none"},{n:"复古",f:"sepia(.5) contrast(1.1)"},
 {n:"冷调",f:"hue-rotate(15deg) saturate(1.2)"},{n:"暖阳",f:"saturate(1.4) brightness(1.08)"},
 {n:"黑白",f:"grayscale(1)"},{n:"霓虹",f:"saturate(1.8) contrast(1.15)"}
];
var state={cat:"全部",tpl:TPLS[0],layers:[],sel:-1,bg:0,filter:0,
 done:[{t:"双十一狂欢购",g:0,s:"全场 5 折起"},{t:"奶茶店开业",g:2,s:"第二杯半价"}],
 drafts:[{t:"春季招聘会",g:4,s:"五险一金 · 双休"}]};

/* ---------- Tab 切换 ---------- */
var tabs=document.querySelectorAll('.tab'),pages=document.querySelectorAll('.page');
function go(i){i=Math.max(0,Math.min(3,i|0));
 tabs.forEach(function(e,k){e.classList.toggle('on',k===i)});
 pages.forEach(function(e,k){e.classList.toggle('on',k===i)});
 window.scrollTo(0,0);}
tabs.forEach(function(e){e.addEventListener('click',function(){go(+e.dataset.i);});});
(function(){var m=/[?&]tab=(\d)/.exec(location.search);if(m)go(+m[1]);})();

/* ---------- 模板页 ---------- */
var catsEl=document.getElementById('cats'),grid=document.getElementById('tgrid');
function renderCats(){catsEl.innerHTML="";CATS.forEach(function(c){
 var b=document.createElement('button');b.className='cat'+(c===state.cat?' on':'');b.textContent=c;
 b.onclick=function(){state.cat=c;renderCats();renderTpls();};catsEl.appendChild(b);});}
function kwMatch(t){var k=document.getElementById('kw').value.trim();return !k||t.t.indexOf(k)>-1||t.c.indexOf(k)>-1||t.s.indexOf(k)>-1;}
function renderTpls(){grid.innerHTML="";
 TPLS.filter(function(t){return (state.cat==="全部"||t.c===state.cat)&&kwMatch(t);}).forEach(function(t){
  var d=document.createElement('div');d.className='tcard';
  d.innerHTML='<div class="cover" style="background:'+GRADS[t.g]+'"><span class="tag">'+t.c+'</span><div class="ct">'+t.t+'</div></div>'+
   '<div class="tinfo"><h4>'+t.t+'</h4><p>'+t.s+'</p><span class="use">🔥 '+t.n+'</span></div>';
  d.onclick=function(){loadTpl(t);go(1);};
  grid.appendChild(d);});
 if(!grid.children.length)grid.innerHTML='<div class="empty" style="grid-column:1/-1">没找到相关模板，换个关键词试试</div>';}
document.getElementById('kw').addEventListener('input',renderTpls);
renderCats();renderTpls();

/* ---------- 编辑页 ---------- */
var canvas=document.getElementById('canvas');
function renderCanvas(){
 canvas.style.background=GRADS[state.bg];
 canvas.style.filter=FILTERS[state.filter].f;
 canvas.innerHTML="";
 state.layers.forEach(function(l,i){
  var d=document.createElement('div');d.className='layer'+(i===state.sel?' sel':'');
  d.style.left=l.x+'%';d.style.top=l.y+'%';
  d.style.transform='translate(-50%,-50%) rotate('+(l.r||0)+'deg)';
  if(l.type==='text'){d.style.fontSize=(l.big?30:16)+'px';d.style.fontWeight=l.big?'900':'600';
   d.style.color='#fff';d.style.textShadow='0 2px 8px rgba(0,0,0,.5)';d.style.whiteSpace='nowrap';d.textContent=l.txt;}
  else{d.style.fontSize='38px';d.textContent=l.txt;}
  d.onclick=function(ev){ev.stopPropagation();state.sel=i;renderCanvas();renderLayers();};
  canvas.appendChild(d);});
 var tag=document.createElement('div');
 tag.style.cssText='position:absolute;left:10px;bottom:10px;font-size:10px;color:rgba(255,255,255,.75);background:rgba(0,0,0,.35);padding:3px 9px;border-radius:999px';
 tag.textContent=state.tpl.t;canvas.appendChild(tag);}
function addLayer(type,txt,big){
 state.layers.push({type:type,txt:txt,big:!!big,x:20+Math.random()*60,y:25+Math.random()*45,r:0});
 state.sel=state.layers.length-1;renderCanvas();renderLayers();toast('已添加图层');}
document.querySelectorAll('#pp-text .opt').forEach(function(b){
 b.onclick=function(){addLayer('text',b.dataset.add,b.dataset.add.indexOf('主标题')===0);};});
document.querySelectorAll('#pp-sticker .stk').forEach(function(s){
 s.onclick=function(){addLayer('sticker',s.dataset.stk);};});
var bgrow=document.getElementById('bgrow');
GRADS.forEach(function(g,i){var s=document.createElement('div');s.className='swatch'+(i===0?' on':'');
 s.style.background=g;s.title='背景'+(i+1);
 s.onclick=function(){state.bg=i;bgrow.querySelectorAll('.swatch').forEach(function(x){x.classList.remove('on')});s.classList.add('on');renderCanvas();};
 bgrow.appendChild(s);});
var frow=document.getElementById('filterrow');
FILTERS.forEach(function(f,i){var b=document.createElement('button');b.className='opt'+(i===0?' on':'');b.textContent=f.n;
 b.onclick=function(){state.filter=i;frow.querySelectorAll('.opt').forEach(function(x){x.classList.remove('on')});b.classList.add('on');renderCanvas();};
 frow.appendChild(b);});
function renderLayers(){var w=document.getElementById('layerlist');w.innerHTML='';
 if(!state.layers.length){w.innerHTML='<div class="empty">还没有图层，去加文字或贴纸吧</div>';return;}
 state.layers.forEach(function(l,i){
  var d=document.createElement('div');d.className='litem'+(i===state.sel?' sel':'');
  d.innerHTML='<span style="font-size:18px">'+(l.type==='text'?'🔤':'✨')+'</span><span class="nm">'+l.txt+'</span>';
  var up=document.createElement('button');up.textContent='上移';
  up.onclick=function(){if(i>0){var t=state.layers[i-1];state.layers[i-1]=state.layers[i];state.layers[i]=t;state.sel=i-1;renderCanvas();renderLayers();}};
  var dn=document.createElement('button');dn.textContent='下移';
  dn.onclick=function(){if(i<state.layers.length-1){var t=state.layers[i+1];state.layers[i+1]=state.layers[i];state.layers[i]=t;state.sel=i+1;renderCanvas();renderLayers();}};
  var del=document.createElement('button');del.textContent='删除';del.style.color='#ff6b6b';
  del.onclick=function(){state.layers.splice(i,1);state.sel=-1;renderCanvas();renderLayers();toast('图层已删除');};
  d.appendChild(up);d.appendChild(dn);d.appendChild(del);w.appendChild(d);});}
function loadTpl(t){state.tpl=t;state.bg=t.g;state.filter=0;state.layers=[];state.sel=-1;
 document.getElementById('curTpl').textContent='当前模板：'+t.t;
 bgrow.querySelectorAll('.swatch').forEach(function(x,x2){x.classList.toggle('on',x2===t.g)});
 frow.querySelectorAll('.opt').forEach(function(x,x2){x.classList.toggle('on',x2===0)});
 addSilent('text',t.t,true);addSilent('text',t.s,false);renderCanvas();renderLayers();}
function addSilent(type,txt,big){state.layers.push({type:type,txt:txt,big:!!big,x:50,y:big?32:52,r:0});}
document.querySelectorAll('#toolrow .tool').forEach(function(b){
 b.onclick=function(){document.querySelectorAll('#toolrow .tool').forEach(function(x){x.classList.remove('on')});
  b.classList.add('on');
  document.querySelectorAll('.panelbox').forEach(function(p){p.classList.remove('on')});
  document.getElementById('pp-'+b.dataset.t).classList.add('on');};});
document.getElementById('saveBtn').onclick=function(){
 if(!state.layers.length){toast('先添加点内容再保存吧');return;}
 state.drafts.push({t:state.tpl.t+' · 我的创作',g:state.bg,s:state.layers.length+' 个图层'});
 renderWorks();toast('已保存到草稿箱');go(2);};

/* ---------- 作品页 ---------- */
function cardHTML(w,isDraft,idx){
 var d=document.createElement('div');d.className='wcard';
 d.innerHTML='<div class="wcover" style="background:'+GRADS[w.g]+'">'+(isDraft?'<span class="draft">草稿</span>':'')+'<div class="ct">'+w.t+'</div></div>'+
  '<div class="wact"><button data-a="edit">继续编辑</button><button data-a="dl">导出</button><button class="del" data-a="del">删除</button></div>';
 d.querySelectorAll('button').forEach(function(b){
  b.onclick=function(){var a=b.dataset.a;
   if(a==='del'){if(isDraft)state.drafts.splice(idx,1);else state.done.splice(idx,1);renderWorks();toast('已删除');}
   else if(a==='dl'){toast('高清 PNG 已开始导出…');}
   else{toast('已载入画布');go(1);}};});
 return d;}
function renderWorks(){
 var dg=document.getElementById('doneGrid'),dw=document.getElementById('draftWrap');
 dg.innerHTML='';dw.innerHTML='';
 document.getElementById('cntDone').textContent=state.done.length+' 张';
 document.getElementById('cntDraft').textContent=state.drafts.length+' 个';
 if(!state.done.length)dg.innerHTML='<div class="empty" style="grid-column:1/-1">还没有完成作品</div>';
 state.done.forEach(function(w,i){dg.appendChild(cardHTML(w,false,i));});
 if(!state.drafts.length)dw.innerHTML='<div class="empty">草稿箱是空的</div>';
 state.drafts.forEach(function(w,i){var c=cardHTML(w,true,i);c.style.marginBottom='12px';dw.appendChild(c);});}
renderWorks();

/* ---------- 我的页 ---------- */
document.querySelectorAll('.mitem').forEach(function(b){
 b.onclick=function(){toast(b.dataset.m+'：演示原型，功能开发中');};});
document.getElementById('vipBtn').onclick=function(){toast('会员续费：演示原型');};

/* 初始化画布 */
loadTplSilently();
function loadTplSilently(){state.bg=state.tpl.g;addSilent('text',state.tpl.t,true);addSilent('text',state.tpl.s,false);renderCanvas();renderLayers();}
})();
</script>
</body>
</html>
