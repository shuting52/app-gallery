<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>柚邻 · 兴趣社区</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --coral:#FF6B4A; --coral-deep:#E8552F; --coral-soft:#FFE9E1;
  --cream:#FFF8F3; --ink:#3A2E28; --ink-soft:#8A7A70; --ink-faint:#C9BCB2;
  --card:#FFFFFF; --line:#F3E9E1; --green:#3FB97F; --blue:#4AA8FF;
}
html{background:#EFE7E0}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--cream);color:var(--ink);font-size:14px;line-height:1.5}
.phone{max-width:430px;margin:0 auto;background:var(--cream);min-height:100vh;position:relative;box-shadow:0 0 24px rgba(120,70,50,.12)}
/* 顶部栏 */
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#FFF6F0,var(--cream));padding:14px 16px 10px}
.topbar .appname{font-size:20px;font-weight:800;letter-spacing:.5px}
.topbar .appname em{font-style:normal;color:var(--coral)}
/* 页面 */
.page{display:none;padding-bottom:86px}
.page.active{display:block}
/* 搜索 */
.searchrow{padding:4px 16px 10px}
.searchbox{display:flex;align-items:center;background:#fff;border-radius:999px;padding:10px 16px;box-shadow:0 2px 10px rgba(255,107,74,.08)}
.searchbox .ico{font-size:16px;margin-right:8px}
.searchbox input{border:none;outline:none;flex:1;font-size:14px;background:transparent;color:var(--ink)}
/* 横滑 chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--ink-soft)}
.chip.hot{border-color:var(--coral);color:var(--coral);font-weight:700;background:var(--coral-soft)}
/* 动态卡片 */
.feed{padding:0 16px;display:flex;flex-direction:column;gap:14px}
.post{background:var(--card);border-radius:18px;padding:14px 14px 6px;box-shadow:0 4px 14px rgba(140,80,50,.07)}
.post-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.avatar{width:44px;height:44px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff}
.post-meta{flex:1}
.post-meta .name{font-weight:700;font-size:14px}
.post-meta .time{font-size:12px;color:var(--ink-faint)}
.followbtn{background:var(--coral-soft);color:var(--coral);border:none;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700}
.followbtn.on{background:#eee;color:var(--ink-faint)}
.post-text{font-size:14px;margin-bottom:10px}
.post-imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.post-imgs .ph{aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px}
.post-actions{display:flex;border-top:1px solid var(--line);margin-top:4px}
.act{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:10px 0;font-size:13px;color:var(--ink-soft);cursor:pointer;user-select:none;border:none;background:none}
.act .n{font-variant-numeric:tabular-nums}
.act.liked{color:var(--coral);font-weight:700}
/* 圈子页 */
.sec-title{padding:16px 16px 10px;font-size:16px;font-weight:800}
.mycircles{display:flex;gap:12px;overflow-x:auto;padding:0 16px 6px;scrollbar-width:none}
.mycircles::-webkit-scrollbar{display:none}
.mcard{flex:0 0 150px;background:var(--card);border-radius:18px;padding:14px;box-shadow:0 4px 14px rgba(140,80,50,.07);text-align:center}
.mcard .cico{width:52px;height:52px;border-radius:18px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff}
.mcard .cname{font-weight:700;font-size:14px;margin-bottom:2px}
.mcard .cdesc{font-size:11px;color:var(--ink-faint)}
.reclist{padding:0 16px;display:flex;flex-direction:column;gap:12px}
.rcard{display:flex;gap:12px;background:var(--card);border-radius:18px;padding:14px;box-shadow:0 4px 14px rgba(140,80,50,.07);align-items:center}
.rcard .cico{width:54px;height:54px;border-radius:18px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff}
.rcard .rinfo{flex:1;min-width:0}
.rcard .rname{font-weight:700;font-size:15px}
.rcard .rstat{font-size:12px;color:var(--ink-faint);margin-top:3px}
.rcard .rstat b{color:var(--coral);font-weight:700}
.joinbtn{background:var(--coral);color:#fff;border:none;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;white-space:nowrap}
.joinbtn.joined{background:#F0EAE4;color:var(--ink-soft)}
/* 消息页 */
.msglist{padding:6px 16px;display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;gap:12px;background:var(--card);border-radius:18px;padding:13px 14px;box-shadow:0 4px 14px rgba(140,80,50,.07);align-items:center;cursor:pointer}
.mrow .avatar{width:48px;height:48px;font-size:20px;position:relative}
.badge{position:absolute;top:-4px;right:-6px;background:var(--coral);color:#fff;font-size:10px;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:700;border:2px solid #fff}
.mbody{flex:1;min-width:0}
.mtitle{font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.mtitle .t{font-size:11px;color:var(--ink-faint);font-weight:400}
.mpreview{font-size:13px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
/* 聊天内页 */
.chatbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#FFF6F0,var(--cream));padding:14px 16px;display:flex;align-items:center;gap:12px}
.backbtn{font-size:22px;color:var(--coral);cursor:pointer;font-weight:800}
.chatbar .cname{font-weight:800;font-size:16px}
.chatbar .cstat{font-size:11px;color:var(--green)}
.chatbody{padding:12px 16px 90px;display:flex;flex-direction:column;gap:12px;min-height:60vh}
.msg{display:flex;gap:8px;max-width:82%}
.msg .avatar{width:34px;height:34px;font-size:15px}
.bubble{background:#fff;border-radius:4px 16px 16px 16px;padding:10px 13px;font-size:14px;box-shadow:0 2px 8px rgba(140,80,50,.06)}
.msg.mine{align-self:flex-end;flex-direction:row-reverse}
.msg.mine .bubble{background:var(--coral);color:#fff;border-radius:16px 4px 16px 16px}
.msg .mtime{font-size:10px;color:var(--ink-faint);margin-top:4px}
.chatinput{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
.chatinput input{flex:1;border:1px solid var(--line);border-radius:999px;padding:10px 14px;font-size:14px;outline:none;background:var(--cream)}
.chatinput button{background:var(--coral);color:#fff;border:none;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:700}
/* 我的页 */
.profile{background:linear-gradient(160deg,#FF8A5C,#FF6B4A);border-radius:0 0 28px 28px;padding:26px 20px 24px;color:#fff}
.prow{display:flex;align-items:center;gap:14px}
.prow .avatar{width:66px;height:66px;font-size:30px;border:3px solid rgba(255,255,255,.6);background:rgba(255,255,255,.25)}
.pname{font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px}
.lvl{background:#FFD166;color:#8A5A00;font-size:11px;font-weight:800;border-radius:999px;padding:3px 10px}
.pid{font-size:12px;opacity:.85;margin-top:3px}
.statrow{display:flex;margin:16px;background:var(--card);border-radius:18px;box-shadow:0 4px 14px rgba(140,80,50,.07);overflow:hidden}
.stat{flex:1;text-align:center;padding:14px 0}
.stat b{font-size:18px;display:block}
.stat span{font-size:12px;color:var(--ink-soft)}
.stat+.stat{border-left:1px solid var(--line)}
.menulist{padding:0 16px;display:flex;flex-direction:column;gap:10px;margin-top:4px}
.menu{background:var(--card);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 14px rgba(140,80,50,.07);cursor:pointer}
.menu .mico{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff}
.menu .mlabel{flex:1;font-weight:600;font-size:14px}
.menu .marrow{color:var(--ink-faint);font-size:16px}
/* 底部 Tab */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:30}
.tab{flex:1;text-align:center;font-size:11px;color:var(--ink-faint);cursor:pointer;user-select:none}
.tab .tico{font-size:22px;display:block;margin-bottom:2px}
.tab.active{color:var(--coral);font-weight:700}
.reddot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--coral);vertical-align:top}
</style>
</head>

/* 渲染动态流 */
function renderFeed(){
  var box=document.getElementById("feed"); box.innerHTML="";
  POSTS.forEach(function(p,idx){
    var imgs=p.imgs.map(function(g){return '<div class="ph" style="background:linear-gradient(135deg,'+g[1]+','+g[2]+')">'+g[0]+'</div>'}).join("");
    var d=document.createElement("div"); d.className="post";
    d.innerHTML='<div class="post-head"><div class="avatar" style="background:'+p.avbg+'">'+p.av+'</div>'
      +'<div class="post-meta"><div class="name">'+p.name+'</div><div class="time">'+p.time+'</div></div>'
      +'<button class="followbtn'+(p.follow?" on":"")+'" data-i="'+idx+'">'+(p.follow?"已关注":"+ 关注")+'</button></div>'
      +'<div class="post-text">'+p.text+'</div>'
      +'<div class="post-imgs">'+imgs+'</div>'
      +'<div class="post-actions">'
      +'<button class="act like'+(p.liked?" liked":"")+'" data-i="'+idx+'">👍 <span class="n">'+p.like+'</span></button>'
      +'<button class="act cmt" data-i="'+idx+'">💬 <span class="n">'+p.cmt+'</span></button>'
      +'<button class="act share" data-i="'+idx+'">↗ <span class="n">'+p.share+'</span></button>'
      +'</div>';
    box.appendChild(d);
  });
  bindFeedEvents();
}
function bindFeedEvents(){
  document.querySelectorAll(".followbtn").forEach(function(b){
    b.onclick=function(){var p=POSTS[+b.dataset.i];p.follow=!p.follow;b.className="followbtn"+(p.follow?" on":"");b.textContent=p.follow?"已关注":"+ 关注"};
  });
  document.querySelectorAll(".act.like").forEach(function(b){
    b.onclick=function(){var p=POSTS[+b.dataset.i];p.liked=!p.liked;p.like+=p.liked?1:-1;
      b.className="act like"+(p.liked?" liked":"");b.querySelector(".n").textContent=p.like};
  });
  document.querySelectorAll(".act.cmt").forEach(function(b){
    b.onclick=function(){var p=POSTS[+b.dataset.i];p.cmt++;b.querySelector(".n").textContent=p.cmt};
  });
  document.querySelectorAll(".act.share").forEach(function(b){
    b.onclick=function(){var p=POSTS[+b.dataset.i];p.share++;b.querySelector(".n").textContent=p.share};
  });
}

/* 渲染推荐圈子 */
function renderCircles(){
  var box=document.getElementById("reclist"); box.innerHTML="";
  CIRCLES.forEach(function(c,idx){
    var d=document.createElement("div"); d.className="rcard";
    d.innerHTML='<div class="cico" style="background:'+c.bg+'">'+c.ico+'</div>'
      +'<div class="rinfo"><div class="rname">'+c.name+'</div>'
      +'<div class="rstat">成员 <b>'+c.members+'</b> · 今日 <b>'+c.today+'</b> 帖</div></div>'
      +'<button class="joinbtn'+(c.joined?" joined":"")+'" data-i="'+idx+'">'+(c.joined?"已加入":"+ 加入")+'</button>';
    box.appendChild(d);
  });
  document.querySelectorAll(".joinbtn").forEach(function(b){
    b.onclick=function(){var c=CIRCLES[+b.dataset.i];c.joined=!c.joined;
      b.className="joinbtn"+(c.joined?" joined":"");b.textContent=c.joined?"已加入":"+ 加入"};
  });
}

/* 渲染消息列表 */
function renderMsgs(){
  var box=document.getElementById("msglist"); box.innerHTML="";
  MSGS.forEach(function(m){
    var d=document.createElement("div"); d.className="mrow";
    d.innerHTML='<div class="avatar" style="background:'+m.bg+'">'+m.av+(m.unread?'<span class="badge">'+m.unread+'</span>':"")+'</div>'
      +'<div class="mbody"><div class="mtitle">'+m.name+'<span class="t">'+m.time+'</span></div>'
      +'<div class="mpreview">'+m.prev+'</div></div>';
    d.onclick=function(){openChat(m)};
    box.appendChild(d);
  });
}

/* 聊天内页 */
function openChat(m){
  curChat=m.name;
  document.getElementById("chatName").textContent=m.name;
  document.getElementById("chatStat").textContent=m.stat||"在线";
  var body=document.getElementById("chatBody"); body.innerHTML="";
  var hist=CHATHISTORY[m.name]||[];
  hist.forEach(function(h){
    var d=document.createElement("div"); d.className="msg";
    d.innerHTML='<div class="avatar" style="background:'+m.bg+'">'+h[0]+'</div>'
      +'<div><div class="bubble">'+h[2]+'</div><div class="mtime">'+h[0]+" "+h[1]+" · "+(h[3]||"")+'</div></div>';
    body.appendChild(d);
  });
  // 清除未读红点
  m.unread=0; renderMsgs();
  showPage("page-chat");
  document.getElementById("tabbar").style.display="none";
  document.querySelector(".chatinput").style.display="flex";
}
function closeChat(){
  showPage("page-msg");
  document.getElementById("tabbar").style.display="flex";
  document.querySelector(".chatinput").style.display="none";
}
document.getElementById("chatBack").onclick=closeChat;
function sendMsg(){
  var inp=document.getElementById("chatInput"); var v=inp.value.trim(); if(!v)return;
  var body=document.getElementById("chatBody");
  var d=document.createElement("div"); d.className="msg mine";
  d.innerHTML='<div><div class="bubble">'+v.replace(/</g,"&lt;")+'</div><div class="mtime">我 · 刚刚</div></div>';
  body.appendChild(d); inp.value=""; body.scrollTop=body.scrollHeight;
}
document.getElementById("sendBtn").onclick=sendMsg;

/* Tab 切换 */
function showPage(id){
  document.querySelectorAll(".page").forEach(function(p){p.classList.toggle("active",p.id===id)});
  document.querySelectorAll(".tab").forEach(function(t){t.classList.toggle("active",t.dataset.page===id)});
  window.scrollTo(0,0);
}
document.querySelectorAll(".tab").forEach(function(t){
  t.onclick=function(){
    document.getElementById("tabbar").style.display="flex";
    document.querySelector(".chatinput").style.display="none";
    showPage(t.dataset.page);
  };
});

/* 话题 chip 点击高亮 */
document.getElementById("chips").addEventListener("click",function(e){
  var c=e.target.closest(".chip"); if(!c)return;
  this.querySelectorAll(".chip").forEach(function(x){x.classList.remove("hot")});
  c.classList.add("hot");
});
/* 搜索回车提示（无 alert） */
document.getElementById("searchInput").addEventListener("keydown",function(e){
  if(e.key==="Enter"){this.placeholder="已搜索「"+this.value+"」，共 24 条结果";this.value="";this.blur()}
});

/* ?demo=chat 参数：自验时直接打开聊天内页 */
if(location.search.indexOf("demo=chat")>-1){
  setTimeout(function(){openChat(MSGS[0])},300);
}

renderFeed(); renderCircles(); renderMsgs();
</script>
</body>
</html>
