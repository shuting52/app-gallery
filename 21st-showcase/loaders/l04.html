<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>04 · 骨架屏</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0b0e14;color:#e8ecf4;font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;min-height:100vh;overflow:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7d8699;letter-spacing:2px}
.stage{width:220px;height:180px;display:flex;align-items:center;justify-content:center}
.cap{font-size:13px;color:#98a1b3;letter-spacing:1px}
@keyframes spin{to{transform:rotate(360deg)}}.sk{width:180px}.skh{height:60px;border-radius:10px;background:#1b2230;margin-bottom:12px;position:relative;overflow:hidden}.skl{height:14px;border-radius:7px;background:#1b2230;margin-bottom:10px;position:relative;overflow:hidden}.skl.s{width:62%}.skh::after,.skl::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);animation:shm 1.4s linear infinite}@keyframes shm{from{transform:translateX(-100%)}to{transform:translateX(100%)}}</style></head>
<body>
<div class="tag">04 · 骨架屏</div>
<div class="stage"><div class="sk"><div class="skh"></div><div class="skl"></div><div class="skl s"></div></div></div>
<p class="cap">内容正在穿衣打扮…</p>

</body></html>
