<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>43 · 方块矩阵</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0b0e14;color:#e8ecf4;font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;min-height:100vh;overflow:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7d8699;letter-spacing:2px}
.stage{width:220px;height:180px;display:flex;align-items:center;justify-content:center}
.cap{font-size:13px;color:#98a1b3;letter-spacing:1px}
@keyframes spin{to{transform:rotate(360deg)}}.sq4{position:relative;width:92px;height:92px;animation:spin 3s linear infinite}.sq4 i{position:absolute;width:22px;height:22px;border-radius:6px}.sq4 i:nth-child(1){left:0;top:0;background:#f472b6}.sq4 i:nth-child(2){right:0;top:0;background:#38bdf8}.sq4 i:nth-child(3){left:0;bottom:0;background:#34d399}.sq4 i:nth-child(4){right:0;bottom:0;background:#fbbf24}</style></head>
<body>
<div class="tag">43 · 方块矩阵</div>
<div class="stage"><div class="sq4"><i></i><i></i><i></i><i></i></div></div>
<p class="cap">方块正在巡逻…</p>

</body></html>
