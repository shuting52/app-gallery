<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>46 · 涟漪扩散</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0b0e14;color:#e8ecf4;font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;min-height:100vh;overflow:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7d8699;letter-spacing:2px}
.stage{width:220px;height:180px;display:flex;align-items:center;justify-content:center}
.cap{font-size:13px;color:#98a1b3;letter-spacing:1px}
@keyframes spin{to{transform:rotate(360deg)}}.rp2{position:relative;width:110px;height:110px}.dot{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;border-radius:50%;background:#2dd4bf;box-shadow:0 0 14px #2dd4bf}.rp2 i{position:absolute;inset:22px;border-radius:50%;background:rgba(45,212,191,.4);animation:rpp 2s ease-out infinite}.rp2 i:last-child{animation-delay:1s}@keyframes rpp{0%{transform:scale(.3);opacity:.85}100%{transform:scale(2.3);opacity:0}}</style></head>
<body>
<div class="tag">46 · 涟漪扩散</div>
<div class="stage"><div class="rp2"><div class="dot"></div><i></i><i></i></div></div>
<p class="cap">涟漪正在荡开…</p>

</body></html>
