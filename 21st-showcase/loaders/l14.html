<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>14 · 齿轮转动</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0b0e14;color:#e8ecf4;font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;min-height:100vh;overflow:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7d8699;letter-spacing:2px}
.stage{width:220px;height:180px;display:flex;align-items:center;justify-content:center}
.cap{font-size:13px;color:#98a1b3;letter-spacing:1px}
@keyframes spin{to{transform:rotate(360deg)}}.gr{font-size:64px;color:#94a3b8;position:relative;width:130px;height:96px;line-height:1}.g1{position:absolute;left:6px;top:0;animation:spin 3s linear infinite}.g2{position:absolute;right:10px;bottom:0;font-size:44px;color:#64748b;animation:spin 3s linear infinite reverse}</style></head>
<body>
<div class="tag">14 · 齿轮转动</div>
<div class="stage"><div class="gr"><span class="g1">⚙</span><span class="g2">⚙</span></div></div>
<p class="cap">齿轮正在咬合运转…</p>

</body></html>
