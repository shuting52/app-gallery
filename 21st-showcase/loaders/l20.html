<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>20 · 风车旋转</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0b0e14;color:#e8ecf4;font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;min-height:100vh;overflow:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7d8699;letter-spacing:2px}
.stage{width:220px;height:180px;display:flex;align-items:center;justify-content:center}
.cap{font-size:13px;color:#98a1b3;letter-spacing:1px}
@keyframes spin{to{transform:rotate(360deg)}}.pw{position:relative;width:92px;height:92px;animation:spin 1.8s linear infinite}.pw i{position:absolute;inset:0;clip-path:polygon(50% 50%,50% 2%,98% 10%)}.pw i:nth-child(1){background:#f472b6}.pw i:nth-child(2){background:#38bdf8;transform:rotate(90deg)}.pw i:nth-child(3){background:#34d399;transform:rotate(180deg)}.pw i:nth-child(4){background:#fbbf24;transform:rotate(270deg)}.pw b{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:#e8ecf4}</style></head>
<body>
<div class="tag">20 · 风车旋转</div>
<div class="stage"><div class="pw"><i></i><i></i><i></i><i></i><b></b></div></div>
<p class="cap">风车正在借风…</p>

</body></html>
