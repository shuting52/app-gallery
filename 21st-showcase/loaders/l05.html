<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>05 · 进度弧</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0b0e14;color:#e8ecf4;font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;min-height:100vh;overflow:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7d8699;letter-spacing:2px}
.stage{width:220px;height:180px;display:flex;align-items:center;justify-content:center}
.cap{font-size:13px;color:#98a1b3;letter-spacing:1px}
@keyframes spin{to{transform:rotate(360deg)}}.pa svg{width:110px;height:110px;transform:rotate(-90deg)}.pa circle{fill:none;stroke-width:9}.pa .bg{stroke:#1b2230}.pa .fg{stroke:#fbbf24;stroke-linecap:round;stroke-dasharray:264;stroke-dashoffset:264}.pa text{fill:#fbbf24;font-size:20px;text-anchor:middle;transform:rotate(90deg);transform-origin:50px 50px}</style></head>
<body>
<div class="tag">05 · 进度弧</div>
<div class="stage"><div class="pa"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="42"/><circle class="fg" cx="50" cy="50" r="42"/><text x="50" y="57">0%</text></svg></div></div>
<p class="cap">正在加速冲刺…</p>
<script>var fg=document.querySelector('.fg'),tx=document.querySelector('.pa text'),p=0;setInterval(function(){p=(p+2)%102;var v=p>100?100:p;tx.textContent=v+'%';fg.style.strokeDashoffset=264-264*v/100},40);</script>
</body></html>
