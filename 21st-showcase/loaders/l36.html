<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>36 · 环形光点</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0b0e14;color:#e8ecf4;font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;min-height:100vh;overflow:hidden}

<body>
<div class="tag">36 · 环形光点</div>
<div class="stage"><div class="dr2"><i style="--a:0deg;--o:0.35"></i><i style="--a:45deg;--o:0.43"></i><i style="--a:90deg;--o:0.51"></i><i style="--a:135deg;--o:0.59"></i><i style="--a:180deg;--o:0.67"></i><i style="--a:225deg;--o:0.75"></i><i style="--a:270deg;--o:0.83"></i><i style="--a:315deg;--o:0.91"></i></div></div>
