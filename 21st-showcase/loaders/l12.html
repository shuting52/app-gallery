<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>12 · 液体波浪</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0b0e14;color:#e8ecf4;font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;min-height:100vh;overflow:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7d8699;letter-spacing:2px}
.stage{width:220px;height:180px;display:flex;align-items:center;justify-content:center}
.cap{font-size:13px;color:#98a1b3;letter-spacing:1px}
@keyframes spin{to{transform:rotate(360deg)}}.lq{width:90px;height:90px;border-radius:50%;border:3px solid #1e293b;position:relative;overflow:hidden;background:#0f1522}.wv1,.wv2{position:absolute;left:-50%;width:200%;height:200%;top:42%;border-radius:42%;background:rgba(56,189,248,.55);animation:wrot 4s linear infinite}.wv2{top:48%;border-radius:46%;background:rgba(56,189,248,.32);animation-duration:7s;animation-direction:reverse}@keyframes wrot{to{transform:rotate(360deg)}}</style></head>
<body>
<div class="tag">12 · 液体波浪</div>
<div class="stage"><div class="lq"><div class="wv1"></div><div class="wv2"></div></div></div>
<p class="cap">好运正在灌满…</p>

</body></html>
