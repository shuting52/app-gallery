<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>22 · 双环追逐</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0b0e14;color:#e8ecf4;font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;min-height:100vh;overflow:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7d8699;letter-spacing:2px}
.stage{width:220px;height:180px;display:flex;align-items:center;justify-content:center}
.cap{font-size:13px;color:#98a1b3;letter-spacing:1px}
@keyframes spin{to{transform:rotate(360deg)}}.dc{position:relative;width:84px;height:84px}.dc .r1{position:absolute;inset:0;border-radius:50%;border:4px solid transparent;border-top-color:#38bdf8;border-right-color:#38bdf8;animation:spin 1.1s linear infinite}.dc .r2{position:absolute;inset:14px;border-radius:50%;border:4px solid transparent;border-bottom-color:#f472b6;border-left-color:#f472b6;animation:spin 1.7s linear infinite reverse}</style></head>
<body>
<div class="tag">22 · 双环追逐</div>
<div class="stage"><div class="dc"><div class="r1"></div><div class="r2"></div></div></div>
<p class="cap">双环正在竞速…</p>

</body></html>
