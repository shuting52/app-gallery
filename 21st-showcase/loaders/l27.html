<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>27 · 滑块进度</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0b0e14;color:#e8ecf4;font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;min-height:100vh;overflow:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7d8699;letter-spacing:2px}
.stage{width:220px;height:180px;display:flex;align-items:center;justify-content:center}
.cap{font-size:13px;color:#98a1b3;letter-spacing:1px}
@keyframes spin{to{transform:rotate(360deg)}}.sbw{display:flex;flex-direction:column;align-items:center;gap:12px}.sb{width:180px;height:12px;background:#1b2230;border-radius:6px;overflow:hidden}.fl{height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#38bdf8,#a78bfa)}.pc{font-size:13px;color:#7d8699}</style></head>
<body>
<div class="tag">27 · 滑块进度</div>
<div class="stage"><div class="sbw"><div class="sb"><div class="fl"></div></div><div class="pc">已加载 0%</div></div></div>
<p class="cap">进度条正在爬坡…</p>
<script>var fl=document.querySelector('.fl'),pc=document.querySelector('.pc'),p=0;setInterval(function(){p=(p+1.5)%101;fl.style.width=p+'%';pc.textContent='已加载 '+Math.floor(p)+'%';},30);</script>
</body></html>
