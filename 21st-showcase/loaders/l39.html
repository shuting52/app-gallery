<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>39 · 卡片翻转</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0b0e14;color:#e8ecf4;font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;min-height:100vh;overflow:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7d8699;letter-spacing:2px}
.stage{width:220px;height:180px;display:flex;align-items:center;justify-content:center}
.cap{font-size:13px;color:#98a1b3;letter-spacing:1px}
@keyframes spin{to{transform:rotate(360deg)}}.cf{width:112px;height:72px;perspective:400px}.in{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:cfl 2.4s ease-in-out infinite}@keyframes cfl{0%,18%{transform:rotateY(0)}50%,68%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}.f1,.f2{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:26px;backface-visibility:hidden;-webkit-backface-visibility:hidden}.f1{background:#1e3a8a;color:#bfdbfe}.f2{background:#831843;color:#fbcfe8;transform:rotateY(180deg)}</style></head>
<body>
<div class="tag">39 · 卡片翻转</div>
<div class="stage"><div class="cf"><div class="in"><div class="f1">◍</div><div class="f2">●</div></div></div></div>
<p class="cap">卡片正在翻面…</p>

</body></html>
