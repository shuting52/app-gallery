<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>28 · 轨道圆点</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0b0e14;color:#e8ecf4;font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;min-height:100vh;overflow:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7d8699;letter-spacing:2px}
.stage{width:220px;height:180px;display:flex;align-items:center;justify-content:center}
.cap{font-size:13px;color:#98a1b3;letter-spacing:1px}
@keyframes spin{to{transform:rotate(360deg)}}.ob{position:relative;width:112px;height:112px}.pl{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px;border-radius:50%;background:#fbbf24;box-shadow:0 0 18px rgba(251,191,36,.7)}.or1{position:absolute;inset:0;animation:spin 3s linear infinite}.or1 i{position:absolute;left:50%;top:-6px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#38bdf8}.or2{position:absolute;inset:24px;animation:spin 2s linear infinite reverse}.or2 i{position:absolute;width:9px;height:9px;border-radius:50%;background:#f472b6}.or2 i:first-child{left:50%;top:-4px;margin-left:-4px}.or2 i:last-child{left:50%;bottom:-4px;margin-left:-4px}</style></head>
<body>
<div class="tag">28 · 轨道圆点</div>
<div class="stage"><div class="ob"><div class="pl"></div><div class="or1"><i></i></div><div class="or2"><i></i><i></i></div></div></div>
<p class="cap">卫星正在绕行…</p>

</body></html>
