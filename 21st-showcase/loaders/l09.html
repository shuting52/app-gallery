<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>09 · 扫描线</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0b0e14;color:#e8ecf4;font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;min-height:100vh;overflow:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7d8699;letter-spacing:2px}
.stage{width:220px;height:180px;display:flex;align-items:center;justify-content:center}
.cap{font-size:13px;color:#98a1b3;letter-spacing:1px}
@keyframes spin{to{transform:rotate(360deg)}}.sc{width:170px;height:90px;border:1px solid #1e293b;border-radius:8px;position:relative;overflow:hidden;background:#0f1522}.ln{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#22d3ee,transparent);box-shadow:0 0 12px #22d3ee;animation:scn 1.8s ease-in-out infinite}@keyframes scn{0%,100%{top:4px}50%{top:calc(100% - 7px)}}</style></head>
<body>
<div class="tag">09 · 扫描线</div>
<div class="stage"><div class="sc"><div class="ln"></div></div></div>
<p class="cap">正在逐行扫描…</p>

</body></html>
