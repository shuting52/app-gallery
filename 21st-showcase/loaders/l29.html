<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>29 · 翻页</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0b0e14;color:#e8ecf4;font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;min-height:100vh;overflow:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7d8699;letter-spacing:2px}
.stage{width:220px;height:180px;display:flex;align-items:center;justify-content:center}
.cap{font-size:13px;color:#98a1b3;letter-spacing:1px}
@keyframes spin{to{transform:rotate(360deg)}}.bk{width:72px;height:92px;background:#1b2230;border-radius:4px 10px 10px 4px;position:relative;perspective:300px}.pg{position:absolute;inset:5px;background:linear-gradient(105deg,#334155,#475569);border-radius:2px 8px 8px 2px;transform-origin:left center;animation:pg 1.8s ease-in-out infinite}@keyframes pg{0%{transform:rotateY(0)}100%{transform:rotateY(-180deg)}}</style></head>
<body>
<div class="tag">29 · 翻页</div>
<div class="stage"><div class="bk"><div class="pg"></div></div></div>
<p class="cap">书页正在翻动…</p>

</body></html>
