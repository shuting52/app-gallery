<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>11 · 菊花转</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0b0e14;color:#e8ecf4;font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;min-height:100vh;overflow:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7d8699;letter-spacing:2px}
.stage{width:220px;height:180px;display:flex;align-items:center;justify-content:center}
.cap{font-size:13px;color:#98a1b3;letter-spacing:1px}
@keyframes spin{to{transform:rotate(360deg)}}.sp{position:relative;width:70px;height:70px}.sp i{position:absolute;left:50%;top:50%;width:5px;height:16px;margin:-8px 0 0 -2.5px;border-radius:3px;background:#e8ecf4;transform:rotate(var(--a)) translateY(-25px);opacity:.12;animation:spk 1.2s linear infinite;animation-delay:calc(var(--d)*-.1s)}@keyframes spk{0%{opacity:1}100%{opacity:.12}}</style></head>
<body>
<div class="tag">11 · 菊花转</div>
<div class="stage"><div class="sp"><i style="--a:0deg;--d:0"></i><i style="--a:30deg;--d:1"></i><i style="--a:60deg;--d:2"></i><i style="--a:90deg;--d:3"></i><i style="--a:120deg;--d:4"></i><i style="--a:150deg;--d:5"></i><i style="--a:180deg;--d:6"></i><i style="--a:210deg;--d:7"></i><i style="--a:240deg;--d:8"></i><i style="--a:270deg;--d:9"></i><i style="--a:300deg;--d:10"></i><i style="--a:330deg;--d:11"></i></div></div>
<p class="cap">花瓣正在轮流绽放…</p>

</body></html>
