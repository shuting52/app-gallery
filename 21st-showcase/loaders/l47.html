<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>47 · 循环箭头</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0b0e14;color:#e8ecf4;font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;min-height:100vh;overflow:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7d8699;letter-spacing:2px}
.stage{width:220px;height:180px;display:flex;align-items:center;justify-content:center}
.cap{font-size:13px;color:#98a1b3;letter-spacing:1px}
@keyframes spin{to{transform:rotate(360deg)}}.ca{position:relative;width:92px;height:92px;animation:spin 2s linear infinite}.ca span{position:absolute;left:50%;top:50%;font-size:20px;color:#fbbf24;margin:-10px 0 0 -8px}.ca .a1{transform:rotate(0deg) translateY(-38px) rotate(90deg)}.ca .a2{transform:rotate(120deg) translateY(-38px) rotate(90deg)}.ca .a3{transform:rotate(240deg) translateY(-38px) rotate(90deg)}</style></head>
<body>
<div class="tag">47 · 循环箭头</div>
<div class="stage"><div class="ca"><span class="a1">➤</span><span class="a2">➤</span><span class="a3">➤</span></div></div>
<p class="cap">箭头正在兜圈…</p>

</body></html>
