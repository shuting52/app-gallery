<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>31 · 轮播圆点导航</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.dots{display:flex;width:100%;gap:8px}
.dots .ni{flex:1;position:relative;background:#161c31;border-radius:14px;padding:16px 0;font-size:26px}
.dots .ring{position:absolute;inset:4px;border-radius:10px;border:2px solid transparent}
.dots .ni.active .ring{border-top-color:#5bff9d;animation:ringSpin 1.4s linear infinite}
@keyframes ringSpin{to{transform:rotate(360deg)}}
.dotbar{display:flex;gap:10px;justify-content:center;margin-top:4px}
.dt{width:8px;height:8px;border-radius:50%;background:#2a3352;transition:all .3s}
.dt.active{width:26px;border-radius:5px;background:linear-gradient(90deg,#5bff9d,#5b8cff);animation:dotStretch .4s ease}
@keyframes dotStretch{from{width:8px}}</style></head><body>
<div class="tag">31 · 轮播圆点导航</div>
<div class="stage"><nav class="dots"><button class="ni active"><span class="ring"></span>🏠</button><button class="ni"><span class="ring"></span>🔍</button><button class="ni"><span class="ring"></span>💬</button><button class="ni"><span class="ring"></span>👤</button></nav><div class="dotbar"><span class="dt active"></span><span class="dt"></span><span class="dt"></span><span class="dt"></span></div><div class="hint">点击切换试试</div></div>
<script>var ds=document.querySelectorAll('.dots .ni');var dts=document.querySelectorAll('.dt');
ds.forEach(function(e,i){e.addEventListener('click',function(){ds.forEach(function(x){x.classList.remove('active')});dts.forEach(function(x){x.classList.remove('active')});e.classList.add('active');dts[i].classList.add('active')})});</script></body></html>
