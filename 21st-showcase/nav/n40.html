<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>40 · 侧边竖条导航</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.vwrap{display:flex;width:100%;gap:12px;min-height:280px}
.vnav{position:relative;display:flex;flex-direction:column;background:#141a2e;border-radius:16px;padding:10px 8px;gap:4px}
.vnav .ni{display:flex;flex-direction:column;align-items:center;gap:2px;color:#8b93a7;font-size:10px;padding:12px 10px;border-radius:12px;z-index:2}
.vnav .ic{font-size:20px}
.vnav .ni.active{color:#fff}
.vind{position:absolute;left:4px;top:10px;width:4px;height:52px;border-radius:4px;background:linear-gradient(180deg,#5b8cff,#9b5bff);transition:top .38s cubic-bezier(.5,1.4,.4,1);animation:vindGlow 2s ease-in-out infinite}
@keyframes vindGlow{0%,100%{box-shadow:0 0 4px #5b8cff}50%{box-shadow:0 0 12px #9b5bff}}
.vpanel{flex:1;background:#161c31;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#5a6480;font-size:15px;animation:panelIn .4s ease}
@keyframes panelIn{from{opacity:0;transform:translateX(10px)}}</style></head><body>
<div class="tag">40 · 侧边竖条导航</div>
<div class="stage"><div class="vwrap"><nav class="vnav"><button class="ni active"><span class="ic">🏠</span><span class="lb">首页</span></button><button class="ni"><span class="ic">🔍</span><span class="lb">发现</span></button><button class="ni"><span class="ic">💬</span><span class="lb">消息</span></button><button class="ni"><span class="ic">👤</span><span class="lb">我的</span></button><span class="vind"></span></nav><div class="vpanel">内容区</div></div><div class="hint">点击切换试试</div></div>
<script>var vs=document.querySelectorAll('.vnav .ni');var vind=document.querySelector('.vind');
var panels=['🏠 首页内容区','🔍 发现内容区','💬 消息内容区','👤 我的内容区'];
function vp(i){vs.forEach(function(x){x.classList.remove('active')});vs[i].classList.add('active');
vind.style.top=(10+i*vs[0].offsetHeight+ i*4)+'px';
var p=document.querySelector('.vpanel');p.style.animation='none';p.offsetHeight;p.style.animation='';p.textContent=panels[i]}
vs.forEach(function(e,i){e.addEventListener('click',function(){vp(i)})});vp(0);</script></body></html>
