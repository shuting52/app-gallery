<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>37 · 方向键操控导航</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.kbnav{display:flex;width:100%;background:#141a2e;border-radius:18px;padding:10px 6px}
.kbnav .ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:#8b93a7;font-size:11px;padding:10px 0;border-radius:12px;border:2px solid transparent}
.kbnav .ic{font-size:22px}
.kbnav .ni.focus{border-color:#3a4568}
.kbnav .ni.active{color:#fff;background:#202a48;border-color:#5b8cff;animation:focusGlow 1.8s ease-in-out infinite}
@keyframes focusGlow{0%,100%{box-shadow:0 0 4px rgba(91,140,255,.3)}50%{box-shadow:0 0 16px rgba(91,140,255,.7)}}</style></head><body>
<div class="tag">37 · 方向键操控导航</div>
<div class="stage"><nav class="kbnav"><button class="ni active"><span class="ic">🏠</span><span class="lb">首页</span></button><button class="ni"><span class="ic">🔍</span><span class="lb">发现</span></button><button class="ni"><span class="ic">💬</span><span class="lb">消息</span></button><button class="ni"><span class="ic">👤</span><span class="lb">我的</span></button></nav><div class="hint">按 ← → 方向键切换</div></div>
<script>var ks=document.querySelectorAll('.kbnav .ni');var ki=0;
function kpaint(){ks.forEach(function(x,i){x.classList.toggle('focus',i===ki);x.classList.toggle('active',i===ki)})}
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'){ki=(ki+1)%4;kpaint()}if(e.key==='ArrowLeft'){ki=(ki+3)%4;kpaint()}});
ks.forEach(function(e,i){e.addEventListener('click',function(){ki=i;kpaint()})});kpaint();</script></body></html>
