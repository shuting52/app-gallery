<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>25 · 滑动面板标签页</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.swtabs{display:flex;width:100%;background:#141a2e;border-radius:14px;padding:5px}
.swtabs .ni{flex:1;padding:11px 0;color:#8b93a7;font-size:14px;border-radius:10px}
.swtabs .ni.active{color:#fff;background:#2b3760;font-weight:700;animation:tabIn .35s ease}
@keyframes tabIn{from{transform:scale(.92);opacity:.6}}
.swview{width:100%;overflow:hidden;border-radius:16px}
.swtrack{display:flex;transition:transform .4s cubic-bezier(.5,0,.3,1)}
.swp{flex:0 0 100%;height:150px;display:flex;align-items:center;justify-content:center;font-size:17px;background:linear-gradient(135deg,#1a2140,#232c52);border:1px solid #2a3352}</style></head><body>
<div class="tag">25 · 滑动面板标签页</div>
<div class="stage"><nav class="swtabs"><button class="ni active">推荐</button><button class="ni">视频</button><button class="ni">直播</button></nav><div class="swview"><div class="swtrack"><div class="swp">🌟 推荐内容面板</div><div class="swp">🎬 视频内容面板</div><div class="swp">📡 直播内容面板</div></div></div><div class="hint">可左右滑动切换面板</div></div>
<script>var tis=document.querySelectorAll('.swtabs .ni');var track=document.querySelector('.swtrack');
function go(i){tis.forEach(function(x){x.classList.remove('active')});tis[i].classList.add('active');track.style.transform='translateX(-'+(i*100)+'%)'}
tis.forEach(function(e,i){e.addEventListener('click',function(){go(i)})});
var sx=0;document.querySelector('.swview').addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
document.querySelector('.swview').addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-sx;var cur=0;tis.forEach(function(x,i){if(x.classList.contains('active'))cur=i});
if(dx<-40&&cur<2)go(cur+1);if(dx>40&&cur>0)go(cur-1)},{passive:true});</script></body></html>
