<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>29 · 描边流动导航</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.strnav{display:flex;width:100%;gap:8px}
.strnav .ni{flex:1;position:relative;padding:12px 0;color:#8b93a7;font-size:12px;background:#141a2e;border-radius:14px}
.strnav .ni svg{position:absolute;inset:0;width:100%;height:100%}
.strnav .ni rect{fill:none;stroke:#2a3352;stroke-width:2.5}
.strnav .ni span{position:relative;z-index:2}
.strnav .ni.active{color:#fff}
.strnav .ni.active rect{stroke:#7df9ff;stroke-dasharray:30 14;animation:dashFlow 1.2s linear infinite}
@keyframes dashFlow{to{stroke-dashoffset:-44}}</style></head><body>
<div class="tag">29 · 描边流动导航</div>
<div class="stage"><nav class="strnav"><button class="ni active"><svg viewBox="0 0 80 44"><rect x="2" y="2" width="76" height="40" rx="12"/></svg><span>🏠首页</span></button><button class="ni"><svg viewBox="0 0 80 44"><rect x="2" y="2" width="76" height="40" rx="12"/></svg><span>🔍发现</span></button><button class="ni"><svg viewBox="0 0 80 44"><rect x="2" y="2" width="76" height="40" rx="12"/></svg><span>💬消息</span></button><button class="ni"><svg viewBox="0 0 80 44"><rect x="2" y="2" width="76" height="40" rx="12"/></svg><span>👤我的</span></button></nav><div class="hint">点击切换试试</div></div>
<script>document.querySelectorAll('.ni').forEach(function(e){e.addEventListener('click',function(){document.querySelectorAll('.ni').forEach(function(x){x.classList.remove('active')});e.classList.add('active')})});</script></body></html>
