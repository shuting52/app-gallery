<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>46 · 环形进度导航</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.cnav{display:flex;width:100%;gap:10px}
.cnav .ni{flex:1;position:relative;background:#141a2e;border-radius:16px;padding:12px 0;font-size:24px}
.cnav .ni svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.cnav .ni circle{fill:none;stroke-width:3}
.cnav .ni .bg{stroke:#232c4a}
.cnav .ni .fg{stroke:#5bff9d;stroke-dasharray:119.4;stroke-dashoffset:119.4;stroke-linecap:round}
.cnav .ni span{position:relative;z-index:2}
.cnav .ni.active .fg{animation:ringFill 1s ease forwards}
@keyframes ringFill{from{stroke-dashoffset:119.4}to{stroke-dashoffset:0}}</style></head><body>
<div class="tag">46 · 环形进度导航</div>
<div class="stage"><nav class="cnav"><button class="ni active"><svg viewBox="0 0 44 44"><circle class="bg" cx="22" cy="22" r="19"/><circle class="fg" cx="22" cy="22" r="19"/></svg><span>🏠</span></button><button class="ni"><svg viewBox="0 0 44 44"><circle class="bg" cx="22" cy="22" r="19"/><circle class="fg" cx="22" cy="22" r="19"/></svg><span>🔍</span></button><button class="ni"><svg viewBox="0 0 44 44"><circle class="bg" cx="22" cy="22" r="19"/><circle class="fg" cx="22" cy="22" r="19"/></svg><span>💬</span></button><button class="ni"><svg viewBox="0 0 44 44"><circle class="bg" cx="22" cy="22" r="19"/><circle class="fg" cx="22" cy="22" r="19"/></svg><span>👤</span></button></nav><div class="hint">点击切换试试</div></div>
<script>document.querySelectorAll('.ni').forEach(function(e){e.addEventListener('click',function(){document.querySelectorAll('.ni').forEach(function(x){x.classList.remove('active')});e.classList.add('active')})});</script></body></html>
