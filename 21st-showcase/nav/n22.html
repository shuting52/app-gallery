<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>22 · 故障抖动导航</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.glitch{display:flex;width:100%;background:#0a0c16;border:1px solid #2a3352;border-radius:16px;padding:10px 6px}
.glitch .ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:#5a6480;font-size:11px;padding:8px 0;position:relative}
.glitch .ic{font-size:22px}
.glitch .ni.active{color:#7df9ff}
.glitch .ni.active .lb{animation:glitchTxt .5s steps(2) 2}
.glitch .ni.active .ic{animation:glitchTxt .5s steps(2) 2}
@keyframes glitchTxt{0%{transform:translate(0)}20%{transform:translate(-3px,2px);text-shadow:2px 0 #ff5b8c,-2px 0 #7df9ff}40%{transform:translate(3px,-2px)}60%{transform:translate(-2px,-1px);text-shadow:-2px 0 #ff5b8c,2px 0 #7df9ff}80%{transform:translate(2px,1px)}100%{transform:translate(0)}}</style></head><body>
<div class="tag">22 · 故障抖动导航</div>
<div class="stage"><nav class="glitch"><button class="ni active"><span class="ic">🏠</span><span class="lb">首页</span></button><button class="ni"><span class="ic">🔍</span><span class="lb">发现</span></button><button class="ni"><span class="ic">💬</span><span class="lb">消息</span></button><button class="ni"><span class="ic">👤</span><span class="lb">我的</span></button></nav><div class="hint">点击切换试试</div></div>
<script>document.querySelectorAll('.ni').forEach(function(e){e.addEventListener('click',function(){document.querySelectorAll('.ni').forEach(function(x){x.classList.remove('active')});e.classList.add('active')})});</script></body></html>
