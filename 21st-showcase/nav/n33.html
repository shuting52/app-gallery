<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>33 · 波浪下划线导航</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.wunav{display:flex;width:100%;background:#141a2e;border-radius:16px;padding:10px 6px}
.wunav .ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;color:#8b93a7;font-size:11px;padding:8px 0;position:relative}
.wunav .ic{font-size:20px}
.wunav .ni.active{color:#fff}
.wunav .ni svg{position:absolute;bottom:0;left:15%;width:70%;height:8px;opacity:0}
.wunav .ni.active svg{opacity:1}
.wunav .ni.active path{stroke:#ffb35b;stroke-width:3;fill:none;stroke-dasharray:60;stroke-dashoffset:60;animation:waveDraw .6s ease forwards, waveSlide 2s linear .6s infinite}
@keyframes waveDraw{to{stroke-dashoffset:0}}
@keyframes waveSlide{to{stroke-dashoffset:-120}}</style></head><body>
<div class="tag">33 · 波浪下划线导航</div>
<div class="stage"><nav class="wunav"><button class="ni active"><span class="ic">🏠</span><span class="lb">首页</span><svg viewBox="0 0 60 8"><path d="M0,4 Q7.5,0 15,4 T30,4 T45,4 T60,4"/></svg></button><button class="ni"><span class="ic">🔍</span><span class="lb">发现</span><svg viewBox="0 0 60 8"><path d="M0,4 Q7.5,0 15,4 T30,4 T45,4 T60,4"/></svg></button><button class="ni"><span class="ic">💬</span><span class="lb">消息</span><svg viewBox="0 0 60 8"><path d="M0,4 Q7.5,0 15,4 T30,4 T45,4 T60,4"/></svg></button><button class="ni"><span class="ic">👤</span><span class="lb">我的</span><svg viewBox="0 0 60 8"><path d="M0,4 Q7.5,0 15,4 T30,4 T45,4 T60,4"/></svg></button></nav><div class="hint">下划线为流动波浪线</div></div>
<script>document.querySelectorAll('.ni').forEach(function(e){e.addEventListener('click',function(){document.querySelectorAll('.ni').forEach(function(x){x.classList.remove('active')});e.classList.add('active')})});</script></body></html>
