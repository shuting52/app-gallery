<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>35 · 彩虹滑动导航</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.rbnav{position:relative;display:flex;width:100%;background:#101527;border-radius:18px;padding:12px 6px;overflow:hidden}
.rbnav .ni{flex:1;z-index:2;display:flex;flex-direction:column;align-items:center;gap:4px;color:#8b93a7;font-size:11px;padding:8px 0}
.rbnav .ic{font-size:22px}
.rbnav .ni.active{color:#fff}
.rbbar{position:absolute;bottom:0;left:0;height:4px;width:25%;background:linear-gradient(90deg,#ff5b5b,#ffb35b,#5bff9d,#5b8cff,#9b5bff,#ff5b5b);background-size:300% 100%;transition:left .4s cubic-bezier(.5,1.4,.4,1);animation:rbSlide 3s linear infinite}
@keyframes rbSlide{to{background-position:300% 0}}
.rbnav .ni:nth-child(2).active~.rbbar{left:25%}
.rbnav .ni:nth-child(3).active~.rbbar{left:50%}
.rbnav .ni:nth-child(4).active~.rbbar{left:75%}</style></head><body>
<div class="tag">35 · 彩虹滑动导航</div>
<div class="stage"><nav class="rbnav"><button class="ni active"><span class="ic">🏠</span><span class="lb">首页</span></button><button class="ni"><span class="ic">🔍</span><span class="lb">发现</span></button><button class="ni"><span class="ic">💬</span><span class="lb">消息</span></button><button class="ni"><span class="ic">👤</span><span class="lb">我的</span></button><span class="rbbar"></span></nav><div class="hint">点击切换试试</div></div>
<script>document.querySelectorAll('.ni').forEach(function(e){e.addEventListener('click',function(){document.querySelectorAll('.ni').forEach(function(x){x.classList.remove('active')});e.classList.add('active')})});</script></body></html>
