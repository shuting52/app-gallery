<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>13 · 进度步骤导航</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.steps{position:relative;display:flex;width:100%;padding:8px 4px 0}
.sline{position:absolute;top:22px;left:12%;right:12%;height:3px;background:#232c4a;border-radius:3px}
.sfill{display:block;height:100%;width:0;background:linear-gradient(90deg,#5bff9d,#5b8cff);border-radius:3px;transition:width .5s ease;animation:fillGlow 2s ease-in-out infinite}
@keyframes fillGlow{0%,100%{box-shadow:0 0 4px #5bff9d}50%{box-shadow:0 0 12px #5bff9d}}
.sni{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;color:#8b93a7;font-size:12px;z-index:2}
.sni .dot{width:30px;height:30px;border-radius:50%;background:#232c4a;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#8b93a7;transition:all .3s}
.sni.done .dot{background:#1d5c3a;color:#5bff9d;animation:pop .45s cubic-bezier(.3,1.7,.4,1)}
.sni.active .dot{background:linear-gradient(135deg,#5b8cff,#9b5bff);color:#fff;animation:pop .45s cubic-bezier(.3,1.7,.4,1)}
.sni.active,.sni.done{color:#dfe5f5}
@keyframes pop{0%{scale:.5}70%{scale:1.2}100%{scale:1}}</style></head><body>
<div class="tag">13 · 进度步骤导航</div>
<div class="stage"><nav class="steps"><div class="sline"><span class="sfill"></span></div><button class="sni active"><span class="dot">1</span><span>下单</span></button><button class="sni"><span class="dot">2</span><span>付款</span></button><button class="sni"><span class="dot">3</span><span>发货</span></button><button class="sni"><span class="dot">4</span><span>收货</span></button></nav><div class="hint">模拟订单流程步骤</div></div>
<script>var snis=document.querySelectorAll('.sni');
function paint(){var idx=0;snis.forEach(function(e,i){if(e.classList.contains('active'))idx=i});
snis.forEach(function(e,i){e.classList.toggle('done',i<idx)});
document.querySelector('.sfill').style.width=(idx/(snis.length-1)*100)+'%'}
snis.forEach(function(e){e.addEventListener('click',function(){snis.forEach(function(x){x.classList.remove('active')});e.classList.add('active');paint()})});paint();</script></body></html>
