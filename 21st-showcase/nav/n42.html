<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>42 · 磁贴翻转导航</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.tile{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.tni{background:#1a2138;border-radius:16px;padding:22px 0;color:#8b93a7;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:6px;perspective:400px}
.tni .tf{font-size:30px;display:block}
.tni.active{color:#fff;background:#232c4d}
.tni.active .tf{animation:tileFlip .6s ease}
@keyframes tileFlip{0%{transform:rotateX(0) scale(1)}50%{transform:rotateX(180deg) scale(1.15)}100%{transform:rotateX(360deg) scale(1)}}</style></head><body>
<div class="tag">42 · 磁贴翻转导航</div>
<div class="stage"><nav class="tile"><button class="tni active"><span class="tf">🏠</span><span class="tl">首页</span></button><button class="tni"><span class="tf">🔍</span><span class="tl">发现</span></button><button class="tni"><span class="tf">💬</span><span class="tl">消息</span></button><button class="tni"><span class="tf">👤</span><span class="tl">我的</span></button></nav><div class="hint">点击切换试试</div></div>
<script>document.querySelectorAll('.tni').forEach(function(e){e.addEventListener('click',function(){document.querySelectorAll('.tni').forEach(function(x){x.classList.remove('active')});e.classList.add('active')})});</script></body></html>
