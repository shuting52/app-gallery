<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>14 · 3D翻转菜单导航</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.nav3d{display:flex;gap:8px;width:100%;perspective:600px}
.ni3{flex:1;position:relative;height:56px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.5,1.4,.4,1)}
.ni3 .f3,.ni3 .b3{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:4px;border-radius:14px;font-size:13px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.ni3 .f3{background:#1a2138;color:#aab3cc}
.ni3 .b3{background:linear-gradient(135deg,#5b8cff,#9b5bff);color:#fff;transform:rotateX(180deg);font-weight:700;letter-spacing:.1em}
.ni3.active{transform:rotateX(180deg);animation:flipLand .5s ease}
@keyframes flipLand{0%{scale:1}50%{scale:1.06}100%{scale:1}}</style></head><body>
<div class="tag">14 · 3D翻转菜单导航</div>
<div class="stage"><nav class="nav3d"><button class="ni3 active"><span class="f3">🏠首页</span><span class="b3">HOME</span></button><button class="ni3"><span class="f3">🔍发现</span><span class="b3">EXPLORE</span></button><button class="ni3"><span class="f3">💬消息</span><span class="b3">CHAT</span></button><button class="ni3"><span class="f3">👤我的</span><span class="b3">MINE</span></button></nav><div class="hint">点击切换试试</div></div>
<script>document.querySelectorAll('.ni3').forEach(function(e){e.addEventListener('click',function(){document.querySelectorAll('.ni3').forEach(function(x){x.classList.remove('active')});e.classList.add('active')})});</script></body></html>
