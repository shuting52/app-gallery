<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>18 · 打字机菜单导航</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.typenav{display:flex;gap:8px;width:100%}
.typenav .ni{flex:1;background:#161c31;border-radius:14px;padding:14px 0;font-size:24px;border:2px solid transparent}
.typenav .ni.active{border-color:#5b8cff;background:#1c2440}
.typeout{margin-top:6px;font-size:15px;color:#7df9ff;letter-spacing:.15em;min-height:26px;font-family:monospace}
.caret{display:inline-block;width:9px;height:18px;background:#7df9ff;vertical-align:-3px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}</style></head><body>
<div class="tag">18 · 打字机菜单导航</div>
<div class="stage"><nav class="typenav"><button class="ni active" data-t="首页 HOME">🏠</button><button class="ni" data-t="发现 EXPLORE">🔍</button><button class="ni" data-t="消息 MESSAGE">💬</button><button class="ni" data-t="我的 PROFILE">👤</button></nav><div class="typeout"><span class="tt"></span><span class="caret"></span></div><div class="hint">点击图标看下方打字机输出</div></div>
<script>var tt=document.querySelector('.tt');
function typeIt(s){tt.textContent='';var i=0;var t=setInterval(function(){tt.textContent+=s[i++];if(i>=s.length)clearInterval(t)},45)}
document.querySelectorAll('.typenav .ni').forEach(function(e){e.addEventListener('click',function(){document.querySelectorAll('.typenav .ni').forEach(function(x){x.classList.remove('active')});e.classList.add('active');typeIt(e.dataset.t)})});
typeIt('首页 HOME');</script></body></html>
