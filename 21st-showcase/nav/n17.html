<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>17 · 液滴跟随导航</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.dropnav{position:relative;display:flex;width:100%;background:#141a2e;border-radius:18px;padding:10px 6px}
.dropnav .ni{flex:1;z-index:2;display:flex;flex-direction:column;align-items:center;gap:3px;color:#8b93a7;font-size:11px;padding:8px 0}
.dropnav .ic{font-size:22px}
.dropnav .ni.active{color:#fff}
.drop{position:absolute;top:6px;left:6px;width:calc(25% - 9px);bottom:6px;background:linear-gradient(135deg,rgba(91,255,157,.25),rgba(91,140,255,.25));border:2px solid #5bff9d;border-radius:18px;z-index:1;transition:transform .5s cubic-bezier(.5,1.8,.35,1)}
.dropnav .ni.active~.drop,.dropnav .ni:nth-child(1).active~.drop{transform:translateX(0)}
.dropnav .ni:nth-child(2).active~.drop{transform:translateX(100%)}
.dropnav .ni:nth-child(3).active~.drop{transform:translateX(200%)}
.dropnav .ni:nth-child(4).active~.drop{transform:translateX(300%)}
.dropnav .ni.active .ic{animation:dropSquish .5s ease}
@keyframes dropSquish{0%{transform:scale(1,1)}40%{transform:scale(1.3,.7)}70%{transform:scale(.85,1.15)}100%{transform:scale(1,1)}}</style></head><body>
<div class="tag">17 · 液滴跟随导航</div>
<div class="stage"><nav class="dropnav"><button class="ni active"><span class="ic">🏠</span><span class="lb">首页</span></button><button class="ni"><span class="ic">🔍</span><span class="lb">发现</span></button><button class="ni"><span class="ic">💬</span><span class="lb">消息</span></button><button class="ni"><span class="ic">👤</span><span class="lb">我的</span></button><span class="drop"></span></nav><div class="hint">点击切换试试</div></div>
<script>document.querySelectorAll('.ni').forEach(function(e){e.addEventListener('click',function(){document.querySelectorAll('.ni').forEach(function(x){x.classList.remove('active')});e.classList.add('active')})});</script></body></html>
