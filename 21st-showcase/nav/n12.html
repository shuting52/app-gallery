<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>12 · 翻转标签导航</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.flipnav{display:flex;width:100%;gap:8px}
.flipnav .ni{flex:1;background:#161c31;border-radius:14px;padding:12px 0;color:#8b93a7;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px;perspective:300px}
.flipnav .ic{font-size:22px}
.flipnav .lb{display:block;transform-style:preserve-3d}
.flipnav .ni.active{color:#fff;background:#232c4d}
.flipnav .ni.active .lb{animation:labelFlip .55s ease}
.flipnav .ni.active .ic{animation:labelFlip .55s ease .06s}
@keyframes labelFlip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}</style></head><body>
<div class="tag">12 · 翻转标签导航</div>
<div class="stage"><nav class="flipnav"><button class="ni active"><span class="ic">🏠</span><span class="lb">首页</span></button><button class="ni"><span class="ic">🔍</span><span class="lb">发现</span></button><button class="ni"><span class="ic">💬</span><span class="lb">消息</span></button><button class="ni"><span class="ic">👤</span><span class="lb">我的</span></button></nav><div class="hint">点击切换试试</div></div>
<script>document.querySelectorAll('.ni').forEach(function(e){e.addEventListener('click',function(){document.querySelectorAll('.ni').forEach(function(x){x.classList.remove('active')});e.classList.add('active')})});</script></body></html>
