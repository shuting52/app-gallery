<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>50 · 双层组合导航</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.combo{width:100%;display:flex;flex-direction:column;gap:8px}
.ctop{display:flex;background:#141a2e;border-radius:14px;padding:5px}
.ctop .ni{flex:1;padding:10px 0;color:#8b93a7;font-size:14px;border-radius:10px}
.ctop .ni.active{color:#fff;background:linear-gradient(135deg,#5b8cff,#9b5bff);font-weight:700;animation:comboTop .4s cubic-bezier(.3,1.5,.4,1)}
@keyframes comboTop{0%{transform:translateY(-6px);opacity:.5}100%{transform:translateY(0);opacity:1}}
.cbot{display:flex;background:#101527;border:1px solid #232c4a;border-radius:18px;padding:8px 4px}
.cbot .ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:#5a6480;font-size:10px;padding:6px 0}
.cbot .ic{font-size:20px}
.cbot .ni.active{color:#7df9ff}
.cbot .ni.active .ic{animation:comboBob 1.6s ease-in-out infinite}
@keyframes comboBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}</style></head><body>
<div class="tag">50 · 双层组合导航</div>
<div class="stage"><nav class="combo"><div class="ctop"><button class="ni active">推荐</button><button class="ni">视频</button><button class="ni">直播</button></div><div class="cbot"><button class="ni active"><span class="ic">🏠</span><span class="lb">首页</span></button><button class="ni"><span class="ic">🔍</span><span class="lb">发现</span></button><button class="ni"><span class="ic">💬</span><span class="lb">消息</span></button><button class="ni"><span class="ic">👤</span><span class="lb">我的</span></button></div></nav><div class="hint">顶部频道 + 底部图标双导航</div></div>
<script>document.querySelectorAll('.ctop .ni').forEach(function(e){e.addEventListener('click',function(){document.querySelectorAll('.ctop .ni').forEach(function(x){x.classList.remove('active')});e.classList.add('active')})});
document.querySelectorAll('.cbot .ni').forEach(function(e){e.addEventListener('click',function(){document.querySelectorAll('.cbot .ni').forEach(function(x){x.classList.remove('active')});e.classList.add('active')})});</script></body></html>
