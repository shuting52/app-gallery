<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>43 · 光线扫描导航</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.scannav{position:relative;display:flex;width:100%;background:#0d1220;border:1px solid #232c4a;border-radius:18px;padding:12px 6px;overflow:hidden}
.scannav .ni{flex:1;z-index:2;display:flex;flex-direction:column;align-items:center;gap:4px;color:#8b93a7;font-size:11px;padding:8px 0}
.scannav .ic{font-size:22px}
.scannav .ni.active{color:#fff}
.scan{position:absolute;top:0;bottom:0;left:0;width:25%;background:linear-gradient(90deg,transparent,rgba(125,249,255,.14),transparent);z-index:1;transition:left .45s cubic-bezier(.5,1.3,.4,1);animation:scanSweep 3s ease-in-out infinite}
@keyframes scanSweep{0%,100%{opacity:.4}50%{opacity:1}}
.scannav .ni:nth-child(2).active~.scan{left:25%}
.scannav .ni:nth-child(3).active~.scan{left:50%}
.scannav .ni:nth-child(4).active~.scan{left:75%}</style></head><body>
<div class="tag">43 · 光线扫描导航</div>
<div class="stage"><nav class="scannav"><button class="ni active"><span class="ic">🏠</span><span class="lb">首页</span></button><button class="ni"><span class="ic">🔍</span><span class="lb">发现</span></button><button class="ni"><span class="ic">💬</span><span class="lb">消息</span></button><button class="ni"><span class="ic">👤</span><span class="lb">我的</span></button><span class="scan"></span></nav><div class="hint">点击切换试试</div></div>
<script>document.querySelectorAll('.ni').forEach(function(e){e.addEventListener('click',function(){document.querySelectorAll('.ni').forEach(function(x){x.classList.remove('active')});e.classList.add('active')})});</script></body></html>
