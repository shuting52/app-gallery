<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>08 · 波浪底栏导航</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.wavebar{position:relative;width:100%;height:110px}
.wv{position:absolute;inset:auto 0 0 0;width:100%;height:70px;fill:#1a2138;animation:wvMove 4s ease-in-out infinite}
@keyframes wvMove{0%,100%{transform:translateX(0)}50%{transform:translateX(-14px)}}
.wvitems{position:absolute;inset:auto 0 0 0;display:flex;height:70px}
.wvitems .ni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#8b93a7;font-size:10px}
.wvitems .ic{font-size:22px;transition:transform .3s}
.wvitems .ni.active{color:#7df9ff}
.wvitems .ni.active .ic{transform:translateY(-8px) scale(1.25);animation:iconBob 1.8s ease-in-out infinite}
@keyframes iconBob{0%,100%{translate:0 0}50%{translate:0 -4px}}</style></head><body>
<div class="tag">08 · 波浪底栏导航</div>
<div class="stage"><nav class="wavebar"><svg class="wv" viewBox="0 0 400 70" preserveAspectRatio="none"><path d="M0,40 Q50,10 100,40 T200,40 T300,40 T400,40 L400,70 L0,70 Z"/></svg><div class="wvitems"><button class="ni active"><span class="ic">🏠</span><span class="lb">首页</span></button><button class="ni"><span class="ic">🔍</span><span class="lb">发现</span></button><button class="ni"><span class="ic">💬</span><span class="lb">消息</span></button><button class="ni"><span class="ic">👤</span><span class="lb">我的</span></button></div></nav><div class="hint">点击切换试试</div></div>
<script>document.querySelectorAll('.ni').forEach(function(e){e.addEventListener('click',function(){document.querySelectorAll('.ni').forEach(function(x){x.classList.remove('active')});e.classList.add('active')})});</script></body></html>
