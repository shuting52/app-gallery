<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>27 · 书签翻页导航</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.bkm{display:flex;width:100%;gap:6px;align-items:flex-start}
.bkm .ni{flex:1;background:#1a2138;color:#8b93a7;font-size:12px;padding:14px 0 18px;display:flex;flex-direction:column;align-items:center;gap:4px;clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);transition:transform .3s,background .3s;transform-origin:top center}
.bkm .ic{font-size:20px}
.bkm .ni.active{background:linear-gradient(180deg,#5b8cff,#3a5fd0);color:#fff;transform:translateY(6px);animation:bkmSwing 1.2s ease-in-out infinite}
@keyframes bkmSwing{0%,100%{rotate:-2deg}50%{rotate:2deg}}</style></head><body>
<div class="tag">27 · 书签翻页导航</div>
<div class="stage"><nav class="bkm"><button class="ni active"><span class="ic">🏠</span><span class="lb">首页</span></button><button class="ni"><span class="ic">🔍</span><span class="lb">发现</span></button><button class="ni"><span class="ic">💬</span><span class="lb">消息</span></button><button class="ni"><span class="ic">👤</span><span class="lb">我的</span></button></nav><div class="hint">点击切换试试</div></div>
<script>document.querySelectorAll('.ni').forEach(function(e){e.addEventListener('click',function(){document.querySelectorAll('.ni').forEach(function(x){x.classList.remove('active')});e.classList.add('active')})});</script></body></html>
