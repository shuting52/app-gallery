<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>15 · 霓虹发光导航</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.neon{display:flex;width:100%;background:#0a0d18;border:1px solid #232c4a;border-radius:18px;padding:10px 6px}
.neon .ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:#5a6480;font-size:11px;padding:8px 0;border-radius:12px}
.neon .ic{font-size:22px;filter:grayscale(1);transition:filter .3s}
.neon .ni.active{color:#7df9ff}
.neon .ni.active .ic{filter:none;animation:neonPulse 1.8s ease-in-out infinite}
@keyframes neonPulse{0%,100%{text-shadow:0 0 6px #7df9ff,0 0 18px rgba(125,249,255,.6);transform:scale(1)}50%{text-shadow:0 0 14px #7df9ff,0 0 34px rgba(125,249,255,.9);transform:scale(1.12)}}</style></head><body>
<div class="tag">15 · 霓虹发光导航</div>
<div class="stage"><nav class="neon"><button class="ni active"><span class="ic">🏠</span><span class="lb">首页</span></button><button class="ni"><span class="ic">🔍</span><span class="lb">发现</span></button><button class="ni"><span class="ic">💬</span><span class="lb">消息</span></button><button class="ni"><span class="ic">👤</span><span class="lb">我的</span></button></nav><div class="hint">点击切换试试</div></div>
<script>document.querySelectorAll('.ni').forEach(function(e){e.addEventListener('click',function(){document.querySelectorAll('.ni').forEach(function(x){x.classList.remove('active')});e.classList.add('active')})});</script></body></html>
