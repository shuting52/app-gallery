<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>10 · 侧边抽屉导航</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.openbtn{background:linear-gradient(135deg,#5b8cff,#9b5bff);color:#fff;padding:12px 26px;border-radius:12px;font-size:15px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
body.drawer-open .scrim{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:250px;background:#151b31;z-index:41;transform:translateX(-105%);transition:transform .38s cubic-bezier(.6,0,.3,1);padding:26px 16px;display:flex;flex-direction:column;gap:6px}
body.drawer-open .drawer{transform:translateX(0)}
.drawer .dhead{font-size:18px;font-weight:700;margin-bottom:14px}
.drawer .dni{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;color:#aab3cc;font-size:15px;text-align:left;opacity:0;transform:translateX(-24px)}
body.drawer-open .dni{animation:drawerIn .4s ease forwards}
body.drawer-open .dni:nth-child(2){animation-delay:.08s}body.drawer-open .dni:nth-child(3){animation-delay:.14s}body.drawer-open .dni:nth-child(4){animation-delay:.2s}body.drawer-open .dni:nth-child(5){animation-delay:.26s}
@keyframes drawerIn{to{opacity:1;transform:translateX(0)}}
.drawer .dni.active{background:#263056;color:#fff}</style></head><body>
<div class="tag">10 · 侧边抽屉导航</div>
<div class="stage"><button class="openbtn">☰ 打开菜单</button><div class="scrim"></div><nav class="drawer"><div class="dhead">🧭 导航</div><button class="ni dni active"><span class="ic">🏠</span><span class="lb">首页</span></button><button class="ni dni"><span class="ic">🔍</span><span class="lb">发现</span></button><button class="ni dni"><span class="ic">💬</span><span class="lb">消息</span></button><button class="ni dni"><span class="ic">👤</span><span class="lb">我的</span></button></nav><div class="hint">点按钮打开抽屉</div></div>
<script>document.querySelector('.openbtn').addEventListener('click',function(){document.body.classList.add('drawer-open')});
document.querySelector('.scrim').addEventListener('click',function(){document.body.classList.remove('drawer-open')});document.querySelectorAll('.ni').forEach(function(e){e.addEventListener('click',function(){document.querySelectorAll('.ni').forEach(function(x){x.classList.remove('active')});e.classList.add('active')})});</script></body></html>
