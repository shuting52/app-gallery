<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>03 · 鱼眼程序坞导航</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.dock{width:100%;display:flex;justify-content:center}
.dockin{display:flex;gap:10px;background:rgba(255,255,255,.08);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16);border-radius:24px;padding:14px 18px}
.dockin .ni{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:#aab;will-change:transform}
.dockin .ic{font-size:26px;display:block;animation:dockBob 3s ease-in-out infinite}
.dockin .ni:nth-child(2) .ic{animation-delay:.4s}.dockin .ni:nth-child(3) .ic{animation-delay:.8s}.dockin .ni:nth-child(4) .ic{animation-delay:1.2s}
@keyframes dockBob{0%,100%{translate:0 0}50%{translate:0 -4px}}
.dockin .ni.active .lb{color:#7df9ff}</style></head><body>
<div class="tag">03 · 鱼眼程序坞导航</div>
<div class="stage"><nav class="dock"><div class="dockin"><button class="ni active"><span class="ic">🏠</span><span class="lb">首页</span></button><button class="ni"><span class="ic">🔍</span><span class="lb">发现</span></button><button class="ni"><span class="ic">💬</span><span class="lb">消息</span></button><button class="ni"><span class="ic">👤</span><span class="lb">我的</span></button></div></nav><div class="hint">手指/鼠标划过图标试试鱼眼放大</div></div>
<script>var dks=document.querySelectorAll('.dockin .ni');
function fisheye(){var r=document.querySelector('.dockin').getBoundingClientRect();
dks.forEach(function(e){var b=e.getBoundingClientRect();var dx=(b.left+b.width/2)-(r.left+r.width/2);var s=Math.max(1,1.7-Math.abs(dx)/90);e.style.transform='scale('+s+')'})}
document.querySelector('.dockin').addEventListener('mousemove',function(){requestAnimationFrame(fisheye)});
document.querySelector('.dockin').addEventListener('mouseleave',function(){dks.forEach(function(e){e.style.transform='scale(1)'})});document.querySelectorAll('.ni').forEach(function(e){e.addEventListener('click',function(){document.querySelectorAll('.ni').forEach(function(x){x.classList.remove('active')});e.classList.add('active')})});</script></body></html>
