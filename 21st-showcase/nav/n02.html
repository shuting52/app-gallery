<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>02 · 魔法下划线导航</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.nvline{display:flex;width:100%;background:#141a2e;border-radius:16px;padding:8px}
.nvline .ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;color:#8b93a7;font-size:11px;position:relative}
.nvline .ic{font-size:20px}
.nvline .ni::after{content:"";position:absolute;bottom:2px;left:22%;right:22%;height:3px;border-radius:3px;background:linear-gradient(90deg,#ffb35b,#ff5b8c,#9b5bff);transform:scaleX(0);transform-origin:left;transition:transform .35s ease}
.nvline .ni.active{color:#fff}
.nvline .ni.active::after{transform:scaleX(1);animation:lineGlow 1.6s ease-in-out infinite}
@keyframes lineGlow{0%,100%{box-shadow:0 0 4px #ff5b8c}50%{box-shadow:0 0 12px #9b5bff}}</style></head><body>
<div class="tag">02 · 魔法下划线导航</div>
<div class="stage"><nav class="nvline"><button class="ni active"><span class="ic">🏠</span><span class="lb">首页</span></button><button class="ni"><span class="ic">🔍</span><span class="lb">发现</span></button><button class="ni"><span class="ic">💬</span><span class="lb">消息</span></button><button class="ni"><span class="ic">👤</span><span class="lb">我的</span></button></nav><div class="hint">点击切换试试</div></div>
<script>document.querySelectorAll('.ni').forEach(function(e){e.addEventListener('click',function(){document.querySelectorAll('.ni').forEach(function(x){x.classList.remove('active')});e.classList.add('active')})});</script></body></html>
