<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>28 · 弹跳小球指示器导航</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.ballnav{position:relative;display:flex;width:100%;background:#141a2e;border-radius:18px;padding:12px 6px 16px}
.ballnav .ni{flex:1;z-index:2;display:flex;flex-direction:column;align-items:center;gap:6px;color:#8b93a7;font-size:11px;padding:6px 0}
.ballnav .ic{font-size:20px}
.ballnav .ni.active{color:#fff}
.ball{position:absolute;bottom:5px;left:0;width:25%;display:flex;justify-content:center;transition:left .45s cubic-bezier(.5,1.6,.4,1);z-index:1}
.ball::before{content:"";width:10px;height:10px;border-radius:50%;background:#ffb35b;animation:ballBounce .9s ease-in-out infinite}
@keyframes ballBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.ballnav .ni:nth-child(2).active~.ball{left:25%}
.ballnav .ni:nth-child(3).active~.ball{left:50%}
.ballnav .ni:nth-child(4).active~.ball{left:75%}</style></head><body>
<div class="tag">28 · 弹跳小球指示器导航</div>
<div class="stage"><nav class="ballnav"><button class="ni active"><span class="ic">🏠</span><span class="lb">首页</span></button><button class="ni"><span class="ic">🔍</span><span class="lb">发现</span></button><button class="ni"><span class="ic">💬</span><span class="lb">消息</span></button><button class="ni"><span class="ic">👤</span><span class="lb">我的</span></button><span class="ball"></span></nav><div class="hint">点击切换试试</div></div>
<script>document.querySelectorAll('.ni').forEach(function(e){e.addEventListener('click',function(){document.querySelectorAll('.ni').forEach(function(x){x.classList.remove('active')});e.classList.add('active')})});</script></body></html>
