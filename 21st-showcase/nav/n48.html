<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>48 · 液态blob导航</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.blobnav{position:relative;display:flex;width:100%;background:#141a2e;border-radius:22px;padding:10px 6px}
.blobnav .ni{flex:1;z-index:2;display:flex;flex-direction:column;align-items:center;gap:3px;color:#8b93a7;font-size:11px;padding:8px 0}
.blobnav .ic{font-size:22px}
.blobnav .ni.active{color:#fff}
.blob{position:absolute;top:8px;bottom:8px;left:6px;width:calc(25% - 9px);background:linear-gradient(135deg,#5b8cff,#9b5bff);z-index:1;transition:transform .5s cubic-bezier(.5,1.6,.35,1);animation:blobWobble 4s ease-in-out infinite}
@keyframes blobWobble{0%,100%{border-radius:18px 26px 18px 26px}25%{border-radius:28px 16px 28px 16px}50%{border-radius:16px 30px 16px 30px}75%{border-radius:26px 18px 26px 18px}}
.blobnav .ni:nth-child(2).active~.blob{transform:translateX(100%)}
.blobnav .ni:nth-child(3).active~.blob{transform:translateX(200%)}
.blobnav .ni:nth-child(4).active~.blob{transform:translateX(300%)}</style></head><body>
<div class="tag">48 · 液态blob导航</div>
<div class="stage"><nav class="blobnav"><button class="ni active"><span class="ic">🏠</span><span class="lb">首页</span></button><button class="ni"><span class="ic">🔍</span><span class="lb">发现</span></button><button class="ni"><span class="ic">💬</span><span class="lb">消息</span></button><button class="ni"><span class="ic">👤</span><span class="lb">我的</span></button><span class="blob"></span></nav><div class="hint">点击切换试试</div></div>
<script>document.querySelectorAll('.ni').forEach(function(e){e.addEventListener('click',function(){document.querySelectorAll('.ni').forEach(function(x){x.classList.remove('active')});e.classList.add('active')})});</script></body></html>
