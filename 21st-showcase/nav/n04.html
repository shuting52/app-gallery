<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>04 · 扇形展开菜单</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.fanwrap{position:relative;width:220px;height:200px;margin-top:20px}
.fanmain{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#5b8cff,#9b5bff);color:#fff;font-size:24px;box-shadow:0 8px 24px rgba(91,140,255,.4);z-index:3}
.fni{position:absolute;left:50%;bottom:8px;width:48px;height:48px;border-radius:50%;background:#1e2742;color:#fff;font-size:22px;transform:translateX(-50%);opacity:0;pointer-events:none;transition:transform .4s cubic-bezier(.5,1.6,.4,1),opacity .3s}
.fanwrap.open .fni{opacity:1;pointer-events:auto;transform:translateX(-50%) rotate(var(--a)) translateY(-130px) rotate(calc(var(--a) * -1));animation:fanPop .45s cubic-bezier(.5,1.8,.4,1)}
@keyframes fanPop{0%{scale:.4}60%{scale:1.15}100%{scale:1}}
.fanwrap .fni.active{background:linear-gradient(135deg,#ffb35b,#ff5b8c)}</style></head><body>
<div class="tag">04 · 扇形展开菜单</div>
<div class="stage"><div class="fanwrap"><button class="fanmain">☰</button><button class="fni" style="--a:-72deg">🏠</button><button class="fni" style="--a:-24deg">🔍</button><button class="fni" style="--a:24deg">💬</button><button class="fni" style="--a:72deg">👤</button></div><div class="hint">点 ☰ 展开扇形菜单</div></div>
<script>document.querySelector('.fanmain').addEventListener('click',function(){document.querySelector('.fanwrap').classList.toggle('open')});
document.querySelectorAll('.fni').forEach(function(e){e.addEventListener('click',function(){document.querySelectorAll('.fni').forEach(function(x){x.classList.remove('active')});e.classList.add('active')})});</script></body></html>
