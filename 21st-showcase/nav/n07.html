<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>07 · 悬浮球展开菜单</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.fabwrap{position:relative;width:100%;height:260px}
.fab{position:absolute;right:8px;bottom:0;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#ff5b8c,#ff9a5b);color:#fff;font-size:30px;box-shadow:0 8px 22px rgba(255,91,140,.45);z-index:3;transition:transform .3s}
.fabwrap.open .fab{transform:rotate(135deg)}
.fabitem{position:absolute;right:12px;bottom:8px;display:flex;align-items:center;gap:8px;background:#1e2742;padding:10px 14px;border-radius:999px;font-size:20px;opacity:0;transform:translateY(0) scale(.5);pointer-events:none;transition:transform .35s cubic-bezier(.5,1.5,.4,1),opacity .25s;transition-delay:calc(var(--d)*.06s)}
.fabitem span{font-size:13px;color:#dfe5f5}
.fabwrap.open .fabitem{opacity:1;pointer-events:auto;transform:translateY(calc((var(--d) + 1) * -68px)) scale(1);animation:fabPop .4s cubic-bezier(.5,1.8,.4,1)}
@keyframes fabPop{0%{scale:.5}70%{scale:1.12}100%{scale:1}}
.fabitem.active{background:linear-gradient(135deg,#5b8cff,#9b5bff)}</style></head><body>
<div class="tag">07 · 悬浮球展开菜单</div>
<div class="stage"><div class="fabwrap"><button class="fabitem" style="--d:0">🏠<span>首页</span></button><button class="fabitem" style="--d:1">🔍<span>发现</span></button><button class="fabitem" style="--d:2">💬<span>消息</span></button><button class="fab">＋</button></div><div class="hint">点右下角 ＋ 展开</div></div>
<script>document.querySelector('.fab').addEventListener('click',function(){document.querySelector('.fabwrap').classList.toggle('open')});
document.querySelectorAll('.fabitem').forEach(function(e){e.addEventListener('click',function(){document.querySelectorAll('.fabitem').forEach(function(x){x.classList.remove('active')});e.classList.add('active')})});</script></body></html>
