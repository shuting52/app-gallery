<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>30 · 3D按压导航</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.press3d{display:flex;width:100%;gap:8px;perspective:500px}
.press3d .ni{flex:1;background:linear-gradient(180deg,#2b3760,#1c2440);border-radius:14px;padding:14px 0;color:#aab3cc;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 6px 0 #0c1020,0 10px 18px rgba(0,0,0,.4);transition:transform .12s,box-shadow .12s}
.press3d .ic{font-size:22px}
.press3d .ni:active{transform:translateY(5px);box-shadow:0 1px 0 #0c1020}
.press3d .ni.active{color:#fff;background:linear-gradient(180deg,#5b8cff,#3a5fd0);animation:pressGlow 2s ease-in-out infinite}
@keyframes pressGlow{0%,100%{box-shadow:0 6px 0 #233a7d,0 10px 22px rgba(91,140,255,.35)}50%{box-shadow:0 6px 0 #233a7d,0 10px 34px rgba(91,140,255,.65)}}</style></head><body>
<div class="tag">30 · 3D按压导航</div>
<div class="stage"><nav class="press3d"><button class="ni active"><span class="ic">🏠</span><span class="lb">首页</span></button><button class="ni"><span class="ic">🔍</span><span class="lb">发现</span></button><button class="ni"><span class="ic">💬</span><span class="lb">消息</span></button><button class="ni"><span class="ic">👤</span><span class="lb">我的</span></button></nav><div class="hint">点击切换试试</div></div>
<script>document.querySelectorAll('.ni').forEach(function(e){e.addEventListener('click',function(){document.querySelectorAll('.ni').forEach(function(x){x.classList.remove('active')});e.classList.add('active')})});</script></body></html>
