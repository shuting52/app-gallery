<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>01 · 胶囊滑动导航</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.nvpill{position:relative;display:flex;background:#1a2138;border-radius:999px;padding:6px;width:100%}
.nvpill .ni{flex:1;position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;color:#8b93a7;font-size:11px}
.nvpill .ic{font-size:20px;filter:grayscale(1);transition:filter .3s}
.nvpill .ni.active{color:#fff}.nvpill .ni.active .ic{filter:none}
.nvpill .pill{position:absolute;top:6px;bottom:6px;left:6px;width:calc(25% - 9px);background:linear-gradient(135deg,#5b8cff,#9b5bff);border-radius:999px;z-index:1;transition:transform .38s cubic-bezier(.6,-0.2,.3,1.4);animation:pillIn .5s ease}
@keyframes pillIn{from{transform:scale(.6);opacity:0}}
.nvpill .ni:nth-child(2).active~.pill{transform:translateX(100%)}
.nvpill .ni:nth-child(3).active~.pill{transform:translateX(200%)}
.nvpill .ni:nth-child(4).active~.pill{transform:translateX(300%)}</style></head><body>
<div class="tag">01 · 胶囊滑动导航</div>
<div class="stage"><nav class="nvpill"><button class="ni active"><span class="ic">🏠</span><span class="lb">首页</span></button><button class="ni"><span class="ic">🔍</span><span class="lb">发现</span></button><button class="ni"><span class="ic">💬</span><span class="lb">消息</span></button><button class="ni"><span class="ic">👤</span><span class="lb">我的</span></button><span class="pill"></span></nav><div class="hint">点击切换试试</div></div>
<script>document.querySelectorAll('.ni').forEach(function(e){e.addEventListener('click',function(){document.querySelectorAll('.ni').forEach(function(x){x.classList.remove('active')});e.classList.add('active')})});</script></body></html>
