<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>32 · 滚动收缩胶囊导航</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.shrinkpill{position:sticky;top:58px;display:flex;gap:4px;background:#1a2138;border-radius:999px;padding:8px 14px;z-index:30;transition:all .35s ease;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.shrinkpill .ni{display:flex;align-items:center;gap:6px;color:#8b93a7;font-size:13px;padding:8px 10px;border-radius:999px;white-space:nowrap}
.shrinkpill .ni.active{background:#2b3760;color:#fff;animation:pillPop .35s ease}
@keyframes pillPop{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
body.scrolled .shrinkpill{gap:0;padding:8px 10px}
body.scrolled .shrinkpill .ni span{display:none}
body.scrolled .shrinkpill .ni{font-size:18px;padding:8px}
.tall{height:900px;background:repeating-linear-gradient(180deg,transparent 0 46px,rgba(255,255,255,.03) 46px 48px);border-radius:12px;width:100%}</style></head><body>
<div class="tag">32 · 滚动收缩胶囊导航</div>
<div class="stage"><nav class="shrinkpill"><button class="ni active">🏠<span>首页</span></button><button class="ni">🔍<span>发现</span></button><button class="ni">💬<span>消息</span></button><button class="ni">👤<span>我的</span></button></nav><div class="tall"></div><div class="hint">向下滚动，胶囊收缩只留图标</div></div>
<script>window.addEventListener('scroll',function(){document.body.classList.toggle('scrolled',window.scrollY>120)},{passive:true});document.querySelectorAll('.ni').forEach(function(e){e.addEventListener('click',function(){document.querySelectorAll('.ni').forEach(function(x){x.classList.remove('active')});e.classList.add('active')})});</script></body></html>
