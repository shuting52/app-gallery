<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>36 · 拖拽排序导航</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.dragnav{display:flex;width:100%;gap:8px}
.dragnav .ni{flex:1;background:#1a2138;border-radius:14px;padding:14px 0;color:#aab3cc;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:grab;touch-action:none;user-select:none}
.dragnav .ni .ic{font-size:22px}
.dragnav .ni.dragging{opacity:.5;scale:1.08;animation:wiggle .3s ease-in-out infinite;cursor:grabbing}
@keyframes wiggle{0%,100%{rotate:-2deg}50%{rotate:2deg}}
.dragnav .ni.active{background:linear-gradient(135deg,#5b8cff,#9b5bff);color:#fff}</style></head><body>
<div class="tag">36 · 拖拽排序导航</div>
<div class="stage"><nav class="dragnav"><button class="ni" draggable="true">🏠<span>首页</span></button><button class="ni" draggable="true">🔍<span>发现</span></button><button class="ni" draggable="true">💬<span>消息</span></button><button class="ni" draggable="true">👤<span>我的</span></button></nav><div class="hint">按住拖动可重新排序</div></div>
<script>var dns=document.querySelectorAll('.dragnav .ni');var dragEl=null;
dns[0].classList.add('active');
dns.forEach(function(e){
e.addEventListener('click',function(){dns.forEach(function(x){x.classList.remove('active')});e.classList.add('active')});
e.addEventListener('dragstart',function(){dragEl=e;setTimeout(function(){e.classList.add('dragging')},0)});
e.addEventListener('dragend',function(){e.classList.remove('dragging')});
e.addEventListener('dragover',function(ev){ev.preventDefault()});
e.addEventListener('drop',function(ev){ev.preventDefault();if(dragEl&&dragEl!==e){var nav=e.parentNode;var items=Array.prototype.slice.call(nav.children);var di=items.indexOf(dragEl);var ti=items.indexOf(e);if(di<ti)nav.insertBefore(dragEl,e.nextSibling);else nav.insertBefore(dragEl,e)}})});</script></body></html>
