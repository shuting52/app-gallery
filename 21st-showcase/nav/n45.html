<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>45 · 双层抽屉导航</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.openbtn2{background:linear-gradient(135deg,#9b5bff,#ff5b8c);color:#fff;padding:12px 26px;border-radius:12px;font-size:15px}
.scrim2{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
body.d2open .scrim2{opacity:1;pointer-events:auto}
.drawer2{position:fixed;top:0;right:0;bottom:0;width:250px;background:#151b31;z-index:41;transform:translateX(105%);transition:transform .38s cubic-bezier(.6,0,.3,1);padding:26px 16px;display:flex;flex-direction:column;gap:6px}
body.d2open .drawer2{transform:translateX(0)}
.d2head{font-size:18px;font-weight:700;margin-bottom:10px}
.drawer2 .ni{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:12px;color:#aab3cc;font-size:15px;text-align:left;opacity:0;transform:translateX(24px)}
body.d2open .drawer2 .ni{animation:d2In .4s ease forwards}
body.d2open .drawer2 .ni:nth-child(2){animation-delay:.06s}body.d2open .drawer2 .ni:nth-child(3){animation-delay:.12s}body.d2open .drawer2 .ni:nth-child(5){animation-delay:.18s}body.d2open .drawer2 .ni:nth-child(6){animation-delay:.24s}
@keyframes d2In{to{opacity:1;transform:translateX(0)}}
.drawer2 .ni.active{background:#263056;color:#fff}
.sub{max-height:0;overflow:hidden;transition:max-height .35s ease;display:flex;flex-direction:column;gap:4px;padding-left:18px}
.sub.open{max-height:150px}
.sub .sni{text-align:left;color:#7c86a0;font-size:14px;padding:9px 12px;border-radius:10px;animation:subIn .3s ease}
@keyframes subIn{from{opacity:0;transform:translateX(12px)}}
.sub .sni.active{color:#7df9ff;background:#1c2440}</style></head><body>
<div class="tag">45 · 双层抽屉导航</div>
<div class="stage"><button class="openbtn2">☰ 双层菜单</button><div class="scrim2"></div><nav class="drawer2"><div class="d2head">🧭 导航</div><button class="ni active">🏠 首页</button><button class="ni has-sub">🔍 发现 ▾</button><div class="sub"><button class="sni">热门推荐</button><button class="sni">附近动态</button><button class="sni">话题广场</button></div><button class="ni">💬 消息</button><button class="ni">👤 我的</button></nav><div class="hint">右侧滑出，含二级子菜单</div></div>
<script>document.querySelector('.openbtn2').addEventListener('click',function(){document.body.classList.add('d2open')});
document.querySelector('.scrim2').addEventListener('click',function(){document.body.classList.remove('d2open')});
document.querySelector('.has-sub').addEventListener('click',function(){document.querySelector('.sub').classList.toggle('open')});
document.querySelectorAll('.drawer2 .ni,.sub .sni').forEach(function(e){e.addEventListener('click',function(){document.querySelectorAll('.drawer2 .ni,.sub .sni').forEach(function(x){x.classList.remove('active')});e.classList.add('active')})});</script></body></html>
