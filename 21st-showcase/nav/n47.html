<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>47 · 闪烁星导航</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.starnav{display:flex;width:100%;background:#0a0d1a;border:1px solid #232c4a;border-radius:18px;padding:12px 6px;position:relative;overflow:hidden}
.starnav::before,.starnav::after{content:"✦";position:absolute;color:#7df9ff;font-size:12px;animation:twinkle 2.4s ease-in-out infinite}
.starnav::before{top:8px;left:12%}
.starnav::after{bottom:10px;right:14%;animation-delay:1.2s;font-size:9px}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7) rotate(0deg)}50%{opacity:1;transform:scale(1.3) rotate(90deg)}}
.starnav .ni{flex:1;z-index:2;display:flex;flex-direction:column;align-items:center;gap:4px;color:#5a6480;font-size:11px;padding:8px 0}
.starnav .ic{font-size:22px}
.starnav .ni.active{color:#ffe98a}
.starnav .ni.active .ic{animation:starPop .6s cubic-bezier(.3,1.7,.4,1)}
@keyframes starPop{0%{transform:scale(.4) rotate(-30deg)}70%{transform:scale(1.3) rotate(10deg)}100%{transform:scale(1) rotate(0)}}</style></head><body>
<div class="tag">47 · 闪烁星导航</div>
<div class="stage"><nav class="starnav"><button class="ni active"><span class="ic">🏠</span><span class="lb">首页</span></button><button class="ni"><span class="ic">🔍</span><span class="lb">发现</span></button><button class="ni"><span class="ic">💬</span><span class="lb">消息</span></button><button class="ni"><span class="ic">👤</span><span class="lb">我的</span></button></nav><div class="hint">点击切换试试</div></div>
<script>document.querySelectorAll('.ni').forEach(function(e){e.addEventListener('click',function(){document.querySelectorAll('.ni').forEach(function(x){x.classList.remove('active')});e.classList.add('active')})});</script></body></html>
