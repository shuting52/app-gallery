<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>06 · 分段选择器导航</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.seg{position:relative;display:flex;background:#161c31;border-radius:14px;padding:4px;width:100%}
.seg .ni{flex:1;z-index:2;padding:12px 0;color:#8b93a7;font-size:14px;border-radius:10px}
.seg .ni.active{color:#fff;font-weight:700}
.segind{position:absolute;top:4px;bottom:4px;left:4px;width:calc(33.333% - 5.33px);background:#2b3760;border-radius:10px;transition:transform .35s cubic-bezier(.6,-0.25,.3,1.3);animation:segPulse 2.4s ease-in-out infinite}
@keyframes segPulse{0%,100%{box-shadow:0 0 0 rgba(91,140,255,0)}50%{box-shadow:0 0 14px rgba(91,140,255,.5)}}
.seg .ni:nth-child(2).active~.segind{transform:translateX(100%)}
.seg .ni:nth-child(3).active~.segind{transform:translateX(200%)}</style></head><body>
<div class="tag">06 · 分段选择器导航</div>
<div class="stage"><nav class="seg"><button class="ni active">推荐</button><button class="ni">热门</button><button class="ni">最新</button><span class="segind"></span></nav><div class="hint">点击切换试试</div></div>
<script>document.querySelectorAll('.ni').forEach(function(e){e.addEventListener('click',function(){document.querySelectorAll('.ni').forEach(function(x){x.classList.remove('active')});e.classList.add('active')})});</script></body></html>
