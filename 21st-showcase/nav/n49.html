<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>49 · 滑动切换导航</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.swpwrap{width:100%}
.swpnav{display:flex;background:#141a2e;border-radius:14px;padding:5px}
.swpnav .ni{flex:1;padding:11px 0;color:#8b93a7;font-size:14px;border-radius:10px;transition:all .25s}
.swpnav .ni.active{color:#fff;background:#2b3760;font-weight:700}
.swpbody{overflow:hidden;border-radius:16px;margin-top:10px;touch-action:pan-y}
.swpinner{display:flex;transition:transform .38s cubic-bezier(.5,0,.3,1)}
.swpp{flex:0 0 100%;height:170px;display:flex;align-items:center;justify-content:center;font-size:19px;background:linear-gradient(135deg,#1a2140,#2a1f4d);border:1px solid #2a3352;animation:swpIn .45s ease}
@keyframes swpIn{from{opacity:.4;transform:scale(.96)}}</style></head><body>
<div class="tag">49 · 滑动切换导航</div>
<div class="stage"><div class="swpwrap"><nav class="swpnav"><button class="ni active">推荐</button><button class="ni">关注</button><button class="ni">同城</button><button class="ni">榜单</button></nav><div class="swpbody"><div class="swpinner"><div class="swpp">🌟 推荐流</div><div class="swpp">❤️ 关注流</div><div class="swpp">📍 同城流</div><div class="swpp">🏆 榜单流</div></div></div></div><div class="hint">左右滑动内容区切换频道</div></div>
<script>var ps=document.querySelectorAll('.swpnav .ni');var inner=document.querySelector('.swpinner');
function pgo(i){ps.forEach(function(x){x.classList.remove('active')});ps[i].classList.add('active');inner.style.transform='translateX(-'+(i*100)+'%)'}
ps.forEach(function(e,i){e.addEventListener('click',function(){pgo(i)})});
var sx2=0;var bd=document.querySelector('.swpbody');
bd.addEventListener('touchstart',function(e){sx2=e.touches[0].clientX},{passive:true});
bd.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-sx2;var cur=0;ps.forEach(function(x,i){if(x.classList.contains('active'))cur=i});
if(dx<-40&&cur<3)pgo(cur+1);if(dx>40&&cur>0)pgo(cur-1)},{passive:true});</script></body></html>
