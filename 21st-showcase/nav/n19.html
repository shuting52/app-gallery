<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>19 · 旋转圆盘导航</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.dialwrap{position:relative;width:230px;height:230px;margin:10px auto}
.dial{position:absolute;inset:0;transition:transform .6s cubic-bezier(.5,1.4,.4,1)}
.dni{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:#1e2742;font-size:24px;transform:rotate(var(--r)) translateY(-88px) rotate(calc(var(--r) * -1));border:2px solid transparent}
.dni.active{background:linear-gradient(135deg,#5b8cff,#9b5bff);border-color:#7df9ff;animation:dialGlow 1.6s ease-in-out infinite}
@keyframes dialGlow{0%,100%{box-shadow:0 0 6px rgba(91,140,255,.5)}50%{box-shadow:0 0 18px rgba(91,140,255,.9)}}
.dialcenter{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:74px;height:74px;border-radius:50%;background:#141a2e;border:2px dashed #3a4568;color:#8b93a7;font-size:13px;animation:spinSlow 12s linear infinite}
@keyframes spinSlow{to{transform:translate(-50%,-50%) rotate(360deg)}}</style></head><body>
<div class="tag">19 · 旋转圆盘导航</div>
<div class="stage"><div class="dialwrap"><div class="dial"><button class="dni" style="--r:0deg">🏠</button><button class="dni" style="--r:90deg">🔍</button><button class="dni" style="--r:180deg">💬</button><button class="dni" style="--r:270deg">👤</button></div><div class="dialcenter">转我</div></div><div class="hint">点圆盘图标，圆盘旋转对准</div></div>
<script>var deg=0;var dnis=document.querySelectorAll('.dni');
dnis.forEach(function(e,i){e.addEventListener('click',function(){dnis.forEach(function(x){x.classList.remove('active')});e.classList.add('active');deg=-i*90;document.querySelector('.dial').style.transform='rotate('+deg+'deg)'})});
dnis[0].classList.add('active');</script></body></html>
