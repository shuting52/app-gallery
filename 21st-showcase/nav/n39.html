<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>39 · 气泡弹出导航</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.bubnav{display:flex;width:100%;background:#141a2e;border-radius:20px;padding:12px 8px}
.bubnav .ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:#8b93a7;font-size:11px;padding:8px 0;position:relative}
.bubnav .ic{font-size:22px}
.bubnav .ni.active{color:#fff}
.bubnav .ni.active .ic{animation:bubbleUp .55s cubic-bezier(.3,1.6,.4,1)}
.bubnav .ni.active::before{content:"";position:absolute;top:-4px;width:44px;height:44px;border-radius:50%;background:rgba(91,140,255,.25);animation:bubbleRing .55s ease-out}
@keyframes bubbleUp{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-14px) scale(1.25)}100%{transform:translateY(0) scale(1)}}
@keyframes bubbleRing{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.5);opacity:0}}</style></head><body>
<div class="tag">39 · 气泡弹出导航</div>
<div class="stage"><nav class="bubnav"><button class="ni active"><span class="ic">🏠</span><span class="lb">首页</span></button><button class="ni"><span class="ic">🔍</span><span class="lb">发现</span></button><button class="ni"><span class="ic">💬</span><span class="lb">消息</span></button><button class="ni"><span class="ic">👤</span><span class="lb">我的</span></button></nav><div class="hint">点击切换试试</div></div>
<script>document.querySelectorAll('.ni').forEach(function(e){e.addEventListener('click',function(){document.querySelectorAll('.ni').forEach(function(x){x.classList.remove('active')});e.classList.add('active')})});</script></body></html>
