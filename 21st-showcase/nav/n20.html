<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>20 · 磁吸按钮导航</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.magnet{display:flex;gap:10px;width:100%;justify-content:center;padding:10px}
.magnet .ni{background:#1a2138;border-radius:16px;padding:14px 0;flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:#8b93a7;font-size:11px;transition:transform .18s ease-out,box-shadow .3s;will-change:transform}
.magnet .ic{font-size:24px}
.magnet .ni.active{color:#fff;box-shadow:0 0 0 2px #5b8cff,0 8px 24px rgba(91,140,255,.35);animation:magPulse 2s ease-in-out infinite}
@keyframes magPulse{0%,100%{box-shadow:0 0 0 2px #5b8cff,0 8px 24px rgba(91,140,255,.35)}50%{box-shadow:0 0 0 3px #9b5bff,0 8px 32px rgba(155,91,255,.55)}}</style></head><body>
<div class="tag">20 · 磁吸按钮导航</div>
<div class="stage"><nav class="magnet"><button class="ni active"><span class="ic">🏠</span><span class="lb">首页</span></button><button class="ni"><span class="ic">🔍</span><span class="lb">发现</span></button><button class="ni"><span class="ic">💬</span><span class="lb">消息</span></button><button class="ni"><span class="ic">👤</span><span class="lb">我的</span></button></nav><div class="hint">鼠标靠近按钮会被吸住</div></div>
<script>document.querySelectorAll('.magnet .ni').forEach(function(e){
e.addEventListener('mousemove',function(ev){var b=e.getBoundingClientRect();var x=(ev.clientX-b.left-b.width/2)/b.width;var y=(ev.clientY-b.top-b.height/2)/b.height;requestAnimationFrame(function(){e.style.transform='translate('+(x*14)+'px,'+(y*14)+'px)'})});
e.addEventListener('mouseleave',function(){e.style.transform='translate(0,0)'});
e.addEventListener('click',function(){document.querySelectorAll('.magnet .ni').forEach(function(x){x.classList.remove('active')});e.classList.add('active')})});</script></body></html>
