<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>38 · 霓虹描边流动导航</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.7}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.nbnav{display:flex;width:100%;gap:8px}
.nbnav .ni{flex:1;position:relative;border-radius:14px;padding:13px 0;color:#5a6480;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;background:#0d1220;overflow:hidden}
.nbnav .ic{font-size:22px;position:relative;z-index:2}
.nbnav .lb{position:relative;z-index:2}
.nbnav .ni::before{content:"";position:absolute;inset:-40%;background:conic-gradient(transparent,transparent,transparent,#ff5b8c);opacity:0;animation:nbSpin 2.6s linear infinite}
.nbnav .ni::after{content:"";position:absolute;inset:2px;background:#0d1220;border-radius:12px;z-index:1}
.nbnav .ni.active{color:#ffb3c8}
.nbnav .ni.active::before{opacity:1}
@keyframes nbSpin{to{transform:rotate(360deg)}}</style></head><body>
<div class="tag">38 · 霓虹描边流动导航</div>
<div class="stage"><nav class="nbnav"><button class="ni active"><span class="ic">🏠</span><span class="lb">首页</span></button><button class="ni"><span class="ic">🔍</span><span class="lb">发现</span></button><button class="ni"><span class="ic">💬</span><span class="lb">消息</span></button><button class="ni"><span class="ic">👤</span><span class="lb">我的</span></button></nav><div class="hint">点击切换试试</div></div>
<script>document.querySelectorAll('.ni').forEach(function(e){e.addEventListener('click',function(){document.querySelectorAll('.ni').forEach(function(x){x.classList.remove('active')});e.classList.add('active')})});</script></body></html>
