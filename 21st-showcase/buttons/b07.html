<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>07 · 粒子爆裂按钮</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{min-height:100vh;background:#0e1116;color:#f1f5f9;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overflow-x:hidden;padding:24px 16px}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#8b93a3;letter-spacing:.08em;z-index:50}
.stage{position:relative;width:100%;max-width:430px;min-height:52vh;display:flex;align-items:center;justify-content:center}
.btn{position:relative;border:0;cursor:pointer;font-size:17px;font-weight:700;color:#fff;padding:16px 42px;border-radius:14px;font-family:inherit;overflow:hidden;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.btn:active{filter:brightness(1.25)}
.hint{margin-top:18px;color:#5b6474;font-size:13px;min-height:20px;text-align:center}
.btn{background:linear-gradient(135deg,#ef4444,#b91c1c);z-index:1}
#pc{position:absolute;inset:0;pointer-events:none;z-index:2}
</style>
</head>
<body>
<div class="tag">07 · 粒子爆裂按钮</div>
<div class="stage"><button class="btn">点我爆炸</button><canvas id="pc"></canvas></div>
<p class="hint">点击按钮试试</p>
<script>
var s=document.querySelector('.stage'),c=document.getElementById('pc'),x=c.getContext('2d'),P=[],W,H;
function size(){W=c.width=s.offsetWidth;H=c.height=s.offsetHeight}x.scale(1,1);size();
document.querySelector('.btn').addEventListener('click',function(e){var r=s.getBoundingClientRect();var px=e.clientX-r.left,py=e.clientY-r.top;
for(var i=0;i<22;i++){var a=Math.random()*6.283,v=2+Math.random()*5;P.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2.5,l:1,c:['#f472b6','#22d3ee','#a3e635','#fbbf24','#fff'][i%5],s:2+Math.random()*3})}});
function loop(){x.clearRect(0,0,W,H);P=P.filter(function(p){return p.l>0});
P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.l-=.02;x.globalAlpha=Math.max(p.l,0);x.fillStyle=p.c;x.fillRect(p.x,p.y,p.s,p.s)});x.globalAlpha=1;requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>
