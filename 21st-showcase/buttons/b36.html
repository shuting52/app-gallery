<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>36 · 音波律动按钮</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{min-height:100vh;background:#0e1116;color:#f1f5f9;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overflow-x:hidden;padding:24px 16px}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#8b93a3;letter-spacing:.08em;z-index:50}
.stage{position:relative;width:100%;max-width:430px;min-height:52vh;display:flex;align-items:center;justify-content:center}
.btn{position:relative;border:0;cursor:pointer;font-size:17px;font-weight:700;color:#fff;padding:16px 42px;border-radius:14px;font-family:inherit;overflow:hidden;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.btn:active{filter:brightness(1.25)}
.hint{margin-top:18px;color:#5b6474;font-size:13px;min-height:20px;text-align:center}
.btn{background:#111827;border:1px solid #4ade80;color:#bbf7d0}
.bars{display:inline-flex;gap:3px;align-items:flex-end;margin-right:10px;height:18px;vertical-align:-3px}
.bars i{width:4px;height:25%;background:#4ade80;border-radius:2px}
.btn:hover .bars i{animation:eq .7s ease-in-out infinite alternate}
.btn:hover .bars i:nth-child(2){animation-delay:.12s}.btn:hover .bars i:nth-child(3){animation-delay:.24s}
.btn:hover .bars i:nth-child(4){animation-delay:.36s}.btn:hover .bars i:nth-child(5){animation-delay:.48s}
@keyframes eq{to{height:100%}}
</style>
</head>
<body>
<div class="tag">36 · 音波律动按钮</div>
<div class="stage"><button class="btn"><span class="bars"><i></i><i></i><i></i><i></i><i></i></span>播放音乐</button></div>
<p class="hint">点击按钮试试</p>
<script>

</script>
</body>
</html>
