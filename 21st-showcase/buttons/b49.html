<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>49 · 倒计时按钮</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{min-height:100vh;background:#0e1116;color:#f1f5f9;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overflow-x:hidden;padding:24px 16px}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#8b93a3;letter-spacing:.08em;z-index:50}
.stage{position:relative;width:100%;max-width:430px;min-height:52vh;display:flex;align-items:center;justify-content:center}
.btn{position:relative;border:0;cursor:pointer;font-size:17px;font-weight:700;color:#fff;padding:16px 42px;border-radius:14px;font-family:inherit;overflow:hidden;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.btn:active{filter:brightness(1.25)}
.hint{margin-top:18px;color:#5b6474;font-size:13px;min-height:20px;text-align:center}
.btn{background:#1f2937;border:1px solid #22c55e;color:#bbf7d0;min-width:230px}
</style>
</head>
<body>
<div class="tag">49 · 倒计时按钮</div>
<div class="stage"><button class="btn">开始倒计时</button></div>
<p class="hint">点击按钮试试</p>
<script>
var b=document.querySelector('.btn'),run=false;
b.addEventListener('click',function(){if(run)return;run=true;var t0=performance.now(),D=2400;
function loop(now){var p=Math.min((now-t0)/D,1);
b.style.background='conic-gradient(#22c55e '+(p*100)+'%, #1f2937 0)';
b.textContent='剩余 '+Math.ceil((1-p)*3)+' 秒';
if(p<1){requestAnimationFrame(loop)}else{b.textContent='倒计时完成 ✓';b.style.background='linear-gradient(135deg,#16a34a,#15803d)';
setTimeout(function(){b.textContent='开始倒计时';b.style.background='';run=false;},1500)}}
requestAnimationFrame(loop);});
</script>
</body>
</html>
