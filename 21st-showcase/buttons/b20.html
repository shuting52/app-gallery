<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>20 · 爱心爆发按钮</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{min-height:100vh;background:#0e1116;color:#f1f5f9;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overflow-x:hidden;padding:24px 16px}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#8b93a3;letter-spacing:.08em;z-index:50}
.stage{position:relative;width:100%;max-width:430px;min-height:52vh;display:flex;align-items:center;justify-content:center}
.btn{position:relative;border:0;cursor:pointer;font-size:17px;font-weight:700;color:#fff;padding:16px 42px;border-radius:14px;font-family:inherit;overflow:hidden;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.btn:active{filter:brightness(1.25)}
.hint{margin-top:18px;color:#5b6474;font-size:13px;min-height:20px;text-align:center}
.btn{background:linear-gradient(135deg,#f43f5e,#be123c)}
.h{position:absolute;color:#fecdd3;font-size:20px;pointer-events:none;animation:burst .9s ease-out forwards;z-index:5}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.2) rotate(50deg);opacity:0}}
</style>
</head>
<body>
<div class="tag">20 · 爱心爆发按钮</div>
<div class="stage"><button class="btn">超喜欢 ♥</button></div>
<p class="hint">点击按钮试试</p>
<script>
var b=document.querySelector('.btn');
b.addEventListener('click',function(e){var r=b.getBoundingClientRect();
for(var i=0;i<12;i++){var s=document.createElement('span');s.className='h';s.textContent='♥';
var a=Math.random()*6.283,d=50+Math.random()*70;
s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');
s.style.left=(e.clientX-r.left-10)+'px';s.style.top=(e.clientY-r.top-10)+'px';
b.appendChild(s);(function(el){setTimeout(function(){el.remove()},950)})(s);}});
</script>
</body>
</html>
