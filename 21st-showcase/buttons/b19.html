<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>19 · 加载变体按钮</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{min-height:100vh;background:#0e1116;color:#f1f5f9;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overflow-x:hidden;padding:24px 16px}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#8b93a3;letter-spacing:.08em;z-index:50}
.stage{position:relative;width:100%;max-width:430px;min-height:52vh;display:flex;align-items:center;justify-content:center}
.btn{position:relative;border:0;cursor:pointer;font-size:17px;font-weight:700;color:#fff;padding:16px 42px;border-radius:14px;font-family:inherit;overflow:hidden;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.btn:active{filter:brightness(1.25)}
.hint{margin-top:18px;color:#5b6474;font-size:13px;min-height:20px;text-align:center}
.btn{background:linear-gradient(135deg,#3b82f6,#1d4ed8);min-width:220px}
.btn.loading{color:transparent;pointer-events:none}
.btn.loading::after{content:"";position:absolute;width:22px;height:22px;top:50%;left:50%;margin:-11px 0 0 -11px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.btn.done{background:linear-gradient(135deg,#16a34a,#15803d)}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="tag">19 · 加载变体按钮</div>
<div class="stage"><button class="btn">提交订单</button></div>
<p class="hint">点击按钮试试</p>
<script>
var b=document.querySelector('.btn');
b.addEventListener('click',function(){if(b.classList.contains('loading'))return;b.classList.add('loading');
setTimeout(function(){b.classList.remove('loading');b.classList.add('done');b.textContent='提交成功 ✓';
setTimeout(function(){b.classList.remove('done');b.textContent='提交订单';},1400);},1700);});
</script>
</body>
</html>
