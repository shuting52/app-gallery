<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>12 · 双层滑动按钮</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{min-height:100vh;background:#0e1116;color:#f1f5f9;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overflow-x:hidden;padding:24px 16px}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#8b93a3;letter-spacing:.08em;z-index:50}
.stage{position:relative;width:100%;max-width:430px;min-height:52vh;display:flex;align-items:center;justify-content:center}
.btn{position:relative;border:0;cursor:pointer;font-size:17px;font-weight:700;color:#fff;padding:16px 42px;border-radius:14px;font-family:inherit;overflow:hidden;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.btn:active{filter:brightness(1.25)}
.hint{margin-top:18px;color:#5b6474;font-size:13px;min-height:20px;text-align:center}
.btn{background:#e11d48;padding:0}
.mask{display:block;height:58px;overflow:hidden;padding:16px 42px}
.in{display:block;height:26px;line-height:26px}
.in.b{color:#fecdd3}
</style>
</head>
<body>
<div class="tag">12 · 双层滑动按钮</div>
<div class="stage"><button class="btn"><span class="mask"><span class="in">立即报名</span><span class="in b">抢占名额 →</span></span></button></div>
<p class="hint">点击按钮试试</p>
<script>
var b=document.querySelector('.btn'),ins=b.querySelectorAll('.in'),up=false;
b.addEventListener('click',function(){up=!up;ins.forEach(function(s){s.style.animation=up?'slideup .45s forwards':'slidedn .45s forwards'});});
var st=document.createElement('style');st.textContent='@keyframes slideup{to{transform:translateY(-26px)}}@keyframes slidedn{from{transform:translateY(-26px)}to{transform:none}}';document.head.appendChild(st);
</script>
</body>
</html>
