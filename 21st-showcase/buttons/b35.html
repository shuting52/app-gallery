<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>35 · 3D倾斜按钮</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{min-height:100vh;background:#0e1116;color:#f1f5f9;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overflow-x:hidden;padding:24px 16px}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#8b93a3;letter-spacing:.08em;z-index:50}
.stage{position:relative;width:100%;max-width:430px;min-height:52vh;display:flex;align-items:center;justify-content:center}
.btn{position:relative;border:0;cursor:pointer;font-size:17px;font-weight:700;color:#fff;padding:16px 42px;border-radius:14px;font-family:inherit;overflow:hidden;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.btn:active{filter:brightness(1.25)}
.hint{margin-top:18px;color:#5b6474;font-size:13px;min-height:20px;text-align:center}
.btn{background:linear-gradient(135deg,#6366f1,#8b5cf6);overflow:visible;will-change:transform;box-shadow:0 14px 30px rgba(99,102,241,.35)}
</style>
</head>
<body>
<div class="tag">35 · 3D倾斜按钮</div>
<div class="stage"><button class="btn">立体触感</button></div>
<p class="hint">点击按钮试试</p>
<script>
var b=document.querySelector('.btn'),s=document.querySelector('.stage'),tx=0,ty=0,cx=0,cy=0;
function loop(){cx+=(tx-cx)*.14;cy+=(ty-cy)*.14;b.style.transform='perspective(600px) rotateX('+cy+'deg) rotateY('+cx+'deg)';requestAnimationFrame(loop)}
loop();
s.addEventListener('mousemove',function(e){var r=b.getBoundingClientRect();tx=((e.clientX-r.left)/r.width-.5)*24;ty=-((e.clientY-r.top)/r.height-.5)*24;});
s.addEventListener('mouseleave',function(){tx=0;ty=0;});
</script>
</body>
</html>
