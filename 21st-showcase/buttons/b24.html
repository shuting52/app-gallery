<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>24 · 追光高光按钮</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{min-height:100vh;background:#0e1116;color:#f1f5f9;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overflow-x:hidden;padding:24px 16px}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#8b93a3;letter-spacing:.08em;z-index:50}
.stage{position:relative;width:100%;max-width:430px;min-height:52vh;display:flex;align-items:center;justify-content:center}
.btn{position:relative;border:0;cursor:pointer;font-size:17px;font-weight:700;color:#fff;padding:16px 42px;border-radius:14px;font-family:inherit;overflow:hidden;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.btn:active{filter:brightness(1.25)}
.hint{margin-top:18px;color:#5b6474;font-size:13px;min-height:20px;text-align:center}
.btn{background:#1e293b;border:1px solid #475569}
.btn::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(148,197,255,.35),transparent 55%);opacity:0;transition:opacity .3s;pointer-events:none}
.btn:hover::before{opacity:1}
</style>
</head>
<body>
<div class="tag">24 · 追光高光按钮</div>
<div class="stage"><button class="btn">预约演示</button></div>
<p class="hint">点击按钮试试</p>
<script>
var b=document.querySelector('.btn'),tx=50,ty=50,cx=50,cy=50;
function loop(){cx+=(tx-cx)*.2;cy+=(ty-cy)*.2;b.style.setProperty('--mx',cx+'%');b.style.setProperty('--my',cy+'%');requestAnimationFrame(loop)}
loop();
b.addEventListener('mousemove',function(e){var r=b.getBoundingClientRect();tx=(e.clientX-r.left)/r.width*100;ty=(e.clientY-r.top)/r.height*100;});
</script>
</body>
</html>
