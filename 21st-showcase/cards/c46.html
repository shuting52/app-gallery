<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>46 · 数字滚动统计</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0b0e14;color:#e8edf5;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;align-items:center;justify-content:center;padding:28px 14px}
.tag{position:fixed;top:10px;left:12px;font-size:12px;color:#8b93a7;letter-spacing:.06em;z-index:50}
.stage{width:100%;max-width:380px}
.card{background:#141a26;border:1px solid #232c3f;border-radius:18px;overflow:hidden;position:relative}
.pic{height:150px}
.card h3{font-size:17px;padding:16px 18px 6px}
.card p{font-size:13px;color:#9aa4b8;padding:0 18px 18px;line-height:1.7}
.g1{background:linear-gradient(135deg,#5b8cff,#9b5bff)}
.g2{background:linear-gradient(135deg,#22e0ff,#2b6cff)}
.g3{background:linear-gradient(135deg,#ff8a5b,#ff5b8c)}
.g4{background:linear-gradient(135deg,#3ddc84,#22b8e0)}
.g5{background:linear-gradient(135deg,#b45bff,#5b8cff)}
.g6{background:linear-gradient(135deg,#ffd166,#ff7a5b)}
.stats{display:flex;gap:8px;padding:6px 18px 20px}.stat{flex:1;text-align:center;background:#1a2233;border-radius:12px;padding:12px 4px}.stat b{font-size:22px;color:#6ea8ff;display:block}.stat span{font-size:11px;color:#8b93a7}
</style></head><body><div class="tag">46 · 数字滚动统计</div><div class="stage"><div class="card"><div class="pic g2"></div><h3>跑步月报</h3><p>数字从 0 开始滚动到目标值。</p><div class="stats"><div class="stat"><b data-n="128">0</b><span>公里</span></div><div class="stat"><b data-n="24">0</b><span>次跑步</span></div><div class="stat"><b data-n="96">0</b><span>平均心率</span></div></div></div></div><script>document.querySelectorAll('.stat b').forEach(b=>{const t=+b.dataset.n,st=performance.now();(function f(n){const p=Math.min(1,(n-st)/1400);b.textContent=Math.round(t*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(st)});</script></body></html>
