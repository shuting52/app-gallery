<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>37 · 自动旋转木马</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0b0e14;color:#e8edf5;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;align-items:center;justify-content:center;padding:28px 14px}
.tag{position:fixed;top:10px;left:12px;font-size:12px;color:#8b93a7;letter-spacing:.06em;z-index:50}
.stage{width:100%;max-width:380px}
.card{background:#141a26;border:1px solid #232c3f;border-radius:18px;overflow:hidden;position:relative}
.pic{height:150px}
.card h3{font-size:17px;padding:16px 18px 6px}
.card p{font-size:13px;color:#9aa4b8;padding:0 18px 18px;line-height:1.7}
.g1{background:linear-gradient(135deg,#5b8cff,#9b5bff)}
.g2{background:linear-gradient(135deg,#22e0ff,#2b6cff)}
.g3{background:linear-gradient(135deg,#ff8a5b,#ff5b8c)}
.g4{background:linear-gradient(135deg,#3ddc84,#22b8e0)}
.g5{background:linear-gradient(135deg,#b45bff,#5b8cff)}
.g6{background:linear-gradient(135deg,#ffd166,#ff7a5b)}
.car{position:relative;height:250px;overflow:hidden}.car .card{position:absolute;inset:0;transition:transform .6s cubic-bezier(.3,.7,.3,1),opacity .6s}.car .card .pic{height:100px}.dots{text-align:center;padding:12px 0 16px}.dots i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2a3550;margin:0 4px;transition:background .3s}.dots i.on{background:#6ea8ff}
</style></head><body><div class="tag">37 · 自动旋转木马</div><div class="stage"><div class="card" style="overflow:hidden"><div class="car"><div class="card"><div class="pic g1"></div><h3>春季新品</h3><p>樱花粉外套，轻盈防风。</p></div><div class="card"><div class="pic g3"></div><h3>夏季新品</h3><p>冰丝防晒衣，透气凉爽。</p></div><div class="card"><div class="pic g6"></div><h3>秋季新品</h3><p>羊毛开衫，温暖软糯。</p></div></div><div class="dots"><i class="on"></i><i></i><i></i></div></div></div><script>const cs=[...document.querySelectorAll('.car .card')],ds=[...document.querySelectorAll('.dots i')];let n=0;function go(){cs.forEach((c,i)=>{const o=(i-n+3)%3;c.style.transform=`translateX(${(o-1)*104}%)`;c.style.opacity=o===1?0:1});ds.forEach((d,i)=>d.classList.toggle('on',i===n))}go();setInterval(()=>{n=(n+1)%3;go()},2800);</script></body></html>
