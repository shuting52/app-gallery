<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>33 · 点击 3D 翻牌</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0b0e14;color:#e8edf5;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;align-items:center;justify-content:center;padding:28px 14px}
.tag{position:fixed;top:10px;left:12px;font-size:12px;color:#8b93a7;letter-spacing:.06em;z-index:50}
.stage{width:100%;max-width:380px}
.card{background:#141a26;border:1px solid #232c3f;border-radius:18px;overflow:hidden;position:relative}
.pic{height:150px}
.card h3{font-size:17px;padding:16px 18px 6px}
.card p{font-size:13px;color:#9aa4b8;padding:0 18px 18px;line-height:1.7}
.g1{background:linear-gradient(135deg,#5b8cff,#9b5bff)}
.g2{background:linear-gradient(135deg,#22e0ff,#2b6cff)}
.g3{background:linear-gradient(135deg,#ff8a5b,#ff5b8c)}
.g4{background:linear-gradient(135deg,#3ddc84,#22b8e0)}
.g5{background:linear-gradient(135deg,#b45bff,#5b8cff)}
.g6{background:linear-gradient(135deg,#ffd166,#ff7a5b)}
.flip{perspective:1000px;height:330px;position:relative;cursor:pointer}.fin{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.4,1)}.flip.on .fin{transform:rotateY(180deg)}.ffront,.fback{backface-visibility:hidden;-webkit-backface-visibility:hidden}.fback{position:absolute;inset:0;transform:rotateY(180deg);display:flex;flex-direction:column;justify-content:center;background:linear-gradient(135deg,#123,#1a2f1a)}.hint{font-size:12px;color:#6b7590;text-align:center;margin-top:10px}
</style></head><body><div class="tag">33 · 点击 3D 翻牌</div><div class="stage"><div><div class="flip"><div class="fin"><div class="card ffront"><div class="pic g6"></div><h3>今日运势牌</h3><p>点击翻牌，看看今天的幸运物。</p></div><div class="card fback"><h3>幸运物：雨伞</h3><p>今日宜出行，记得带伞，好运会像雨点一样落下来。</p></div></div></div><div class="hint">点击卡片翻面</div></div></div><script>document.querySelector('.flip').onclick=function(){this.classList.toggle('on')};</script></body></html>
