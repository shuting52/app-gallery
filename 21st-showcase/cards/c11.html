<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>11 · 点击展开详情</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0b0e14;color:#e8edf5;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;align-items:center;justify-content:center;padding:28px 14px}
.tag{position:fixed;top:10px;left:12px;font-size:12px;color:#8b93a7;letter-spacing:.06em;z-index:50}
.stage{width:100%;max-width:380px}
.card{background:#141a26;border:1px solid #232c3f;border-radius:18px;overflow:hidden;position:relative}
.pic{height:150px}
.card h3{font-size:17px;padding:16px 18px 6px}
.card p{font-size:13px;color:#9aa4b8;padding:0 18px 18px;line-height:1.7}
.g1{background:linear-gradient(135deg,#5b8cff,#9b5bff)}
.g2{background:linear-gradient(135deg,#22e0ff,#2b6cff)}
.g3{background:linear-gradient(135deg,#ff8a5b,#ff5b8c)}
.g4{background:linear-gradient(135deg,#3ddc84,#22b8e0)}
.g5{background:linear-gradient(135deg,#b45bff,#5b8cff)}
.g6{background:linear-gradient(135deg,#ffd166,#ff7a5b)}
.extra{max-height:0;overflow:hidden;transition:max-height .45s ease}.card.open .extra{max-height:220px}.btn{display:inline-block;margin:0 18px 16px;padding:8px 18px;border-radius:20px;background:#24314d;color:#cfe0ff;font-size:13px;border:1px solid #33415f;cursor:pointer}
</style></head><body><div class="tag">11 · 点击展开详情</div><div class="stage"><div class="card"><div class="pic g6"></div><h3>咖啡品鉴入门</h3><p>点击按钮展开完整风味轮与冲泡参数。</p><div class="extra"><p>浅烘埃塞俄比亚：柑橘、茉莉、花香；水温 92°C，粉水比 1:15，闷蒸 30 秒。</p></div><span class="btn">展开详情</span></div></div><script>document.querySelector('.btn').onclick=e=>{document.querySelector('.card').classList.toggle('open');e.target.textContent=document.querySelector('.card').classList.contains('open')?'收起':'展开详情'};</script></body></html>
