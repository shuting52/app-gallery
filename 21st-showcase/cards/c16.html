<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>16 · 粒子环绕</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0b0e14;color:#e8edf5;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;align-items:center;justify-content:center;padding:28px 14px}
.tag{position:fixed;top:10px;left:12px;font-size:12px;color:#8b93a7;letter-spacing:.06em;z-index:50}
.stage{width:100%;max-width:380px}
.card{background:#141a26;border:1px solid #232c3f;border-radius:18px;overflow:hidden;position:relative}
.pic{height:150px}
.card h3{font-size:17px;padding:16px 18px 6px}
.card p{font-size:13px;color:#9aa4b8;padding:0 18px 18px;line-height:1.7}
.g1{background:linear-gradient(135deg,#5b8cff,#9b5bff)}
.g2{background:linear-gradient(135deg,#22e0ff,#2b6cff)}
.g3{background:linear-gradient(135deg,#ff8a5b,#ff5b8c)}
.g4{background:linear-gradient(135deg,#3ddc84,#22b8e0)}
.g5{background:linear-gradient(135deg,#b45bff,#5b8cff)}
.g6{background:linear-gradient(135deg,#ffd166,#ff7a5b)}
.sky{position:relative;height:150px;overflow:hidden;background:linear-gradient(180deg,#0c1226,#141b36);border-radius:18px 18px 0 0}.orb{position:absolute;top:50%;left:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:#8fd8ff;box-shadow:0 0 10px #8fd8ff;animation:orb 4.5s linear infinite}.orb:nth-child(2){--r:52px;animation-duration:3.2s;background:#c49fff;box-shadow:0 0 10px #c49fff}.orb:nth-child(3){--r:66px;animation-duration:5.6s;animation-direction:reverse;background:#ffd166;box-shadow:0 0 10px #ffd166}.orb:nth-child(1){--r:40px}@keyframes orb{from{transform:rotate(0) translateX(var(--r))}to{transform:rotate(360deg) translateX(var(--r))}}.core{position:absolute;top:50%;left:50%;width:34px;height:34px;margin:-17px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#5b8cff)}
</style></head><body><div class="tag">16 · 粒子环绕</div><div class="stage"><div class="card"><div class="sky"><span class="orb"></span><span class="orb"></span><span class="orb"></span><span class="core"></span></div><h3>行星观测夜</h3><p>三颗卫星环绕行星，轨道各不相同。</p></div></div><script></script></body></html>
