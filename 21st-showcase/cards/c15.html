<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>15 · 斜切滑动</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0b0e14;color:#e8edf5;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;align-items:center;justify-content:center;padding:28px 14px}
.tag{position:fixed;top:10px;left:12px;font-size:12px;color:#8b93a7;letter-spacing:.06em;z-index:50}
.stage{width:100%;max-width:380px}
.card{background:#141a26;border:1px solid #232c3f;border-radius:18px;overflow:hidden;position:relative}
.pic{height:150px}
.card h3{font-size:17px;padding:16px 18px 6px}
.card p{font-size:13px;color:#9aa4b8;padding:0 18px 18px;line-height:1.7}
.g1{background:linear-gradient(135deg,#5b8cff,#9b5bff)}
.g2{background:linear-gradient(135deg,#22e0ff,#2b6cff)}
.g3{background:linear-gradient(135deg,#ff8a5b,#ff5b8c)}
.g4{background:linear-gradient(135deg,#3ddc84,#22b8e0)}
.g5{background:linear-gradient(135deg,#b45bff,#5b8cff)}
.g6{background:linear-gradient(135deg,#ffd166,#ff7a5b)}
.wipe{position:absolute;inset:-10% -30%;background:linear-gradient(135deg,#232f4a,#161d2e);transform:skewX(-14deg) scaleX(1);transform-origin:left;transition:transform .65s cubic-bezier(.4,0,.2,1);z-index:2}.card:hover .wipe{transform:skewX(-14deg) scaleX(0)}.zin{position:relative;z-index:1}
</style></head><body><div class="tag">15 · 斜切滑动</div><div class="stage"><div class="card"><div class="wipe"></div><div class="zin"><div class="pic g1"></div><h3>极简收纳术</h3><p>悬停时斜切面板滑开，露出收纳前后对比。</p></div></div></div><script></script></body></html>
