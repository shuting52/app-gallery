<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>04 · 新拟态按压开关</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#e8ebf2;font-family:system-ui,-apple-system,sans-serif}
.corner{position:fixed;top:14px;left:16px;font-size:12px;color:#9aa3bd;letter-spacing:1px;z-index:9}
.demo{display:flex;flex-direction:column;align-items:center;gap:26px;padding:32px}
.sw{cursor:pointer;display:block}
.sw input{display:none}
.track{width:96px;height:52px;border-radius:26px;background:#e8ebf2;display:block;position:relative;box-shadow:inset 6px 6px 12px #c9cfdc,inset -6px -6px 12px #ffffff;transition:box-shadow .3s}
.knob{width:42px;height:42px;border-radius:50%;background:#e8ebf2;position:absolute;top:5px;left:5px;box-shadow:5px 5px 10px #c3c9d8,-5px -5px 10px #ffffff;transition:transform .35s cubic-bezier(.34,1.3,.64,1),box-shadow .3s}
.sw input:checked+.track{box-shadow:inset 4px 4px 10px #b9d8c4,inset -4px -4px 10px #eafff2;background:#dff3e6}
.sw input:checked+.track .knob{transform:translateX(44px);box-shadow:inset 4px 4px 8px #c3c9d8,inset -4px -4px 8px #ffffff;background:#d3e8dc}
.state{font-size:15px;color:#5b6488;min-height:22px;letter-spacing:2px}
.tag{font-size:13px;color:#9aa3bd}
</style>
</head>
<body>
<div class="corner">04 · 新拟态按压开关</div>
<div class="demo">
  <label class="sw"><input type="checkbox" id="t"><span class="track"><span class="knob"></span></span></label>
  <div class="state" id="st">已关闭</div>
  <div class="tag">用途：护眼模式开关</div>
</div>
<script>
var t=document.getElementById('t'),st=document.getElementById('st');
t.addEventListener('change',function(){st.textContent=t.checked?'已开启':'已关闭';});
</script>
</body>
</html>
