<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>01 · 经典滑动开关</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1222;font-family:system-ui,-apple-system,sans-serif}
.corner{position:fixed;top:14px;left:16px;font-size:12px;color:#8b93b0;letter-spacing:1px;z-index:9}
.demo{display:flex;flex-direction:column;align-items:center;gap:26px;padding:32px}
.sw{cursor:pointer;display:block}
.sw input{display:none}
.track{width:88px;height:46px;border-radius:23px;background:#3a4060;display:block;position:relative;transition:background .35s ease;box-shadow:inset 0 2px 6px rgba(0,0,0,.35)}
.knob{width:38px;height:38px;border-radius:50%;background:#fff;position:absolute;top:4px;left:4px;transition:transform .35s cubic-bezier(.34,1.2,.64,1);box-shadow:0 3px 8px rgba(0,0,0,.35)}
.sw input:checked+.track{background:#34c759}
.sw input:checked+.track .knob{transform:translateX(42px)}
.state{font-size:15px;color:#c9d1ea;min-height:22px;letter-spacing:2px}
.tag{font-size:13px;color:#7c86a8}
</style>
</head>
<body>
<div class="corner">01 · 经典滑动开关</div>
<div class="demo">
  <label class="sw"><input type="checkbox" id="t"><span class="track"><span class="knob"></span></span></label>
  <div class="state" id="st">已关闭</div>
  <div class="tag">用途：消息通知开关</div>
</div>
<script>
var t=document.getElementById('t'),st=document.getElementById('st');
t.addEventListener('change',function(){st.textContent=t.checked?'已开启':'已关闭';});
</script>
</body>
</html>
