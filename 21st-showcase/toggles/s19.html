<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>19 · 弹簧压缩开关</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#eef2f7;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden}
.t{position:fixed;top:14px;left:16px;font-size:13px;color:#939dac;letter-spacing:1px}
.card{display:flex;flex-direction:column;align-items:center;gap:22px;padding:44px 40px}
.sw{position:relative;width:190px;height:64px;cursor:pointer}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:5}
.track{position:absolute;inset:0;border-radius:32px;background:#dce3ec;box-shadow:inset 0 3px 8px rgba(110,125,145,.35)}
.wall{position:absolute;left:12px;top:12px;bottom:12px;width:10px;border-radius:5px;background:#9aa6b8;box-shadow:inset 0 2px 4px rgba(60,70,85,.5)}
.spring{position:absolute;left:26px;top:50%;width:64px;height:26px;margin-top:-13px}
.spring svg{width:100%;height:100%;display:block}
.knob{position:absolute;top:7px;left:96px;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#93a5bd 75%);box-shadow:0 3px 10px rgba(80,95,115,.45)}
.spring.goR{animation:sprR .55s ease-out forwards}
.spring.goL{animation:sprL .55s ease-out forwards}
.knob.goR{animation:knobR .55s ease-out forwards}
.knob.goL{animation:knobL .55s ease-out forwards}
@keyframes sprR{0%{width:64px}22%{width:30px}55%{width:82px}78%{width:60px}100%{width:66px}}
@keyframes sprL{0%{width:66px}22%{width:100px}55%{width:46px}78%{width:70px}100%{width:64px}}
@keyframes knobR{0%{left:96px}22%{left:62px}55%{left:114px}78%{left:92px}100%{left:98px}}
@keyframes knobL{0%{left:98px}22%{left:132px}55%{left:78px}78%{left:102px}100%{left:96px}}
.tag{font-size:14px;color:#5a6575;text-align:center;line-height:1.7}
.tag b{color:#4a6fa5;font-weight:600}
</style>
</head>
<body>
<div class="t">19 · 弹簧压缩开关</div>
<div class="card">
<label class="sw">
<input type="checkbox" id="ck" aria-label="弹簧压缩开关">
<span class="track"></span><span class="wall"></span>
<span class="spring" id="spr"><svg viewBox="0 0 64 26" preserveAspectRatio="none"><path d="M2 13 L10 3 L18 23 L26 3 L34 23 L42 3 L50 23 L58 3 L62 13" fill="none" stroke="#5b6b82" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span class="knob" id="knob"></span>
</label>
<div class="tag"><b>用途：弹簧蓄力弹射开关</b><br>弹簧先压缩蓄力，再把旋钮弹射出去</div>
</div>
<script>
(function(){
var ck=document.getElementById('ck'),spr=document.getElementById('spr'),knob=document.getElementById('knob');
ck.addEventListener('change',function(){
[spr,knob].forEach(function(el){el.classList.remove('goR','goL');});
void spr.offsetWidth;
var c=ck.checked?'goR':'goL';spr.classList.add(c);knob.classList.add(c);
});
})();
</script>
</body>
</html>
