<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>13 · 旋转拨轮开关</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f1ea;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden}
.t{position:fixed;top:14px;left:16px;font-size:13px;color:#9a917f;letter-spacing:1px}
.card{display:flex;flex-direction:column;align-items:center;gap:20px;padding:44px 40px}
.dial-wrap{position:relative;width:120px;height:120px;cursor:pointer}
.dial-wrap input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:5}
.ticks{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(rgba(90,80,60,.45) 0 2deg,transparent 2deg 30deg);-webkit-mask:radial-gradient(circle,transparent 58%,#000 59%);mask:radial-gradient(circle,transparent 58%,#000 59%)}
.wheel{position:absolute;inset:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffdf7,#e6dfcf 75%);box-shadow:0 6px 18px rgba(120,100,70,.35),inset 0 2px 5px rgba(255,255,255,.9);transition:transform .5s cubic-bezier(.45,1.7,.5,1)}
.ptr{position:absolute;left:50%;top:8px;width:6px;height:26px;margin-left:-3px;border-radius:3px;background:#e0653a;box-shadow:0 0 8px rgba(224,101,58,.7)}
.hub{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#8a7f68}
.dial-wrap input:checked~.wheel{transform:rotate(180deg)}
.lbl{position:absolute;top:50%;margin-top:-9px;font-size:13px;font-weight:700;color:#b3a88f}
.lbl.off{left:-34px}.lbl.on{right:-30px}
.dial-wrap input:checked~.lbl.on{color:#e0653a}
.dial-wrap input:not(:checked)~.lbl.off{color:#5c5545}
.tag{font-size:14px;color:#6e6656;text-align:center;line-height:1.7}
.tag b{color:#e0653a;font-weight:600}
</style>
</head>
<body>
<div class="t">13 · 旋转拨轮开关</div>
<div class="card">
<label class="dial-wrap">
<input type="checkbox" aria-label="旋转拨轮开关">
<span class="ticks"></span>
<span class="wheel"><span class="ptr"></span><span class="hub"></span></span>
<span class="lbl off">关</span><span class="lbl on">开</span>
</label>
<div class="tag"><b>用途：档位式模式拨轮</b><br>点击拨轮旋转 180°，指针指向刻度开/关</div>
</div>
</body>
</html>
