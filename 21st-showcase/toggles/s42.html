<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>42 · 卫星入轨开关</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:18px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.8}
.hint b{color:#ffd23f;font-weight:600}
.ck{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.cap{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:12px;color:#9fb2e8;letter-spacing:.1em;pointer-events:none}
.cap .o2{display:none}
.sw42{position:relative;display:block;width:210px;height:240px;background:#0b1226;border:1px solid #243056;border-radius:20px;cursor:pointer;overflow:hidden}
.planet{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);font-size:48px;filter:saturate(.35) brightness(.8);transition:filter .5s}
.orbit{position:absolute;left:50%;top:54%;width:158px;height:158px;transform:translate(-50%,-50%);border:2px dashed #3a4a75;border-radius:50%;transition:border-color .5s,box-shadow .5s}
.arm{position:absolute;left:50%;top:54%;width:158px;height:158px;transform:translate(-50%,-50%);animation:spin 2.8s linear infinite;animation-play-state:paused}
.sat{position:absolute;left:50%;top:-8px;transform:translateX(-50%);width:15px;height:15px;border-radius:50%;background:#7fd4ff;box-shadow:0 0 0 4px rgba(127,212,255,.15)}
.sat::after{content:"";position:absolute;right:12px;top:50%;transform:translateY(-50%);width:26px;height:6px;border-radius:6px;background:linear-gradient(90deg,transparent,rgba(127,212,255,.7))}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
#t42:checked+.sw42 .arm{animation-play-state:running}
#t42:checked+.sw42 .orbit{border-color:#7fd4ff;box-shadow:0 0 20px rgba(127,212,255,.4),inset 0 0 20px rgba(127,212,255,.12)}
#t42:checked+.sw42 .planet{filter:none;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-56%)}}</style></head><body>
<div class="tag">42 · 卫星入轨开关</div>
<div class="stage"><input type="checkbox" id="t42" class="ck"><label for="t42" class="sw42"><span class="planet">🌍</span><span class="orbit"></span><span class="arm"><i class="sat"></i></span><span class="cap"><b class="o1">定位关闭</b><b class="o2">已入轨 · 定位开启</b></span></label><div class="hint">用途：GPS 定位服务<br>点击开关切换试试</div></div>
<style>#t42:checked+label .o1{display:none}#t42:checked+label .o2{display:inline}</style>
</body></html>
