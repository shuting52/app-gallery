<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>22 · 百叶窗开关</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0b0e14;color:#e8ecf4;font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;min-height:100vh;overflow:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7d8699;letter-spacing:2px}
.cap{font-size:13px;color:#98a1b3;letter-spacing:1px}
.use{font-size:13px;color:#7d8699;border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 16px;background:rgba(255,255,255,.03)}
.hid{position:absolute;opacity:0;pointer-events:none}
.shut{position:relative;width:200px;height:240px;border:10px solid #39415a;border-radius:14px;overflow:hidden;cursor:pointer;background:#0a0d15;display:block;perspective:600px}
.back{position:absolute;inset:0;background:linear-gradient(180deg,#ffd98a 0%,#ff9d4d 55%,#b45f16 100%);opacity:.22;transition:opacity .6s}
#sw:checked+.shut .back{opacity:1}
.back::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 18px,rgba(255,255,255,.35) 18px 27px);opacity:0;transition:opacity .6s}
#sw:checked+.shut .back::after{opacity:1;animation:rayMove 2.2s linear infinite}
@keyframes rayMove{to{background-position:64px 0}}
.slats{position:absolute;inset:6px}
.slats i{display:block;height:30px;margin:4px 0;border-radius:5px;background:linear-gradient(180deg,#efe6d2 0%,#d9c9a8 55%,#b39a6d 100%);box-shadow:0 2px 5px rgba(0,0,0,.35);transform:rotateX(0deg);transform-origin:center;transition:transform .7s cubic-bezier(.5,0,.25,1)}
.slats i:nth-child(1){transition-delay:0s}.slats i:nth-child(2){transition-delay:.06s}
.slats i:nth-child(3){transition-delay:.12s}.slats i:nth-child(4){transition-delay:.18s}
.slats i:nth-child(5){transition-delay:.24s}.slats i:nth-child(6){transition-delay:.3s}
#sw:checked+.shut .slats i{transform:rotateX(66deg)}
.st{font-size:14px;color:#dfe5f0;letter-spacing:1px}
.st .a{display:none;color:#ffd98a}
#sw:checked~.st .a{display:inline}
#sw:checked~.st .b{display:none}</style></head>
<body>
<div class="tag">22 · 百叶窗开关</div>
<input type="checkbox" id="sw" class="hid">
<label for="sw" class="shut">
<div class="back"></div>
<div class="slats"><i></i><i></i><i></i><i></i><i></i><i></i></div>
</label>
<div class="st"><span class="a">叶片张开 · 阳光进来</span><span class="b">叶片闭合 · 遮光休息</span></div>
<p class="cap">点按百叶窗，翻转叶片</p>
<p class="use">用途：客厅遮光帘开关</p>
</body></html>
