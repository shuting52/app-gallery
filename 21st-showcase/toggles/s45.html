<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>45 · 钥匙开锁开关</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:18px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.8}
.hint b{color:#ffd23f;font-weight:600}
.ck{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.cap{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:12px;color:#9fb2e8;letter-spacing:.1em;pointer-events:none}
.cap .o2{display:none}
.sw45{position:relative;display:block;width:210px;height:250px;background:linear-gradient(180deg,#131b33,#0b1226);border:1px solid #243056;border-radius:20px;cursor:pointer;overflow:hidden}
.lock{position:absolute;left:50%;top:78px;transform:translateX(-50%)}
.sh{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);width:46px;height:42px;border:10px solid #9aa5c7;border-bottom:0;border-radius:24px 24px 0 0;transform-origin:left bottom;transition:transform .45s ease .55s}
.bd{position:relative;display:block;width:80px;height:66px;background:linear-gradient(#3d4a73,#28314f);border-radius:16px;transition:box-shadow .4s}
.kh{position:absolute;left:50%;top:16px;transform:translateX(-50%);width:15px;height:15px;border-radius:50%;background:#0b1226}
.kh::after{content:"";position:absolute;left:50%;top:13px;transform:translateX(-50%);width:9px;height:20px;background:#0b1226;border-radius:4px}
.key{position:absolute;left:50%;top:172px;transform:translateX(-50%);width:11px;height:46px;background:linear-gradient(90deg,#e8b93f,#ffd76b,#e8b93f);border-radius:6px;transition:top .45s ease,transform .4s ease .5s}
.key::before{content:"";position:absolute;left:50%;top:100%;margin-top:2px;transform:translateX(-50%);width:28px;height:28px;border:9px solid #ffd76b;border-radius:50%}
.key i{position:absolute;right:-9px;top:10px;width:11px;height:9px;background:#ffd76b;border-radius:0 3px 3px 0;box-shadow:0 14px 0 #ffd76b}
#t45:checked+.sw45 .key{top:118px;transform:translateX(-50%) rotate(35deg);transform-origin:50% 0}
#t45:checked+.sw45 .sh{transform:translateX(-50%) rotate(-30deg);border-color:#7fe08a}
#t45:checked+.sw45 .bd{box-shadow:0 0 22px rgba(127,224,138,.5);animation:unlockGlow 1.8s ease-in-out infinite}
@keyframes unlockGlow{0%,100%{box-shadow:0 0 20px rgba(127,224,138,.5)}50%{box-shadow:0 0 36px rgba(127,224,138,.9)}}</style></head><body>
<div class="tag">45 · 钥匙开锁开关</div>
<div class="stage"><input type="checkbox" id="t45" class="ck"><label for="t45" class="sw45"><span class="lock"><i class="sh"></i><b class="bd"><u class="kh"></u></b></span><span class="key"><i></i></span><span class="cap"><b class="o1">已锁定</b><b class="o2">已解锁</b></span></label><div class="hint">用途：屏幕锁定<br>点击开关切换试试</div></div>
<style>#t45:checked+label .o1{display:none}#t45:checked+label .o2{display:inline}</style>
</body></html>
