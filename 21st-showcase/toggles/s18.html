<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>18 · 钟摆摇摆开关</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f2efe9;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden}
.t{position:fixed;top:14px;left:16px;font-size:13px;color:#a09a8a;letter-spacing:1px}
.card{display:flex;flex-direction:column;align-items:center;gap:20px;padding:44px 40px}
.sw{position:relative;width:190px;height:150px;cursor:pointer}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:5}
.case{position:absolute;inset:0;border-radius:22px;background:linear-gradient(#fffdf8,#ece5d5);box-shadow:0 8px 24px rgba(140,120,90,.28),inset 0 2px 6px rgba(255,255,255,.9)}
.pivot{position:absolute;left:50%;top:16px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#6b6152;box-shadow:inset 0 2px 3px rgba(0,0,0,.4);z-index:3}
.pend{position:absolute;left:50%;top:22px;width:0;height:0;transform-origin:0 0;transform:rotate(-26deg);z-index:2}
.pend.goR{animation:swingR 1s ease-out forwards}
.pend.goL{animation:swingL 1s ease-out forwards}
.rod{position:absolute;left:-3px;top:0;width:6px;height:52px;border-radius:3px;background:linear-gradient(90deg,#8a7f68,#c9bfa8)}
.bob{position:absolute;left:-21px;top:52px;width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9b0,#d4a017 70%);box-shadow:0 4px 12px rgba(160,120,20,.5)}
@keyframes swingR{0%{transform:rotate(-26deg)}25%{transform:rotate(40deg)}45%{transform:rotate(18deg)}62%{transform:rotate(32deg)}78%{transform:rotate(23deg)}90%{transform:rotate(28deg)}100%{transform:rotate(26deg)}}
@keyframes swingL{0%{transform:rotate(26deg)}25%{transform:rotate(-40deg)}45%{transform:rotate(-18deg)}62%{transform:rotate(-32deg)}78%{transform:rotate(-23deg)}90%{transform:rotate(-28deg)}100%{transform:rotate(-26deg)}}
.side{position:absolute;bottom:12px;font-size:13px;font-weight:700;color:#b3a88f}
.side.off{left:26px}.side.on{right:26px}
.tag{font-size:14px;color:#6e6656;text-align:center;line-height:1.7}
.tag b{color:#b8860b;font-weight:600}
</style>
</head>
<body>
<div class="t">18 · 钟摆摇摆开关</div>
<div class="card">
<label class="sw">
<input type="checkbox" id="ck" aria-label="钟摆摇摆开关">
<span class="case"></span>
<span class="pend" id="pend"><span class="rod"></span><span class="bob"></span></span>
<span class="pivot"></span>
<span class="side off">关</span><span class="side on">开</span>
</label>
<div class="tag"><b>用途：复古钟摆定时开关</b><br>切换时摆锤左右摇摆数次后定住</div>
</div>
<script>
(function(){
var ck=document.getElementById('ck'),pend=document.getElementById('pend');
ck.addEventListener('change',function(){
pend.classList.remove('goR','goL');void pend.offsetWidth;
pend.classList.add(ck.checked?'goR':'goL');
});
})();
</script>
</body>
</html>
