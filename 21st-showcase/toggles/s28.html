<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>28 · 硬币翻转开关</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0b0e14;color:#e8ecf4;font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;min-height:100vh;overflow:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7d8699;letter-spacing:2px}
.cap{font-size:13px;color:#98a1b3;letter-spacing:1px}
.use{font-size:13px;color:#7d8699;border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 16px;background:rgba(255,255,255,.03)}
.hid{position:absolute;opacity:0;pointer-events:none}
.coinbtn{cursor:pointer;display:block;perspective:520px;padding:34px 60px 10px}
.coin{width:110px;height:110px;position:relative;transform-style:preserve-3d}
#sw:checked+.coinbtn .coin{animation:flipOn 1.3s cubic-bezier(.3,.6,.4,1) forwards}
#sw:not(:checked)+.coinbtn .coin{animation:flipOff 1.3s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes flipOn{0%{transform:translateY(0) rotateY(180deg)}45%{transform:translateY(-110px) rotateY(900deg)}100%{transform:translateY(0) rotateY(1440deg)}}
@keyframes flipOff{0%{transform:translateY(0) rotateY(0)}45%{transform:translateY(-110px) rotateY(720deg)}100%{transform:translateY(0) rotateY(1260deg)}}
.cf{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:800}
.heads{background:radial-gradient(circle at 35% 30%,#fff0b8,#e8b93e 55%,#9c7412);color:#7a5410;box-shadow:inset 0 0 0 6px rgba(122,84,16,.35),0 8px 20px rgba(0,0,0,.5)}
.tails{background:radial-gradient(circle at 35% 30%,#f4f7fb,#b9c2d4 55%,#6e7688);color:#454c5e;transform:rotateY(180deg);box-shadow:inset 0 0 0 6px rgba(69,76,94,.3),0 8px 20px rgba(0,0,0,.5)}
.shdw{width:96px;height:14px;margin:14px auto 0;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(4px)}
#sw:checked+.coinbtn .shdw{animation:shdwA 1.3s ease-out}
#sw:not(:checked)+.coinbtn .shdw{animation:shdwA 1.3s ease-out}
@keyframes shdwA{0%,100%{transform:scaleX(1);opacity:1}45%{transform:scaleX(.55);opacity:.5}}
.st{font-size:14px;color:#dfe5f0;letter-spacing:1px}
.st .a{display:none;color:#ffd98a}
#sw:checked~.st .a{display:inline}
#sw:checked~.st .b{display:none}</style></head>
<body>
<div class="tag">28 · 硬币翻转开关</div>
<input type="checkbox" id="sw" class="hid">
<label for="sw" class="coinbtn">
<div class="coin"><div class="cf heads">正</div><div class="cf tails">反</div></div>
<div class="shdw"></div>
</label>
<div class="st"><span class="a">正面朝上 · 幸运开</span><span class="b">反面朝上 · 冷静关</span></div>
<p class="cap">点按硬币，抛向空中</p>
<p class="use">用途：抛硬币决策开关</p>
</body></html>
