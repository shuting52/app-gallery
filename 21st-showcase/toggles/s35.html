<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>35 · 灯泡点亮开关</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:#0f172a;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;max-width:430px;margin:0 auto;position:relative;overflow-x:hidden;padding:70px 24px 50px}
.t{position:absolute;top:14px;left:16px;font-size:13px;color:#64748b;letter-spacing:2px}
.u{font-size:14px;color:#94a3b8}
input{display:none}
.stage{cursor:pointer}
.rays{opacity:0;transform-box:fill-box;transform-origin:center;transition:opacity .6s}
.glass{transition:fill .6s}
.fil{transition:stroke .6s}
#sw:checked~.stage .rays{opacity:1;animation:rayrot 14s linear infinite}
#sw:checked~.stage .glass{fill:#fde68a;filter:drop-shadow(0 0 28px rgba(251,191,36,.95))}
#sw:checked~.stage .fil{stroke:#f59e0b}
@keyframes rayrot{to{transform:rotate(360deg)}}
.ctl{display:flex;align-items:center;gap:10px}
.sw{width:62px;height:34px;border-radius:17px;background:#334155;position:relative;cursor:pointer;transition:background .3s;flex:none}
.knob{position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.4);transition:left .35s cubic-bezier(.55,-.3,.3,1.4)}
#sw:checked~.ctl .sw{background:#f59e0b}
#sw:checked~.ctl .sw .knob{left:31px}
.st{font-size:13px;color:#64748b;width:34px}
.st::before{content:"关"}
#sw:checked~.ctl .st::before{content:"开";color:#fbbf24}
</style></head><body>
<input type="checkbox" id="sw">
<div class="t">35 · 灯泡点亮开关</div>
<label class="stage" for="sw">
<svg viewBox="0 0 130 180" width="150" height="208">
<line x1="65" y1="0" x2="65" y2="20" stroke="#64748b" stroke-width="4"/>
<g class="rays" stroke="#fbbf24" stroke-width="4" stroke-linecap="round">
<line x1="113" y1="66" x2="125" y2="66"/><line x1="98.9" y1="32.1" x2="107.4" y2="23.6"/>
<line x1="65" y1="18" x2="65" y2="6"/><line x1="31.1" y1="32.1" x2="22.6" y2="23.6"/>
<line x1="17" y1="66" x2="5" y2="66"/><line x1="31.1" y1="99.9" x2="22.6" y2="108.4"/>
<line x1="65" y1="114" x2="65" y2="126"/><line x1="98.9" y1="99.9" x2="107.4" y2="108.4"/>
</g>
<circle class="glass" cx="65" cy="66" r="40" fill="#334155"/>
<path class="fil" d="M52 66 L58 86 L72 86 L78 66" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
<rect x="50" y="104" width="30" height="10" rx="3" fill="#94a3b8"/>
<rect x="53" y="116" width="24" height="8" rx="3" fill="#64748b"/>
<rect x="57" y="126" width="16" height="8" rx="3" fill="#475569"/>
</svg></label>
<div class="ctl"><label class="sw" for="sw"><span class="knob"></span></label><span class="st"></span></div>
<p class="u">用途：夜间照明开关</p>
</body></html>
