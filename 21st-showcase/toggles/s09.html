<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>09 · 三段选择开关</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#121826;font-family:system-ui,-apple-system,sans-serif}
.corner{position:fixed;top:14px;left:16px;font-size:12px;color:#8b93b0;letter-spacing:1px;z-index:9}
.demo{display:flex;flex-direction:column;align-items:center;gap:26px;padding:32px}
.seg{width:264px;height:60px;border-radius:30px;background:#232a40;position:relative;display:flex;box-shadow:inset 0 2px 8px rgba(0,0,0,.35)}
.opt{flex:1;display:flex;align-items:center;justify-content:center;font-size:15px;color:#8b93b0;cursor:pointer;z-index:2;transition:color .3s;letter-spacing:2px}
.opt.act{color:#fff;font-weight:600}
.slider{position:absolute;top:5px;bottom:5px;left:5px;width:calc(33.333% - 3.4px);border-radius:25px;background:#3d4468;transition:left .35s cubic-bezier(.34,1.3,.64,1),background .35s;z-index:1}
.state{font-size:15px;color:#c9d1ea;min-height:22px;letter-spacing:2px}
.tag{font-size:13px;color:#7c86a8}
</style>
</head>
<body>
<div class="corner">09 · 三段选择开关</div>
<div class="demo">
  <div class="seg" id="seg" role="radiogroup">
    <div class="slider" id="sl"></div>
    <div class="opt act" data-i="0">关</div>
    <div class="opt" data-i="1">中</div>
    <div class="opt" data-i="2">开</div>
  </div>
  <div class="state" id="st">当前档位：关</div>
  <div class="tag">用途：风扇三档风速开关</div>
</div>
<script>
(function(){
var opts=document.querySelectorAll('.opt'),sl=document.getElementById('sl'),st=document.getElementById('st');
var names=['关','中','开'],colors=['#3d4468','#3b82f6','#34c759'];
opts.forEach(function(o){
  o.addEventListener('click',function(){
    var i=+o.dataset.i;
    opts.forEach(function(x){x.classList.remove('act');});
    o.classList.add('act');
    sl.style.left='calc('+(i*33.333)+'% + 5px)';
    sl.style.background=colors[i];
    st.textContent='当前档位：'+names[i];
  });
});
})();
</script>
</body>
</html>
