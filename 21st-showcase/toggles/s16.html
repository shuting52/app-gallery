<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>16 · 波纹涟漪开关</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#eef7f4;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden}
.t{position:fixed;top:14px;left:16px;font-size:13px;color:#8aa79d;letter-spacing:1px}
.card{display:flex;flex-direction:column;align-items:center;gap:22px;padding:44px 40px}
.sw{position:relative;width:132px;height:64px;cursor:pointer}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:6}
.track{position:absolute;inset:0;border-radius:32px;background:#d3e7df;box-shadow:inset 0 3px 8px rgba(80,140,120,.3);transition:background .4s}
.sw input:checked~.track{background:#bfe3cf}
.knob{position:absolute;top:7px;left:7px;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#9fd4b8 75%);box-shadow:0 3px 10px rgba(60,130,100,.4);transition:left .38s cubic-bezier(.5,1.4,.5,1);z-index:3}
.sw input:checked~.knob{left:75px}
.ripple{position:absolute;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;border:3px solid #34a87a;pointer-events:none;z-index:4;animation:ripple .75s ease-out forwards}
@keyframes ripple{0%{transform:scale(.5);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.tag{font-size:14px;color:#4f6b60;text-align:center;line-height:1.7}
.tag b{color:#1f9d63;font-weight:600}
</style>
</head>
<body>
<div class="t">16 · 波纹涟漪开关</div>
<div class="card">
<label class="sw" id="sw">
<input type="checkbox" id="ck" aria-label="波纹涟漪开关">
<span class="track"></span><span class="knob" id="knob"></span>
</label>
<div class="tag"><b>用途：水面涟漪提醒开关</b><br>点击时从旋钮荡开一圈涟漪波纹</div>
</div>
<script>
(function(){
var sw=document.getElementById('sw'),ck=document.getElementById('ck'),knob=document.getElementById('knob');
ck.addEventListener('change',function(){
var kr=knob.getBoundingClientRect(),sr=sw.getBoundingClientRect();
var r=document.createElement('span');r.className='ripple';
r.style.left=(kr.left-sr.left+kr.width/2)+'px';
r.style.top=(kr.top-sr.top+kr.height/2)+'px';
sw.appendChild(r);setTimeout(function(){r.remove();},800);
});
})();
</script>
</body>
</html>
