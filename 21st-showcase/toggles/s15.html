<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>15 · 粒子爆裂开关</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f6eefb;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden}
.t{position:fixed;top:14px;left:16px;font-size:13px;color:#a894b8;letter-spacing:1px}
.card{display:flex;flex-direction:column;align-items:center;gap:22px;padding:44px 40px}
.sw{position:relative;width:132px;height:64px;cursor:pointer}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:6}
.track{position:absolute;inset:0;border-radius:32px;background:#e3d7ee;box-shadow:inset 0 3px 8px rgba(140,110,170,.3);transition:background .4s}
.sw input:checked~.track{background:#d9c8f2}
.knob{position:absolute;top:7px;left:7px;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#b79fe0 75%);box-shadow:0 3px 10px rgba(120,90,160,.45);transition:left .35s cubic-bezier(.5,1.5,.5,1)}
.sw input:checked~.knob{left:75px}
.p{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:4;transition:transform .65s cubic-bezier(.15,.7,.4,1),opacity .65s ease}
.tag{font-size:14px;color:#6d5b7d;text-align:center;line-height:1.7}
.tag b{color:#8b5cf6;font-weight:600}
</style>
</head>
<body>
<div class="t">15 · 粒子爆裂开关</div>
<div class="card">
<label class="sw" id="sw">
<input type="checkbox" id="ck" aria-label="粒子爆裂开关">
<span class="track"></span><span class="knob" id="knob"></span>
</label>
<div class="tag"><b>用途：庆祝式确认开关</b><br>每次切换都从旋钮炸出一簇彩色粒子</div>
</div>
<script>
(function(){
var sw=document.getElementById('sw'),ck=document.getElementById('ck'),knob=document.getElementById('knob');
var colors=['#8b5cf6','#ec4899','#f59e0b','#22d3ee','#a3e635'];
ck.addEventListener('change',function(){
var kr=knob.getBoundingClientRect(),sr=sw.getBoundingClientRect();
var cx=kr.left-sr.left+kr.width/2,cy=kr.top-sr.top+kr.height/2;
for(var i=0;i<14;i++){
var s=document.createElement('span');s.className='p';
s.style.background=colors[i%colors.length];
s.style.left=(cx-4)+'px';s.style.top=(cy-4)+'px';
sw.appendChild(s);
var a=Math.random()*Math.PI*2,d=34+Math.random()*44;
requestAnimationFrame((function(el,dx,dy){return function(){
el.style.transform='translate('+dx+'px,'+dy+'px) scale(.2)';el.style.opacity='0';
};})(s,Math.cos(a)*d,Math.sin(a)*d));
setTimeout((function(el){return function(){el.remove();};})(s),700);
}
});
})();
</script>
</body>
</html>
