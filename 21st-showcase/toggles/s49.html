<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>49 · 叶子生长开关</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:18px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.8}
.hint b{color:#ffd23f;font-weight:600}
.ck{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.cap{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:12px;color:#9fb2e8;letter-spacing:.1em;pointer-events:none}
.cap .o2{display:none}
.sw49{position:relative;display:block;width:210px;height:250px;background:linear-gradient(180deg,#0e1a2e,#0b1226);border:1px solid #243056;border-radius:20px;cursor:pointer;overflow:hidden}
.pot{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);width:96px;height:56px;background:linear-gradient(#b0703f,#8a5228);border-radius:10px 10px 18px 18px;box-shadow:inset 0 6px 0 rgba(0,0,0,.25)}
.stem{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);width:9px;height:0;background:linear-gradient(#46b863,#2c7a40);border-radius:5px;transition:height .8s ease;transform-origin:bottom}
.lf{position:absolute;width:38px;height:23px;background:linear-gradient(135deg,#9df09a,#3fae5a);border-radius:60% 6px 60% 6px;transform:scale(0) rotate(var(--r));transition:transform .45s cubic-bezier(.5,1.7,.4,1)}
.l1{left:-36px;top:16px;--r:-32deg;transition-delay:.55s}
.l2{right:-36px;top:44px;--r:32deg;transition-delay:.75s}
.l3{left:-36px;top:72px;--r:-32deg;transition-delay:.95s}
.bud{position:absolute;left:50%;top:-14px;transform:translateX(-50%) scale(0);width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffc4d4,#ff5b8c);transition:transform .45s cubic-bezier(.5,1.7,.4,1) 1.15s;box-shadow:0 0 12px rgba(255,91,140,.6)}
#t49:checked+.sw49 .stem{height:118px;animation:sway 3.2s ease-in-out 1s infinite}
@keyframes sway{0%,100%{transform:translateX(-50%) rotate(-2.5deg)}50%{transform:translateX(-50%) rotate(2.5deg)}}
#t49:checked+.sw49 .lf{transform:scale(1) rotate(var(--r))}
#t49:checked+.sw49 .bud{transform:translateX(-50%) scale(1)}</style></head><body>
<div class="tag">49 · 叶子生长开关</div>
<div class="stage"><input type="checkbox" id="t49" class="ck"><label for="t49" class="sw49"><span class="pot"></span><span class="stem"><i class="lf l1"></i><i class="lf l2"></i><i class="lf l3"></i><b class="bud"></b></span><span class="cap"><b class="o1">休眠</b><b class="o2">生长 · 绿意盎然</b></span></label><div class="hint">用途：节能护眼模式<br>点击开关切换试试</div></div>
<style>#t49:checked+label .o1{display:none}#t49:checked+label .o2{display:inline}</style>
</body></html>
