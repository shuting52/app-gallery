<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>32 · 指针扫动开关</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:#f8fafc;color:#1e293b;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;max-width:430px;margin:0 auto;position:relative;overflow-x:hidden;padding:70px 24px 50px}
.t{position:absolute;top:14px;left:16px;font-size:13px;color:#94a3b8;letter-spacing:2px}
.u{font-size:14px;color:#64748b}
input{display:none}
.stage{cursor:pointer}
.needle{transform-origin:100px 102px;transform:rotate(-90deg);transition:transform 1.1s cubic-bezier(.3,1.5,.5,1)}
#sw:checked~.stage .needle{transform:rotate(90deg)}
.arc{transition:stroke-dashoffset 1.1s ease}
#sw:checked~.stage .arc{stroke-dashoffset:0}
.ctl{display:flex;align-items:center;gap:10px}
.sw{width:62px;height:34px;border-radius:17px;background:#cbd5e1;position:relative;cursor:pointer;transition:background .3s;flex:none}
.knob{position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:left .35s cubic-bezier(.55,-.3,.3,1.4)}
#sw:checked~.ctl .sw{background:#f59e0b}
#sw:checked~.ctl .sw .knob{left:31px}
.st{font-size:13px;color:#94a3b8;width:34px}
.st::before{content:"关"}
#sw:checked~.ctl .st::before{content:"开";color:#d97706}
</style></head><body>
<input type="checkbox" id="sw">
<div class="t">32 · 指针扫动开关</div>
<label class="stage" for="sw">
<svg viewBox="0 0 200 124" width="240" height="149">
<path d="M22 102 A78 78 0 0 1 178 102" fill="none" stroke="#e2e8f0" stroke-width="12" stroke-linecap="round"/>
<path class="arc" d="M22 102 A78 78 0 0 1 178 102" fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" stroke-dasharray="245" stroke-dashoffset="245"/>
<g stroke="#94a3b8" stroke-width="2" stroke-linecap="round">
<line x1="22" y1="102" x2="30" y2="102"/>
<line x1="44.9" y1="46.9" x2="53.3" y2="55.3"/>
<line x1="100" y1="24" x2="100" y2="36"/>
<line x1="155.1" y1="46.9" x2="146.7" y2="55.3"/>
<line x1="178" y1="102" x2="170" y2="102"/>
</g>
<g class="needle">
<line x1="100" y1="102" x2="100" y2="42" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
<circle cx="100" cy="102" r="9" fill="#334155"/><circle cx="100" cy="102" r="3.5" fill="#f8fafc"/>
</g>
<text x="22" y="122" font-size="11" fill="#94a3b8" text-anchor="middle">节能</text>
<text x="178" y="122" font-size="11" fill="#94a3b8" text-anchor="middle">性能</text>
</svg></label>
<div class="ctl"><label class="sw" for="sw"><span class="knob"></span></label><span class="st"></span></div>
<p class="u">用途：性能模式开关</p>
</body></html>
