<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>41 · 火箭发射开关</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:18px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.8}
.hint b{color:#ffd23f;font-weight:600}
.ck{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.cap{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:12px;color:#9fb2e8;letter-spacing:.1em;pointer-events:none}
.cap .o2{display:none}
.sw41{position:relative;display:block;width:210px;height:240px;background:linear-gradient(180deg,#070d24,#14245c 70%,#1d3268);border:1px solid #2a3a6e;border-radius:20px;overflow:hidden;cursor:pointer}
.stars{position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 24px 34px,#fff,transparent),radial-gradient(1px 1px at 70px 90px,#fff,transparent),radial-gradient(2px 2px at 130px 44px,#fff,transparent),radial-gradient(1px 1px at 178px 110px,#fff,transparent),radial-gradient(1.5px 1.5px at 100px 150px,#cfe0ff,transparent);animation:tw 2.4s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.35}to{opacity:1}}
.pad{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:96px;height:10px;background:#3a4668;border-radius:5px}
.ship{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);transition:transform 1.4s cubic-bezier(.45,.05,.7,.4)}
.rk{font-size:44px;display:block;transform:rotate(-45deg);filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.flame{position:absolute;left:50%;top:100%;margin-top:-6px;width:16px;height:0;background:linear-gradient(#fff,#ffd23f 40%,#ff7b2f 75%,transparent);border-radius:0 0 50% 50%;filter:blur(1px);transform:translateX(-50%)}
.trail i{position:absolute;left:50%;bottom:34px;width:7px;height:7px;margin-left:-3px;border-radius:50%;background:#ffd23f;opacity:0}
.trail i:nth-child(2){background:#ff9b3f}.trail i:nth-child(3){background:#fff}.trail i:nth-child(4){background:#ff7b2f}
#t41:checked+.sw41 .ship{transform:translate(-50%,-132px)}
#t41:checked+.sw41 .flame{height:30px;animation:fl .16s ease-in-out infinite alternate}
@keyframes fl{from{transform:translateX(-50%) scaleY(1) scaleX(1)}to{transform:translateX(-50%) scaleY(1.4) scaleX(.75)}}
#t41:checked+.sw41 .trail i{animation:rise .9s ease-out infinite}
#t41:checked+.sw41 .trail i:nth-child(2){animation-delay:.22s}#t41:checked+.sw41 .trail i:nth-child(3){animation-delay:.45s}#t41:checked+.sw41 .trail i:nth-child(4){animation-delay:.68s}
@keyframes rise{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(-14px,-80px) scale(.25)}}
#t41:checked+.sw41 .pad{animation:jolt .5s ease}
@keyframes jolt{20%{transform:translateX(-52%)}45%{transform:translateX(-48%)}70%{transform:translateX(-51%)}}</style></head><body>
<div class="tag">41 · 火箭发射开关</div>
<div class="stage"><input type="checkbox" id="t41" class="ck"><label for="t41" class="sw41"><span class="stars"></span><span class="trail"><i></i><i></i><i></i><i></i></span><span class="ship"><span class="flame"></span><span class="rk">🚀</span></span><span class="pad"></span><span class="cap"><b class="o1">待机</b><b class="o2">点火升空</b></span></label><div class="hint">用途：飞行模式 / 一键发射<br>点击开关切换试试</div></div>
<style>#t41:checked+label .o1{display:none}#t41:checked+label .o2{display:inline}</style>
</body></html>
