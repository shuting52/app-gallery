<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>07 · 描边点亮开关</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0e1226;font-family:system-ui,-apple-system,sans-serif}
.corner{position:fixed;top:14px;left:16px;font-size:12px;color:#8b93b0;letter-spacing:1px;z-index:9}
.demo{display:flex;flex-direction:column;align-items:center;gap:26px;padding:32px}
.sw{cursor:pointer;display:block;position:relative;width:96px;height:96px}
.sw input{display:none}
.ring{width:96px;height:96px;transform:rotate(-90deg)}
.ring .bg{fill:none;stroke:#2c3352;stroke-width:6}
.ring .fg{fill:none;stroke:#00e5ff;stroke-width:6;stroke-linecap:round;stroke-dasharray:283;stroke-dashoffset:283;transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)}
.sw input:checked~.ring .fg{stroke-dashoffset:0}
.dot{position:absolute;top:50%;left:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#2c3352;transition:background .4s .3s,box-shadow .4s .3s}
.sw input:checked~.dot{background:#00e5ff;box-shadow:0 0 24px 6px rgba(0,229,255,.55)}
.state{font-size:15px;color:#c9d1ea;min-height:22px;letter-spacing:2px}
.tag{font-size:13px;color:#7c86a8}
</style>
</head>
<body>
<div class="corner">07 · 描边点亮开关</div>
<div class="demo">
  <label class="sw"><input type="checkbox" id="t">
    <svg class="ring" viewBox="0 0 96 96"><circle class="bg" cx="48" cy="48" r="45"/><circle class="fg" cx="48" cy="48" r="45"/></svg>
    <span class="dot"></span>
  </label>
  <div class="state" id="st">已关闭</div>
  <div class="tag">用途：定位服务开关</div>
</div>
<script>
var t=document.getElementById('t'),st=document.getElementById('st');
t.addEventListener('change',function(){st.textContent=t.checked?'已开启':'已关闭';});
</script>
</body>
</html>
