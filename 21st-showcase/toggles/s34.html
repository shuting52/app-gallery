<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>34 · 音量推子开关</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:#f8fafc;color:#1e293b;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;max-width:430px;margin:0 auto;position:relative;overflow-x:hidden;padding:70px 24px 50px}
.t{position:absolute;top:14px;left:16px;font-size:13px;color:#94a3b8;letter-spacing:2px}
.u{font-size:14px;color:#64748b}
input{display:none}
.ch{display:flex;gap:16px;align-items:flex-end;cursor:pointer}
.track{width:48px;height:216px;background:#1e293b;border-radius:10px;position:relative;box-shadow:inset 0 2px 8px rgba(0,0,0,.55)}
.slot{position:absolute;left:50%;top:16px;bottom:16px;width:6px;transform:translateX(-50%);background:#0f172a;border-radius:3px}
.fader{position:absolute;left:5px;right:5px;top:160px;height:38px;background:linear-gradient(#f8fafc,#cbd5e1);border-radius:7px;box-shadow:0 2px 6px rgba(0,0,0,.45);transition:top .55s cubic-bezier(.5,1.7,.4,1)}
.fader::after{content:"";position:absolute;left:7px;right:7px;top:17px;height:4px;background:#ef4444;border-radius:2px}
#sw:checked~.stage .fader{top:16px}
.leds{display:flex;flex-direction:column-reverse;gap:6px}
.led{width:30px;height:14px;border-radius:3px;background:#0f172a;transition:background .2s,box-shadow .2s;transition-delay:var(--d)}
#sw:checked~.stage .led:nth-child(-n+5){background:#22c55e;box-shadow:0 0 9px #22c55e}
#sw:checked~.stage .led:nth-child(n+6):nth-child(-n+7){background:#f59e0b;box-shadow:0 0 9px #f59e0b}
#sw:checked~.stage .led:nth-child(8){background:#ef4444;box-shadow:0 0 9px #ef4444}
.ctl{display:flex;align-items:center;gap:10px}
.sw{width:62px;height:34px;border-radius:17px;background:#cbd5e1;position:relative;cursor:pointer;transition:background .3s;flex:none}
.knob{position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:left .35s cubic-bezier(.55,-.3,.3,1.4)}
#sw:checked~.ctl .sw{background:#22c55e}
#sw:checked~.ctl .sw .knob{left:31px}
.st{font-size:13px;color:#94a3b8;width:34px}
.st::before{content:"关"}
#sw:checked~.ctl .st::before{content:"开";color:#16a34a}
</style></head><body>
<input type="checkbox" id="sw">
<div class="t">34 · 音量推子开关</div>
<label class="stage" for="sw">
<div class="ch">
<div class="track"><div class="slot"></div><div class="fader"></div></div>
<div class="leds">
<span class="led" style="--d:0s"></span><span class="led" style="--d:.05s"></span>
<span class="led" style="--d:.1s"></span><span class="led" style="--d:.15s"></span>
<span class="led" style="--d:.2s"></span><span class="led" style="--d:.25s"></span>
<span class="led" style="--d:.3s"></span><span class="led" style="--d:.35s"></span>
</div>
</div></label>
<div class="ctl"><label class="sw" for="sw"><span class="knob"></span></label><span class="st"></span></div>
<p class="u">用途：音量增强开关</p>
</body></html>
