<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>48 · 雪花凝结开关</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:18px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.8}
.hint b{color:#ffd23f;font-weight:600}
.ck{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.cap{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:12px;color:#9fb2e8;letter-spacing:.1em;pointer-events:none}
.cap .o2{display:none}
.sw48{position:relative;display:block;width:210px;height:240px;background:radial-gradient(circle at 50% 40%,#16224a,#0b1226 75%);border:1px solid #243056;border-radius:20px;cursor:pointer;overflow:hidden}
.drop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:52px;transition:transform .35s ease,opacity .35s;filter:drop-shadow(0 6px 10px rgba(91,184,255,.4))}
.fw{position:absolute;left:50%;top:50%;width:120px;height:120px;transform:translate(-50%,-50%)}
.flake{width:100%;height:100%;transform:scale(0) rotate(-90deg);opacity:0;filter:drop-shadow(0 0 12px rgba(160,220,255,.8));transition:transform .7s cubic-bezier(.4,1.5,.5,1),opacity .4s}
.frost i{position:absolute;width:5px;height:5px;border-radius:50%;background:#cfeaff;opacity:0}
.frost i:nth-child(1){left:30%;top:28%}.frost i:nth-child(2){left:68%;top:34%}.frost i:nth-child(3){left:60%;top:70%}
.frost i:nth-child(4){left:36%;top:66%}.frost i:nth-child(5){left:50%;top:20%}
#t48:checked+.sw48 .drop{transform:translate(-50%,-50%) scale(0);opacity:0}
#t48:checked+.sw48 .flake{transform:scale(1) rotate(0deg);opacity:1}
#t48:checked+.sw48 .fw{animation:spinF 14s linear infinite}
@keyframes spinF{to{transform:translate(-50%,-50%) rotate(360deg)}}
#t48:checked+.sw48 .frost i{animation:tw2 1.8s ease-in-out infinite alternate}
#t48:checked+.sw48 .frost i:nth-child(2){animation-delay:.4s}#t48:checked+.sw48 .frost i:nth-child(3){animation-delay:.8s}
#t48:checked+.sw48 .frost i:nth-child(4){animation-delay:1.2s}#t48:checked+.sw48 .frost i:nth-child(5){animation-delay:.2s}
@keyframes tw2{from{opacity:.15;transform:scale(.7)}to{opacity:1;transform:scale(1.25)}}</style></head><body>
<div class="tag">48 · 雪花凝结开关</div>
<div class="stage"><input type="checkbox" id="t48" class="ck"><label for="t48" class="sw48"><span class="drop">💧</span><span class="fw"><svg class="flake" viewBox="0 0 100 100"><g stroke="#cfeaff" stroke-width="5" stroke-linecap="round"><line x1="50" y1="12" x2="50" y2="88"/><line x1="50" y1="12" x2="50" y2="88" transform="rotate(60 50 50)"/><line x1="50" y1="12" x2="50" y2="88" transform="rotate(120 50 50)"/></g><g stroke="#cfeaff" stroke-width="3" stroke-linecap="round"><line x1="50" y1="24" x2="40" y2="32"/><line x1="50" y1="24" x2="60" y2="32"/><line x1="50" y1="76" x2="40" y2="68"/><line x1="50" y1="76" x2="60" y2="68"/></g><circle cx="50" cy="50" r="7" fill="#eaf7ff"/></svg></span><span class="frost"><i></i><i></i><i></i><i></i><i></i></span><span class="cap"><b class="o1">常温</b><b class="o2">凝结 · 制冷中</b></span></label><div class="hint">用途：极速制冷<br>点击开关切换试试</div></div>
<style>#t48:checked+label .o1{display:none}#t48:checked+label .o2{display:inline}</style>
</body></html>
