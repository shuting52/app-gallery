<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>43 · 陀螺旋转开关</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:18px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.8}
.hint b{color:#ffd23f;font-weight:600}
.ck{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.cap{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:12px;color:#9fb2e8;letter-spacing:.1em;pointer-events:none}
.cap .o2{display:none}
.sw43{position:relative;display:block;width:210px;height:240px;background:linear-gradient(180deg,#101a30,#0b1226);border:1px solid #243056;border-radius:20px;cursor:pointer;overflow:hidden}
.wob{position:absolute;left:50%;top:44%;width:0;height:0}
.tp{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);width:66px;height:66px;border-radius:50%;background:conic-gradient(from 0deg,#ff5b8c,#ffb35b,#ffe45b,#7fe08a,#5bb8ff,#b48cff,#ff5b8c);animation:spn .7s linear infinite;animation-play-state:paused;box-shadow:inset 0 0 0 6px rgba(255,255,255,.15)}
.tp::after{content:"";position:absolute;left:50%;top:100%;margin-top:-4px;transform:translateX(-50%);border:9px solid transparent;border-top:16px solid #8b93a7}
.stem{position:absolute;left:50%;bottom:100%;margin-bottom:-2px;transform:translateX(-50%);width:9px;height:20px;background:#cfd6ea;border-radius:5px}
.ghost{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);width:66px;height:66px;border-radius:50%;background:conic-gradient(from 40deg,#ff5b8c,#ffb35b,#ffe45b,#7fe08a,#5bb8ff,#b48cff,#ff5b8c);filter:blur(4px);opacity:0;animation:spn .7s linear infinite;animation-delay:-.12s;animation-play-state:paused}
.ghost.g2{animation-delay:-.24s;filter:blur(7px)}
.shd{position:absolute;left:50%;top:44%;margin-top:52px;transform:translateX(-50%);width:80px;height:14px;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(3px);transition:all .4s}
@keyframes spn{to{transform:translate(-50%,-50%) rotate(360deg)}}
#t43:checked+.sw43 .tp,#t43:checked+.sw43 .ghost{animation-play-state:running}
#t43:checked+.sw43 .ghost{opacity:.35}
#t43:checked+.sw43 .wob{animation:wob .45s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
#t43:checked+.sw43 .shd{width:56px;opacity:.6}</style></head><body>
<div class="tag">43 · 陀螺旋转开关</div>
<div class="stage"><input type="checkbox" id="t43" class="ck"><label for="t43" class="sw43"><span class="wob"><span class="ghost"></span><span class="ghost g2"></span><span class="tp"><i class="stem"></i></span></span><span class="shd"></span><span class="cap"><b class="o1">静止</b><b class="o2">高速旋转中</b></span></label><div class="hint">用途：风扇 / 转速挡位<br>点击开关切换试试</div></div>
<style>#t43:checked+label .o1{display:none}#t43:checked+label .o2{display:inline}</style>
</body></html>
