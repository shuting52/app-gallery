<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>44 · 拼图嵌入开关</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:18px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.8}
.hint b{color:#ffd23f;font-weight:600}
.ck{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.cap{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:12px;color:#9fb2e8;letter-spacing:.1em;pointer-events:none}
.cap .o2{display:none}
.sw44{position:relative;display:block;width:230px;height:150px;background:#10182e;border:1px solid #243056;border-radius:18px;cursor:pointer;overflow:hidden}
.sock{position:absolute;right:32px;top:50%;transform:translateY(-50%);width:54px;height:54px;border:3px dashed #4a5a85;border-radius:14px;transition:all .4s}
.pc{position:absolute;left:30px;top:50%;transform:translateY(-50%);width:54px;height:54px;background:linear-gradient(135deg,#ffb35b,#ff7b54);border-radius:14px;transition:left .45s cubic-bezier(.55,0,.3,1.15);box-shadow:0 4px 12px rgba(255,140,80,.35)}
.pc::before{content:"";position:absolute;left:50%;top:-10px;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;background:#ff9a52}
.ring{position:absolute;right:32px;top:50%;width:54px;height:54px;margin:0;border:3px solid #ffd23f;border-radius:14px;transform:translateY(-50%) scale(.4);opacity:0;pointer-events:none}
#t44:checked+.sw44 .pc{left:144px;animation:clack .35s ease .48s}
@keyframes clack{0%{transform:translateY(-50%) scale(1)}40%{transform:translateY(-50%) scale(.86)}70%{transform:translateY(-50%) scale(1.1)}100%{transform:translateY(-50%) scale(1)}}
#t44:checked+.sw44 .sock{border-style:solid;border-color:#7fe08a;box-shadow:0 0 16px rgba(127,224,138,.45)}
#t44:checked+.sw44 .ring{animation:wave .55s ease-out .5s}
@keyframes wave{0%{transform:translateY(-50%) scale(.5);opacity:.95}100%{transform:translateY(-50%) scale(1.7);opacity:0}}</style></head><body>
<div class="tag">44 · 拼图嵌入开关</div>
<div class="stage"><input type="checkbox" id="t44" class="ck"><label for="t44" class="sw44"><span class="sock"></span><span class="pc"></span><span class="ring"></span><span class="cap"><b class="o1">分离</b><b class="o2">咔哒 · 拼合</b></span></label><div class="hint">用途：自动对齐拼合<br>点击开关切换试试</div></div>
<style>#t44:checked+label .o1{display:none}#t44:checked+label .o2{display:inline}</style>
</body></html>
