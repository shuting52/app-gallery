<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>02 · 果冻挤压开关</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#141726;font-family:system-ui,-apple-system,sans-serif}
.corner{position:fixed;top:14px;left:16px;font-size:12px;color:#8b93b0;letter-spacing:1px;z-index:9}
.demo{display:flex;flex-direction:column;align-items:center;gap:26px;padding:32px}
.sw{cursor:pointer;display:block}
.sw input{display:none}
.track{width:92px;height:48px;border-radius:24px;background:#3a4060;display:block;position:relative;transition:background .3s;box-shadow:inset 0 2px 6px rgba(0,0,0,.35)}
.knob{width:40px;height:40px;border-radius:50%;background:linear-gradient(145deg,#fff,#dfe6ff);position:absolute;top:4px;left:4px;box-shadow:0 3px 10px rgba(0,0,0,.4);transition:transform .38s cubic-bezier(.34,1.3,.64,1)}
.sw input:checked+.track{background:#7c5cff}
.sw input:checked+.track .knob{transform:translateX(44px)}
.knob.play{animation:squash .45s ease}
@keyframes squash{
  0%{transform:translateX(var(--from,0)) scale(1,1)}
  30%{transform:translateX(var(--mid,22px)) scale(1.35,.65)}
  55%{transform:translateX(var(--mid,22px)) scale(.8,1.25)}
  75%{transform:translateX(var(--to,0)) scale(1.1,.9)}
  100%{transform:translateX(var(--to,0)) scale(1,1)}
}
.state{font-size:15px;color:#c9d1ea;min-height:22px;letter-spacing:2px}
.tag{font-size:13px;color:#7c86a8}
</style>
</head>
<body>
<div class="corner">02 · 果冻挤压开关</div>
<div class="demo">
  <label class="sw"><input type="checkbox" id="t"><span class="track"><span class="knob" id="k"></span></span></label>
  <div class="state" id="st">已关闭</div>
  <div class="tag">用途：震动反馈开关</div>
</div>
<script>
var t=document.getElementById('t'),k=document.getElementById('k'),st=document.getElementById('st');
t.addEventListener('change',function(){
  st.textContent=t.checked?'已开启':'已关闭';
  var from=t.checked?0:44, to=t.checked?44:0;
  k.style.setProperty('--from',from+'px');
  k.style.setProperty('--to',to+'px');
  k.style.setProperty('--mid',(from+to)/2+'px');
  k.classList.remove('play');void k.offsetWidth;k.classList.add('play');
});
</script>
</body>
</html>
