<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>24 · 推拉门开关</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0b0e14;color:#e8ecf4;font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;min-height:100vh;overflow:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7d8699;letter-spacing:2px}
.cap{font-size:13px;color:#98a1b3;letter-spacing:1px}
.use{font-size:13px;color:#7d8699;border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 16px;background:rgba(255,255,255,.03)}
.hid{position:absolute;opacity:0;pointer-events:none}
.door{position:relative;width:220px;height:240px;border:10px solid #39415a;border-radius:14px;overflow:hidden;cursor:pointer;background:#0a0d15;display:block}
.hall{position:absolute;inset:0;background:radial-gradient(circle at 50% 55%,#fff3c4 0%,#ffc95e 40%,#7a4b12 100%);opacity:.12;transition:opacity .8s}
#sw:checked+.door .hall{opacity:1}
.hall::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 26px,rgba(255,255,255,.4) 26px 38px);opacity:0;transition:opacity .8s}
#sw:checked+.door .hall::after{opacity:1;animation:beamMove 2.4s linear infinite}
@keyframes beamMove{to{background-position:80px 0}}
.pl{position:absolute;top:0;bottom:0;width:50.5%;background:linear-gradient(180deg,#5b6a8a,#3d4763);transition:transform .9s cubic-bezier(.6,0,.25,1);box-shadow:0 0 12px rgba(0,0,0,.4)}
.pl.left{left:0;border-right:3px solid #2b3350}
.pl.right{right:0;border-left:3px solid #2b3350}
#sw:checked+.door .pl.left{transform:translateX(-104%)}
#sw:checked+.door .pl.right{transform:translateX(104%)}
.hd{position:absolute;top:50%;width:8px;height:52px;margin-top:-26px;border-radius:4px;background:#c7cede}
.pl.left .hd{right:10px}.pl.right .hd{left:10px}
.st{font-size:14px;color:#dfe5f0;letter-spacing:1px}
.st .a{display:none;color:#ffd98a}
#sw:checked~.st .a{display:inline}
#sw:checked~.st .b{display:none}</style></head>
<body>
<div class="tag">24 · 推拉门开关</div>
<input type="checkbox" id="sw" class="hid">
<label for="sw" class="door">
<div class="hall"></div>
<div class="pl left"><div class="hd"></div></div>
<div class="pl right"><div class="hd"></div></div>
</label>
<div class="st"><span class="a">门开了 · 迎宾灯亮</span><span class="b">门关了 · 灯灭了</span></div>
<p class="cap">点按房门，左右推开</p>
<p class="use">用途：玄关迎宾灯开关</p>
</body></html>
