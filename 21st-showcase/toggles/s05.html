<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>05 · 昼夜切换开关</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0d1024;font-family:system-ui,-apple-system,sans-serif}
.corner{position:fixed;top:14px;left:16px;font-size:12px;color:#8b93b0;letter-spacing:1px;z-index:9}
.demo{display:flex;flex-direction:column;align-items:center;gap:26px;padding:32px}
.sw{cursor:pointer;display:block}
.sw input{display:none}
.track{width:110px;height:56px;border-radius:28px;display:block;position:relative;overflow:hidden;box-shadow:inset 0 2px 8px rgba(0,0,0,.3)}
.sky{position:absolute;inset:0;transition:opacity .6s ease}
.day{background:linear-gradient(180deg,#6ec6f8,#c8ecff)}
.night{background:linear-gradient(180deg,#0b1035,#233064);opacity:0}
.sw input:checked+.track .night{opacity:1}
.sw input:checked+.track .day{opacity:0}
.knob{width:44px;height:44px;border-radius:50%;position:absolute;top:6px;left:6px;transition:transform .6s cubic-bezier(.34,1.2,.64,1),background .6s;z-index:2}
.sunbg{background:#ffd93b;box-shadow:0 0 16px 4px rgba(255,217,59,.55)}
.sw input:checked+.track .knob{transform:translateX(54px);background:#f4f1de;box-shadow:0 0 14px 3px rgba(244,241,222,.4)}
.crescent{position:absolute;top:-2px;right:-2px;width:40px;height:40px;border-radius:50%;background:#233064;opacity:0;transform:scale(.4);transition:opacity .5s .15s,transform .5s .15s}
.sw input:checked+.track .crescent{opacity:1;transform:scale(1)}
.star{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;opacity:0;transition:opacity .5s;animation:twinkle 2.4s ease-in-out infinite}
.sw input:checked+.track .star{opacity:.9}
.st1{top:12px;left:58px}
.st2{top:30px;left:74px;animation-delay:.7s}
.st3{top:16px;left:90px;animation-delay:1.3s}
@keyframes twinkle{0%,100%{transform:scale(1)}50%{transform:scale(1.7)}}
.state{font-size:15px;color:#c9d1ea;min-height:22px;letter-spacing:2px}
.tag{font-size:13px;color:#7c86a8}
</style>
</head>
<body>
<div class="corner">05 · 昼夜切换开关</div>
<div class="demo">
  <label class="sw"><input type="checkbox" id="t"><span class="track"><span class="sky day"></span><span class="sky night"></span><span class="star st1"></span><span class="star st2"></span><span class="star st3"></span><span class="knob sunbg"><span class="crescent"></span></span></span></label>
  <div class="state" id="st">白天模式</div>
  <div class="tag">用途：深色模式开关</div>
</div>
<script>
var t=document.getElementById('t'),st=document.getElementById('st');
function up(){st.textContent=t.checked?'黑夜模式':'白天模式';}t.addEventListener('change',up);up();
</script>
</body>
</html>
