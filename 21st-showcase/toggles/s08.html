<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>08 · 滑动确认开关</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#181420;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
.corner{position:fixed;top:14px;left:16px;font-size:12px;color:#8b93b0;letter-spacing:1px;z-index:9}
.demo{display:flex;flex-direction:column;align-items:center;gap:26px;padding:32px;width:100%;max-width:430px}
.track{width:280px;height:68px;border-radius:34px;background:#2c2836;position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;box-shadow:inset 0 2px 8px rgba(0,0,0,.4);transition:background .3s}
.track.done{background:#e5484d}
.fill{position:absolute;top:0;left:0;bottom:0;width:0;background:linear-gradient(90deg,rgba(229,72,77,.25),rgba(229,72,77,.55));border-radius:34px}
.knob{width:58px;height:58px;border-radius:50%;background:#fff;position:absolute;top:5px;left:5px;box-shadow:0 4px 12px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:20px;color:#8b93b0;cursor:grab;z-index:2}
.knob:active{cursor:grabbing}
.hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#8b93b0;letter-spacing:2px;padding-left:40px;pointer-events:none;transition:opacity .3s}
.track.done .hint{opacity:0}
.hint-ok{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;letter-spacing:2px;padding-right:50px;opacity:0;pointer-events:none;transition:opacity .3s}
.track.done .hint-ok{opacity:1}
.state{font-size:15px;color:#c9d1ea;min-height:22px;letter-spacing:2px}
.tag{font-size:13px;color:#7c86a8}
</style>
</head>
<body>
<div class="corner">08 · 滑动确认开关</div>
<div class="demo">
  <div class="track" id="track">
    <div class="fill" id="fill"></div>
    <div class="hint" id="hint">向右滑动确认开启 →</div>
    <div class="hint-ok">已确认开启</div>
    <div class="knob" id="knob">▶</div>
  </div>
  <div class="state" id="st">未确认</div>
  <div class="tag">用途：一键清除缓存确认开关</div>
</div>
<script>
(function(){
var track=document.getElementById('track'),knob=document.getElementById('knob'),
    fill=document.getElementById('fill'),st=document.getElementById('st'),
    hint=document.getElementById('hint');
var MAX=280-58-10, on=false, dragging=false, startX=0, baseX=0, x=0;
function render(){knob.style.transform='translateX('+x+'px)';fill.style.width=(x+29)+'px';}
function snap(){
  if(!on&&x>MAX*0.8){on=true;x=MAX;track.classList.add('done');knob.textContent='✕';hint.textContent='';st.textContent='已确认开启';}
  else if(on&&x<MAX*0.2){on=false;x=0;track.classList.remove('done');knob.textContent='▶';st.textContent='未确认';}
  else{x=on?MAX:0;}
  knob.style.transition='transform .3s cubic-bezier(.34,1.3,.64,1)';render();
  setTimeout(function(){knob.style.transition='';},320);
}
knob.addEventListener('pointerdown',function(e){
  dragging=true;startX=e.clientX;baseX=x;knob.setPointerCapture(e.pointerId);e.preventDefault();
});
knob.addEventListener('pointermove',function(e){
  if(!dragging)return;
  x=Math.max(0,Math.min(MAX,baseX+e.clientX-startX));render();
});
knob.addEventListener('pointerup',function(){dragging=false;snap();});
knob.addEventListener('pointercancel',function(){dragging=false;snap();});
render();
})();
</script>
</body>
</html>
