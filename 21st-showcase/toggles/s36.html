<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>36 · 烛光闪烁开关</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:#1c1917;color:#e7e5e4;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;max-width:430px;margin:0 auto;position:relative;overflow-x:hidden;padding:70px 24px 50px}
.t{position:absolute;top:14px;left:16px;font-size:13px;color:#78716c;letter-spacing:2px}
.u{font-size:14px;color:#a8a29e}
input{display:none}
.stage{cursor:pointer}
.candle{position:relative;width:130px;height:235px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.glow{position:absolute;top:-38px;left:50%;transform:translateX(-50%);width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,.5),transparent 70%);opacity:0;transition:opacity .8s}
#sw:checked~.stage .glow{opacity:1;animation:glowp 2.2s ease-in-out infinite}
@keyframes glowp{0%,100%{opacity:.85}50%{opacity:1}}
.fw{height:54px;transform:scale(0);transform-origin:50% 100%;transition:transform .25s ease}
#sw:checked~.stage .fw{transform:scale(1)}
.flame{width:26px;height:50px;margin:0 auto;background:radial-gradient(circle at 50% 78%,#fffbeb 0 16%,#fde68a 36%,#fbbf24 58%,#f97316 80%,rgba(249,115,22,0) 100%);border-radius:50% 50% 50% 50%/62% 62% 38% 38%;transform-origin:50% 100%;animation:flick 1.4s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1,1) skewX(0)}30%{transform:scale(.94,1.07) skewX(-4deg)}55%{transform:scale(1.05,.93) skewX(3deg)}80%{transform:scale(.97,1.04) skewX(-2deg)}}
.wick{width:4px;height:12px;background:#44403c;border-radius:2px}
.wax{width:66px;height:128px;background:linear-gradient(90deg,#fcd34d,#fef3c7 45%,#f59e0b);border-radius:12px 12px 16px 16px;position:relative;box-shadow:inset -8px 0 12px rgba(0,0,0,.1)}
.wax::before{content:"";position:absolute;top:-7px;left:9px;right:9px;height:18px;background:#fef9c3;border-radius:50%}
.drip{position:absolute;top:22px;left:-7px;width:12px;height:30px;background:#fde68a;border-radius:6px}
.plate{width:116px;height:15px;background:linear-gradient(#d6d3d1,#a8a29e);border-radius:50%;margin-top:-5px}
.ctl{display:flex;align-items:center;gap:10px}
.sw{width:62px;height:34px;border-radius:17px;background:#44403c;position:relative;cursor:pointer;transition:background .3s;flex:none}
.knob{position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.4);transition:left .35s cubic-bezier(.55,-.3,.3,1.4)}
#sw:checked~.ctl .sw{background:#f59e0b}
#sw:checked~.ctl .sw .knob{left:31px}
.st{font-size:13px;color:#78716c;width:34px}
.st::before{content:"关"}
#sw:checked~.ctl .st::before{content:"开";color:#fbbf24}
</style></head><body>
<input type="checkbox" id="sw">
<div class="t">36 · 烛光闪烁开关</div>
<label class="stage" for="sw">
<div class="candle">
<div class="glow"></div>
<div class="fw"><div class="flame"></div></div>
<div class="wick"></div>
<div class="wax"><div class="drip"></div></div>
<div class="plate"></div>
</div></label>
<div class="ctl"><label class="sw" for="sw"><span class="knob"></span></label><span class="st"></span></div>
<p class="u">用途：氛围烛光开关</p>
</body></html>
