<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>50 · 彩虹扫光开关</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:18px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.8}
.hint b{color:#ffd23f;font-weight:600}
.ck{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.cap{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:12px;color:#9fb2e8;letter-spacing:.1em;pointer-events:none}
.cap .o2{display:none}
.sw50{position:relative;display:flex;align-items:center;justify-content:center;width:230px;height:170px;background:#10182e;border:1px solid #243056;border-radius:18px;cursor:pointer;overflow:hidden}
.tr{position:relative;width:128px;height:60px;border-radius:999px;background:#232c47;border:1px solid #34406a;overflow:hidden;transition:box-shadow .4s,border-color .4s}
.tr::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#ff5b5b,#ffb35b,#ffe45b,#7fe08a,#5bb8ff,#b48cff,#ff5b5b);background-size:300% 100%;transform:translateX(-102%);transition:transform .5s ease}
.kb{position:absolute;top:6px;left:6px;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#dfe5f5);box-shadow:0 3px 10px rgba(0,0,0,.5);transition:left .38s cubic-bezier(.5,1.4,.4,1);z-index:2}
#t50:checked+.sw50 .tr::before{transform:translateX(0);animation:rbFlow 2.6s linear infinite}
@keyframes rbFlow{to{background-position:300% 0}}
#t50:checked+.sw50 .tr{border-color:#b48cff;box-shadow:0 0 22px rgba(180,140,255,.5)}
#t50:checked+.sw50 .kb{left:74px;box-shadow:0 3px 10px rgba(0,0,0,.5),0 0 14px rgba(255,255,255,.8)}</style></head><body>
<div class="tag">50 · 彩虹扫光开关</div>
<div class="stage"><input type="checkbox" id="t50" class="ck"><label for="t50" class="sw50"><span class="tr"><i class="kb"></i></span><span class="cap"><b class="o1">关灯</b><b class="o2">开灯 · 彩虹流转</b></span></label><div class="hint">用途：氛围灯效<br>点击开关切换试试</div></div>
<style>#t50:checked+label .o1{display:none}#t50:checked+label .o2{display:inline}</style>
</body></html>
