<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>47 · 刀闸合闸开关</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1220;color:#eef2fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:58px 14px 60px;overflow-x:hidden}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#7c86a0;letter-spacing:.08em;z-index:99}
.stage{width:100%;max-width:398px;display:flex;flex-direction:column;gap:18px;align-items:center}
.hint{font-size:12px;color:#7c86a0;text-align:center;line-height:1.8}
.hint b{color:#ffd23f;font-weight:600}
.ck{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.cap{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:12px;color:#9fb2e8;letter-spacing:.1em;pointer-events:none}
.cap .o2{display:none}
.sw47{position:relative;display:block;width:210px;height:250px;background:#10182e;border:1px solid #243056;border-radius:20px;cursor:pointer;overflow:hidden}
.plate{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:126px;height:158px;background:linear-gradient(#2c3249,#1b2135);border:1px solid #3a4668;border-radius:14px}
.contact{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);width:24px;height:24px;border-radius:50%;background:#3a4668;border:4px solid #5a6685;transition:all .3s;z-index:2}
.lever{position:absolute;left:50%;bottom:48px;width:11px;height:118px;margin-left:-5px;background:linear-gradient(90deg,#8b93a7,#cfd6ea,#8b93a7);border-radius:6px;transform-origin:50% 100%;transform:rotate(38deg);transition:transform .28s cubic-bezier(.6,-.35,.4,1.25);z-index:1}
.knob{position:absolute;left:50%;top:-18px;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff9a8a,#c93a2c);box-shadow:0 3px 6px rgba(0,0,0,.5)}
.sparks i{position:absolute;left:50%;bottom:46px;width:6px;height:6px;margin:-3px;border-radius:50%;background:#ffe45b;box-shadow:0 0 8px #ffd23f;opacity:0}
.sparks i:nth-child(1){--x:-34px;--y:-30px}.sparks i:nth-child(2){--x:30px;--y:-38px;background:#fff}
.sparks i:nth-child(3){--x:-22px;--y:-52px}.sparks i:nth-child(4){--x:38px;--y:-14px;background:#ffb35b}
.sparks i:nth-child(5){--x:-40px;--y:-6px}.sparks i:nth-child(6){--x:14px;--y:-58px;background:#fff}
#t47:checked+.sw47 .lever{transform:rotate(0deg)}
#t47:checked+.sw47 .contact{background:#ffd23f;border-color:#ffe45b;box-shadow:0 0 18px #ffd23f,0 0 40px rgba(255,210,63,.5)}
#t47:checked+.sw47 .sparks i{animation:spark .55s ease-out infinite}
#t47:checked+.sw47 .sparks i:nth-child(2){animation-delay:.12s}#t47:checked+.sw47 .sparks i:nth-child(3){animation-delay:.24s}
#t47:checked+.sw47 .sparks i:nth-child(4){animation-delay:.36s}#t47:checked+.sw47 .sparks i:nth-child(5){animation-delay:.18s}
#t47:checked+.sw47 .sparks i:nth-child(6){animation-delay:.3s}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.2)}}
#t47:checked+.sw47 .plate{animation:jolt .3s ease}
@keyframes jolt{25%{transform:translateX(calc(-50% - 3px))}55%{transform:translateX(calc(-50% + 3px))}}</style></head><body>
<div class="tag">47 · 刀闸合闸开关</div>
<div class="stage"><input type="checkbox" id="t47" class="ck"><label for="t47" class="sw47"><span class="plate"></span><span class="contact"></span><span class="sparks"><i></i><i></i><i></i><i></i><i></i><i></i></span><span class="lever"><i class="knob"></i></span><span class="cap"><b class="o1">闸刀断开</b><b class="o2">合闸通电</b></span></label><div class="hint">用途：电源总闸<br>点击开关切换试试</div></div>
<style>#t47:checked+label .o1{display:none}#t47:checked+label .o2{display:inline}</style>
</body></html>
