<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>03 · 故障抖动</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0b0e14;color:#eef2f7;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow-x:hidden}
.tag{position:fixed;top:10px;left:12px;font-size:12px;color:#8b93a5;letter-spacing:.08em;z-index:10}
.stage{width:100%;max-width:430px;padding:28px 20px;text-align:center}
.txt{font-size:30px;font-weight:800;line-height:1.5;letter-spacing:.06em}
.sub{margin-top:14px;font-size:13px;color:#8b93a5;letter-spacing:.2em}
.gl{position:relative;display:inline-block;font-size:30px;font-weight:800;letter-spacing:.06em}
.gl::before,.gl::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;overflow:hidden}
.gl::before{color:#22d3ee;animation:gl1 2.2s infinite steps(2);clip-path:inset(0 0 55% 0)}
.gl::after{color:#f43f5e;animation:gl2 1.7s infinite steps(2);clip-path:inset(60% 0 0 0)}
@keyframes gl1{0%,92%{transform:none;opacity:.85}93%{transform:translate(-6px,2px)}96%{transform:translate(5px,-2px)}100%{transform:none;opacity:.85}}
@keyframes gl2{0%,88%{transform:none;opacity:.85}89%{transform:translate(6px,-1px)}94%{transform:translate(-5px,2px)}100%{transform:none;opacity:.85}}
.gl{animation:jit .35s infinite}
@keyframes jit{0%{transform:translate(0)}25%{transform:translate(1px,-1px)}50%{transform:translate(-1px,1px)}75%{transform:translate(1px,1px)}100%{transform:translate(0)}}
</style></head><body><div class="tag">03 · 故障抖动</div><div class="stage"><div class="txt gl" data-t="信号干扰中……">信号干扰中……</div></div>
<script></script></body></html>
