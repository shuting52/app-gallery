<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>01 · 打字机入场</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0b0e14;color:#eef2f7;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow-x:hidden}
.tag{position:fixed;top:10px;left:12px;font-size:12px;color:#8b93a5;letter-spacing:.08em;z-index:10}
.stage{width:100%;max-width:430px;padding:28px 20px;text-align:center}
.txt{font-size:30px;font-weight:800;line-height:1.5;letter-spacing:.06em}
.sub{margin-top:14px;font-size:13px;color:#8b93a5;letter-spacing:.2em}
#tw{display:inline-block;min-height:1.5em;font-size:30px;font-weight:800;letter-spacing:.06em}
#tw::after{content:"";display:inline-block;width:3px;height:1.1em;background:#7dd3fc;vertical-align:-0.15em;margin-left:2px;animation:blink .7s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style></head><body><div class="tag">01 · 打字机入场</div><div class="stage"><div class="stage2"><span id="tw"></span></div></div>
<script>var s="把想法，一字一句敲成现实。",el=document.getElementById("tw"),i=0;
function t(){if(i<=s.length){el.textContent=s.slice(0,i);i++;setTimeout(t,140);}else{setTimeout(function(){i=0;t();},2600);}}t();</script></body></html>
