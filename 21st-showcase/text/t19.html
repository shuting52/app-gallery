<title>19 · 乱码解密</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0b0e14;color:#eef2f7;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow-x:hidden}

</style></head><body><div class="tag">19 · 乱码解密</div><div class="stage"><div id="sc"></div><div class="sub">解密中 · 请稍候</div></div>
<script>var real="真相终将浮现",pool="!<>-_\/[]{}—=+*^?#01",el=document.getElementById("sc"),f=0;
function tick(){var out="";for(var i=0;i<real.length;i++){out+= i<f?real[i]:pool[Math.floor(Math.random()*pool.length)];}
el.textContent=out;f+=0.35;if(f<=real.length+2){setTimeout(tick,60);}else{setTimeout(function(){f=0;tick();},2200);}}tick();</script></body></html>
