<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>28 · 输入删除循环</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0b0e14;color:#eef2f7;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow-x:hidden}
.tag{position:fixed;top:10px;left:12px;font-size:12px;color:#8b93a5;letter-spacing:.08em;z-index:10}
.stage{width:100%;max-width:430px;padding:28px 20px;text-align:center}
.txt{font-size:30px;font-weight:800;line-height:1.5;letter-spacing:.06em}
.sub{margin-top:14px;font-size:13px;color:#8b93a5;letter-spacing:.2em}
#td{font-size:30px;font-weight:800;letter-spacing:.06em;min-height:1.5em;display:inline-block}
#td::after{content:"▍";color:#34d399;animation:blink .7s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style></head><body><div class="tag">28 · 输入删除循环</div><div class="stage"><div><span id="td"></span></div></div>
<script>var ph=["你好，世界。","你好，未来。","你好，远方。"],el=document.getElementById("td"),pi=0,ci=0,del=false;
function loop(){var cur=ph[pi];
if(!del){ci++;if(ci>=cur.length){ci=cur.length;del=true;setTimeout(loop,1200);el.textContent=cur;return;}}
else{ci--;if(ci<=0){ci=0;del=false;pi=(pi+1)%ph.length;}}
el.textContent=cur.slice(0,ci);setTimeout(loop,del?60:130);}loop();</script></body></html>
