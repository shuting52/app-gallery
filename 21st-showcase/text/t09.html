<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>09 · 切割错位</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0b0e14;color:#eef2f7;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow-x:hidden}
.tag{position:fixed;top:10px;left:12px;font-size:12px;color:#8b93a5;letter-spacing:.08em;z-index:10}
.stage{width:100%;max-width:430px;padding:28px 20px;text-align:center}
.txt{font-size:30px;font-weight:800;line-height:1.5;letter-spacing:.06em}
.sub{margin-top:14px;font-size:13px;color:#8b93a5;letter-spacing:.2em}
.cut{position:relative;display:inline-block;font-size:30px;font-weight:800;letter-spacing:.1em}
.cut .a,.cut .b{position:absolute;left:0;top:0;white-space:nowrap}
.cut .a{clip-path:inset(0 0 50% 0);animation:shl 2.6s ease-in-out infinite}
.cut .b{clip-path:inset(50% 0 0 0);animation:shr 2.6s ease-in-out infinite;color:#7dd3fc}
.cut .ghost{visibility:hidden;white-space:nowrap}
@keyframes shl{0%,100%{transform:translateX(0)}50%{transform:translateX(-12px)}}
@keyframes shr{0%,100%{transform:translateX(0)}50%{transform:translateX(12px)}}
</style></head><body><div class="tag">09 · 切割错位</div><div class="stage"><div class="txt cut"><span class="ghost">错位时空</span><span class="a">错位时空</span><span class="b">错位时空</span></div></div>
<script></script></body></html>
