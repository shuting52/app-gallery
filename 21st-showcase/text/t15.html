<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>15 · 字母翻转</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0b0e14;color:#eef2f7;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow-x:hidden}
.tag{position:fixed;top:10px;left:12px;font-size:12px;color:#8b93a5;letter-spacing:.08em;z-index:10}
.stage{width:100%;max-width:430px;padding:28px 20px;text-align:center}
.txt{font-size:30px;font-weight:800;line-height:1.5;letter-spacing:.06em}
.sub{margin-top:14px;font-size:13px;color:#8b93a5;letter-spacing:.2em}
.txt span{display:inline-block;animation:flip 2.2s ease-in-out infinite}
@keyframes flip{0%,100%{transform:rotateX(0)}50%{transform:rotateX(360deg)}}
</style></head><body><div class="tag">15 · 字母翻转</div><div class="stage"><div class="txt" data-flip>翻转乾坤</div></div>
<script>document.querySelectorAll("[data-flip]").forEach(function(el){var t=el.textContent;el.innerHTML="";t.split("").forEach(function(c,i){var s=document.createElement("span");s.textContent=c;s.style.animationDelay=(i*0.15)+"s";el.appendChild(s);});});</script></body></html>
