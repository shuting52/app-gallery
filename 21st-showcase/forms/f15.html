<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>15 · 滑动解锁</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}.unl{position:relative;height:58px;background:#161c2b;border:1px solid #2a3350;border-radius:29px;overflow:hidden;user-select:none;touch-action:none}.unl .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#22c55e,#4ade80);border-radius:29px}.unl .txt{position:absolute;inset:0;display:grid;place-items:center;color:#9aa3b5;letter-spacing:3px;background:linear-gradient(90deg,#9aa3b5 30%,#fff 50%,#9aa3b5 70%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shim 2.2s linear infinite}@keyframes shim{to{background-position:-200% 0}}.unl .th{position:absolute;left:4px;top:4px;width:50px;height:50px;border-radius:50%;background:#4f7cff;color:#fff;display:grid;place-items:center;font-size:22px;cursor:grab;box-shadow:0 2px 12px rgba(79,124,255,.5)}.unl.done .txt{-webkit-text-fill-color:#22c55e;animation:donepop .4s;background:none;color:#22c55e}@keyframes donepop{40%{transform:scale(1.15)}}</style></head><body><div class="t">15 · 滑动解锁</div><div class="wrap"><div class="unl" id="u15"><div class="fill" id="f15"></div><div class="txt" id="t15">向右滑动解锁</div><div class="th" id="h15">→</div></div></div><script>var u=document.getElementById('u15'),th=document.getElementById('h15'),fl=document.getElementById('f15'),tx=document.getElementById('t15'),drag=false,startX=0,max=0;th.addEventListener('pointerdown',function(e){if(u.classList.contains('done'))return;drag=true;startX=e.clientX-th.offsetLeft-4;th.setPointerCapture(e.pointerId);});th.addEventListener('pointermove',function(e){if(!drag)return;max=u.clientWidth-58;var x=Math.max(0,Math.min(max,e.clientX-startX));th.style.left=(4+x)+'px';fl.style.width=(x+54)+'px';if(x>=max-4){drag=false;u.classList.add('done');th.style.left='';fl.style.width='100%';th.textContent='✓';th.style.background='#22c55e';tx.textContent='已解锁';}});th.addEventListener('pointerup',function(){if(u.classList.contains('done')||!drag)return;drag=false;th.style.transition='left .3s';fl.style.transition='width .3s';th.style.left='4px';fl.style.width='0';setTimeout(function(){th.style.transition='';fl.style.transition=''},320);});</script></body></html>
