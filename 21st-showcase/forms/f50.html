<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>50 · 提交变勾动画</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}.morph{position:relative;min-width:200px;height:54px;border:none;border-radius:27px;background:linear-gradient(90deg,#4f7cff,#9d6bff);color:#fff;font-size:16px;cursor:pointer;overflow:hidden;transition:all .4s cubic-bezier(.3,1.2,.4,1)}.morph.loading{min-width:54px;width:54px;color:transparent;pointer-events:none}.morph.loading::after{content:'';position:absolute;inset:0;margin:auto;width:24px;height:24px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.morph.done{background:#22c55e;min-width:54px;width:54px;animation:donep .45s}.morph.done::after{display:none}.morph.done span{opacity:1}@keyframes donep{40%{transform:scale(1.18)}}.morph.done span::before{content:'✓';font-size:24px}</style></head><body><div class="t">50 · 提交变勾动画</div><div class="wrap"><div style="text-align:center;padding-top:20px"><button class="morph" id="b50"><span>提交订单</span></button></div><div class="lb" id="s50" style="text-align:center;margin-top:12px"></div></div><script>var b=document.getElementById('b50'),s=document.getElementById('s50');b.onclick=function(){if(b.classList.contains('loading'))return;b.classList.add('loading');s.textContent='';setTimeout(function(){b.classList.remove('loading');b.classList.add('done');s.textContent='订单提交成功';s.style.color='#22c55e';setTimeout(function(){b.classList.remove('done');b.querySelector('span').textContent='提交订单';},2200);},1600);};</script></body></html>
