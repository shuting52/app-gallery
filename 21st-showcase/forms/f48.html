<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>48 · 表单步骤指示</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}.fsteps{position:relative;display:flex;justify-content:space-between}.fsteps .ln{position:absolute;top:17px;left:34px;right:34px;height:3px;background:#232a3d;border-radius:2px}.fsteps .ln i{display:block;height:100%;width:0;background:#4f7cff;border-radius:2px;transition:width .5s}.fsteps .st{text-align:center;z-index:1;width:64px}.fsteps .st b{display:grid;place-items:center;width:36px;height:36px;margin:0 auto 6px;border-radius:50%;background:#161c2b;border:2px solid #2a3350;color:#7d8699;font-size:15px;transition:all .35s}.fsteps .st span{font-size:12px;color:#7d8699}.fsteps .st.on b{background:#4f7cff;border-color:#4f7cff;color:#fff;animation:stp .45s;box-shadow:0 0 14px rgba(79,124,255,.5)}.fsteps .st.on span{color:#fff}@keyframes stp{40%{transform:scale(1.3) rotate(10deg)}}.sub2{width:100%;padding:13px;border:none;border-radius:12px;background:#4f7cff;color:#fff;font-size:15px;cursor:pointer}.sub2:active{transform:scale(.97)}</style></head><body><div class="t">48 · 表单步骤指示</div><div class="wrap"><div class="fsteps" id="f48"><div class="ln"><i></i></div><div class="st on"><b>1</b><span>账号</span></div><div class="st"><b>2</b><span>验证</span></div><div class="st"><b>3</b><span>资料</span></div><div class="st"><b>4</b><span>完成</span></div></div><button class="sub2" id="b48" style="margin-top:18px">下一步</button></div><script>var cur=0,sts=document.querySelectorAll('#f48 .st'),ln=document.querySelector('#f48 .ln i');document.getElementById('b48').onclick=function(){cur=(cur+1)%4;sts.forEach(function(s,i){var on=i<=cur;s.classList.toggle('on',on);if(i===cur){s.classList.remove('on');void s.offsetWidth;s.classList.add('on');}});ln.style.width=(cur/3*100)+'%';};</script></body></html>
