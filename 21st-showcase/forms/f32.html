<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>32 · 加减弹跳步进</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}.stp2{display:inline-flex;align-items:center;gap:0;background:#161c2b;border:1px solid #2a3350;border-radius:24px;overflow:hidden}.stp2 button{width:48px;height:48px;background:none;border:none;color:#fff;font-size:22px;cursor:pointer;transition:background .2s,transform .15s}.stp2 button:active{transform:scale(.82);background:rgba(79,124,255,.2)}.stp2 b{min-width:56px;text-align:center;font-size:20px;color:#4f7cff;display:inline-block}.stp2 b.bp{animation:bp .3s}@keyframes bp{40%{transform:scale(1.35)}}</style></head><body><div class="t">32 · 加减弹跳步进</div><div class="wrap"><label class="lb">选择份数</label><div class="stp2"><button id="m32">−</button><b id="n32">2</b><button id="p32">＋</button></div></div><script>var n=2,el=document.getElementById('n32');function ch(d){n=Math.max(1,Math.min(20,n+d));el.textContent=n;el.classList.remove('bp');void el.offsetWidth;el.classList.add('bp');}document.getElementById('m32').onclick=function(){ch(-1)};document.getElementById('p32').onclick=function(){ch(1)};</script></body></html>
