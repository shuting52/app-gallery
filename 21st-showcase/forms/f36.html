<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>36 · 芯片多选</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}.chips{display:flex;flex-wrap:wrap;gap:10px}.chips span{padding:10px 18px;border-radius:22px;background:#161c2b;border:1px solid #2a3350;color:#9aa3b5;font-size:14px;cursor:pointer;transition:all .25s;user-select:none}.chips span.on{background:rgba(79,124,255,.16);border-color:#4f7cff;color:#fff;animation:chip .35s;box-shadow:0 2px 12px rgba(79,124,255,.3)}@keyframes chip{40%{transform:translateY(-4px) scale(1.06)}}</style></head><body><div class="t">36 · 芯片多选</div><div class="wrap"><label class="lb">擅长领域（多选）</label><div class="chips" id="c36"><span>前端</span><span>设计</span><span>产品</span><span>运营</span><span>数据</span></div></div><script>document.getElementById('c36').addEventListener('click',function(e){if(e.target.tagName==='SPAN')e.target.classList.toggle('on');});</script></body></html>
