<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>43 · 表情五级评分</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}.emj{display:flex;justify-content:space-between;font-size:44px;cursor:pointer;user-select:none;padding:6px 2px}.emj span{filter:grayscale(1);opacity:.45;transform:scale(.85);transition:all .25s}.emj span:hover{filter:none;opacity:1;transform:scale(1.15)}.emj span.on{filter:none;opacity:1;transform:scale(1.18);animation:emjp .4s}@keyframes emjp{40%{transform:scale(1.45) rotate(-10deg)}}</style></head><body><div class="t">43 · 表情五级评分</div><div class="wrap"><label class="lb">用餐体验</label><div class="emj" id="e43"><span>😡</span><span>😕</span><span>😐</span><span>😊</span><span>😍</span></div></div><script>document.getElementById('e43').addEventListener('click',function(e){if(e.target.tagName!=='SPAN')return;this.querySelectorAll('span').forEach(function(s){s.classList.remove('on')});e.target.classList.add('on');});</script></body></html>
