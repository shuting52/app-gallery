<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>14 · 验证码格</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}.otp{display:flex;gap:10px}.otp span{width:48px;height:56px;background:#161c2b;border:1px solid #2a3350;border-radius:12px;display:grid;place-items:center;font-size:24px;font-weight:700;color:#fff;transition:border-color .25s}.otp span.cur{border-color:#4f7cff;animation:caret 1s steps(2) infinite}@keyframes caret{50%{box-shadow:inset 0 -4px 0 #4f7cff}}.otp span.fill{border-color:#4f7cff;animation:fillpop .3s}@keyframes fillpop{40%{transform:scale(1.14)}}</style></head><body><div class="t">14 · 验证码格</div><div class="wrap"><label class="lb">短信验证码</label><div class="otp" id="o14"><span></span><span></span><span></span><span></span><span></span><span></span></div><input id="h14" inputmode="numeric" maxlength="6" style="position:absolute;opacity:0;pointer-events:none"><div class="lb" style="margin-top:8px">点击方格输入 6 位数字</div></div><script>var box=document.getElementById('o14'),hid=document.getElementById('h14'),cells=box.querySelectorAll('span');box.parentElement.addEventListener('click',function(){hid.focus()});box.addEventListener('click',function(){hid.focus()});hid.addEventListener('input',function(){var v=hid.value.replace(/\D/g,'').slice(0,6);hid.value=v;cells.forEach(function(c,i){var had=c.textContent;c.textContent=v[i]||'';c.classList.toggle('fill',!!v[i]);c.classList.toggle('cur',i===v.length);if(v[i]&&!had){c.classList.remove('fill');void c.offsetWidth;c.classList.add('fill');}});});cells[0].classList.add('cur');</script></body></html>
