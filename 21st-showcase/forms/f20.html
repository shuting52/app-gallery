<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>20 · 心情表情滑杆</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}.moj{text-align:center}#e20{font-size:64px;margin-bottom:12px;display:inline-block}#e20.chg{animation:mj .4s}@keyframes mj{40%{transform:scale(1.4) rotate(-8deg)}}</style></head><body><div class="t">20 · 心情表情滑杆</div><div class="wrap"><label class="lb">今天心情如何？</label><div class="moj"><div id="e20">😐</div><input type="range" id="r20" min="0" max="100" value="50"></div><div class="lb" id="w20" style="text-align:center;margin-top:8px">还不错</div></div><script>var r=document.getElementById('r20'),e=document.getElementById('e20'),w=document.getElementById('w20');var ms=[['😞','有点低落'],['🙁','不太好'],['😐','还不错'],['🙂','挺好的'],['😄','很开心'],['🤩','超级棒']];r.addEventListener('input',function(){var i=Math.min(5,Math.floor(r.value/100*6));e.textContent=ms[i][0];w.textContent=ms[i][1];e.classList.remove('chg');void e.offsetWidth;e.classList.add('chg');});</script></body></html>
