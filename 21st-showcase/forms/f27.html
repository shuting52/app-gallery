<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>27 · 指示点滑动单选</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}.sld{position:relative;background:#161c2b;border:1px solid #2a3350;border-radius:14px;padding:6px}.sld label{position:relative;display:block;padding:13px 14px 13px 44px;cursor:pointer;color:#9aa3b5;z-index:1;transition:color .3s}.sld label:has(input:checked){color:#fff}.sld .mk{position:absolute;left:14px;width:22px;height:22px;border-radius:50%;border:2px solid #4f7cff;transition:top .35s cubic-bezier(.3,1.3,.4,1)}.sld .mk::after{content:'';position:absolute;inset:4px;border-radius:50%;background:#4f7cff;transform:scale(0);transition:transform .25s}.sld.on .mk::after{transform:scale(1)}</style></head><body><div class="t">27 · 指示点滑动单选</div><div class="wrap"><label class="lb">配送方式</label><div class="sld" id="d27"><span class="mk"></span><label><input type="radio" name="d" hidden checked>快递配送</label><label><input type="radio" name="d" hidden>到店自取</label><label><input type="radio" name="d" hidden>同城跑腿</label></div></div><script>var d=document.getElementById('d27'),mk=d.querySelector('.mk');function mv(){var l=d.querySelector('input:checked').closest('label');mk.style.top=(l.offsetTop+(l.offsetHeight-22)/2)+'px';d.classList.add('on');}d.addEventListener('change',mv);setTimeout(mv,60);</script></body></html>
