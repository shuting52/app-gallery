<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>18 · 分段滑动选择</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}.seg{position:relative;display:flex;background:#161c2b;border:1px solid #2a3350;border-radius:14px;padding:4px}.seg button{flex:1;background:none;border:none;color:#9aa3b5;font-size:15px;padding:10px 0;cursor:pointer;z-index:1;transition:color .3s}.seg button.on{color:#fff}.seg{--i:0}.seg .pill{position:absolute;top:4px;bottom:4px;border-radius:10px;background:#4f7cff;left:calc(4px + var(--i)*(100% - 8px)/3);width:calc((100% - 8px)/3);transition:left .35s cubic-bezier(.3,1.3,.4,1);box-shadow:0 2px 12px rgba(79,124,255,.5);animation:pillp .35s}@keyframes pillp{40%{transform:scaleX(1.12)}}</style></head><body><div class="t">18 · 分段滑动选择</div><div class="wrap"><label class="lb">时间范围</label><div class="seg" id="s18"><span class="pill"></span><button class="on">今天</button><button>本周</button><button>本月</button></div></div><script>var s=document.getElementById('s18'),btns=s.querySelectorAll('button');function move(i){s.style.setProperty('--i',i);btns.forEach(function(b,j){b.classList.toggle('on',j===i)});}btns.forEach(function(b,i){b.onclick=function(){move(i)}});move(0);</script></body></html>
