<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>04 · 打勾动画复选框</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}.cbx{display:flex;align-items:center;gap:10px;margin:10px 0;cursor:pointer;user-select:none}.box{width:26px;height:26px;border:2px solid #3a4560;border-radius:8px;display:grid;place-items:center;transition:background .3s,border-color .3s}.box svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.box path{stroke-dasharray:26;stroke-dashoffset:26;transition:stroke-dashoffset .35s ease .08s}.cbx input:checked+.box{background:#4f7cff;border-color:#4f7cff;animation:pop .35s}.cbx input:checked+.box path{stroke-dashoffset:0}@keyframes pop{40%{transform:scale(1.18) rotate(-6deg)}}</style></head><body><div class="t">04 · 打勾动画复选框</div><div class="wrap"><label class="lb">兴趣爱好</label><label class="cbx"><input type="checkbox" hidden><span class="box"><svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg></span>摄影</label><label class="cbx"><input type="checkbox" hidden checked><span class="box"><svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg></span>旅行</label><label class="cbx"><input type="checkbox" hidden><span class="box"><svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg></span>阅读</label></div><script></script></body></html>
