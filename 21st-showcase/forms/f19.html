<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>19 · 步骤进度表单</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}.stp{position:relative;display:flex;justify-content:space-between;padding:0 8px}.stp .bar{position:absolute;top:19px;left:24px;right:24px;height:4px;background:#232a3d;border-radius:2px}.stp .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4f7cff,#9d6bff);border-radius:2px;transition:width .5s cubic-bezier(.2,.8,.2,1)}.stp .nd{width:40px;height:40px;border-radius:50%;background:#161c2b;border:2px solid #2a3350;display:grid;place-items:center;font-weight:700;color:#7d8699;z-index:1;transition:all .4s}.stp .nd.on{border-color:#4f7cff;color:#fff;background:#4f7cff;animation:npop .45s;box-shadow:0 0 16px rgba(79,124,255,.5)}@keyframes npop{40%{transform:scale(1.25)}}.btn{flex:1;padding:12px;border-radius:12px;border:1px solid #2a3350;background:#161c2b;color:#fff;font-size:15px;cursor:pointer;transition:transform .15s}.btn:active{transform:scale(.96)}.btn.pr{background:#4f7cff;border-color:#4f7cff}</style></head><body><div class="t">19 · 步骤进度表单</div><div class="wrap"><div class="stp" id="p19"><div class="bar"><i></i></div><div class="nd on">1</div><div class="nd">2</div><div class="nd">3</div></div><div class="lb" id="ph19" style="text-align:center;margin:14px 0">填写基本信息</div><div style="display:flex;gap:10px"><button class="btn" id="pv19">上一步</button><button class="btn pr" id="nx19">下一步</button></div></div><script>var cur=0,nds=document.querySelectorAll('#p19 .nd'),bar=document.querySelector('#p19 .bar i'),ph=document.getElementById('ph19'),phs=['填写基本信息','选择偏好设置','确认并提交'];function go(i){cur=Math.max(0,Math.min(2,i));nds.forEach(function(n,j){var on=j<=cur;n.classList.toggle('on',on);if(j===cur){n.classList.remove('on');void n.offsetWidth;n.classList.add('on');}});bar.style.width=(cur/2*100)+'%';ph.textContent=phs[cur];}document.getElementById('pv19').onclick=function(){go(cur-1)};document.getElementById('nx19').onclick=function(){go(cur+1)};go(0);</script></body></html>
