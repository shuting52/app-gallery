<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>12 · 颜色选择扩散环</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}.pal{display:flex;gap:14px}.pal span{width:42px;height:42px;border-radius:50%;background:var(--c);cursor:pointer;position:relative;transition:transform .25s}.pal span:hover{transform:scale(1.12)}.pal span.on::after{content:'';position:absolute;inset:-7px;border:2px solid var(--c);border-radius:50%;animation:ring .4s}@keyframes ring{from{transform:scale(.6);opacity:0}}</style></head><body><div class="t">12 · 颜色选择扩散环</div><div class="wrap"><label class="lb">主题颜色</label><div class="pal" id="p12"><span style="--c:#4f7cff" class="on"></span><span style="--c:#9d6bff"></span><span style="--c:#22c55e"></span><span style="--c:#f59e0b"></span><span style="--c:#ef4444"></span><span style="--c:#06b6d4"></span></div><div class="lb" style="margin-top:10px">当前：<b id="c12" style="color:#4f7cff">#4F7CFF</b></div></div><script>var box=document.getElementById('p12'),out=document.getElementById('c12');box.addEventListener('click',function(e){var s=e.target.closest('span');if(!s)return;box.querySelectorAll('span').forEach(function(x){x.classList.remove('on')});s.classList.add('on');var c=getComputedStyle(s).getPropertyValue('--c').trim().toUpperCase();out.textContent=c;out.style.color=c;});</script></body></html>
