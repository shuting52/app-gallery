<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>13 · 搜索框弹性展开</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}.sb{display:flex;align-items:center;background:#161c2b;border:1px solid #2a3350;border-radius:24px;width:48px;height:48px;overflow:hidden;transition:width .45s cubic-bezier(.3,1.3,.4,1),border-color .3s}.sb.open{width:100%;border-color:#4f7cff;animation:sbpop .45s}@keyframes sbpop{from{transform:scaleX(.7);opacity:.5}}.sb button{background:none;border:none;font-size:20px;cursor:pointer;flex:none;width:48px;height:48px}.sb input{flex:1;background:none;border:none;outline:none;color:#fff;font-size:15px;min-width:0}</style></head><body><div class="t">13 · 搜索框弹性展开</div><div class="wrap"><div class="sb" id="sb13"><button id="b13">🔍</button><input id="q13" placeholder="搜索站点、工具…"></div></div><script>var sb=document.getElementById('sb13'),q=document.getElementById('q13');document.getElementById('b13').onclick=function(){sb.classList.add('open');q.focus()};q.addEventListener('blur',function(){if(!q.value)sb.classList.remove('open')});</script></body></html>
