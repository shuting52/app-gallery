<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>44 · 排他模式开关</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}.xrow{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;background:#161c2b;border:1px solid #232a3d;border-radius:12px;margin-bottom:10px;transition:border-color .3s,box-shadow .3s}.xrow.lit{border-color:#4f7cff;box-shadow:0 0 14px rgba(79,124,255,.25)}.xsw i{display:block;width:52px;height:30px;border-radius:15px;background:#2a3350;position:relative;cursor:pointer;transition:background .3s}.xsw i::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .3s cubic-bezier(.3,1.4,.5,1)}.xsw input:checked+i{background:#4f7cff;animation:xgl .4s}@keyframes xgl{40%{box-shadow:0 0 16px rgba(79,124,255,.8)}}.xsw input:checked+i::after{left:25px}</style></head><body><div class="t">44 · 排他模式开关</div><div class="wrap"><label class="lb">省电模式（三选一）</label><div id="g44"><div class="xrow"><span>🔋 省电</span><label class="xsw"><input type="checkbox" class="x44" checked><i></i></label></div><div class="xrow"><span>⚖️ 均衡</span><label class="xsw"><input type="checkbox" class="x44"><i></i></label></div><div class="xrow"><span>🚀 性能</span><label class="xsw"><input type="checkbox" class="x44"><i></i></label></div></div></div><script>var xs=document.querySelectorAll('.x44');xs.forEach(function(x){x.addEventListener('change',function(){if(x.checked){xs.forEach(function(y){if(y!==x){y.checked=false;y.closest('.xrow').classList.remove('lit');}});}x.closest('.xrow').classList.toggle('lit',x.checked);});});document.querySelector('.x44:checked').closest('.xrow').classList.add('lit');</script></body></html>
