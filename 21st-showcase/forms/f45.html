<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>45 · 条纹上传进度</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}.sub2{width:100%;padding:13px;border:none;border-radius:12px;background:#4f7cff;color:#fff;font-size:15px;cursor:pointer;margin-bottom:14px;transition:transform .15s}.sub2:active{transform:scale(.97)}.sub2:disabled{background:#2a3350}.pbar{position:relative;height:26px;background:#161c2b;border:1px solid #2a3350;border-radius:13px;overflow:hidden}.pbar i{display:block;height:100%;width:0;border-radius:13px;background:repeating-linear-gradient(45deg,#4f7cff,#4f7cff 12px,#6b96ff 12px,#6b96ff 24px);background-size:34px 100%;transition:width .2s}.pbar i.go{animation:stripe .7s linear infinite}@keyframes stripe{to{background-position:34px 0}}.pbar b{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:#fff}</style></head><body><div class="t">45 · 条纹上传进度</div><div class="wrap"><label class="lb">上传文件</label><button class="sub2" id="b45">开始上传</button><div class="pbar"><i id="f45"></i><b id="p45">0%</b></div></div><script>var b=document.getElementById('b45'),f=document.getElementById('f45'),p=document.getElementById('p45'),pr=0,tm=null;b.onclick=function(){if(tm)return;b.disabled=true;pr=0;f.classList.add('go');tm=setInterval(function(){pr=Math.min(100,pr+Math.random()*9+2);f.style.width=pr+'%';p.textContent=Math.floor(pr)+'%';if(pr>=100){clearInterval(tm);tm=null;f.classList.remove('go');b.disabled=false;b.textContent='重新上传';p.textContent='上传完成 ✓';}},220);};</script></body></html>
