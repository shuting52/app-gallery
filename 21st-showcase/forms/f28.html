<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>28 · 搜索建议下拉</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}.sg{position:relative}.sg .lst{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#161c2b;border:1px solid #2a3350;border-radius:12px;overflow:hidden;display:none;box-shadow:0 12px 32px rgba(0,0,0,.5);z-index:5}.sg .lst div{padding:12px 14px;cursor:pointer;animation:oin .3s both;border-bottom:1px solid #1c2333}@keyframes oin{from{opacity:0;transform:translateY(-8px)}}.sg .lst div:last-child{border:none}.sg .lst div:hover{background:rgba(79,124,255,.12)}.sg .lst b{color:#4f7cff;font-weight:400}</style></head><body><div class="t">28 · 搜索建议下拉</div><div class="wrap"><div class="sg" id="g28"><input class="inp" id="q28" placeholder="搜索功能…" autocomplete="off"><div class="lst" id="l28"></div></div></div><script>var all=['去水印解析','站点导航','工时打卡','深色模式','消息推送','自动更新','夜间免打扰','主题颜色'];var q=document.getElementById('q28'),l=document.getElementById('l28');q.addEventListener('input',function(){var v=q.value.trim();var hit=all.filter(function(s){return v&&s.indexOf(v)>-1});if(!hit.length){l.style.display='none';return;}l.innerHTML='';hit.forEach(function(s,i){var d=document.createElement('div');d.style.animationDelay=(i*.05)+'s';d.innerHTML=s.replace(v,'<b>'+v+'</b>');d.onclick=function(){q.value=s;l.style.display='none'};l.appendChild(d);});l.style.display='block';});q.addEventListener('blur',function(){setTimeout(function(){l.style.display='none'},200)});</script></body></html>
