<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>40 · 按压锁存开关</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}.latch{display:block;margin:0 auto;width:92px;height:92px;border-radius:50%;border:3px solid #2a3350;background:#161c2b;color:#5a6376;font-size:36px;cursor:pointer;transition:all .3s}.latch:active{transform:scale(.92)}.latch.on{border-color:#22c55e;color:#22c55e;box-shadow:0 0 28px rgba(34,197,94,.45),inset 0 0 18px rgba(34,197,94,.2);animation:latch .4s}@keyframes latch{40%{transform:scale(1.1) rotate(8deg)}}</style></head><body><div class="t">40 · 按压锁存开关</div><div class="wrap"><label class="lb">电源</label><button class="latch" id="l40"><span>⏻</span></button><div class="lb" id="s40" style="text-align:center;margin-top:10px">已关闭</div></div><script>var l=document.getElementById('l40'),s=document.getElementById('s40');l.onclick=function(){var on=l.classList.toggle('on');s.textContent=on?'已开启':'已关闭';s.style.color=on?'#22c55e':'#9aa3b5';};</script></body></html>
