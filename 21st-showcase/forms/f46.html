<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>46 · 语音波形输入</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}.vw{display:flex;align-items:center;gap:16px;background:#161c2b;border:1px solid #2a3350;border-radius:16px;padding:18px}.bars{display:flex;align-items:center;gap:4px;height:44px;flex:1;justify-content:center}.bars i{width:5px;height:8px;border-radius:3px;background:#4f7cff;transition:height .2s}.bars.live i{animation:wv .8s ease-in-out infinite}.bars.live i:nth-child(2){animation-delay:.1s}.bars.live i:nth-child(3){animation-delay:.2s}.bars.live i:nth-child(4){animation-delay:.3s}.bars.live i:nth-child(5){animation-delay:.4s}.bars.live i:nth-child(6){animation-delay:.5s}.bars.live i:nth-child(7){animation-delay:.6s}@keyframes wv{0%,100%{height:8px}50%{height:40px}}.vw button{flex:none;padding:12px 20px;border:none;border-radius:24px;background:#ef4444;color:#fff;font-size:15px;cursor:pointer;user-select:none;transition:transform .15s}.vw button:active{transform:scale(.93)}</style></head><body><div class="t">46 · 语音波形输入</div><div class="wrap"><label class="lb">按住说话</label><div class="vw"><div class="bars" id="b46"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><button id="m46">🎤 按住</button></div><div class="lb" id="s46" style="margin-top:8px">按住按钮开始录音</div></div><script>var m=document.getElementById('m46'),b=document.getElementById('b46'),s=document.getElementById('s46');m.addEventListener('pointerdown',function(){b.classList.add('live');s.textContent='正在聆听…';s.style.color='#ef4444';});['pointerup','pointerleave'].forEach(function(e){m.addEventListener(e,function(){b.classList.remove('live');s.textContent='识别结果：你好';s.style.color='#22c55e';});});</script></body></html>
