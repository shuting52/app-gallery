<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>35 · 错误抖动验证</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}.sub{width:100%;padding:14px;border:none;border-radius:12px;background:#4f7cff;color:#fff;font-size:16px;cursor:pointer;margin-top:6px;transition:transform .15s}.sub:active{transform:scale(.97)}.err{color:#ef4444;min-height:22px;margin-top:6px;font-size:13px}.inp.bad{border-color:#ef4444;animation:shake .45s}@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}</style></head><body><div class="t">35 · 错误抖动验证</div><div class="wrap"><label class="lb">昵称（必填）</label><input class="inp" id="i35" placeholder="请输入昵称" autocomplete="off"><div class="lb err" id="e35"></div><button class="sub" id="b35">提交</button></div><script>var i=document.getElementById('i35'),e=document.getElementById('e35');document.getElementById('b35').onclick=function(){if(!i.value.trim()){i.classList.remove('bad');void i.offsetWidth;i.classList.add('bad');e.textContent='昵称不能为空，请填写后再提交';i.focus();}else{e.textContent='';e.style.color='#22c55e';e.textContent='提交成功 ✓';}};</script></body></html>
