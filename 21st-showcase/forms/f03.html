<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>03 · 滑杆填充进度</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:4px;outline:none;background:linear-gradient(90deg,#4f7cff var(--p,50%),#232a3d var(--p,50%))}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:5px solid #4f7cff;box-shadow:0 2px 10px rgba(79,124,255,.5);cursor:pointer;transition:transform .2s}input[type=range]::-webkit-slider-thumb:active{transform:scale(1.2)}input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:5px solid #4f7cff;cursor:pointer}</style></head><body><div class="t">03 · 滑杆填充进度</div><div class="wrap"><label class="lb">音量 <b id="v3" style="color:#4f7cff">50</b></label><input type="range" id="r3" min="0" max="100" value="50"></div><script>var r=document.getElementById('r3'),v=document.getElementById('v3');r.addEventListener('input',function(){r.style.setProperty('--p',r.value+'%');v.textContent=r.value;});</script></body></html>
