<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>22 · 标签回车生成</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}.tgbox{display:flex;flex-wrap:wrap;gap:8px;background:#161c2b;border:1px solid #2a3350;border-radius:12px;padding:10px;cursor:text;transition:border-color .3s}.tgbox:focus-within{border-color:#4f7cff}.tgbox input{flex:1;min-width:90px;background:none;border:none;outline:none;color:#fff;font-size:15px}.tag{display:inline-flex;align-items:center;gap:6px;background:rgba(79,124,255,.16);border:1px solid #4f7cff;color:#bcd0ff;padding:5px 6px 5px 12px;border-radius:20px;font-size:13px;animation:tagin .3s cubic-bezier(.3,1.5,.5,1)}@keyframes tagin{from{transform:scale(.4);opacity:0}}.tag b{cursor:pointer;font-weight:400;opacity:.7}.tag.out{animation:tagout .25s forwards}@keyframes tagout{to{transform:scale(.4);opacity:0}}</style></head><body><div class="t">22 · 标签回车生成</div><div class="wrap"><label class="lb">添加标签（回车确认）</label><div class="tgbox" id="b22"><input id="i22" placeholder="输入标签…"></div></div><script>var b=document.getElementById('b22'),inp=document.getElementById('i22');b.onclick=function(){inp.focus()};inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&inp.value.trim()){e.preventDefault();var s=document.createElement('span');s.className='tag';s.innerHTML='';s.textContent=inp.value.trim();var x=document.createElement('b');x.textContent=' ✕';x.onclick=function(ev){ev.stopPropagation();s.classList.add('out');setTimeout(function(){s.remove()},240);};s.appendChild(x);b.insertBefore(s,inp);inp.value='';}});</script></body></html>
