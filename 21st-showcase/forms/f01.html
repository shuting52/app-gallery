<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>01 · 浮动标签输入框</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}.fld{position:relative;margin-top:6px}.fld .inp{padding:18px 12px 8px}.fld label{position:absolute;left:12px;top:15px;color:#7d8699;pointer-events:none;transition:all .25s}.fld .inp:focus+label,.fld .inp:not(:placeholder-shown)+label{top:6px;font-size:11px;color:#4f7cff;animation:lab .25s}@keyframes lab{from{transform:translateY(4px);opacity:.4}}</style></head><body><div class="t">01 · 浮动标签输入框</div><div class="wrap"><label class="lb">登录信息</label><div class="fld"><input class="inp" id="i1" placeholder=" " autocomplete="off"><label for="i1">手机号码</label></div></div><script></script></body></html>
