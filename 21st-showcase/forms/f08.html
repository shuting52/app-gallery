<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>08 · 星级评分弹跳</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}.stars{display:flex;gap:6px;font-size:44px;cursor:pointer;user-select:none}.stars span{color:#2a3350;transition:color .2s,transform .2s}.stars span.lit{color:#ffc531;text-shadow:0 0 18px rgba(255,197,49,.5)}.stars span.boom{animation:boom .4s}@keyframes boom{40%{transform:scale(1.45) rotate(12deg)}}#t8{min-height:22px}</style></head><body><div class="t">08 · 星级评分弹跳</div><div class="wrap"><label class="lb">给本次服务打分</label><div class="stars" id="s8"><span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span></div><div class="lb" id="t8" style="margin-top:8px">点击星星评分</div></div><script>var box=document.getElementById('s8'),txt=document.getElementById('t8'),cur=0;var words=['','很差','一般','不错','很好','非常满意'];function paint(v){box.querySelectorAll('span').forEach(function(s){s.classList.toggle('lit',+s.dataset.v<=v);});}box.addEventListener('mouseover',function(e){if(e.target.dataset.v)paint(+e.target.dataset.v);});box.addEventListener('mouseleave',function(){paint(cur);});box.addEventListener('click',function(e){if(!e.target.dataset.v)return;cur=+e.target.dataset.v;paint(cur);e.target.classList.remove('boom');void e.target.offsetWidth;e.target.classList.add('boom');txt.textContent=words[cur];});</script></body></html>
