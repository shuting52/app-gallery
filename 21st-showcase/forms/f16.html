<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>16 · 旋转切换开关</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}.rsw .tr{display:block;width:76px;height:40px;border-radius:20px;background:#2a3350;position:relative;cursor:pointer;transition:background .35s}.rsw .kb{position:absolute;top:4px;left:4px;width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:17px;transition:left .35s cubic-bezier(.3,1.4,.5,1),background .35s}.rsw input:checked+.tr{background:#4f7cff}.rsw input:checked+.tr .kb{left:40px;background:#0e1320;animation:spin .45s}@keyframes spin{from{transform:rotate(-180deg)}}</style></head><body><div class="t">16 · 旋转切换开关</div><div class="wrap"><label class="lb">深色模式</label><label class="rsw"><input type="checkbox" hidden id="c16"><span class="tr"><span class="kb">☾</span></span></label></div><script>document.getElementById('c16').addEventListener('change',function(e){document.querySelector('#c16 ~ .tr .kb').textContent=e.target.checked?'☀':'☾';});</script></body></html>
