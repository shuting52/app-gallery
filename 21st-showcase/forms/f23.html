<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>23 · 选项 stagger 下拉</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}.sel{position:relative}.sel .hd{background:#161c2b;border:1px solid #2a3350;border-radius:12px;padding:13px 14px;cursor:pointer;display:flex;justify-content:space-between;transition:border-color .3s}.sel.open .hd{border-color:#4f7cff}.sel .hd span{transition:transform .3s}.sel.open .hd span{transform:rotate(180deg)}.sel .opts{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#161c2b;border:1px solid #2a3350;border-radius:12px;overflow:hidden;display:none;z-index:5;box-shadow:0 12px 32px rgba(0,0,0,.5)}.sel.open .opts{display:block}.sel .opts div{padding:12px 14px;cursor:pointer;animation:oin .35s both}.sel .opts div:nth-child(2){animation-delay:.04s}.sel .opts div:nth-child(3){animation-delay:.08s}.sel .opts div:nth-child(4){animation-delay:.12s}.sel .opts div:nth-child(5){animation-delay:.16s}.sel .opts div:nth-child(6){animation-delay:.2s}@keyframes oin{from{opacity:0;transform:translateX(-14px)}}.sel .opts div:hover{background:rgba(79,124,255,.12)}</style></head><body><div class="t">23 · 选项 stagger 下拉</div><div class="wrap"><label class="lb">所在城市</label><div class="sel" id="s23"><div class="hd" id="h23">请选择 <span>▾</span></div><div class="opts" id="o23"><div>北京</div><div>上海</div><div>广州</div><div>深圳</div><div>杭州</div><div>成都</div></div></div></div><script>var s=document.getElementById('s23'),h=document.getElementById('h23');h.onclick=function(e){e.stopPropagation();s.classList.toggle('open')};document.getElementById('o23').addEventListener('click',function(e){if(e.target.tagName!=='DIV')return;h.innerHTML='';h.textContent=e.target.textContent;var sp=document.createElement('span');sp.textContent=' ▾';h.appendChild(sp);s.classList.remove('open');});document.addEventListener('click',function(){s.classList.remove('open')});</script></body></html>
