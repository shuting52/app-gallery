<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>06 · 密码可见切换</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}.pw{position:relative}.pw .inp{padding-right:48px;letter-spacing:2px}.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:20px;cursor:pointer;filter:grayscale(1);opacity:.6;transition:all .25s}.pw button.on{filter:none;opacity:1;animation:blink .3s}@keyframes blink{50%{transform:translateY(-50%) scale(1.35)}}.pw .inp.swap{animation:swap .3s}@keyframes swap{from{opacity:.2}}</style></head><body><div class="t">06 · 密码可见切换</div><div class="wrap"><label class="lb">密码</label><div class="pw"><input class="inp" type="password" id="pw6" value="hello2024"><button id="eye6" aria-label="切换可见">👁</button></div></div><script>var p=document.getElementById('pw6'),b=document.getElementById('eye6');b.onclick=function(){var show=p.type==='password';p.type=show?'text':'password';b.classList.toggle('on',show);b.textContent=show?'👀':'👁';p.classList.remove('swap');void p.offsetWidth;p.classList.add('swap');};</script></body></html>
