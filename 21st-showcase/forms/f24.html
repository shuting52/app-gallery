<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>24 · 手机号分段跳转</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}.ph{display:flex;align-items:center;gap:8px}.ph input{width:0;flex:1;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:18px;padding:12px 6px;text-align:center;outline:none;transition:border-color .3s;min-width:0}.ph input:focus{border-color:#4f7cff}.ph i{color:#5a6376;font-style:normal}.ph input.jump{animation:jmp .35s}@keyframes jmp{40%{transform:translateY(-6px)}}</style></head><body><div class="t">24 · 手机号分段跳转</div><div class="wrap"><label class="lb">手机号码</label><div class="ph" id="p24"><input maxlength="3" inputmode="numeric"><i>-</i><input maxlength="4" inputmode="numeric"><i>-</i><input maxlength="4" inputmode="numeric"></div></div><script>var ins=document.querySelectorAll('#p24 input');ins.forEach(function(inp,i){inp.addEventListener('input',function(){inp.value=inp.value.replace(/\D/g,'');if(inp.value.length>=+inp.maxLength&&i<ins.length-1){ins[i+1].focus();ins[i+1].classList.remove('jump');void ins[i+1].offsetWidth;ins[i+1].classList.add('jump');}});inp.addEventListener('keydown',function(e){if(e.key==='Backspace'&&!inp.value&&i>0)ins[i-1].focus();});});</script></body></html>
