<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>47 · 数字滚轮选择</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}.whl{height:150px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;background:#161c2b;border:1px solid #2a3350;border-radius:14px;mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent)}.whl::-webkit-scrollbar{display:none}.whl div{height:50px;display:grid;place-items:center;font-size:17px;color:#5a6376;scroll-snap-align:center;transition:all .2s}.whl div.sel{color:#fff;font-size:24px;font-weight:700;animation:whlp .3s}@keyframes whlp{40%{transform:scale(1.15)}}</style></head><body><div class="t">47 · 数字滚轮选择</div><div class="wrap"><label class="lb">选择年龄：<b id="v47" style="color:#4f7cff">25</b> 岁</label><div class="whl" id="w47"></div></div><script>var w=document.getElementById('w47'),v=document.getElementById('v47'),html='<div></div>';for(var i=18;i<=60;i++)html+='<div>'+i+'</div>';html+='<div></div>';w.innerHTML=html;var rows=w.querySelectorAll('div');function sel(){var wt=w.getBoundingClientRect().top,best=null,bd=1e9;rows.forEach(function(r){if(!r.textContent)return;var d=Math.abs(r.getBoundingClientRect().top-wt+r.offsetHeight/2-75);if(d<bd){bd=d;best=r;}});rows.forEach(function(r){r.classList.remove('sel')});if(best&&best.textContent){best.classList.add('sel');v.textContent=best.textContent;}}var tm;w.addEventListener('scroll',function(){clearTimeout(tm);tm=setTimeout(sel,120)});void w.offsetHeight;w.scrollTop=(25-18)*50;sel();</script></body></html>
