<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>41 · 图标弹跳输入框</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}.picon{position:relative}.picon input{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:12px;color:#fff;font-size:15px;padding:13px 12px 13px 46px;outline:none;transition:border-color .3s}.picon input:focus{border-color:#4f7cff}.picon span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:19px;display:inline-block}.picon span.bp{animation:icbp .5s}@keyframes icbp{30%{transform:translateY(-70%) scale(1.3)}60%{transform:translateY(-30%) scale(.92)}}</style></head><body><div class="t">41 · 图标弹跳输入框</div><div class="wrap"><label class="lb">搜索用户</label><div class="picon"><span id="ic41">🔍</span><input id="i41" placeholder="输入用户名搜索" autocomplete="off"></div></div><script>var i=document.getElementById('i41'),ic=document.getElementById('ic41');i.addEventListener('focus',function(){ic.classList.remove('bp');void ic.offsetWidth;ic.classList.add('bp');});</script></body></html>
