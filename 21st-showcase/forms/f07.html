<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>07 · 数字滚动计数器</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}.ctr{display:flex;align-items:center;gap:14px}.ctr button{width:44px;height:44px;border-radius:50%;border:1px solid #2a3350;background:#161c2b;color:#fff;font-size:22px;cursor:pointer;transition:all .2s}.ctr button:active{transform:scale(.88);background:#4f7cff;border-color:#4f7cff}.num{width:70px;height:44px;overflow:hidden;background:#161c2b;border:1px solid #2a3350;border-radius:12px;display:grid;place-items:center;font-size:20px;font-weight:700;color:#4f7cff}.num span{display:inline-block}.num span.up{animation:up .28s}@keyframes up{from{transform:translateY(100%);opacity:0}}.num span.dn{animation:dn .28s}@keyframes dn{from{transform:translateY(-100%);opacity:0}}</style></head><body><div class="t">07 · 数字滚动计数器</div><div class="wrap"><label class="lb">购买数量</label><div class="ctr"><button id="m7">−</button><div class="num"><span id="n7">1</span></div><button id="p7">＋</button></div></div><script>var n=1,el=document.getElementById('n7');function set(d){n=Math.max(1,Math.min(99,n+d));el.textContent=n;el.className='';void el.offsetWidth;el.className=d>0?'up':'dn';}document.getElementById('m7').onclick=function(){set(-1)};document.getElementById('p7').onclick=function(){set(1)};</script></body></html>
