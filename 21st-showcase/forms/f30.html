<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>30 · 垂直音量滑杆</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}.vsl{display:flex;justify-content:center;padding:6px 0}.vsl .tr{position:relative;width:44px;height:220px}.vsl .tr::before{content:'';position:absolute;left:18px;top:0;bottom:0;width:8px;border-radius:4px;background:#232a3d}.vsl .fl{position:absolute;left:18px;bottom:0;width:8px;border-radius:4px;background:linear-gradient(0deg,#4f7cff,#9d6bff)}.vsl .kb{position:absolute;left:11px;width:22px;height:22px;border-radius:50%;background:#fff;border:5px solid #4f7cff;transform:translateY(50%);cursor:grab;box-shadow:0 2px 10px rgba(79,124,255,.5)}</style></head><body><div class="t">30 · 垂直音量滑杆</div><div class="wrap"><label class="lb">音量 <b id="v30" style="color:#4f7cff">60</b></label><div class="vsl"><div class="tr"><div class="fl" id="f30"></div><div class="kb" id="k30"></div></div></div></div><script>var tr=document.querySelector('#f30').parentElement,fl=document.getElementById('f30'),kb=document.getElementById('k30'),v=document.getElementById('v30'),val=60,drag=false;function set(p){val=Math.round(Math.max(0,Math.min(100,p)));fl.style.height=val+'%';kb.style.bottom=val+'%';v.textContent=val;}kb.addEventListener('pointerdown',function(e){drag=true;kb.setPointerCapture(e.pointerId)});kb.addEventListener('pointermove',function(e){if(!drag)return;var r=tr.getBoundingClientRect();set((r.bottom-e.clientY)/r.height*100);});kb.addEventListener('pointerup',function(){drag=false});set(60);</script></body></html>
