<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>34 · 一键清空输入</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}.clr{position:relative}.clr button{position:absolute;right:8px;top:50%;width:30px;height:30px;border-radius:50%;border:none;background:#2a3350;color:#9aa3b5;font-size:14px;cursor:pointer;transform:translateY(-50%) scale(0);opacity:0;transition:all .25s}.clr button.show{transform:translateY(-50%) scale(1);opacity:1}.clr button:active{transform:translateY(-50%) scale(.85)}.clr .inp{transition:background .3s}.clr .inp.flash{animation:flash .35s}@keyframes flash{50%{background:#1c2a4a}}</style></head><body><div class="t">34 · 一键清空输入</div><div class="wrap"><label class="lb">备注</label><div class="clr"><input class="inp" id="i34" placeholder="写点什么…" autocomplete="off"><button id="x34">✕</button></div></div><script>var i=document.getElementById('i34'),x=document.getElementById('x34');i.addEventListener('input',function(){x.classList.toggle('show',!!i.value)});x.onclick=function(){i.value='';x.classList.remove('show');i.classList.remove('flash');void i.offsetWidth;i.classList.add('flash');i.focus()};</script></body></html>
