<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>05 · 波纹扩散单选</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}.rdo label{display:flex;align-items:center;gap:12px;padding:12px;background:#161c2b;border:1px solid #2a3350;border-radius:12px;margin-bottom:10px;cursor:pointer;transition:border-color .3s}.rdo label:has(input:checked){border-color:#4f7cff}.dot{position:relative;width:22px;height:22px;border:2px solid #3a4560;border-radius:50%;flex:none;transition:border-color .3s;overflow:hidden}.rdo label:has(input:checked) .dot{border-color:#4f7cff}.rdo label:has(input:checked) .dot::before{content:'';position:absolute;inset:5px;border-radius:50%;background:#4f7cff}.dot .rip{position:absolute;inset:0;border-radius:50%;background:rgba(79,124,255,.45);animation:rip .55s ease-out forwards;pointer-events:none}@keyframes rip{from{transform:scale(.2);opacity:1}to{transform:scale(2.4);opacity:0}}</style></head><body><div class="t">05 · 波纹扩散单选</div><div class="wrap"><label class="lb">支付方式</label><div class="rdo" id="g5"><label><input type="radio" name="p" hidden checked><span class="dot"></span>微信支付</label><label><input type="radio" name="p" hidden><span class="dot"></span>支付宝</label><label><input type="radio" name="p" hidden><span class="dot"></span>银行卡</label></div></div><script>document.getElementById('g5').addEventListener('change',function(e){var d=e.target.closest('label').querySelector('.dot');var s=document.createElement('span');s.className='rip';d.appendChild(s);setTimeout(function(){s.remove()},600);});</script></body></html>
