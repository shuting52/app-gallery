<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>11 · 拖拽上传区</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}.dz{border:2px dashed #3a4560;border-radius:16px;padding:34px 16px;text-align:center;cursor:pointer;transition:border-color .3s,background .3s}.dz .ic{font-size:40px;margin-bottom:8px}.dz p{color:#9aa3b5;font-size:14px}.dz b{color:#4f7cff}.dz.over{border-color:#4f7cff;background:rgba(79,124,255,.07)}.dz.over .ic{animation:bounce .6s infinite}@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}.dz.ok{border-style:solid;border-color:#22c55e}#n11{margin-top:8px;color:#22c55e;animation:enter .4s}</style></head><body><div class="t">11 · 拖拽上传区</div><div class="wrap"><label class="lb">上传头像</label><div class="dz" id="dz11"><div class="ic">📤</div><p>拖拽文件到此处，或 <b>点击选择</b></p><input type="file" id="f11" hidden></div><div class="lb" id="n11"></div></div><script>var dz=document.getElementById('dz11'),fi=document.getElementById('f11'),nm=document.getElementById('n11');dz.onclick=function(){fi.click()};['dragover','dragenter'].forEach(function(e){dz.addEventListener(e,function(ev){ev.preventDefault();dz.classList.add('over')})});['dragleave','drop'].forEach(function(e){dz.addEventListener(e,function(ev){ev.preventDefault();dz.classList.remove('over')})});dz.addEventListener('drop',function(ev){show(ev.dataTransfer.files[0]&&ev.dataTransfer.files[0].name)});fi.addEventListener('change',function(){show(fi.files[0]&&fi.files[0].name)});function show(n){if(!n)return;dz.classList.add('ok');nm.textContent='已选择：'+n;}</script></body></html>
