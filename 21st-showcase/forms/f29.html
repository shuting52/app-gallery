<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29 · 密码强度条</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}.pwst{display:flex;gap:6px;margin-top:10px}.pwst i{flex:1;height:8px;border-radius:4px;background:#232a3d;transition:background .3s}.pwst i.f{animation:bar .35s}@keyframes bar{from{transform:scaleY(.3)}}</style></head><body><div class="t">29 · 密码强度条</div><div class="wrap"><label class="lb">设置密码</label><input class="inp" type="password" id="p29" placeholder="6位以上，含字母+数字更安全"><div class="pwst" id="s29"><i></i><i></i><i></i><i></i></div><div class="lb" id="w29" style="margin-top:6px">请输入密码</div></div><script>var p=document.getElementById('p29'),bars=document.querySelectorAll('#s29 i'),w=document.getElementById('w29');var ws=['请输入密码','弱','一般','较强','很强'],cs=['#5a6376','#ef4444','#f59e0b','#22c55e','#22c55e'];p.addEventListener('input',function(){var v=p.value,s=0;if(v.length>=6)s++;if(/[a-zA-Z]/.test(v)&&/\d/.test(v))s++;if(v.length>=10)s++;if(/[^a-zA-Z0-9]/.test(v))s++;s=Math.min(4,v?Math.max(1,s):0);bars.forEach(function(b,i){var on=i<s;b.style.background=on?cs[s]:'#232a3d';if(on){b.classList.remove('f');void b.offsetWidth;b.classList.add('f');}});w.textContent=ws[s];w.style.color=cs[s];});</script></body></html>
