<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42 · 验证码倒计时</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:#0e1320;color:#e9edf5;font:15px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}.t{position:fixed;top:10px;left:12px;font-size:12px;color:#7d8699;z-index:9}.wrap{margin:auto;width:min(360px,92vw);padding:64px 0;animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.lb{display:block;font-size:13px;color:#9aa3b5;margin-bottom:8px}.inp{width:100%;background:#161c2b;border:1px solid #2a3350;border-radius:10px;color:#fff;font-size:16px;padding:12px;outline:none;transition:border-color .3s,box-shadow .3s}.inp:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.18)}.code{flex:none;padding:0 18px;border:none;border-radius:12px;background:#4f7cff;color:#fff;font-size:14px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}.code:disabled{background:#2a3350;color:#7d8699;cursor:default}.code.run{animation:codep 1s infinite}@keyframes codep{50%{box-shadow:0 0 0 5px rgba(79,124,255,.2)}}</style></head><body><div class="t">42 · 验证码倒计时</div><div class="wrap"><label class="lb">手机验证</label><div style="display:flex;gap:10px"><input class="inp" placeholder="手机号" inputmode="numeric" style="flex:1;min-width:0"><button class="code" id="b42">获取验证码</button></div></div><script>var b=document.getElementById('b42'),t=0,timer=null;b.onclick=function(){if(timer)return;t=10;b.disabled=true;b.classList.add('run');timer=setInterval(function(){t--;b.textContent=t+'s 后重发';if(t<=0){clearInterval(timer);timer=null;b.disabled=false;b.classList.remove('run');b.textContent='获取验证码';}},1000);b.textContent=t+'s 后重发';};</script></body></html>
