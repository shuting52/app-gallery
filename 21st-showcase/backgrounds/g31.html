<meta name="viewport" content="width=device-width,initial-scale=1">
<title>31 · DNA螺旋</title><style>
*{margin:0;box-sizing:border-box}html,body{height:100%}
body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#070a12;color:#fff;overflow:hidden}

<canvas id="v"></canvas>
<div class="center"><h1>生命密码</h1><p>基因检测品牌 · 双螺旋缓缓上升</p></div>
<script>
const c=document.getElementById('v'),g=c.getContext('2d');let W,H;const R=(a,b)=>a+Math.random()*(b-a);function rs(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener('resize',rs);rs();
let t=0;(function f(){t+=.04;g.fillStyle='#060a12';g.fillRect(0,0,W,H);const cx=W/2;
for(let y=-20;y<H+20;y+=26){const a=t+y/38,x1=cx+Math.sin(a)*86,x2=cx-Math.sin(a)*86;
g.fillStyle='#4dc3ff';g.beginPath();g.arc(x1,y,5,0,7);g.fill();
g.fillStyle='#ff7bd5';g.beginPath();g.arc(x2,y,5,0,7);g.fill();
g.strokeStyle='rgba(160,200,255,.35)';g.lineWidth=2;g.beginPath();g.moveTo(x1,y);g.lineTo(x2,y);g.stroke()}
requestAnimationFrame(f)})();
</script></body></html>
