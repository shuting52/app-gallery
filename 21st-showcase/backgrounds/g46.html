<div class="center"><h1>彩带漩涡</h1><p>庆典开幕背景 · 彩带绕中心旋转</p></div>
<script>
const c=document.getElementById('v'),g=c.getContext('2d');let W,H;const R=(a,b)=>a+Math.random()*(b-a);function rs(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener('resize',rs);rs();
let t=0;(function f(){t+=.012;g.fillStyle='rgba(8,6,16,.22)';g.fillRect(0,0,W,H);
const cx=W/2,cy=H/2;
for(let k=0;k<7;k++){g.strokeStyle='hsla('+((k*52+t*60)%360)+',90%,65%,.75)';g.lineWidth=5-k*.5;
g.beginPath();
for(let a=0;a<6.4;a+=.12){const r=20+a*26,x=cx+Math.cos(a+t*(1+k*.12)+k)*r,y=cy+Math.sin(a+t*(1+k*.12)+k)*r*.85;a?g.lineTo(x,y):g.moveTo(x,y)}
g.stroke()}

</script></body></html>
