<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>32 · 烈焰升腾</title><style>
*{margin:0;box-sizing:border-box}html,body{height:100%}
body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#070a12;color:#fff;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}
.tag{position:fixed;top:12px;left:12px;z-index:10;font-size:12px;color:rgba(255,255,255,.8);background:rgba(0,0,0,.38);padding:4px 10px;border-radius:99px;backdrop-filter:blur(4px);letter-spacing:1px}
.center{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 34px;pointer-events:none}
.center::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.5),rgba(0,0,0,.12) 65%,transparent 80%)}
h1{position:relative;font-size:30px;letter-spacing:6px;margin-bottom:12px;text-shadow:0 2px 14px rgba(0,0,0,.7)}
p{position:relative;font-size:13px;color:rgba(255,255,255,.82);line-height:1.9;text-shadow:0 1px 8px rgba(0,0,0,.7);max-width:300px}

</style></head><body>
<div class="tag">32 · 烈焰升腾</div>
<canvas id="v"></canvas>
<div class="center"><h1>烈焰激情</h1><p>火锅店开业 · 火焰向上翻腾</p></div>
<script>
const c=document.getElementById('v'),g=c.getContext('2d');let W,H;const R=(a,b)=>a+Math.random()*(b-a);function rs(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener('resize',rs);rs();
const F=[];function spawn(){F.push({x:W/2+R(-70,70),y:H+10,r:R(8,26),s:R(2,5.5),life:1})}
(function f(){g.fillStyle='rgba(8,3,2,.3)';g.fillRect(0,0,W,H);
for(let i=0;i<4;i++)spawn();
for(let i=F.length-1;i>=0;i--){const p=F[i];p.y-=p.s;p.r*=.985;p.life-=.012;
if(p.life<=0||p.r<2){F.splice(i,1);continue}
const gr=g.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
gr.addColorStop(0,'rgba(255,220,120,'+(.8*p.life)+')');gr.addColorStop(.5,'rgba(255,120,40,'+(.55*p.life)+')');gr.addColorStop(1,'transparent');
g.fillStyle=gr;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill()}
requestAnimationFrame(f)})();
</script></body></html>
