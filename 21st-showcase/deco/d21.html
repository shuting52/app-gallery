<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>21 · 螺旋彩带</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e1420;color:#e9f0fa;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden;padding:20px}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#93a7c4;letter-spacing:1px;z-index:5}
.stage{width:100%;max-width:380px;height:320px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.desc{margin-top:6px;font-size:14px;color:#9db2cc;text-align:center;line-height:1.9;padding:0 24px;max-width:380px}
.sp{position:relative;width:180px;height:180px;animation:spin 4.5s linear infinite;opacity:.92}
.sp i{position:absolute;top:50%;left:50%;width:160px;height:18px;margin:-9px 0 0 -80px;border-radius:9px}
.sp i:nth-child(1){background:linear-gradient(90deg,#ff5f8f,transparent);transform:rotate(0deg)}
.sp i:nth-child(2){background:linear-gradient(90deg,#4dd8ff,transparent);transform:rotate(60deg)}
.sp i:nth-child(3){background:linear-gradient(90deg,#f9f871,transparent);transform:rotate(120deg)}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="tag">21 · 螺旋彩带</div>
<div class="stage"><div class="sp"><i></i><i></i><i></i></div></div>
<p class="desc">三条彩带拧成螺旋，越转越有劲。</p>

</body>
</html>
