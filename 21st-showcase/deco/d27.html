<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>27 · 旋转齿轮</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e1420;color:#e9f0fa;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden;padding:20px}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#93a7c4;letter-spacing:1px;z-index:5}
.stage{width:100%;max-width:380px;height:320px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.desc{margin-top:6px;font-size:14px;color:#9db2cc;text-align:center;line-height:1.9;padding:0 24px;max-width:380px}
.gr{position:relative;width:180px;height:140px;color:#9db2cc}
.g1{position:absolute;left:16px;top:6px;font-size:88px;animation:spin 5s linear infinite}
.g2{position:absolute;right:12px;bottom:0;font-size:58px;animation:spinr 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
</style>
</head>
<body>
<div class="tag">27 · 旋转齿轮</div>
<div class="stage"><div class="gr"><span class="g1">⚙</span><span class="g2">⚙</span></div></div>
<p class="desc">齿轮咬合转动，机械感拉满。</p>

</body>
</html>
