<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>50 · 星轨</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e1420;color:#e9f0fa;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden;padding:20px}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#93a7c4;letter-spacing:1px;z-index:5}
.stage{width:100%;max-width:380px;height:320px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.desc{margin-top:6px;font-size:14px;color:#9db2cc;text-align:center;line-height:1.9;padding:0 24px;max-width:380px}
.so{position:relative;width:200px;height:200px}
.so i{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 68%,rgba(255,215,106,.95) 86%,transparent 100%);-webkit-mask:radial-gradient(farthest-side,transparent 76%,#000 79%);mask:radial-gradient(farthest-side,transparent 76%,#000 79%);animation:spin 3.2s linear infinite}
.so b{position:absolute;top:50%;left:50%;font-size:28px;color:#ffd76a;margin:-14px;text-shadow:0 0 16px #ffb300;animation:orb 3.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes orb{from{transform:rotate(0) translateX(78px)}to{transform:rotate(360deg) translateX(78px)}}
</style>
</head>
<body>
<div class="tag">50 · 星轨</div>
<div class="stage"><div class="so"><i></i><b>✦</b></div></div>
<p class="desc">星星拖着尾巴绕圈跑，画出光轨。</p>

</body>
</html>
