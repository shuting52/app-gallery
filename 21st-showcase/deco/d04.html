<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>04 · 旋转印章</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e1420;color:#e9f0fa;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden;padding:20px}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#93a7c4;letter-spacing:1px;z-index:5}
.stage{width:100%;max-width:380px;height:320px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.desc{margin-top:6px;font-size:14px;color:#9db2cc;text-align:center;line-height:1.9;padding:0 24px;max-width:380px}
.seal{width:132px;height:132px;border:4px solid #e23b3b;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 8px rgba(226,59,59,.14),inset 0 0 0 6px rgba(226,59,59,.12);animation:spin 7s linear infinite}
.seal span{font-size:54px;color:#e23b3b;font-weight:800}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="tag">04 · 旋转印章</div>
<div class="stage"><div class="seal"><span>印</span></div></div>
<p class="desc">圆形印章缓缓自转，朱砂红的仪式感。</p>

</body>
</html>
