<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>28 · 渐变流动字</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e1420;color:#e9f0fa;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden;padding:20px}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#93a7c4;letter-spacing:1px;z-index:5}
.stage{width:100%;max-width:380px;height:320px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.desc{margin-top:6px;font-size:14px;color:#9db2cc;text-align:center;line-height:1.9;padding:0 24px;max-width:380px}
.gt{font-size:58px;font-weight:800;letter-spacing:6px;background:linear-gradient(90deg,#ff5f8f,#ffb35f,#f9f871,#5fff8f,#5fbfff,#b45fff,#ff5f8f);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gflow 4.5s linear infinite}
@keyframes gflow{to{background-position:300% 0}}
</style>
</head>
<body>
<div class="tag">28 · 渐变流动字</div>
<div class="stage"><div class="gt">流光溢彩</div></div>
<p class="desc">彩虹渐变在文字里缓缓流动。</p>

</body>
</html>
