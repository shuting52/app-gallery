<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>16 · 雪花飘落</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e1420;color:#e9f0fa;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden;padding:20px}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#93a7c4;letter-spacing:1px;z-index:5}
.stage{width:100%;max-width:380px;height:320px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.desc{margin-top:6px;font-size:14px;color:#9db2cc;text-align:center;line-height:1.9;padding:0 24px;max-width:380px}
.sn{position:absolute;inset:0}
.sf{position:absolute;top:-24px;color:#eaf4ff;animation:fall linear infinite;text-shadow:0 0 8px rgba(234,244,255,.7)}
@keyframes fall{to{transform:translateY(390px) translateX(-30px) rotate(300deg)}}
</style>
</head>
<body>
<div class="tag">16 · 雪花飘落</div>
<div class="stage"><div class="sn" id="sn"></div></div>
<p class="desc">雪花静静飘落，冬天就要来了。</p>
<script>
(function(){var box=document.getElementById('sn');if(!box)return;
for(var i=0;i<30;i++){var s=document.createElement('i');s.className='sf';s.textContent='❄';
s.style.left=(Math.random()*100)+'%';s.style.fontSize=(10+Math.random()*16)+'px';
s.style.animationDuration=(3.6+Math.random()*3.4)+'s';s.style.animationDelay=(-Math.random()*7)+'s';
box.appendChild(s);}})();
</script>
</body>
</html>
