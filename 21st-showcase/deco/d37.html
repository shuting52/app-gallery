<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>37 · 彩带卷曲展开</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e1420;color:#e9f0fa;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden;padding:20px}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#93a7c4;letter-spacing:1px;z-index:5}
.stage{width:100%;max-width:380px;height:320px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.desc{margin-top:6px;font-size:14px;color:#9db2cc;text-align:center;line-height:1.9;padding:0 24px;max-width:380px}
.cu{display:flex;align-items:center}
.cu i{width:46px;height:28px;background:linear-gradient(135deg,#ffb35f,#ff5f8f);transform-origin:left center;animation:curl 3s ease-in-out infinite}
.cu i:first-child{border-radius:14px 0 0 14px}
.cu i:last-child{border-radius:0 14px 14px 0}
.cu i:nth-child(2){animation-delay:.18s}.cu i:nth-child(3){animation-delay:.36s}
.cu i:nth-child(4){animation-delay:.54s}.cu i:nth-child(5){animation-delay:.72s}
@keyframes curl{0%,100%{transform:rotate(0)}50%{transform:rotate(-155deg)}}
</style>
</head>
<body>
<div class="tag">37 · 彩带卷曲展开</div>
<div class="stage"><div class="cu"><i></i><i></i><i></i><i></i><i></i></div></div>
<p class="desc">卷曲的彩带慢慢舒展，像春天的藤蔓。</p>

</body>
</html>
