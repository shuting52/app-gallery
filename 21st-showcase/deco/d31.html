<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>31 · 涟漪圆环</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e1420;color:#e9f0fa;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden;padding:20px}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#93a7c4;letter-spacing:1px;z-index:5}
.stage{width:100%;max-width:380px;height:320px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.desc{margin-top:6px;font-size:14px;color:#9db2cc;text-align:center;line-height:1.9;padding:0 24px;max-width:380px}
.rp{position:relative;width:170px;height:170px}
.rp b{position:absolute;top:50%;left:50%;width:20px;height:20px;margin:-10px;background:#7df9ff;border-radius:50%;box-shadow:0 0 20px #4dd8ff;z-index:2}
.rp i{position:absolute;inset:0;border:2px solid #7df9ff;border-radius:50%;animation:rip 2.6s ease-out infinite}
.rp i:nth-child(2){animation-delay:.85s}
.rp i:nth-child(3){animation-delay:1.7s}
@keyframes rip{0%{transform:scale(.22);opacity:1}100%{transform:scale(1.15);opacity:0}}
</style>
</head>
<body>
<div class="tag">31 · 涟漪圆环</div>
<div class="stage"><div class="rp"><i></i><i></i><i></i><b></b></div></div>
<p class="desc">涟漪一圈圈向外散开，中心始终平静。</p>

</body>
</html>
