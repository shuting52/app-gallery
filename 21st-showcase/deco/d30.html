<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>30 · 月相轮转</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e1420;color:#e9f0fa;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden;padding:20px}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#93a7c4;letter-spacing:1px;z-index:5}
.stage{width:100%;max-width:380px;height:320px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.desc{margin-top:6px;font-size:14px;color:#9db2cc;text-align:center;line-height:1.9;padding:0 24px;max-width:380px}
.mn{width:112px;height:112px;border-radius:50%;background:#f4ead0;box-shadow:0 0 34px rgba(244,234,208,.55);position:relative;overflow:hidden}
.mn::after{content:"";position:absolute;inset:-2px;border-radius:50%;background:#0e1420;animation:phase 6.5s ease-in-out infinite}
@keyframes phase{0%{transform:translateX(-116px)}50%{transform:translateX(116px)}100%{transform:translateX(-116px)}}
</style>
</head>
<body>
<div class="tag">30 · 月相轮转</div>
<div class="stage"><div class="mn"></div></div>
<p class="desc">月亮从新月变满月，再慢慢亏下去。</p>

</body>
</html>
