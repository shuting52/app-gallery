<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>29 · 纸屑迸发</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e1420;color:#e9f0fa;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden;padding:20px}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#93a7c4;letter-spacing:1px;z-index:5}
.stage{width:100%;max-width:380px;height:320px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.desc{margin-top:6px;font-size:14px;color:#9db2cc;text-align:center;line-height:1.9;padding:0 24px;max-width:380px}
.bs{position:relative;width:220px;height:220px}
.bs b{position:absolute;top:50%;left:50%;font-size:34px;color:#ffd76a;transform:translate(-50%,-50%);text-shadow:0 0 18px #ffb300;z-index:2}
.bp{position:absolute;top:50%;left:50%;width:9px;height:9px;margin:-4.5px;border-radius:2px;animation:burst 2.6s ease-out infinite}
@keyframes burst{0%{transform:translate(0,0) scale(1);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.35);opacity:0}}
</style>
</head>
<body>
<div class="tag">29 · 纸屑迸发</div>
<div class="stage"><div class="bs" id="bs"><b>✦</b></div></div>
<p class="desc">纸屑从中心炸开，再悄悄聚拢。</p>
<script>
(function(){var box=document.getElementById('bs');if(!box)return;
var cs=['#ff5f8f','#ffb35f','#f9f871','#5fff8f','#5fbfff','#b45fff'];
for(var i=0;i<26;i++){var s=document.createElement('i');s.className='bp';
s.style.background=cs[i%cs.length];
var a=Math.random()*Math.PI*2,d=60+Math.random()*55;
s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');
s.style.animationDelay=(Math.random()*2.6)+'s';box.appendChild(s);}})();
</script>
</body>
</html>
