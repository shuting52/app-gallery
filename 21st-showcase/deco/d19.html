<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>19 · 菱形旋转</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e1420;color:#e9f0fa;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden;padding:20px}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#93a7c4;letter-spacing:1px;z-index:5}
.stage{width:100%;max-width:380px;height:320px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.desc{margin-top:6px;font-size:14px;color:#9db2cc;text-align:center;line-height:1.9;padding:0 24px;max-width:380px}
.dm{width:92px;height:92px;border-radius:14px;background:linear-gradient(135deg,#7c5cff,#4dd8ff);box-shadow:0 10px 30px rgba(124,92,255,.45);animation:dspin 2.4s cubic-bezier(.6,.05,.3,.95) infinite}
@keyframes dspin{0%{transform:rotate(45deg)}50%{transform:rotate(225deg) scale(.84)}100%{transform:rotate(405deg)}}
</style>
</head>
<body>
<div class="tag">19 · 菱形旋转</div>
<div class="stage"><div class="dm"></div></div>
<p class="desc">菱形方块不停旋转，像陀螺一样。</p>

</body>
</html>
