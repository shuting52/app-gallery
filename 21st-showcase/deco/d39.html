<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>39 · 风车旋转</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e1420;color:#e9f0fa;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden;padding:20px}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#93a7c4;letter-spacing:1px;z-index:5}
.stage{width:100%;max-width:380px;height:320px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.desc{margin-top:6px;font-size:14px;color:#9db2cc;text-align:center;line-height:1.9;padding:0 24px;max-width:380px}
.pw{position:relative;width:160px;height:160px;animation:spin 1.7s linear infinite}
.pw i{position:absolute;top:6px;left:50%;width:28px;height:64px;margin-left:-14px;transform-origin:50% 74px;border-radius:50% 50% 6px 6px}
.pw i:nth-child(1){background:#ff5f8f;transform:rotate(0deg)}
.pw i:nth-child(2){background:#ffb35f;transform:rotate(90deg)}
.pw i:nth-child(3){background:#5fff8f;transform:rotate(180deg)}
.pw i:nth-child(4){background:#5fbfff;transform:rotate(270deg)}
.pw b{position:absolute;top:50%;left:50%;width:18px;height:18px;margin:-9px;background:#fff;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.4);z-index:2}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="tag">39 · 风车旋转</div>
<div class="stage"><div class="pw"><i></i><i></i><i></i><i></i><b></b></div></div>
<p class="desc">四叶风车呼呼直转，风越大转越快。</p>

</body>
</html>
