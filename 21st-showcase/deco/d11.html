<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>11 · 旋转光环</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e1420;color:#e9f0fa;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden;padding:20px}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#93a7c4;letter-spacing:1px;z-index:5}
.stage{width:100%;max-width:380px;height:320px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.desc{margin-top:6px;font-size:14px;color:#9db2cc;text-align:center;line-height:1.9;padding:0 24px;max-width:380px}
.ring{width:160px;height:160px;border-radius:50%;background:conic-gradient(#ff5f8f,#ffb35f,#f9f871,#5fff8f,#5fbfff,#b45fff,#ff5f8f);-webkit-mask:radial-gradient(farthest-side,transparent 60%,#000 63%);mask:radial-gradient(farthest-side,transparent 60%,#000 63%);animation:spin 3.2s linear infinite;filter:saturate(1.5)}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="tag">11 · 旋转光环</div>
<div class="stage"><div class="ring"></div></div>
<p class="desc">七彩光环不停旋转，像土星的光环。</p>

</body>
</html>
