<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>18 · 流星划过</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e1420;color:#e9f0fa;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden;padding:20px}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#93a7c4;letter-spacing:1px;z-index:5}
.stage{width:100%;max-width:380px;height:320px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.desc{margin-top:6px;font-size:14px;color:#9db2cc;text-align:center;line-height:1.9;padding:0 24px;max-width:380px}
.sky{position:absolute;inset:0}
.mt{position:absolute;top:70px;left:-150px;width:130px;height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,#fff);animation:shoot 3s ease-in infinite}
.mt::before{content:"";position:absolute;right:-4px;top:-3.5px;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 14px #fff,0 0 30px #9adcff}
.mt.m2{top:190px;animation-delay:1.4s;transform:scale(.7)}
@keyframes shoot{0%{transform:translate(0,0) rotate(-16deg);opacity:0}8%{opacity:1}88%{opacity:1}100%{transform:translate(520px,150px) rotate(-16deg);opacity:0}}
</style>
</head>
<body>
<div class="tag">18 · 流星划过</div>
<div class="stage"><div class="sky"><div class="mt"></div><div class="mt m2"></div></div></div>
<p class="desc">流星拖着长尾巴，划破夜空。</p>

</body>
</html>
