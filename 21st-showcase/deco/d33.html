<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>33 · 星云旋转</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e1420;color:#e9f0fa;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden;padding:20px}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#93a7c4;letter-spacing:1px;z-index:5}
.stage{width:100%;max-width:380px;height:320px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.desc{margin-top:6px;font-size:14px;color:#9db2cc;text-align:center;line-height:1.9;padding:0 24px;max-width:380px}
.nb{position:relative;width:200px;height:200px;animation:spin 15s linear infinite}
.nb i{position:absolute;width:115px;height:115px;border-radius:50%;filter:blur(26px);opacity:.8}
.nb i:nth-child(1){background:#7c5cff;top:8px;left:22px}
.nb i:nth-child(2){background:#ff5f8f;bottom:12px;left:46px}
.nb i:nth-child(3){background:#4dd8ff;top:56px;right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="tag">33 · 星云旋转</div>
<div class="stage"><div class="nb"><i></i><i></i><i></i></div></div>
<p class="desc">彩色星云缓缓旋转，神秘又迷人。</p>

</body>
</html>
