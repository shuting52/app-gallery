<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>23 · 四角闪烁</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e1420;color:#e9f0fa;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden;padding:20px}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#93a7c4;letter-spacing:1px;z-index:5}
.stage{width:100%;max-width:380px;height:320px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.desc{margin-top:6px;font-size:14px;color:#9db2cc;text-align:center;line-height:1.9;padding:0 24px;max-width:380px}
.fc{position:relative;width:230px;height:150px}
.fc i{position:absolute;width:36px;height:36px;border:3px solid #5fffb0}
.fc .a{top:0;left:0;border-right:0;border-bottom:0;animation:blk 2s infinite}
.fc .b{top:0;right:0;border-left:0;border-bottom:0;animation:blk 2s .5s infinite}
.fc .c{bottom:0;left:0;border-right:0;border-top:0;animation:blk 2s 1s infinite}
.fc .d{bottom:0;right:0;border-left:0;border-top:0;animation:blk 2s 1.5s infinite}
.fc span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#cfe8d8;font-size:15px;letter-spacing:6px;text-indent:6px}
@keyframes blk{0%,100%{opacity:.22}50%{opacity:1}}
</style>
</head>
<body>
<div class="tag">23 · 四角闪烁</div>
<div class="stage"><div class="fc"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i><span>对焦中</span></div></div>
<p class="desc">四个角框轮流闪烁，像取景框在对焦。</p>

</body>
</html>
