<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>41 · 樱花旋落</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e1420;color:#e9f0fa;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden;padding:20px}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#93a7c4;letter-spacing:1px;z-index:5}
.stage{width:100%;max-width:380px;height:320px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.desc{margin-top:6px;font-size:14px;color:#9db2cc;text-align:center;line-height:1.9;padding:0 24px;max-width:380px}
.sk{position:absolute;inset:0}
.skp{position:absolute;top:-26px;width:15px;height:15px;background:linear-gradient(135deg,#ffe3ef,#ff9ec4);border-radius:80% 4px 80% 4px;animation:fall linear infinite;opacity:.95}
@keyframes fall{to{transform:translateY(390px) translateX(-70px) rotate(-720deg)}}
</style>
</head>
<body>
<div class="tag">41 · 樱花旋落</div>
<div class="stage"><div class="sk" id="sk"></div></div>
<p class="desc">樱花瓣旋着圈儿落下，春天限定。</p>
<script>
(function(){var box=document.getElementById('sk');if(!box)return;
for(var i=0;i<24;i++){var s=document.createElement('i');s.className='skp';
s.style.left=(30+Math.random()*70)+'%';
s.style.animationDuration=(3.8+Math.random()*3.2)+'s';s.style.animationDelay=(-Math.random()*7)+'s';
box.appendChild(s);}})();
</script>
</body>
</html>
