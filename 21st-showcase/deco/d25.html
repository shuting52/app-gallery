<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>25 · 气泡上升</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e1420;color:#e9f0fa;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden;padding:20px}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#93a7c4;letter-spacing:1px;z-index:5}
.stage{width:100%;max-width:380px;height:320px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.desc{margin-top:6px;font-size:14px;color:#9db2cc;text-align:center;line-height:1.9;padding:0 24px;max-width:380px}
.bb{position:absolute;inset:0}
.bl{position:absolute;bottom:-30px;border:2px solid rgba(157,216,255,.75);border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.45),transparent 55%);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-400px)}}
</style>
</head>
<body>
<div class="tag">25 · 气泡上升</div>
<div class="stage"><div class="bb" id="bb"></div></div>
<p class="desc">透明气泡咕嘟咕嘟往上冒。</p>
<script>
(function(){var box=document.getElementById('bb');if(!box)return;
for(var i=0;i<22;i++){var s=document.createElement('i');s.className='bl';
var d=8+Math.random()*22;s.style.width=d+'px';s.style.height=d+'px';
s.style.left=(Math.random()*100)+'%';
s.style.animationDuration=(2.8+Math.random()*3)+'s';s.style.animationDelay=(-Math.random()*5)+'s';
box.appendChild(s);}})();
</script>
</body>
</html>
