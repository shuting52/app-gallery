<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>10 · 飘落花瓣</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e1420;color:#e9f0fa;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden;padding:20px}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#93a7c4;letter-spacing:1px;z-index:5}
.stage{width:100%;max-width:380px;height:320px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.desc{margin-top:6px;font-size:14px;color:#9db2cc;text-align:center;line-height:1.9;padding:0 24px;max-width:380px}
.pt{position:absolute;inset:0}
.pl{position:absolute;top:-26px;width:17px;height:17px;background:linear-gradient(135deg,#ffc7dd,#ff7fae);border-radius:70% 5px 70% 5px;animation:fall linear infinite;opacity:.95}
@keyframes fall{to{transform:translateY(390px) translateX(46px) rotate(620deg)}}
</style>
</head>
<body>
<div class="tag">10 · 飘落花瓣</div>
<div class="stage"><div class="pt" id="pt"></div></div>
<p class="desc">粉色花瓣打着旋儿落下，温柔又缓慢。</p>
<script>
(function(){var box=document.getElementById('pt');if(!box)return;
for(var i=0;i<26;i++){var s=document.createElement('i');s.className='pl';
s.style.left=(Math.random()*100)+'%';
s.style.animationDuration=(3.4+Math.random()*3)+'s';s.style.animationDelay=(-Math.random()*6)+'s';
var sc=.7+Math.random()*.7;s.style.transform='scale('+sc+')';box.appendChild(s);}})();
</script>
</body>
</html>
