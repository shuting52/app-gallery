<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>13 · 缎带展开</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e1420;color:#e9f0fa;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden;padding:20px}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#93a7c4;letter-spacing:1px;z-index:5}
.stage{width:100%;max-width:380px;height:320px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.desc{margin-top:6px;font-size:14px;color:#9db2cc;text-align:center;line-height:1.9;padding:0 24px;max-width:380px}
.un{width:290px;height:56px;background:linear-gradient(90deg,#7c5cff,#4dd8ff);border-radius:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(124,92,255,.35);transform:scaleX(0);animation:unf 3.2s ease-in-out infinite}
.un span{color:#fff;font-size:19px;letter-spacing:10px;font-weight:800;text-indent:10px}
@keyframes unf{0%{transform:scaleX(0)}40%,70%{transform:scaleX(1)}100%{transform:scaleX(0)}}
</style>
</head>
<body>
<div class="tag">13 · 缎带展开</div>
<div class="stage"><div class="un"><span>开幕</span></div></div>
<p class="desc">缎带从中间向两边展开，像拉开的卷轴。</p>

</body>
</html>
