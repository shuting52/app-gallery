<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>22 · 波浪横幅</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e1420;color:#e9f0fa;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden;padding:20px}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#93a7c4;letter-spacing:1px;z-index:5}
.stage{width:100%;max-width:380px;height:320px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.desc{margin-top:6px;font-size:14px;color:#9db2cc;text-align:center;line-height:1.9;padding:0 24px;max-width:380px}
.wb{width:300px;height:58px;border-radius:29px;background:repeating-linear-gradient(115deg,#ff5f8f 0 18px,#ff7fae 18px 36px);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 26px rgba(255,95,143,.35);animation:wbg 2.2s linear infinite}
.wb span{color:#fff;font-weight:800;letter-spacing:8px;font-size:18px;text-indent:8px;text-shadow:0 2px 6px rgba(0,0,0,.25)}
@keyframes wbg{to{background-position:-72px 0}}
</style>
</head>
<body>
<div class="tag">22 · 波浪横幅</div>
<div class="stage"><div class="wb"><span>新品上市</span></div></div>
<p class="desc">条纹横幅像波浪一样左右涌动。</p>

</body>
</html>
