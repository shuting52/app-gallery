<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>06 · 虚线流动边框</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e1420;color:#e9f0fa;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden;padding:20px}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#93a7c4;letter-spacing:1px;z-index:5}
.stage{width:100%;max-width:380px;height:320px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.desc{margin-top:6px;font-size:14px;color:#9db2cc;text-align:center;line-height:1.9;padding:0 24px;max-width:380px}
.db{width:300px;height:170px}
.db rect{fill:none;stroke:#7c5cff;stroke-width:3;stroke-dasharray:16 10;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-52}}
.dbt{position:absolute;color:#cfc4ff;font-size:15px;letter-spacing:4px}
</style>
</head>
<body>
<div class="tag">06 · 虚线流动边框</div>
<div class="stage"><svg class="db" viewBox="0 0 300 170"><rect x="10" y="10" width="280" height="150" rx="16"/></svg><span class="dbt">流动中</span></div>
<p class="desc">虚线描边沿着方框不停奔跑，停不下来。</p>

</body>
</html>
