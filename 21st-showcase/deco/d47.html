<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>47 · 波浪旗帜</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e1420;color:#e9f0fa;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden;padding:20px}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#93a7c4;letter-spacing:1px;z-index:5}
.stage{width:100%;max-width:380px;height:320px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.desc{margin-top:6px;font-size:14px;color:#9db2cc;text-align:center;line-height:1.9;padding:0 24px;max-width:380px}
.fg{position:relative;width:190px;height:200px}
.fg i{display:block;width:7px;height:200px;background:linear-gradient(#8fa3bf,#5b6b84);border-radius:4px}
.fg span{position:absolute;top:8px;left:7px;width:158px;height:96px;background:linear-gradient(135deg,#ff5f5f,#ff8f5f);border-radius:0 10px 10px 0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:36px;font-weight:800;transform-origin:left center;box-shadow:6px 8px 20px rgba(255,95,95,.3);animation:wave 1.9s ease-in-out infinite}
@keyframes wave{0%,100%{transform:skewY(5deg) scaleX(1)}50%{transform:skewY(-5deg) scaleX(.93)}}
</style>
</head>
<body>
<div class="tag">47 · 波浪旗帜</div>
<div class="stage"><div class="fg"><i></i><span>旗</span></div></div>
<p class="desc">小旗子迎风招展，猎猎作响。</p>

</body>
</html>
