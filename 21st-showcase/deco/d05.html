<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>05 · 彩带飘落</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e1420;color:#e9f0fa;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden;padding:20px}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#93a7c4;letter-spacing:1px;z-index:5}
.stage{width:100%;max-width:380px;height:320px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.desc{margin-top:6px;font-size:14px;color:#9db2cc;text-align:center;line-height:1.9;padding:0 24px;max-width:380px}
.cf{position:absolute;inset:0}
.p{position:absolute;top:-22px;width:8px;height:14px;border-radius:2px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(380px) rotate(560deg)}}
</style>
</head>
<body>
<div class="tag">05 · 彩带飘落</div>
<div class="stage"><div class="cf" id="cf"></div></div>
<p class="desc">五彩纸屑从天而降，落在无声处。</p>
<script>
(function(){var box=document.getElementById('cf');if(!box)return;
var cs=['#ff5f8f','#ffb35f','#f9f871','#5fff8f','#5fbfff','#b45fff'];
for(var i=0;i<36;i++){var s=document.createElement('i');s.className='p';
s.style.left=(Math.random()*100)+'%';s.style.background=cs[i%cs.length];
s.style.animationDuration=(2.6+Math.random()*2.6)+'s';s.style.animationDelay=(-Math.random()*5)+'s';
if(i%3==0){s.style.borderRadius='50%';s.style.width='9px';s.style.height='9px';}
box.appendChild(s);}})();
</script>
</body>
</html>
