<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>45 · 花瓣旋转</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e1420;color:#e9f0fa;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden;padding:20px}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#93a7c4;letter-spacing:1px;z-index:5}
.stage{width:100%;max-width:380px;height:320px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.desc{margin-top:6px;font-size:14px;color:#9db2cc;text-align:center;line-height:1.9;padding:0 24px;max-width:380px}
.fl{position:relative;width:180px;height:180px;animation:spin 7.5s linear infinite}
.fl i{position:absolute;top:50%;left:50%;width:36px;height:72px;margin:-36px 0 0 -18px;background:linear-gradient(#ffc7dd,#ff7fae);border-radius:50% 50% 50% 50%/62% 62% 38% 38%;box-shadow:0 4px 12px rgba(255,127,174,.35)}
.fl b{position:absolute;top:50%;left:50%;width:32px;height:32px;margin:-16px;background:radial-gradient(circle at 35% 30%,#ffe9a8,#f5b301);border-radius:50%;box-shadow:0 0 18px #ffb300;z-index:2}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="tag">45 · 花瓣旋转</div>
<div class="stage"><div class="fl"><i style="transform:rotate(0deg) translateY(-56px)"></i><i style="transform:rotate(45deg) translateY(-56px)"></i><i style="transform:rotate(90deg) translateY(-56px)"></i><i style="transform:rotate(135deg) translateY(-56px)"></i><i style="transform:rotate(180deg) translateY(-56px)"></i><i style="transform:rotate(225deg) translateY(-56px)"></i><i style="transform:rotate(270deg) translateY(-56px)"></i><i style="transform:rotate(315deg) translateY(-56px)"></i><b></b></div></div>
<p class="desc">八片花瓣围着花心旋转，像小风车。</p>

</body>
</html>
