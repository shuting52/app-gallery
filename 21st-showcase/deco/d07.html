<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>07 · 光晕脉冲</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e1420;color:#e9f0fa;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden;padding:20px}
.tag{position:fixed;top:12px;left:14px;font-size:12px;color:#93a7c4;letter-spacing:1px;z-index:5}
.stage{width:100%;max-width:380px;height:320px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.desc{margin-top:6px;font-size:14px;color:#9db2cc;text-align:center;line-height:1.9;padding:0 24px;max-width:380px}
.halo{position:relative;width:130px;height:130px}
.core{position:absolute;inset:44px;background:#ffd76a;border-radius:50%;box-shadow:0 0 30px #ffb300}
.halo::before,.halo::after{content:"";position:absolute;inset:24px;border:2px solid #ffd76a;border-radius:50%;animation:pulse 2.2s ease-out infinite}
.halo::after{animation-delay:1.1s}
@keyframes pulse{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.7);opacity:0}}
</style>
</head>
<body>
<div class="tag">07 · 光晕脉冲</div>
<div class="stage"><div class="halo"><div class="core"></div></div></div>
<p class="desc">光晕一圈圈向外扩散，像水面的涟漪。</p>

</body>
</html>
