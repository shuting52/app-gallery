<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>27 · 心电波形</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0b0e14;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#fff;overflow-x:hidden}
.tag{position:fixed;top:10px;left:12px;z-index:60;font-size:12px;letter-spacing:.08em;color:#9aa3b8;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:99px}
.hero{position:relative;width:min(430px,100vw);min-height:100vh;min-height:100svh;overflow:hidden;display:flex;align-items:center;justify-content:center}
.bg{position:absolute;inset:0;overflow:hidden}
.content{position:relative;z-index:5;text-align:center;padding:0 30px;width:100%}
.kicker{font-size:12px;letter-spacing:.4em;text-indent:.4em;color:#ffb3b3;margin-bottom:16px;animation:kickIn 1s .45s both}
.ttl{font-size:33px;line-height:1.45;font-weight:800;margin-bottom:16px}
.sub{font-size:14px;line-height:1.9;color:rgba(255,255,255,.75);margin-bottom:30px;animation:fadeUp .9s .6s both}
.cta{display:inline-block;padding:14px 44px;border-radius:999px;font-size:15px;font-weight:700;color:#fff;text-decoration:none;background:linear-gradient(135deg,#ff3d3d,#ff7a3d);box-shadow:0 8px 30px rgba(255,70,70,.45);animation:fadeUp .9s .8s both;transition:transform .25s}
.cta:active{transform:scale(.94)}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes kickIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.ecg{position:absolute;top:44%;left:0;width:100%;height:120px}
.ecg path{fill:none;stroke:#ff5f5f;stroke-width:3;filter:drop-shadow(0 0 8px #ff3d3d);stroke-dasharray:640;stroke-dashoffset:640;animation:ecg 3.2s linear infinite}
@keyframes ecg{to{stroke-dashoffset:-640}}
.wv2{display:inline-block;animation:fadeUp .8s both,wave2 2.2s ease-in-out infinite}
@keyframes wave2{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
</style>
</head>
<body>
<div class="tag">27 · 心电波形</div>
<section class="hero">
<div class="bg"><svg class="ecg" viewBox="0 0 430 120" preserveAspectRatio="none"><path d="M0,60 L120,60 L140,60 L155,20 L175,100 L190,60 L260,60 L275,35 L295,85 L310,60 L430,60"/></svg></div>
<div class="content">
<div class="kicker">跑步 · 心跳跑团</div>
<h1 class="ttl"><span class="wv2" style="animation-delay:0.25s">跑</span><span class="wv2" style="animation-delay:0.29s">起</span><span class="wv2" style="animation-delay:0.34s">来</span><span class="wv2" style="animation-delay:0.39s">，</span><br><span class="wv2" style="animation-delay:0.43s">风</span><span class="wv2" style="animation-delay:0.47s">会</span><span class="wv2" style="animation-delay:0.52s">记</span><span class="wv2" style="animation-delay:0.56s">住</span><span class="wv2" style="animation-delay:0.61s">你</span></h1>
<p class="sub">城市跑团约跑与马拉松备赛计划。</p>
<a class="cta" href="#">加入跑团</a>
</div>
</section>

</body>
</html>
