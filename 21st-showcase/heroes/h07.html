<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>07 · 气泡上升</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0b0e14;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#fff;overflow-x:hidden}
.tag{position:fixed;top:10px;left:12px;z-index:60;font-size:12px;letter-spacing:.08em;color:#9aa3b8;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:99px}
.hero{position:relative;width:min(430px,100vw);min-height:100vh;min-height:100svh;overflow:hidden;display:flex;align-items:center;justify-content:center}
.bg{position:absolute;inset:0;overflow:hidden}
.content{position:relative;z-index:5;text-align:center;padding:0 30px;width:100%}
.kicker{font-size:12px;letter-spacing:.4em;text-indent:.4em;color:#9ff2ff;margin-bottom:16px;animation:kickIn 1s .45s both}
.ttl{font-size:33px;line-height:1.45;font-weight:800;margin-bottom:16px}
.sub{font-size:14px;line-height:1.9;color:rgba(255,255,255,.75);margin-bottom:30px;animation:fadeUp .9s .6s both}
.cta{display:inline-block;padding:14px 44px;border-radius:999px;font-size:15px;font-weight:700;color:#fff;text-decoration:none;background:linear-gradient(135deg,#0090c8,#00e0b8);box-shadow:0 8px 30px rgba(0,180,200,.4);animation:fadeUp .9s .8s both;transition:transform .25s}
.cta:active{transform:scale(.94)}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes kickIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.bg{background:linear-gradient(#04121f,#06283f 60%,#0a3d5c)}
.bb{position:absolute;bottom:-50px;border-radius:50%;border:2px solid rgba(160,240,255,.55);background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.35),transparent 60%);animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-480px) translateX(26px)}100%{transform:translateY(-980px) translateX(-14px)}}
.ttl{animation:slideR 1s .3s cubic-bezier(.2,.7,.2,1) both}
@keyframes slideR{from{opacity:0;transform:translateX(64px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="tag">07 · 气泡上升</div>
<section class="hero">
<div class="bg"><i class="bb" style="left:7%;width:14px;height:14px;animation-duration:5.33s;animation-delay:4.44s"></i><i class="bb" style="left:79%;width:21px;height:21px;animation-duration:10.11s;animation-delay:5.96s"></i><i class="bb" style="left:75%;width:10px;height:10px;animation-duration:10.99s;animation-delay:0.97s"></i><i class="bb" style="left:92%;width:20px;height:20px;animation-duration:7.41s;animation-delay:7.25s"></i><i class="bb" style="left:22%;width:14px;height:14px;animation-duration:8.67s;animation-delay:0.34s"></i><i class="bb" style="left:48%;width:28px;height:28px;animation-duration:10.07s;animation-delay:4.18s"></i><i class="bb" style="left:74%;width:32px;height:32px;animation-duration:9.65s;animation-delay:0.69s"></i><i class="bb" style="left:46%;width:10px;height:10px;animation-duration:5.66s;animation-delay:7.05s"></i><i class="bb" style="left:48%;width:30px;height:30px;animation-duration:7.71s;animation-delay:3.22s"></i><i class="bb" style="left:75%;width:26px;height:26px;animation-duration:9.47s;animation-delay:3.03s"></i><i class="bb" style="left:79%;width:12px;height:12px;animation-duration:6.97s;animation-delay:3.47s"></i><i class="bb" style="left:29%;width:13px;height:13px;animation-duration:6.33s;animation-delay:2.16s"></i><i class="bb" style="left:13%;width:27px;height:27px;animation-duration:6.84s;animation-delay:2.28s"></i><i class="bb" style="left:68%;width:31px;height:31px;animation-duration:9.70s;animation-delay:0.20s"></i></div>
<div class="content">
<div class="kicker">潜水 · 深蓝呼吸</div>
<h1 class="ttl">潜入 30 米的<br>寂静</h1>
<p class="sub">潜水考证、潜点攻略，从泳池到大蓝水。</p>
<a class="cta" href="#">预约体验潜</a>
</div>
</section>

</body>
</html>
