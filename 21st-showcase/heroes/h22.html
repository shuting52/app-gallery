<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>22 · 旋转齿轮</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0b0e14;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#fff;overflow-x:hidden}
.tag{position:fixed;top:10px;left:12px;z-index:60;font-size:12px;letter-spacing:.08em;color:#9aa3b8;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:99px}
.hero{position:relative;width:min(430px,100vw);min-height:100vh;min-height:100svh;overflow:hidden;display:flex;align-items:center;justify-content:center}
.bg{position:absolute;inset:0;overflow:hidden}
.content{position:relative;z-index:5;text-align:center;padding:0 30px;width:100%}
.kicker{font-size:12px;letter-spacing:.4em;text-indent:.4em;color:#ffd9a8;margin-bottom:16px;animation:kickIn 1s .45s both}
.ttl{font-size:33px;line-height:1.45;font-weight:800;margin-bottom:16px}
.sub{font-size:14px;line-height:1.9;color:rgba(255,255,255,.75);margin-bottom:30px;animation:fadeUp .9s .6s both}
.cta{display:inline-block;padding:14px 44px;border-radius:999px;font-size:15px;font-weight:700;color:#fff;text-decoration:none;background:linear-gradient(135deg,#8a5a2e,#d8a03d);box-shadow:0 8px 30px rgba(200,140,50,.4);animation:fadeUp .9s .8s both;transition:transform .25s}
.cta:active{transform:scale(.94)}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes kickIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.gr{position:absolute;top:50%;left:50%;border-radius:50%;transform:translate(-50%,-50%)}
.g1{width:520px;height:520px;border:10px dashed rgba(255,200,120,.28);animation:spin 36s linear infinite}
.g2{width:380px;height:380px;border:6px dashed rgba(255,200,120,.2);animation:spin 26s linear infinite reverse}
.dot{position:absolute;top:50%;left:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:#ffcf7d}
.ttl{animation:tiltIn 1s .3s both}
@keyframes tiltIn{from{opacity:0;transform:translateX(-46px) skewX(-14deg)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="tag">22 · 旋转齿轮</div>
<section class="hero">
<div class="bg"><div class="gr g1"></div><div class="gr g2"></div><div class="dot"></div></div>
<div class="content">
<div class="kicker">工具 · 匠人工坊</div>
<h1 class="ttl">好工具，<br>配得上热爱</h1>
<p class="sub">木工、皮具、陶艺工具测评，手工人的装备库。</p>
<a class="cta" href="#">逛装备库</a>
</div>
</section>

</body>
</html>
