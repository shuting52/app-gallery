<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>04 · 网格透视</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0b0e14;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#fff;overflow-x:hidden}
.tag{position:fixed;top:10px;left:12px;z-index:60;font-size:12px;letter-spacing:.08em;color:#9aa3b8;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:99px}
.hero{position:relative;width:min(430px,100vw);min-height:100vh;min-height:100svh;overflow:hidden;display:flex;align-items:center;justify-content:center}
.bg{position:absolute;inset:0;overflow:hidden}
.content{position:relative;z-index:5;text-align:center;padding:0 30px;width:100%}
.kicker{font-size:12px;letter-spacing:.4em;text-indent:.4em;color:#8affda;margin-bottom:16px;animation:kickIn 1s .45s both}
.ttl{font-size:33px;line-height:1.45;font-weight:800;margin-bottom:16px}
.sub{font-size:14px;line-height:1.9;color:rgba(255,255,255,.75);margin-bottom:30px;animation:fadeUp .9s .6s both}
.cta{display:inline-block;padding:14px 44px;border-radius:999px;font-size:15px;font-weight:700;color:#fff;text-decoration:none;background:linear-gradient(135deg,#00c389,#00e0ff);box-shadow:0 8px 30px rgba(0,200,150,.4);animation:fadeUp .9s .8s both;transition:transform .25s}
.cta:active{transform:scale(.94)}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes kickIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.grid{position:absolute;left:-60%;right:-60%;bottom:-12%;height:62%;
background-image:linear-gradient(rgba(0,255,200,.35) 2px,transparent 2px),linear-gradient(90deg,rgba(0,255,200,.35) 2px,transparent 2px);
background-size:44px 44px;transform:perspective(420px) rotateX(58deg);transform-origin:bottom;animation:gm 1.6s linear infinite}
@keyframes gm{from{background-position:0 0,0 0}to{background-position:0 44px,0 0}}
.hz{position:absolute;top:38%;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#00ffc8,transparent);box-shadow:0 0 24px #00ffc8}
.ttl{animation:flipIn 1s .3s both;transform-origin:center}
@keyframes flipIn{from{opacity:0;transform:perspective(600px) rotateX(82deg)}to{opacity:1;transform:perspective(600px) rotateX(0)}}
</style>
</head>
<body>
<div class="tag">04 · 网格透视</div>
<section class="hero">
<div class="bg"><div class="hz"></div><div class="grid"></div></div>
<div class="content">
<div class="kicker">游戏 · 像素边境</div>
<h1 class="ttl">进入 8-bit 的<br>冒险宇宙</h1>
<p class="sub">复古像素风手游合集，找回最初的心跳。</p>
<a class="cta" href="#">开始冒险</a>
</div>
</section>

</body>
</html>
