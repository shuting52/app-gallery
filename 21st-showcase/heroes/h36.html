<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>36 · 极光帘幕</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0b0e14;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#fff;overflow-x:hidden}
.tag{position:fixed;top:10px;left:12px;z-index:60;font-size:12px;letter-spacing:.08em;color:#9aa3b8;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:99px}
.hero{position:relative;width:min(430px,100vw);min-height:100vh;min-height:100svh;overflow:hidden;display:flex;align-items:center;justify-content:center}
.bg{position:absolute;inset:0;overflow:hidden}
.content{position:relative;z-index:5;text-align:center;padding:0 30px;width:100%}
.kicker{font-size:12px;letter-spacing:.4em;text-indent:.4em;color:#b8ffe8;margin-bottom:16px;animation:kickIn 1s .45s both}
.ttl{font-size:33px;line-height:1.45;font-weight:800;margin-bottom:16px}
.sub{font-size:14px;line-height:1.9;color:rgba(255,255,255,.75);margin-bottom:30px;animation:fadeUp .9s .6s both}
.cta{display:inline-block;padding:14px 44px;border-radius:999px;font-size:15px;font-weight:700;color:#fff;text-decoration:none;background:linear-gradient(135deg,#00c389,#2e9bff);box-shadow:0 8px 30px rgba(0,200,150,.45);animation:fadeUp .9s .8s both;transition:transform .25s}
.cta:active{transform:scale(.94)}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes kickIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.bg{background:#040d18}
.cur{position:absolute;top:-10%;bottom:-10%;width:90px;filter:blur(24px);opacity:.75;transform-origin:top;animation:curS 7s ease-in-out infinite alternate}
@keyframes curS{from{transform:skewX(-9deg)}to{transform:skewX(11deg)}}
.ttl{animation:splitOpen 1.2s .35s both}
@keyframes splitOpen{from{clip-path:inset(46% 0 46% 0);opacity:.4}to{clip-path:inset(0 0 0 0);opacity:1}}
</style>
</head>
<body>
<div class="tag">36 · 极光帘幕</div>
<section class="hero">
<div class="bg"><div class="cur" style="left:6%;background:linear-gradient(#00ffb0,#006bff);animation-delay:0s"></div><div class="cur" style="left:24%;background:linear-gradient(#7b5cff,#00e0ff);animation-delay:-2s"></div><div class="cur" style="left:42%;background:linear-gradient(#00e0b8,#7bff9e);animation-delay:-4s"></div><div class="cur" style="left:60%;background:linear-gradient(#2e9bff,#c44dff);animation-delay:-1s"></div><div class="cur" style="left:78%;background:linear-gradient(#00ffc8,#2e9bff);animation-delay:-5s"></div></div>
<div class="content">
<div class="kicker">极地 · 极光之境</div>
<h1 class="ttl">去世界尽头<br>看极光</h1>
<p class="sub">极地旅行定制，冰岛挪威芬兰追光之旅。</p>
<a class="cta" href="#">定制行程</a>
</div>
</section>

</body>
</html>
