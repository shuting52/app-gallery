<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>01 · 极光漂移</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0b0e14;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#fff;overflow-x:hidden}
.tag{position:fixed;top:10px;left:12px;z-index:60;font-size:12px;letter-spacing:.08em;color:#9aa3b8;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:99px}
.hero{position:relative;width:min(430px,100vw);min-height:100vh;min-height:100svh;overflow:hidden;display:flex;align-items:center;justify-content:center}
.bg{position:absolute;inset:0;overflow:hidden}
.content{position:relative;z-index:5;text-align:center;padding:0 30px;width:100%}
.kicker{font-size:12px;letter-spacing:.4em;text-indent:.4em;color:#a9b4ff;margin-bottom:16px;animation:kickIn 1s .45s both}
.ttl{font-size:33px;line-height:1.45;font-weight:800;margin-bottom:16px}
.sub{font-size:14px;line-height:1.9;color:rgba(255,255,255,.75);margin-bottom:30px;animation:fadeUp .9s .6s both}
.cta{display:inline-block;padding:14px 44px;border-radius:999px;font-size:15px;font-weight:700;color:#fff;text-decoration:none;background:linear-gradient(135deg,#5b5cff,#9b5cff);box-shadow:0 8px 30px rgba(91,92,255,.45);animation:fadeUp .9s .8s both;transition:transform .25s}
.cta:active{transform:scale(.94)}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes kickIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.bl{position:absolute;border-radius:50%;filter:blur(70px);opacity:.7}
.b1{width:340px;height:340px;background:#5b5cff;top:-60px;left:-80px;animation:dr1 14s ease-in-out infinite alternate}
.b2{width:300px;height:300px;background:#00e0b8;bottom:-40px;right:-60px;animation:dr2 18s ease-in-out infinite alternate}
.b3{width:260px;height:260px;background:#ff5fa2;top:42%;left:32%;animation:dr3 16s ease-in-out infinite alternate}
@keyframes dr1{to{transform:translate(120px,90px) scale(1.2)}}
@keyframes dr2{to{transform:translate(-100px,-70px) scale(1.15)}}
@keyframes dr3{to{transform:translate(-90px,80px) scale(.85)}}
.ttl{animation:ttlUp 1.1s .25s cubic-bezier(.2,.7,.2,1) both}
@keyframes ttlUp{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="tag">01 · 极光漂移</div>
<section class="hero">
<div class="bg"><div class="bl b1"></div><div class="bl b2"></div><div class="bl b3"></div></div>
<div class="content">
<div class="kicker">效率工具 · 晨光计划</div>
<h1 class="ttl">把每一天，<br>过成作品</h1>
<p class="sub">日程、待办与专注计时，一处安放，井然有序。</p>
<a class="cta" href="#">免费开始使用</a>
</div>
</section>

</body>
</html>
