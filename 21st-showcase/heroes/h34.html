<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>34 · 水波纹</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0b0e14;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#fff;overflow-x:hidden}
.tag{position:fixed;top:10px;left:12px;z-index:60;font-size:12px;letter-spacing:.08em;color:#9aa3b8;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:99px}
.hero{position:relative;width:min(430px,100vw);min-height:100vh;min-height:100svh;overflow:hidden;display:flex;align-items:center;justify-content:center}
.bg{position:absolute;inset:0;overflow:hidden}
.content{position:relative;z-index:5;text-align:center;padding:0 30px;width:100%}
.kicker{font-size:12px;letter-spacing:.4em;text-indent:.4em;color:#b8ecff;margin-bottom:16px;animation:kickIn 1s .45s both}
.ttl{font-size:33px;line-height:1.45;font-weight:800;margin-bottom:16px}
.sub{font-size:14px;line-height:1.9;color:rgba(255,255,255,.75);margin-bottom:30px;animation:fadeUp .9s .6s both}
.cta{display:inline-block;padding:14px 44px;border-radius:999px;font-size:15px;font-weight:700;color:#fff;text-decoration:none;background:linear-gradient(135deg,#0090c8,#00d0c8);box-shadow:0 8px 30px rgba(0,170,200,.45);animation:fadeUp .9s .8s both;transition:transform .25s}
.cta:active{transform:scale(.94)}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes kickIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.bg{background:linear-gradient(#06283f,#0a4a6e 60%,#0d5f8a)}
.wr{position:absolute;top:52%;left:50%;border:2px solid rgba(160,230,255,.5);border-radius:50%;transform:translate(-50%,-50%);animation:wr 3s ease-out infinite}
@keyframes wr{from{width:60px;height:26px;opacity:1}to{width:380px;height:150px;opacity:0}}
.ttl{animation:mirrorIn 1.1s .35s both}
@keyframes mirrorIn{from{opacity:0;transform:scaleY(-1)}to{opacity:1;transform:scaleY(1)}}
</style>
</head>
<body>
<div class="tag">34 · 水波纹</div>
<section class="hero">
<div class="bg"><div class="wr"></div><div class="wr" style="animation-delay:1s"></div><div class="wr" style="animation-delay:2s"></div></div>
<div class="content">
<div class="kicker">游泳 · 碧波泳池</div>
<h1 class="ttl">像鱼一样<br>自由</h1>
<p class="sub">成人零基础学游泳，泳姿纠正视频课。</p>
<a class="cta" href="#">预约试课</a>
</div>
</section>

</body>
</html>
