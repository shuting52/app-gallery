<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>29 · 浮动云朵</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0b0e14;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#fff;overflow-x:hidden}
.tag{position:fixed;top:10px;left:12px;z-index:60;font-size:12px;letter-spacing:.08em;color:#9aa3b8;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:99px}
.hero{position:relative;width:min(430px,100vw);min-height:100vh;min-height:100svh;overflow:hidden;display:flex;align-items:center;justify-content:center}
.bg{position:absolute;inset:0;overflow:hidden}
.content{position:relative;z-index:5;text-align:center;padding:0 30px;width:100%}
.kicker{font-size:12px;letter-spacing:.4em;text-indent:.4em;color:#41618c;margin-bottom:16px;animation:kickIn 1s .45s both}
.ttl{font-size:33px;line-height:1.45;font-weight:800;margin-bottom:16px}
.sub{font-size:14px;line-height:1.9;color:rgba(255,255,255,.75);margin-bottom:30px;animation:fadeUp .9s .6s both}
.cta{display:inline-block;padding:14px 44px;border-radius:999px;font-size:15px;font-weight:700;color:#fff;text-decoration:none;background:linear-gradient(135deg,#2e9bff,#00d0c8);box-shadow:0 8px 30px rgba(60,160,255,.4);animation:fadeUp .9s .8s both;transition:transform .25s}
.cta:active{transform:scale(.94)}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes kickIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.bg{background:linear-gradient(#7db9e8,#cfe8ff 55%,#eef7ff)}
.cl{position:absolute;background:#fff;border-radius:999px;opacity:.92;animation:clM linear infinite}
.cl::before,.cl::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cl::before{width:58%;height:120%;top:-62%;left:14%}.cl::after{width:42%;height:88%;top:-42%;right:16%}
@keyframes clM{from{transform:translateX(-220px)}to{transform:translateX(560px)}}
.bn{display:inline-block;color:#12315e;opacity:0;animation:bnc .7s both}
@keyframes bnc{0%{opacity:0;transform:translateY(-38px)}60%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:none}}
.sub{color:rgba(18,49,94,.75)!important}
</style>
</head>
<body>
<div class="tag">29 · 浮动云朵</div>
<section class="hero">
<div class="bg"><div class="cl" style="top:12%;width:150px;height:44px;animation-duration:26s;animation-delay:-6s"></div><div class="cl" style="top:26%;width:110px;height:34px;animation-duration:20s;animation-delay:-14s"></div><div class="cl" style="top:44%;width:180px;height:52px;animation-duration:32s;animation-delay:-20s"></div><div class="cl" style="top:62%;width:120px;height:36px;animation-duration:24s;animation-delay:-9s"></div></div>
<div class="content">
<div class="kicker">旅行 · 云端漫步</div>
<h1 class="ttl"><span class="bn" style="animation-delay:0.25s">在</span><span class="bn" style="animation-delay:0.29s">云</span><span class="bn" style="animation-delay:0.34s">上</span><span class="bn" style="animation-delay:0.39s">面</span><span class="bn" style="animation-delay:0.43s">，</span><br><span class="bn" style="animation-delay:0.47s">看</span><span class="bn" style="animation-delay:0.52s">世</span><span class="bn" style="animation-delay:0.56s">界</span></h1>
<p class="sub">高空项目体验：热气球、滑翔伞、低空飞行。</p>
<a class="cta" href="#">预订体验</a>
</div>
</section>

</body>
</html>
