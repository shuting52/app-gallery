<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>13 · 霓虹地平线</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0b0e14;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#fff;overflow-x:hidden}
.tag{position:fixed;top:10px;left:12px;z-index:60;font-size:12px;letter-spacing:.08em;color:#9aa3b8;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:99px}
.hero{position:relative;width:min(430px,100vw);min-height:100vh;min-height:100svh;overflow:hidden;display:flex;align-items:center;justify-content:center}
.bg{position:absolute;inset:0;overflow:hidden}
.content{position:relative;z-index:5;text-align:center;padding:0 30px;width:100%}
.kicker{font-size:12px;letter-spacing:.4em;text-indent:.4em;color:#ffb3d9;margin-bottom:16px;animation:kickIn 1s .45s both}
.ttl{font-size:33px;line-height:1.45;font-weight:800;margin-bottom:16px}
.sub{font-size:14px;line-height:1.9;color:rgba(255,255,255,.75);margin-bottom:30px;animation:fadeUp .9s .6s both}
.cta{display:inline-block;padding:14px 44px;border-radius:999px;font-size:15px;font-weight:700;color:#fff;text-decoration:none;background:linear-gradient(135deg,#ff2e88,#ff7a3d);box-shadow:0 8px 30px rgba(255,46,136,.45);animation:fadeUp .9s .8s both;transition:transform .25s}
.cta:active{transform:scale(.94)}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes kickIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.bg{background:linear-gradient(#0d0618 55%,#2b0a3d 78%,#0d0618)}
.sun{position:absolute;top:16%;left:50%;transform:translateX(-50%);width:210px;height:210px;border-radius:50%;
background:linear-gradient(#ffe36b 20%,#ff7a3d 55%,#ff2e88);box-shadow:0 0 60px rgba(255,80,140,.7);overflow:hidden}
.sun::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(transparent 0 14px,rgba(13,6,24,.85) 14px 20px);animation:sunUp 8s linear infinite}
@keyframes sunUp{to{background-position:0 40px}}
.grid{position:absolute;left:-60%;right:-60%;bottom:-8%;height:52%;
background-image:linear-gradient(rgba(255,46,136,.4) 2px,transparent 2px),linear-gradient(90deg,rgba(255,46,136,.4) 2px,transparent 2px);
background-size:44px 44px;transform:perspective(420px) rotateX(58deg);transform-origin:bottom;animation:gm 1.4s linear infinite}
@keyframes gm{from{background-position:0 0,0 0}to{background-position:0 44px,0 0}}
.ttl{animation:slideD 1s .3s cubic-bezier(.2,.7,.2,1) both}
@keyframes slideD{from{opacity:0;transform:translateY(-56px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="tag">13 · 霓虹地平线</div>
<section class="hero">
<div class="bg"><div class="sun"></div><div class="grid"></div></div>
<div class="content">
<div class="kicker">运动 · 极速引擎</div>
<h1 class="ttl">快，是<br>唯一的语言</h1>
<p class="sub">骑行路线与装备评测，和风一起出发。</p>
<a class="cta" href="#">加入骑行团</a>
</div>
</section>

</body>
</html>
