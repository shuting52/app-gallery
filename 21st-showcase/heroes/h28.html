<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>28 · 同心脉冲</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0b0e14;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#fff;overflow-x:hidden}
.tag{position:fixed;top:10px;left:12px;z-index:60;font-size:12px;letter-spacing:.08em;color:#9aa3b8;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:99px}
.hero{position:relative;width:min(430px,100vw);min-height:100vh;min-height:100svh;overflow:hidden;display:flex;align-items:center;justify-content:center}
.bg{position:absolute;inset:0;overflow:hidden}
.content{position:relative;z-index:5;text-align:center;padding:0 30px;width:100%}
.kicker{font-size:12px;letter-spacing:.4em;text-indent:.4em;color:#ffd9e8;margin-bottom:16px;animation:kickIn 1s .45s both}
.ttl{font-size:33px;line-height:1.45;font-weight:800;margin-bottom:16px}
.sub{font-size:14px;line-height:1.9;color:rgba(255,255,255,.75);margin-bottom:30px;animation:fadeUp .9s .6s both}
.cta{display:inline-block;padding:14px 44px;border-radius:999px;font-size:15px;font-weight:700;color:#fff;text-decoration:none;background:linear-gradient(135deg,#ff7ab0,#ff9a5f);box-shadow:0 8px 30px rgba(255,130,160,.45);animation:fadeUp .9s .8s both;transition:transform .25s}
.cta:active{transform:scale(.94)}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes kickIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.pu{position:absolute;top:46%;left:50%;border:3px solid rgba(255,150,180,.6);border-radius:50%;transform:translate(-50%,-50%);animation:pu 3s ease-out infinite}
@keyframes pu{from{width:40px;height:40px;opacity:1}to{width:420px;height:420px;opacity:0}}
.ttl{animation:elastic 1s .3s both}
@keyframes elastic{0%{opacity:0;transform:scale(.3)}55%{opacity:1;transform:scale(1.12)}75%{transform:scale(.96)}100%{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div class="tag">28 · 同心脉冲</div>
<section class="hero">
<div class="bg"><div class="pu" style="animation-delay:0s"></div><div class="pu" style="animation-delay:1s"></div><div class="pu" style="animation-delay:2s"></div></div>
<div class="content">
<div class="kicker">宠物 · 萌宠星球</div>
<h1 class="ttl">毛茸茸的<br>治愈力</h1>
<p class="sub">领养代替购买，科学养宠指南与萌宠社区。</p>
<a class="cta" href="#">云吸猫</a>
</div>
</section>

</body>
</html>
