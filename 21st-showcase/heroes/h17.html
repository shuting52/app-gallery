.tag{position:fixed;top:10px;left:12px;z-index:60;font-size:12px;letter-spacing:.08em;color:#9aa3b8;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:99px}

.cta{display:inline-block;padding:14px 44px;border-radius:999px;font-size:15px;font-weight:700;color:#fff;text-decoration:none;background:linear-gradient(135deg,#2e7bff,#00d0ff);box-shadow:0 8px 30px rgba(60,140,255,.45);animation:fadeUp .9s .8s both;transition:transform .25s}

@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes kickIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.bg{background:linear-gradient(#0a1830,#12315e 70%,#1b4a86)}
.sn{position:absolute;top:-20px;background:#fff;border-radius:50%;opacity:.9;animation:snow linear infinite}
@keyframes snow{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(470px) translateX(30px)}100%{transform:translateY(950px) translateX(-18px)}}
.rc{display:inline-block;opacity:0;animation:rainCh .7s both}
@keyframes rainCh{from{opacity:0;transform:translateY(-46px)}to{opacity:1;transform:none}}
