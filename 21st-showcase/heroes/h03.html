<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>03 · 波浪层叠</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0b0e14;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#fff;overflow-x:hidden}
.tag{position:fixed;top:10px;left:12px;z-index:60;font-size:12px;letter-spacing:.08em;color:#9aa3b8;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:99px}
.hero{position:relative;width:min(430px,100vw);min-height:100vh;min-height:100svh;overflow:hidden;display:flex;align-items:center;justify-content:center}
.bg{position:absolute;inset:0;overflow:hidden}
.content{position:relative;z-index:5;text-align:center;padding:0 30px;width:100%}
.kicker{font-size:12px;letter-spacing:.4em;text-indent:.4em;color:#ffd9a8;margin-bottom:16px;animation:kickIn 1s .45s both}
.ttl{font-size:33px;line-height:1.45;font-weight:800;margin-bottom:16px}
.sub{font-size:14px;line-height:1.9;color:rgba(255,255,255,.75);margin-bottom:30px;animation:fadeUp .9s .6s both}
.cta{display:inline-block;padding:14px 44px;border-radius:999px;font-size:15px;font-weight:700;color:#fff;text-decoration:none;background:linear-gradient(135deg,#ff7a3d,#ff3d68);box-shadow:0 8px 30px rgba(255,90,60,.45);animation:fadeUp .9s .8s both;transition:transform .25s}
.cta:active{transform:scale(.94)}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes kickIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.wv{position:absolute;left:-25%;width:150%;height:280px;border-radius:42%;opacity:.5}
.w1{bottom:-140px;background:#ff7a3d;animation:spin 16s linear infinite}
.w2{bottom:-160px;background:#ff3d68;animation:spin 22s linear infinite reverse;opacity:.35}
.w3{bottom:-180px;background:#7a2bff;animation:spin 28s linear infinite;opacity:.25}
.ttl{animation:pop .9s .3s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes pop{0%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div class="tag">03 · 波浪层叠</div>
<section class="hero">
<div class="bg"><div class="wv w1"></div><div class="wv w2"></div><div class="wv w3"></div></div>
<div class="content">
<div class="kicker">美食 · 鲜味食堂</div>
<h1 class="ttl">热气腾腾的，<br>生活的味道</h1>
<p class="sub">街角老店与深夜食堂，一碗一故事。</p>
<a class="cta" href="#">看看吃什么</a>
</div>
</section>

</body>
</html>
