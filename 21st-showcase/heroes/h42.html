<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>42 · 彩虹旋转环</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0b0e14;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#fff;overflow-x:hidden}
.tag{position:fixed;top:10px;left:12px;z-index:60;font-size:12px;letter-spacing:.08em;color:#9aa3b8;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:99px}
.hero{position:relative;width:min(430px,100vw);min-height:100vh;min-height:100svh;overflow:hidden;display:flex;align-items:center;justify-content:center}
.bg{position:absolute;inset:0;overflow:hidden}
.content{position:relative;z-index:5;text-align:center;padding:0 30px;width:100%}
.kicker{font-size:12px;letter-spacing:.4em;text-indent:.4em;color:#ffe3ef;margin-bottom:16px;animation:kickIn 1s .45s both}
.ttl{font-size:33px;line-height:1.45;font-weight:800;margin-bottom:16px}
.sub{font-size:14px;line-height:1.9;color:rgba(255,255,255,.75);margin-bottom:30px;animation:fadeUp .9s .6s both}
.cta{display:inline-block;padding:14px 44px;border-radius:999px;font-size:15px;font-weight:700;color:#fff;text-decoration:none;background:linear-gradient(135deg,#ff5f9e,#ff9a3d);box-shadow:0 8px 30px rgba(255,95,158,.45);animation:fadeUp .9s .8s both;transition:transform .25s}
.cta:active{transform:scale(.94)}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes kickIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.ring{position:absolute;top:50%;left:50%;width:560px;height:560px;transform:translate(-50%,-50%);border-radius:50%;
background:conic-gradient(#ff5f9e,#ffb35f,#fff35f,#5fffb0,#5fb4ff,#b45fff,#ff5f9e);
-webkit-mask:radial-gradient(circle,transparent 62%,#000 63%);mask:radial-gradient(circle,transparent 62%,#000 63%);
opacity:.5;filter:blur(6px);animation:spin 18s linear infinite}
.ttl{animation:carousel 1.1s .3s both;transform-origin:center}
@keyframes carousel{from{opacity:0;transform:perspective(600px) rotateY(88deg) translateX(70px)}to{opacity:1;transform:perspective(600px) rotateY(0) translateX(0)}}
</style>
</head>
<body>
<div class="tag">42 · 彩虹旋转环</div>
<section class="hero">
<div class="bg"><div class="ring"></div></div>
<div class="content">
<div class="kicker">甜品 · 旋风甜品</div>
<h1 class="ttl">甜蜜来袭，<br>无法抵抗</h1>
<p class="sub">网红甜品测评与隐藏菜单，甜品控集合。</p>
<a class="cta" href="#">打卡甜品店</a>
</div>
</section>

</body>
</html>
