<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>14 · 星云旋转</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0b0e14;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#fff;overflow-x:hidden}
.tag{position:fixed;top:10px;left:12px;z-index:60;font-size:12px;letter-spacing:.08em;color:#9aa3b8;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:99px}
.hero{position:relative;width:min(430px,100vw);min-height:100vh;min-height:100svh;overflow:hidden;display:flex;align-items:center;justify-content:center}
.bg{position:absolute;inset:0;overflow:hidden}
.content{position:relative;z-index:5;text-align:center;padding:0 30px;width:100%}
.kicker{font-size:12px;letter-spacing:.4em;text-indent:.4em;color:#c9b8ff;margin-bottom:16px;animation:kickIn 1s .45s both}
.ttl{font-size:33px;line-height:1.45;font-weight:800;margin-bottom:16px}
.sub{font-size:14px;line-height:1.9;color:rgba(255,255,255,.75);margin-bottom:30px;animation:fadeUp .9s .6s both}
.cta{display:inline-block;padding:14px 44px;border-radius:999px;font-size:15px;font-weight:700;color:#fff;text-decoration:none;background:linear-gradient(135deg,#6b3dff,#c44dff);box-shadow:0 8px 30px rgba(130,80,255,.5);animation:fadeUp .9s .8s both;transition:transform .25s}
.cta:active{transform:scale(.94)}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes kickIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.nb{position:absolute;top:50%;left:50%;border-radius:50%;filter:blur(46px);opacity:.65}
.n1{width:420px;height:300px;background:#4b2bd8;transform:translate(-72%,-60%);animation:spin 30s linear infinite}
.n2{width:340px;height:340px;background:#c42e9e;transform:translate(-30%,-45%);animation:spin 40s linear infinite reverse}
.st{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 2.6s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
.ttl{animation:rotZoom 1.1s .3s both}
@keyframes rotZoom{from{opacity:0;transform:rotate(-95deg) scale(.5)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="tag">14 · 星云旋转</div>
<section class="hero">
<div class="bg"><div class="nb n1"></div><div class="nb n2"></div><i class="st" style="left:81%;top:65%;animation-delay:2.28s"></i><i class="st" style="left:6%;top:81%;animation-delay:1.55s"></i><i class="st" style="left:80%;top:8%;animation-delay:1.76s"></i><i class="st" style="left:54%;top:77%;animation-delay:0.18s"></i><i class="st" style="left:26%;top:6%;animation-delay:1.58s"></i><i class="st" style="left:25%;top:12%;animation-delay:0.17s"></i><i class="st" style="left:47%;top:81%;animation-delay:1.22s"></i><i class="st" style="left:70%;top:62%;animation-delay:0.07s"></i><i class="st" style="left:11%;top:44%;animation-delay:0.22s"></i><i class="st" style="left:43%;top:3%;animation-delay:1.21s"></i><i class="st" style="left:59%;top:77%;animation-delay:0.39s"></i><i class="st" style="left:51%;top:63%;animation-delay:2.17s"></i><i class="st" style="left:15%;top:46%;animation-delay:1.75s"></i><i class="st" style="left:59%;top:18%;animation-delay:0.50s"></i><i class="st" style="left:30%;top:15%;animation-delay:0.29s"></i><i class="st" style="left:17%;top:11%;animation-delay:2.44s"></i><i class="st" style="left:12%;top:49%;animation-delay:0.27s"></i><i class="st" style="left:5%;top:61%;animation-delay:1.63s"></i><i class="st" style="left:27%;top:49%;animation-delay:2.27s"></i><i class="st" style="left:12%;top:32%;animation-delay:0.01s"></i><i class="st" style="left:68%;top:89%;animation-delay:0.51s"></i><i class="st" style="left:58%;top:34%;animation-delay:2.45s"></i><i class="st" style="left:4%;top:15%;animation-delay:1.35s"></i><i class="st" style="left:55%;top:9%;animation-delay:2.34s"></i><i class="st" style="left:62%;top:42%;animation-delay:1.57s"></i><i class="st" style="left:30%;top:83%;animation-delay:0.15s"></i></div>
<div class="content">
<div class="kicker">星空 · 银河观测站</div>
<h1 class="ttl">数清<br>一万颗星星</h1>
<p class="sub">天文爱好者社区，流星雨预报不错过。</p>
<a class="cta" href="#">预约观星</a>
</div>
</section>

</body>
</html>
