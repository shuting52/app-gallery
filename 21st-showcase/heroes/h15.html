<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>15 · 涟漪扩散</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0b0e14;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#fff;overflow-x:hidden}
.tag{position:fixed;top:10px;left:12px;z-index:60;font-size:12px;letter-spacing:.08em;color:#9aa3b8;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:99px}
.hero{position:relative;width:min(430px,100vw);min-height:100vh;min-height:100svh;overflow:hidden;display:flex;align-items:center;justify-content:center}
.bg{position:absolute;inset:0;overflow:hidden}
.content{position:relative;z-index:5;text-align:center;padding:0 30px;width:100%}
.kicker{font-size:12px;letter-spacing:.4em;text-indent:.4em;color:#b8f0dd;margin-bottom:16px;animation:kickIn 1s .45s both}
.ttl{font-size:33px;line-height:1.45;font-weight:800;margin-bottom:16px}
.sub{font-size:14px;line-height:1.9;color:rgba(255,255,255,.75);margin-bottom:30px;animation:fadeUp .9s .6s both}
.cta{display:inline-block;padding:14px 44px;border-radius:999px;font-size:15px;font-weight:700;color:#fff;text-decoration:none;background:linear-gradient(135deg,#00a37a,#5fd6a8);box-shadow:0 8px 30px rgba(0,180,130,.4);animation:fadeUp .9s .8s both;transition:transform .25s}
.cta:active{transform:scale(.94)}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes kickIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.bg{background:radial-gradient(circle at 50% 42%,#0e3a30,#071a16 70%)}
.rp{position:absolute;top:42%;left:50%;width:60px;height:60px;margin:-30px;border:2px solid rgba(140,255,210,.55);border-radius:50%;animation:rip 3.4s ease-out infinite}
.rp:nth-child(2){animation-delay:1.1s}.rp:nth-child(3){animation-delay:2.2s}
@keyframes rip{from{transform:scale(.4);opacity:1}to{transform:scale(7);opacity:0}}
.ttl{animation:maskUp 1.1s .35s both}
@keyframes maskUp{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
</style>
</head>
<body>
<div class="tag">15 · 涟漪扩散</div>
<section class="hero">
<div class="bg"><div class="rp"></div><div class="rp"></div><div class="rp"></div></div>
<div class="content">
<div class="kicker">瑜伽 · 静湖瑜伽</div>
<h1 class="ttl">呼吸之间，<br>回到自己</h1>
<p class="sub">晨间 15 分钟跟练，办公室也能练的瑜伽。</p>
<a class="cta" href="#">开始跟练</a>
</div>
</section>

</body>
</html>
