<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>39 · 霓虹游走线</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0b0e14;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#fff;overflow-x:hidden}
.tag{position:fixed;top:10px;left:12px;z-index:60;font-size:12px;letter-spacing:.08em;color:#9aa3b8;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:99px}
.hero{position:relative;width:min(430px,100vw);min-height:100vh;min-height:100svh;overflow:hidden;display:flex;align-items:center;justify-content:center}
.bg{position:absolute;inset:0;overflow:hidden}
.content{position:relative;z-index:5;text-align:center;padding:0 30px;width:100%}
.kicker{font-size:12px;letter-spacing:.4em;text-indent:.4em;color:#c2ffef;margin-bottom:16px;animation:kickIn 1s .45s both}
.ttl{font-size:33px;line-height:1.45;font-weight:800;margin-bottom:16px}
.sub{font-size:14px;line-height:1.9;color:rgba(255,255,255,.75);margin-bottom:30px;animation:fadeUp .9s .6s both}
.cta{display:inline-block;padding:14px 44px;border-radius:999px;font-size:15px;font-weight:700;color:#fff;text-decoration:none;background:linear-gradient(135deg,#00e0b8,#7b5cff);box-shadow:0 8px 30px rgba(0,220,180,.45);animation:fadeUp .9s .8s both;transition:transform .25s}
.cta:active{transform:scale(.94)}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes kickIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.bg{background:#070312}
.nl{position:absolute;top:30%;left:-10%;width:120%;height:200px}
.nl path{fill:none;stroke:#00ffc8;stroke-width:3;filter:drop-shadow(0 0 10px #00ffc8);stroke-dasharray:90 510;animation:travel 3.4s linear infinite}
.nl2{top:58%}.nl2 path{stroke:#b45fff;filter:drop-shadow(0 0 10px #b45fff);animation-duration:4.6s;animation-direction:reverse}
@keyframes travel{to{stroke-dashoffset:-600}}
.ttl{animation:maskR 1.1s .35s both}
@keyframes maskR{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0 0 0 0)}}
</style>
</head>
<body>
<div class="tag">39 · 霓虹游走线</div>
<section class="hero">
<div class="bg"><svg class="nl" viewBox="0 0 500 200" preserveAspectRatio="none"><path d="M0,100 C120,20 200,180 320,100 S460,40 500,100"/></svg>
<svg class="nl nl2" viewBox="0 0 500 200" preserveAspectRatio="none"><path d="M0,120 C140,180 220,20 340,110 S470,160 500,90"/></svg></div>
<div class="content">
<div class="kicker">电竞 · 霓虹竞技场</div>
<h1 class="ttl">为热爱<br>而战</h1>
<p class="sub">电竞赛事资讯与开黑组队，王者峡谷见。</p>
<a class="cta" href="#">组队开黑</a>
</div>
</section>

</body>
</html>
