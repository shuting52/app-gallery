<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>48 · 万花筒旋转</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0b0e14;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#fff;overflow-x:hidden}
.tag{position:fixed;top:10px;left:12px;z-index:60;font-size:12px;letter-spacing:.08em;color:#9aa3b8;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:99px}
.hero{position:relative;width:min(430px,100vw);min-height:100vh;min-height:100svh;overflow:hidden;display:flex;align-items:center;justify-content:center}
.bg{position:absolute;inset:0;overflow:hidden}
.content{position:relative;z-index:5;text-align:center;padding:0 30px;width:100%}
.kicker{font-size:12px;letter-spacing:.4em;text-indent:.4em;color:#e8c9ff;margin-bottom:16px;animation:kickIn 1s .45s both}
.ttl{font-size:33px;line-height:1.45;font-weight:800;margin-bottom:16px}
.sub{font-size:14px;line-height:1.9;color:rgba(255,255,255,.75);margin-bottom:30px;animation:fadeUp .9s .6s both}
.cta{display:inline-block;padding:14px 44px;border-radius:999px;font-size:15px;font-weight:700;color:#fff;text-decoration:none;background:linear-gradient(135deg,#8a3dff,#ff5fb0);box-shadow:0 8px 30px rgba(150,80,255,.5);animation:fadeUp .9s .8s both;transition:transform .25s}
.cta:active{transform:scale(.94)}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes kickIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.kh{position:absolute;top:50%;left:50%;width:760px;height:760px;transform:translate(-50%,-50%);border-radius:50%;opacity:.5;
background:repeating-conic-gradient(from 0deg,#ff5f9e 0 14deg,#ffb35f 14deg 28deg,#5fffb0 28deg 42deg,#5fb4ff 42deg 56deg,#b45fff 56deg 70deg);
filter:blur(38px);animation:khS 22s linear infinite}
@keyframes khS{from{transform:translate(-50%,-50%) rotate(0) scale(.9)}50%{transform:translate(-50%,-50%) rotate(180deg) scale(1.08)}to{transform:translate(-50%,-50%) rotate(360deg) scale(.9)}}
.ttl{animation:kaleido 1.2s .3s both}
@keyframes kaleido{from{opacity:0;transform:scale(.2) rotate(170deg)}to{opacity:1;transform:scale(1) rotate(0)}}
</style>
</head>
<body>
<div class="tag">48 · 万花筒旋转</div>
<section class="hero">
<div class="bg"><div class="kh"></div></div>
<div class="content">
<div class="kicker">艺术 · 万花艺术馆</div>
<h1 class="ttl">世界在万花筒<br>里重组</h1>
<p class="sub">艺术展览资讯与线上画廊，美学日常。</p>
<a class="cta" href="#">看展去</a>
</div>
</section>

</body>
</html>
