.tag{position:fixed;top:10px;left:12px;z-index:60;font-size:12px;letter-spacing:.08em;color:#9aa3b8;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:99px}

.cta{display:inline-block;padding:14px 44px;border-radius:999px;font-size:15px;font-weight:700;color:#fff;text-decoration:none;background:linear-gradient(135deg,#00a35f,#00d0c8);box-shadow:0 8px 30px rgba(0,190,130,.45);animation:fadeUp .9s .8s both;transition:transform .25s}
.cta:active{transform:scale(.94)}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes kickIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.dn{position:absolute;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#37ff9e;animation:dnaX 2.4s ease-in-out infinite}
.d2{background:#5fb4ff;animation-delay:inherit;animation-name:dnaX2}
@keyframes dnaX{0%,100%{transform:translateX(-70px) scale(.7);opacity:.5}50%{transform:translateX(70px) scale(1.15);opacity:1}}
@keyframes dnaX2{0%,100%{transform:translateX(70px) scale(.7);opacity:.5}50%{transform:translateX(-70px) scale(1.15);opacity:1}}
.hl,.hr{display:inline-block}
.hl{animation:helixL 1s .3s both}.hr{animation:helixR 1s .45s both}
@keyframes helixL{from{opacity:0;transform:translateX(-70px) rotate(-14deg)}to{opacity:1;transform:none}}
@keyframes helixR{from{opacity:0;transform:translateX(70px) rotate(14deg)}to{opacity:1;transform:none}}
