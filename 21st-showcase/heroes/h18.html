<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>18 · 火焰粒子</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0b0e14;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#fff;overflow-x:hidden}
.tag{position:fixed;top:10px;left:12px;z-index:60;font-size:12px;letter-spacing:.08em;color:#9aa3b8;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:99px}
.hero{position:relative;width:min(430px,100vw);min-height:100vh;min-height:100svh;overflow:hidden;display:flex;align-items:center;justify-content:center}
.bg{position:absolute;inset:0;overflow:hidden}
.content{position:relative;z-index:5;text-align:center;padding:0 30px;width:100%}
.kicker{font-size:12px;letter-spacing:.4em;text-indent:.4em;color:#ffc9a8;margin-bottom:16px;animation:kickIn 1s .45s both}
.ttl{font-size:33px;line-height:1.45;font-weight:800;margin-bottom:16px}
.sub{font-size:14px;line-height:1.9;color:rgba(255,255,255,.75);margin-bottom:30px;animation:fadeUp .9s .6s both}
.cta{display:inline-block;padding:14px 44px;border-radius:999px;font-size:15px;font-weight:700;color:#fff;text-decoration:none;background:linear-gradient(135deg,#ff4d00,#ff9a00);box-shadow:0 8px 30px rgba(255,90,0,.5);animation:fadeUp .9s .8s both;transition:transform .25s}
.cta:active{transform:scale(.94)}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes kickIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.bg{background:radial-gradient(circle at 50% 80%,#3d1206,#0d0503 70%)}
#cv{position:absolute;inset:0;width:100%;height:100%}
.ttl{animation:focusIn 1.1s .3s both}
@keyframes focusIn{from{opacity:0;transform:scale(1.45);filter:blur(14px)}to{opacity:1;transform:scale(1);filter:blur(0)}}
</style>
</head>
<body>
<div class="tag">18 · 火焰粒子</div>
<section class="hero">
<div class="bg"><canvas id="cv"></canvas></div>
<div class="content">
<div class="kicker">健身 · 燃力训练营</div>
<h1 class="ttl">汗水是<br>最好的勋章</h1>
<p class="sub">HIIT 跟练计划与饮食打卡，21 天见证改变。</p>
<a class="cta" href="#">开启训练</a>
</div>
</section>

<script>
const c=document.getElementById('cv'),x=c.getContext('2d');c.width=430;c.height=900;
const P=Array.from({length:70},()=>({x:120+Math.random()*190,y:900,r:2+Math.random()*5,vy:1+Math.random()*2.5,hue:10+Math.random()*35,life:1}));
function loop(){x.clearRect(0,0,430,900);
for(const p of P){p.y-=p.vy;p.life-=.008;if(p.life<=0||p.y<0){p.y=900;p.life=1;p.x=120+Math.random()*190;}
x.globalAlpha=Math.max(p.life,0)*.9;x.fillStyle=`hsl(${p.hue},100%,${45+p.life*20}%)`;x.beginPath();x.arc(p.x,p.y,p.r*p.life+.5,0,6.29);x.fill();}
x.globalAlpha=1;requestAnimationFrame(loop);}
setTimeout(function(){requestAnimationFrame(loop);},2200);
</script>
</body>
</html>
