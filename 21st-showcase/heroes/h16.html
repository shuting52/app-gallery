<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>16 · 光束扫过</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0b0e14;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#fff;overflow-x:hidden}
.tag{position:fixed;top:10px;left:12px;z-index:60;font-size:12px;letter-spacing:.08em;color:#9aa3b8;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:99px}
.hero{position:relative;width:min(430px,100vw);min-height:100vh;min-height:100svh;overflow:hidden;display:flex;align-items:center;justify-content:center}
.bg{position:absolute;inset:0;overflow:hidden}
.content{position:relative;z-index:5;text-align:center;padding:0 30px;width:100%}
.kicker{font-size:12px;letter-spacing:.4em;text-indent:.4em;color:#ffe9b8;margin-bottom:16px;animation:kickIn 1s .45s both}
.ttl{font-size:33px;line-height:1.45;font-weight:800;margin-bottom:16px}
.sub{font-size:14px;line-height:1.9;color:rgba(255,255,255,.75);margin-bottom:30px;animation:fadeUp .9s .6s both}
.cta{display:inline-block;padding:14px 44px;border-radius:999px;font-size:15px;font-weight:700;color:#fff;text-decoration:none;background:linear-gradient(135deg,#8a6b2e,#e8b93d);box-shadow:0 8px 30px rgba(220,180,60,.4);animation:fadeUp .9s .8s both;transition:transform .25s}
.cta:active{transform:scale(.94)}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes kickIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.beam{position:absolute;top:-25%;bottom:-25%;width:130px;background:linear-gradient(90deg,transparent,rgba(255,240,200,.4),transparent);transform:skewX(-18deg);animation:beam 5.5s ease-in-out infinite}
@keyframes beam{0%,55%,100%{left:-30%}75%{left:105%}}
.ttl{background:linear-gradient(110deg,#fff 42%,#ffe9a8 50%,#fff 58%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3.2s .8s ease-in-out infinite,ttlFade .8s .3s both}
@keyframes shine{0%,100%{background-position:120% 0}50%{background-position:-20% 0}}
@keyframes ttlFade{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div class="tag">16 · 光束扫过</div>
<section class="hero">
<div class="bg"><div class="beam"></div></div>
<div class="content">
<div class="kicker">摄影 · 追光者</div>
<h1 class="ttl">光在哪里，<br>故事就在哪里</h1>
<p class="sub">摄影课与约拍社区，从手机拍出大片感。</p>
<a class="cta" href="#">学习摄影</a>
</div>
</section>

</body>
</html>
