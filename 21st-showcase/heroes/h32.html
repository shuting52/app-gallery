<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>32 · 星座连线</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0b0e14;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#fff;overflow-x:hidden}
.tag{position:fixed;top:10px;left:12px;z-index:60;font-size:12px;letter-spacing:.08em;color:#9aa3b8;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:99px}
.hero{position:relative;width:min(430px,100vw);min-height:100vh;min-height:100svh;overflow:hidden;display:flex;align-items:center;justify-content:center}
.bg{position:absolute;inset:0;overflow:hidden}
.content{position:relative;z-index:5;text-align:center;padding:0 30px;width:100%}
.kicker{font-size:12px;letter-spacing:.4em;text-indent:.4em;color:#c9d4ff;margin-bottom:16px;animation:kickIn 1s .45s both}
.ttl{font-size:33px;line-height:1.45;font-weight:800;margin-bottom:16px}
.sub{font-size:14px;line-height:1.9;color:rgba(255,255,255,.75);margin-bottom:30px;animation:fadeUp .9s .6s both}
.cta{display:inline-block;padding:14px 44px;border-radius:999px;font-size:15px;font-weight:700;color:#fff;text-decoration:none;background:linear-gradient(135deg,#3d4bff,#9a5fff);box-shadow:0 8px 30px rgba(90,110,255,.5);animation:fadeUp .9s .8s both;transition:transform .25s}
.cta:active{transform:scale(.94)}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes kickIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
#cv{position:absolute;inset:0;width:100%;height:100%}
.up{display:inline-block;opacity:0;animation:upIn .6s both}
@keyframes upIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="tag">32 · 星座连线</div>
<section class="hero">
<div class="bg"><canvas id="cv"></canvas></div>
<div class="content">
<div class="kicker">天文 · 星图计划</div>
<h1 class="ttl"><span class="up" style="animation-delay:0.25s">连</span><span class="up" style="animation-delay:0.29s">起</span><span class="up" style="animation-delay:0.34s">属</span><span class="up" style="animation-delay:0.39s">于</span><span class="up" style="animation-delay:0.43s">你</span><span class="up" style="animation-delay:0.47s">的</span><br><span class="up" style="animation-delay:0.52s">星</span><span class="up" style="animation-delay:0.56s">座</span></h1>
<p class="sub">观星活动与天文摄影课，仰望星空的人。</p>
<a class="cta" href="#">加入星友会</a>
</div>
</section>

<script>
const c=document.getElementById('cv'),x=c.getContext('2d');c.width=430;c.height=900;
const P=Array.from({length:46},()=>({x:Math.random()*430,y:Math.random()*900,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3}));
function loop(){x.fillStyle='#070b18';x.fillRect(0,0,430,900);
for(const p of P){p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=430;if(p.x>430)p.x=0;if(p.y<0)p.y=900;if(p.y>900)p.y=0;}
x.strokeStyle='rgba(140,160,255,.28)';x.lineWidth=1;
for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],b=P[j],d=Math.hypot(a.x-b.x,a.y-b.y);
if(d<110){x.globalAlpha=(1-d/110)*.8;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();}}
x.globalAlpha=1;x.fillStyle='#dfe6ff';
for(const p of P){x.beginPath();x.arc(p.x,p.y,2,0,6.29);x.fill();}
requestAnimationFrame(loop);}
setTimeout(function(){requestAnimationFrame(loop);},2200);
</script>
</body>
</html>
