<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>02 · 粒子星空</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0b0e14;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#fff;overflow-x:hidden}
.tag{position:fixed;top:10px;left:12px;z-index:60;font-size:12px;letter-spacing:.08em;color:#9aa3b8;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:99px}
.hero{position:relative;width:min(430px,100vw);min-height:100vh;min-height:100svh;overflow:hidden;display:flex;align-items:center;justify-content:center}
.bg{position:absolute;inset:0;overflow:hidden}
.content{position:relative;z-index:5;text-align:center;padding:0 30px;width:100%}
.kicker{font-size:12px;letter-spacing:.4em;text-indent:.4em;color:#9fd8ff;margin-bottom:16px;animation:kickIn 1s .45s both}
.ttl{font-size:33px;line-height:1.45;font-weight:800;margin-bottom:16px}
.sub{font-size:14px;line-height:1.9;color:rgba(255,255,255,.75);margin-bottom:30px;animation:fadeUp .9s .6s both}
.cta{display:inline-block;padding:14px 44px;border-radius:999px;font-size:15px;font-weight:700;color:#fff;text-decoration:none;background:linear-gradient(135deg,#1f6feb,#7b5cff);box-shadow:0 8px 30px rgba(80,120,255,.45);animation:fadeUp .9s .8s both;transition:transform .25s}
.cta:active{transform:scale(.94)}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes kickIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
#cv{position:absolute;inset:0;width:100%;height:100%}
.ch{display:inline-block;opacity:0;animation:chIn .55s both}
@keyframes chIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="tag">02 · 粒子星空</div>
<section class="hero">
<div class="bg"><canvas id="cv"></canvas></div>
<div class="content">
<div class="kicker">旅行 · 星野之旅</div>
<h1 class="ttl"><span class="ch" style="animation-delay:0.25s">去</span><span class="ch" style="animation-delay:0.29s">看</span><span class="ch" style="animation-delay:0.34s">银</span><span class="ch" style="animation-delay:0.39s">河</span><br><span class="ch" style="animation-delay:0.43s">升</span><span class="ch" style="animation-delay:0.47s">起</span><span class="ch" style="animation-delay:0.52s">的</span><span class="ch" style="animation-delay:0.56s">地</span><span class="ch" style="animation-delay:0.61s">方</span></h1>
<p class="sub">小众观星路线与露营地，为你点亮夜空地图。</p>
<a class="cta" href="#">规划我的旅程</a>
</div>
</section>

<script>
const c=document.getElementById('cv'),x=c.getContext('2d');c.width=430;c.height=900;
const S=Array.from({length:130},()=>({x:Math.random()*430,y:Math.random()*900,r:Math.random()*1.8+.4,p:Math.random()*6.28,s:.5+Math.random()*1.5}));
function loop(t){x.clearRect(0,0,430,900);x.fillStyle='#0b0e1e';x.fillRect(0,0,430,900);
for(const s of S){const a=.35+.65*Math.abs(Math.sin(t/1000*s.s+s.p));x.globalAlpha=a;x.fillStyle='#cfe6ff';x.beginPath();x.arc(s.x,s.y,s.r,0,6.29);x.fill();}
x.globalAlpha=1;requestAnimationFrame(loop);}
setTimeout(function(){requestAnimationFrame(loop);},2200);
</script>
</body>
</html>
