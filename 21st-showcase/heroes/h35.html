<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>35 · 落叶飘落</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0b0e14;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#fff;overflow-x:hidden}
.tag{position:fixed;top:10px;left:12px;z-index:60;font-size:12px;letter-spacing:.08em;color:#9aa3b8;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:99px}
.hero{position:relative;width:min(430px,100vw);min-height:100vh;min-height:100svh;overflow:hidden;display:flex;align-items:center;justify-content:center}
.bg{position:absolute;inset:0;overflow:hidden}
.content{position:relative;z-index:5;text-align:center;padding:0 30px;width:100%}
.kicker{font-size:12px;letter-spacing:.4em;text-indent:.4em;color:#ffe3b8;margin-bottom:16px;animation:kickIn 1s .45s both}
.ttl{font-size:33px;line-height:1.45;font-weight:800;margin-bottom:16px}
.sub{font-size:14px;line-height:1.9;color:rgba(255,255,255,.75);margin-bottom:30px;animation:fadeUp .9s .6s both}
.cta{display:inline-block;padding:14px 44px;border-radius:999px;font-size:15px;font-weight:700;color:#fff;text-decoration:none;background:linear-gradient(135deg,#b06b2e,#e8a13d);box-shadow:0 8px 30px rgba(200,140,50,.45);animation:fadeUp .9s .8s both;transition:transform .25s}
.cta:active{transform:scale(.94)}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes kickIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.bg{background:linear-gradient(#1d1408,#3d2a12 70%,#54381a)}
.lf{position:absolute;top:-30px;width:16px;height:22px;border-radius:70% 4px 70% 4px;opacity:.9;animation:lfF linear infinite}
@keyframes lfF{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(470px) translateX(46px) rotate(200deg)}100%{transform:translateY(960px) translateX(-20px) rotate(420deg)}}
.ttl{animation:swayIn 1.2s .3s both;transform-origin:top center}
@keyframes swayIn{0%{opacity:0;transform:translateY(-34px) rotate(-7deg)}60%{opacity:1;transform:translateY(0) rotate(4deg)}80%{transform:rotate(-2deg)}100%{opacity:1;transform:none}}
</style>
</head>
<body>

<div class="content">
<div class="kicker">园艺 · 秋日花园</div>

</div>
</section>
