<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>运动健康 · 液态App套装</title>
<style>
/* ============ tokens（照抄脚手架） ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --glass-radius:34px; --glass-blur:24px;
  --glass-tint-top:rgba(255,255,255,.17); --glass-tint-mid:rgba(255,255,255,.05); --glass-tint-bot:rgba(255,255,255,.10);
  --glass-edge-width:1.2px;
  --glass-edge-strong:rgba(255,255,255,.95); --glass-edge-mid:rgba(255,255,255,.22);
  --glass-edge-weak:rgba(255,255,255,.05); --glass-edge-mid2:rgba(255,255,255,.12); --glass-edge-soft:rgba(255,255,255,.78);
  --glass-shadow-far:0 26px 60px -26px rgba(0,0,0,.85); --glass-shadow-near:0 10px 26px -14px rgba(0,0,0,.55);
  --text-1:#fff; --text-2:rgba(255,255,255,.62); --text-3:rgba(255,255,255,.60);
  --ease-liquid:cubic-bezier(.22,.9,.28,1.2);
}
html,body{height:100%}
body{font:400 15px/1.45 -apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",system-ui,sans-serif;
  color:var(--text-1);background:#07060b;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  display:flex;justify-content:center}
/* ============ 壁纸（照抄 LiquidWallpaper.vue） ============ */
.wallpaper{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.wallpaper i{position:absolute;inset:-30%;display:block;
  background:radial-gradient(42% 32% at 20% 22%,#ff3b5c 0%,transparent 62%),
  radial-gradient(38% 30% at 84% 16%,#ff9f1c 0%,transparent 60%),
  radial-gradient(52% 42% at 76% 74%,#ff2d55 0%,transparent 64%),
  radial-gradient(42% 38% at 24% 82%,#6b5cff 0%,transparent 62%),
  radial-gradient(30% 26% at 52% 48%,#ffd166 0%,transparent 68%),#140a20;
  filter:blur(48px) saturate(150%);animation:drift 26s ease-in-out infinite alternate}
.wallpaper i:nth-child(2){background:conic-gradient(from 200deg at 50% 55%,#ff2d55,#ff9f0a,#ffd60a,#34c759,#0a84ff,#bf5af2,#ff2d55);
  filter:blur(110px);opacity:.5;mix-blend-mode:screen;animation-duration:34s;animation-direction:alternate-reverse}
@keyframes drift{from{transform:translate3d(-3%,-2%,0) scale(1.05) rotate(-3deg)}
  to{transform:translate3d(4%,3%,0) scale(1.16) rotate(4deg)}}
/* ============ 玻璃卡（照抄 LiquidGlass.vue） ============ */
.lg{position:relative;isolation:isolate;border-radius:var(--lg-r,var(--glass-radius));
  background:linear-gradient(155deg,var(--glass-tint-top) 0%,var(--glass-tint-mid) 42%,var(--glass-tint-bot) 100%);
  -webkit-backdrop-filter:blur(var(--lg-blur,var(--glass-blur))) saturate(180%) brightness(1.06);
  backdrop-filter:blur(var(--lg-blur,var(--glass-blur))) saturate(180%) brightness(1.06);
  box-shadow:inset 0 1px 1px -.5px rgba(255,255,255,.70),inset 0 -1px 1px -.5px rgba(255,255,255,.18),
  inset 0 14px 22px -14px rgba(255,255,255,.45),var(--glass-shadow-far),var(--glass-shadow-near);
  transition:transform .38s var(--ease-liquid)}
.lg:active{transform:scale(.982)}
.lg::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;
  mix-blend-mode:screen;opacity:.85;
  background:radial-gradient(120% 62% at 18% -26%,rgba(255,255,255,.78),transparent 58%),
  radial-gradient(70% 46% at 92% -12%,rgba(255,255,255,.34),transparent 60%),
  repeating-linear-gradient(102deg,rgba(255,255,255,.055) 0 2px,transparent 2px 26px)}
.lg::after{content:"";position:absolute;inset:0;z-index:1;border-radius:inherit;padding:var(--glass-edge-width);
  pointer-events:none;
  background:linear-gradient(150deg,var(--glass-edge-strong) 0%,var(--glass-edge-mid) 22%,var(--glass-edge-weak) 48%,var(--glass-edge-mid2) 72%,var(--glass-edge-soft) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude}
/* ============ 屏幕骨架 ============ */
.screen{position:relative;z-index:1;width:430px;max-width:100%;min-height:900px;height:900px;overflow:hidden;
  display:flex;flex-direction:column;padding:18px 14px 12px}
.statusbar{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;
  padding:2px 8px 10px;color:var(--text-1)}
.statusbar .sic{display:flex;gap:6px;align-items:center;font-size:12px}
.apptitle{font-size:30px;font-weight:700;letter-spacing:1px;padding:6px 4px 14px}
.apptitle small{display:block;font-size:12px;font-weight:400;color:var(--text-2);letter-spacing:2px;margin-top:4px}
.content{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:14px}
.homebar{width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.85);margin:10px auto 4px}
/* ============ 运动健康 ============ */
.sect{font-size:13px;font-weight:600;color:var(--text-2);letter-spacing:2px;margin-bottom:10px}
.ringcard{padding:18px;display:flex;align-items:center;gap:8px}
.ringwrap{position:relative;width:196px;height:196px;flex:none}
.ringwrap svg{width:100%;height:100%;display:block}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-center b{font-size:34px;font-weight:700}
.ring-center span{font-size:12px;color:var(--text-3)}
.ring{fill:none;stroke-width:15;stroke-linecap:round;
  transform-origin:100px 100px;transform:rotate(-90deg);
  animation:fillRing 1.8s .15s ease-out both}
@keyframes fillRing{from{stroke-dashoffset:var(--c)}to{stroke-dashoffset:var(--t)}}
.legend{flex:1;display:flex;flex-direction:column;gap:14px;min-width:0}
.leg{display:flex;align-items:center;gap:8px}
.leg i{width:10px;height:10px;border-radius:50%;flex:none}
.leg .t{flex:1}
.leg .t b{display:block;font-size:14px;font-weight:600}
.leg .t small{display:block;font-size:11px;color:var(--text-3)}
.leg .v{font-size:14px;font-weight:600;white-space:nowrap}
.gridcard{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:0}
.cell{padding:12px 4px}
.cell:nth-child(odd){border-right:1px solid rgba(255,255,255,.08)}
.cell:nth-child(-n+2){border-bottom:1px solid rgba(255,255,255,.08)}
.cell b{font-size:24px;font-weight:700}
.cell b small{font-size:12px;font-weight:400;color:var(--text-3)}
.cell p{font-size:12px;color:var(--text-2);margin-top:2px}
.chartcard{padding:18px}
.bars{display:flex;align-items:flex-end;gap:10px;height:118px;margin-top:6px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.bar i{display:block;width:100%;border-radius:8px;
  background:linear-gradient(180deg,#ff9f0a,#ff2d55);
  box-shadow:0 4px 14px rgba(255,60,90,.35);
  transform-origin:bottom;animation:grow 1.2s ease-out both}
.bar.today i{background:linear-gradient(180deg,#34c759,#0a84ff);box-shadow:0 4px 14px rgba(52,199,89,.4)}
.bar span{font-size:11px;color:var(--text-3)}
.bar.today span{color:var(--text-1);font-weight:700}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
</style>
</head>
<body>
<div class="wallpaper" aria-hidden="true"><i></i><i></i></div>
<div class="screen">
  <div class="statusbar"><span>9:41</span><span class="sic">📶 📡 🔋</span></div>
  <div class="apptitle">运动健康<small>ACTIVITY · HEALTH</small></div>
  <div class="content">
    <div class="lg ringcard">
      <div class="ringwrap">
        <svg viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="80" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="15"/>
          <circle cx="100" cy="100" r="66" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="15"/>
          <circle cx="100" cy="100" r="52" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="15"/>
          <circle class="ring" cx="100" cy="100" r="80" stroke="#fa114f"
            stroke-dasharray="502.7" style="--c:502.7;--t:70.4"/>
          <circle class="ring" cx="100" cy="100" r="66" stroke="#a6e22e"
            stroke-dasharray="414.7" style="--c:414.7;--t:149.3"/>
          <circle class="ring" cx="100" cy="100" r="52" stroke="#04c7dd"
            stroke-dasharray="326.7" style="--c:326.7;--t:26.1"/>
        </svg>
        <div class="ring-center"><b>486</b><span>千卡 / 560</span></div>
      </div>
      <div class="legend">
        <div class="leg"><i style="background:#fa114f"></i>
          <div class="t"><b>活动</b><small>消耗卡路里</small></div><span class="v">486/560</span></div>
        <div class="leg"><i style="background:#a6e22e"></i>
          <div class="t"><b>锻炼</b><small>运动分钟</small></div><span class="v">32/50 分钟</span></div>
        <div class="leg"><i style="background:#04c7dd"></i>
          <div class="t"><b>站立</b><small>每小时起身</small></div><span class="v">11/12 小时</span></div>
      </div>
    </div>
    <div class="lg gridcard">
      <div class="cell"><b>12,438 <small>步</small></b><p>今日步数</p></div>
      <div class="cell"><b>8.2 <small>公里</small></b><p>行走距离</p></div>
      <div class="cell"><b>486 <small>千卡</small></b><p>活动能量</p></div>
      <div class="cell"><b>7.5 <small>小时</small></b><p>昨晚睡眠</p></div>
    </div>
    <div class="lg chartcard">
      <div class="sect">本周步数</div>
      <div class="bars">
        <div class="bar"><i style="height:42%"></i><span>一</span></div>
        <div class="bar"><i style="height:68%"></i><span>二</span></div>
        <div class="bar"><i style="height:35%"></i><span>三</span></div>
        <div class="bar"><i style="height:82%"></i><span>四</span></div>
        <div class="bar"><i style="height:58%"></i><span>五</span></div>
        <div class="bar"><i style="height:95%"></i><span>六</span></div>
        <div class="bar today"><i style="height:74%"></i><span>日</span></div>
      </div>
    </div>
  </div>
  <div class="homebar"></div>
</div>
</body>
</html>
