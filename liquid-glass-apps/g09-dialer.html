<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>拨号通话 · 液态App套装</title>
<style>
/* ============ tokens（照抄脚手架） ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --glass-radius:34px; --glass-blur:24px;
  --glass-tint-top:rgba(255,255,255,.17); --glass-tint-mid:rgba(255,255,255,.05); --glass-tint-bot:rgba(255,255,255,.10);
  --glass-edge-width:1.2px;
  --glass-edge-strong:rgba(255,255,255,.95); --glass-edge-mid:rgba(255,255,255,.22);
  --glass-edge-weak:rgba(255,255,255,.05); --glass-edge-mid2:rgba(255,255,255,.12); --glass-edge-soft:rgba(255,255,255,.78);
  --glass-shadow-far:0 26px 60px -26px rgba(0,0,0,.85); --glass-shadow-near:0 10px 26px -14px rgba(0,0,0,.55);
  --text-1:#fff; --text-2:rgba(255,255,255,.62); --text-3:rgba(255,255,255,.60);
  --ease-liquid:cubic-bezier(.22,.9,.28,1.2);
}
html,body{height:100%}
body{font:400 15px/1.45 -apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",system-ui,sans-serif;
  color:var(--text-1);background:#07060b;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  display:flex;justify-content:center}
/* ============ 壁纸（照抄 LiquidWallpaper.vue） ============ */
.wallpaper{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.wallpaper i{position:absolute;inset:-30%;display:block;
  background:radial-gradient(42% 32% at 20% 22%,#ff3b5c 0%,transparent 62%),
  radial-gradient(38% 30% at 84% 16%,#ff9f1c 0%,transparent 60%),
  radial-gradient(52% 42% at 76% 74%,#ff2d55 0%,transparent 64%),
  radial-gradient(42% 38% at 24% 82%,#6b5cff 0%,transparent 62%),
  radial-gradient(30% 26% at 52% 48%,#ffd166 0%,transparent 68%),#140a20;
  filter:blur(48px) saturate(150%);animation:drift 26s ease-in-out infinite alternate}
.wallpaper i:nth-child(2){background:conic-gradient(from 200deg at 50% 55%,#ff2d55,#ff9f0a,#ffd60a,#34c759,#0a84ff,#bf5af2,#ff2d55);
  filter:blur(110px);opacity:.5;mix-blend-mode:screen;animation-duration:34s;animation-direction:alternate-reverse}
@keyframes drift{from{transform:translate3d(-3%,-2%,0) scale(1.05) rotate(-3deg)}
  to{transform:translate3d(4%,3%,0) scale(1.16) rotate(4deg)}}
/* ============ 玻璃卡（照抄 LiquidGlass.vue） ============ */
.lg{position:relative;isolation:isolate;border-radius:var(--lg-r,var(--glass-radius));
  background:linear-gradient(155deg,var(--glass-tint-top) 0%,var(--glass-tint-mid) 42%,var(--glass-tint-bot) 100%);
  -webkit-backdrop-filter:blur(var(--lg-blur,var(--glass-blur))) saturate(180%) brightness(1.06);
  backdrop-filter:blur(var(--lg-blur,var(--glass-blur))) saturate(180%) brightness(1.06);
  box-shadow:inset 0 1px 1px -.5px rgba(255,255,255,.70),inset 0 -1px 1px -.5px rgba(255,255,255,.18),
  inset 0 14px 22px -14px rgba(255,255,255,.45),var(--glass-shadow-far),var(--glass-shadow-near);
  transition:transform .38s var(--ease-liquid)}
.lg:active{transform:scale(.982)}
.lg::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;
  mix-blend-mode:screen;opacity:.85;
  background:radial-gradient(120% 62% at 18% -26%,rgba(255,255,255,.78),transparent 58%),
  radial-gradient(70% 46% at 92% -12%,rgba(255,255,255,.34),transparent 60%),
  repeating-linear-gradient(102deg,rgba(255,255,255,.055) 0 2px,transparent 2px 26px)}
.lg::after{content:"";position:absolute;inset:0;z-index:1;border-radius:inherit;padding:var(--glass-edge-width);
  pointer-events:none;
  background:linear-gradient(150deg,var(--glass-edge-strong) 0%,var(--glass-edge-mid) 22%,var(--glass-edge-weak) 48%,var(--glass-edge-mid2) 72%,var(--glass-edge-soft) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude}
/* ============ 屏幕骨架 ============ */
.screen{position:relative;z-index:1;width:430px;max-width:100%;min-height:900px;height:900px;overflow:hidden;
  display:flex;flex-direction:column;padding:18px 14px 12px}
.statusbar{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;
  padding:2px 8px 10px;color:var(--text-1)}
.statusbar .sic{display:flex;gap:6px;align-items:center;font-size:12px}
.apptitle{font-size:30px;font-weight:700;letter-spacing:1px;padding:6px 4px 14px}
.apptitle small{display:block;font-size:12px;font-weight:400;color:var(--text-2);letter-spacing:2px;margin-top:4px}
.content{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:14px}
.homebar{width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.85);margin:10px auto 4px}
/* ============ 通用小件 ============ */
.av{display:block;flex:none;border-radius:50%;width:52px;height:52px;
  background:conic-gradient(from calc(var(--hue,0)*1deg),#ff9f0a,#ff2d55,#bf5af2,#0a84ff,#ff9f0a);
  box-shadow:0 0 0 1px rgba(255,255,255,.4),0 6px 16px rgba(0,0,0,.4)}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row .main{flex:1;min-width:0}
.row .name{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:13px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.row .time{margin-left:auto;flex:none;font-size:12px;color:var(--text-2)}
.tabbar{display:flex;gap:4px;padding:10px 6px;border-radius:28px;margin-top:4px}
.tabbar button{flex:1;background:none;border:0;color:var(--text-2);font-size:10px;display:flex;flex-direction:column;
  align-items:center;gap:3px;font-family:inherit;cursor:pointer}
.tabbar button.on{color:#fff}
.tabbar button .ic{font-size:20px}
/* ============ 拨号通话 ============ */
.sect{font-size:13px;font-weight:600;color:var(--text-2);letter-spacing:2px;margin-bottom:10px}
.logcard{padding:18px}
.logcard .row{padding:6px 0}
.logcard .row+.row{border-top:1px solid rgba(255,255,255,.08)}
.ctype{flex:none;font-size:15px;width:22px;text-align:center}
.ctype.in{color:#34c759}.ctype.out{color:#0a84ff}.ctype.miss{color:#ff3b30}
.padcard{padding:14px 18px 12px}
.display{font-size:27px;font-weight:600;letter-spacing:3px;text-align:center;min-height:40px;margin-bottom:6px}
.display .hint{font-size:13px;color:var(--text-3);letter-spacing:1px;font-weight:400}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{border:0;cursor:pointer;font-family:inherit;color:var(--text-1);
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  border-radius:20px;padding:6px 0;transition:transform .2s var(--ease-liquid),background .2s}
.key:active{transform:scale(.93);background:rgba(255,255,255,.16)}
.key b{display:block;font-size:20px;font-weight:600}
.key small{display:block;font-size:9px;color:var(--text-3);letter-spacing:2px;margin-top:2px;height:12px}
.callrow{display:flex;justify-content:center;margin-top:8px}
.callbtn{border:0;cursor:pointer;width:60px;height:60px;border-radius:50%;font-size:26px;color:#fff;
  background:linear-gradient(135deg,#34c759,#1fae4e);
  box-shadow:0 10px 26px rgba(52,199,89,.5),inset 0 1px 0 rgba(255,255,255,.5);
  transition:transform .2s var(--ease-liquid)}
.callbtn:active{transform:scale(.9)}
</style>
</head>
<body>
<div class="wallpaper" aria-hidden="true"><i></i><i></i></div>
<div class="screen">
  <div class="statusbar"><span>9:41</span><span class="sic">📶 📡 🔋</span></div>
  <div class="apptitle">拨号通话<small>DIALER · CALL LOG</small></div>
  <div class="content">
    <div class="lg logcard">
      <div class="sect">最近通话</div>
      <div class="row">
        <span class="av" style="--hue:20"></span>
        <div class="main">
          <div class="name">沈晓棠</div>
          <div class="sub"><span class="ctype in">↙</span> 呼入 · 12 分钟</div>
        </div>
        <span class="time">昨天 21:04</span>
      </div>
      <div class="row">
        <span class="av" style="--hue:200"></span>
        <div class="main">
          <div class="name">快递小哥</div>
          <div class="sub"><span class="ctype miss">↙</span> 未接来电</div>
        </div>
        <span class="time">昨天 15:32</span>
      </div>
      <div class="row">
        <span class="av" style="--hue:290"></span>
        <div class="main">
          <div class="name">妈妈</div>
          <div class="sub"><span class="ctype out">↗</span> 呼出 · 38 分钟</div>
        </div>
        <span class="time">10月21日</span>
      </div>
    </div>
    <div class="lg padcard">
      <div class="display">186 6600 8899</div>
      <div class="keys">
        <button class="key"><b>1</b><small></small></button>
        <button class="key"><b>2</b><small>ABC</small></button>
        <button class="key"><b>3</b><small>DEF</small></button>
        <button class="key"><b>4</b><small>GHI</small></button>
        <button class="key"><b>5</b><small>JKL</small></button>
        <button class="key"><b>6</b><small>MNO</small></button>
        <button class="key"><b>7</b><small>PQRS</small></button>
        <button class="key"><b>8</b><small>TUV</small></button>
        <button class="key"><b>9</b><small>WXYZ</small></button>
        <button class="key"><b>*</b><small></small></button>
        <button class="key"><b>0</b><small>+</small></button>
        <button class="key"><b>#</b><small></small></button>
      </div>
      <div class="callrow"><button class="callbtn">📞</button></div>
    </div>
  </div>
  <nav class="tabbar lg">
    <button class="on"><span class="ic">☎️</span>拨号</button>
    <button><span class="ic">👤</span>联系人</button>
    <button><span class="ic">⭐</span>收藏</button>
    <button><span class="ic">🕐</span>最近</button>
  </nav>
  <div class="homebar"></div>
</div>
</body>
</html>
