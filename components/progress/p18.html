<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灯塔光束 · 进度指示</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; background:#0b1020; color:#e8ecf5;
    display:flex; align-items:center; justify-content:center;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif; padding:16px;
  }
  .stage { width:360px; max-width:100%; }
  .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .head h2 { font-size:16px; font-weight:600; letter-spacing:2px; }
  .head .pct { font-size:26px; font-weight:700; color:#ffe28a; font-variant-numeric:tabular-nums; }
  .scene {
    position:relative; width:100%; height:400px; border-radius:16px; overflow:hidden;
    background:linear-gradient(180deg,#060a1c 0%,#0d1633 55%,#12224a 100%);
    border:1px solid #24335e;
  }
  .star { position:absolute; width:3px; height:3px; border-radius:50%; background:#cfe0ff; opacity:.75; }
  /* 灯塔 */
  .rock { position:absolute; left:18px; bottom:86px; width:110px; height:34px;
    background:#1c2547; border-radius:50% 50% 0 0 / 100% 100% 0 0; }
  .tower {
    position:absolute; left:52px; bottom:112px; width:44px; height:150px;
    background:repeating-linear-gradient(180deg,#e8e4da 0 18px,#c23b4a 18px 36px);
    clip-path:polygon(18% 0, 82% 0, 100% 100%, 0 100%);
  }
  .lamp {
    position:absolute; left:58px; bottom:258px; width:32px; height:26px;
    background:#ffe28a; border-radius:4px; box-shadow:0 0 22px 8px rgba(255,226,138,.8); z-index:3;
  }
  .roof {
    position:absolute; left:54px; bottom:282px; width:40px; height:18px;
    background:#8a2432; clip-path:polygon(50% 0, 100% 100%, 0 100%);
  }
  /* 光束：装饰性旋转，JS rAF 驱动 */
  .beam {
    position:absolute; left:74px; bottom:271px; width:300px; height:300px; z-index:2;
    background:conic-gradient(from -14deg at 0 0, rgba(255,236,170,.5), rgba(255,236,170,.12) 14deg, transparent 28deg, transparent 360deg);
    clip-path:polygon(0 0, 100% 12%, 100% 0);
    transform-origin:0 0; pointer-events:none;
  }
  /* 海 */
  .sea {
    position:absolute; left:0; right:0; bottom:0; height:110px;
    background:linear-gradient(180deg,#123a6e 0%,#0a2450 60%,#071a3d 100%);
  }
  .wave { position:absolute; bottom:0; left:0; right:0; height:10px;
    background:radial-gradient(circle at 10px 5px, rgba(120,200,255,.5) 8px, transparent 9px);
    background-size:32px 10px; background-repeat:repeat-x; }
  .buoy { position:absolute; bottom:56px; width:34px; height:30px; z-index:4; }
  .buoy .hull {
    position:absolute; bottom:0; left:2px; width:30px; height:12px; border-radius:0 0 15px 15px;
    background:#3a4666;
  }
  .buoy .light {
    position:absolute; top:0; left:13px; width:8px; height:8px; border-radius:50%;
    background:#3a4666;
  }
  .buoy.lit .hull { background:#5a6f9e; }
  .buoy.lit .light { background:#ffd94d; box-shadow:0 0 14px 6px rgba(255,217,77,.85); }
  .caption {
    position:absolute; left:0; right:0; top:12px; text-align:center; z-index:5;
    font-size:12px; color:#9fb3d9; letter-spacing:1px;
  }
  .hint { margin-top:8px; font-size:11px; color:#5b6b8f; text-align:center; }
</style>
</head>
<body>
<div class="stage">
  <div class="head"><h2>🗼 灯塔光束</h2><div class="pct" id="pct">0%</div></div>
  <div class="scene">
    <div class="star" style="top:26px;left:70px"></div>
    <div class="star" style="top:60px;left:190px"></div>
    <div class="star" style="top:34px;left:300px"></div>
    <div class="star" style="top:96px;left:250px"></div>
    <div class="star" style="top:80px;left:120px"></div>
    <div class="caption" id="caption">已点亮 0 / 6 座浮标</div>
    <div class="rock"></div>
    <div class="tower"></div>
    <div class="beam" id="beam"></div>
    <div class="lamp"></div>
    <div class="roof"></div>
    <div class="sea"><div class="wave"></div></div>
    <div id="buoys"></div>
  </div>
  <div class="hint">光束旋转扫海 · 点亮浮标数量随进度增加</div>
</div>
<script>
(function(){
  var pct = document.getElementById('pct');
  var caption = document.getElementById('caption');
  var beam = document.getElementById('beam');
  var wrap = document.getElementById('buoys');
  var N = 6, buoys = [];
  for (var i = 0; i < N; i++){
    var b = document.createElement('div');
    b.className = 'buoy';
    b.style.left = (140 + i * 34) + 'px';
    b.style.bottom = (48 + (i % 2) * 14) + 'px';
    b.innerHTML = '<div class="light"></div><div class="hull"></div>';
    wrap.appendChild(b);
    buoys.push(b);
  }
  var p = 0;
  function render(){
    pct.textContent = Math.round(p) + '%';
    var lit = Math.round(p / 100 * N);
    caption.textContent = '已点亮 ' + lit + ' / ' + N + ' 座浮标';
    buoys.forEach(function(b, i){
      if (i < lit) b.classList.add('lit'); else b.classList.remove('lit');
    });
  }
  // 装饰性光束旋转（rAF 直接设 transform，非 transition）
  var deg = 0, last = 0;
  function spin(t){
    if (t - last > 50) { deg = (deg + 3) % 360; beam.style.transform = 'rotate(' + deg + 'deg)'; last = t; }
    requestAnimationFrame(spin);
  }
  if (location.hash === '#mid') { p = 55; render(); requestAnimationFrame(spin); return; }
  render();
  requestAnimationFrame(spin);
  var step = 100 / (7000 / 70), hold = false;
  setInterval(function(){
    if (hold) return;
    p += step;
    if (p >= 100) {
      p = 100; render(); hold = true;
      setTimeout(function(){ p = 0; hold = false; render(); }, 1000);
      return;
    }
    render();
  }, 70);
})();
</script>
</body>
</html>
