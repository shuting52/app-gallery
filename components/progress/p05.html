<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>日出 · 进度指示</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0d1117;color:#e6edf3;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:36px 0}
  .stage{width:360px;max-width:94vw;display:flex;flex-direction:column;align-items:center}
  .head{display:flex;justify-content:space-between;align-items:baseline;width:100%;margin-bottom:14px}
  .head h1{font-size:17px;font-weight:600;letter-spacing:2px}
  .head .pct{font-size:15px;color:#ffb35c;font-variant-numeric:tabular-nums}
  .scene{position:relative;width:330px;height:340px;border-radius:14px;overflow:hidden;border:1px solid #1b2340}
  .sky{position:absolute;left:0;right:0;top:0;height:262px;background:#0b1026}
  .sun{position:absolute;left:50%;margin-left:-36px;width:72px;height:72px;border-radius:50%;
       background:radial-gradient(circle at 50% 45%,#fff6d8 0%,#ffd166 45%,#ff8c3a 100%);
       box-shadow:0 0 44px rgba(255,170,80,.75)}
  .sea{position:absolute;left:0;right:0;bottom:0;height:78px;background:linear-gradient(to bottom,#123a5e,#081c34);z-index:2}
  .sea::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:rgba(255,220,170,.55)}
  .refl{position:absolute;left:50%;top:2px;width:44px;height:66px;transform:translateX(-50%);
        background:linear-gradient(to bottom,rgba(255,210,140,.85),rgba(255,170,90,0));z-index:3;opacity:0}
  .cap{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:12px;color:#9db3c9;letter-spacing:1px;z-index:5}
</style>
</head>
<body>
<div class="stage">
  <div class="head"><h1>日出</h1><span class="pct" id="pct">0%</span></div>
  <div class="scene">
    <div class="sky" id="sky"></div>
    <div class="sun" id="sun"></div>
    <div class="sea"><div class="refl" id="refl"></div></div>
    <div class="cap">天空颜色与太阳高度 = 进度 · 海面反光随进度变亮</div>
  </div>
</div>
<script>
(function(){
  var pct=document.getElementById('pct'),sky=document.getElementById('sky'),
      sun=document.getElementById('sun'),refl=document.getElementById('refl');
  var C0=[11,16,38],C1=[255,110,52],C2=[168,208,240]; // 深夜蓝 → 橙红 → 晨蓝
  function lerp(a,b,t){return Math.round(a+(b-a)*t);}
  function skyColor(r){
    var a,b,t;
    if(r<0.5){a=C0;b=C1;t=r/0.5;}else{a=C1;b=C2;t=(r-0.5)/0.5;}
    return 'rgb('+lerp(a[0],b[0],t)+','+lerp(a[1],b[1],t)+','+lerp(a[2],b[2],t)+')';
  }
  var p=0,D=7000,HOLD=1000;
  function render(){
    pct.textContent=Math.round(p)+'%';
    var r=p/100;
    sky.style.background=skyColor(r);
    sun.style.bottom=(-34+r*296)+'px';   // 从海平面下升到高空
    refl.style.opacity=(r*0.95);
    refl.style.width=(44+r*70)+'px';
  }
  function tick(now){
    if(tick.t0===undefined)tick.t0=now;
    var e=now-tick.t0;
    if(e>=D){p=100;render();if(e>=D+HOLD){tick.t0=now;p=0;}requestAnimationFrame(tick);return;}
    p=e/D*100;render();requestAnimationFrame(tick);
  }
  if(location.hash==='#mid'){p=55;render();}
  else{requestAnimationFrame(tick);}
})();
</script>
</body>
</html>
