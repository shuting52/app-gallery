<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>波浪水位 · 进度指示</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0d1117;color:#e6edf3;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:36px 0}
  .stage{width:360px;max-width:94vw;display:flex;flex-direction:column;align-items:center}
  .head{display:flex;justify-content:space-between;align-items:baseline;width:100%;margin-bottom:26px}
  .head h1{font-size:17px;font-weight:600;letter-spacing:2px}
  .head .pct{font-size:15px;color:#58a6ff;font-variant-numeric:tabular-nums}
  .tank{position:relative;width:220px;height:220px;border-radius:50%;overflow:hidden;
        border:4px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);
        box-shadow:0 0 0 1px rgba(0,0,0,.5),0 18px 50px rgba(0,0,0,.55),inset 0 0 40px rgba(0,0,0,.35)}
  .water{position:absolute;left:0;bottom:0;width:100%;height:0%;
         background:linear-gradient(to bottom,#8fd8ff 0%,#2f9be8 16%,#0d5cb6 60%,#083a7a 100%)}
  .wave{position:absolute;left:0;top:-22px;width:220px;height:24px;display:block}
  .glare{position:absolute;top:8px;left:18px;width:44px;height:120px;border-radius:50%;
         background:linear-gradient(to bottom,rgba(255,255,255,.28),rgba(255,255,255,0));
         transform:rotate(14deg);pointer-events:none}
  .num{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;
       font-size:46px;font-weight:700;color:#fff;text-shadow:0 2px 10px rgba(0,40,90,.8);z-index:3;
       font-variant-numeric:tabular-nums;pointer-events:none}
  .tick{position:absolute;bottom:-26px;left:0;right:0;text-align:center;font-size:12px;color:#8b949e;letter-spacing:1px}
</style>
</head>
<body>
<div class="stage">
  <div class="head"><h1>波浪水位</h1><span class="pct" id="pct">0%</span></div>
  <div class="tank" id="tank">
    <div class="water" id="water">
      <svg class="wave" id="waveSvg" viewBox="0 0 220 24" preserveAspectRatio="none">
        <path id="wavePath" fill="#8fd8ff" d=""/>
      </svg>
    </div>
    <div class="glare"></div>
    <div class="num" id="num">0%</div>
    <div class="tick">水位高度 = 进度</div>
  </div>
</div>
<script>
(function(){
  var pct=document.getElementById('pct'),num=document.getElementById('num'),
      water=document.getElementById('water'),wavePath=document.getElementById('wavePath');
  var p=0,phase=0,W=220,AMP=7;
  var D=7000,HOLD=1000;
  function drawWave(){
    var y0=12,d='M0,24 L0,'+(y0+AMP*Math.sin(phase)).toFixed(1);
    for(var x=4;x<=W;x+=4){
      d+=' L'+x+','+(y0+AMP*Math.sin(x/20+phase)).toFixed(1);
    }
    wavePath.setAttribute('d',d+' L'+W+',24 Z');
  }
  function render(){
    var t=Math.round(p)+'%';
    pct.textContent=t;num.textContent=t;
    water.style.height=p+'%';
    drawWave();
  }
  function tick(now){
    if(tick.t0===undefined)tick.t0=now;
    var e=now-tick.t0;
    if(e>=D){
      p=100;render();
      if(e>=D+HOLD){tick.t0=now;p=0;}
      phase+=0.06;
      requestAnimationFrame(tick);return;
    }
    p=e/D*100;
    phase+=0.06;
    render();
    requestAnimationFrame(tick);
  }
  if(location.hash==='#mid'){p=55;render();}
  else{requestAnimationFrame(tick);}
})();
</script>
</body>
</html>
