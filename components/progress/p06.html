<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>p06 拼图拼盘 · 进度指示</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b0e14;color:#e8ecf4;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.stage{width:360px;max-width:94vw;background:#141926;border:1px solid #232c3f;border-radius:18px;padding:18px 16px 20px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.title{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.title h3{font-size:16px;font-weight:600;letter-spacing:2px}
.title .pct{font-size:22px;font-weight:700;color:#ffd166;font-variant-numeric:tabular-nums}
.scene{position:relative;height:392px;border-radius:12px;overflow:hidden;background:#0d1119;border:1px solid #1f2739}
.puzzle{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,1fr);gap:5px;height:330px;padding:12px}
.pc{border-radius:7px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.10),0 2px 6px rgba(0,0,0,.4)}
.cap{text-align:center;font-size:13px;color:#9aa7c2;padding:6px 0 10px;letter-spacing:1px}
.cap b{color:#ffd166;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="stage">
  <div class="title"><h3>拼图拼盘</h3><span class="pct" id="pct">0%</span></div>
  <div class="scene">
    <div class="puzzle" id="puzzle"></div>
    <div class="cap" id="cap">拼图中… <b>0</b>/20</div>
  </div>
</div>
<script>
var pctEl=document.getElementById('pct');
var puzzle=document.getElementById('puzzle');
var cap=document.getElementById('cap');
var pieces=[];
for(var i=0;i<20;i++){
  var d=document.createElement('div');
  d.className='pc';
  var r=Math.floor(i/4),c=i%4,t=(r/4+c/3)/2;
  d.style.background='hsl('+Math.round(210-200*t)+',78%,55%)';
  d.style.opacity='0';
  d.style.transform='perspective(500px) rotateX(88deg) scale(.5)';
  puzzle.appendChild(d);
  pieces.push(d);
}
var p=0;
function render(){
  pctEl.textContent=Math.round(p)+'%';
  var n=Math.floor(p/100*20);
  for(var i=0;i<20;i++){
    var on=i<n;
    pieces[i].style.opacity=on?'1':'0';
    pieces[i].style.transform=on?'perspective(500px) rotateX(0deg) scale(1)':'perspective(500px) rotateX(88deg) scale(.5)';
  }
  cap.innerHTML=(n>=20?'拼图完成！ ':'拼图中… ')+'<b>'+n+'</b>/20';
}
var DUR=7000;
function startLoop(){
  var t0=performance.now();
  function tick(now){
    var el=now-t0;
    if(el>=DUR){p=100;render();setTimeout(startLoop,1000);return;}
    p=el/DUR*100;
    render();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
if(location.hash==='#mid'){p=55;render();}
else{startLoop();}
</script>
</body>
</html>
