<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拼图嵌入</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0e0f13;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#e8eaf0;padding:20px}
body.freeze *{transition:none!important;animation:none!important}
.stage{width:360px;max-width:100%;text-align:center}
h2{font-size:17px;letter-spacing:3px;margin-bottom:4px}
.sub{font-size:12px;color:#8a8fa3;margin-bottom:20px}
.device{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.board{width:330px;height:270px;margin:0 auto;border-radius:18px;position:relative;background:linear-gradient(160deg,#1c2233,#11141e);box-shadow:0 12px 32px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);overflow:hidden}
.board::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 80% 10%,rgba(120,140,200,.12),transparent 50%)}
.slot{position:absolute;right:36px;top:66px;width:112px;height:112px;border:3px dashed #4a5162;border-radius:16px;transition:all .5s}
.device.on .slot{border-style:solid;border-color:#ffd479;box-shadow:0 0 22px rgba(255,212,121,.45),inset 0 0 18px rgba(255,212,121,.15)}
.piece{position:absolute;left:34px;top:60px;width:112px;height:112px;border-radius:16px;background:linear-gradient(140deg,#ff9a5a,#f0527a);box-shadow:0 10px 24px rgba(240,90,110,.35);transform:rotate(-14deg);transition:transform .75s cubic-bezier(.3,1.35,.4,1),box-shadow .5s}
.piece::before{content:'';position:absolute;top:-20px;left:50%;width:42px;height:42px;margin-left:-21px;border-radius:50%;background:#f7815f}
.piece::after{content:'';position:absolute;bottom:14px;left:50%;width:30px;height:30px;margin-left:-15px;border-radius:50%;background:rgba(255,255,255,.28)}
.device.on .piece{transform:translate(148px,6px) rotate(0deg);box-shadow:0 0 30px rgba(255,170,90,.6)}
.burst{position:absolute;right:92px;top:122px;width:10px;height:10px;opacity:0;pointer-events:none}
.burst i{position:absolute;left:0;top:0;width:10px;height:10px;border-radius:50%;background:#ffd479}
.device.on .burst{animation:bst .7s ease-out .55s}
@keyframes bst{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(3.2)}}
.cap{position:absolute;bottom:18px;left:0;right:0;font-size:11px;letter-spacing:3px;color:#5c6172}
.device.on .cap{color:#ffd479}
.status{margin-top:18px;font-size:14px;color:#9aa0b4}
.status b{color:#ffd479}
.hint{font-size:11px;color:#5c6172;margin-top:6px}
</style>
</head>
<body>
<div class="stage">
<h2>拼图嵌入</h2>
<div class="sub">点击把拼图块嵌入缺口</div>
<div class="device" id="dev">
<div class="board">
<div class="slot"></div>
<div class="piece"></div>
<div class="burst"><i></i></div>
<div class="cap" id="cap">缺了一块</div>
</div>
</div>
<div class="status">状态：<b id="st">关 · 未嵌入</b></div>
<div class="hint">点击拼图切换</div>
</div>
<script>
var dev=document.getElementById('dev'),st=document.getElementById('st'),cap=document.getElementById('cap'),on=location.search.indexOf('s=1')>-1;
function render(){dev.classList.toggle('on',on);st.textContent=on?'开 · 已嵌入':'关 · 未嵌入';cap.textContent=on?'拼合完成':'缺了一块';}
if(on)document.body.classList.add('freeze');
dev.addEventListener('click',function(){on=!on;render();});
render();
</script>
</body>
</html>
