<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>门闩锁</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0e0f13;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#e8eaf0;padding:20px}
body.freeze *{transition:none!important;animation:none!important}
.stage{width:360px;max-width:100%;text-align:center}
h2{font-size:17px;letter-spacing:3px;margin-bottom:4px}
.sub{font-size:12px;color:#8a8fa3;margin-bottom:20px}
.device{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.door{width:290px;height:300px;margin:0 auto;border-radius:14px;position:relative;overflow:hidden;background:repeating-linear-gradient(90deg,#6b4a2f 0 34px,#5d3f28 34px 68px);box-shadow:0 12px 32px rgba(0,0,0,.5),inset 0 0 60px rgba(0,0,0,.45)}
.door::after{content:'';position:absolute;inset:14px;border:3px solid rgba(0,0,0,.28);border-radius:8px;pointer-events:none}
.plate{position:absolute;top:96px;left:26px;right:26px;height:96px;border-radius:12px;background:linear-gradient(180deg,#a7aec0,#767e92);box-shadow:0 6px 16px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.5)}
.keeper{position:absolute;top:50%;right:12px;width:44px;height:52px;margin-top:-26px;border-radius:6px;background:#22262f;border:3px solid #14171d;box-shadow:inset 0 3px 8px #000}
.bolt{position:absolute;top:50%;left:16px;width:140px;height:32px;margin-top:-16px;border-radius:7px;background:linear-gradient(180deg,#eef1f7,#a7aec0);box-shadow:0 4px 10px rgba(0,0,0,.45),inset 0 1px 0 #fff;transition:transform .55s cubic-bezier(.3,1.45,.45,1)}
.bolt::after{content:'';position:absolute;top:6px;bottom:6px;left:10px;right:10px;border-radius:4px;background:repeating-linear-gradient(90deg,transparent 0 12px,rgba(0,0,0,.08) 12px 14px)}
.device.on .bolt{transform:translateX(102px)}
.led{position:absolute;top:12px;right:14px;width:18px;height:18px;border-radius:50%;background:#5a2126;border:2px solid #14171d;transition:all .4s}
.device.on .led{background:radial-gradient(circle at 40% 35%,#d6ffe2,#2fbf71 70%);box-shadow:0 0 14px 3px rgba(60,220,130,.75)}
.led-lb{position:absolute;top:34px;right:6px;font-size:10px;color:#3c4048;letter-spacing:1px}
.rivet{position:absolute;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#dfe4ee,#767e92)}
.r1{top:8px;left:8px}.r2{top:8px;right:8px}.r3{bottom:8px;left:8px}.r4{bottom:8px;right:8px}
.status{margin-top:18px;font-size:14px;color:#9aa0b4}
.status b{color:#ffd479}
.hint{font-size:11px;color:#5c6172;margin-top:6px}
</style>
</head>
<body>
<div class="stage">
<h2>门闩锁</h2>
<div class="sub">点击滑动门闩上锁 / 开锁</div>
<div class="device" id="dev">
<div class="door">
<div class="plate">
<span class="rivet r1"></span><span class="rivet r2"></span><span class="rivet r3"></span><span class="rivet r4"></span>
<div class="keeper"></div><div class="bolt"></div>
<div class="led"></div><div class="led-lb">锁定</div>
</div>
</div>
</div>
<div class="status">状态：<b id="st">关 · 未锁定</b></div>
<div class="hint">点击门闩切换</div>
</div>
<script>
var dev=document.getElementById('dev'),st=document.getElementById('st'),on=location.search.indexOf('s=1')>-1;
function render(){dev.classList.toggle('on',on);st.textContent=on?'开 · 已锁定':'关 · 未锁定';}
if(on)document.body.classList.add('freeze');
dev.addEventListener('click',function(){on=!on;render();});
render();
</script>
</body>
</html>
