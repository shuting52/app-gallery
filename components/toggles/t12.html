<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>霓虹灯牌</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0e0f13;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#e8eaf0;padding:20px}
body.freeze *{transition:none!important;animation:none!important}
.stage{width:360px;max-width:100%;text-align:center}
h2{font-size:17px;letter-spacing:3px;margin-bottom:4px}
.sub{font-size:12px;color:#8a8fa3;margin-bottom:20px}
.device{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.sign{width:330px;height:230px;margin:0 auto;border-radius:14px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:linear-gradient(180deg,#221a20,#141014);border:12px solid #0a0809;box-shadow:0 12px 32px rgba(0,0,0,.6),inset 0 0 40px rgba(0,0,0,.6)}
.sign::before{content:'';position:absolute;inset:6px;border:1px solid rgba(255,255,255,.05);border-radius:6px;pointer-events:none}
.neon{font-size:76px;font-weight:900;letter-spacing:10px;color:#38313a;transition:color .35s;line-height:1}
.neon-en{font-size:20px;font-weight:700;letter-spacing:14px;color:#2c2830;transition:color .35s;margin-left:14px}
.device.on .neon{color:#ffe9f8;animation:flk 1.3s linear 1;text-shadow:0 0 8px #fff,0 0 22px #ff4fd8,0 0 48px #ff4fd8,0 0 90px #a3137f}
.device.on .neon-en{color:#d8fbff;animation:flk 1.3s linear .15s 1;text-shadow:0 0 8px #fff,0 0 20px #38e1ff,0 0 44px #38e1ff,0 0 80px #0e7fa3}
@keyframes flk{0%,100%{opacity:1}7%{opacity:.35}9%{opacity:1}30%{opacity:.55}33%{opacity:1}52%{opacity:.25}55%{opacity:1}78%{opacity:.6}80%{opacity:1}}
.device.on.flick-done .neon,.device.on.flick-done .neon-en{animation:none}
.cord{position:absolute;top:-34px;left:50%;width:4px;height:34px;margin-left:-2px;background:#0a0809}
.hang{position:absolute;top:-44px;left:50%;width:60px;height:12px;margin-left:-30px;border:4px solid #0a0809;border-bottom:0;border-radius:8px 8px 0 0}
.status{margin-top:18px;font-size:14px;color:#9aa0b4}
.status b{color:#ffd479}
.hint{font-size:11px;color:#5c6172;margin-top:6px}
</style>
</head>
<body>
<div class="stage">
<h2>霓虹灯牌</h2>
<div class="sub">点击点亮 / 熄灭霓虹灯</div>
<div class="device" id="dev">
<div class="hang"></div><div class="cord"></div>
<div class="sign">
<div class="neon">開</div>
<div class="neon-en">OPEN</div>
</div>
</div>
<div class="status">状态：<b id="st">关 · 打烊</b></div>
<div class="hint">点击灯牌切换</div>
</div>
<script>
var dev=document.getElementById('dev'),st=document.getElementById('st'),on=location.search.indexOf('s=1')>-1,t;
function render(){dev.classList.toggle('on',on);dev.classList.remove('flick-done');st.textContent=on?'开 · 营业中':'关 · 打烊';clearTimeout(t);if(on)t=setTimeout(function(){dev.classList.add('flick-done');},1400);}
if(on)document.body.classList.add('freeze');
dev.addEventListener('click',function(){on=!on;render();});
render();
</script>
</body>
</html>
