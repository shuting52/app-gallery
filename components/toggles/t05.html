<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>翻牌开关</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0e0f13;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#e8eaf0;padding:20px}
body.freeze *{transition:none!important;animation:none!important}
.stage{width:360px;max-width:100%;text-align:center}
h2{font-size:17px;letter-spacing:3px;margin-bottom:4px}
.sub{font-size:12px;color:#8a8fa3;margin-bottom:20px}
.device{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.deck{width:210px;height:290px;margin:0 auto;perspective:1100px}
.card3d{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.35,0,.2,1)}
.device.on .card3d{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;box-shadow:0 16px 40px rgba(0,0,0,.55)}
.front{background:linear-gradient(160deg,#2b3040,#151824);border:1px solid #3d4358}
.front .big{font-size:92px;font-weight:900;color:#4a5162}
.front .sm{font-size:13px;letter-spacing:6px;color:#6e7688}
.lock{width:44px;height:34px;border:6px solid #4a5162;border-bottom:0;border-radius:22px 22px 0 0;position:relative}
.lock::after{content:'';position:absolute;top:28px;left:50%;width:52px;height:44px;margin-left:-26px;border-radius:10px;background:#4a5162}
.back{background:linear-gradient(160deg,#35c37c,#0f7a44);transform:rotateY(180deg);box-shadow:0 16px 44px rgba(46,200,120,.35)}
.back .big{font-size:92px;font-weight:900;color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.25)}
.back .sm{font-size:13px;letter-spacing:6px;color:#eafff3}
.check{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.22);position:relative}
.check::after{content:'';position:absolute;top:14px;left:17px;width:14px;height:24px;border:solid #fff;border-width:0 6px 6px 0;transform:rotate(42deg)}
.edge{position:absolute;inset:10px;border-radius:16px;border:2px dashed rgba(255,255,255,.14);pointer-events:none}
.status{margin-top:18px;font-size:14px;color:#9aa0b4}
.status b{color:#ffd479}
.hint{font-size:11px;color:#5c6172;margin-top:6px}
</style>
</head>
<body>
<div class="stage">
<h2>翻牌开关</h2>
<div class="sub">点击翻转卡牌</div>
<div class="device" id="dev">
<div class="deck"><div class="card3d">
<div class="face front"><div class="lock"></div><div class="big">关</div><div class="sm">已锁定</div><div class="edge"></div></div>
<div class="face back"><div class="check"></div><div class="big">开</div><div class="sm">已开启</div><div class="edge"></div></div>
</div></div>
</div>
<div class="status">状态：<b id="st">关</b></div>
<div class="hint">点击卡牌切换</div>
</div>
<script>
var dev=document.getElementById('dev'),st=document.getElementById('st'),on=location.search.indexOf('s=1')>-1;
function render(){dev.classList.toggle('on',on);st.textContent=on?'开':'关';}
if(on)document.body.classList.add('freeze');
dev.addEventListener('click',function(){on=!on;render();});
render();
</script>
</body>
</html>
