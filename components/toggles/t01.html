<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日月切换</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0e0f13;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#e8eaf0;padding:20px}
body.freeze *{transition:none!important;animation:none!important}
.stage{width:360px;max-width:100%;text-align:center}
h2{font-size:17px;letter-spacing:3px;margin-bottom:4px}
.sub{font-size:12px;color:#8a8fa3;margin-bottom:20px}
.device{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.sky{width:300px;height:170px;margin:0 auto;border-radius:26px;position:relative;overflow:hidden;background:linear-gradient(180deg,#5eb6f2 0%,#bfe6fd 100%);transition:background 1.1s ease;box-shadow:0 12px 32px rgba(0,0,0,.45)}
.device.on .sky{background:linear-gradient(180deg,#05081a 0%,#182449 100%)}
.orb{position:absolute;top:50%;left:26px;width:62px;height:62px;margin-top:-31px;border-radius:50%;background:radial-gradient(circle at 35% 32%,#ffe9a3,#ffb300 70%);box-shadow:0 0 34px 6px rgba(255,200,60,.75);transition:left 1.1s cubic-bezier(.55,0,.3,1.15),background 1.1s,box-shadow 1.1s}
.orb::after{content:'';position:absolute;inset:0;border-radius:50%;opacity:0;transition:opacity 1.1s;background:
 radial-gradient(circle at 30% 40%,rgba(160,150,120,.55) 0 9px,transparent 10px),
 radial-gradient(circle at 62% 58%,rgba(160,150,120,.5) 0 7px,transparent 8px),
 radial-gradient(circle at 48% 72%,rgba(160,150,120,.45) 0 5px,transparent 6px)}
.device.on .orb{left:212px;background:radial-gradient(circle at 35% 32%,#f7f3df,#cfc8a4 70%);box-shadow:0 0 26px 4px rgba(230,225,190,.5)}
.device.on .orb::after{opacity:1}
.rays{position:absolute;top:50%;left:26px;width:110px;height:110px;margin:-55px 0 0 -24px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,205,80,.85) 0 7deg,transparent 7deg 30deg);-webkit-mask:radial-gradient(circle,transparent 0 34px,#000 35px);mask:radial-gradient(circle,transparent 0 34px,#000 35px);transition:left 1.1s cubic-bezier(.55,0,.3,1.15),opacity .8s;animation:spin 14s linear infinite}
.device.on .rays{left:212px;opacity:0}
@keyframes spin{to{transform:rotate(360deg)}}
.stars span{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;opacity:0;transition:opacity 1s}
.device.on .stars span{opacity:1;animation:tw 1.8s ease-in-out infinite}
.stars span:nth-child(1){top:26px;left:60px;animation-delay:.2s}
.stars span:nth-child(2){top:52px;left:130px;animation-delay:.9s}
.stars span:nth-child(3){top:24px;left:200px;animation-delay:1.4s}
.stars span:nth-child(4){top:70px;left:250px;animation-delay:.5s}
.stars span:nth-child(5){top:110px;left:90px;animation-delay:1.1s}
.stars span:nth-child(6){top:120px;left:220px;animation-delay:1.7s}
@keyframes tw{50%{transform:scale(1.6);opacity:.5}}
.cloud{position:absolute;background:#fff;border-radius:20px;opacity:.92;transition:opacity 1s,transform 1.1s}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.c1{top:38px;left:120px;width:74px;height:24px}
.c1::before{width:30px;height:30px;top:-14px;left:12px}
.c1::after{width:22px;height:22px;top:-10px;left:38px}
.c2{top:100px;left:40px;width:56px;height:18px;opacity:.75}
.c2::before{width:22px;height:22px;top:-10px;left:10px}
.c2::after{width:16px;height:16px;top:-7px;left:28px}
.device.on .cloud{opacity:.12;transform:translateX(40px)}
.status{margin-top:18px;font-size:14px;color:#9aa0b4}
.status b{color:#ffd479}
.hint{font-size:11px;color:#5c6172;margin-top:6px}
</style>
</head>
<body>
<div class="stage">
<h2>日月切换</h2>
<div class="sub">点击在白天与黑夜之间切换</div>
<div class="device" id="dev">
<div class="sky">
<div class="stars"><span></span><span></span><span></span><span></span><span></span><span></span></div>
<div class="cloud c1"></div><div class="cloud c2"></div>
<div class="rays"></div><div class="orb"></div>
</div>
</div>
<div class="status">状态：<b id="st">关 · 白天</b></div>
<div class="hint">点击天空切换</div>
</div>
<script>
var dev=document.getElementById('dev'),st=document.getElementById('st'),on=location.search.indexOf('s=1')>-1;
function render(){dev.classList.toggle('on',on);st.textContent=on?'开 · 黑夜':'关 · 白天';}
if(on)document.body.classList.add('freeze');
dev.addEventListener('click',function(){on=!on;render();});
render();
</script>
</body>
</html>
