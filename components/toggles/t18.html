<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>阴阳鱼</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0e0f13;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#e8eaf0;padding:20px}
body.freeze *{transition:none!important;animation:none!important}
.stage{width:360px;max-width:100%;text-align:center}
h2{font-size:17px;letter-spacing:3px;margin-bottom:4px}
.sub{font-size:12px;color:#8a8fa3;margin-bottom:20px}
.device{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.ring{width:280px;height:280px;margin:10px auto;position:relative;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(120,140,200,.1),transparent 70%)}
.taiji{width:210px;height:210px;border-radius:50%;position:relative;background:linear-gradient(to bottom,#14141c 50%,#f2eee2 50%);box-shadow:0 0 34px rgba(120,150,255,.28),0 14px 34px rgba(0,0,0,.55);transform:rotate(0deg);transition:transform 1.3s cubic-bezier(.4,0,.25,1),box-shadow 1.3s}
.taiji::before{content:'';position:absolute;left:0;top:25%;width:50%;height:50%;border-radius:50%;background:radial-gradient(circle,#f2eee2 0 20%,#14141c 22%)}
.taiji::after{content:'';position:absolute;right:0;top:25%;width:50%;height:50%;border-radius:50%;background:radial-gradient(circle,#14141c 0 20%,#f2eee2 22%)}
.device.on .taiji{transform:rotate(180deg);box-shadow:0 0 48px rgba(255,200,90,.5),0 14px 34px rgba(0,0,0,.55)}
.device.on .taiji::before{animation:eye 2.2s ease-in-out infinite}
.device.on .taiji::after{animation:eye 2.2s ease-in-out 1.1s infinite}
@keyframes eye{50%{filter:brightness(1.35)}}
.orbit{position:absolute;inset:0;border-radius:50%;border:1px dashed rgba(255,255,255,.14);animation:spin 26s linear infinite;pointer-events:none}
.orbit i{position:absolute;top:-5px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#ffd479;box-shadow:0 0 10px #ffd479}
@keyframes spin{to{transform:rotate(360deg)}}
.halolb{position:absolute;bottom:-34px;left:0;right:0;font-size:12px;letter-spacing:4px;color:#8a9ac0;transition:color .8s}
.device.on .halolb{color:#ffd479}
.status{margin-top:52px;font-size:14px;color:#9aa0b4}
.status b{color:#ffd479}
.hint{font-size:11px;color:#5c6172;margin-top:6px}
</style>
</head>
<body>
<div class="stage">
<h2>阴阳鱼</h2>
<div class="sub">点击旋转太极，阴阳交替</div>
<div class="device" id="dev">
<div class="ring">
<div class="orbit"><i></i></div>
<div class="taiji"></div>
<div class="halolb" id="hlb">阴盛</div>
</div>
</div>
<div class="status">状态：<b id="st">关 · 阴鱼在上</b></div>
<div class="hint">点击太极切换</div>
</div>
<script>
var dev=document.getElementById('dev'),st=document.getElementById('st'),hlb=document.getElementById('hlb'),on=location.search.indexOf('s=1')>-1;
function render(){dev.classList.toggle('on',on);st.textContent=on?'开 · 阳鱼在上':'关 · 阴鱼在上';hlb.textContent=on?'阳盛':'阴盛';}
if(on)document.body.classList.add('freeze');
dev.addEventListener('click',function(){on=!on;render();});
render();
</script>
</body>
</html>
