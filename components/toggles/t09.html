<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>推子</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0e0f13;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#e8eaf0;padding:20px}
body.freeze *{transition:none!important;animation:none!important}
.stage{width:360px;max-width:100%;text-align:center}
h2{font-size:17px;letter-spacing:3px;margin-bottom:4px}
.sub{font-size:12px;color:#8a8fa3;margin-bottom:20px}
.device{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.mixer{width:210px;height:320px;margin:0 auto;border-radius:16px;position:relative;background:linear-gradient(180deg,#232833,#14171e);box-shadow:0 12px 32px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07)}
.ch-lb{position:absolute;top:12px;left:0;right:0;font-size:11px;letter-spacing:3px;color:#8a8fa3}
.slot{position:absolute;left:50%;top:44px;bottom:64px;width:16px;margin-left:-8px;border-radius:8px;background:#090b0f;box-shadow:inset 0 3px 8px #000}
.ticks{position:absolute;left:26px;top:44px;bottom:64px;width:20px;background:repeating-linear-gradient(180deg,#4a5162 0 2px,transparent 2px 22px)}
.db{position:absolute;left:2px;top:44px;bottom:64px;font-size:9px;color:#5c6172;display:flex;flex-direction:column;justify-content:space-between;padding:2px 0}
.cap{position:absolute;left:50%;top:242px;width:62px;height:36px;margin-left:-31px;border-radius:7px;background:linear-gradient(180deg,#f0f3f8,#9aa2b5);box-shadow:0 5px 12px rgba(0,0,0,.6),inset 0 1px 0 #fff;transition:top .65s cubic-bezier(.3,1.25,.4,1)}
.cap::after{content:'';position:absolute;top:50%;left:8px;right:8px;height:3px;margin-top:-1px;background:#c62f2f;border-radius:2px}
.device.on .cap{top:44px}
.leds{position:absolute;right:26px;top:44px;bottom:64px;width:12px;display:flex;flex-direction:column;justify-content:space-between}
.leds span{width:12px;height:12px;border-radius:50%;background:#232833;border:1px solid #10131a;transition:all .3s;transition-delay:calc(var(--i)*90ms)}
.device.on .leds span{background:radial-gradient(circle at 40% 35%,#d6ffe2,#2fbf71 70%);box-shadow:0 0 10px rgba(60,220,130,.8);border-color:#2fbf71}
.device.on .leds span:nth-child(1),.device.on .leds span:nth-child(2){background:radial-gradient(circle at 40% 35%,#ffe3e3,#e04040 70%);box-shadow:0 0 10px rgba(230,60,60,.8);border-color:#e04040}
.mute{position:absolute;bottom:16px;left:0;right:0;font-size:12px;letter-spacing:4px;color:#e04040;transition:color .4s}
.device.on .mute{color:#2fbf71}
.status{margin-top:18px;font-size:14px;color:#9aa0b4}
.status b{color:#ffd479}
.hint{font-size:11px;color:#5c6172;margin-top:6px}
</style>
</head>
<body>
<div class="stage">
<h2>推子</h2>
<div class="sub">点击推起 / 拉下调音台推子</div>
<div class="device" id="dev">
<div class="mixer">
<div class="ch-lb">CH · 01</div>
<div class="ticks"></div>
<div class="db"><span>0</span><span>10</span><span>20</span><span>40</span><span>60</span><span>∞</span></div>
<div class="slot"></div><div class="cap"></div>
<div class="leds"><span style="--i:0"></span><span style="--i:1"></span><span style="--i:2"></span><span style="--i:3"></span><span style="--i:4"></span><span style="--i:5"></span></div>
<div class="mute" id="mlb">MUTE</div>
</div>
</div>
<div class="status">状态：<b id="st">关 · 静音</b></div>
<div class="hint">点击调音台切换</div>
</div>
<script>
var dev=document.getElementById('dev'),st=document.getElementById('st'),mlb=document.getElementById('mlb'),on=location.search.indexOf('s=1')>-1;
function render(){dev.classList.toggle('on',on);st.textContent=on?'开 · 放音':'关 · 静音';mlb.textContent=on?'LIVE':'MUTE';}
if(on)document.body.classList.add('freeze');
dev.addEventListener('click',function(){on=!on;render();});
render();
</script>
</body>
</html>
