<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>密码轮</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0e0f13;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#e8eaf0;padding:20px}
body.freeze *{transition:none!important;animation:none!important}
.stage{width:360px;max-width:100%;text-align:center}
h2{font-size:17px;letter-spacing:3px;margin-bottom:4px}
.sub{font-size:12px;color:#8a8fa3;margin-bottom:20px}
.device{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.safe{width:310px;height:330px;margin:0 auto;position:relative}
.lock{position:absolute;top:0;left:50%;width:84px;height:70px;margin-left:-42px}
.shackle{position:absolute;top:0;left:50%;width:52px;height:44px;margin-left:-26px;border:9px solid #8f97a9;border-bottom:0;border-radius:26px 26px 0 0;transform-origin:88% 100%;transition:transform .6s cubic-bezier(.4,0,.3,1.3)}
.device.on .shackle{transform:rotate(-38deg)}
.lbody{position:absolute;bottom:0;left:50%;width:84px;height:56px;margin-left:-42px;border-radius:12px;background:linear-gradient(180deg,#e8b23a,#a8761a);box-shadow:0 6px 14px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.4)}
.lbody::after{content:'';position:absolute;top:50%;left:50%;width:16px;height:20px;margin:-10px 0 0 -8px;border-radius:50%;background:#3a2c08;box-shadow:inset 0 2px 4px #000}
.dialwrap{position:absolute;bottom:0;left:50%;width:230px;height:230px;margin-left:-115px}
.ptr{position:absolute;top:-8px;left:50%;width:0;height:0;margin-left:-11px;border-left:11px solid transparent;border-right:11px solid transparent;border-top:18px solid #e04040;z-index:5;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.dial{position:absolute;inset:14px;border-radius:50%;background:radial-gradient(circle,#333a4d 0 56%,#171b26 57%);border:7px solid #4a5162;box-shadow:0 10px 26px rgba(0,0,0,.55),inset 0 3px 10px rgba(0,0,0,.6);transform:rotate(122deg);transition:transform 1.5s cubic-bezier(.25,.7,.3,1)}
.device.on .dial{transform:rotate(842deg)}
.dial::before{content:'';position:absolute;inset:6px;border-radius:50%;background:repeating-conic-gradient(from -90deg,#cfd6e4 0 2deg,transparent 2deg 30deg);-webkit-mask:radial-gradient(circle,transparent 0 64%,#000 65%);mask:radial-gradient(circle,transparent 0 64%,#000 65%)}
.num{position:absolute;top:50%;left:50%;font-size:15px;font-weight:800;color:#cfd6e4;width:24px;height:24px;margin:-12px;text-align:center;line-height:24px}
.num.n0{transform:translateY(-72px)}.num.n3{transform:translateX(72px)}.num.n6{transform:translateY(72px)}.num.n9{transform:translateX(-72px)}
.mark{position:absolute;top:8px;left:50%;width:10px;height:22px;margin-left:-5px;border-radius:5px;background:#e04040;box-shadow:0 0 8px rgba(224,64,64,.8)}
.hub{position:absolute;top:50%;left:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#dfe4ee,#767e92 70%);box-shadow:0 4px 10px rgba(0,0,0,.5)}
.led{position:absolute;bottom:8px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#5a2126;border:2px solid #10131a;transition:all .4s}
.device.on .led{background:radial-gradient(circle at 40% 35%,#d6ffe2,#2fbf71 70%);box-shadow:0 0 14px 3px rgba(60,220,130,.75)}
.cap{position:absolute;bottom:-24px;left:0;right:0;font-size:11px;letter-spacing:3px;color:#5c6172}
.status{margin-top:40px;font-size:14px;color:#9aa0b4}
.status b{color:#ffd479}
.hint{font-size:11px;color:#5c6172;margin-top:6px}
</style>
</head>
<body>
<div class="stage">
<h2>密码轮</h2>
<div class="sub">点击旋转密码盘，对准刻度开锁</div>
<div class="device" id="dev">
<div class="safe">
<div class="lock"><div class="shackle"></div><div class="lbody"></div></div>
<div class="dialwrap">
<div class="ptr"></div>
<div class="dial">
<span class="num n0">0</span><span class="num n3">3</span><span class="num n6">6</span><span class="num n9">9</span>
<div class="mark"></div><div class="hub"></div>
</div>
<div class="led"></div>
</div>
<div class="cap">保险柜 · 密码盘</div>
</div>
</div>
<div class="status">状态：<b id="st">关 · 已上锁</b></div>
<div class="hint">点击密码盘切换</div>
</div>
<script>
var dev=document.getElementById('dev'),st=document.getElementById('st'),on=location.search.indexOf('s=1')>-1;
function render(){dev.classList.toggle('on',on);st.textContent=on?'开 · 已开锁':'关 · 已上锁';}
if(on)document.body.classList.add('freeze');
dev.addEventListener('click',function(){on=!on;render();});
render();
</script>
</body>
</html>
