<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>多米诺</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0e0f13;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#e8eaf0;padding:20px}
body.freeze *{transition:none!important;animation:none!important}
.stage{width:360px;max-width:100%;text-align:center}
h2{font-size:17px;letter-spacing:3px;margin-bottom:4px}
.sub{font-size:12px;color:#8a8fa3;margin-bottom:20px}
.device{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.lane{width:340px;height:280px;margin:0 auto;border-radius:18px;position:relative;background:linear-gradient(180deg,#131722,#1e2434);box-shadow:0 12px 32px rgba(0,0,0,.5);overflow:hidden}
.word{position:absolute;top:44px;left:0;right:0;text-align:center;font-size:88px;font-weight:900;letter-spacing:12px;color:#ffd479;opacity:0;transform:scale(.8);text-shadow:0 0 30px rgba(255,212,121,.8);transition:opacity .6s ease .9s,transform .6s ease .9s}
.device.on .word{opacity:1;transform:scale(1)}
.deck{position:absolute;bottom:52px;left:24px;right:24px;height:12px;border-radius:6px;background:linear-gradient(180deg,#4a5162,#2c313d);box-shadow:0 4px 10px rgba(0,0,0,.5)}
.dom{position:absolute;bottom:64px;width:36px;height:76px;border-radius:7px;background:linear-gradient(180deg,#f6f8fc,#c6cddb);box-shadow:0 6px 14px rgba(0,0,0,.45);transform-origin:50% 100%;left:calc(34px + var(--i)*47px);transform:rotate(0deg);transition:transform .5s cubic-bezier(.5,0,.8,.4);transition-delay:calc((5 - var(--i))*130ms)}
.dom::before{content:'';position:absolute;top:50%;left:6px;right:6px;height:2px;margin-top:-1px;background:#9aa2b5}
.dom::after{content:'';position:absolute;inset:6px;background:
 radial-gradient(circle,#2b3040 3.5px,transparent 4.5px) 50% 22%/100% 30% no-repeat,
 radial-gradient(circle,#2b3040 3.5px,transparent 4.5px) 50% 78%/100% 30% no-repeat}
.device.on .dom{transform:rotate(74deg);transition-delay:calc(var(--i)*130ms)}
.push{position:absolute;bottom:64px;left:8px;font-size:22px;transition:transform .4s,opacity .4s}
.device.on .push{transform:translateX(26px);opacity:0}
.cap{position:absolute;bottom:16px;left:0;right:0;font-size:11px;letter-spacing:3px;color:#5c6172}
.status{margin-top:18px;font-size:14px;color:#9aa0b4}
.status b{color:#ffd479}
.hint{font-size:11px;color:#5c6172;margin-top:6px}
</style>
</head>
<body>
<div class="stage">
<h2>多米诺</h2>
<div class="sub">点击推倒 / 扶起多米诺骨牌</div>
<div class="device" id="dev">
<div class="lane">
<div class="word">开</div>
<div class="deck"></div>
<div class="push">👉</div>
<span class="dom" style="--i:0"></span><span class="dom" style="--i:1"></span><span class="dom" style="--i:2"></span><span class="dom" style="--i:3"></span><span class="dom" style="--i:4"></span><span class="dom" style="--i:5"></span>
<div class="cap">六张骨牌 · 连锁反应</div>
</div>
</div>
<div class="status">状态：<b id="st">关 · 骨牌直立</b></div>
<div class="hint">点击牌阵切换</div>
</div>
<script>
var dev=document.getElementById('dev'),st=document.getElementById('st'),on=location.search.indexOf('s=1')>-1;
function render(){dev.classList.toggle('on',on);st.textContent=on?'开 · 已推倒':'关 · 骨牌直立';}
if(on)document.body.classList.add('freeze');
dev.addEventListener('click',function(){on=!on;render();});
render();
</script>
</body>
</html>
