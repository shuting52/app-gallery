<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>保险丝</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0e0f13;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#e8eaf0;padding:20px}
body.freeze *{transition:none!important;animation:none!important}
.stage{width:360px;max-width:100%;text-align:center}
h2{font-size:17px;letter-spacing:3px;margin-bottom:4px}
.sub{font-size:12px;color:#8a8fa3;margin-bottom:20px}
.device{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.box{width:330px;height:270px;margin:0 auto;border-radius:18px;position:relative;background:linear-gradient(180deg,#2b3040,#191c26);box-shadow:0 12px 32px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08)}
.box.flash{animation:flsh .5s ease}
@keyframes flsh{0%{box-shadow:0 0 0 rgba(255,180,80,0)}30%{box-shadow:0 0 46px rgba(255,180,80,.8)}100%{box-shadow:0 12px 32px rgba(0,0,0,.55)}}
.fuse{position:absolute;top:64px;left:36px;right:36px;height:58px;border-radius:29px;background:linear-gradient(180deg,rgba(190,215,245,.22),rgba(190,215,245,.07));border:2px solid #6e7688;box-shadow:inset 0 2px 8px rgba(0,0,0,.35)}
.capm{position:absolute;top:58px;width:30px;height:70px;border-radius:8px;background:linear-gradient(180deg,#e8ebf2,#8f97a9);box-shadow:0 3px 8px rgba(0,0,0,.5)}
.capm.l{left:22px}.capm.r{right:22px}
svg.wire{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.fil-ok{opacity:0;transition:opacity .3s}
.fil-bad{opacity:1;transition:opacity .3s}
.device.on .fil-ok{opacity:1}
.device.on .fil-bad{opacity:0}
.cur{stroke-dasharray:8 10;opacity:0}
.device.on .cur{opacity:1;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-36}}
.bulb{position:absolute;bottom:36px;left:50%;width:64px;height:64px;margin-left:-32px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#3a3f52,#232833 70%);border:3px solid #4a5162;transition:all .5s}
.device.on .bulb{background:radial-gradient(circle at 40% 35%,#fff6d8,#ffc93e 60%,#e09b1f);border-color:#ffd479;box-shadow:0 0 34px 10px rgba(255,200,70,.55)}
.base{position:absolute;bottom:14px;left:50%;width:34px;height:24px;margin-left:-17px;background:linear-gradient(180deg,#8f97a9,#5a6274);border-radius:4px 4px 8px 8px}
.bulb-lb{position:absolute;bottom:8px;right:18px;font-size:11px;color:#8a8fa3;letter-spacing:2px}
.fuse-lb{position:absolute;top:30px;left:0;right:0;font-size:11px;color:#8a8fa3;letter-spacing:4px}
.stamp{position:absolute;top:126px;right:30px;font-size:12px;font-weight:800;letter-spacing:2px;padding:6px 12px;border-radius:8px;border:2px solid #e04040;color:#e04040;transform:rotate(-12deg);transition:all .4s}
.device.on .stamp{border-color:#2fbf71;color:#2fbf71}
.status{margin-top:18px;font-size:14px;color:#9aa0b4}
.status b{color:#ffd479}
.hint{font-size:11px;color:#5c6172;margin-top:6px}
</style>
</head>
<body>
<div class="stage">
<h2>保险丝</h2>
<div class="sub">点击更换保险丝，接通 / 熔断电路</div>
<div class="device" id="dev">
<div class="box" id="box">
<div class="fuse-lb">玻璃管保险丝 · 5A</div>
<svg class="wire" viewBox="0 0 330 270">
<path class="cur" d="M52,93 L52,220 L133,220" stroke="#6ec6ff" stroke-width="4" fill="none"/>
<path class="cur" d="M278,93 L278,220 L197,220" stroke="#6ec6ff" stroke-width="4" fill="none"/>
<path d="M52,93 L52,220 L133,220 M278,93 L278,220 L197,220" stroke="#3a3f52" stroke-width="4" fill="none"/>
<g class="fil-bad" stroke="#5a6274" stroke-width="4" fill="none" stroke-linecap="round">
<polyline points="95,93 120,84 145,102 170,84 195,102 215,93"/>
<line x1="150" y1="80" x2="160" y2="106" stroke-width="3"/>
</g>
<g class="fil-ok" stroke="#ffb14d" stroke-width="4" fill="none" stroke-linecap="round" style="filter:drop-shadow(0 0 6px #ff9a2a)">
<polyline points="95,93 120,84 145,102 170,84 195,102 235,93"/>
</g>
</svg>
<div class="capm l"></div><div class="capm r"></div><div class="fuse"></div>
<div class="stamp" id="stamp">熔断</div>
<div class="bulb"></div><div class="base"></div>
<div class="bulb-lb">灯泡</div>
</div>
</div>
<div class="status">状态：<b id="st">关 · 已熔断</b></div>
<div class="hint">点击保险丝盒切换</div>
</div>
<script>
var dev=document.getElementById('dev'),st=document.getElementById('st'),stamp=document.getElementById('stamp'),box=document.getElementById('box'),on=location.search.indexOf('s=1')>-1;
function render(){dev.classList.toggle('on',on);st.textContent=on?'开 · 电路导通':'关 · 已熔断';stamp.textContent=on?'导通':'熔断';if(on){box.classList.remove('flash');void box.offsetWidth;box.classList.add('flash');}}
if(on)document.body.classList.add('freeze');
dev.addEventListener('click',function(){on=!on;render();});
render();
</script>
</body>
</html>
