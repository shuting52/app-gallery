<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通知 Toast · 侧边滑入</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(1000px 700px at 110% 50%,#0e3a3a 0%,#0a1a1e 55%,#060d10 100%);color:#d9fffa;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;justify-content:center;padding:16px 0;min-height:100vh}
.stage{width:360px;max-width:94vw}
.head{text-align:center;padding:8px 0 12px}
.head .no{display:inline-block;font-size:11px;letter-spacing:3px;color:#5eead4;border:1px solid rgba(94,234,212,.45);border-radius:20px;padding:3px 12px;margin-bottom:8px}
.head h1{font-size:20px}
.head p{font-size:12px;color:#7fa8a2;margin-top:6px}
.screen{position:relative;height:540px;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#0b1d20,#070f12);border:1px solid rgba(94,234,212,.16);box-shadow:0 24px 60px rgba(0,0,0,.55)}
.rail{position:absolute;top:0;bottom:0;right:0;width:74px;background:linear-gradient(270deg,rgba(94,234,212,.10),transparent);border-left:1px dashed rgba(94,234,212,.3);z-index:1}
.rail span{position:absolute;top:14px;right:10px;writing-mode:vertical-rl;font-size:11px;color:#5b7f7a;letter-spacing:3px}
.flow{position:absolute;left:24px;top:120px;bottom:120px;width:2px;background:linear-gradient(180deg,transparent,rgba(94,234,212,.5),transparent);z-index:0}
.toast{position:absolute;top:96px;left:16px;right:16px;background:#0f2629;border:1px solid rgba(94,234,212,.45);border-left:4px solid #5eead4;border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 14px 34px rgba(0,0,0,.5);visibility:hidden;will-change:transform,opacity;z-index:3}
.toast .ic{flex:0 0 40px;width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#14b8a6,#0ea5e9);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#04211d}
.toast .tt{font-size:14px;font-weight:700}
.toast .bd{font-size:12px;color:#9fc4be;margin-top:3px;line-height:1.5}
.foot{text-align:center;font-size:11px;color:#5b7f7a;padding:12px 0;letter-spacing:2px}
</style>
</head>
<body>
<div class="stage">
  <div class="head"><div class="no">N03 · 通知 TOAST</div><h1>侧边滑入</h1><p>从右侧滑入 · 入场带倾斜回正 · 收起向左滑出</p></div>
  <div class="screen" id="screen">
    <div class="flow"></div>
    <div class="rail"><span>滑轨 SLIDE</span></div>
    <div class="toast" id="toast"><div class="ic" id="tic">讯</div><div><div class="tt" id="ttt"></div><div class="bd" id="tbd"></div></div></div>
  </div>
  <div class="foot">自动循环 · 每条展示约 2.5 秒</div>
</div>
<script>
(function(){
  var toast=document.getElementById('toast'),
      tic=document.getElementById('tic'),
      ttt=document.getElementById('ttt'),
      tbd=document.getElementById('tbd');
  var msgs=[
    {ic:'讯',t:'天气快讯',b:'台风路径北移，请沿海居民注意防范'},
    {ic:'件',t:'新邮件',b:'您的报销申请已通过财务审核'},
    {ic:'乐',t:'音乐更新',b:'收藏歌单已新增 10 首歌曲，快来听'}
  ];
  function tw(dur,update,done){
    var n=Math.max(1,Math.round(dur/16)),i=0;
    (function tick(){
      i++;var p=Math.min(1,i/n);update(p);
      if(p<1){setTimeout(tick,16);}else if(done){done();}
    })();
  }
  function easeOutQuad(x){return 1-(1-x)*(1-x);}
  var idx=0;
  function show(m,cb){
    tic.textContent=m.ic;ttt.textContent=m.t;tbd.textContent=m.b;
    toast.style.visibility='visible';
    toast.style.opacity='1';
    tw(560,function(p){
      var e=easeOutQuad(p);
      var x=(400*(1-e)).toFixed(1);
      var sk=(-12*(1-e)).toFixed(2);
      toast.style.transform='translateX('+x+'px) skewX('+sk+'deg)';
    },cb);
  }
  function hide(cb){
    tw(400,function(p){
      var e=p*p;
      var x=(-e*420).toFixed(1);
      var sk=(e*10).toFixed(2);
      toast.style.transform='translateX('+x+'px) skewX('+sk+'deg)';
      toast.style.opacity=(1-p).toFixed(2);
    },function(){toast.style.visibility='hidden';cb();});
  }
  (function loop(){
    show(msgs[idx],function(){
      setTimeout(function(){
        hide(function(){idx=(idx+1)%msgs.length;loop();});
      },2500);
    });
  })();
})();
</script>
</body>
</html>
