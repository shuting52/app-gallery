<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通知 Toast · 底部弹跳</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(1000px 700px at 50% 110%,#3a2410 0%,#17100a 55%,#0b0805 100%);color:#ffedd6;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;justify-content:center;padding:16px 0;min-height:100vh}
.stage{width:360px;max-width:94vw}
.head{text-align:center;padding:8px 0 12px}
.head .no{display:inline-block;font-size:11px;letter-spacing:3px;color:#ffb066;border:1px solid rgba(255,176,102,.45);border-radius:20px;padding:3px 12px;margin-bottom:8px}
.head h1{font-size:20px}
.head p{font-size:12px;color:#b99a78;margin-top:6px}
.screen{position:relative;height:540px;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#191008,#0e0a06);border:1px solid rgba(255,176,102,.16);box-shadow:0 24px 60px rgba(0,0,0,.55)}
.coil{position:absolute;left:8%;right:8%;bottom:26px;height:64px;z-index:1;opacity:.5}
.coil i{position:absolute;left:0;right:0;border:2px solid rgba(255,154,60,.55);border-top:none;border-radius:0 0 40px 40px}
.coil i:nth-child(1){top:0;height:18px}
.coil i:nth-child(2){top:16px;height:22px}
.coil i:nth-child(3){top:36px;height:26px}
.pad{position:absolute;left:0;right:0;bottom:0;height:26px;background:linear-gradient(180deg,#4a2c14,#2a1a0c);border-top:2px solid rgba(255,176,102,.5);z-index:1}
.pad span{position:absolute;top:6px;left:16px;font-size:11px;color:#8a6a4a;letter-spacing:2px}
.toast{position:absolute;bottom:110px;left:16px;right:16px;background:#fff7ec;border:1px solid rgba(255,154,60,.5);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 14px 34px rgba(0,0,0,.5),0 0 0 6px rgba(255,154,60,.08);visibility:hidden;will-change:transform,opacity;z-index:3}
.toast .ic{flex:0 0 40px;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#ff9a3c,#ff5e62);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff}
.toast .tt{font-size:14px;font-weight:700;color:#3a2410}
.toast .bd{font-size:12px;color:#8a6a4a;margin-top:3px;line-height:1.5}
.foot{text-align:center;font-size:11px;color:#8a6a4a;padding:12px 0;letter-spacing:2px}
</style>
</head>
<body>
<div class="stage">
  <div class="head"><div class="no">N02 · 通知 TOAST</div><h1>底部弹跳</h1><p>从底部弹簧弹上 · 带 overshoot 回弹 · 收起下沉</p></div>
  <div class="screen" id="screen">
    <div class="coil"><i></i><i></i><i></i></div>
    <div class="pad"><span>弹簧垫 SPRING</span></div>
    <div class="toast" id="toast"><div class="ic" id="tic">弹</div><div><div class="tt" id="ttt"></div><div class="bd" id="tbd"></div></div></div>
  </div>
  <div class="foot">自动循环 · 每条展示约 2.5 秒</div>
</div>
<script>
(function(){
  var toast=document.getElementById('toast'),
      tic=document.getElementById('tic'),
      ttt=document.getElementById('ttt'),
      tbd=document.getElementById('tbd');
  var msgs=[
    {ic:'弹',t:'弹簧自检',b:'弹性系数正常，今日可承受 328 次弹跳'},
    {ic:'咖',t:'外卖通知',b:'您的拿铁已送达前台，请尽快取餐'},
    {ic:'动',t:'运动提醒',b:'今日步数已突破 8000，继续保持'}
  ];
  function tw(dur,update,done){
    var n=Math.max(1,Math.round(dur/16)),i=0;
    (function tick(){
      i++;var p=Math.min(1,i/n);update(p);
      if(p<1){setTimeout(tick,16);}else if(done){done();}
    })();
  }
  function easeOutBack(x){var c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);}
  var idx=0,START=260;
  function show(m,cb){
    tic.textContent=m.ic;ttt.textContent=m.t;tbd.textContent=m.b;
    toast.style.visibility='visible';
    toast.style.opacity='1';
    tw(700,function(p){
      var e=easeOutBack(p);
      toast.style.transform='translateY('+(START*(1-e)).toFixed(1)+'px)';
    },cb);
  }
  function hide(cb){
    tw(420,function(p){
      var e=p*p;
      toast.style.transform='translateY('+(e*280).toFixed(1)+'px)';
      toast.style.opacity=(1-p).toFixed(2);
    },function(){toast.style.visibility='hidden';cb();});
  }
  (function loop(){
    show(msgs[idx],function(){
      setTimeout(function(){
        hide(function(){idx=(idx+1)%msgs.length;loop();});
      },2500);
    });
  })();
})();
</script>
</body>
</html>
