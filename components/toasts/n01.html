<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通知 Toast · 顶部掉落</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(1000px 700px at 50% -10%,#17233d 0%,#0a0f1e 55%,#060a14 100%);color:#eaf1ff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;justify-content:center;padding:16px 0;min-height:100vh}
.stage{width:360px;max-width:94vw}
.head{text-align:center;padding:8px 0 12px}
.head .no{display:inline-block;font-size:11px;letter-spacing:3px;color:#7ea6ff;border:1px solid rgba(126,166,255,.45);border-radius:20px;padding:3px 12px;margin-bottom:8px}
.head h1{font-size:20px}
.head p{font-size:12px;color:#8fa3c8;margin-top:6px}
.screen{position:relative;height:540px;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#0d1626,#080d19);border:1px solid rgba(126,166,255,.16);box-shadow:0 24px 60px rgba(0,0,0,.55)}
.star{position:absolute;border-radius:50%;background:#cfe0ff;z-index:0}
.dropzone{position:absolute;left:0;right:0;top:0;height:86px;border-bottom:1px dashed rgba(126,166,255,.3);z-index:1}
.dropzone span{position:absolute;top:10px;left:16px;font-size:11px;color:#5f7396;letter-spacing:2px}
.ground{position:absolute;left:0;right:0;bottom:0;height:110px;background:linear-gradient(180deg,transparent,rgba(77,163,255,.10));border-top:1px dashed rgba(126,166,255,.3);z-index:1}
.ground span{position:absolute;bottom:12px;left:16px;font-size:11px;color:#5f7396;letter-spacing:2px}
.toast{position:absolute;top:96px;left:16px;right:16px;background:#16233d;border:1px solid rgba(126,166,255,.4);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 14px 34px rgba(0,0,0,.5);visibility:hidden;will-change:transform,opacity;z-index:3}
.toast .ic{flex:0 0 40px;width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#4da3ff,#7a5cff);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff}
.toast .tt{font-size:14px;font-weight:700}
.toast .bd{font-size:12px;color:#a9bcd9;margin-top:3px;line-height:1.5}
.foot{text-align:center;font-size:11px;color:#5f7396;padding:12px 0;letter-spacing:2px}
</style>
</head>
<body>
<div class="stage">
  <div class="head"><div class="no">N01 · 通知 TOAST</div><h1>顶部掉落</h1><p>从顶部掉落 · 落地重力弹跳 · 收起向上飞出</p></div>
  <div class="screen" id="screen">
    <div class="dropzone"><span>投放口 DROP</span></div>
    <div class="ground"><span>地面 GROUND</span></div>
    <div class="toast" id="toast"><div class="ic" id="tic">快</div><div><div class="tt" id="ttt"></div><div class="bd" id="tbd"></div></div></div>
  </div>
  <div class="foot">自动循环 · 每条展示约 2.5 秒</div>
</div>
<script>
(function(){
  var screen=document.getElementById('screen');
  for(var i=0;i<36;i++){
    var s=document.createElement('i');s.className='star';
    var z=1+((Math.random()*2)|0);
    s.style.left=(Math.random()*100).toFixed(1)+'%';
    s.style.top=(Math.random()*60).toFixed(1)+'%';
    s.style.width=z+'px';s.style.height=z+'px';
    s.style.opacity=(0.25+Math.random()*0.55).toFixed(2);
    screen.appendChild(s);
  }
  var toast=document.getElementById('toast'),
      tic=document.getElementById('tic'),
      ttt=document.getElementById('ttt'),
      tbd=document.getElementById('tbd');
  var msgs=[
    {ic:'快',t:'快递通知',b:'您的包裹已到达小区驿站，请及时取件'},
    {ic:'信',t:'新消息',b:'陈淑婷：今晚 8 点直播，别迟到～'},
    {ic:'券',t:'优惠提醒',b:'满 100 减 30 优惠券已到账，今晚 24 点过期'}
  ];
  function tw(dur,update,done){
    var n=Math.max(1,Math.round(dur/16)),i=0;
    (function tick(){
      i++;var p=Math.min(1,i/n);update(p);
      if(p<1){setTimeout(tick,16);}else if(done){done();}
    })();
  }
  function easeOutBounce(x){
    var n1=7.5625,d1=2.75;
    if(x<1/d1)return n1*x*x;
    if(x<2/d1)return n1*(x-=1.5/d1)*x+.75;
    if(x<2.5/d1)return n1*(x-=2.25/d1)*x+.9375;
    return n1*(x-=2.625/d1)*x+.984375;
  }
  var idx=0,START=-180;
  function show(m,cb){
    tic.textContent=m.ic;ttt.textContent=m.t;tbd.textContent=m.b;
    toast.style.visibility='visible';
    toast.style.opacity='1';
    tw(700,function(p){
      var e=easeOutBounce(p);
      toast.style.transform='translateY('+(START*(1-e)).toFixed(1)+'px)';
    },cb);
  }
  function hide(cb){
    tw(420,function(p){
      var e=p*p;
      toast.style.transform='translateY('+(-e*280).toFixed(1)+'px)';
      toast.style.opacity=(1-p).toFixed(2);
    },function(){
      toast.style.visibility='hidden';
      hide.done=true;cb();
    });
  }
  (function loop(){
    show(msgs[idx],function(){
      setTimeout(function(){
        hide(function(){idx=(idx+1)%msgs.length;loop();});
      },2500);
    });
  })();
})();
</script>
</body>
</html>
