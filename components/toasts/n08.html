<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通知 Toast · 倒计时进度条</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(1000px 700px at 50% 0%,#1c1c22 0%,#101014 55%,#0a0a0d 100%);color:#ececf1;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;justify-content:center;padding:16px 0;min-height:100vh}
.stage{width:360px;max-width:94vw}
.head{text-align:center;padding:8px 0 12px}
.head .no{display:inline-block;font-size:11px;letter-spacing:3px;color:#a5b4fc;border:1px solid rgba(165,180,252,.45);border-radius:20px;padding:3px 12px;margin-bottom:8px}
.head h1{font-size:20px}
.head p{font-size:12px;color:#8b8b96;margin-top:6px}
.screen{position:relative;height:540px;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#15151b,#0d0d11);border:1px solid rgba(165,180,252,.16);box-shadow:0 24px 60px rgba(0,0,0,.55)}
.timer{position:absolute;top:40px;left:0;right:0;text-align:center;z-index:1}
.timer .num{font-size:44px;font-weight:800;color:#e4e4ef;font-variant-numeric:tabular-nums}
.timer .lbl{font-size:11px;color:#6d6d7a;letter-spacing:3px;margin-top:4px}
.toast{position:absolute;top:170px;left:16px;right:16px;background:#1d1d24;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:14px 14px 18px;display:flex;gap:12px;align-items:center;box-shadow:0 14px 34px rgba(0,0,0,.5);visibility:hidden;will-change:transform,opacity;z-index:3;overflow:hidden}
.toast .ic{flex:0 0 40px;width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#818cf8,#6366f1);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff}
.toast .tt{font-size:14px;font-weight:700}
.toast .bd{font-size:12px;color:#a7a7b3;margin-top:3px;line-height:1.5}
.pbar{position:absolute;left:0;bottom:0;height:5px;width:100%;background:rgba(255,255,255,.08)}
.pbar i{position:absolute;left:0;top:0;bottom:0;width:100%;background:#34d399;display:block}
.foot{text-align:center;font-size:11px;color:#6d6d7a;padding:12px 0;letter-spacing:2px}
</style>
</head>
<body>
<div class="stage">
  <div class="head"><div class="no">N08 · 通知 TOAST</div><h1>倒计时进度条</h1><p>底部进度条 3 秒走完 · 走完自动滑出 · 下一条进入</p></div>
  <div class="screen" id="screen">
    <div class="timer"><div class="num" id="num">3.0</div><div class="lbl">自动消失倒计时</div></div>
    <div class="toast" id="toast">
      <div class="ic" id="tic">时</div>
      <div><div class="tt" id="ttt"></div><div class="bd" id="tbd"></div></div>
      <div class="pbar"><i id="pfill"></i></div>
    </div>
  </div>
  <div class="foot">自动循环 · 每条展示约 3 秒</div>
</div>
<script>
(function(){
  var toast=document.getElementById('toast'),
      tic=document.getElementById('tic'),
      ttt=document.getElementById('ttt'),
      tbd=document.getElementById('tbd'),
      pfill=document.getElementById('pfill'),
      num=document.getElementById('num');
  var msgs=[
    {ic:'时',t:'限时秒杀',b:'优惠券 3 秒后失效，请尽快使用'},
    {ic:'验',t:'验证码',b:'您的登录验证码为 482913，3 秒后隐藏'},
    {ic:'抢',t:'抢购提醒',b:'心愿单商品补货，倒计时结束开抢'}
  ];
  var HOLD=3000;
  function tw(dur,update,done){
    var n=Math.max(1,Math.round(dur/16)),i=0;
    (function tick(){
      i++;var p=Math.min(1,i/n);update(p);
      if(p<1){setTimeout(tick,16);}else if(done){done();}
    })();
  }
  function easeOutQuad(x){return 1-(1-x)*(1-x);}
  function barColor(p){
    /* p:0→1，绿→黄→红 */
    var r,g;
    if(p<0.5){r=Math.round(52+(251-52)*(p/0.5));g=Math.round(211+(191-211)*(p/0.5));}
    else{r=Math.round(251+(248-251)*((p-0.5)/0.5));g=Math.round(191+(113-191)*((p-0.5)/0.5));}
    return 'rgb('+r+','+g+','+(p<0.5?153:113)+')';
  }
  var idx=0;
  function show(m,cb){
    tic.textContent=m.ic;ttt.textContent=m.t;tbd.textContent=m.b;
    toast.style.visibility='visible';
    toast.style.opacity='1';
    tw(380,function(p){
      var e=easeOutQuad(p);
      toast.style.transform='translateX('+(420*(1-e)).toFixed(1)+'px)';
    },function(){
      toast.style.transform='translateX(0px)';
      /* 倒计时走条 */
      tw(HOLD,function(p){
        pfill.style.width=((1-p)*100).toFixed(2)+'%';
        pfill.style.background=barColor(p);
        num.textContent=((HOLD*(1-p))/1000).toFixed(1);
      },function(){
        num.textContent='0.0';
        cb();
      });
    });
  }
  function hide(cb){
    tw(380,function(p){
      var e=p*p;
      toast.style.transform='translateX('+(e*440).toFixed(1)+'px)';
      toast.style.opacity=(1-p).toFixed(2);
    },function(){toast.style.visibility='hidden';cb();});
  }
  (function loop(){
    show(msgs[idx],function(){
      hide(function(){idx=(idx+1)%msgs.length;loop();});
    });
  })();
})();
</script>
</body>
</html>
