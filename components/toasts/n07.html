<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通知 Toast · 堆叠轮播</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(1000px 700px at 50% 0%,#123324 0%,#0a1a12 55%,#060d08 100%);color:#dcf5e5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;justify-content:center;padding:16px 0;min-height:100vh}
.stage{width:360px;max-width:94vw}
.head{text-align:center;padding:8px 0 12px}
.head .no{display:inline-block;font-size:11px;letter-spacing:3px;color:#6ee7a8;border:1px solid rgba(110,231,168,.45);border-radius:20px;padding:3px 12px;margin-bottom:8px}
.head h1{font-size:20px}
.head p{font-size:12px;color:#6d9480;margin-top:6px}
.screen{position:relative;height:540px;border-radius:22px;overflow:hidden;background:radial-gradient(400px 300px at 50% 30%,#123324,#0a1a12);border:1px solid rgba(110,231,168,.16);box-shadow:0 24px 60px rgba(0,0,0,.55)}
.felt{position:absolute;inset:0;opacity:.5;background:repeating-linear-gradient(45deg,transparent 0 14px,rgba(110,231,168,.03) 14px 28px)}
.decklabel{position:absolute;top:52px;left:0;right:0;text-align:center;font-size:11px;color:#4d7a5f;letter-spacing:3px;z-index:1}
.card{position:absolute;top:110px;left:16px;right:16px;background:linear-gradient(135deg,#fdfbf4,#f3ecd9);border:1px solid #d8cba4;border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:0 14px 34px rgba(0,0,0,.5);will-change:transform,opacity;z-index:1}
.card .ic{flex:0 0 40px;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff}
.card .tt{font-size:14px;font-weight:700;color:#2c3a2e}
.card .bd{font-size:12px;color:#6d7a6d;margin-top:3px;line-height:1.5}
.foot{text-align:center;font-size:11px;color:#4d7a5f;padding:12px 0;letter-spacing:2px}
</style>
</head>
<body>
<div class="stage">
  <div class="head"><div class="no">N07 · 通知 TOAST</div><h1>堆叠轮播</h1><p>三张像扑克牌一样叠放 · 顶张飞走下一张顶上</p></div>
  <div class="screen" id="screen">
    <div class="felt"></div>
    <div class="decklabel">牌堆 DECK · 3 张循环</div>
    <div class="card" id="c0"><div class="ic" style="background:#c0392b">牌</div><div><div class="tt"></div><div class="bd"></div></div></div>
    <div class="card" id="c1"><div class="ic" style="background:#1f6f4a">赛</div><div><div class="tt"></div><div class="bd"></div></div></div>
    <div class="card" id="c2"><div class="ic" style="background:#2c5f9e">奖</div><div><div class="tt"></div><div class="bd"></div></div></div>
  </div>
  <div class="foot">自动循环 · 每轮顶出 1 张</div>
</div>
<script>
(function(){
  var msgs=[
    {t:'轮到您出牌',b:'牌友房「今晚八点场」已开桌，快来'},
    {t:'比赛报名',b:'周末牌友赛报名今晚 24 点截止'},
    {t:'奖励到账',b:'每日登录奖励：金豆 x500 已发放'},
    {t:'新牌局邀请',b:'好友邀请您加入「高手过招」房间'},
    {t:'段位提升',b:'恭喜，您的段位已升至钻石 III'}
  ];
  var cards=[document.getElementById('c0'),document.getElementById('c1'),document.getElementById('c2')];
  /* 每个位置的视觉参数：位移 / 缩放 / 透明度 / 层级 / 亮度 */
  var POS=[
    {y:0, s:1.00, o:1.00, z:3, dim:1},
    {y:18,s:0.94, o:0.80, z:2, dim:0.82},
    {y:36,s:0.88, o:0.60, z:1, dim:0.64}
  ];
  function paint(el,m){
    el.querySelector('.tt').textContent=m.t;
    el.querySelector('.bd').textContent=m.b;
  }
  function apply(el,p){
    el.style.transform='translateY('+p.y+'px) scale('+p.s+')';
    el.style.opacity=p.o.toFixed(2);
    el.style.zIndex=p.z;
    el.style.filter='brightness('+p.dim+')';
  }
  function tw(dur,update,done){
    var n=Math.max(1,Math.round(dur/16)),i=0;
    (function tick(){
      i++;var p=Math.min(1,i/n);update(p);
      if(p<1){setTimeout(tick,16);}else if(done){done();}
    })();
  }
  function easeOutQuad(x){return 1-(1-x)*(1-x);}
  /* order[0]=顶牌元素, order[1]=中牌, order[2]=底牌；mi=下一条要进牌堆的消息下标 */
  var order=[cards[0],cards[1],cards[2]],mi=3;
  paint(order[0],msgs[0]);paint(order[1],msgs[1]);paint(order[2],msgs[2]);
  apply(order[0],POS[0]);apply(order[1],POS[1]);apply(order[2],POS[2]);
  function round(){
    setTimeout(function(){
      var top=order[0],mid=order[1],bot=order[2];
      /* 1) 顶牌飞走 */
      tw(420,function(p){
        var e=easeOutQuad(p);
        top.style.transform='translateY('+(-e*220).toFixed(1)+'px) scale('+(1-e*0.15).toFixed(3)+') rotate('+(e*8).toFixed(1)+'deg)';
        top.style.opacity=(1-e).toFixed(2);
      },function(){
        /* 2) 飞走的牌换上新消息，瞬间放到牌堆最底 */
        paint(top,msgs[mi%msgs.length]);mi++;
        apply(top,POS[2]);
        /* 3) 中牌→顶，底牌→中，做补间 */
        var fromMid={y:POS[1].y,s:POS[1].s,o:POS[1].o,dim:POS[1].dim},
            fromBot={y:POS[2].y,s:POS[2].s,o:POS[2].o,dim:POS[2].dim};
        mid.style.zIndex=3;bot.style.zIndex=2;
        tw(420,function(p){
          var e=easeOutQuad(p);
          function mix(a,b){return a+(b-a)*e;}
          mid.style.transform='translateY('+mix(fromMid.y,POS[0].y).toFixed(1)+'px) scale('+mix(fromMid.s,POS[0].s).toFixed(3)+')';
          mid.style.opacity=mix(fromMid.o,POS[0].o).toFixed(2);
          mid.style.filter='brightness('+mix(fromMid.dim,POS[0].dim).toFixed(2)+')';
          bot.style.transform='translateY('+mix(fromBot.y,POS[1].y).toFixed(1)+'px) scale('+mix(fromBot.s,POS[1].s).toFixed(3)+')';
          bot.style.opacity=mix(fromBot.o,POS[1].o).toFixed(2);
          bot.style.filter='brightness('+mix(fromBot.dim,POS[1].dim).toFixed(2)+')';
        },function(){
          apply(mid,POS[0]);apply(bot,POS[1]);
          order=[mid,bot,top];
          round();
        });
      });
    },2500);
  }
  round();
})();
</script>
</body>
</html>
