<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通知 Toast · 翻转卡片</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(1000px 700px at 50% 0%,#2b1a4d 0%,#120b24 55%,#0a0616 100%);color:#efe8ff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;justify-content:center;padding:16px 0;min-height:100vh}
.stage{width:360px;max-width:94vw}
.head{text-align:center;padding:8px 0 12px}
.head .no{display:inline-block;font-size:11px;letter-spacing:3px;color:#c4a5ff;border:1px solid rgba(196,165,255,.45);border-radius:20px;padding:3px 12px;margin-bottom:8px}
.head h1{font-size:20px}
.head p{font-size:12px;color:#9a8cc4;margin-top:6px}
.screen{position:relative;height:540px;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#170f2e,#0c0718);border:1px solid rgba(196,165,255,.16);box-shadow:0 24px 60px rgba(0,0,0,.55);perspective:900px}
.axis{position:absolute;left:16px;right:16px;top:88px;border-top:1px dashed rgba(196,165,255,.35);z-index:1}
.axis span{position:absolute;top:8px;left:0;font-size:11px;color:#7a6a9e;letter-spacing:2px}
.toast{position:absolute;top:100px;left:16px;right:16px;background:linear-gradient(135deg,#2a1d52,#1c1338);border:1px solid rgba(196,165,255,.5);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 14px 34px rgba(0,0,0,.5);visibility:hidden;will-change:transform,opacity;z-index:3;transform-origin:50% 0%}
.toast .ic{flex:0 0 40px;width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#a78bfa,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff}
.toast .tt{font-size:14px;font-weight:700}
.toast .bd{font-size:12px;color:#b9a8e0;margin-top:3px;line-height:1.5}
.foot{text-align:center;font-size:11px;color:#7a6a9e;padding:12px 0;letter-spacing:2px}
</style>
</head>
<body>
<div class="stage">
  <div class="head"><div class="no">N04 · 通知 TOAST</div><h1>翻转卡片</h1><p>3D 卡片绕 X 轴翻转入场 · 收起反向翻出</p></div>
  <div class="screen" id="screen">
    <div class="axis"><span>翻转轴 X-AXIS</span></div>
    <div class="toast" id="toast"><div class="ic" id="tic">卡</div><div><div class="tt" id="ttt"></div><div class="bd" id="tbd"></div></div></div>
  </div>
  <div class="foot">自动循环 · 每条展示约 2.5 秒</div>
</div>
<script>
(function(){
  var toast=document.getElementById('toast'),
      tic=document.getElementById('tic'),
      ttt=document.getElementById('ttt'),
      tbd=document.getElementById('tbd');
  var msgs=[
    {ic:'卡',t:'会员卡',b:'本次消费积分 +200，当前等级：黄金'},
    {ic:'影',t:'电影上映',b:'《星际穿越》十周年重映，购票已开启'},
    {ic:'读',t:'阅读报告',b:'本周读书报告已生成，共读完 3 本书'}
  ];
  function tw(dur,update,done){
    var n=Math.max(1,Math.round(dur/16)),i=0;
    (function tick(){
      i++;var p=Math.min(1,i/n);update(p);
      if(p<1){setTimeout(tick,16);}else if(done){done();}
    })();
  }
  function easeOutBack(x){var c=1.4;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);}
  var idx=0;
  function show(m,cb){
    tic.textContent=m.ic;ttt.textContent=m.t;tbd.textContent=m.b;
    toast.style.visibility='visible';
    toast.style.opacity='1';
    tw(650,function(p){
      var e=easeOutBack(p);
      var deg=(-90*(1-e)).toFixed(2);
      toast.style.transform='rotateX('+deg+'deg)';
      toast.style.opacity=Math.min(1,p*3).toFixed(2);
    },function(){toast.style.transform='rotateX(0deg)';toast.style.opacity='1';cb();});
  }
  function hide(cb){
    tw(420,function(p){
      var e=p*p;
      toast.style.transform='rotateX('+(e*85).toFixed(2)+'deg)';
      toast.style.opacity=(1-p).toFixed(2);
    },function(){toast.style.visibility='hidden';cb();});
  }
  (function loop(){
    show(msgs[idx],function(){
      setTimeout(function(){
        hide(function(){idx=(idx+1)%msgs.length;loop();});
      },2500);
    });
  })();
})();
</script>
</body>
</html>
