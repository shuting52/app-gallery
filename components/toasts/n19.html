<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>n19 · 胶囊 Toast</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#141824;display:flex;flex-direction:column;align-items:center;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#fff}
.head{text-align:center;padding:20px 16px 12px}
.head h1{font-size:17px;color:#b79bff;letter-spacing:1px}
.head p{font-size:12px;color:#8b93a7;margin-top:6px}
.stage{width:360px;max-width:94vw;height:480px;border-radius:18px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 30%,#241d3a,#100d1c 75%);border:1px solid #3a2f5e;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.cap{position:absolute;left:50%;top:200px;transform:translate(-50%,-50%);height:48px;width:48px;background:linear-gradient(135deg,#7c5cff,#4dd2ff);border-radius:24px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 8px 26px rgba(124,92,255,.45)}
.cap .txt{font-size:15px;font-weight:700;color:#fff;white-space:nowrap;opacity:0}
.cap .dot{position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;opacity:.9}
.cap.grow{animation:grow .55s cubic-bezier(.3,1.3,.4,1) forwards}
.cap.grow .txt{animation:txtIn .4s .3s forwards}
.cap.grow .dot{animation:dotOut .3s forwards}
.cap.shrink{animation:shrink .45s ease-in forwards}
.cap.shrink .txt{animation:txtOut .2s forwards}
.cap.shrink .dot{animation:dotIn .3s .2s forwards}
@keyframes grow{from{width:48px}to{width:270px}}
@keyframes shrink{from{width:270px}to{width:48px}}
@keyframes txtIn{to{opacity:1}}
@keyframes txtOut{to{opacity:0}}
@keyframes dotOut{to{opacity:0;transform:scale(.3)}}
@keyframes dotIn{from{opacity:0;transform:scale(.3)}to{opacity:.9;transform:scale(1)}}
.hint{position:absolute;bottom:14px;width:100%;text-align:center;font-size:11px;color:#6f6391}
</style>
</head>
<body>
<div class="head"><h1>n19 · 胶囊</h1><p>小圆点膨胀成胶囊 → 文字淡入 → 收缩回圆点</p></div>
<div class="stage">
  <div class="cap" id="cap"><div class="dot"></div><span class="txt" id="txt"></span></div>
  <div class="hint">自动循环播放中 · 3 条通知轮播</div>
</div>
<script>
const msgs=["已复制到剪贴板","已加入收藏夹","已加入购物车"];
const cap=document.getElementById('cap'),txt=document.getElementById('txt');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function show(i){
  txt.textContent=msgs[i];
  cap.classList.remove('shrink');void cap.offsetWidth;cap.classList.add('grow');
  await sleep(3100);
  cap.classList.remove('grow');cap.classList.add('shrink');
  await sleep(550);
  cap.classList.remove('shrink');
  await sleep(300);
}
(async()=>{let i=0;while(true){await show(i%msgs.length);i++;}})();
</script>
</body>
</html>
