<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通知 Toast · 头像气泡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(1000px 700px at 50% 0%,#3a1f33 0%,#1c1019 55%,#100a0e 100%);color:#ffe9f4;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;justify-content:center;padding:16px 0;min-height:100vh}
.stage{width:360px;max-width:94vw}
.head{text-align:center;padding:8px 0 12px}
.head .no{display:inline-block;font-size:11px;letter-spacing:3px;color:#f9a8d4;border:1px solid rgba(249,168,212,.45);border-radius:20px;padding:3px 12px;margin-bottom:8px}
.head h1{font-size:20px}
.head p{font-size:12px;color:#a07e93;margin-top:6px}
.screen{position:relative;height:540px;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#221320,#120a10);border:1px solid rgba(249,168,212,.16);box-shadow:0 24px 60px rgba(0,0,0,.55)}
.chatbg{position:absolute;inset:0;opacity:.6;background:radial-gradient(2px 2px at 20% 30%,rgba(249,168,212,.25),transparent),radial-gradient(2px 2px at 70% 60%,rgba(249,168,212,.18),transparent),radial-gradient(3px 3px at 40% 80%,rgba(249,168,212,.15),transparent)}
.msg{position:absolute;top:120px;left:16px;right:16px;display:flex;gap:10px;align-items:flex-start;visibility:hidden;z-index:3;transform-origin:24px 24px;will-change:transform,opacity}
.avatar{flex:0 0 48px;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#ec4899,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;box-shadow:0 6px 18px rgba(236,72,153,.45);will-change:transform}
.bubble{position:relative;max-width:250px;background:#fff;color:#3a2333;border-radius:4px 16px 16px 16px;padding:10px 14px;box-shadow:0 10px 26px rgba(0,0,0,.45);will-change:transform,opacity;transform-origin:0 12px}
.bubble:before{content:'';position:absolute;left:-7px;top:10px;border:7px solid transparent;border-right-color:#fff;border-left:none}
.bubble .tt{font-size:12px;font-weight:700;color:#a04a7c;margin-bottom:2px}
.bubble .bd{font-size:14px;line-height:1.6}
.foot{text-align:center;font-size:11px;color:#a07e93;padding:12px 0;letter-spacing:2px}
</style>
</head>
<body>
<div class="stage">
  <div class="head"><div class="no">N09 · 通知 TOAST</div><h1>头像气泡</h1><p>圆形头像弹簧弹出 · 聊天气泡从旁展开 · 一起缩小消失</p></div>
  <div class="screen" id="screen">
    <div class="chatbg"></div>
    <div class="msg" id="msg">
      <div class="avatar" id="avatar">陈</div>
      <div class="bubble" id="bubble"><div class="tt" id="btt"></div><div class="bd" id="bbd"></div></div>
    </div>
  </div>
  <div class="foot">自动循环 · 每条展示约 2.5 秒</div>
</div>
<script>
(function(){
  var msg=document.getElementById('msg'),
      avatar=document.getElementById('avatar'),
      bubble=document.getElementById('bubble'),
      btt=document.getElementById('btt'),
      bbd=document.getElementById('bbd');
  var msgs=[
    {a:'陈',t:'陈淑婷',b:'在吗？新品链接发你了，帮我看看详情页'},
    {a:'助',t:'小助手',b:'您的直播预约成功，今晚 8 点准时开播'},
    {a:'团',t:'团购群',b:'拼单还差 1 人，截止今晚 12 点'}
  ];
  function tw(dur,update,done){
    var n=Math.max(1,Math.round(dur/16)),i=0;
    (function tick(){
      i++;var p=Math.min(1,i/n);update(p);
      if(p<1){setTimeout(tick,16);}else if(done){done();}
    })();
  }
  function easeOutBack(x){var c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);}
  function easeOutQuad(x){return 1-(1-x)*(1-x);}
  var idx=0;
  function show(m,cb){
    avatar.textContent=m.a;btt.textContent=m.t;bbd.textContent=m.b;
    msg.style.visibility='visible';
    msg.style.opacity='1';
    msg.style.transform='scale(1)';
    bubble.style.transform='scaleX(0)';
    bubble.style.opacity='0';
    /* 1) 头像弹簧弹出 */
    tw(450,function(p){
      var s=Math.max(0.01,easeOutBack(p));
      avatar.style.transform='scale('+s.toFixed(3)+')';
    },function(){
      avatar.style.transform='scale(1)';
      /* 2) 气泡从头像旁展开 */
      tw(420,function(p){
        var e=easeOutQuad(p);
        bubble.style.transform='scaleX('+Math.max(0.01,e).toFixed(3)+')';
        bubble.style.opacity=e.toFixed(2);
      },cb);
    });
  }
  function hide(cb){
    /* 整体一起缩小消失 */
    tw(400,function(p){
      var s=Math.max(0.01,1-p);
      msg.style.transform='scale('+s.toFixed(3)+')';
      msg.style.opacity=(1-p).toFixed(2);
    },function(){
      msg.style.visibility='hidden';
      avatar.style.transform='scale(1)';
      cb();
    });
  }
  (function loop(){
    show(msgs[idx],function(){
      setTimeout(function(){
        hide(function(){idx=(idx+1)%msgs.length;loop();});
      },2500);
    });
  })();
})();
</script>
</body>
</html>
