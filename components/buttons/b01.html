<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>水波纹变体</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:radial-gradient(120% 90% at 50% 10%, #101a3a 0%, #070b1c 60%, #04060f 100%);
    color:#e8ecff;display:flex;flex-direction:column;align-items:center;
    min-height:100vh;padding:28px 16px;overflow:hidden;
  }
  h1{font-size:20px;font-weight:600;letter-spacing:4px;margin-bottom:6px;}
  .sub{font-size:12px;color:#7c86a8;letter-spacing:2px;margin-bottom:34px;}
  .stage{
    width:360px;max-width:92vw;height:420px;border-radius:20px;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(120,140,255,.14);
    box-shadow:inset 0 0 60px rgba(40,60,160,.12);
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .btn{
    position:relative;overflow:hidden;cursor:pointer;border:none;
    padding:18px 64px;font-size:17px;font-weight:600;letter-spacing:6px;color:#fff;
    border-radius:999px;
    background:linear-gradient(135deg,#6d5cff,#2f9dff);
    box-shadow:0 8px 28px rgba(80,110,255,.45), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .btn:active{transform:scale(.97);}
  .ripple{
    position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;
    border-radius:50%;pointer-events:none;border:3px solid #38e1ff;
  }
  .ripple.out{animation:ripOut .9s cubic-bezier(.2,.6,.3,1) forwards, hueDrift .9s linear forwards;}
  .ripple.in{width:240px;height:240px;margin:-120px 0 0 -120px;border-color:#ff5ce1;
    animation:ripIn .9s cubic-bezier(.4,0,.6,1) forwards, hueDrift .9s linear forwards;}
  @keyframes ripOut{from{transform:scale(.15);opacity:1;}to{transform:scale(13);opacity:0;}}
  @keyframes ripIn{from{transform:scale(1);opacity:1;}to{transform:scale(.04);opacity:0;}}
  @keyframes hueDrift{from{filter:hue-rotate(0deg) saturate(1.4);}to{filter:hue-rotate(190deg) saturate(1.4);}}
  .hint{margin-top:26px;font-size:12px;color:#5b6486;letter-spacing:1px;}
</style>
</head>
<body>
  <h1>水波纹变体</h1>
  <div class="sub">双重波纹 · 一扩一收 · 色相漂移</div>
  <div class="stage">
    <button class="btn" id="btn">点 我</button>
  </div>
  <div class="hint">点击按钮任意位置，波纹从落点处生成</div>
<script>
(function(){
  var btn = document.getElementById('btn');
  function spawn(x, y, cls){
    var s = document.createElement('span');
    s.className = 'ripple ' + cls;
    s.style.left = x + 'px';
    s.style.top = y + 'px';
    btn.appendChild(s);
    s.addEventListener('animationend', function(){ s.remove(); });
  }
  btn.addEventListener('click', function(e){
    var r = btn.getBoundingClientRect();
    var x = (e.clientX || r.left + r.width/2) - r.left;
    var y = (e.clientY || r.top + r.height/2) - r.top;
    spawn(x, y, 'out');   // 向外扩散
    spawn(x, y, 'in');    // 向内收缩
  });
})();
</script>
</body>
</html>
