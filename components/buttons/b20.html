<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>折纸按钮</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:radial-gradient(120% 90% at 50% 100%,#221a10 0%,#120e08 60%,#080603 100%);display:flex;flex-direction:column;align-items:center;color:#f3e7cf;font-family:"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
h2{margin:34px 0 6px;font-size:15px;font-weight:600;letter-spacing:4px;color:#f0d49a}
p{font-size:12px;color:#8a7452;margin-bottom:26px}
.stage{position:relative;width:360px;height:420px;display:flex;align-items:center;justify-content:center;perspective:900px}
.btn{position:relative;width:240px;height:110px;cursor:pointer;perspective:900px;background:none;border:none}
.half{position:absolute;top:0;bottom:0;width:50%;transform-style:preserve-3d;backface-visibility:visible}
.half.L{left:0;transform-origin:right center}
.half.R{right:0;transform-origin:left center}
.face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;letter-spacing:4px;backface-visibility:hidden;border-radius:14px}
.face.front{background:linear-gradient(160deg,#f5e3b8 0%,#e8c67e 55%,#d3a855 100%);color:#6b4a12;box-shadow:inset 0 0 0 2px rgba(107,74,18,.25)}
.half.L .front{border-radius:14px 0 0 14px;justify-content:flex-end;padding-right:6px}
.half.R .front{border-radius:0 14px 14px 0;justify-content:flex-start;padding-left:6px}
.face.inner{background:linear-gradient(160deg,#20344d 0%,#16243a 100%);color:#aee0ff;transform:rotateY(180deg)}
.half.L .inner{border-radius:14px 0 0 14px}
.half.R .inner{border-radius:0 14px 14px 0}
.btn.fold .half.L{animation:foldL 2.6s ease-in-out 1}
.btn.fold .half.R{animation:foldR 2.6s ease-in-out 1}
@keyframes foldL{
 0%{transform:rotateY(0deg)}
 30%{transform:rotateY(-168deg)}
 70%{transform:rotateY(-168deg)}
 100%{transform:rotateY(0deg)}
}
@keyframes foldR{
 0%{transform:rotateY(0deg)}
 30%{transform:rotateY(168deg)}
 70%{transform:rotateY(168deg)}
 100%{transform:rotateY(0deg)}
}
.btn.fold .face.front{box-shadow:inset 0 0 0 2px rgba(107,74,18,.25),0 6px 18px rgba(0,0,0,.5)}
.hint{position:absolute;bottom:8px;font-size:12px;color:#77644a}
</style>
</head>
<body>
<h2>折 纸</h2>
<p>沿中线对折 · 露出内侧密语 · 再展开</p>
<div class="stage">
  <button class="btn" id="b" aria-label="折纸按钮">
    <div class="half L">
      <div class="face front">点我</div>
      <div class="face inner">有</div>
    </div>
    <div class="half R">
      <div class="face front">对折</div>
      <div class="face inner">礼物</div>
    </div>
  </button>
  <div class="hint">纸的内侧藏着字</div>
</div>
<script>
const b=document.getElementById('b');
b.addEventListener('click',()=>{
  if(b.classList.contains('fold'))return; // 播放中不重入
  b.classList.add('fold');
  b.addEventListener('animationend',function h(){
    b.classList.remove('fold');
    b.removeEventListener('animationend',h);
  });
});
</script>
</body>
</html>
