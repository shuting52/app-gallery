<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>磁吸</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:radial-gradient(120% 90% at 50% 10%, #141824 0%, #0a0c12 60%, #05060a 100%);
    color:#dfe6f5;display:flex;flex-direction:column;align-items:center;
    min-height:100vh;padding:28px 16px;overflow:hidden;
  }
  h1{font-size:20px;font-weight:600;letter-spacing:4px;margin-bottom:6px;}
  .sub{font-size:12px;color:#7d8aa5;letter-spacing:2px;margin-bottom:34px;}
  .stage{
    width:360px;max-width:92vw;height:420px;border-radius:20px;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(140,160,200,.14);
    box-shadow:inset 0 0 60px rgba(80,100,160,.12);
    position:relative;overflow:hidden;
  }
  .btn{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    cursor:pointer;border:none;z-index:3;
    width:150px;height:150px;border-radius:50%;
    font-size:16px;font-weight:600;letter-spacing:4px;color:#eaf2ff;
    background:radial-gradient(circle at 35% 30%, #5a6b8c, #2b3550 70%);
    box-shadow:0 0 0 6px rgba(120,150,220,.12), 0 10px 30px rgba(0,0,0,.5),
               inset 0 2px 6px rgba(255,255,255,.25), inset 0 -6px 12px rgba(0,0,0,.4);
  }
  .btn .core{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:56px;height:56px;border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #ff7a7a, #d21f3c 75%);
    box-shadow:0 0 18px rgba(255,60,80,.8), inset 0 2px 4px rgba(255,255,255,.5);
    transition:box-shadow .3s;
  }
  .btn.charged .core{box-shadow:0 0 34px rgba(255,80,100,1), inset 0 2px 4px rgba(255,255,255,.5);}
  .bead{
    position:absolute;width:16px;height:16px;z-index:2;
    transition:left .45s cubic-bezier(.3,1.4,.4,1), top .45s cubic-bezier(.3,1.4,.4,1);
  }
  .bead i{
    display:block;width:100%;height:100%;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #dfe7f5, #8b98b5 60%, #4a5468);
    box-shadow:0 2px 6px rgba(0,0,0,.5), inset 0 -2px 3px rgba(0,0,0,.35);
    animation:floaty 3s ease-in-out infinite;
  }
  @keyframes floaty{0%,100%{transform:translateY(-4px);}50%{transform:translateY(4px);}}
  .ring{
    position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;
    border-radius:50%;border:3px solid rgba(255,90,110,.9);z-index:1;pointer-events:none;
    animation:ringOut .8s ease-out forwards;
  }
  @keyframes ringOut{
    from{transform:scale(1);opacity:1;}
    to{transform:scale(11);opacity:0;}
  }
  .hint{margin-top:26px;font-size:12px;color:#5f6b84;letter-spacing:1px;}
</style>
</head>
<body>
  <h1>磁吸</h1>
  <div class="sub">铁珠吸附 · 磁场波纹 · 弹开复位</div>
  <div class="stage" id="stage">
    <button class="btn" id="btn"><span class="core"></span>磁 铁</button>
  </div>
  <div class="hint">点击磁铁：铁珠被吸附到边缘，随后弹开复位</div>
<script>
(function(){
  var stage = document.getElementById('stage');
  var btn = document.getElementById('btn');
  var N = 8, beads = [], busy = false;
  var BEAD = 16, R_EDGE = 88; // 吸附半径：按钮(75) + 间隙

  function stageSize(){ return { w: stage.clientWidth, h: stage.clientHeight }; }

  // 初始化：铁珠散落在舞台各处
  for(var i = 0; i < N; i++){
    var b = document.createElement('div');
    b.className = 'bead';
    b.innerHTML = '<i style="animation-delay:' + (i * 0.37) + 's"></i>';
    stage.appendChild(b);
    beads.push(b);
  }
  function scatter(){
    var s = stageSize(), cx = s.w/2, cy = s.h/2;
    beads.forEach(function(b, i){
      var a = (i / N) * Math.PI * 2 + 0.4;
      var rad = 120 + (i % 3) * 22;
      b.dataset.bx = cx + Math.cos(a) * rad * 1.15;
      b.dataset.by = cy + Math.sin(a) * rad * 0.85;
      b.style.left = (b.dataset.bx - BEAD/2) + 'px';
      b.style.top = (b.dataset.by - BEAD/2) + 'px';
    });
  }
  scatter();
  window.addEventListener('resize', function(){ if(!busy) scatter(); });

  function ring(){
    var r = document.createElement('div');
    r.className = 'ring';
    stage.appendChild(r);
    r.addEventListener('animationend', function(){ r.remove(); });
  }

  btn.addEventListener('click', function(){
    if(busy) return;
    busy = true;
    btn.classList.add('charged');
    var s = stageSize(), cx = s.w/2, cy = s.h/2;
    // 吸附：铁珠飞到按钮边缘
    beads.forEach(function(b, i){
      var a = (i / N) * Math.PI * 2;
      b.style.left = (cx + Math.cos(a) * R_EDGE - BEAD/2) + 'px';
      b.style.top = (cy + Math.sin(a) * R_EDGE - BEAD/2) + 'px';
    });
    setTimeout(ring, 420);          // 磁场波纹光环
    setTimeout(function(){          // 弹开复位
      beads.forEach(function(b){
        b.style.left = (b.dataset.bx - BEAD/2) + 'px';
        b.style.top = (b.dataset.by - BEAD/2) + 'px';
      });
      btn.classList.remove('charged');
    }, 1000);
    setTimeout(function(){ busy = false; }, 1500);
  });
})();
</script>
</body>
</html>
