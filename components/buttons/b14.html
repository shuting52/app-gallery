<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>印章 · 按钮特效</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;
 background:radial-gradient(120% 90% at 50% 0%,#241311 0%,#140b0a 55%,#0a0505 100%);
 font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#f7e8e0;padding:30px 16px 40px}
h1{font-size:15px;letter-spacing:8px;color:#ff9d7a;font-weight:600;margin-bottom:6px}
.sub{font-size:12px;color:#8a5f52;letter-spacing:2px;margin-bottom:26px}
.stage{width:360px;max-width:100%;height:440px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
 background:rgba(255,120,80,.04);border:1px solid rgba(255,157,122,.16);border-radius:22px;
 box-shadow:inset 0 0 60px rgba(180,60,30,.1);position:relative;overflow:hidden}
.stage.go{animation:shake .45s linear}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-5px,3px)}
 40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,2px)}}
.btn{position:relative;width:210px;height:66px;border:none;border-radius:12px;cursor:pointer;
 background:linear-gradient(160deg,#f3e7d3,#d9c39a);color:#6b4a2a;font-size:17px;letter-spacing:6px;font-weight:700;
 box-shadow:0 10px 26px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.6)}
.sealzone{position:absolute;left:50%;top:50%;width:0;height:0;z-index:5;pointer-events:none}
.seal{position:absolute;left:-48px;top:-48px;width:96px;height:96px;border:5px solid #c8321f;border-radius:10px;
 color:#c8321f;display:grid;grid-template-columns:1fr 1fr;place-items:center;opacity:0;
 font-family:"Kaiti","STKaiti","KaiTi_GB2312",serif;font-size:30px;font-weight:700;line-height:1;
 background:rgba(200,50,31,.10);box-shadow:inset 0 0 14px rgba(200,50,31,.4),0 4px 18px rgba(200,50,31,.25)}
.sealzone.go .seal{animation:stamp 2.4s ease-in forwards}
@keyframes stamp{
 0%{opacity:0;transform:translateY(-280px) rotate(-10deg) scale(1.7)}
 26%{opacity:1;transform:translateY(0) rotate(-10deg) scale(1.2)}
 34%{transform:translateY(0) rotate(-10deg) scale(.92)}
 42%{transform:translateY(0) rotate(-10deg) scale(1)}
 72%{opacity:1;transform:translateY(0) rotate(-10deg) scale(1)}
 100%{opacity:0;transform:translateY(-170px) rotate(-10deg) scale(1.3)}}
.ink{position:absolute;left:-4px;top:-4px;border-radius:50%;background:#c8321f;opacity:0}
.sealzone.go .ink{animation:splat .6s ease-out .62s forwards}
@keyframes splat{0%{opacity:1;transform:translate(0,0) scale(1)}
 100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.25)}}
.hint{font-size:12px;color:#8a5f52;letter-spacing:3px}
</style>
</head>
<body>
<h1>印章</h1>
<div class="sub">b14 · 点击按钮触发</div>
<div class="stage" id="stage">
  <button class="btn" id="btn" type="button">确 认 盖 章</button>
  <div class="sealzone" id="sealzone">
    <div class="seal"><span>已</span><span>确</span><span>认</span><span>印</span></div>
  </div>
  <div class="hint">点 击 按 钮 盖 下 印 章</div>
</div>
<script>
var btn=document.getElementById('btn');
var stage=document.getElementById('stage');
var sealzone=document.getElementById('sealzone');
var N=10;
for(var i=0;i<N;i++){
  var s=document.createElement('span');
  s.className='ink';
  var a=(i/N)*Math.PI*2+0.3;
  var d=58+((i*37)%38);
  var sz=5+((i*13)%6);
  s.style.width=sz+'px';s.style.height=sz+'px';
  s.style.setProperty('--dx',Math.cos(a)*d+'px');
  s.style.setProperty('--dy',Math.sin(a)*d+'px');
  sealzone.appendChild(s);
}
btn.addEventListener('click',function(){
  sealzone.classList.remove('go');
  stage.classList.remove('go');
  void sealzone.offsetWidth;
  sealzone.classList.add('go');
  stage.classList.add('go');
});
</script>
</body>
</html>
