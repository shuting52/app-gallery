<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>霓虹闪烁 · 按钮特效</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    min-height: 100vh; background: radial-gradient(120% 100% at 50% 0%, #1a0b2e 0%, #0b0614 55%, #060310 100%);
    color: #f3e8ff; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; overflow: hidden;
    user-select: none;
  }
  .title { margin: 44px 0 6px; font-size: 22px; letter-spacing: 8px; font-weight: 700; color: #e9d5ff; }
  .sub { font-size: 12px; letter-spacing: 3px; color: #8b7bb8; margin-bottom: 26px; }
  .stage {
    width: 360px; max-width: 92vw; height: 420px; border-radius: 20px;
    background: rgba(20, 10, 35, .55); border: 1px solid rgba(180, 130, 255, .18);
    display: flex; align-items: center; justify-content: center; position: relative;
    box-shadow: inset 0 0 60px rgba(120, 60, 255, .08);
  }
  .stage::before { content: ""; position: absolute; inset: 0; border-radius: 20px;
    background-image: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size: 28px 28px; pointer-events: none; }
  .neon {
    position: relative; padding: 20px 56px; font-size: 20px; letter-spacing: 6px; font-weight: 800;
    color: #fff; background: transparent; border: 3px solid #ff2fb3; border-radius: 14px; cursor: pointer;
    text-shadow: 0 0 6px #ff2fb3, 0 0 18px #ff2fb3, 0 0 42px #ff2fb3;
    box-shadow: 0 0 12px #ff2fb3, inset 0 0 12px rgba(255,47,179,.55), 0 0 44px rgba(255,47,179,.55);
    transition: none;
  }
  .neon .tube { display: inline-block; }
  /* flicker: opacity/brightness keyframes driven by JS re-trigger */
  .neon.flick .tube { animation: flickTube .9s steps(1, end) 1; }
  .neon.flick { animation: flickGlow .9s steps(1, end) 1; }
  @keyframes flickTube {
    0% { opacity: 1; } 6% { opacity: .25; } 10% { opacity: 1; } 18% { opacity: .15; }
    24% { opacity: 1; } 33% { opacity: .5; } 40% { opacity: 1; } 52% { opacity: .1; }
    58% { opacity: 1; } 70% { opacity: .35; } 76% { opacity: 1; } 100% { opacity: 1; }
  }
  @keyframes flickGlow {
    0% { text-shadow: 0 0 6px #ff2fb3, 0 0 18px #ff2fb3, 0 0 42px #ff2fb3;
         box-shadow: 0 0 12px #ff2fb3, inset 0 0 12px rgba(255,47,179,.55), 0 0 44px rgba(255,47,179,.55); }
    6% { text-shadow: 0 0 2px #7a1a52, 0 0 4px #7a1a52; box-shadow: 0 0 2px rgba(255,47,179,.15); color: #d9a; }
    10% { text-shadow: 0 0 6px #ff2fb3, 0 0 18px #ff2fb3, 0 0 42px #ff2fb3;
          box-shadow: 0 0 12px #ff2fb3, inset 0 0 12px rgba(255,47,179,.55), 0 0 44px rgba(255,47,179,.55); color: #fff; }
    18% { text-shadow: none; box-shadow: none; color: #5c3450; }
    24% { text-shadow: 0 0 6px #ff2fb3, 0 0 22px #ff2fb3; box-shadow: 0 0 10px #ff2fb3, 0 0 30px rgba(255,47,179,.4); color: #fff; }
    33% { text-shadow: 0 0 3px #c0188a; box-shadow: 0 0 4px rgba(255,47,179,.25); color: #e8a; }
    40%, 52% { text-shadow: none; box-shadow: none; color: #4a2b40; }
    58% { text-shadow: 0 0 8px #ff2fb3, 0 0 28px #ff2fb3, 0 0 60px #ff2fb3;
          box-shadow: 0 0 16px #ff2fb3, inset 0 0 14px rgba(255,47,179,.6), 0 0 60px rgba(255,47,179,.65); color: #fff; }
    70% { text-shadow: 0 0 2px #7a1a52; box-shadow: 0 0 3px rgba(255,47,179,.2); color: #b7a; }
    76%, 100% { text-shadow: 0 0 8px #ff2fb3, 0 0 24px #ff2fb3, 0 0 64px #ff2fb3, 0 0 96px rgba(255,47,179,.5);
          box-shadow: 0 0 18px #ff2fb3, inset 0 0 16px rgba(255,47,179,.7), 0 0 80px rgba(255,47,179,.7); color: #fff; }
  }
  .hint { margin-top: 22px; font-size: 12px; letter-spacing: 2px; color: #6f5f9b; }
</style>
</head>
<body>
  <div class="title">霓虹闪烁</div>
  <div class="sub">NEON FLICKER · 接触不良的灯管</div>
  <div class="stage"><button class="neon" id="btn"><span class="tube">点击开灯</span></button></div>
  <div class="hint">点击按钮 · 霓虹灯管随机闪烁后稳定高亮</div>
<script>
  var btn = document.getElementById('btn');
  btn.addEventListener('click', function () {
    // 强制重启动画：移除类 → 触发回流 → 重新添加
    btn.classList.remove('flick');
    void btn.offsetWidth;
    btn.classList.add('flick');
  });
</script>
</body>
</html>
