<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>五彩纸屑 · 按钮特效</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    min-height: 100vh; background: linear-gradient(180deg, #101a3a 0%, #1b2a5e 55%, #2a1b4e 100%);
    color: #fff; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; overflow: hidden; user-select: none;
  }
  .title { margin: 44px 0 6px; font-size: 22px; letter-spacing: 8px; font-weight: 700; }
  .sub { font-size: 12px; letter-spacing: 3px; color: #a9b6e8; margin-bottom: 26px; }
  .stage {
    width: 360px; max-width: 92vw; height: 420px; border-radius: 20px; position: relative;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .pop-btn {
    position: relative; z-index: 2; padding: 20px 54px; font-size: 20px; letter-spacing: 6px; font-weight: 800;
    color: #3a1c00; background: linear-gradient(135deg, #ffd93d, #ff9f1c); border: none; border-radius: 999px;
    cursor: pointer; box-shadow: 0 10px 30px rgba(255,159,28,.45);
  }
  .pop-btn.bounce { animation: bounce .55s cubic-bezier(.28,.84,.42,1) 1; }
  @keyframes bounce {
    0% { transform: scale(1,1); }
    25% { transform: scale(1.18,.78); }
    45% { transform: scale(.9,1.12) translateY(-10px); }
    65% { transform: scale(1.06,.94) translateY(0); }
    82% { transform: scale(.98,1.03) translateY(-3px); }
    100% { transform: scale(1,1); }
  }
  .hint { margin-top: 22px; font-size: 12px; letter-spacing: 2px; color: #a9b6e8; }
</style>
</head>
<body>
  <div class="title">五彩纸屑</div>
  <div class="sub">CONFETTI BURST · 砰！</div>
  <div class="stage" id="stage"><canvas id="fx"></canvas><button class="pop-btn" id="btn">庆祝一下</button></div>
  <div class="hint">点击按钮 · 纸屑喷发 + 按钮弹跳</div>
<script>
  var stage = document.getElementById('stage');
  var btn = document.getElementById('btn');
  var cv = document.getElementById('fx');
  var ctx = cv.getContext('2d');
  var W, H, parts = [], raf = null;

  function size() {
    var r = stage.getBoundingClientRect();
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  size();
  window.addEventListener('resize', size);

  var COLORS = ['#ff2fb3', '#2be8ff', '#ffd93d', '#7dff5e', '#ff6b35', '#b28dff', '#ffffff'];

  function rnd(a, b) { return a + Math.random() * (b - a); }

  function burst(x, y) {
    for (var i = 0; i < 90; i++) {
      var ang = rnd(-Math.PI * 0.85, -Math.PI * 0.15); // 向上扇形
      var sp = rnd(5, 13);
      parts.push({
        x: x + rnd(-8, 8), y: y,
        vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        w: rnd(5, 10), h: rnd(7, 14),
        rot: rnd(0, Math.PI * 2), vr: rnd(-.3, .3),
        color: COLORS[(Math.random() * COLORS.length) | 0],
        life: 0, maxLife: rnd(90, 150), sway: rnd(0, Math.PI * 2)
      });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }

  function tick() {
    ctx.clearRect(0, 0, W, H);
    var alive = false;
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      p.life++;
      if (p.life > p.maxLife) continue;
      alive = true;
      p.vy += 0.28;                 // 重力
      p.vx *= 0.985; p.vy *= 0.99; // 空气阻尼
      p.sway += 0.08;
      p.x += p.vx + Math.sin(p.sway) * 1.2;
      p.y += p.vy;
      p.rot += p.vr;
      var fade = p.life > p.maxLife - 30 ? (p.maxLife - p.life) / 30 : 1;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, fade);
      ctx.fillStyle = p.color;
      // 旋转中"翻面"：用 cos 缩放模拟 3D 翻转
      var flip = Math.abs(Math.cos(p.rot * 1.3));
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * (0.25 + 0.75 * flip));
      ctx.restore();
    }
    parts = parts.filter(function (p) { return p.life <= p.maxLife && p.y < H + 40; });
    if (alive) { raf = requestAnimationFrame(tick); }
    else { raf = null; ctx.clearRect(0, 0, W, H); }
  }

  btn.addEventListener('click', function () {
    var sr = stage.getBoundingClientRect();
    var br = btn.getBoundingClientRect();
    burst(br.left - sr.left + br.width / 2, br.top - sr.top + br.height / 2);
    btn.classList.remove('bounce');
    void btn.offsetWidth;
    btn.classList.add('bounce');
  });
</script>
</body>
</html>
