<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D翻转</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:radial-gradient(120% 90% at 50% 10%, #1a1430 0%, #0c0918 60%, #060510 100%);
    color:#e6e0ff;display:flex;flex-direction:column;align-items:center;
    min-height:100vh;padding:28px 16px;overflow:hidden;
  }
  h1{font-size:20px;font-weight:600;letter-spacing:4px;margin-bottom:6px;}
  .sub{font-size:12px;color:#8d84b8;letter-spacing:2px;margin-bottom:34px;}
  .stage{
    width:360px;max-width:92vw;height:420px;border-radius:20px;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(150,130,255,.14);
    box-shadow:inset 0 0 60px rgba(90,70,200,.12);
    display:flex;align-items:center;justify-content:center;
    position:relative;perspective:900px;
  }
  .flip{
    position:relative;width:220px;height:76px;cursor:pointer;
    transform-style:preserve-3d;
    transition:transform .7s cubic-bezier(.35,1.3,.4,1);
  }
  .flip.turned{transform:rotateX(180deg);}
  .face{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;
    font-size:17px;font-weight:600;letter-spacing:6px;
    border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  }
  .front{
    color:#fff;background:linear-gradient(135deg,#7b5cff,#3a7bff);
    box-shadow:0 8px 28px rgba(110,90,255,.45), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .back{
    color:#fff;background:linear-gradient(135deg,#00c46a,#00a86b);
    box-shadow:0 8px 28px rgba(0,200,120,.45), inset 0 1px 0 rgba(255,255,255,.35);
    transform:rotateX(180deg);
  }
  .back .tick{
    width:26px;height:26px;border-radius:50%;background:#fff;color:#00a86b;
    display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;
  }
  .hint{margin-top:26px;font-size:12px;color:#6d6591;letter-spacing:1px;}
</style>
</head>
<body>
  <h1>3D翻转</h1>
  <div class="sub">X 轴翻转 · 正反面切换</div>
  <div class="stage">
    <div class="flip" id="flip" role="button" tabindex="0">
      <div class="face front">确 认</div>
      <div class="face back"><span class="tick">✓</span>已确认</div>
    </div>
  </div>
  <div class="hint">每次点击，按钮沿 X 轴翻转，在正 / 反面之间切换</div>
<script>
(function(){
  var flip = document.getElementById('flip');
  flip.addEventListener('click', function(){
    flip.classList.toggle('turned');
  });
  flip.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ flip.classList.toggle('turned'); }
  });
})();
</script>
</body>
</html>
