<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>花朵绽放按钮</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:radial-gradient(120% 90% at 50% 0%,#0e2a1a 0%,#071510 60%,#040b08 100%);display:flex;flex-direction:column;align-items:center;color:#dff5e6;font-family:"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
h2{margin:34px 0 6px;font-size:15px;font-weight:600;letter-spacing:4px;color:#a7e8bd}
p{font-size:12px;color:#5f8f70;margin-bottom:26px}
.stage{position:relative;width:360px;height:420px;display:flex;align-items:center;justify-content:center}
#bloom{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.btn{position:relative;z-index:2;width:132px;height:132px;border-radius:50%;border:none;cursor:pointer;
background:radial-gradient(circle at 35% 30%,#ffd97a 0%,#ffb03a 55%,#e07b1a 100%);
color:#5b2c00;font-size:16px;font-weight:700;letter-spacing:2px;
box-shadow:0 0 0 6px rgba(255,176,58,.15),0 10px 30px rgba(224,123,26,.45)}
.btn:active{transform:scale(.96)}
.hint{position:absolute;bottom:8px;font-size:12px;color:#4c7a5c}
</style>
</head>
<body>
<h2>花朵绽放</h2>
<p>点击花蕊 · 看花瓣绽开再收拢</p>
<div class="stage">
  <canvas id="bloom" width="720" height="840"></canvas>
  <button class="btn" id="b">绽 放</button>
  <div class="hint">每一次点击，花开一次</div>
</div>
<script>
const cv=document.getElementById('bloom'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height,cx=W/2,cy=H/2;
let petals=[],raf=null,startT=0;
const N=10,COL=['#ff9ec7','#ff7eb3','#ffc2da','#f957a8','#ff8fb8'];
function reset(){
  petals=[];
  for(let i=0;i<N;i++)petals.push({a:i/N*Math.PI*2+Math.random()*.2,c:COL[i%COL.length],len:150+Math.random()*70,w:.5+Math.random()*.35,ph:Math.random()*Math.PI*2});
}
function petal(p,prog){
  // prog: 0→1 绽放(0~.45), 停留(.45~.6), 收拢(.6~1)
  let e;
  if(prog<.45){e=easeOut(prog/.45);}
  else if(prog<.6){e=1;}
  else{e=1-easeIn((prog-.6)/.4);}
  const L=p.len*(.2+.8*e), wob=Math.sin(prog*9+p.ph)*8*e;
  ctx.save();ctx.translate(cx,cy);ctx.rotate(p.a+wob*.02);
  const g=ctx.createLinearGradient(0,0,L,0);
  g.addColorStop(0,p.c+'ee');g.addColorStop(1,p.c+'55');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(46,0);
  ctx.bezierCurveTo(46+L*.3,-L*p.w*.5, 46+L*.7,-L*p.w*.5, 46+L,0);
  ctx.bezierCurveTo(46+L*.7,L*p.w*.5, 46+L*.3,L*p.w*.5, 46,0);
  ctx.fill();
  // 花瓣叶脉
  ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(50,0);ctx.lineTo(46+L*.85,0);ctx.stroke();
  ctx.restore();
}
function easeOut(t){return 1-Math.pow(1-t,3)}
function easeIn(t){return t*t*t}
function draw(ts){
  if(!startT)startT=ts;
  const t=(ts-startT)/1000, dur=3.2, prog=Math.min(t/dur,1);
  ctx.clearRect(0,0,W,H);
  // 叶子先铺
  petals.forEach(p=>petal(p,prog));
  if(prog<1){raf=requestAnimationFrame(draw);}else{ctx.clearRect(0,0,W,H);raf=null;}
}
document.getElementById('b').addEventListener('click',()=>{
  if(raf)cancelAnimationFrame(raf);
  reset();startT=0;raf=requestAnimationFrame(draw);
});
</script>
</body>
</html>
