<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>冲击波 · 按钮特效</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    min-height: 100vh; background: radial-gradient(110% 90% at 50% 10%, #2b1206 0%, #140a06 55%, #0a0503 100%);
    color: #ffe9d6; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; overflow: hidden; user-select: none;
  }
  .title { margin: 44px 0 6px; font-size: 22px; letter-spacing: 8px; font-weight: 800; color: #ffd9b3; }
  .sub { font-size: 12px; letter-spacing: 3px; color: #a07c58; margin-bottom: 26px; }
  .stage {
    width: 360px; max-width: 92vw; height: 420px; border-radius: 20px; position: relative;
    background: rgba(60, 28, 10, .35); border: 1px solid rgba(255,140,50,.22);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .stage.shaking { animation: stageShake .45s linear 1; }
  @keyframes stageShake {
    0%,100% { transform: translate(0,0); }
    10% { transform: translate(-7px, 4px); }
    20% { transform: translate(6px, -5px); }
    30% { transform: translate(-6px, -4px); }
    40% { transform: translate(5px, 5px); }
    50% { transform: translate(-4px, 3px); }
    60% { transform: translate(4px, -3px); }
    70% { transform: translate(-3px, -2px); }
    80% { transform: translate(2px, 2px); }
    90% { transform: translate(-1px, 1px); }
  }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .slam-btn {
    position: relative; z-index: 2; padding: 22px 52px; font-size: 21px; letter-spacing: 8px; font-weight: 900;
    color: #fff; background: linear-gradient(135deg, #ff5a1f, #d61f2c); border: none; border-radius: 16px;
    cursor: pointer; box-shadow: 0 8px 28px rgba(255,70,20,.5), inset 0 2px 0 rgba(255,255,255,.35);
  }
  .slam-btn.slam { animation: slam .5s cubic-bezier(.2,1.6,.4,1) 1; }
  @keyframes slam {
    0% { transform: scale(1); }
    18% { transform: scale(1.32, .72); }   /* 蓄力下压 */
    38% { transform: scale(.82, 1.28); }   /* 反弹拉长 */
    58% { transform: scale(1.1, .92); }
    75% { transform: scale(.96, 1.05); }
    100% { transform: scale(1); }
  }
  .flash { position: absolute; inset: 0; background: radial-gradient(circle, rgba(255,220,160,.85), rgba(255,120,40,.25) 55%, transparent 75%);
    opacity: 0; pointer-events: none; }
  .flash.on { animation: flash .3s ease-out 1; }
  @keyframes flash { 0% { opacity: .9; } 100% { opacity: 0; } }
  .hint { margin-top: 22px; font-size: 12px; letter-spacing: 2px; color: #a07c58; }
</style>
</head>
<body>
  <div class="title">冲击波</div>
  <div class="sub">SHOCKWAVE · 暴力美学</div>
  <div class="stage" id="stage">
    <canvas id="fx"></canvas>
    <div class="flash" id="flash"></div>
    <button class="slam-btn" id="btn">重击</button>
  </div>
  <div class="hint">点击按钮 · 多圈冲击环 + 震屏 + 重击</div>
<script>
  var stage = document.getElementById('stage');
  var btn = document.getElementById('btn');
  var flash = document.getElementById('flash');
  var cv = document.getElementById('fx');
  var ctx = cv.getContext('2d');
  var W, H, rings = [], raf = null;

  function size() {
    var r = stage.getBoundingClientRect();
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  size();
  window.addEventListener('resize', size);

  // 4 圈冲击环：逐圈延迟、不同速度/粗细/颜色
  function shock(x, y) {
    var defs = [
      { delay: 0,    speed: 26, width: 14, color: '255,230,180' },
      { delay: 70,   speed: 20, width: 9,  color: '255,150,60'  },
      { delay: 140,  speed: 15, width: 6,  color: '255,90,40'   },
      { delay: 210,  speed: 11, width: 4,  color: '255,200,120' }
    ];
    var now = performance.now();
    for (var i = 0; i < defs.length; i++) {
      rings.push({ x: x, y: y, r: 10, def: defs[i], born: now });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }

  function tick(now) {
    ctx.clearRect(0, 0, W, H);
    var maxR = Math.max(W, H) * 1.1;
    var alive = false;
    for (var i = 0; i < rings.length; i++) {
      var g = rings[i];
      var age = now - g.born - g.def.delay;
      if (age < 0) { alive = true; continue; }
      var t = age / 700; // 0.7s 扩散完
      if (t >= 1) continue;
      alive = true;
      var eased = 1 - Math.pow(1 - t, 2.2); // 高速启动、渐缓
      var r = 10 + eased * maxR;
      var alpha = (1 - t) * (1 - t);
      ctx.beginPath();
      ctx.arc(g.x, g.y, r, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(' + g.def.color + ',' + alpha.toFixed(3) + ')';
      ctx.lineWidth = g.def.width * (1 - t * .6);
      ctx.stroke();
      // 内圈高亮双环
      if (t < .5) {
        ctx.beginPath();
        ctx.arc(g.x, g.y, r * .82, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,255,255,' + (alpha * .5).toFixed(3) + ')';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }
    rings = rings.filter(function (g) { return now - g.born - g.def.delay < 750; });
    if (alive) { raf = requestAnimationFrame(tick); }
    else { raf = null; ctx.clearRect(0, 0, W, H); }
  }

  btn.addEventListener('click', function () {
    var sr = stage.getBoundingClientRect();
    var br = btn.getBoundingClientRect();
    shock(br.left - sr.left + br.width / 2, br.top - sr.top + br.height / 2);

    // 震屏
    stage.classList.remove('shaking');
    void stage.offsetWidth;
    stage.classList.add('shaking');

    // 爆闪
    flash.classList.remove('on');
    void flash.offsetWidth;
    flash.classList.add('on');

    // 按钮重击
    btn.classList.remove('slam');
    void btn.offsetWidth;
    btn.classList.add('slam');
  });
</script>
</body>
</html>
