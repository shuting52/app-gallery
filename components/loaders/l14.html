<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方块掉落 · 加载动画</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:radial-gradient(600px 400px at 50% 40%,#131c33,#070a14 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;
font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#e8eaf0;padding:24px 12px}
h1{font-size:15px;font-weight:600;letter-spacing:4px;color:#a78bfa;margin-bottom:6px}
.sub{font-size:11px;color:#8a90a6;margin-bottom:30px;letter-spacing:3px}
.stage{width:360px;max-width:94vw;height:300px;position:relative;display:flex;align-items:center;justify-content:center}
.dp{width:340px;height:290px;position:relative;overflow:hidden;border-bottom:3px solid rgba(255,255,255,.25);border-radius:6px}
.dp i{position:absolute;top:-46px;width:44px;height:44px;border-radius:8px;opacity:0;animation:drp 3.6s ease-in infinite;
box-shadow:0 6px 16px rgba(0,0,0,.4)}
@keyframes drp{0%{transform:translateY(0) rotate(0);opacity:0}6%{opacity:1}
68%{transform:translateY(268px) rotate(8deg);opacity:1}
76%{transform:translateY(248px) rotate(0)}84%{transform:translateY(268px)}
92%,100%{transform:translateY(268px);opacity:0}}
</style></head><body><h1>方块掉落</h1><div class="sub">LOADING · 加载中</div><div class="stage"><div class="dp"><i style="left:20px;animation-delay:-0.00s;background:#f472b6"></i><i style="left:72px;animation-delay:-0.55s;background:#38bdf8"></i><i style="left:124px;animation-delay:-1.10s;background:#a78bfa"></i><i style="left:176px;animation-delay:-1.65s;background:#34d399"></i><i style="left:228px;animation-delay:-2.20s;background:#fbbf24"></i><i style="left:280px;animation-delay:-2.75s;background:#fb7185"></i></div></div></body></html>
