<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>折纸翻转 · 加载动画</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:radial-gradient(600px 400px at 50% 40%,#241505,#0d0803 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;
font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#e8eaf0;padding:24px 12px}
h1{font-size:15px;font-weight:600;letter-spacing:4px;color:#fbbf24;margin-bottom:6px}
.sub{font-size:11px;color:#8a90a6;margin-bottom:30px;letter-spacing:3px}
.stage{width:360px;max-width:94vw;height:300px;position:relative;display:flex;align-items:center;justify-content:center}
.fl{display:flex;gap:8px;perspective:500px}
.fl i{width:42px;height:58px;border-radius:6px;background:linear-gradient(135deg,#fbbf24,#f97316);
box-shadow:0 6px 14px rgba(249,115,22,.35);animation:flp 1.9s ease-in-out infinite}
@keyframes flp{0%,100%{transform:rotateX(0)}50%{transform:rotateX(180deg);background:linear-gradient(135deg,#fde68a,#fb923c)}}
</style></head><body><h1>折纸翻转</h1><div class="sub">LOADING · 加载中</div><div class="stage"><div class="fl"><i style="animation-delay:0.00s"></i><i style="animation-delay:0.14s"></i><i style="animation-delay:0.28s"></i><i style="animation-delay:0.42s"></i><i style="animation-delay:0.56s"></i><i style="animation-delay:0.70s"></i></div></div></body></html>
