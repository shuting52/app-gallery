<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>霓虹均衡器 · 加载动画</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:radial-gradient(600px 400px at 50% 40%,#170b26,#08040f 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;
font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#e8eaf0;padding:24px 12px}
h1{font-size:15px;font-weight:600;letter-spacing:4px;color:#e879f9;margin-bottom:6px}
.sub{font-size:11px;color:#8a90a6;margin-bottom:30px;letter-spacing:3px}
.stage{width:360px;max-width:94vw;height:300px;position:relative;display:flex;align-items:center;justify-content:center}
.eq{display:flex;gap:9px;align-items:flex-end;height:150px}
.eq i{display:block;width:15px;height:100%;border-radius:7px;background:linear-gradient(to top,#d946ef,#22d3ee);
box-shadow:0 0 14px rgba(217,70,239,.8),0 0 30px rgba(34,211,238,.4);
transform-origin:bottom;animation:eqb ease-in-out infinite alternate}
@keyframes eqb{from{transform:scaleY(.12)}to{transform:scaleY(1)}}
</style></head><body><h1>霓虹均衡器</h1><div class="sub">LOADING · 加载中</div><div class="stage"><div class="eq"><i style="animation-duration:0.75s;animation-delay:0.48s"></i><i style="animation-duration:0.92s;animation-delay:0.42s"></i><i style="animation-duration:1.0s;animation-delay:0.33s"></i><i style="animation-duration:0.6s;animation-delay:0.16s"></i><i style="animation-duration:0.92s;animation-delay:0.07s"></i><i style="animation-duration:0.63s;animation-delay:0.45s"></i><i style="animation-duration:0.66s;animation-delay:0.4s"></i><i style="animation-duration:0.82s;animation-delay:0.07s"></i><i style="animation-duration:0.76s;animation-delay:0.15s"></i><i style="animation-duration:0.66s;animation-delay:0.84s"></i><i style="animation-duration:0.7s;animation-delay:0.87s"></i><i style="animation-duration:0.5s;animation-delay:0.5s"></i><i style="animation-duration:0.92s;animation-delay:0.74s"></i><i style="animation-duration:0.65s;animation-delay:0.32s"></i></div></div></body></html>
