<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>波浪方块 · 加载动画</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:radial-gradient(600px 400px at 50% 40%,#06251d,#040c0a 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;
font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#e8eaf0;padding:24px 12px}
h1{font-size:15px;font-weight:600;letter-spacing:4px;color:#34d399;margin-bottom:6px}
.sub{font-size:11px;color:#8a90a6;margin-bottom:30px;letter-spacing:3px}
.stage{width:360px;max-width:94vw;height:300px;position:relative;display:flex;align-items:center;justify-content:center}
.wb{display:grid;grid-template-columns:repeat(8,26px);gap:9px}
.wb i{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,#34d399,#0ea5e9);
animation:wv 1.5s ease-in-out infinite;box-shadow:0 0 10px rgba(52,211,153,.35)}
@keyframes wv{0%,100%{transform:scaleY(.25);opacity:.45}50%{transform:scaleY(1);opacity:1}}
</style></head><body><h1>波浪方块</h1><div class="sub">LOADING · 加载中</div><div class="stage"><div class="wb"><i style="animation-delay:0.00s"></i><i style="animation-delay:0.09s"></i><i style="animation-delay:0.18s"></i><i style="animation-delay:0.27s"></i><i style="animation-delay:0.36s"></i><i style="animation-delay:0.45s"></i><i style="animation-delay:0.54s"></i><i style="animation-delay:0.63s"></i><i style="animation-delay:0.06s"></i><i style="animation-delay:0.15s"></i><i style="animation-delay:0.24s"></i><i style="animation-delay:0.33s"></i><i style="animation-delay:0.42s"></i><i style="animation-delay:0.51s"></i><i style="animation-delay:0.60s"></i><i style="animation-delay:0.69s"></i><i style="animation-delay:0.12s"></i><i style="animation-delay:0.21s"></i><i style="animation-delay:0.30s"></i><i style="animation-delay:0.39s"></i><i style="animation-delay:0.48s"></i><i style="animation-delay:0.57s"></i><i style="animation-delay:0.66s"></i><i style="animation-delay:0.75s"></i><i style="animation-delay:0.18s"></i><i style="animation-delay:0.27s"></i><i style="animation-delay:0.36s"></i><i style="animation-delay:0.45s"></i><i style="animation-delay:0.54s"></i><i style="animation-delay:0.63s"></i><i style="animation-delay:0.72s"></i><i style="animation-delay:0.81s"></i></div></div></body></html>
