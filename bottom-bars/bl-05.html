<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>粒子拖尾底栏</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;overflow:hidden;
background:radial-gradient(120% 90% at 50% 0%,#1c2a44 0%,#0b1220 55%,#060a14 100%);color:#eef3fa}
.bg{position:absolute;inset:0;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(55px);opacity:.8;animation:drift 8s ease-in-out infinite alternate}
.bg i:nth-child(1){width:260px;height:260px;background:#5aa9ff;left:-50px;top:-30px}
.bg i:nth-child(2){width:230px;height:230px;background:#ff9ecb;right:-40px;top:28%;animation-delay:-2.5s}
.bg i:nth-child(3){width:220px;height:220px;background:#ffd166;left:28%;bottom:-60px;animation-delay:-5s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(28px,22px) scale(1.12)}}
.top{position:relative;padding:64px 24px 0;text-align:center}
.top .tag{display:inline-block;font-size:11px;color:#9fb3d1;border:1px solid rgba(255,255,255,.25);
border-radius:999px;padding:4px 12px;background:rgba(255,255,255,.06);letter-spacing:1px}
.top h1{font-size:24px;margin-top:14px;letter-spacing:1px}
.top p{font-size:12px;color:#9fb3d1;margin-top:8px}
.bar{position:absolute;left:50%;transform:translateX(-50%);bottom:26px;display:flex;align-items:flex-end;
gap:6px;padding:12px 14px;border-radius:28px;z-index:5;
background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.08));
-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);
border:1px solid rgba(255,255,255,.38);
box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.45)}
.bar::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
background:linear-gradient(115deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 42%)}
.it{position:relative;width:56px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;z-index:1}
.it .ic{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:23px;
background:linear-gradient(135deg,rgba(255,255,255,.25),rgba(255,255,255,.08));
border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 12px rgba(0,0,0,.3)}
.it span{font-size:10px;color:#c6d4e8}
.it .dot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.85);opacity:0}
.it.on .dot{opacity:1;box-shadow:0 0 8px #fff}
.hint{position:absolute;left:0;right:0;bottom:132px;text-align:center;font-size:12px;color:#8fa5c4}
.pt{position:absolute;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:6;
animation:rise .8s ease-out forwards}
@keyframes rise{to{transform:translateY(-46px) scale(.3);opacity:0}}</style></head><body><div class="bg"><i></i><i></i><i></i></div>
<div class="top"><span class="tag">LIQUID GLASS · 底栏设计</span><h1>粒子拖尾底栏</h1><p>手指划过底栏拖出一串彩色粒子，上升淡出</p></div>
<div class="hint">点按图标试试动效</div>
<div class="bar" id="bar"><div class="it on"><div class="ic">🏠</div><span>首页</span><div class="dot"></div></div><div class="it"><div class="ic">🔍</div><span>搜索</span><div class="dot"></div></div><div class="it"><div class="ic">⭐</div><span>收藏</span><div class="dot"></div></div><div class="it"><div class="ic">⬇️</div><span>下载</span><div class="dot"></div></div><div class="it"><div class="ic">👤</div><span>我的</span><div class="dot"></div></div></div>
<script>
var bar=document.getElementById('bar');
bar.querySelectorAll('.it').forEach(function(el){el.addEventListener('click',function(){
bar.querySelectorAll('.it').forEach(function(o){o.classList.remove('on');});
el.classList.add('on');});});
var colors=['#5aa9ff','#ff9ecb','#ffd166','#4ade80','#a78bfa'];
function spawn(x,y){var p=document.createElement('div');p.className='pt';
p.style.left=x+'px';p.style.top=y+'px';p.style.background=colors[Math.floor(Math.random()*colors.length)];
bar.appendChild(p);setTimeout(function(){p.remove();},850);}
bar.addEventListener('mousemove',function(e){var r=bar.getBoundingClientRect();spawn(e.clientX-r.left,e.clientY-r.top);});
bar.addEventListener('touchmove',function(e){if(e.touches.length){var r=bar.getBoundingClientRect();
spawn(e.touches[0].clientX-r.left,e.touches[0].clientY-r.top);}},{passive:true});</script></body></html>
