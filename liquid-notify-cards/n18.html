<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>取件通知</title>
<style>
*{box-sizing:border-box}
body{min-height:100vh;margin:0;padding:48px 18px;color:#2b2118;
font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:radial-gradient(ellipse at 22% 22%, rgba(125,211,252,.9), transparent 36%),radial-gradient(ellipse at 80% 55%, rgba(80,150,200,.55), transparent 38%),radial-gradient(ellipse at 55% 95%, rgba(160,210,240,.7), transparent 42%),linear-gradient(150deg,#e8f4fc,#d5e9f7 55%,#c2ddf0);background-attachment:fixed}
main{width:min(440px,100%);margin:0 auto;display:grid;gap:18px}
.heading{padding:4px 6px 8px}
.eyebrow{margin:0 0 8px;color:rgba(60,45,35,.62);font-size:11px;letter-spacing:.18em}
h1{margin:0;font-size:30px;letter-spacing:-.04em}
.hint{margin:7px 0 0;color:rgba(60,45,35,.62)}
.card{position:relative;isolation:isolate;overflow:hidden;padding:18px;
border:1px solid rgba(40,90,130,.25);border-radius:28px;
background:linear-gradient(180deg,
rgba(255,255,255,.3),rgba(255,255,255,.14) 48%,rgba(220,240,252,.55));
-webkit-backdrop-filter:blur(18px) saturate(175%);
backdrop-filter:blur(18px) saturate(175%);
box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(255,255,255,.08),0 20px 48px rgba(8,8,24,.28);
transition:transform .25s ease,border-color .25s ease}
.card::before{content:"";position:absolute;z-index:0;inset:0;border-radius:inherit;pointer-events:none;
background:linear-gradient(100deg,rgba(255,255,255,.34) 0%,rgba(255,255,255,.08) 18%,transparent 42%,transparent 72%,rgba(200,230,250,.4) 100%);opacity:.8}
.card::after{content:"";position:absolute;z-index:0;top:-66px;right:-28px;width:190px;height:130px;
border:1px solid rgba(40,90,130,.25);border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.22),transparent 68%);
filter:blur(2px);transform:rotate(-18deg);pointer-events:none}
.card>*{position:relative;z-index:1}
.card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.46)}
.top,.title-line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top{margin-bottom:17px}
.pill{padding:6px 12px;border:1px solid rgba(40,90,130,.25);border-radius:999px;background:rgba(255,255,255,.5);color:#2b2118;font-size:12px;box-shadow:inset 0 1px rgba(255,255,255,.18)}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.face{display:grid;flex:0 0 48px;height:48px;place-items:center;border:1px solid rgba(255,255,255,.45);border-radius:50%;
background:linear-gradient(145deg,rgba(190,225,250,.95),rgba(120,180,230,.8) 58%,rgba(70,130,190,.85));color:#fff;font-size:19px;font-weight:650;
box-shadow:inset 0 1px 5px rgba(255,255,255,.5),0 5px 15px rgba(15,12,35,.2)}
.copy{flex:1;min-width:0}
.title-line{margin-bottom:5px}
.title-line strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
time,.preview{color:rgba(60,45,35,.62);font-size:12px}
.preview{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unread{flex:0 0 auto;color:#0369a1;font-size:12px;font-weight:600}
.prog{height:10px;border-radius:6px;background:rgba(255,255,255,.12);margin:14px 0 6px;overflow:hidden}
.prog i{display:block;height:100%;width:60%;border-radius:6px;background:linear-gradient(90deg,#0ea5e9,#7dd3fc);
box-shadow:0 0 12px rgba(14,165,233,.5);animation:flow 3s linear infinite;background-size:200% 100%}
@keyframes flow{from{background-position:0 0}to{background-position:-200% 0}}
.steps{display:flex;margin:16px 0 4px}
.st{flex:1;text-align:center;position:relative;font-size:11px;color:rgba(60,45,35,.62)}
.st b{display:block;width:14px;height:14px;margin:0 auto 6px;border-radius:50%;background:rgba(255,255,255,.22);border:1px solid rgba(40,90,130,.25)}
.st.done{color:#2b2118}.st.done b{background:#0369a1;border-color:#0369a1;box-shadow:0 0 10px rgba(14,165,233,.5)}
.st::before{content:"";position:absolute;top:7px;left:-50%;width:100%;height:2px;background:rgba(255,255,255,.16);z-index:-1}
.st:first-child::before{display:none}
.st.done::before{background:#0369a1}
.actions{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:11px 0;border-radius:14px;border:1px solid rgba(40,90,130,.25);background:rgba(255,255,255,.10);color:#2b2118;font-size:13px;font-weight:600;text-align:center;cursor:pointer}
.btn.hot{background:linear-gradient(135deg,#0284c7,#0ea5e9);border:0;color:#fff;box-shadow:0 6px 18px rgba(14,165,233,.5)}
.codebox{font-size:34px;font-weight:800;letter-spacing:.35em;text-align:center;padding:10px 0 4px;color:#2b2118;text-shadow:0 0 24px rgba(14,165,233,.5)}
.bigamt{font-size:30px;font-weight:800;color:#2b2118;margin:6px 0}
.stars{display:flex;gap:8px;margin:12px 0;font-size:26px}
.stars s{text-decoration:none;cursor:pointer;color:#0369a1;filter:drop-shadow(0 0 6px rgba(14,165,233,.5))}
.thumb{flex:0 0 52px;width:52px;height:52px;border-radius:14px;border:1px solid rgba(255,255,255,.45);
background:linear-gradient(145deg,rgba(190,225,250,.95),rgba(120,180,230,.8) 58%,rgba(70,130,190,.85));display:grid;place-items:center;font-size:26px;
box-shadow:inset 0 1px 5px rgba(255,255,255,.5)}
.tag{font-size:10px;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.12);color:rgba(60,45,35,.62);margin-left:8px;white-space:nowrap}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
.card { background: rgba(43,35,68,.88); }
}

</style>
</head>
<body class="n18">
<main>
<header class="heading">
<p class="eyebrow">LIQUID GLASS</p>
<h1>取件</h1>
<p class="hint">包裹在驿站等你很久了。</p>
</header>
<section class="card"><div class="top"><span class="pill">取件</span><span class="unread">菜鸟驿站</span></div><div class="row"><div class="face">🔑</div><div class="copy"><div class="title-line"><strong>你的包裹已到 · 阳光小区店</strong><time>12:40</time></div><div class="preview">凭取件码领取，营业至 21:00</div></div><span class="unread">待取件</span></div><div class="codebox">8 – 4 – 2 – 6</div></section><section class="card"><div class="top"><span class="pill">提醒</span><time>12:40</time></div><div class="row"><div class="face">⏰</div><div class="copy"><div class="title-line"><strong>免费保管 48 小时</strong><time>12:40</time></div><div class="preview">超时可能产生保管费，记得及时取走</div></div></div></section>
</main>
</body>
</html>
