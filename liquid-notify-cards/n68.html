<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网络切换</title>
<style>
*{
box-sizing: border-box;
}
body {
min-height: 100vh;
margin: 0;
padding: 48px 18px;
color: #fff;
font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
background: radial-gradient(ellipse at 20% 18%, rgba(34,211,238,.88), transparent 36%),radial-gradient(ellipse at 80% 36%, rgba(40,120,240,.75), transparent 38%),radial-gradient(ellipse at 52% 88%, rgba(20,60,140,.88), transparent 40%),linear-gradient(150deg,#081c30,#0c2c52 55%,#061423);
background-attachment: fixed;
}
main {
width: min(440px, 100%);
margin: 0 auto;
display: grid;
gap: 18px;
}
.heading { padding: 4px 6px 8px;}
.eyebrow {
margin: 0 0 8px;
color: rgba(255,255,255,.68);
font-size: 11px;
letter-spacing:.18em;
}
h1 { margin: 0; font-size: 30px; letter-spacing: -.04em;}
.hint { margin: 7px 0 0; color: rgba(255,255,255,.68);}
.card {
position: relative;
isolation: isolate;
overflow: hidden;
padding: 18px;
border: 1px solid rgba(140,220,255,.34);
border-radius: 28px;
background: linear-gradient(135deg, rgba(255,255,255,.20),rgba(255,255,255,.08) 48%,rgba(120,210,255,.13));
-webkit-backdrop-filter: blur(24px) saturate(175%);
backdrop-filter: blur(24px) saturate(175%);
box-shadow:
inset 0 1px 0 rgba(255,255,255,.42),
inset 0 -1px 0 rgba(255,255,255,.08),
0 20px 48px rgba(8,8,24,.28);
transition: transform.25s ease, border-color.25s ease;
}
.card::before {
content: "";
position: absolute;
z-index: 0;
inset: 0;
border-radius: inherit;
pointer-events: none;
background:
linear-gradient(110deg,
rgba(255,255,255,.34) 0%,
rgba(255,255,255,.08) 18%,
transparent 42%,
transparent 72%,
rgba(255,206,234,.16) 100%);
opacity:.8;
}
.card::after {
content: "";
position: absolute;
z-index: 0;
top:-60px;left:-40px;
width: 190px;
height: 130px;
border: 1px solid rgba(255,255,255,.22);
border-radius: 50%;
background: radial-gradient(ellipse, rgba(255,255,255,.22), transparent 68%);
filter: blur(2px);
transform: rotate(28deg);
pointer-events: none;
}
.card > * { position: relative; z-index: 1;}
.card:hover { transform: translateY(-3px); border-color: rgba(255,255,255,.46);}
.top,.title-line {
display: flex;
align-items: center;
justify-content: space-between;
gap: 12px;
}
.top { margin-bottom: 15px;}
.pill {
padding: 6px 12px;
border: 1px solid rgba(255,255,255,.30);
border-radius: 999px;
background: rgba(255,255,255,.10);
color: rgba(255,255,255,.94);
font-size: 12px;
box-shadow: inset 0 1px rgba(255,255,255,.18);
}
.dot {
flex: 0 0 auto;
width: 10px;
height: 10px;
border-radius: 50%;
background: #fff;
box-shadow: 0 0 12px rgba(255,255,255,.9);
animation: blk 1.6s ease-in-out infinite;
animation-delay: -.8s;
}
@keyframes blk { 50% { transform: scale(1.45);}}
.row { display: flex; align-items: center; gap: 12px; min-width: 0;}
.face {
display: grid;
flex: 0 0 48px;
height: 48px;
place-items: center;
border: 1px solid rgba(255,255,255,.45);
border-radius: 16px;
background: linear-gradient(145deg,#67e8f9,#0ea5e9 60%,#0c4a6e);
color: #fff;
font-size: 22px;
font-weight: 650;
box-shadow: inset 0 1px 5px rgba(255,255,255,.5), 0 5px 15px rgba(15,12,35,.2);
}
.copy { flex: 1; min-width: 0;}
.title-line { margin-bottom: 5px;}
.title-line strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
time,.preview { color: rgba(255,255,255,.72); font-size: 12px;}
.preview { overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
.unread { flex: 0 0 auto; color: #d8d2ff; font-size: 12px; font-weight: 600;}
.actions { display: flex; gap: 10px; margin-top: 14px;}
.btn {
flex: 1;
padding: 10px 0;
border-radius: 14px;
border: 1px solid rgba(255,255,255,.30);
background: rgba(255,255,255,.12);
color: #fff;
font-size: 13px;
text-align: center;
cursor: pointer;
}
.btn.pri { background: linear-gradient(135deg,#22d3ee,#0284c7); border-color: transparent; font-weight: 700;}
.bar {
height: 8px;
border-radius: 5px;
background: rgba(255,255,255,.16);
margin-top: 12px;
overflow: hidden;
}
.bar i {
display: block;
height: 100%;
border-radius: 5px;
background: linear-gradient(135deg,#22d3ee,#0284c7);
animation: fill 1.2s ease both;
}
@keyframes fill { from { width: 0!important;}}
.meta {
display: flex;
justify-content: space-between;
font-size: 12px;
color: rgba(255,255,255,.72);
margin-top: 6px;
}
.code {
font-size: 34px;
font-weight: 800;
letter-spacing:.28em;
margin: 6px 0 2px;
text-align: center;
text-indent:.28em;
text-shadow: 0 2px 18px rgba(255,255,255,.25);
}
.sw {
flex: 0 0 auto;
position: relative;
display: block;
width: 52px;
height: 30px;
border-radius: 16px;
background: #34c759;
cursor: pointer;
}
.sw i {
position: absolute;
top: 3px;
left: 25px;
display: block;
width: 24px;
height: 24px;
border-radius: 50%;
background: #fff;
box-shadow: 0 2px 6px rgba(0,0,0,.3);
}
.stats { display: flex; gap: 10px; margin-top: 12px;}
.stat {
flex: 1;
text-align: center;
padding: 10px 4px;
border-radius: 14px;
background: rgba(255,255,255,.08);
border: 1px solid rgba(255,255,255,.14);
}
.stat b { display: block; font-size: 17px;}
.stat span { font-size: 11px; color: rgba(255,255,255,.65);}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
.card { background: rgba(43,35,68,.88);}
}
@media (prefers-reduced-motion: reduce) {
.card { transition: none;}
.bar i { animation: none;}
.dot { animation: none;}
}

</style>
</head>
<body>
<main>
<header class="heading">
<p class="eyebrow">NETWORK</p>
<h1>网络</h1>
<p class="hint">信号满格，在线每一秒。</p>
</header>
<section class="card"><div class="top"><span class="pill">网络</span><span class="dot"></span></div><div class="row"><div class="face">📶</div><div class="copy"><div class="title-line"><strong>已切换到 5G</strong><time>刚刚</time></div><div class="preview">China Mobile，信号良好，速率 486 Mbps</div></div></div><div class="stats"><div class="stat"><b>486</b><span>Mbps 下行</span></div><div class="stat"><b>52</b><span>Mbps 上行</span></div><div class="stat"><b>18ms</b><span>延迟</span></div></div></section>
<section class="card"><div class="top"><span class="pill">网络</span><span class="sw"><i></i></span></div><div class="row"><div class="face">🛰</div><div class="copy"><div class="title-line"><strong>自动切换网络</strong></div><div class="preview">Wi-Fi 信号弱时自动用流量补上</div></div></div></section>
</main>
</body>
</html>
