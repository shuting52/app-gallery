<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>深海私语</title>
<style>*{box-sizing:border-box}
body{min-height:100vh;margin:0;padding:44px 18px 60px;color:#fff;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:radial-gradient(ellipse at 20% 15%, rgba(34,120,180,.9), transparent 36%),radial-gradient(ellipse at 85% 40%, rgba(20,60,140,.85), transparent 38%),radial-gradient(ellipse at 50% 92%, rgba(10,30,80,.9), transparent 40%),linear-gradient(160deg,#04121f,#0a2a4a 55%,#06203a);background-attachment:fixed}
main{width:min(440px,100%);margin:0 auto;display:grid;gap:18px}
.heading{padding:4px 6px 8px}
.eyebrow{margin:0 0 8px;color:#fffD;font-size:11px;letter-spacing:.18em}
h1{margin:0;font-size:30px;letter-spacing:-.04em}
.hint{margin:7px 0 0;color:#fffD}
.card{position:relative;isolation:isolate;overflow:hidden;padding:18px;border:1px solid rgba(140,200,255,.30);border-radius:28px;
background:linear-gradient(135deg,rgba(120,200,255,.16),rgba(255,255,255,.06) 48%,rgba(80,160,255,.10));-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
box-shadow:inset 0 1px 0 rgba(180,225,255,.40),inset 0 -1px 0 rgba(255,255,255,.08),0 20px 48px rgba(8,8,24,.28);
transition:transform .25s ease,border-color .25s ease}
.card::before{content:"";position:absolute;z-index:0;inset:0;border-radius:inherit;pointer-events:none;opacity:.8;
background:linear-gradient(118deg,rgba(255,255,255,.30) 0%,rgba(255,255,255,.07) 18%,transparent 42%,transparent 72%,rgba(160,220,255,.18) 100%)}
.card::after{content:"";position:absolute;z-index:0;top:-58px;right:-42px;width:190px;height:130px;border:1px solid rgba(160,220,255,.25);border-radius:50%;
background:radial-gradient(ellipse,rgba(160,220,255,.20),transparent 68%);filter:blur(2px);transform:rotate(-20deg);pointer-events:none}
.card>*{position:relative;z-index:1}
.card:hover{transform:translateY(-3px);border-color:rgba(140,200,255,.30)H}
.top,.title-line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top{margin-bottom:17px}
.pill{padding:6px 12px;border:1px solid rgba(140,200,255,.35);border-radius:999px;background:rgba(120,200,255,.12);color:#fff;font-size:12px;box-shadow:inset 0 1px rgba(255,255,255,.18);white-space:nowrap}
.avatars{display:flex;align-items:center;padding-left:8px}
.avatar{display:grid;width:29px;height:29px;margin-left:-8px;place-items:center;border:1px solid rgba(255,255,255,.55);border-radius:50%;color:#fff;font-size:11px;box-shadow:0 3px 10px rgba(18,12,36,.2)}
.more{margin-left:7px;color:#fffD;font-size:12px}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row.rev{flex-direction:row-reverse;text-align:right}
.row.rev .copy .title-line{flex-direction:row-reverse}
.face{display:grid;flex:0 0 48px;height:48px;place-items:center;border:1px solid rgba(160,220,255,.45);border-radius:50%;color:#fff;font-size:19px;font-weight:650;box-shadow:inset 0 1px 5px rgba(255,255,255,.5),0 5px 15px rgba(15,12,35,.2)}
.copy{flex:1;min-width:0}
.title-line{margin-bottom:5px}
.title-line strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
time,.preview{color:#fffD;font-size:12px}
.preview{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unread{flex:0 0 auto;color:#7fd4ff;font-size:12px;font-weight:600;white-space:nowrap}
.actions{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:10px 0;border:0;border-radius:14px;font-size:13px;font-weight:600;cursor:pointer;color:#fff;background:linear-gradient(135deg,#2f9be8,#1a6fc4);box-shadow:0 6px 18px linear-gradient(135deg,#2f9be8,#1a6fc4)S}
.btn.ghost{background:linear-gradient(135deg,#2f9be8,#1a6fc4)G;color:#fff;border:1px solid rgba(140,200,255,.30)}
.thumb{flex:0 0 52px;width:52px;height:52px;border-radius:14px;border:1px solid rgba(140,200,255,.30);background:#fffHBG}
.voice{display:flex;align-items:center;gap:3px;height:34px;padding:0 12px;border-radius:12px;background:rgba(120,200,255,.10);border:1px solid rgba(140,200,255,.30)}
.voice i{width:3px;border-radius:2px;background:#7fd4ff;animation:wv 1.1s ease-in-out infinite}
@keyframes wv{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.livedot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff4d6d;margin-right:6px;box-shadow:0 0 8px #ff4d6d;animation:blk 1.4s ease-in-out infinite}
@keyframes blk{50%{transform:scale(1.4)}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)){.card{background:rgba(10,32,58,.92)}}
@media (prefers-reduced-motion:reduce){.card{transition:none}.voice i{animation:none}}</style>
</head>
<body>
<main>
<header class="heading">
<p class="eyebrow">DEEP SEA · DM</p>
<h1>深海私语</h1>
<p class="hint">深海里，也有人惦记你。</p>
</header>
<section class="card"><div class="top"><span class="pill">私聊</span><div class="avatars"><i class="avatar" style="background:linear-gradient(145deg,#3f8fd0,#1a4f86)">沈</i><i class="avatar" style="background:linear-gradient(145deg,#57b8a8,#22705f)">聆</i></div></div><div class="row"><div class="face" style="background:linear-gradient(145deg,#3f8fd0,#1a4f86)">沈</div><div class="copy"><div class="title-line"><strong>沈聆</strong><time>21:04</time></div><div class="preview">明晚的展你去吗，我多了一张票</div></div><span class="unread">2 条未读</span></div><div class="actions"><button class="btn">回复</button></div></section>
<section class="card"><div class="top"><span class="pill">私聊</span><div class="avatars"><i class="avatar" style="background:linear-gradient(145deg,#7f9ff0,#3a4fb0)">顾</i></div></div><div class="row rev"><div class="face" style="background:linear-gradient(145deg,#7f9ff0,#3a4fb0)">顾</div><div class="copy"><div class="title-line"><strong>顾潮生</strong><time>18:32</time></div><div class="preview">刚把合同发你邮箱了，查收一下</div></div><span class="unread">1 条未读</span></div></section>
<section class="card"><div class="top"><span class="pill">私聊</span><div class="avatars"><i class="avatar" style="background:linear-gradient(145deg,#57b8a8,#22705f)">白</i></div></div><div class="row"><div class="face" style="background:linear-gradient(145deg,#57b8a8,#22705f)">白</div><div class="copy"><div class="title-line"><strong>白鹭</strong><time>12:15</time></div><div class="preview">新店开业，周六来捧场呀</div></div><time>已读</time></div></section>
</main>
</body>
</html>
