<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>果冻开播</title>
<style>*{box-sizing:border-box}
body{min-height:100vh;margin:0;padding:44px 18px 60px;color:#fff;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:radial-gradient(ellipse at 15% 20%, rgba(255,150,200,.90), transparent 36%),radial-gradient(ellipse at 85% 35%, rgba(255,110,160,.80), transparent 38%),radial-gradient(ellipse at 55% 90%, rgba(200,90,180,.75), transparent 40%),linear-gradient(150deg,#2b0f22,#471a38 55%,#33122b);background-attachment:fixed}
main{width:min(440px,100%);margin:0 auto;display:grid;gap:18px}
.heading{padding:4px 6px 8px}
.eyebrow{margin:0 0 8px;color:#fffD;font-size:11px;letter-spacing:.18em}
h1{margin:0;font-size:30px;letter-spacing:-.04em}
.hint{margin:7px 0 0;color:#fffD}
.card{position:relative;isolation:isolate;overflow:hidden;padding:18px;border:1px solid rgba(255,160,210,.34);border-radius:28px;
background:linear-gradient(135deg,rgba(255,160,210,.20),rgba(255,255,255,.07) 48%,rgba(255,120,180,.14));-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.08),0 20px 48px rgba(8,8,24,.28);
transition:transform .25s ease,border-color .25s ease}
.card::before{content:"";position:absolute;z-index:0;inset:0;border-radius:inherit;pointer-events:none;opacity:.8;
background:linear-gradient(122deg,rgba(255,255,255,.34) 0%,rgba(255,255,255,.08) 18%,transparent 42%,transparent 72%,rgba(255,160,210,.22) 100%)}
.card::after{content:"";position:absolute;z-index:0;top:-60px;left:-38px;width:195px;height:132px;border:1px solid rgba(255,160,210,.30);border-radius:50%;
background:radial-gradient(ellipse,rgba(255,160,210,.22),transparent 68%);filter:blur(2px);transform:rotate(24deg);pointer-events:none}
.card>*{position:relative;z-index:1}
.card:hover{transform:translateY(-3px);border-color:rgba(255,160,210,.34)H}
.top,.title-line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top{margin-bottom:17px}
.pill{padding:6px 12px;border:1px solid rgba(255,160,210,.38);border-radius:999px;background:rgba(255,160,210,.12);color:#fff;font-size:12px;box-shadow:inset 0 1px rgba(255,255,255,.18);white-space:nowrap}
.avatars{display:flex;align-items:center;padding-left:8px}
.avatar{display:grid;width:29px;height:29px;margin-left:-8px;place-items:center;border:1px solid rgba(255,255,255,.55);border-radius:50%;color:#fff;font-size:11px;box-shadow:0 3px 10px rgba(18,12,36,.2)}
.more{margin-left:7px;color:#fffD;font-size:12px}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row.rev{flex-direction:row-reverse;text-align:right}
.row.rev .copy .title-line{flex-direction:row-reverse}
.face{display:grid;flex:0 0 48px;height:48px;place-items:center;border:1px solid rgba(255,160,210,.45);border-radius:50%;color:#fff;font-size:19px;font-weight:650;box-shadow:inset 0 1px 5px rgba(255,255,255,.5),0 5px 15px rgba(15,12,35,.2)}
.copy{flex:1;min-width:0}
.title-line{margin-bottom:5px}
.title-line strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
time,.preview{color:#fffD;font-size:12px}
.preview{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unread{flex:0 0 auto;color:#ff9ecf;font-size:12px;font-weight:600;white-space:nowrap}
.actions{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:10px 0;border:0;border-radius:14px;font-size:13px;font-weight:600;cursor:pointer;color:#fff;background:linear-gradient(135deg,#ff7fb8,#f04f9a);box-shadow:0 6px 18px linear-gradient(135deg,#ff7fb8,#f04f9a)S}
.btn.ghost{background:linear-gradient(135deg,#ff7fb8,#f04f9a)G;color:#fff;border:1px solid rgba(255,160,210,.34)}
.thumb{flex:0 0 52px;width:52px;height:52px;border-radius:14px;border:1px solid rgba(255,160,210,.34);background:#fffHBG}
.voice{display:flex;align-items:center;gap:3px;height:34px;padding:0 12px;border-radius:12px;background:rgba(255,160,210,.10);border:1px solid rgba(255,160,210,.34)}
.voice i{width:3px;border-radius:2px;background:#ff9ecf;animation:wv 1.1s ease-in-out infinite}
@keyframes wv{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.livedot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff4d6d;margin-right:6px;box-shadow:0 0 8px #ff4d6d;animation:blk 1.4s ease-in-out infinite}
@keyframes blk{50%{transform:scale(1.4)}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)){.card{background:rgba(74,28,58,.93)}}
@media (prefers-reduced-motion:reduce){.card{transition:none}.voice i{animation:none}}</style>
</head>
<body>
<main>
<header class="heading">
<p class="eyebrow">JELLY · LIVE</p>
<h1>果冻开播</h1>
<p class="hint">喜欢的主播，上线啦。</p>
</header>
<section class="card"><div class="top"><span class="pill">开播</span><div class="avatars"><i class="avatar" style="background:linear-gradient(145deg,#ff9ecf,#e05a9a)">莓</i></div></div><div class="row"><div class="face" style="background:linear-gradient(145deg,#ff9ecf,#e05a9a)">莓</div><div class="copy"><div class="title-line"><strong>草莓酱</strong><time>刚刚</time></div><div class="preview"><span class="livedot"></span>正在直播：深夜电台｜聊聊最近的书</div></div><span class="unread">LIVE</span></div><div class="actions"><button class="btn">进入直播间</button></div></section>
<section class="card"><div class="top"><span class="pill">开播</span><div class="avatars"><i class="avatar" style="background:linear-gradient(145deg,#ffb87a,#e08a4a)">荷</i></div></div><div class="row"><div class="face" style="background:linear-gradient(145deg,#ffb87a,#e08a4a)">荷</div><div class="copy"><div class="title-line"><strong>薄荷岛主</strong><time>21:30</time></div><div class="preview"><span class="livedot"></span>正在直播：带你云逛夜市</div></div><span class="unread">LIVE</span></div><div class="actions"><button class="btn">进入直播间</button></div></section>
<section class="card"><div class="top"><span class="pill">开播</span><div class="avatars"><i class="avatar" style="background:linear-gradient(145deg,#c89eff,#8a5ae0)">橘</i></div></div><div class="row"><div class="face" style="background:linear-gradient(145deg,#c89eff,#8a5ae0)">橘</div><div class="copy"><div class="title-line"><strong>橘子汽水</strong><time>20:05</time></div><div class="preview">开播预告：明晚手账拼贴实况</div></div><time>预约</time></div></section>
</main>
</body>
</html>
