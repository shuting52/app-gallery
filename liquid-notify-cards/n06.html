<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>墨晕好友</title>
<style>*{box-sizing:border-box}
body{min-height:100vh;margin:0;padding:44px 18px 60px;color:#fff;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:radial-gradient(ellipse at 15% 20%, rgba(90,90,110,.70), transparent 36%),radial-gradient(ellipse at 85% 35%, rgba(50,50,70,.80), transparent 38%),radial-gradient(ellipse at 55% 90%, rgba(20,20,30,.90), transparent 40%),linear-gradient(150deg,#0b0b10,#17171f 55%,#0e0e14);background-attachment:fixed}
main{width:min(440px,100%);margin:0 auto;display:grid;gap:18px}
.heading{padding:4px 6px 8px}
.eyebrow{margin:0 0 8px;color:#fffD;font-size:11px;letter-spacing:.18em}
h1{margin:0;font-size:30px;letter-spacing:-.04em}
.hint{margin:7px 0 0;color:#fffD}
.card{position:relative;isolation:isolate;overflow:hidden;padding:18px;border:1px solid rgba(200,200,220,.28);border-radius:28px;
background:linear-gradient(135deg,rgba(200,200,220,.14),rgba(255,255,255,.05) 48%,rgba(185,167,230,.10));-webkit-backdrop-filter:blur(28px) saturate(150%);backdrop-filter:blur(28px) saturate(150%);
box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(255,255,255,.08),0 20px 48px rgba(8,8,24,.28);
transition:transform .25s ease,border-color .25s ease}
.card::before{content:"";position:absolute;z-index:0;inset:0;border-radius:inherit;pointer-events:none;opacity:.8;
background:linear-gradient(95deg,rgba(255,255,255,.26) 0%,rgba(255,255,255,.06) 20%,transparent 45%,transparent 70%,rgba(185,167,230,.16) 100%)}
.card::after{content:"";position:absolute;z-index:0;top:-56px;left:-44px;width:185px;height:128px;border:1px solid rgba(200,200,220,.25);border-radius:50%;
background:radial-gradient(ellipse,rgba(200,200,220,.18),transparent 68%);filter:blur(2px);transform:rotate(22deg);pointer-events:none}
.card>*{position:relative;z-index:1}
.card:hover{transform:translateY(-3px);border-color:rgba(200,200,220,.28)H}
.top,.title-line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top{margin-bottom:17px}
.pill{padding:6px 12px;border:1px solid rgba(200,200,220,.35);border-radius:999px;background:rgba(200,200,220,.10);color:#fff;font-size:12px;box-shadow:inset 0 1px rgba(255,255,255,.18);white-space:nowrap}
.avatars{display:flex;align-items:center;padding-left:8px}
.avatar{display:grid;width:29px;height:29px;margin-left:-8px;place-items:center;border:1px solid rgba(255,255,255,.50);border-radius:50%;color:#fff;font-size:11px;box-shadow:0 3px 10px rgba(18,12,36,.2)}
.more{margin-left:7px;color:#fffD;font-size:12px}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row.rev{flex-direction:row-reverse;text-align:right}
.row.rev .copy .title-line{flex-direction:row-reverse}
.face{display:grid;flex:0 0 48px;height:48px;place-items:center;border:1px solid rgba(200,200,220,.40);border-radius:50%;color:#fff;font-size:19px;font-weight:650;box-shadow:inset 0 1px 5px rgba(255,255,255,.5),0 5px 15px rgba(15,12,35,.2)}
.copy{flex:1;min-width:0}
.title-line{margin-bottom:5px}
.title-line strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
time,.preview{color:#fffD;font-size:12px}
.preview{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unread{flex:0 0 auto;color:#c9b8f5;font-size:12px;font-weight:600;white-space:nowrap}
.actions{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:10px 0;border:0;border-radius:14px;font-size:13px;font-weight:600;cursor:pointer;color:#fff;background:linear-gradient(135deg,#8f7bd8,#6a54b8);box-shadow:0 6px 18px linear-gradient(135deg,#8f7bd8,#6a54b8)S}
.btn.ghost{background:linear-gradient(135deg,#8f7bd8,#6a54b8)G;color:#fff;border:1px solid rgba(200,200,220,.28)}
.thumb{flex:0 0 52px;width:52px;height:52px;border-radius:14px;border:1px solid rgba(200,200,220,.28);background:#fffHBG}
.voice{display:flex;align-items:center;gap:3px;height:34px;padding:0 12px;border-radius:12px;background:rgba(200,200,220,.08);border:1px solid rgba(200,200,220,.28)}
.voice i{width:3px;border-radius:2px;background:#c9b8f5;animation:wv 1.1s ease-in-out infinite}
@keyframes wv{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.livedot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff4d6d;margin-right:6px;box-shadow:0 0 8px #ff4d6d;animation:blk 1.4s ease-in-out infinite}
@keyframes blk{50%{transform:scale(1.4)}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)){.card{background:rgba(24,24,32,.94)}}
@media (prefers-reduced-motion:reduce){.card{transition:none}.voice i{animation:none}}</style>
</head>
<body>
<main>
<header class="heading">
<p class="eyebrow">INK · REQUESTS</p>
<h1>墨晕好友</h1>
<p class="hint">新的相遇，淡墨轻点。</p>
</header>
<section class="card"><div class="top"><span class="pill">好友请求</span><div class="avatars"><i class="avatar" style="background:linear-gradient(145deg,#8f8fa8,#4a4a5e)">江</i></div></div><div class="row"><div class="face" style="background:linear-gradient(145deg,#8f8fa8,#4a4a5e)">江</div><div class="copy"><div class="title-line"><strong>江离</strong><time>16:02</time></div><div class="preview">我们是校友，方便通过一下吗</div></div></div><div class="actions"><button class="btn">接受</button><button class="btn ghost">忽略</button></div></section>
<section class="card"><div class="top"><span class="pill">好友请求</span><div class="avatars"><i class="avatar" style="background:linear-gradient(145deg,#a89fd0,#5e54a8)">雾</i></div></div><div class="row"><div class="face" style="background:linear-gradient(145deg,#a89fd0,#5e54a8)">雾</div><div class="copy"><div class="title-line"><strong>雾岛</strong><time>15:44</time></div><div class="preview">上次展会上见过，想加个好友</div></div></div><div class="actions"><button class="btn">接受</button><button class="btn ghost">忽略</button></div></section>
<section class="card"><div class="top"><span class="pill">好友请求</span><div class="avatars"><i class="avatar" style="background:linear-gradient(145deg,#7a7a90,#3a3a48)">南</i></div></div><div class="row"><div class="face" style="background:linear-gradient(145deg,#7a7a90,#3a3a48)">南</div><div class="copy"><div class="title-line"><strong>南柯</strong><time>昨天</time></div><div class="preview">朋友推荐的，想交流摄影</div></div><time>待处理</time></div></section>
</main>
</body>
</html>
