<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>彩虹转发</title>
<style>*{box-sizing:border-box}
body{min-height:100vh;margin:0;padding:44px 18px 60px;color:#fff;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:radial-gradient(ellipse at 10% 15%, rgba(255,90,120,.80), transparent 34%),radial-gradient(ellipse at 40% 25%, rgba(255,180,60,.70), transparent 34%),radial-gradient(ellipse at 70% 20%, rgba(90,220,150,.70), transparent 34%),radial-gradient(ellipse at 90% 45%, rgba(90,140,255,.75), transparent 36%),radial-gradient(ellipse at 50% 92%, rgba(180,90,255,.70), transparent 38%),linear-gradient(150deg,#141021,#1d1530 55%,#101a2e);background-attachment:fixed}
main{width:min(440px,100%);margin:0 auto;display:grid;gap:18px}
.heading{padding:4px 6px 8px}
.eyebrow{margin:0 0 8px;color:#fffD;font-size:11px;letter-spacing:.18em}
h1{margin:0;font-size:30px;letter-spacing:-.04em}
.hint{margin:7px 0 0;color:#fffD}
.card{position:relative;isolation:isolate;overflow:hidden;padding:18px;border:1px solid rgba(255,255,255,.30);border-radius:28px;
background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.07) 48%,rgba(180,140,255,.12));-webkit-backdrop-filter:blur(24px) saturate(175%);backdrop-filter:blur(24px) saturate(175%);
box-shadow:inset 0 1px 0 rgba(255,255,255,.42),inset 0 -1px 0 rgba(255,255,255,.08),0 20px 48px rgba(8,8,24,.28);
transition:transform .25s ease,border-color .25s ease}
.card::before{content:"";position:absolute;z-index:0;inset:0;border-radius:inherit;pointer-events:none;opacity:.8;
background:linear-gradient(120deg,rgba(255,255,255,.32) 0%,rgba(255,120,180,.10) 20%,transparent 45%,transparent 70%,rgba(140,160,255,.22) 100%)}
.card::after{content:"";position:absolute;z-index:0;bottom:-56px;left:-42px;width:190px;height:130px;border:1px solid rgba(180,160,255,.28);border-radius:50%;
background:radial-gradient(ellipse,rgba(180,160,255,.20),transparent 68%);filter:blur(2px);transform:rotate(20deg);pointer-events:none}
.card>*{position:relative;z-index:1}
.card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.30)H}
.top,.title-line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top{margin-bottom:17px}
.pill{padding:6px 12px;border:1px solid rgba(180,160,255,.38);border-radius:999px;background:rgba(180,160,255,.12);color:#fff;font-size:12px;box-shadow:inset 0 1px rgba(255,255,255,.18);white-space:nowrap}
.avatars{display:flex;align-items:center;padding-left:8px}
.avatar{display:grid;width:29px;height:29px;margin-left:-8px;place-items:center;border:1px solid rgba(255,255,255,.55);border-radius:50%;color:#fff;font-size:11px;box-shadow:0 3px 10px rgba(18,12,36,.2)}
.more{margin-left:7px;color:#fffD;font-size:12px}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row.rev{flex-direction:row-reverse;text-align:right}
.row.rev .copy .title-line{flex-direction:row-reverse}
.face{display:grid;flex:0 0 48px;height:48px;place-items:center;border:1px solid rgba(180,160,255,.45);border-radius:50%;color:#fff;font-size:19px;font-weight:650;box-shadow:inset 0 1px 5px rgba(255,255,255,.5),0 5px 15px rgba(15,12,35,.2)}
.copy{flex:1;min-width:0}
.title-line{margin-bottom:5px}
.title-line strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
time,.preview{color:#fffD;font-size:12px}
.preview{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unread{flex:0 0 auto;color:#c792ff;font-size:12px;font-weight:600;white-space:nowrap}
.actions{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:10px 0;border:0;border-radius:14px;font-size:13px;font-weight:600;cursor:pointer;color:#fff;background:linear-gradient(135deg,#a06cf0,#7a4fe0);box-shadow:0 6px 18px linear-gradient(135deg,#a06cf0,#7a4fe0)S}
.btn.ghost{background:linear-gradient(135deg,#a06cf0,#7a4fe0)G;color:#fff;border:1px solid rgba(255,255,255,.30)}
.thumb{flex:0 0 52px;width:52px;height:52px;border-radius:14px;border:1px solid rgba(255,255,255,.30);background:#fffHBG}
.voice{display:flex;align-items:center;gap:3px;height:34px;padding:0 12px;border-radius:12px;background:rgba(180,160,255,.10);border:1px solid rgba(255,255,255,.30)}
.voice i{width:3px;border-radius:2px;background:#c792ff;animation:wv 1.1s ease-in-out infinite}
@keyframes wv{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.livedot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff4d6d;margin-right:6px;box-shadow:0 0 8px #ff4d6d;animation:blk 1.4s ease-in-out infinite}
@keyframes blk{50%{transform:scale(1.4)}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)){.card{background:rgba(38,30,58,.92)}}
@media (prefers-reduced-motion:reduce){.card{transition:none}.voice i{animation:none}}</style>
</head>
<body>
<main>
<header class="heading">
<p class="eyebrow">RAINBOW · SHARES</p>
<h1>彩虹转发</h1>
<p class="hint">好内容，值得被传下去。</p>
</header>
<section class="card"><div class="top"><span class="pill">转发</span><div class="avatars"><i class="avatar" style="background:linear-gradient(145deg,#ff8f7a,#e05a6c)">云</i></div></div><div class="row"><div class="face" style="background:linear-gradient(145deg,#ff8f7a,#e05a6c)">云</div><div class="copy"><div class="title-line"><strong>云朵</strong><time>17:25</time></div><div class="preview">转发了你的动态</div></div><div class="thumb"></div></div></section>
<section class="card"><div class="top"><span class="pill">转发</span><div class="avatars"><i class="avatar" style="background:linear-gradient(145deg,#7ac8ff,#4a7fe0)">风</i></div></div><div class="row"><div class="face" style="background:linear-gradient(145deg,#7ac8ff,#4a7fe0)">风</div><div class="copy"><div class="title-line"><strong>晚风</strong><time>16:03</time></div><div class="preview">转发了你的视频《山间晨雾》</div></div><div class="thumb"></div></div></section>
<section class="card"><div class="top"><span class="pill">转发</span><div class="avatars"><i class="avatar" style="background:linear-gradient(145deg,#b08fff,#7a4fd0)">糖</i></div></div><div class="row"><div class="face" style="background:linear-gradient(145deg,#b08fff,#7a4fd0)">糖</div><div class="copy"><div class="title-line"><strong>糖炒栗子</strong><time>昨天</time></div><div class="preview">转发了你的文章《秋日食谱》</div></div><div class="thumb"></div></div></section>
</main>
</body>
</html>
