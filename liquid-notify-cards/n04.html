<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>薄荷评论</title>
<style>*{box-sizing:border-box}
body{min-height:100vh;margin:0;padding:44px 18px 60px;color:#123f36;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:radial-gradient(ellipse at 15% 20%, rgba(120,230,190,.85), transparent 36%),radial-gradient(ellipse at 85% 35%, rgba(80,200,220,.70), transparent 38%),radial-gradient(ellipse at 55% 90%, rgba(60,160,180,.75), transparent 40%),linear-gradient(150deg,#eafff5,#d9f7ec 55%,#c9efe4);background-attachment:fixed}
main{width:min(440px,100%);margin:0 auto;display:grid;gap:18px}
.heading{padding:4px 6px 8px}
.eyebrow{margin:0 0 8px;color:#123f36D;font-size:11px;letter-spacing:.18em}
h1{margin:0;font-size:30px;letter-spacing:-.04em}
.hint{margin:7px 0 0;color:#123f36D}
.card{position:relative;isolation:isolate;overflow:hidden;padding:18px;border:1px solid rgba(255,255,255,.65);border-radius:28px;
background:linear-gradient(135deg,rgba(255,255,255,.50),rgba(255,255,255,.22) 48%,rgba(150,235,200,.28));-webkit-backdrop-filter:blur(22px) saturate(165%);backdrop-filter:blur(22px) saturate(165%);
box-shadow:inset 0 1px 0 rgba(255,255,255,.70),inset 0 -1px 0 rgba(255,255,255,.08),0 20px 48px rgba(8,8,24,.28);
transition:transform .25s ease,border-color .25s ease}
.card::before{content:"";position:absolute;z-index:0;inset:0;border-radius:inherit;pointer-events:none;opacity:.8;
background:linear-gradient(100deg,rgba(255,255,255,.50) 0%,rgba(255,255,255,.15) 20%,transparent 45%,transparent 70%,rgba(120,230,190,.30) 100%)}
.card::after{content:"";position:absolute;z-index:0;top:-64px;left:-40px;width:180px;height:125px;border:1px solid rgba(255,255,255,.60);border-radius:50%;
background:radial-gradient(ellipse,rgba(255,255,255,.38),transparent 68%);filter:blur(2px);transform:rotate(18deg);pointer-events:none}
.card>*{position:relative;z-index:1}
.card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.65)H}
.top,.title-line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top{margin-bottom:17px}
.pill{padding:6px 12px;border:1px solid rgba(11,138,104,.35);border-radius:999px;background:rgba(11,138,104,.10);color:#123f36;font-size:12px;box-shadow:inset 0 1px rgba(255,255,255,.18);white-space:nowrap}
.avatars{display:flex;align-items:center;padding-left:8px}
.avatar{display:grid;width:29px;height:29px;margin-left:-8px;place-items:center;border:1px solid rgba(255,255,255,.85);border-radius:50%;color:#fff;font-size:11px;box-shadow:0 3px 10px rgba(18,12,36,.2)}
.more{margin-left:7px;color:#123f36D;font-size:12px}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row.rev{flex-direction:row-reverse;text-align:right}
.row.rev .copy .title-line{flex-direction:row-reverse}
.face{display:grid;flex:0 0 48px;height:48px;place-items:center;border:1px solid rgba(255,255,255,.70);border-radius:50%;color:#fff;font-size:19px;font-weight:650;box-shadow:inset 0 1px 5px rgba(255,255,255,.5),0 5px 15px rgba(15,12,35,.2)}
.copy{flex:1;min-width:0}
.title-line{margin-bottom:5px}
.title-line strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
time,.preview{color:#123f36D;font-size:12px}
.preview{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unread{flex:0 0 auto;color:#0b8a68;font-size:12px;font-weight:600;white-space:nowrap}
.actions{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:10px 0;border:0;border-radius:14px;font-size:13px;font-weight:600;cursor:pointer;color:#fff;background:linear-gradient(135deg,#12b981,#0b8a68);box-shadow:0 6px 18px linear-gradient(135deg,#12b981,#0b8a68)S}
.btn.ghost{background:linear-gradient(135deg,#12b981,#0b8a68)G;color:#123f36;border:1px solid rgba(255,255,255,.65)}
.thumb{flex:0 0 52px;width:52px;height:52px;border-radius:14px;border:1px solid rgba(255,255,255,.65);background:#123f36HBG}
.voice{display:flex;align-items:center;gap:3px;height:34px;padding:0 12px;border-radius:12px;background:rgba(11,138,104,.08);border:1px solid rgba(255,255,255,.65)}
.voice i{width:3px;border-radius:2px;background:#0b8a68;animation:wv 1.1s ease-in-out infinite}
@keyframes wv{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.livedot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff4d6d;margin-right:6px;box-shadow:0 0 8px #ff4d6d;animation:blk 1.4s ease-in-out infinite}
@keyframes blk{50%{transform:scale(1.4)}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)){.card{background:rgba(230,250,242,.95)}}
@media (prefers-reduced-motion:reduce){.card{transition:none}.voice i{animation:none}}</style>
</head>
<body>
<main>
<header class="heading">
<p class="eyebrow">MINT · COMMENTS</p>
<h1>薄荷评论</h1>
<p class="hint">清清爽爽的互动。</p>
</header>
<section class="card"><div class="top"><span class="pill">评论</span><div class="avatars"><i class="avatar" style="background:linear-gradient(145deg,#4fd6a4,#1f9a6c)">青</i></div></div><div class="row"><div class="face" style="background:linear-gradient(145deg,#4fd6a4,#1f9a6c)">青</div><div class="copy"><div class="title-line"><strong>青柠</strong><time>11:20</time></div><div class="preview">回复了你：这个角度绝了，求教程</div></div><span class="unread">新评论</span></div><div class="actions"><button class="btn">查看</button><button class="btn ghost">稍后</button></div></section>
<section class="card"><div class="top"><span class="pill">评论</span><div class="avatars"><i class="avatar" style="background:linear-gradient(145deg,#6cc8e8,#2f7fb0)">海</i></div></div><div class="row"><div class="face" style="background:linear-gradient(145deg,#6cc8e8,#2f7fb0)">海</div><div class="copy"><div class="title-line"><strong>海盐</strong><time>10:47</time></div><div class="preview">同问+1，已经收藏了</div></div><time>已读</time></div></section>
<section class="card"><div class="top"><span class="pill">评论</span><div class="avatars"><i class="avatar" style="background:linear-gradient(145deg,#a8e06c,#5da83a)">满</i></div></div><div class="row"><div class="face" style="background:linear-gradient(145deg,#a8e06c,#5da83a)">满</div><div class="copy"><div class="title-line"><strong>小满</strong><time>昨天</time></div><div class="preview">已试，真的好用！</div></div><time>已读</time></div></section>
</main>
</body>
</html>
