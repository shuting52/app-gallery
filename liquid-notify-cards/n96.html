<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>发丝银</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  position:relative;
  padding:48px 18px 64px;
  color:#ffffff;
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  background:linear-gradient(150deg,#15161a,#202228 60%,#0e0f12);
  background-attachment:fixed;
  overflow-x:hidden;
}
.bg{
  position:fixed;inset:-6%;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 40% 30% at 18% 22%, rgba(180,185,200,.35), transparent 70%),radial-gradient(ellipse 42% 32% at 82% 34%, rgba(150,158,180,.32), transparent 70%),radial-gradient(ellipse 54% 38% at 55% 86%, rgba(70,75,90,.8), transparent 70%);
  animation:drift 30s ease-in-out infinite alternate;
  animation-delay:-15s;
}
@keyframes drift{
  from{transform:translate3d(-1.5%,-1%,0) scale(1.03) rotate(0deg)}
  to{transform:translate3d(1.5%,1.5%,0) scale(1.07) rotate(1.5deg)}
}
main{position:relative;z-index:1;width:min(440px,100%);margin:0 auto;display:grid;gap:18px}
.heading{padding:4px 6px 8px}
.eyebrow{margin:0 0 8px;color:rgba(255,255,255,.68);font-size:11px;letter-spacing:.18em}
h1{margin:0;font-size:30px;letter-spacing:-.02em;color:#ffffff}
.hint{margin:7px 0 0;color:rgba(255,255,255,.68)}
.card{
  position:relative;isolation:isolate;overflow:hidden;
  padding:18px;border-radius:28px;
  border:1px solid rgba(255,255,255,.28);
  background:repeating-linear-gradient(90deg, rgba(255,255,255,.055) 0 1px, transparent 1px 4px),repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0 1px, transparent 1px 5px),linear-gradient(135deg, rgba(230,235,245,.15), rgba(230,235,245,.06) 48%, rgba(190,195,210,.09));
  -webkit-backdrop-filter:blur(24px) saturate(175%);
  backdrop-filter:blur(24px) saturate(175%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.42),
    inset 0 -1px 0 rgba(0,0,0,.06),
    0 20px 48px rgba(5,6,8,.42);
  transition:transform .25s ease,border-color .25s ease;
}
.card::before{
  content:"";position:absolute;z-index:0;inset:0;border-radius:inherit;pointer-events:none;
  background:
    linear-gradient(118deg,
      rgba(255,255,255,.34) 0%,
      rgba(255,255,255,.08) 18%,
      transparent 42%,
      transparent 72%,
      rgba(200,205,220,.16) 100%);
  opacity:.8;
  animation:sheen 9s ease-in-out infinite alternate;
  animation-delay:-4s;
}
@keyframes sheen{from{opacity:.55}to{opacity:.95}}
.card::after{
  content:"";position:absolute;z-index:0;
  top:-58px;right:-42px;width:190px;height:130px;
  border:1px solid rgba(255,255,255,.22);border-radius:50%;
  background:radial-gradient(ellipse,rgba(230,235,245,.20),transparent 68%);
  filter:blur(2px);transform:rotate(-42pxot);pointer-events:none;
}
.card>*{position:relative;z-index:1}
.card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.46)}
.top,.title-line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top{margin-bottom:15px}
.pill{
  padding:6px 12px;border:1px solid rgba(255,255,255,.30);border-radius:999px;
  background:rgba(255,255,255,.10);color:rgba(255,255,255,.94);font-size:12px;
  box-shadow:inset 0 1px rgba(255,255,255,.42);white-space:nowrap;
}
.avatars{display:flex;align-items:center;padding-left:8px}
.avatar{
  display:grid;width:29px;height:29px;margin-left:-8px;place-items:center;
  border:1px solid rgba(255,255,255,.55);border-radius:50%;
  background:linear-gradient(135deg,#8a7a6a,#5d5a72 70%,#3f4456);
  color:#fff;font-size:11px;font-style:normal;
  box-shadow:0 3px 10px rgba(10,8,18,.25);
}
.more{margin-left:7px;color:rgba(255,255,255,.68);font-size:12px}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.face{
  display:grid;flex:0 0 48px;height:48px;place-items:center;
  border:1px solid rgba(255,255,255,.45);border-radius:50%;
  background:#6a7285;color:#fff;font-size:19px;font-weight:650;
  box-shadow:inset 0 1px 5px rgba(255,255,255,.45),0 5px 15px rgba(10,8,20,.22);
}
.copy{flex:1;min-width:0}
.title-line{margin-bottom:5px}
.title-line strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#ffffff}
time,.preview{color:rgba(255,255,255,.68);font-size:12px}
.preview{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unread{flex:0 0 auto;color:#e6dcff;font-size:12px;font-weight:600;white-space:nowrap}
.dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:#d5dbe8;box-shadow:0 0 8px #d5dbe8}
.actions{display:flex;gap:10px;margin-top:14px}
.btn{
  flex:1;padding:10px 0;text-align:center;border-radius:14px;font-size:13px;cursor:pointer;
  border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:rgba(255,255,255,.92);
  box-shadow:inset 0 1px rgba(255,255,255,.42);
}
.btn.pri{background:linear-gradient(135deg,#8a93a8,#5c6376);border-color:rgba(200,208,225,.5);color:#fff}
.prog{height:8px;border-radius:5px;background:rgba(255,255,255,.10);margin-top:12px;overflow:hidden}
.prog i{display:block;height:100%;width:0%;border-radius:5px;background:linear-gradient(90deg,#c2c9da,#8a93a8)}
.pmeta{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:rgba(255,255,255,.68)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .card{background:rgba(30,26,44,.92)}
}
@media (prefers-reduced-motion:reduce){.card,.bg,.card::before{animation:none;transition:none}}
</style>
</head>
<body>
<div class="bg"></div>
<main>
<header class="heading">
<p class="eyebrow">LIQUID GLASS · 银</p>
<h1>发丝银</h1>
<p class="hint">一丝一缕，皆是分明的消息。</p>
</header>

<section class="card">
  <div class="top">
    <span class="pill">音乐</span>
    <div class="avatars" aria-label="members"><i class="avatar">琴</i></div>
  </div>
  <div class="row">
    <div class="face" style="background:linear-gradient(145deg,#7a8296,#4e5464 60%,#363a46)">琴</div>
    <div class="copy">
      <div class="title-line"><strong>正在播放</strong><time>现在</time></div>
      <div class="preview">《高山流水》· 古琴独奏</div>
    </div>
    <span class="unread"></span>
  </div>
  <div class="actions"><span class="btn pri">暂停</span><span class="btn">下一首</span></div>
</section>

<section class="card">
  <div class="top">
    <span class="pill">系统</span>
    <div class="avatars" aria-label="members"><i class="avatar">iO</i></div>
  </div>
  <div class="row">
    <div class="face" style="background:linear-gradient(145deg,#8a93a8,#5c6376 60%,#414654)">更</div>
    <div class="copy">
      <div class="title-line"><strong>iOS 更新</strong><time>09:12</time></div>
      <div class="preview">iOS 27.1 可用，建议 Wi-Fi 下更新</div>
    </div>
    <span class="unread"></span>
  </div>
  <div class="prog"><i style="width:38%"></i></div><div class="pmeta"><span>下载中</span><span>38%</span></div>
</section>

<section class="card">
  <div class="top">
    <span class="pill">运动</span>
    <div class="avatars" aria-label="members"><i class="avatar">步</i></div>
  </div>
  <div class="row">
    <div class="face" style="background:linear-gradient(145deg,#6a7a8e,#465060 60%,#323842)">步</div>
    <div class="copy">
      <div class="title-line"><strong>今日步数</strong><time>18:00</time></div>
      <div class="preview">已走 8,632 步，超过 82% 的朋友</div>
    </div>
    <span class="unread"></span>
  </div>
  
</section>
</main>
</body>
</html>
