<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>运输途中</title>
<style>
*{box-sizing:border-box}
body{min-height:100vh;margin:0;padding:48px 18px;color:#fff;
font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:radial-gradient(ellipse at 20% 80%, rgba(251,146,60,.85), transparent 38%),radial-gradient(ellipse at 85% 20%, rgba(245,158,11,.7), transparent 36%),radial-gradient(ellipse at 55% 55%, rgba(120,53,15,.6), transparent 44%),linear-gradient(140deg,#2b1608,#3a1f0c 55%,#1c0f06);background-attachment:fixed}
main{width:min(440px,100%);margin:0 auto;display:grid;gap:18px}
.heading{padding:4px 6px 8px}
.eyebrow{margin:0 0 8px;color:rgba(255,255,255,.68);font-size:11px;letter-spacing:.18em}
h1{margin:0;font-size:30px;letter-spacing:-.04em}
.hint{margin:7px 0 0;color:rgba(255,255,255,.68)}
.card{position:relative;isolation:isolate;overflow:hidden;padding:18px;
border:1px solid rgba(255,255,255,.28);border-radius:28px;
background:linear-gradient(135deg,
rgba(255,255,255,.20),rgba(255,255,255,.08) 48%,rgba(253,186,116,.14));
-webkit-backdrop-filter:blur(24px) saturate(175%);
backdrop-filter:blur(24px) saturate(175%);
box-shadow:inset 0 1px 0 rgba(255,255,255,.42),inset 0 -1px 0 rgba(255,255,255,.08),0 20px 48px rgba(8,8,24,.28);
transition:transform .25s ease,border-color .25s ease}
.card::before{content:"";position:absolute;z-index:0;inset:0;border-radius:inherit;pointer-events:none;
background:linear-gradient(118deg,rgba(255,255,255,.34) 0%,rgba(255,255,255,.08) 18%,transparent 42%,transparent 72%,rgba(255,206,234,.16) 100%);opacity:.8}
.card::after{content:"";position:absolute;z-index:0;top:-40px;right:-64px;width:220px;height:110px;
border:1px solid rgba(255,255,255,.28);border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.22),transparent 68%);
filter:blur(2px);transform:rotate(-38deg);pointer-events:none}
.card>*{position:relative;z-index:1}
.card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.46)}
.top,.title-line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top{margin-bottom:17px}
.pill{padding:6px 12px;border:1px solid rgba(255,255,255,.28);border-radius:999px;background:rgba(255,255,255,.10);color:#fff;font-size:12px;box-shadow:inset 0 1px rgba(255,255,255,.18)}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.face{display:grid;flex:0 0 48px;height:48px;place-items:center;border:1px solid rgba(255,255,255,.45);border-radius:50%;
background:linear-gradient(145deg,rgba(255,225,194,.88),rgba(190,139,204,.78) 58%,rgba(111,133,201,.8));color:#fff;font-size:19px;font-weight:650;
box-shadow:inset 0 1px 5px rgba(255,255,255,.5),0 5px 15px rgba(15,12,35,.2)}
.copy{flex:1;min-width:0}
.title-line{margin-bottom:5px}
.title-line strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
time,.preview{color:rgba(255,255,255,.68);font-size:12px}
.preview{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unread{flex:0 0 auto;color:#fed7aa;font-size:12px;font-weight:600}
.prog{height:10px;border-radius:6px;background:rgba(255,255,255,.12);margin:14px 0 6px;overflow:hidden}
.prog i{display:block;height:100%;width:68%;border-radius:6px;background:linear-gradient(90deg,#fb923c,#fde68a);
box-shadow:0 0 12px rgba(251,146,60,.65);animation:flow 3s linear infinite;background-size:200% 100%}
@keyframes flow{from{background-position:0 0}to{background-position:-200% 0}}
.steps{display:flex;margin:16px 0 4px}
.st{flex:1;text-align:center;position:relative;font-size:11px;color:rgba(255,255,255,.68)}
.st b{display:block;width:14px;height:14px;margin:0 auto 6px;border-radius:50%;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.28)}
.st.done{color:#fff}.st.done b{background:#fed7aa;border-color:#fed7aa;box-shadow:0 0 10px rgba(251,146,60,.65)}
.st::before{content:"";position:absolute;top:7px;left:-50%;width:100%;height:2px;background:rgba(255,255,255,.16);z-index:-1}
.st:first-child::before{display:none}
.st.done::before{background:#fed7aa}
.actions{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:11px 0;border-radius:14px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.10);color:#fff;font-size:13px;font-weight:600;text-align:center;cursor:pointer}
.btn.hot{background:linear-gradient(135deg,#f59e0b,#fb923c);border:0;color:#fff;box-shadow:0 6px 18px rgba(251,146,60,.65)}
.codebox{font-size:34px;font-weight:800;letter-spacing:.35em;text-align:center;padding:10px 0 4px;color:#fff;text-shadow:0 0 24px rgba(251,146,60,.65)}
.bigamt{font-size:30px;font-weight:800;color:#fff;margin:6px 0}
.stars{display:flex;gap:8px;margin:12px 0;font-size:26px}
.stars s{text-decoration:none;cursor:pointer;color:#fed7aa;filter:drop-shadow(0 0 6px rgba(251,146,60,.65))}
.thumb{flex:0 0 52px;width:52px;height:52px;border-radius:14px;border:1px solid rgba(255,255,255,.45);
background:linear-gradient(145deg,rgba(255,225,194,.88),rgba(190,139,204,.78) 58%,rgba(111,133,201,.8));display:grid;place-items:center;font-size:26px;
box-shadow:inset 0 1px 5px rgba(255,255,255,.5)}
.tag{font-size:10px;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.68);margin-left:8px;white-space:nowrap}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
.card { background: rgba(43,35,68,.88); }
}

</style>
</head>
<body class="n13">
<main>
<header class="heading">
<p class="eyebrow">LIQUID GLASS</p>
<h1>在途</h1>
<p class="hint">包裹正在路上，风雨无阻。</p>
</header>
<section class="card"><div class="top"><span class="pill">运输中</span><span class="unread">68%</span></div><div class="row"><div class="face">🛣</div><div class="copy"><div class="title-line"><strong>京东快递 JD55312088</strong><time>16:45</time></div><div class="preview">快件到达南京分拨中心，正在发往下一站</div></div><span class="unread">在途</span></div><div class="prog"><i></i></div><div class="steps"><div class="st done"><b></b>已揽收</div><div class="st done"><b></b>运输中</div><div class="st"><b></b>派送中</div><div class="st"><b></b>已签收</div></div></section><section class="card"><div class="top"><span class="pill">天气</span><time>16:45</time></div><div class="row"><div class="face">🌧</div><div class="copy"><div class="title-line"><strong>途经区域有降雨</strong><time>16:45</time></div><div class="preview">可能影响时效，已为你加急调度</div></div></div></section>
</main>
</body>
</html>
