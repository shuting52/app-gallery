<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>液态玻璃通知卡片 · 歌单速递</title>
<style>

*{box-sizing:border-box}
body{min-height:100vh;margin:0;padding:48px 18px;color:#fff;
font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:radial-gradient(ellipse at 80% 15%, rgba(45,200,170,.8), transparent 36%),
 radial-gradient(ellipse at 12% 45%, rgba(60,120,220,.7), transparent 38%),
 radial-gradient(ellipse at 55% 90%, rgba(18,60,80,.9), transparent 40%),
 linear-gradient(150deg,#0e2426,#123f44 55%,#0b1c20);background-attachment:fixed}
main{width:min(440px,100%);margin:0 auto;display:grid;gap:18px}
.heading{padding:4px 6px 8px}
.eyebrow{margin:0 0 8px;color:rgba(255,255,255,.66);font-size:11px;letter-spacing:.18em}
h1{margin:0;font-size:30px;letter-spacing:-.04em}
.hint{margin:7px 0 0;color:rgba(255,255,255,.66)}
.card{position:relative;isolation:isolate;overflow:hidden;padding:18px;
border:1px solid rgba(255,255,255,.26);border-radius:24px;
background:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.06) 50%,rgba(120,230,200,.10));
-webkit-backdrop-filter:blur(20px) saturate(160%);
backdrop-filter:blur(20px) saturate(160%);
box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(255,255,255,.08),0 20px 48px rgba(4,20,22,.3);
transition:transform .25s ease,border-color .25s ease}
.card::before{content:"";position:absolute;z-index:0;inset:0;border-radius:inherit;pointer-events:none;
background:linear-gradient(64deg,rgba(255,255,255,.34) 0%,rgba(255,255,255,.08) 18%,
transparent 42%,transparent 72%,rgba(170,255,225,.15) 100%);opacity:.8}
.card::after{content:"";position:absolute;z-index:0;top:-40px;right:-60px;
width:170px;height:150px;border:1px solid rgba(255,255,255,.22);border-radius:50%;
background:radial-gradient(ellipse,rgba(255,255,255,.22),transparent 68%);
filter:blur(2px);transform:rotate(15deg);pointer-events:none}
.card>*{position:relative;z-index:1}
.card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.44)}
.top,.title-line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top{margin-bottom:17px}
.pill{padding:6px 12px;border:1px solid rgba(255,255,255,.26);border-radius:999px;background:rgba(255,255,255,.10);
color:#fff;font-size:12px;box-shadow:inset 0 1px rgba(255,255,255,.18);white-space:nowrap}
.avatars{display:flex;align-items:center;padding-left:8px}
.avatar{display:grid;width:29px;height:29px;margin-left:-8px;place-items:center;
border:1px solid rgba(255,255,255,.55);border-radius:50%;background:linear-gradient(135deg,#2dc8aa, #3c78dc 70%, #123f44);
color:#fff;font-size:11px;box-shadow:0 3px 10px rgba(18,12,36,.2)}
.more{margin-left:7px;color:rgba(255,255,255,.66);font-size:12px}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.face{display:grid;flex:0 0 48px;height:48px;place-items:center;border:1px solid rgba(255,255,255,.45);
border-radius:50%;background:linear-gradient(145deg,#2dc8aa, #3c78dc 70%, #123f44);color:#fff;font-size:19px;font-weight:650;
box-shadow:inset 0 1px 5px rgba(255,255,255,.5),0 5px 15px rgba(15,12,35,.2)}
.copy{flex:1;min-width:0}
.title-line{margin-bottom:5px}
.title-line strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
time,.preview{color:rgba(255,255,255,.66);font-size:12px}
.preview{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unread{flex:0 0 auto;color:#9df2d8;font-size:12px;font-weight:600}


@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .card { background: rgba(43,35,68,.88); }
}
@media (prefers-reduced-motion: reduce) {
  .card { transition: none; }
  .breath,.ecg path { animation: none; }
}
</style>
</head>
<body>
<main>
<header class="heading">
<p class="eyebrow">PLAYLIST</p>
<h1>歌单速递</h1>
<p class="hint">为你挑的歌，先听为敬。</p>
</header>

<section class="card">
  <div class="top"><span class="pill">为你推荐</span><div class="avatars"><i class="avatar">爵</i><i class="avatar">电</i><i class="avatar">民</i><span class="more">12 首</span></div></div>
  <div class="row">
    <div class="face">单</div>
    <div class="copy">
      <div class="title-line"><strong>雨后慢跑歌单</strong><time>今日</time></div>
      <div class="preview">根据你的跑步节奏生成 · 48 分钟</div>
    </div>
    <span class="unread">收藏</span>
  </div>
</section>
<section class="card">
  <div class="top"><span class="pill">好友在听</span><div class="avatars"><i class="avatar">舟</i><i class="avatar">麦</i></div></div>
  <div class="row">
    <div class="face">舟</div>
    <div class="copy">
      <div class="title-line"><strong>陈舟</strong><time>12:05</time></div>
      <div class="preview">分享了歌单《骑行不打烊》给你</div>
    </div>
    <span class="unread">查看</span>
  </div>
</section>
</main>
</body>
</html>
