<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>晨间邮件</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 18px 60px;
      color: #fff;
      font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(ellipse at 14% 20%, rgba(56,120,220,.85), transparent 34%), radial-gradient(ellipse at 82% 35%, rgba(90,60,180,.8), transparent 36%), radial-gradient(ellipse at 55% 88%, rgba(40,90,160,.75), transparent 38%), linear-gradient(145deg, #101a33, #1c2450 52%, #0e1626);
      background-attachment: fixed;
    }
    main { width: min(440px, 100%); margin: 0 auto; display: grid; gap: 18px; }
    .heading { padding: 4px 6px 8px; }
    .eyebrow { margin: 0 0 8px; color: rgba(255,255,255,.68); font-size: 11px; letter-spacing: .18em; }
    h1 { margin: 0; font-size: 30px; letter-spacing: -.04em; }
    .hint { margin: 7px 0 0; color: rgba(255,255,255,.68); }
    .card {
      position: relative; isolation: isolate; overflow: hidden; padding: 18px;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(255,255,255,.20), rgba(255,255,255,.08) 48%, rgba(160,190,255,.12));
      -webkit-backdrop-filter: blur(24px) saturate(175%);
      backdrop-filter: blur(24px) saturate(175%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.42), inset 0 -1px 0 rgba(255,255,255,.08), 0 20px 48px rgba(8,8,24,.28);
      transition: transform .25s ease, border-color .25s ease;
    }
    .card::before {
      content: ""; position: absolute; z-index: 0; inset: 0; border-radius: inherit; pointer-events: none;
      background: linear-gradient(118deg,
        rgba(255,255,255,.34) 0%, rgba(255,255,255,.08) 18%, transparent 42%,
        transparent 72%, rgba(190,220,255,.16) 100%);
      opacity: .8;
    }
    .card::after {
      content: ""; position: absolute; z-index: 0; pointer-events: none;
      top: -58px; right: -42px; left: auto; bottom: auto;
      width: 190px; height: 130px;
      border: 1px solid rgba(255,255,255,.22); border-radius: 50%;
      background: radial-gradient(ellipse, rgba(255,255,255,.22), transparent 68%);
      filter: blur(2px); transform: rotate(-20deg); pointer-events: none;
    }
    .card > * { position: relative; z-index: 1; }
    .card:hover { transform: translateY(-3px); border-color: rgba(255,255,255,.46); }
    .top, .title-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .top { margin-bottom: 17px; }
    .pill { padding: 6px 12px; border: 1px solid rgba(255,255,255,.30); border-radius: 999px;
      background: rgba(255,255,255,.10); color: rgba(255,255,255,.94); font-size: 12px;
      box-shadow: inset 0 1px rgba(255,255,255,.18); white-space: nowrap; }
    .pill.hot { background: rgba(255,92,92,.22); border-color: rgba(255,120,120,.55); color: #ffd9d9; }
    .pill.pin { background: rgba(255,214,102,.18); border-color: rgba(255,214,102,.5); color: #ffe9b8; }
    .pill.ok { background: rgba(102,255,170,.16); border-color: rgba(102,255,170,.45); color: #d2ffe4; }
    .avatars { display: flex; align-items: center; padding-left: 8px; }
    .avatar { display: grid; width: 29px; height: 29px; margin-left: -8px; place-items: center;
      border: 1px solid rgba(255,255,255,.55); border-radius: 50%;
      background: linear-gradient(135deg, #f8c79e, #a987c8 70%, #7267a9);
      color: #fff; font-size: 11px; box-shadow: 0 3px 10px rgba(18,12,36,.2); }
    .more { margin-left: 7px; color: rgba(255,255,255,.72); font-size: 12px; }
    .row { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .face { display: grid; flex: 0 0 48px; height: 48px; place-items: center;
      border: 1px solid rgba(255,255,255,.45); border-radius: 50%;
      background: linear-gradient(145deg, rgba(255,225,194,.88), rgba(190,139,204,.78) 58%, rgba(111,133,201,.8)); color: #fff; font-size: 19px; font-weight: 650;
      box-shadow: inset 0 1px 5px rgba(255,255,255,.5), 0 5px 15px rgba(15,12,35,.2); }
    .face.sq { border-radius: 14px; }
    .copy { flex: 1; min-width: 0; }
    .title-line { margin-bottom: 5px; }
    .title-line strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
    time, .preview { color: rgba(255,255,255,.72); font-size: 12px; }
    .preview { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .unread { flex: 0 0 auto; color: #d8d2ff; font-size: 12px; font-weight: 600; }
    .btns { display: flex; gap: 10px; margin-top: 14px; }
    .btn { flex: 1; padding: 10px 0; border-radius: 14px; border: 1px solid rgba(255,255,255,.28);
      background: rgba(255,255,255,.10); color: #fff; font-size: 13px; cursor: pointer;
      font-family: inherit; box-shadow: inset 0 1px rgba(255,255,255,.16); }
    .btn.primary { background: linear-gradient(135deg, rgba(120,220,255,.35), rgba(150,140,255,.35)); border-color: rgba(160,220,255,.55); }
    .btn.danger { background: rgba(255,110,110,.16); border-color: rgba(255,130,130,.5); }
    .atts { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .att { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(255,255,255,.85);
      padding: 6px 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.08); }
    .bar { height: 8px; border-radius: 5px; background: rgba(255,255,255,.14); margin-top: 12px; overflow: hidden; }
    .bar i { display: block; height: 100%; border-radius: 5px;
      background: linear-gradient(90deg, rgba(140,230,255,.9), rgba(170,150,255,.9)); }
    .tl { margin-top: 14px; display: grid; gap: 0; }
    .tl .nd { display: flex; gap: 12px; }
    .tl .rail { display: flex; flex-direction: column; align-items: center; }
    .tl .dt { width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(255,255,255,.6); background: rgba(255,255,255,.15); flex: 0 0 auto; margin-top: 3px; }
    .tl .nd.done .dt { background: #8fe3a8; border-color: #bff0cf; box-shadow: 0 0 10px rgba(140,230,170,.7); }
    .tl .ln { width: 2px; flex: 1; min-height: 16px; background: rgba(255,255,255,.22); }
    .tl .tx { padding-bottom: 16px; font-size: 13px; }
    .tl .tx b { display: block; font-size: 13px; }
    .tl .tx span { color: rgba(255,255,255,.65); font-size: 12px; }
    .amt { font-size: 22px; font-weight: 700; letter-spacing: .02em; }
    .meta { display: flex; gap: 8px; margin-top: 10px; font-size: 12px; color: rgba(255,255,255,.72); }
    .meta b { color: #fff; font-weight: 600; }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .card { background: rgba(43,35,68,.88); }
    }
    @media (prefers-reduced-motion: reduce) { .card { transition: none; } }

  </style>
</head>
<body>
  <main>
    <header class="heading">
      <p class="eyebrow">MAIL · INBOX</p>
      <h1>收件箱</h1>
      <p class="hint">新邮件带着附件准时抵达。</p>
    </header>

    <section class="card">
      <div class="top"><span class="pill">新邮件</span><div class="avatars"><i class="avatar">沈</i></div></div>
      <div class="row">
        <div class="face">✉</div>
        <div class="copy">
          <div class="title-line"><strong>沈亦舟 · Q3 推广方案初稿</strong><time>08:12</time></div>
          <div class="preview">附件里是第一版排期表，请查收并给些意见。</div>
        </div><span class="unread">2 封未读</span>
      </div>
      <div class="atts"><span class="att">📎 排期表.xlsx</span><span class="att">📎 渠道报价.pdf</span></div>
    </section>
    <section class="card">
      <div class="top"><span class="pill">新邮件</span><div class="avatars"><i class="avatar">陶</i></div></div>
      <div class="row">
        <div class="face">✉</div>
        <div class="copy">
          <div class="title-line"><strong>陶然 · 样机拍摄场地确认</strong><time>07:48</time></div>
          <div class="preview">周三上午的棚已约好，灯光清单在正文里。</div>
        </div>
      </div>
      <div class="btns"><button class="btn primary">回复</button><button class="btn">稍后处理</button></div>
    </section>
    <section class="card">
      <div class="top"><span class="pill">订阅</span><div class="avatars"><i class="avatar">刊</i></div></div>
      <div class="row">
        <div class="face sq">📰</div>
        <div class="copy">
          <div class="title-line"><strong>设计周刊 · 第 42 期</strong><time>06:30</time></div>
          <div class="preview">本周主题：玻璃拟态的克制用法。</div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
