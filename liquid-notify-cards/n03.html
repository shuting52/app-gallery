<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>蜜桃群聊</title>
<style>*{box-sizing:border-box}
body{min-height:100vh;margin:0;padding:44px 18px 60px;color:#4a2c22;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:radial-gradient(ellipse at 15% 20%, rgba(255,180,150,.9), transparent 36%),radial-gradient(ellipse at 85% 35%, rgba(255,140,170,.75), transparent 38%),radial-gradient(ellipse at 55% 90%, rgba(255,200,170,.8), transparent 40%),linear-gradient(150deg,#fff3ec,#ffe3d6 55%,#ffd9c9);background-attachment:fixed}
main{width:min(440px,100%);margin:0 auto;display:grid;gap:18px}
.heading{padding:4px 6px 8px}
.eyebrow{margin:0 0 8px;color:#4a2c22D;font-size:11px;letter-spacing:.18em}
h1{margin:0;font-size:30px;letter-spacing:-.04em}
.hint{margin:7px 0 0;color:#4a2c22D}
.card{position:relative;isolation:isolate;overflow:hidden;padding:18px;border:1px solid rgba(255,255,255,.70);border-radius:28px;
background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.25) 48%,rgba(255,200,180,.30));-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(255,255,255,.08),0 20px 48px rgba(8,8,24,.28);
transition:transform .25s ease,border-color .25s ease}
.card::before{content:"";position:absolute;z-index:0;inset:0;border-radius:inherit;pointer-events:none;opacity:.8;
background:linear-gradient(125deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.18) 20%,transparent 45%,transparent 70%,rgba(255,170,150,.30) 100%)}
.card::after{content:"";position:absolute;z-index:0;top:-52px;right:-38px;width:185px;height:125px;border:1px solid rgba(255,255,255,.65);border-radius:50%;
background:radial-gradient(ellipse,rgba(255,255,255,.40),transparent 68%);filter:blur(2px);transform:rotate(-15deg);pointer-events:none}
.card>*{position:relative;z-index:1}
.card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.70)H}
.top,.title-line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top{margin-bottom:17px}
.pill{padding:6px 12px;border:1px solid rgba(209,79,67,.35);border-radius:999px;background:rgba(209,79,67,.10);color:#4a2c22;font-size:12px;box-shadow:inset 0 1px rgba(255,255,255,.18);white-space:nowrap}
.avatars{display:flex;align-items:center;padding-left:8px}
.avatar{display:grid;width:29px;height:29px;margin-left:-8px;place-items:center;border:1px solid rgba(255,255,255,.85);border-radius:50%;color:#fff;font-size:11px;box-shadow:0 3px 10px rgba(18,12,36,.2)}
.more{margin-left:7px;color:#4a2c22D;font-size:12px}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row.rev{flex-direction:row-reverse;text-align:right}
.row.rev .copy .title-line{flex-direction:row-reverse}
.face{display:grid;flex:0 0 48px;height:48px;place-items:center;border:1px solid rgba(255,255,255,.70);border-radius:50%;color:#fff;font-size:19px;font-weight:650;box-shadow:inset 0 1px 5px rgba(255,255,255,.5),0 5px 15px rgba(15,12,35,.2)}
.copy{flex:1;min-width:0}
.title-line{margin-bottom:5px}
.title-line strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
time,.preview{color:#4a2c22D;font-size:12px}
.preview{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unread{flex:0 0 auto;color:#d14f43;font-size:12px;font-weight:600;white-space:nowrap}
.actions{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:10px 0;border:0;border-radius:14px;font-size:13px;font-weight:600;cursor:pointer;color:#fff;background:linear-gradient(135deg,#f0735f,#d14f43);box-shadow:0 6px 18px linear-gradient(135deg,#f0735f,#d14f43)S}
.btn.ghost{background:linear-gradient(135deg,#f0735f,#d14f43)G;color:#4a2c22;border:1px solid rgba(255,255,255,.70)}
.thumb{flex:0 0 52px;width:52px;height:52px;border-radius:14px;border:1px solid rgba(255,255,255,.70);background:#4a2c22HBG}
.voice{display:flex;align-items:center;gap:3px;height:34px;padding:0 12px;border-radius:12px;background:rgba(209,79,67,.08);border:1px solid rgba(255,255,255,.70)}
.voice i{width:3px;border-radius:2px;background:#d14f43;animation:wv 1.1s ease-in-out infinite}
@keyframes wv{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.livedot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff4d6d;margin-right:6px;box-shadow:0 0 8px #ff4d6d;animation:blk 1.4s ease-in-out infinite}
@keyframes blk{50%{transform:scale(1.4)}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)){.card{background:rgba(255,235,225,.95)}}
@media (prefers-reduced-motion:reduce){.card{transition:none}.voice i{animation:none}}</style>
</head>
<body>
<main>
<header class="heading">
<p class="eyebrow">PEACH · GROUPS</p>
<h1>蜜桃群聊</h1>
<p class="hint">热闹的群，甜甜的。</p>
</header>
<section class="card"><div class="top"><span class="pill">群聊</span><div class="avatars"><i class="avatar" style="background:linear-gradient(145deg,#f5a06c,#d96a4a)">苏</i><i class="avatar" style="background:linear-gradient(145deg,#f7c873,#dda04a)">蔓</i><i class="avatar" style="background:linear-gradient(145deg,#ef8fb0,#c85a80)">阿</i><span class="more">+12</span></div></div><div class="row"><div class="face" style="background:linear-gradient(145deg,#f5a06c,#d96a4a)">苏</div><div class="copy"><div class="title-line"><strong>露营小分队</strong><time>19:48</time></div><div class="preview">苏蔓：帐篷我借到了，周五见</div></div><span class="unread">9 条未读</span></div></section>
<section class="card"><div class="top"><span class="pill">群聊</span><div class="avatars"><i class="avatar" style="background:linear-gradient(145deg,#f7c873,#dda04a)">陈</i><i class="avatar" style="background:linear-gradient(145deg,#ef8fb0,#c85a80)">皮</i><span class="more">+5</span></div></div><div class="row"><div class="face" style="background:linear-gradient(145deg,#f7c873,#dda04a)">陈</div><div class="copy"><div class="title-line"><strong>干饭小队</strong><time>18:05</time></div><div class="preview">陈皮：新开的火锅店，今晚冲</div></div><span class="unread">3 条未读</span></div></section>
<section class="card"><div class="top"><span class="pill">群聊</span><div class="avatars"><i class="avatar" style="background:linear-gradient(145deg,#ef8fb0,#c85a80)">周</i><span class="more">+8</span></div></div><div class="row"><div class="face" style="background:linear-gradient(145deg,#ef8fb0,#c85a80)">周</div><div class="copy"><div class="title-line"><strong>读书会</strong><time>昨天</time></div><div class="preview">老周：下周读《海底两万里》</div></div><time>已读</time></div></section>
</main>
</body>
</html>
