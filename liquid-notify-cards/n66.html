<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新功能</title>
<style>
*{
box-sizing: border-box;
}
body {
min-height: 100vh;
margin: 0;
padding: 48px 18px;
color: #fff;
font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
background: radial-gradient(ellipse at 18% 20%, rgba(244,114,182,.9), transparent 36%),radial-gradient(ellipse at 82% 36%, rgba(168,85,247,.78), transparent 38%),radial-gradient(ellipse at 52% 88%, rgba(90,30,140,.85), transparent 40%),linear-gradient(150deg,#2c1030,#421a4e 55%,#200c2c);
background-attachment: fixed;
}
main {
width: min(440px, 100%);
margin: 0 auto;
display: grid;
gap: 18px;
}
.heading { padding: 4px 6px 8px;}
.eyebrow {
margin: 0 0 8px;
color: rgba(255,255,255,.68);
font-size: 11px;
letter-spacing:.18em;
}
h1 { margin: 0; font-size: 30px; letter-spacing: -.04em;}
.hint { margin: 7px 0 0; color: rgba(255,255,255,.68);}
.card {
position: relative;
isolation: isolate;
overflow: hidden;
padding: 18px;
border: 1px solid rgba(240,170,255,.34);
border-radius: 28px;
background: linear-gradient(135deg, rgba(255,255,255,.20),rgba(255,255,255,.08) 48%,rgba(230,150,255,.13));
-webkit-backdrop-filter: blur(26px) saturate(175%);
backdrop-filter: blur(26px) saturate(175%);
box-shadow:
inset 0 1px 0 rgba(255,255,255,.42),
inset 0 -1px 0 rgba(255,255,255,.08),
0 20px 48px rgba(8,8,24,.28);
transition: transform.25s ease, border-color.25s ease;
}
.card::before {
content: "";
position: absolute;
z-index: 0;
inset: 0;
border-radius: inherit;
pointer-events: none;
background:
linear-gradient(135deg,
rgba(255,255,255,.34) 0%,
rgba(255,255,255,.08) 18%,
transparent 42%,
transparent 72%,
rgba(255,206,234,.16) 100%);
opacity:.8;
}
.card::after {
content: "";
position: absolute;
z-index: 0;
top:-56px;right:-44px;
width: 190px;
height: 130px;
border: 1px solid rgba(255,255,255,.22);
border-radius: 50%;
background: radial-gradient(ellipse, rgba(255,255,255,.22), transparent 68%);
filter: blur(2px);
transform: rotate(-12deg);
pointer-events: none;
}
.card > * { position: relative; z-index: 1;}
.card:hover { transform: translateY(-3px); border-color: rgba(255,255,255,.46);}
.top,.title-line {
display: flex;
align-items: center;
justify-content: space-between;
gap: 12px;
}
.top { margin-bottom: 15px;}
.pill {
padding: 6px 12px;
border: 1px solid rgba(255,255,255,.30);
border-radius: 999px;
background: rgba(255,255,255,.10);
color: rgba(255,255,255,.94);
font-size: 12px;
box-shadow: inset 0 1px rgba(255,255,255,.18);
}
.dot {
flex: 0 0 auto;
width: 10px;
height: 10px;
border-radius: 50%;
background: #fff;
box-shadow: 0 0 12px rgba(255,255,255,.9);
animation: blk 1.6s ease-in-out infinite;
animation-delay: -.8s;
}
@keyframes blk { 50% { transform: scale(1.45);}}
.row { display: flex; align-items: center; gap: 12px; min-width: 0;}
.face {
display: grid;
flex: 0 0 48px;
height: 48px;
place-items: center;
border: 1px solid rgba(255,255,255,.45);
border-radius: 16px;
background: linear-gradient(145deg,#f9a8d4,#d946ef 60%,#86198f);
color: #fff;
font-size: 22px;
font-weight: 650;
box-shadow: inset 0 1px 5px rgba(255,255,255,.5), 0 5px 15px rgba(15,12,35,.2);
}
.copy { flex: 1; min-width: 0;}
.title-line { margin-bottom: 5px;}
.title-line strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
time,.preview { color: rgba(255,255,255,.72); font-size: 12px;}
.preview { overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
.unread { flex: 0 0 auto; color: #d8d2ff; font-size: 12px; font-weight: 600;}
.actions { display: flex; gap: 10px; margin-top: 14px;}
.btn {
flex: 1;
padding: 10px 0;
border-radius: 14px;
border: 1px solid rgba(255,255,255,.30);
background: rgba(255,255,255,.12);
color: #fff;
font-size: 13px;
text-align: center;
cursor: pointer;
}
.btn.pri { background: linear-gradient(135deg,#e879f9,#a855f7); border-color: transparent; font-weight: 700;}
.bar {
height: 8px;
border-radius: 5px;
background: rgba(255,255,255,.16);
margin-top: 12px;
overflow: hidden;
}
.bar i {
display: block;
height: 100%;
border-radius: 5px;
background: linear-gradient(135deg,#e879f9,#a855f7);
animation: fill 1.2s ease both;
}
@keyframes fill { from { width: 0!important;}}
.meta {
display: flex;
justify-content: space-between;
font-size: 12px;
color: rgba(255,255,255,.72);
margin-top: 6px;
}
.code {
font-size: 34px;
font-weight: 800;
letter-spacing:.28em;
margin: 6px 0 2px;
text-align: center;
text-indent:.28em;
text-shadow: 0 2px 18px rgba(255,255,255,.25);
}
.sw {
flex: 0 0 auto;
position: relative;
display: block;
width: 52px;
height: 30px;
border-radius: 16px;
background: #34c759;
cursor: pointer;
}
.sw i {
position: absolute;
top: 3px;
left: 25px;
display: block;
width: 24px;
height: 24px;
border-radius: 50%;
background: #fff;
box-shadow: 0 2px 6px rgba(0,0,0,.3);
}
.stats { display: flex; gap: 10px; margin-top: 12px;}
.stat {
flex: 1;
text-align: center;
padding: 10px 4px;
border-radius: 14px;
background: rgba(255,255,255,.08);
border: 1px solid rgba(255,255,255,.14);
}
.stat b { display: block; font-size: 17px;}
.stat span { font-size: 11px; color: rgba(255,255,255,.65);}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
.card { background: rgba(43,35,68,.88);}
}
@media (prefers-reduced-motion: reduce) {
.card { transition: none;}
.bar i { animation: none;}
.dot { animation: none;}
}

</style>
</head>
<body>
<main>
<header class="heading">
<p class="eyebrow">WHAT'S NEW</p>
<h1>新功能</h1>
<p class="hint">刚上线的新玩意儿，第一个告诉你。</p>
</header>
<section class="card"><div class="top"><span class="pill">上新</span><span class="dot"></span></div><div class="row"><div class="face">✨</div><div class="copy"><div class="title-line"><strong>液态桌面来了</strong><time>刚刚</time></div><div class="preview">图标会呼吸的桌面主题，免费体验 7 天</div></div><span class="unread">NEW</span></div><div class="actions"><div class="btn pri">去看看</div><div class="btn">稍后再说</div></div></section>
<section class="card"><div class="top"><span class="pill">上新</span><span class="dot"></span></div><div class="row"><div class="face">🎙</div><div class="copy"><div class="title-line"><strong>语音备忘录 2.0</strong><time>昨天</time></div><div class="preview">自动转文字，还能一键生成摘要</div></div></div><div class="actions"><div class="btn pri">立即体验</div></div></section>
</main>
</body>
</html>
