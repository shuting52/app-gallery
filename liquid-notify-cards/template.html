<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>液态玻璃通知卡片</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 18px;
      color: #fff;
      font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 14% 20%, rgba(255, 146, 96, .95), transparent 34%),
        radial-gradient(ellipse at 82% 35%, rgba(207, 72, 119, .82), transparent 36%),
        radial-gradient(ellipse at 55% 88%, rgba(67, 94, 180, .8), transparent 38%),
        linear-gradient(145deg, #17172e, #39213e 52%, #17223d);
      background-attachment: fixed;
    }

    main {
      width: min(440px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }

    .heading { padding: 4px 6px 8px; }
    .eyebrow {
      margin: 0 0 8px;
      color: rgba(255,255,255,.68);
      font-size: 11px;
      letter-spacing: .18em;
    }
    h1 { margin: 0; font-size: 30px; letter-spacing: -.04em; }
    .hint { margin: 7px 0 0; color: rgba(255,255,255,.68); }

    .card {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      padding: 18px;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 28px;
      background: linear-gradient(135deg,
        rgba(255,255,255,.20),
        rgba(255,255,255,.08) 48%,
        rgba(202,170,255,.12));
      -webkit-backdrop-filter: blur(24px) saturate(175%);
      backdrop-filter: blur(24px) saturate(175%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.42),
        inset 0 -1px 0 rgba(255,255,255,.08),
        0 20px 48px rgba(8,8,24,.28);
      transition: transform .25s ease, border-color .25s ease;
    }

    /* 流动的玻璃高光 */
    .card::before {
      content: "";
      position: absolute;
      z-index: 0;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background:
        linear-gradient(118deg,
          rgba(255,255,255,.34) 0%,
          rgba(255,255,255,.08) 18%,
          transparent 42%,
          transparent 72%,
          rgba(255,206,234,.16) 100%);
      opacity: .8;
    }

    /* 右上角的弧形亮斑，增加“液态”边缘感 */
    .card::after {
      content: "";
      position: absolute;
      z-index: 0;
      top: -58px;
      right: -42px;
      width: 190px;
      height: 130px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(255,255,255,.22), transparent 68%);
      filter: blur(2px);
      transform: rotate(-20deg);
      pointer-events: none;
    }

    .card > * { position: relative; z-index: 1; }
    .card:hover { transform: translateY(-3px); border-color: rgba(255,255,255,.46); }

    .top, .title-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .top { margin-bottom: 17px; }
    .pill {
      padding: 6px 12px;
      border: 1px solid rgba(255,255,255,.30);
      border-radius: 999px;
      background: rgba(255,255,255,.10);
      color: rgba(255,255,255,.94);
      font-size: 12px;
      box-shadow: inset 0 1px rgba(255,255,255,.18);
    }
    .avatars { display: flex; align-items: center; padding-left: 8px; }
    .avatar {
      display: grid;
      width: 29px;
      height: 29px;
      margin-left: -8px;
      place-items: center;
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 50%;
      background: linear-gradient(135deg, #f8c79e, #a987c8 70%, #7267a9);
      color: #fff;
      font-size: 11px;
      box-shadow: 0 3px 10px rgba(18,12,36,.2);
    }
    .more { margin-left: 7px; color: rgba(255,255,255,.72); font-size: 12px; }

    .row { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .face {
      display: grid;
      flex: 0 0 48px;
      height: 48px;
      place-items: center;
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 50%;
      background: linear-gradient(145deg, rgba(255,225,194,.88), rgba(190,139,204,.78) 58%, rgba(111,133,201,.8));
      color: #fff;
      font-size: 19px;
      font-weight: 650;
      box-shadow: inset 0 1px 5px rgba(255,255,255,.5), 0 5px 15px rgba(15,12,35,.2);
    }
    .copy { flex: 1; min-width: 0; }
    .title-line { margin-bottom: 5px; }
    .title-line strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    time, .preview { color: rgba(255,255,255,.72); font-size: 12px; }
    .preview { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .unread { flex: 0 0 auto; color: #d8d2ff; font-size: 12px; font-weight: 600; }

    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .card { background: rgba(43,35,68,.88); }
    }
    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <header class="heading">
      <p class="eyebrow">LIQUID GLASS</p>
      <h1>通知</h1>
      <p class="hint">轻一点的消息，也有自己的光。</p>
    </header>

    <section class="card">
      <div class="top">
        <span class="pill">群聊</span>
        <div class="avatars" aria-label="群聊成员">
          <i class="avatar">林</i><i class="avatar">乔</i><i class="avatar">安</i>
          <span class="more">+8</span>
        </div>
      </div>
      <div class="row">
        <div class="face">林</div>
        <div class="copy">
          <div class="title-line"><strong>周末计划</strong><time>19:16</time></div>
          <div class="preview">有人分享了一张新的路线图</div>
        </div>
        <span class="unread">4 条未读</span>
      </div>
    </section>

    <section class="card">
      <div class="top">
        <span class="pill">消息</span>
        <div class="avatars" aria-label="联系人">
          <i class="avatar">怀</i><i class="avatar">＋</i>
        </div>
      </div>
      <div class="row">
        <div class="face">怀</div>
        <div class="copy">
          <div class="title-line"><strong>怀思</strong><time>08:41</time></div>
          <div class="preview">我找到一家看起来不错的咖啡店。</div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
