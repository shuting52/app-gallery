<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>晨雾提及</title>
<style>*{box-sizing:border-box}
body{min-height:100vh;margin:0;padding:44px 18px 60px;color:#2c3a4a;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:radial-gradient(ellipse at 15% 20%, rgba(200,215,230,.90), transparent 36%),radial-gradient(ellipse at 85% 35%, rgba(180,200,220,.80), transparent 38%),radial-gradient(ellipse at 55% 90%, rgba(170,190,210,.85), transparent 40%),linear-gradient(150deg,#f4f7fa,#e6edf3 55%,#dde6ee);background-attachment:fixed}
main{width:min(440px,100%);margin:0 auto;display:grid;gap:18px}
.heading{padding:4px 6px 8px}
.eyebrow{margin:0 0 8px;color:#2c3a4aD;font-size:11px;letter-spacing:.18em}
h1{margin:0;font-size:30px;letter-spacing:-.04em}
.hint{margin:7px 0 0;color:#2c3a4aD}
.card{position:relative;isolation:isolate;overflow:hidden;padding:18px;border:1px solid rgba(255,255,255,.75);border-radius:28px;
background:linear-gradient(135deg,rgba(255,255,255,.60),rgba(255,255,255,.28) 48%,rgba(190,210,230,.32));-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
box-shadow:inset 0 1px 0 rgba(255,255,255,.80),inset 0 -1px 0 rgba(255,255,255,.08),0 20px 48px rgba(8,8,24,.28);
transition:transform .25s ease,border-color .25s ease}
.card::before{content:"";position:absolute;z-index:0;inset:0;border-radius:inherit;pointer-events:none;opacity:.8;
background:linear-gradient(112deg,rgba(255,255,255,.60) 0%,rgba(255,255,255,.20) 20%,transparent 45%,transparent 70%,rgba(160,190,215,.32) 100%)}
.card::after{content:"";position:absolute;z-index:0;top:-60px;right:-46px;width:195px;height:132px;border:1px solid rgba(255,255,255,.70);border-radius:50%;
background:radial-gradient(ellipse,rgba(255,255,255,.42),transparent 68%);filter:blur(2px);transform:rotate(-24deg);pointer-events:none}
.card>*{position:relative;z-index:1}
.card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.75)H}
.top,.title-line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top{margin-bottom:17px}
.pill{padding:6px 12px;border:1px solid rgba(47,109,163,.35);border-radius:999px;background:rgba(47,109,163,.10);color:#2c3a4a;font-size:12px;box-shadow:inset 0 1px rgba(255,255,255,.18);white-space:nowrap}
.avatars{display:flex;align-items:center;padding-left:8px}
.avatar{display:grid;width:29px;height:29px;margin-left:-8px;place-items:center;border:1px solid rgba(255,255,255,.85);border-radius:50%;color:#fff;font-size:11px;box-shadow:0 3px 10px rgba(18,12,36,.2)}
.more{margin-left:7px;color:#2c3a4aD;font-size:12px}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row.rev{flex-direction:row-reverse;text-align:right}
.row.rev .copy .title-line{flex-direction:row-reverse}
.face{display:grid;flex:0 0 48px;height:48px;place-items:center;border:1px solid rgba(255,255,255,.70);border-radius:50%;color:#fff;font-size:19px;font-weight:650;box-shadow:inset 0 1px 5px rgba(255,255,255,.5),0 5px 15px rgba(15,12,35,.2)}
.copy{flex:1;min-width:0}
.title-line{margin-bottom:5px}
.title-line strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
time,.preview{color:#2c3a4aD;font-size:12px}
.preview{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unread{flex:0 0 auto;color:#2f6da3;font-size:12px;font-weight:600;white-space:nowrap}
.actions{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:10px 0;border:0;border-radius:14px;font-size:13px;font-weight:600;cursor:pointer;color:#fff;background:linear-gradient(135deg,#3f8ac2,#2f6da3);box-shadow:0 6px 18px linear-gradient(135deg,#3f8ac2,#2f6da3)S}
.btn.ghost{background:linear-gradient(135deg,#3f8ac2,#2f6da3)G;color:#2c3a4a;border:1px solid rgba(255,255,255,.75)}
.thumb{flex:0 0 52px;width:52px;height:52px;border-radius:14px;border:1px solid rgba(255,255,255,.75);background:#2c3a4aHBG}
.voice{display:flex;align-items:center;gap:3px;height:34px;padding:0 12px;border-radius:12px;background:rgba(47,109,163,.08);border:1px solid rgba(255,255,255,.75)}
.voice i{width:3px;border-radius:2px;background:#2f6da3;animation:wv 1.1s ease-in-out infinite}
@keyframes wv{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.livedot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff4d6d;margin-right:6px;box-shadow:0 0 8px #ff4d6d;animation:blk 1.4s ease-in-out infinite}
@keyframes blk{50%{transform:scale(1.4)}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)){.card{background:rgba(235,240,246,.95)}}
@media (prefers-reduced-motion:reduce){.card{transition:none}.voice i{animation:none}}</style>
</head>
<body>
<main>
<header class="heading">
<p class="eyebrow">MIST · MENTIONS</p>
<h1>晨雾提及</h1>
<p class="hint">有人在雾里喊你的名字。</p>
</header>
<section class="card"><div class="top"><span class="pill">@提及</span><div class="avatars"><i class="avatar" style="background:linear-gradient(145deg,#7fb2d9,#3f7fb0)">星</i></div></div><div class="row"><div class="face" style="background:linear-gradient(145deg,#7fb2d9,#3f7fb0)">星</div><div class="copy"><div class="title-line"><strong>星野</strong><time>09:56</time></div><div class="preview">在「周末去哪」中提到了你</div></div><span class="unread">@我</span></div></section>
<section class="card"><div class="top"><span class="pill">@提及</span><div class="avatars"><i class="avatar" style="background:linear-gradient(145deg,#9fc8e0,#5a8fb8)">林</i></div></div><div class="row rev"><div class="face" style="background:linear-gradient(145deg,#9fc8e0,#5a8fb8)">林</div><div class="copy"><div class="title-line"><strong>林晚</strong><time>08:20</time></div><div class="preview">在评论中提到了你：快看这个</div></div><span class="unread">@我</span></div></section>
<section class="card"><div class="top"><span class="pill">@提及</span><div class="avatars"><i class="avatar" style="background:linear-gradient(145deg,#6c9fc8,#2f5f8a)">澈</i></div></div><div class="row"><div class="face" style="background:linear-gradient(145deg,#6c9fc8,#2f5f8a)">澈</div><div class="copy"><div class="title-line"><strong>阿澈</strong><time>昨天</time></div><div class="preview">在「旅行计划」中提到了你</div></div><time>已读</time></div></section>
</main>
</body>
</html>
