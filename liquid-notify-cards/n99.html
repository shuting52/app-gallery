<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>淡墨生宣</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  position:relative;
  padding:48px 18px 64px;
  color:#2b2620;
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  background:linear-gradient(150deg,#fbfaf6,#f4f1e9 60%,#ece8db);
  background-attachment:fixed;
  overflow-x:hidden;
}
.bg{
  position:fixed;inset:-6%;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 40% 30% at 16% 20%, rgba(170,160,145,.25), transparent 70%),radial-gradient(ellipse 42% 32% at 84% 34%, rgba(150,160,175,.22), transparent 70%),radial-gradient(ellipse 50% 36% at 55% 88%, rgba(160,150,135,.18), transparent 70%);
  animation:drift 30s ease-in-out infinite alternate;
  animation-delay:-15s;
}
@keyframes drift{
  from{transform:translate3d(-1.5%,-1%,0) scale(1.03) rotate(0deg)}
  to{transform:translate3d(1.5%,1.5%,0) scale(1.07) rotate(1.5deg)}
}
main{position:relative;z-index:1;width:min(440px,100%);margin:0 auto;display:grid;gap:18px}
.heading{padding:4px 6px 8px}
.eyebrow{margin:0 0 8px;color:rgba(60,52,40,.66);font-size:11px;letter-spacing:.18em}
h1{margin:0;font-size:30px;letter-spacing:-.02em;color:#2b2620}
.hint{margin:7px 0 0;color:rgba(60,52,40,.66)}
.card{
  position:relative;isolation:isolate;overflow:hidden;
  padding:18px;border-radius:28px;
  border:1px solid rgba(60,50,35,.22);
  background:none,linear-gradient(135deg, rgba(255,255,255,.6), rgba(255,255,255,.32) 48%, rgba(235,228,214,.4));
  -webkit-backdrop-filter:blur(24px) saturate(175%);
  backdrop-filter:blur(24px) saturate(175%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.65),
    inset 0 -1px 0 rgba(0,0,0,.06),
    0 20px 48px rgba(100,90,70,.14);
  transition:transform .25s ease,border-color .25s ease;
}
.card::before{
  content:"";position:absolute;z-index:0;inset:0;border-radius:inherit;pointer-events:none;
  background:
    linear-gradient(118deg,
      rgba(255,255,255,.75) 0%,
      rgba(255,255,255,.28) 18%,
      transparent 42%,
      transparent 72%,
      rgba(190,180,165,.28) 100%);
  opacity:.8;
  animation:sheen 9s ease-in-out infinite alternate;
  animation-delay:-4s;
}
@keyframes sheen{from{opacity:.55}to{opacity:.95}}
.card::after{
  content:"";position:absolute;z-index:0;
  top:-50px;right:-34px;width:165px;height:118px;
  border:1px solid rgba(120,100,70,.25);border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,255,255,.55),transparent 68%);
  filter:blur(2px);transform:rotate(-34pxot);pointer-events:none;
}
.card>*{position:relative;z-index:1}
.card:hover{transform:translateY(-3px);border-color:rgba(60,50,35,.4)}
.top,.title-line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top{margin-bottom:15px}
.pill{
  padding:6px 12px;border:1px solid rgba(60,50,35,.28);border-radius:999px;
  background:rgba(255,255,255,.5);color:rgba(50,42,30,.92);font-size:12px;
  box-shadow:inset 0 1px rgba(255,255,255,.65);white-space:nowrap;
}
.avatars{display:flex;align-items:center;padding-left:8px}
.avatar{
  display:grid;width:29px;height:29px;margin-left:-8px;place-items:center;
  border:1px solid rgba(255,255,255,.8);border-radius:50%;
  background:linear-gradient(135deg,#8a7a6a,#5d5a72 70%,#3f4456);
  color:#fff;font-size:11px;font-style:normal;
  box-shadow:0 3px 10px rgba(10,8,18,.25);
}
.more{margin-left:7px;color:rgba(60,52,40,.66);font-size:12px}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.face{
  display:grid;flex:0 0 48px;height:48px;place-items:center;
  border:1px solid rgba(255,255,255,.7);border-radius:50%;
  background:#6a7285;color:#fff;font-size:19px;font-weight:650;
  box-shadow:inset 0 1px 5px rgba(255,255,255,.45),0 5px 15px rgba(10,8,20,.22);
}
.copy{flex:1;min-width:0}
.title-line{margin-bottom:5px}
.title-line strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#2b2620}
time,.preview{color:rgba(60,52,40,.66);font-size:12px}
.preview{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unread{flex:0 0 auto;color:#a33b2a;font-size:12px;font-weight:600;white-space:nowrap}
.dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:#8a7a5a;box-shadow:0 0 8px #8a7a5a}
.actions{display:flex;gap:10px;margin-top:14px}
.btn{
  flex:1;padding:10px 0;text-align:center;border-radius:14px;font-size:13px;cursor:pointer;
  border:1px solid rgba(60,50,35,.22);background:rgba(255,255,255,.55);color:rgba(50,42,30,.9);
  box-shadow:inset 0 1px rgba(255,255,255,.65);
}
.btn.pri{background:linear-gradient(135deg,#6a6558,#4a463c);border-color:rgba(100,95,85,.45);color:#fff}
.prog{height:8px;border-radius:5px;background:rgba(80,75,65,.12);margin-top:12px;overflow:hidden}
.prog i{display:block;height:100%;width:0%;border-radius:5px;background:linear-gradient(90deg,#8a8474,#5f5a4e)}
.pmeta{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:rgba(60,52,40,.66)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .card{background:rgba(245,240,228,.94)}
}
@media (prefers-reduced-motion:reduce){.card,.bg,.card::before{animation:none;transition:none}}
</style>
</head>
<body>
<div class="bg"></div>
<main>
<header class="heading">
<p class="eyebrow">LIQUID GLASS · 淡</p>
<h1>淡墨生宣</h1>
<p class="hint">淡到极处，消息自有回甘。</p>
</header>

<section class="card">
  <div class="top">
    <span class="pill">读书</span>
    <div class="avatars" aria-label="members"><i class="avatar">读</i></div>
  </div>
  <div class="row">
    <div class="face" style="background:linear-gradient(145deg,#8a8474,#5f5a4e 60%,#443f35)">读</div>
    <div class="copy">
      <div class="title-line"><strong>微信读书</strong><time>22:10</time></div>
      <div class="preview">《长安的荔枝》已读到 62%</div>
    </div>
    <span class="unread"></span>
  </div>
  <div class="prog"><i style="width:62%"></i></div><div class="pmeta"><span>阅读进度</span><span>62%</span></div>
</section>

<section class="card">
  <div class="top">
    <span class="pill">专注</span>
    <div class="avatars" aria-label="members"><i class="avatar">汐</i></div>
  </div>
  <div class="row">
    <div class="face" style="background:linear-gradient(145deg,#7a8a96,#525c66 60%,#3a4048)">汐</div>
    <div class="copy">
      <div class="title-line"><strong>潮汐</strong><time>21:00</time></div>
      <div class="preview">今日已专注 25 分钟，继续保持</div>
    </div>
    <span class="unread"></span>
  </div>
  
</section>

<section class="card">
  <div class="top">
    <span class="pill">备忘</span>
    <div class="avatars" aria-label="members"><i class="avatar">记</i></div>
  </div>
  <div class="row">
    <div class="face" style="background:linear-gradient(145deg,#9a8a72,#6e6452 60%,#4e483a)">记</div>
    <div class="copy">
      <div class="title-line"><strong>提醒事项</strong><time>明天</time></div>
      <div class="preview">记得给阳台的兰花浇水</div>
    </div>
    <span class="unread"></span>
  </div>
  
</section>
</main>
</body>
</html>
