<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>w29 · 邀请有礼</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;background:#05070c;display:flex;justify-content:center;color:#fff;overflow:hidden}
.stage{width:430px;height:900px;position:relative;overflow:hidden;flex-shrink:0;background:radial-gradient(120% 90% at 50% 0%,#1a2450 0%,#111638 55%,#0b0e16 100%)}
.mock{position:absolute;inset:0;filter:blur(6px) brightness(.55)}
.sb{height:46px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:13px;font-weight:600}
.sic{width:70px;height:12px;border-radius:6px;background:#2a3040}
.mh{display:flex;align-items:center;gap:10px;padding:14px 20px}
.mh i{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#2c3a72,#1d2549);display:block}
.mh em{width:110px;height:14px;border-radius:7px;background:#26305c;display:block}
.banner{height:150px;margin:6px 20px 14px;border-radius:18px;background:linear-gradient(135deg,#232f68,#161d44)}
.row{display:flex;gap:12px;align-items:center;margin:0 20px 12px}
.row i{width:52px;height:52px;border-radius:14px;background:#26305c;display:block;flex-shrink:0}
.row b{display:block;width:150px;height:13px;border-radius:6px;background:#303c74;margin-bottom:8px}
.row s{display:block;width:100px;height:10px;border-radius:5px;background:#202852;text-decoration:none}
.tabbar{position:absolute;bottom:0;left:0;right:0;height:84px;background:rgba(17,22,56,.9);display:flex;justify-content:space-around;align-items:center;border-top:1px solid #26305c}
.tabbar i{width:26px;height:26px;border-radius:8px;background:#303c74;display:block}
.ov{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(7,10,26,.55);animation:fadeIn .4s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:330px;border-radius:26px;padding:32px 26px 28px;text-align:center;position:relative;background:linear-gradient(165deg,#242e6e,#131740);border:1px solid rgba(150,170,255,.3);box-shadow:0 30px 80px rgba(0,0,0,.55);animation:pop .55s cubic-bezier(.2,1.4,.4,1) both;animation-delay:.12s}
@keyframes pop{from{opacity:0;transform:scale(.7) translateY(30px)}to{opacity:1;transform:none}}
.x{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:15px;cursor:pointer;z-index:3}
.codebox{display:flex;gap:8px;justify-content:center;margin:18px 0 6px}
.codebox span{width:40px;height:52px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(150,170,255,.35);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#cdd8ff;animation:flip .5s both}
.codebox span:nth-child(1){animation-delay:.3s}.codebox span:nth-child(2){animation-delay:.38s}
.codebox span:nth-child(3){animation-delay:.46s}.codebox span:nth-child(4){animation-delay:.54s}
.codebox span:nth-child(5){animation-delay:.62s}.codebox span:nth-child(6){animation-delay:.7s}
@keyframes flip{from{opacity:0;transform:rotateX(90deg)}to{opacity:1;transform:none}}
h2{font-size:21px;margin:12px 0 6px}
p.sub{font-size:13px;color:#a9b8e8;line-height:1.7}
.steps{display:flex;margin-top:16px;gap:6px;text-align:center}
.steps div{flex:1;font-size:11px;color:#8f9cd0}
.steps div b{display:flex;align-items:center;justify-content:center;width:34px;height:34px;margin:0 auto 6px;border-radius:50%;background:rgba(150,170,255,.12);border:1px solid rgba(150,170,255,.3);font-size:16px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:18px;background:linear-gradient(180deg,#9db4ff,#5a76f0);color:#fff;box-shadow:0 8px 22px rgba(110,130,250,.45)}
.btn:active{transform:scale(.97)}
.btn.ok{background:linear-gradient(180deg,#7de8a8,#2fbf71)}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:rgba(20,26,50,.95);border:1px solid rgba(150,170,255,.4);color:#cdd8ff;font-size:13px;border-radius:999px;padding:10px 20px;opacity:0;transition:all .3s;z-index:30;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.replay{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:20;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:10px 22px;font-size:13px;cursor:pointer;backdrop-filter:blur(8px)}
</style></head>
<body><div class="stage">
<div class="mock"><div class="sb"><span>9:41</span><span class="sic"></span></div>
<div class="mh"><i></i><em></em></div><div class="banner"></div>
<div class="row"><i></i><div><b></b><s></s></div></div>
<div class="row"><i></i><div><b></b><s></s></div></div>
<div class="tabbar"><i></i><i></i><i></i><i></i></div></div>
<div class="ov" id="ov"><div class="modal">
<button class="x" id="x">✕</button>
<h2>邀请有礼</h2>
<p class="sub">你的专属邀请码已生成<br>好友填写后双方各得 50 积分</p>
<div class="codebox" id="codebox"><span>A</span><span>8</span><span>K</span><span>2</span><span>M</span><span>9</span></div>
<div class="steps"><div><b>📤</b>分享邀请码</div><div><b>👥</b>好友注册</div><div><b>🎁</b>双方得礼</div></div>
<button class="btn" id="copy">复制邀请码</button>
</div>
<div class="toast" id="toast">邀请码已复制，去分享吧 ✦</div>
</div>
<button class="replay" id="replay">重新弹出</button>
</div>
<script>
const ov=document.getElementById('ov'),copy=document.getElementById('copy'),toast=document.getElementById('toast');
let tt;
copy.onclick=()=>{const code='A8K2M9';
const done=()=>{copy.textContent='已复制 ✓';copy.classList.add('ok');
toast.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('show'),1600);};
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code).then(done).catch(()=>done());}
else{const ta=document.createElement('textarea');ta.value=code;document.body.appendChild(ta);ta.select();
try{document.execCommand('copy');}catch(e){}ta.remove();done();}};
document.getElementById('x').onclick=()=>ov.style.display='none';
document.getElementById('replay').onclick=()=>{ov.style.display='flex';copy.textContent='复制邀请码';copy.classList.remove('ok');
const m=ov.querySelector('.modal');m.style.animation='none';void m.offsetWidth;m.style.animation='';};
</script></body></html>
