<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>w20 · 每日签到</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;background:#05070c;display:flex;justify-content:center;color:#fff;overflow:hidden}
.stage{width:430px;height:900px;position:relative;overflow:hidden;flex-shrink:0;background:radial-gradient(120% 90% at 50% 0%,#1b2350 0%,#10132a 55%,#0b0e16 100%)}
.mock{position:absolute;inset:0;filter:blur(6px) brightness(.55)}
.sb{height:46px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:13px;font-weight:600}
.sic{width:70px;height:12px;border-radius:6px;background:#2a3040}
.mh{display:flex;align-items:center;gap:10px;padding:14px 20px}
.mh i{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#3b4370,#232847);display:block}
.mh em{width:110px;height:14px;border-radius:7px;background:#262c4a;display:block}
.banner{height:150px;margin:6px 20px 14px;border-radius:18px;background:linear-gradient(135deg,#2a3160,#1a2040)}
.row{display:flex;gap:12px;align-items:center;margin:0 20px 12px}
.row i{width:52px;height:52px;border-radius:14px;background:#262c4a;display:block;flex-shrink:0}
.row b{display:block;width:150px;height:13px;border-radius:6px;background:#2f3760;margin-bottom:8px}
.row s{display:block;width:100px;height:10px;border-radius:5px;background:#232847;text-decoration:none}
.tabbar{position:absolute;bottom:0;left:0;right:0;height:84px;background:rgba(16,20,40,.9);display:flex;justify-content:space-around;align-items:center;border-top:1px solid #262c4a}
.tabbar i{width:26px;height:26px;border-radius:8px;background:#2f3760;display:block}
.ov{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(5,7,18,.5);animation:fadeIn .4s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:340px;border-radius:26px;padding:30px 24px 26px;text-align:center;position:relative;background:linear-gradient(165deg,#232a55,#141832);border:1px solid rgba(140,160,255,.3);box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 50px rgba(90,110,255,.18);animation:pop .55s cubic-bezier(.2,1.4,.4,1) both;animation-delay:.12s}
@keyframes pop{from{opacity:0;transform:scale(.7) translateY(30px)}to{opacity:1;transform:none}}
.x{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:15px;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:20px 0 6px}
.day{aspect-ratio:1;border-radius:12px;background:rgba(255,255,255,.06);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:#8b93b8;position:relative;border:1px solid transparent}
.day b{font-size:13px;color:#c6cdf2;margin-top:2px}
.day.done{background:rgba(92,220,150,.14);border-color:rgba(92,220,150,.5);color:#5cdc96}
.day.done b{color:#5cdc96}
.day.done::after{content:"✓";position:absolute;top:-7px;right:-5px;width:20px;height:20px;border-radius:50%;background:#2fbf71;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;animation:stamp .4s cubic-bezier(.2,1.8,.4,1) both}
.day.today{border-color:#8ca0ff;box-shadow:0 0 14px rgba(140,160,255,.4);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 24px rgba(140,160,255,.75)}}
@keyframes stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.day.today.signed{background:rgba(92,220,150,.14);border-color:rgba(92,220,150,.5);animation:none}
.day.today.signed::after{content:"✓";position:absolute;top:-7px;right:-5px;width:20px;height:20px;border-radius:50%;background:#2fbf71;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;animation:stamp .45s cubic-bezier(.2,1.8,.4,1) both}
.float{position:absolute;left:50%;top:38%;font-size:22px;font-weight:800;color:#5cdc96;opacity:0;pointer-events:none}
.float.go{animation:rise 1.1s ease-out both}
@keyframes rise{0%{opacity:0;transform:translate(-50%,10px)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-70px)}}
h2{font-size:21px;margin:4px 0 6px}
p.sub{font-size:13px;color:#a7aed6;line-height:1.7}
.streak{display:inline-block;margin-top:10px;font-size:12px;color:#ffd98a;background:rgba(255,217,138,.12);border:1px solid rgba(255,217,138,.35);border-radius:999px;padding:6px 14px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:18px;background:linear-gradient(180deg,#8ca0ff,#5a6ef0);color:#fff;box-shadow:0 8px 22px rgba(90,110,240,.4)}
.btn:active{transform:scale(.97)}
.btn:disabled{background:#3a4060;color:#8b93b8;box-shadow:none;cursor:default}
.replay{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:20;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:10px 22px;font-size:13px;cursor:pointer;backdrop-filter:blur(8px)}
</style></head>
<body><div class="stage">
<div class="mock"><div class="sb"><span>9:41</span><span class="sic"></span></div>
<div class="mh"><i></i><em></em></div><div class="banner"></div>
<div class="row"><i></i><div><b></b><s></s></div></div>
<div class="row"><i></i><div><b></b><s></s></div></div>
<div class="tabbar"><i></i><i></i><i></i><i></i></div></div>
<div class="ov" id="ov"><div class="modal">
<button class="x" id="x">✕</button>
<span class="float" id="float">+10 积分</span>
<h2>每日签到</h2>
<p class="sub">坚持打卡，连续 7 天可解锁<br>神秘宝箱奖励</p>
<div class="cal" id="cal"></div>
<div class="streak">🔥 已连续签到 6 天</div>
<button class="btn" id="sign">立即签到</button>
</div></div>
<button class="replay" id="replay">重新弹出</button>
</div>
<script>
const names=['一','二','三','四','五','六','日'],cal=document.getElementById('cal');
names.forEach((n,i)=>{const d=document.createElement('div');
d.className='day'+(i<6?' done':' today');d.id=i===6?'today':'';
d.innerHTML='周'+n+'<b>'+(i+1)+'</b>';cal.appendChild(d);});
const sign=document.getElementById('sign'),today=document.getElementById('today'),float=document.getElementById('float');
sign.onclick=()=>{today.classList.add('signed');sign.disabled=true;sign.textContent='今日已签到';
float.classList.remove('go');void float.offsetWidth;float.classList.add('go');
document.querySelector('.streak').textContent='🔥 已连续签到 7 天 · 宝箱解锁！';};
const ov=document.getElementById('ov');
document.getElementById('x').onclick=()=>ov.style.display='none';
document.getElementById('replay').onclick=()=>{ov.style.display='flex';
const m=ov.querySelector('.modal');m.style.animation='none';void m.offsetWidth;m.style.animation='';};
</script></body></html>
