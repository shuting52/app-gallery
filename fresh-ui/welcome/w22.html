<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>w22 · 权限罗盘</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;background:#05070c;display:flex;justify-content:center;color:#fff;overflow:hidden}
.stage{width:430px;height:900px;position:relative;overflow:hidden;flex-shrink:0;background:radial-gradient(120% 90% at 50% 0%,#0d3230 0%,#0a1d1e 55%,#0b0e16 100%)}
.mock{position:absolute;inset:0;filter:blur(6px) brightness(.55)}
.sb{height:46px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:13px;font-weight:600}
.sic{width:70px;height:12px;border-radius:6px;background:#2a3040}
.mh{display:flex;align-items:center;gap:10px;padding:14px 20px}
.mh i{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#1f4a48,#14302f);display:block}
.mh em{width:110px;height:14px;border-radius:7px;background:#1d3837;display:block}
.banner{height:150px;margin:6px 20px 14px;border-radius:18px;background:linear-gradient(135deg,#14403e,#0e2a29)}
.row{display:flex;gap:12px;align-items:center;margin:0 20px 12px}
.row i{width:52px;height:52px;border-radius:14px;background:#1d3837;display:block;flex-shrink:0}
.row b{display:block;width:150px;height:13px;border-radius:6px;background:#26504e;margin-bottom:8px}
.row s{display:block;width:100px;height:10px;border-radius:5px;background:#1a3231;text-decoration:none}
.tabbar{position:absolute;bottom:0;left:0;right:0;height:84px;background:rgba(10,26,26,.9);display:flex;justify-content:space-around;align-items:center;border-top:1px solid #1d3837}
.tabbar i{width:26px;height:26px;border-radius:8px;background:#26504e;display:block}
.rings{position:absolute;inset:0;z-index:4;pointer-events:none;display:flex;align-items:center;justify-content:center}
.rings i{position:absolute;border-radius:50%;border:1px dashed rgba(94,234,212,.25);display:block;animation:spin linear infinite}
.rings i:nth-child(1){width:360px;height:360px;animation-duration:26s}
.rings i:nth-child(2){width:280px;height:280px;animation-duration:-20s;border-color:rgba(94,234,212,.18)}
@keyframes spin{to{transform:rotate(360deg)}}
.ov{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(4,14,14,.55);animation:fadeIn .4s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:330px;border-radius:26px;padding:30px 24px 26px;text-align:center;position:relative;background:linear-gradient(165deg,#123a38,#0b2221);border:1px solid rgba(94,234,212,.3);box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 50px rgba(45,212,191,.15);animation:pop .55s cubic-bezier(.2,1.4,.4,1) both;animation-delay:.12s}
@keyframes pop{from{opacity:0;transform:scale(.7) translateY(30px)}to{opacity:1;transform:none}}
.x{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:15px;cursor:pointer}
.prow{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.05);border:1px solid rgba(94,234,212,.18);border-radius:16px;padding:12px 14px;margin-top:10px;text-align:left}
.prow .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;background:rgba(94,234,212,.12)}
.prow .tx{flex:1}
.prow .tx b{font-size:14px;display:block}
.prow .tx span{font-size:11px;color:#8fb8b5}
.sw{position:relative;width:52px;height:30px;border-radius:15px;background:#3a4552;cursor:pointer;transition:background .25s;flex-shrink:0;border:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .25s}
.sw.on{background:#2dd4bf}
.sw.on::after{left:25px}
h2{font-size:21px;margin:4px 0 6px}
p.sub{font-size:13px;color:#9fc4c1;line-height:1.7}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:20px;background:linear-gradient(180deg,#5eead4,#14b8a6);color:#06302b;box-shadow:0 8px 22px rgba(45,212,191,.35)}
.btn:active{transform:scale(.97)}
.replay{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:20;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:10px 22px;font-size:13px;cursor:pointer;backdrop-filter:blur(8px)}
</style></head>
<body><div class="stage">
<div class="mock"><div class="sb"><span>9:41</span><span class="sic"></span></div>
<div class="mh"><i></i><em></em></div><div class="banner"></div>
<div class="row"><i></i><div><b></b><s></s></div></div>
<div class="row"><i></i><div><b></b><s></s></div></div>
<div class="tabbar"><i></i><i></i><i></i><i></i></div></div>
<div class="rings"><i></i><i></i></div>
<div class="ov" id="ov"><div class="modal">
<button class="x" id="x">✕</button>
<h2>开启完整体验</h2>
<p class="sub">授予以下权限，解锁全部功能<br>可随时在设置中更改</p>
<div class="prow"><span class="ic">📷</span><div class="tx"><b>相机</b><span>扫码 / 拍照识物</span></div><button class="sw on" data-k="c"></button></div>
<div class="prow"><span class="ic">📍</span><div class="tx"><b>定位</b><span>附近服务推荐</span></div><button class="sw" data-k="l"></button></div>
<div class="prow"><span class="ic">🔔</span><div class="tx"><b>通知</b><span>重要消息提醒</span></div><button class="sw on" data-k="n"></button></div>
<button class="btn" id="go">进入应用</button>
</div></div>
<button class="replay" id="replay">重新弹出</button>
</div>
<script>
document.querySelectorAll('.sw').forEach(s=>s.onclick=()=>s.classList.toggle('on'));
const ov=document.getElementById('ov');
document.getElementById('go').onclick=()=>ov.style.display='none';
document.getElementById('x').onclick=()=>ov.style.display='none';
document.getElementById('replay').onclick=()=>{ov.style.display='flex';
const m=ov.querySelector('.modal');m.style.animation='none';void m.offsetWidth;m.style.animation='';};
</script></body></html>
