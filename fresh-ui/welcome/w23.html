<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>w23 · 功能导览</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;background:#05070c;display:flex;justify-content:center;color:#fff;overflow:hidden}
.stage{width:430px;height:900px;position:relative;overflow:hidden;flex-shrink:0;background:radial-gradient(120% 90% at 50% 0%,#12294f 0%,#0d1830 55%,#0b0e16 100%)}
.mock{position:absolute;inset:0;filter:blur(6px) brightness(.55)}
.sb{height:46px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:13px;font-weight:600}
.sic{width:70px;height:12px;border-radius:6px;background:#2a3040}
.mh{display:flex;align-items:center;gap:10px;padding:14px 20px}
.mh i{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#2b4a80,#1b2f55);display:block}
.mh em{width:110px;height:14px;border-radius:7px;background:#243b66;display:block}
.banner{height:150px;margin:6px 20px 14px;border-radius:18px;background:linear-gradient(135deg,#1e3a6e,#14264c)}
.row{display:flex;gap:12px;align-items:center;margin:0 20px 12px}
.row i{width:52px;height:52px;border-radius:14px;background:#243b66;display:block;flex-shrink:0}
.row b{display:block;width:150px;height:13px;border-radius:6px;background:#2e4c80;margin-bottom:8px}
.row s{display:block;width:100px;height:10px;border-radius:5px;background:#1e3358;text-decoration:none}
.tabbar{position:absolute;bottom:0;left:0;right:0;height:84px;background:rgba(13,24,48,.9);display:flex;justify-content:space-around;align-items:center;border-top:1px solid #243b66}
.tabbar i{width:26px;height:26px;border-radius:8px;background:#2e4c80;display:block}
.ov{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(5,10,24,.55);animation:fadeIn .4s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:340px;border-radius:26px;padding:26px 22px 24px;position:relative;background:linear-gradient(165deg,#1a2f5e,#101c3a);border:1px solid rgba(120,160,255,.3);box-shadow:0 30px 80px rgba(0,0,0,.55);animation:pop .55s cubic-bezier(.2,1.4,.4,1) both;animation-delay:.12s;overflow:hidden}
@keyframes pop{from{opacity:0;transform:scale(.7) translateY(30px)}to{opacity:1;transform:none}}
.x{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:15px;cursor:pointer;z-index:2}
.view{overflow:hidden;border-radius:16px}
.track{display:flex;transition:transform .45s cubic-bezier(.3,1.1,.4,1)}
.slide{width:296px;flex-shrink:0;text-align:center;padding:26px 18px 22px}
.slide .big{width:96px;height:96px;margin:0 auto 16px;border-radius:28px;display:flex;align-items:center;justify-content:center;font-size:46px;background:linear-gradient(135deg,rgba(120,160,255,.25),rgba(120,160,255,.06));border:1px solid rgba(120,160,255,.35);box-shadow:0 0 30px rgba(110,140,255,.25)}
.slide h3{font-size:19px;margin-bottom:8px}
.slide p{font-size:13px;color:#a9bce8;line-height:1.7}
.dots{display:flex;gap:8px;justify-content:center;margin:16px 0 4px}
.dots i{width:8px;height:8px;border-radius:4px;background:#3a4c7e;display:block;transition:all .3s}
.dots i.on{width:26px;background:#7ea2ff}
.nav{display:flex;gap:10px;margin-top:14px}
.nav button{flex:1;border-radius:14px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;border:0}
#prev{background:rgba(255,255,255,.1);color:#cdd9f7}
#next{background:linear-gradient(180deg,#7ea2ff,#4a6fe0);color:#fff;box-shadow:0 8px 20px rgba(90,120,240,.4)}
.nav button:active{transform:scale(.97)}
.replay{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:20;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:10px 22px;font-size:13px;cursor:pointer;backdrop-filter:blur(8px)}
</style></head>
<body><div class="stage">
<div class="mock"><div class="sb"><span>9:41</span><span class="sic"></span></div>
<div class="mh"><i></i><em></em></div><div class="banner"></div>
<div class="row"><i></i><div><b></b><s></s></div></div>
<div class="row"><i></i><div><b></b><s></s></div></div>
<div class="tabbar"><i></i><i></i><i></i><i></i></div></div>
<div class="ov" id="ov"><div class="modal">
<button class="x" id="x">✕</button>
<div class="view"><div class="track" id="track">
<div class="slide"><div class="big">⚡</div><h3>极速直达</h3><p>常用功能一键触达<br>告别层层寻找的操作路径</p></div>
<div class="slide"><div class="big">🧠</div><h3>智能推荐</h3><p>读懂你的使用习惯<br>把需要的内容推到眼前</p></div>
<div class="slide"><div class="big">🛡️</div><h3>隐私护航</h3><p>本地加密存储<br>你的数据只属于你自己</p></div>
</div></div>
<div class="dots" id="dots"><i class="on"></i><i></i><i></i></div>
<div class="nav"><button id="prev">上一步</button><button id="next">下一步</button></div>
</div></div>
<button class="replay" id="replay">重新弹出</button>
</div>
<script>
const track=document.getElementById('track'),dots=[...document.querySelectorAll('#dots i')],
prev=document.getElementById('prev'),next=document.getElementById('next'),ov=document.getElementById('ov');
let idx=0;const W=296;
function go(i){idx=Math.max(0,Math.min(2,i));track.style.transform='translateX('+(-idx*W)+'px)';
dots.forEach((d,k)=>d.classList.toggle('on',k===idx));
prev.style.visibility=idx===0?'hidden':'visible';
next.textContent=idx===2?'立即体验':'下一步';}
prev.onclick=()=>go(idx-1);
next.onclick=()=>{if(idx===2)ov.style.display='none';else go(idx+1);};
document.getElementById('x').onclick=()=>ov.style.display='none';
document.getElementById('replay').onclick=()=>{ov.style.display='flex';go(0);
const m=ov.querySelector('.modal');m.style.animation='none';void m.offsetWidth;m.style.animation='';};
go(0);
</script></body></html>
