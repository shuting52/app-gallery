<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>w21 · 新人礼盒</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;background:#05070c;display:flex;justify-content:center;color:#fff;overflow:hidden}
.stage{width:430px;height:900px;position:relative;overflow:hidden;flex-shrink:0;background:radial-gradient(120% 90% at 50% 0%,#2c1445 0%,#170d28 55%,#0b0e16 100%)}
.mock{position:absolute;inset:0;filter:blur(6px) brightness(.55)}
.sb{height:46px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:13px;font-weight:600}
.sic{width:70px;height:12px;border-radius:6px;background:#2a3040}
.mh{display:flex;align-items:center;gap:10px;padding:14px 20px}
.mh i{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#4a3568,#2c1e42);display:block}
.mh em{width:110px;height:14px;border-radius:7px;background:#322647;display:block}
.banner{height:150px;margin:6px 20px 14px;border-radius:18px;background:linear-gradient(135deg,#3c2560,#241640)}
.row{display:flex;gap:12px;align-items:center;margin:0 20px 12px}
.row i{width:52px;height:52px;border-radius:14px;background:#322647;display:block;flex-shrink:0}
.row b{display:block;width:150px;height:13px;border-radius:6px;background:#3d2f5c;margin-bottom:8px}
.row s{display:block;width:100px;height:10px;border-radius:5px;background:#2a2040;text-decoration:none}
.tabbar{position:absolute;bottom:0;left:0;right:0;height:84px;background:rgba(22,14,38,.9);display:flex;justify-content:space-around;align-items:center;border-top:1px solid #322647}
.tabbar i{width:26px;height:26px;border-radius:8px;background:#3d2f5c;display:block}
.ov{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(10,6,20,.55);animation:fadeIn .4s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:330px;border-radius:26px;padding:32px 26px 28px;text-align:center;position:relative;background:linear-gradient(165deg,#33205c,#1c1236);border:1px solid rgba(200,150,255,.35);box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 60px rgba(150,100,255,.2);animation:pop .55s cubic-bezier(.2,1.4,.4,1) both;animation-delay:.12s}
@keyframes pop{from{opacity:0;transform:scale(.7) translateY(30px)}to{opacity:1;transform:none}}
.x{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:15px;cursor:pointer;z-index:4}
.gift{width:170px;height:150px;margin:8px auto 0;position:relative}
.glow{position:absolute;left:50%;bottom:18px;width:120px;height:120px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,220,130,.85),rgba(255,180,80,.25) 55%,transparent 70%);opacity:0;transition:opacity .5s}
.gift.open .glow{opacity:1;animation:glowpulse 1.4s ease-in-out infinite}
@keyframes glowpulse{50%{transform:translateX(-50%) scale(1.15)}}
.box{position:absolute;bottom:0;left:15px;width:140px;height:96px;border-radius:10px;background:linear-gradient(180deg,#8b5cf6,#6d3ff0);box-shadow:0 12px 26px rgba(0,0,0,.4)}
.box::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:22px;transform:translateX(-50%);background:linear-gradient(180deg,#ffd98a,#e8a93d)}
.lid{position:absolute;bottom:88px;left:7px;width:156px;height:36px;border-radius:10px;background:linear-gradient(180deg,#a377ff,#7c4df5);box-shadow:0 8px 18px rgba(0,0,0,.35);transition:transform .6s cubic-bezier(.3,1.3,.4,1),opacity .5s;z-index:2}
.lid::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:22px;transform:translateX(-50%);background:linear-gradient(180deg,#ffe9b0,#e8a93d)}
.lid::after{content:"";position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:44px;height:22px;border:9px solid #e8a93d;border-bottom:0;border-radius:24px 24px 0 0}
.gift.open .lid{transform:translateY(-130px) rotate(-18deg);opacity:0}
.items{position:absolute;bottom:30px;left:0;right:0;display:flex;justify-content:center;gap:8px;opacity:0;transform:translateY(20px);transition:all .5s .25s}
.gift.open .items{opacity:1;transform:none}
.items span{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:22px;backdrop-filter:blur(4px)}
h2{font-size:21px;margin:16px 0 6px}
p.sub{font-size:13px;color:#c3b3e8;line-height:1.7}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:20px;background:linear-gradient(180deg,#c4a8ff,#8b5cf6);color:#fff;box-shadow:0 8px 22px rgba(139,92,246,.45)}
.btn:active{transform:scale(.97)}
.replay{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:20;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:10px 22px;font-size:13px;cursor:pointer;backdrop-filter:blur(8px)}
</style></head>
<body><div class="stage">
<div class="mock"><div class="sb"><span>9:41</span><span class="sic"></span></div>
<div class="mh"><i></i><em></em></div><div class="banner"></div>
<div class="row"><i></i><div><b></b><s></s></div></div>
<div class="row"><i></i><div><b></b><s></s></div></div>
<div class="tabbar"><i></i><i></i><i></i><i></i></div></div>
<div class="ov" id="ov"><div class="modal">
<button class="x" id="x">✕</button>
<div class="gift" id="gift"><div class="glow"></div><div class="box"></div><div class="lid"></div>
<div class="items"><span>🎟️</span><span>💎</span><span>🎁</span></div></div>
<h2>新人礼盒</h2>
<p class="sub">见面礼已备好：7 天会员体验<br>200 积分 + 专属头像框</p>
<button class="btn" id="open">开启礼盒</button>
</div></div>
<button class="replay" id="replay">重新弹出</button>
</div>
<script>
const gift=document.getElementById('gift'),open=document.getElementById('open'),ov=document.getElementById('ov');
let opened=false;
open.onclick=()=>{if(!opened){opened=true;gift.classList.add('open');open.textContent='收下全部礼物';}
else{ov.style.display='none';}};
document.getElementById('x').onclick=()=>ov.style.display='none';
document.getElementById('replay').onclick=()=>{ov.style.display='flex';opened=false;gift.classList.remove('open');open.textContent='开启礼盒';
const m=ov.querySelector('.modal');m.style.animation='none';void m.offsetWidth;m.style.animation='';};
</script></body></html>
