<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>升空之旅</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000}
body{width:430px;height:900px;margin:0 auto;position:relative;overflow:hidden;
font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:#fff}

body{background:linear-gradient(#ffd9a8 0%,#ffc4c4 45%,#bfe0ff 100%)}
.balloon{position:absolute;left:50%;top:170px;transform:translateX(-50%);z-index:3;
animation:bob 5s ease-in-out infinite;animation-delay:-2.4s}
@keyframes bob{50%{transform:translateX(-50%) translateY(-34px)}}
.env{width:190px;height:230px;margin:0 auto;border-radius:50% 50% 48% 48% / 58% 58% 42% 42%;
background:linear-gradient(90deg,#e8546e 0 20%,#fff 20% 40%,#e8546e 40% 60%,#fff 60% 80%,#e8546e 80%);
box-shadow:inset -18px -20px 40px rgba(120,20,40,.25)}
.ropes{width:120px;height:56px;margin:0 auto;
background:linear-gradient(105deg,transparent 46%,#7a5c42 46% 54%,transparent 54%),
linear-gradient(75deg,transparent 46%,#7a5c42 46% 54%,transparent 54%)}
.basket{width:74px;height:56px;margin:0 auto;background:linear-gradient(#a07a52,#7a5a3c);border-radius:8px 8px 14px 14px}
.cloud{position:absolute;background:rgba(255,255,255,.92);border-radius:40px;animation:drift 20s linear infinite;z-index:2}
.cloud.c1{width:140px;height:42px;top:420px;animation-delay:-8s}
.cloud.c2{width:110px;height:34px;top:600px;animation-duration:28s;animation-delay:-20s}
@keyframes drift{from{transform:translateX(-180px)}to{transform:translateX(560px)}}
.bird{position:absolute;font-size:20px;color:#4a5a70;animation:fly 12s linear infinite;z-index:2}
@keyframes fly{from{transform:translateX(-60px) translateY(0)}to{transform:translateX(520px) translateY(-60px)}}

.brand{position:absolute;left:0;right:0;bottom:150px;text-align:center;z-index:20;
animation:brandIn 1.1s cubic-bezier(.2,.7,.3,1.2) .9s both}
.brand h1{font-size:36px;letter-spacing:10px;font-weight:800;text-shadow:0 4px 24px rgba(0,0,0,.45)}
.brand p{margin-top:12px;font-size:13px;letter-spacing:6px;opacity:.75}
@keyframes brandIn{from{opacity:0;transform:translateY(26px) scale(.94)}}
.replay{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);z-index:30;
background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;
border-radius:24px;padding:10px 26px;font-size:13px;letter-spacing:2px;cursor:pointer;
backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body>
<div id="st">
<div class="cloud c1"></div><div class="cloud c2"></div>
<div class="bird" style="top:200px;animation-delay:-3s">﹏</div>
<div class="bird" style="top:260px;animation-delay:-8s;font-size:16px">﹏</div>
<div class="balloon"><div class="env"></div><div class="ropes"></div><div class="basket"></div></div>
</div>
<div class="brand"><h1>升空之旅</h1><p>UP & AWAY</p></div>
<button class="replay" onclick="var s=document.getElementById('st');var c=s.cloneNode(true);s.replaceWith(c);">重新播放</button>
</body></html>
