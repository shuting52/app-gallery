<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星轨罗盘</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#04060f;display:flex;justify-content:center;font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;overflow:hidden}
.stage{width:430px;height:900px;max-height:100vh;position:relative;overflow:hidden;background:radial-gradient(90% 70% at 50% 40%,#0b1430 0%,#04060f 70%)}
.star{position:absolute;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.compass{position:absolute;left:50%;top:130px;width:420px;height:420px;margin-left:-210px}
.ring{position:absolute;border-radius:50%;left:50%;top:50%}
.ring.r1{width:400px;height:400px;margin:-200px;background:repeating-conic-gradient(rgba(255,212,120,.8) 0 1.5deg,transparent 1.5deg 15deg);-webkit-mask:radial-gradient(closest-side,transparent 93%,#000 94%);mask:radial-gradient(closest-side,transparent 93%,#000 94%);animation:spin 40s linear -12s infinite}
.ring.r2{width:320px;height:320px;margin:-160px;background:repeating-conic-gradient(rgba(140,200,255,.7) 0 1deg,transparent 1deg 30deg);-webkit-mask:radial-gradient(closest-side,transparent 92%,#000 93%);mask:radial-gradient(closest-side,transparent 92%,#000 93%);animation:spinR 30s linear -8s infinite}
.ring.r3{width:230px;height:230px;margin:-115px;border:1px solid rgba(255,212,120,.35);animation:spin 24s linear -5s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinR{to{transform:rotate(-360deg)}}
.nstar{position:absolute;left:50%;top:118px;width:26px;height:26px;margin-left:-13px;background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);filter:drop-shadow(0 0 12px #ffd478);animation:tw 2s ease-in-out -1s infinite}
.needle{position:absolute;left:50%;top:50%;width:10px;height:150px;margin:-150px 0 0 -5px;transform-origin:50% 100%;animation:swing 3.2s cubic-bezier(.3,.8,.3,1.2) .6s both}
@keyframes swing{from{transform:rotate(-200deg);opacity:0}to{transform:rotate(24deg);opacity:1}}
.needle::before{content:"";position:absolute;top:0;left:0;border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:70px solid #ff5d5d}
.needle::after{content:"";position:absolute;bottom:0;left:0;border-left:5px solid transparent;border-right:5px solid transparent;border-top:70px solid #e8eef7}
.hub{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#2a3a63,#101a38 70%);border:2px solid rgba(255,212,120,.6);box-shadow:0 0 44px rgba(255,212,120,.35);display:flex;align-items:center;justify-content:center;animation:pop 1.1s cubic-bezier(.2,1.4,.4,1) 1s both}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
.hub span{font-size:44px;font-weight:800;color:#ffd478;letter-spacing:4px}
.brand{position:absolute;left:0;right:0;bottom:180px;text-align:center;animation:up 1.2s ease 1.6s both}
.brand h1{font-size:50px;letter-spacing:16px;text-indent:16px;color:#f2ecd8;font-weight:800;text-shadow:0 0 26px rgba(255,212,120,.5)}
.brand p{margin-top:12px;font-size:13px;letter-spacing:7px;color:#8fa0c8}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.replay{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);z-index:50;padding:10px 26px;border-radius:999px;border:1px solid rgba(255,212,120,.55);background:rgba(255,212,120,.1);color:#f2ecd8;font-size:13px;letter-spacing:4px;text-indent:4px;cursor:pointer}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body><div class="stage">
<div class="compass"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
<div class="needle"></div><div class="hub"><span>罗盘</span></div></div>
<div class="nstar"></div>
<div class="brand"><h1>星轨罗盘</h1><p>星轨指引 不迷方向</p></div>
<button class="replay" onclick="location.reload()">重新播放</button>
</div>
<script>
(function(){var st=document.querySelector('.stage');
for(var i=0;i<40;i++){var s=document.createElement('div');s.className='star';
s.style.left=(6+Math.random()*418)+'px';s.style.top=(10+Math.random()*700)+'px';
var z=(1.5+Math.random()*2)+'px';s.style.width=s.style.height=z;
s.style.animationDelay=(-Math.random()*3).toFixed(2)+'s';st.appendChild(s);}})();
</script>
</div></body></html>
