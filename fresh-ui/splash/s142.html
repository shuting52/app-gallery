<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>珊瑚绽放</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overflow:hidden}
.stage{position:fixed;inset:0;overflow:hidden}
.brand{position:absolute;left:0;right:0;top:60%;text-align:center;z-index:30;animation:brandIn 1.1s cubic-bezier(.2,.7,.3,1.2) 1.7s both}
.brand h1{font-size:44px;letter-spacing:14px;text-indent:14px;font-weight:800}
.brand p{margin-top:12px;font-size:13px;letter-spacing:5px;opacity:.72}
@keyframes brandIn{from{opacity:0;transform:translateY(26px) scale(.94)}to{opacity:1;transform:none}}
.replay{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);z-index:40;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:10px 28px;font-size:13px;letter-spacing:3px;cursor:pointer;backdrop-filter:blur(6px)}
.replay.dk{border-color:rgba(0,0,0,.25);background:rgba(0,0,0,.08);color:#2a2a2a}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{transform:translateY(0);opacity:0}12%{opacity:1}to{transform:translateY(-340px) translateX(var(--dx,0px));opacity:0}}
@keyframes fall{to{transform:translateY(960px)}}
@keyframes sway{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes ringX{from{transform:translateX(-50%) scale(.5);opacity:.8}to{transform:translateX(-50%) scale(1.5);opacity:0}}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}

.stage{background:linear-gradient(#06283d,#0a4a63 70%,#0e5f7d)}
 .brand h1,.brand p{color:#fff}
.ray{position:absolute;top:-5%;left:30%;width:90px;height:70%;background:linear-gradient(rgba(160,220,255,.13),transparent);transform:skewX(-14deg);filter:blur(4px)}
.cor{position:absolute;bottom:0;left:50%;width:0;transform-origin:bottom center;animation:growC 3s ease .8s both}
@keyframes growC{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}
.brn{position:absolute;bottom:0;width:17px;background:linear-gradient(#ff9eb0,#ff5a7a);border-radius:9px;transform-origin:bottom center;box-shadow:0 0 14px rgba(255,120,150,.5)}
.fish{position:absolute;left:-60px;width:34px;height:20px;background:#ffd93d;clip-path:polygon(0 50%,70% 0,70% 35%,100% 35%,100% 65%,70% 65%,70% 100%);animation:swim linear infinite}
@keyframes swim{from{transform:translateX(0)}to{transform:translateX(560px)}}
</style></head>
<body><div class="stage">
<div class="ray r1"></div>
<div class="cor">
<span class="brn" style="left:-8px;height:150px;transform:rotate(0deg);animation-delay:1.0s"></span>
<span class="brn" style="left:-46px;height:110px;transform:rotate(-24deg);animation-delay:1.2s"></span>
<span class="brn" style="left:30px;height:110px;transform:rotate(24deg);animation-delay:1.4s"></span>
<span class="brn" style="left:-70px;height:80px;transform:rotate(-40deg);animation-delay:1.5s"></span>
<span class="brn" style="left:54px;height:80px;transform:rotate(40deg);animation-delay:1.6s"></span>
</div>
<span class="fish" style="top:20%;animation-delay:-0.0s;animation-duration:9.0s"></span>
<span class="fish" style="top:32%;animation-delay:-4.0s;animation-duration:12.0s"></span>
<span class="fish" style="top:48%;animation-delay:-7.0s;animation-duration:10.0s"></span>
<div class="brand"><h1>珊瑚</h1><p>海底的森林 悄然绽放</p></div>
<button class="replay">重新播放</button>
<script>
var tpl=document.body.innerHTML;
function bind(){document.querySelector('.replay').onclick=function(){document.body.innerHTML=tpl;bind();};}
bind();
</script>
</div></body></html>
