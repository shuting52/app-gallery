<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>气泡上浮</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#041a30;display:flex;justify-content:center;font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;overflow:hidden}
.stage{width:430px;height:900px;max-height:100vh;position:relative;overflow:hidden;background:linear-gradient(180deg,#0a3a63 0%,#062a4c 55%,#031a33 100%)}
.light{position:absolute;left:0;right:0;top:0;height:340px;background:linear-gradient(180deg,rgba(140,210,255,.35),transparent);animation:swayl 5s ease-in-out -2s infinite alternate}
@keyframes swayl{from{opacity:.5;transform:skewX(-4deg)}to{opacity:1;transform:skewX(4deg)}}
.bub{position:absolute;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.85),rgba(160,220,255,.12) 45%,rgba(120,200,255,.05));border:1.5px solid rgba(200,235,255,.4);animation:float 7s linear -3s infinite}
.bub::after{content:"";position:absolute;left:22%;top:16%;width:26%;height:18%;border-radius:50%;background:rgba(255,255,255,.9);filter:blur(1px)}
@keyframes float{from{transform:translateY(940px)}to{transform:translateY(-120px)}}
.bigwrap{position:absolute;left:50%;top:330px;width:190px;height:190px;margin-left:-95px;animation:risein 2s cubic-bezier(.2,.9,.3,1.1) .4s both}
@keyframes risein{from{transform:translateY(360px) scale(.7);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.bigbub{width:190px;height:190px;border-radius:50%;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.95),rgba(170,225,255,.25) 40%,rgba(120,200,255,.1) 70%);border:2px solid rgba(220,242,255,.65);box-shadow:0 0 60px rgba(140,210,255,.5),inset -14px -18px 40px rgba(90,160,220,.25);display:flex;align-items:center;justify-content:center;animation:bob 3.2s ease-in-out -1s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
.bigbub span{font-size:88px;font-weight:800;color:#0b3a63;text-shadow:0 2px 0 rgba(255,255,255,.7)}
.brand{position:absolute;left:0;right:0;bottom:180px;text-align:center;animation:up 1.2s ease 1.4s both}
.brand h1{font-size:52px;letter-spacing:20px;text-indent:20px;color:#eaf7ff;font-weight:800}
.brand p{margin-top:12px;font-size:13px;letter-spacing:7px;color:#8fc3e8}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.replay{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);z-index:50;padding:10px 26px;border-radius:999px;border:1px solid rgba(180,225,255,.55);background:rgba(140,210,255,.12);color:#eaf7ff;font-size:13px;letter-spacing:4px;text-indent:4px;cursor:pointer}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body><div class="stage">
<div class="light"></div>
<div class="bigwrap"><div class="bigbub"><span>泡</span></div></div>
<div class="brand"><h1>气泡</h1><p>轻盈 自有浮力</p></div>
<button class="replay" onclick="location.reload()">重新播放</button>
</div>
<script>
(function(){var st=document.querySelector('.stage');
var cfgs=[[40,26,7,-1],[120,40,9,-5],[200,18,6,-2],[290,52,11,-7],[350,30,8,-4],[80,16,5.5,-0.5],[250,22,6.5,-3.5],[160,34,8.5,-6]];
for(var i=0;i<cfgs.length;i++){var b=document.createElement('div');b.className='bub';
b.style.left=cfgs[i][0]+'px';var s=cfgs[i][1];b.style.width=b.style.height=s+'px';
b.style.animationDuration=cfgs[i][2]+'s';b.style.animationDelay=cfgs[i][3]+'s';
st.insertBefore(b,st.firstChild);}})();
</script>
</div></body></html>
