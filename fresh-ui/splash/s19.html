<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>墨海初潮</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#04090c;display:flex;justify-content:center;font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;overflow:hidden}
.stage{width:430px;height:900px;max-height:100vh;position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 110%,#0e2a33 0%,#071418 55%,#04090c 100%)}
.drop{position:absolute;left:50%;top:-40px;width:26px;height:26px;margin-left:-13px;border-radius:50% 50% 50% 4px;transform:rotate(45deg);background:radial-gradient(circle at 35% 30%,#3ddad7,#0e7c86);animation:fall 1.1s cubic-bezier(.5,0,.9,.4) .1s both}
@keyframes fall{to{top:470px;opacity:0}}
.ring{position:absolute;left:50%;top:470px;width:120px;height:34px;margin:-17px 0 0 -60px;border:2px solid rgba(61,218,215,.8);border-radius:50%;opacity:0;animation:rip 2.2s ease-out .9s both}
.ring.r2{animation-delay:1.25s}.ring.r3{animation-delay:1.6s}
@keyframes rip{0%{opacity:.9;transform:scale(.15)}100%{opacity:0;transform:scale(2.6)}}
.shimmer{position:absolute;left:0;right:0;top:500px;height:120px;background:linear-gradient(180deg,rgba(61,218,215,.14),transparent);filter:blur(6px);animation:shim 3.4s ease-in-out -1s infinite alternate}
@keyframes shim{from{opacity:.4;transform:translateX(-14px)}to{opacity:1;transform:translateX(14px)}}
.logo{position:absolute;left:0;right:0;top:560px;text-align:center;color:#eafcff;font-size:92px;font-weight:800;letter-spacing:18px;text-indent:18px;animation:ink 1.4s cubic-bezier(.2,.8,.3,1) 1s both;text-shadow:0 0 42px rgba(61,218,215,.55)}
@keyframes ink{from{opacity:0;filter:blur(16px);transform:scale(.82)}to{opacity:1;filter:blur(0);transform:scale(1)}}
.tag{position:absolute;left:0;right:0;top:690px;text-align:center;color:#7fb3b8;font-size:15px;letter-spacing:8px;text-indent:8px;animation:up 1.2s ease 1.7s both}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.ver{position:absolute;left:0;right:0;top:730px;text-align:center;color:#3d5a5e;font-size:11px;letter-spacing:3px}
.replay{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);z-index:50;padding:10px 26px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#dff6f7;font-size:13px;letter-spacing:4px;text-indent:4px;cursor:pointer}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body><div class="stage">
<div class="drop"></div><div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div>
<div class="shimmer"></div>
<div class="logo">墨</div><div class="tag">以墨为海 初心为潮</div><div class="ver">INK · V1.0</div>
<button class="replay" onclick="location.reload()">重新播放</button>
</div></body></html>
