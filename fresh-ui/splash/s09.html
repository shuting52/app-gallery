<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拼图归位 · 启动页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#080a10;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.stage{width:430px;height:900px;max-width:100vw;max-height:100vh;position:relative;overflow:hidden;
background:radial-gradient(100% 70% at 50% 25%,#141a2a 0%,#080a12 60%,#05060b 100%)}
.puzzle{position:absolute;left:50%;top:200px;width:324px;height:324px;margin-left:-162px;z-index:3}
.tile{position:absolute;width:100px;height:100px;border-radius:20px;display:flex;align-items:center;justify-content:center;
font-size:30px;font-weight:700;color:#cfd8f5;background:linear-gradient(145deg,#232c44,#161c2e);
border:1px solid rgba(140,160,220,.25);box-shadow:0 8px 24px rgba(0,0,0,.4);
left:var(--cx);top:var(--cy);opacity:0;transform:translate(var(--fx),var(--fy)) rotate(var(--rr)) scale(.6);
animation:flyin 1s cubic-bezier(.25,.9,.3,1.15) both;animation-delay:var(--dl)}
.tile::before{content:"";position:absolute;left:50%;top:-12px;width:30px;height:30px;margin-left:-15px;
border-radius:50%;background:inherit;border:1px solid rgba(140,160,220,.25);border-bottom:none}
@keyframes flyin{0%{opacity:0;transform:translate(var(--fx),var(--fy)) rotate(var(--rr)) scale(.6)}
100%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}}
.tile:nth-child(1){--cx:0px;--cy:0px;--fx:-260px;--fy:-180px;--rr:-40deg;--dl:.1s}
.tile:nth-child(2){--cx:112px;--cy:0px;--fx:60px;--fy:-320px;--rr:30deg;--dl:.22s}
.tile:nth-child(3){--cx:224px;--cy:0px;--fx:280px;--fy:-160px;--rr:-25deg;--dl:.34s}
.tile:nth-child(4){--cx:0px;--cy:112px;--fx:-300px;--fy:40px;--rr:35deg;--dl:.46s}
.tile:nth-child(5){--cx:112px;--cy:112px;--fx:0px;--fy:-380px;--rr:0deg;--dl:.7s;
background:linear-gradient(145deg,#ffd479,#f0a83e);color:#5e3c08;border-color:rgba(255,220,140,.6);
box-shadow:0 0 34px rgba(255,200,100,.45)}
.tile:nth-child(6){--cx:224px;--cy:112px;--fx:300px;--fy:60px;--rr:-30deg;--dl:.58s}
.tile:nth-child(7){--cx:0px;--cy:224px;--fx:-260px;--fy:280px;--rr:25deg;--dl:.7s}
.tile:nth-child(8){--cx:112px;--cy:224px;--fx:-40px;--fy:340px;--rr:-35deg;--dl:.82s}
.tile:nth-child(9){--cx:224px;--cy:224px;--fx:280px;--fy:300px;--rr:40deg;--dl:.94s}
.flash{position:absolute;left:50%;top:362px;width:120px;height:120px;margin:-60px 0 0 -60px;z-index:4;
border-radius:50%;background:radial-gradient(circle,rgba(255,220,140,.7),transparent 70%);opacity:0;
animation:flash .9s ease-out both;animation-delay:1.7s}
@keyframes flash{0%{opacity:0;transform:scale(.4)}40%{opacity:1}100%{opacity:0;transform:scale(1.8)}}
.brand{position:absolute;left:0;right:0;top:620px;text-align:center;z-index:6;
opacity:0;animation:fadeUp 1s ease-out both;animation-delay:1.9s}
.brand h1{font-size:36px;font-weight:700;letter-spacing:14px;color:#eef1fa;text-indent:14px}
.brand p{font-size:13px;letter-spacing:6px;color:#8b95b8;margin-top:12px;text-indent:6px}
@keyframes fadeUp{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:translateY(0)}}
.replay{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);z-index:50;
border:1px solid rgba(150,170,220,.35);background:rgba(150,170,220,.08);color:#c9d2e8;
font-size:13px;letter-spacing:3px;padding:10px 26px;border-radius:24px;cursor:pointer}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body>
<div class="stage">
  <div class="puzzle">
    <div class="tile">拼</div><div class="tile">图</div><div class="tile">有</div>
    <div class="tile">序</div><div class="tile">位</div><div class="tile">列</div>
    <div class="tile">成</div><div class="tile">章</div><div class="tile">法</div>
  </div>
  <div class="flash"></div>
  <div class="brand"><h1>归位</h1><p>每一块都有位置</p></div>
  <button class="replay">重新播放</button>
</div>
<script>
function bind(){document.querySelector('.replay').addEventListener('click',()=>{
const s=document.querySelector('.stage');const n=s.cloneNode(true);s.replaceWith(n);bind();});}
bind();
</script>
</body></html>
