<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>墨海生花 · 启动页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#05070c;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.stage{width:430px;height:900px;max-width:100vw;max-height:100vh;position:relative;overflow:hidden;
background:radial-gradient(circle at 50% 12%,#12242f 0%,#070d16 58%,#04070d 100%)}
.drop{position:absolute;left:50%;top:-30px;width:16px;height:26px;margin-left:-8px;z-index:5;
background:radial-gradient(circle at 35% 30%,#6ff5cb,#0e9f7a 70%);border-radius:50% 50% 60% 60%;
animation:drop 1s cubic-bezier(.5,0,.8,.4) both}
@keyframes drop{0%{transform:translateY(0) scale(1)}82%{transform:translateY(398px) scale(.92);opacity:1}
100%{transform:translateY(414px) scale(1.5,.35);opacity:0}}
.bloom{position:absolute;left:50%;top:310px;width:0;height:0;z-index:4}
.petal{position:absolute;left:-75px;top:-75px;width:150px;height:150px;border-radius:50%;display:block;
filter:blur(13px);opacity:0;transform:translate(var(--x),var(--y)) scale(0);
animation:bloom 1.7s cubic-bezier(.2,.7,.3,1.25) both;animation-delay:var(--dl)}
.petal:nth-child(1){--x:0px;--y:-100px;--dl:.72s;background:radial-gradient(circle,#2ef2c0 0%,rgba(46,242,192,0) 65%)}
.petal:nth-child(2){--x:95px;--y:-32px;--dl:.82s;background:radial-gradient(circle,#27d8f2 0%,rgba(39,216,242,0) 65%)}
.petal:nth-child(3){--x:59px;--y:81px;--dl:.92s;background:radial-gradient(circle,#2ef2c0 0%,rgba(46,242,192,0) 65%)}
.petal:nth-child(4){--x:-59px;--y:81px;--dl:1.02s;background:radial-gradient(circle,#7bffcf 0%,rgba(123,255,207,0) 65%)}
.petal:nth-child(5){--x:-95px;--y:-32px;--dl:1.12s;background:radial-gradient(circle,#27d8f2 0%,rgba(39,216,242,0) 65%)}
.petal:nth-child(6){--x:0px;--y:0px;--dl:.66s;background:radial-gradient(circle,#d8fff2 0%,rgba(216,255,242,0) 60%)}
@keyframes bloom{0%{opacity:0;transform:translate(var(--x),var(--y)) scale(0)}
55%{opacity:.9}100%{opacity:.5;transform:translate(var(--x),var(--y)) scale(1)}}
.core{position:absolute;left:50%;top:310px;width:130px;height:130px;margin:-65px 0 0 -65px;z-index:5;
border-radius:50%;background:radial-gradient(circle,rgba(216,255,242,.9) 0%,rgba(46,242,192,.25) 45%,transparent 70%);
filter:blur(6px);opacity:0;animation:core 1.4s ease-out both;animation-delay:.8s}
@keyframes core{0%{opacity:0;transform:scale(.3)}100%{opacity:.9;transform:scale(1.15)}}
.mark{position:absolute;left:50%;top:310px;width:104px;height:104px;margin:-52px 0 0 -52px;z-index:6;
border-radius:50%;border:2px solid rgba(110,245,203,.85);display:flex;align-items:center;justify-content:center;
font-size:44px;color:#d9fff1;background:rgba(6,14,18,.55);box-shadow:0 0 34px rgba(46,242,192,.35),inset 0 0 22px rgba(46,242,192,.18);
opacity:0;animation:pop 1s cubic-bezier(.2,.8,.3,1.4) both;animation-delay:1.9s}
@keyframes pop{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:scale(1)}}
.brand{position:absolute;left:0;right:0;top:600px;text-align:center;z-index:6;
opacity:0;animation:fadeUp 1s ease-out both;animation-delay:2.3s}
.brand h1{font-size:36px;font-weight:700;letter-spacing:14px;color:#eafff7;text-indent:14px}
.brand p{font-size:13px;letter-spacing:6px;color:#6fd8b6;margin-top:12px;text-indent:6px}
@keyframes fadeUp{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:translateY(0)}}
.replay{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);z-index:50;
border:1px solid rgba(110,245,203,.4);background:rgba(46,242,192,.08);color:#bff5e2;
font-size:13px;letter-spacing:3px;padding:10px 26px;border-radius:24px;cursor:pointer}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body>
<div class="stage">
  <div class="drop"></div>
  <div class="bloom">
    <i class="petal"></i><i class="petal"></i><i class="petal"></i>
    <i class="petal"></i><i class="petal"></i><i class="petal"></i>
  </div>
  <div class="core"></div>
  <div class="mark">屿</div>
  <div class="brand"><h1>墨屿</h1><p>一滴墨 · 开一世界</p></div>
  <button class="replay">重新播放</button>
</div>
<script>
function bind(){document.querySelector('.replay').addEventListener('click',()=>{
const s=document.querySelector('.stage');const n=s.cloneNode(true);s.replaceWith(n);bind();});}
bind();
</script>
</body></html>
