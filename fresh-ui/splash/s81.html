<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>彩虹飞桥</title><style>*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{width:430px;min-height:900px;margin:0 auto;position:relative;overflow:hidden;color:#fff;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;background:linear-gradient(180deg,#8ecae6 0%,#cfeefb 55%,#f4fbff 100%)}
#app{position:absolute;inset:0}
.brand{position:absolute;left:0;right:0;bottom:112px;text-align:center;z-index:10;opacity:0;transform:translateY(16px);animation:brandIn .9s cubic-bezier(.2,.7,.3,1.2) 2.3s both}
.brand h1{font-size:34px;letter-spacing:10px;font-weight:800;text-indent:10px}
.brand p{margin-top:10px;font-size:12px;letter-spacing:5px;opacity:.7;text-indent:5px}
@keyframes brandIn{to{opacity:1;transform:none}}
.tag{position:absolute;top:56px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:8px;text-indent:8px;opacity:0;z-index:10;animation:brandIn 1s ease 2.7s both;color:rgba(255,255,255,.65)}
.replay{position:absolute;left:50%;bottom:42px;transform:translateX(-50%);z-index:20;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:20px;padding:8px 24px;font-size:13px;letter-spacing:2px;cursor:pointer;backdrop-filter:blur(6px)}

.rb{position:absolute;left:50%;bottom:150px;width:560px;height:280px;margin-left:-280px}
.rb i{position:absolute;left:50%;bottom:0;display:block;border-radius:50%;border:16px solid transparent;border-bottom:0;transform:translateX(-50%) scaleY(0);transform-origin:bottom;animation:arc 1.6s ease-out both}
.rb i:nth-child(1){width:520px;height:260px;border-top-color:#ff5d5d;animation-delay:.2s}
.rb i:nth-child(2){width:456px;height:228px;border-top-color:#ff9f45;animation-delay:.35s}
.rb i:nth-child(3){width:392px;height:196px;border-top-color:#ffd93d;animation-delay:.5s}
.rb i:nth-child(4){width:328px;height:164px;border-top-color:#6fbf6f;animation-delay:.65s}
.rb i:nth-child(5){width:264px;height:132px;border-top-color:#5aa7e8;animation-delay:.8s}
.rb i:nth-child(6){width:200px;height:100px;border-top-color:#b678e2;animation-delay:.95s}
@keyframes arc{to{transform:translateX(-50%) scaleY(1)}}
.sun2{position:absolute;left:56px;top:110px;width:80px;height:80px;display:block;border-radius:50%;background:radial-gradient(circle,#fff8d6,#ffd93d 70%);box-shadow:0 0 50px #ffefa0;animation:sun 2s ease-out .2s both}
@keyframes sun{from{transform:scale(0)}to{transform:scale(1)}}
.drop{position:absolute;top:-20px;width:5px;height:16px;display:block;border-radius:40%;background:rgba(120,180,230,.7);animation:fall2 linear infinite}
@keyframes fall2{to{transform:translateY(700px);opacity:0}}
.hill{position:absolute;bottom:0;left:0;right:0;height:150px;background:radial-gradient(circle at 20% 130%,#6faf62,#3c7a44 70%)}
</style></head><body><div id="app"><div class="sun2"></div><div class="rb"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="hill"></div><i class="drop" style="left:244px;animation-delay:-2.14s;animation-duration:1.23s;"></i><i class="drop" style="left:321px;animation-delay:-1.08s;animation-duration:1.27s;"></i><i class="drop" style="left:215px;animation-delay:-3.92s;animation-duration:1.61s;"></i><i class="drop" style="left:100px;animation-delay:-2.30s;animation-duration:1.23s;"></i><i class="drop" style="left:286px;animation-delay:-2.73s;animation-duration:1.55s;"></i><i class="drop" style="left:294px;animation-delay:-5.27s;animation-duration:1.83s;"></i><i class="drop" style="left:398px;animation-delay:-5.11s;animation-duration:2.05s;"></i><i class="drop" style="left:270px;animation-delay:-5.62s;animation-duration:1.95s;"></i><i class="drop" style="left:320px;animation-delay:-4.60s;animation-duration:1.57s;"></i><i class="drop" style="left:199px;animation-delay:-0.26s;animation-duration:1.95s;"></i><i class="drop" style="left:217px;animation-delay:-3.29s;animation-duration:1.64s;"></i><i class="drop" style="left:61px;animation-delay:-0.02s;animation-duration:1.79s;"></i><i class="drop" style="left:149px;animation-delay:-3.81s;animation-duration:1.79s;"></i><i class="drop" style="left:151px;animation-delay:-5.31s;animation-duration:1.54s;"></i><i class="drop" style="left:152px;animation-delay:-3.16s;animation-duration:1.23s;"></i><i class="drop" style="left:337px;animation-delay:-5.35s;animation-duration:1.79s;"></i><i class="drop" style="left:147px;animation-delay:-0.19s;animation-duration:1.70s;"></i><i class="drop" style="left:371px;animation-delay:-0.54s;animation-duration:1.55s;"></i><i class="drop" style="left:261px;animation-delay:-4.85s;animation-duration:1.82s;"></i><i class="drop" style="left:12px;animation-delay:-2.42s;animation-duration:1.67s;"></i><i class="drop" style="left:388px;animation-delay:-2.35s;animation-duration:1.97s;"></i><i class="drop" style="left:187px;animation-delay:-1.29s;animation-duration:1.54s;"></i><i class="drop" style="left:272px;animation-delay:-5.17s;animation-duration:1.35s;"></i><i class="drop" style="left:387px;animation-delay:-3.39s;animation-duration:2.03s;"></i><div class="tag">RAINBOW</div><div class="brand"><h1>彩虹飞桥</h1><p>雨过天晴 · 虹销雨霁</p></div></div><button class="replay">&#8635; 重新播放</button><script>document.querySelector('.replay').onclick=function(){var a=document.getElementById('app');var c=a.cloneNode(true);a.replaceWith(c);};</script></body></html>
