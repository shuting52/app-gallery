<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雪夜归人</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000}
body{width:430px;height:900px;margin:0 auto;position:relative;overflow:hidden;
font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:#fff}

body{background:linear-gradient(#0a1226 0%,#101c3a 60%,#16244a 100%)}
.snow{position:absolute;inset:0;z-index:5}
.flk{position:absolute;top:-20px;border-radius:50%;background:#fff;opacity:.9;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(960px) translateX(40px)}}
.house{position:absolute;left:50%;bottom:170px;transform:translateX(-50%);z-index:3}
.house .bd{width:190px;height:130px;background:#0b0f1e;border:1px solid #232c4a}
.house .roof{width:0;height:0;margin:0 auto;border-left:115px solid transparent;border-right:115px solid transparent;
border-bottom:70px solid #1a2340}
.house .win{position:absolute;left:50%;top:96px;transform:translateX(-50%);width:52px;height:60px;
background:#ffca7a;box-shadow:0 0 44px 16px rgba(255,190,110,.6);animation:winW 4s ease-in-out infinite;animation-delay:-2s}
@keyframes winW{50%{box-shadow:0 0 60px 24px rgba(255,190,110,.75)}}
.snowcap{position:absolute;left:50%;bottom:288px;transform:translateX(-50%);width:250px;height:26px;
background:#e8f0ff;border-radius:50%;z-index:4}
.ground{position:absolute;left:0;right:0;bottom:0;height:180px;background:linear-gradient(#dfe8fa,#b9c8e8);z-index:2}
.print{position:absolute;bottom:60px;width:26px;height:40px;background:rgba(120,140,190,.5);border-radius:50%;
animation:fadeP 6s ease-in-out infinite}
@keyframes fadeP{0%,100%{opacity:.15}50%{opacity:.6}}
.moon{position:absolute;right:54px;top:70px;width:64px;height:64px;border-radius:50%;
background:radial-gradient(circle at 38% 35%,#fdfdf5,#d8dcf0 70%);box-shadow:0 0 40px 12px rgba(220,230,255,.35)}

.brand{position:absolute;left:0;right:0;bottom:150px;text-align:center;z-index:20;
animation:brandIn 1.1s cubic-bezier(.2,.7,.3,1.2) .9s both}
.brand h1{font-size:36px;letter-spacing:10px;font-weight:800;text-shadow:0 4px 24px rgba(0,0,0,.45)}
.brand p{margin-top:12px;font-size:13px;letter-spacing:6px;opacity:.75}
@keyframes brandIn{from{opacity:0;transform:translateY(26px) scale(.94)}}
.replay{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);z-index:30;
background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;
border-radius:24px;padding:10px 26px;font-size:13px;letter-spacing:2px;cursor:pointer;
backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body>
<div id="st">
<div class="moon"></div>
<div class="house"><div class="roof"></div><div class="bd"><div class="win"></div></div></div>
<div class="snowcap"></div><div class="ground"></div>
<div class="print" style="left:120px;animation-delay:-1s"></div>
<div class="print" style="left:170px;animation-delay:-2s"></div>
<div class="print" style="left:220px;animation-delay:-3s"></div>
<div class="print" style="left:270px;animation-delay:-4s"></div>
<div class="snow">
<span class="flk" style="left:30px;width:6px;height:6px;animation-duration:7s;animation-delay:-2s"></span>
<span class="flk" style="left:90px;width:4px;height:4px;animation-duration:5.5s;animation-delay:-4s"></span>
<span class="flk" style="left:160px;width:7px;height:7px;animation-duration:8s;animation-delay:-1s"></span>
<span class="flk" style="left:230px;width:5px;height:5px;animation-duration:6s;animation-delay:-5.5s"></span>
<span class="flk" style="left:300px;width:6px;height:6px;animation-duration:7.5s;animation-delay:-3s"></span>
<span class="flk" style="left:370px;width:4px;height:4px;animation-duration:5s;animation-delay:-.5s"></span>
<span class="flk" style="left:60px;width:5px;height:5px;animation-duration:6.5s;animation-delay:-6s"></span>
<span class="flk" style="left:200px;width:4px;height:4px;animation-duration:5.8s;animation-delay:-2.5s"></span>
<span class="flk" style="left:340px;width:7px;height:7px;animation-duration:8.2s;animation-delay:-4.5s"></span>
<span class="flk" style="left:130px;width:6px;height:6px;animation-duration:6.8s;animation-delay:-1.8s"></span>
</div>
</div>
<div class="brand"><h1>雪夜归人</h1><p>SNOWY NIGHT</p></div>
<button class="replay" onclick="var s=document.getElementById('st');var c=s.cloneNode(true);s.replaceWith(c);">重新播放</button>
</body></html>
