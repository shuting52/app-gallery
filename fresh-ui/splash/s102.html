<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>破茧成蝶</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000}
body{width:430px;height:900px;margin:0 auto;position:relative;overflow:hidden;
font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:#fff}

body{background:linear-gradient(#1a2b1a 0%,#243b26 55%,#2e4a2e 100%)}
.branch{position:absolute;left:0;right:0;top:190px;height:14px;background:linear-gradient(#5a4632,#3e3023);z-index:1}
.thread{position:absolute;left:50%;top:204px;width:3px;height:70px;transform:translateX(-50%);background:#cfc39a;z-index:1}
.cocoon{position:absolute;left:50%;top:270px;transform:translateX(-50%);width:110px;height:150px;z-index:2;
background:linear-gradient(135deg,#e8dfc0,#c9b98e);border-radius:50% 50% 48% 48% / 60% 60% 40% 40%;
animation:crack 5s ease-in-out infinite;transform-origin:50% 0}
@keyframes crack{0%,55%{transform:translateX(-50%) scale(1)}70%{transform:translateX(-50%) scale(1.06,.94)}
80%,100%{transform:translateX(-50%) scale(1);opacity:0}}
.bf{position:absolute;left:50%;top:300px;transform:translateX(-50%);z-index:3;opacity:0;
animation:emerge 5s ease-in-out infinite}
@keyframes emerge{0%,62%{opacity:0;transform:translateX(-50%) translateY(30px) scale(.4)}
78%{opacity:1;transform:translateX(-50%) translateY(-10px) scale(1)}
100%{opacity:1;transform:translateX(-50%) translateY(-190px) scale(1)}}
.wing{position:absolute;top:0;width:52px;height:72px;transform-origin:100% 50%;
background:linear-gradient(135deg,#ffb3d9,#e86aa8 60%,#b43a78);animation:flap .5s ease-in-out infinite}
.wing.l{left:-52px;border-radius:80% 20% 60% 40%}
.wing.r{right:-52px;transform-origin:0 50%;border-radius:20% 80% 40% 60%;animation-name:flapR}
@keyframes flap{50%{transform:scaleX(.25)}}
@keyframes flapR{50%{transform:scaleX(.25)}}
.bf .bd{width:12px;height:56px;margin:6px auto 0;background:#5a2c4a;border-radius:6px}
.glow{position:absolute;left:50%;top:300px;width:200px;height:200px;transform:translate(-50%,-50%);
background:radial-gradient(circle at 50% 50%,rgba(255,180,220,.35),transparent 65%);z-index:1;
animation:glowP 5s ease-in-out infinite}
@keyframes glowP{0%,60%{opacity:0}80%,100%{opacity:1}}
.leaf{position:absolute;width:70px;height:34px;background:#3f7a44;border-radius:50% 4px 50% 4px;z-index:0}

.brand{position:absolute;left:0;right:0;bottom:150px;text-align:center;z-index:20;
animation:brandIn 1.1s cubic-bezier(.2,.7,.3,1.2) .9s both}
.brand h1{font-size:36px;letter-spacing:10px;font-weight:800;text-shadow:0 4px 24px rgba(0,0,0,.45)}
.brand p{margin-top:12px;font-size:13px;letter-spacing:6px;opacity:.75}
@keyframes brandIn{from{opacity:0;transform:translateY(26px) scale(.94)}}
.replay{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);z-index:30;
background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;
border-radius:24px;padding:10px 26px;font-size:13px;letter-spacing:2px;cursor:pointer;
backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body>
<div id="st">
<div class="leaf" style="left:40px;top:120px;transform:rotate(-20deg)"></div>
<div class="leaf" style="right:50px;top:90px;transform:rotate(24deg)"></div>
<div class="branch"></div><div class="thread"></div><div class="cocoon"></div>
<div class="glow"></div>
<div class="bf"><div class="wing l"></div><div class="wing r"></div><div class="bd"></div></div>
</div>
<div class="brand"><h1>破茧成蝶</h1><p>METAMORPHOSIS</p></div>
<button class="replay" onclick="var s=document.getElementById('st');var c=s.cloneNode(true);s.replaceWith(c);">重新播放</button>
</body></html>
