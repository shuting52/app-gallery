<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>纸翼远航</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overflow:hidden}
.stage{position:fixed;inset:0;overflow:hidden}
.brand{position:absolute;left:0;right:0;top:60%;text-align:center;z-index:30;animation:brandIn 1.1s cubic-bezier(.2,.7,.3,1.2) 1.7s both}
.brand h1{font-size:44px;letter-spacing:14px;text-indent:14px;font-weight:800}
.brand p{margin-top:12px;font-size:13px;letter-spacing:5px;opacity:.72}
@keyframes brandIn{from{opacity:0;transform:translateY(26px) scale(.94)}to{opacity:1;transform:none}}
.replay{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);z-index:40;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:10px 28px;font-size:13px;letter-spacing:3px;cursor:pointer;backdrop-filter:blur(6px)}
.replay.dk{border-color:rgba(0,0,0,.25);background:rgba(0,0,0,.08);color:#2a2a2a}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{transform:translateY(0);opacity:0}12%{opacity:1}to{transform:translateY(-340px) translateX(var(--dx,0px));opacity:0}}
@keyframes fall{to{transform:translateY(960px)}}
@keyframes sway{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes ringX{from{transform:translateX(-50%) scale(.5);opacity:.8}to{transform:translateX(-50%) scale(1.5);opacity:0}}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}

.stage{background:linear-gradient(#6db9f2,#cfeefb 75%,#eaf7ff)}
 .brand h1{color:#2b2b33}.brand p{color:#5a5a66}
.plane{position:absolute;top:30%;left:-100px;width:96px;height:62px;background:#fff;clip-path:polygon(0 50%,100% 0,64% 50%,100% 100%);filter:drop-shadow(0 8px 10px rgba(30,80,140,.25));animation:fly 5.5s linear infinite}
@keyframes fly{from{transform:translate(0,26px) rotate(5deg)}to{transform:translate(600px,-70px) rotate(-5deg)}}
.trail{position:absolute;top:35%;left:0;width:100%;height:2px;background:repeating-linear-gradient(90deg,#ffffff 0 14px,transparent 14px 28px);opacity:.7}
.cl{position:absolute;background:#fff;border-radius:999px;opacity:.92;animation:driftC linear infinite}
@keyframes driftC{from{transform:translateX(-160px)}to{transform:translateX(600px)}}
.sun2{position:absolute;top:9%;right:12%;width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c8,#ffd93d);box-shadow:0 0 44px rgba(255,217,61,.8)}
</style></head>
<body><div class="stage">
<div class="trail"></div>
<span class="cl" style="top:21%;width:157px;height:33px;animation-delay:-6.7s;animation-duration:13.6s"></span>
<span class="cl" style="top:52%;width:133px;height:35px;animation-delay:-2.4s;animation-duration:15.8s"></span>
<span class="cl" style="top:11%;width:157px;height:42px;animation-delay:-7.0s;animation-duration:11.6s"></span>
<span class="cl" style="top:17%;width:158px;height:46px;animation-delay:-10.1s;animation-duration:11.7s"></span>
<span class="cl" style="top:24%;width:146px;height:31px;animation-delay:-1.2s;animation-duration:15.4s"></span>
<div class="plane"></div><div class="sun2"></div>
<div class="brand"><h1>纸翼</h1><p>折一只飞机 去看世界</p></div>
<button class="replay dk">重新播放</button>
<script>
var tpl=document.body.innerHTML;
function bind(){document.querySelector('.replay').onclick=function(){document.body.innerHTML=tpl;bind();};}
bind();
</script>
</div></body></html>
