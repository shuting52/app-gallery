<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>音浪脉动</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:430px;height:900px}
body{overflow:hidden;position:relative;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#0a0a14;color:#fff}
.stage{position:absolute;inset:0;overflow:hidden}
.brand{position:absolute;left:0;right:0;top:648px;text-align:center;z-index:5;animation:brandIn 1s ease 2s both}
.brand h1{font-size:36px;letter-spacing:10px;font-weight:800}
.brand p{font-size:13px;letter-spacing:6px;opacity:.65;margin-top:10px}
@keyframes brandIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.replay{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);z-index:9;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;font-size:13px;padding:9px 26px;border-radius:24px;cursor:pointer;backdrop-filter:blur(6px)}
.eq{position:absolute;left:50%;top:330px;transform:translate(-50%,-50%);display:flex;align-items:flex-end;gap:10px;height:220px}
.bar{width:22px;border-radius:11px;background:linear-gradient(#00f0ff,#7a5cff);animation:eq 1.1s ease-in-out infinite}
@keyframes eq{0%,100%{height:40px}50%{height:200px}}
.disc2{position:absolute;left:50%;top:330px;width:300px;height:300px;transform:translate(-50%,-50%);border-radius:50%;border:1px solid #ffffff22;animation:ringx 3s ease-out infinite}
@keyframes ringx{from{transform:translate(-50%,-50%) scale(.6);opacity:.8}to{transform:translate(-50%,-50%) scale(1.4);opacity:0}}
</style></head><body>
<div class="stage"><div class="eq"><div class="bar" style="animation-delay:-0.00s"></div><div class="bar" style="animation-delay:-0.13s"></div><div class="bar" style="animation-delay:-0.26s"></div><div class="bar" style="animation-delay:-0.39s"></div><div class="bar" style="animation-delay:-0.52s"></div><div class="bar" style="animation-delay:-0.65s"></div><div class="bar" style="animation-delay:-0.78s"></div><div class="bar" style="animation-delay:-0.91s"></div><div class="bar" style="animation-delay:-1.04s"></div><div class="bar" style="animation-delay:-1.17s"></div><div class="bar" style="animation-delay:-1.30s"></div><div class="bar" style="animation-delay:-1.43s"></div></div><div class="disc2" style="animation-delay:0s"></div><div class="disc2" style="animation-delay:-1.5s"></div></div>
<div class="brand"><h1>声场</h1><p>SOUNDWAVE · 律动</p></div>
<button class="replay" onclick="location.reload()">&#8635; 重新播放</button>
</body></html>
