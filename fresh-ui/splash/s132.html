<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>彩虹桥</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overflow:hidden}
.stage{position:fixed;inset:0;overflow:hidden}
.brand{position:absolute;left:0;right:0;top:60%;text-align:center;z-index:30;animation:brandIn 1.1s cubic-bezier(.2,.7,.3,1.2) 1.7s both}
.brand h1{font-size:44px;letter-spacing:14px;text-indent:14px;font-weight:800}
.brand p{margin-top:12px;font-size:13px;letter-spacing:5px;opacity:.72}
@keyframes brandIn{from{opacity:0;transform:translateY(26px) scale(.94)}to{opacity:1;transform:none}}
.replay{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);z-index:40;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:10px 28px;font-size:13px;letter-spacing:3px;cursor:pointer;backdrop-filter:blur(6px)}
.replay.dk{border-color:rgba(0,0,0,.25);background:rgba(0,0,0,.08);color:#2a2a2a}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{transform:translateY(0);opacity:0}12%{opacity:1}to{transform:translateY(-340px) translateX(var(--dx,0px));opacity:0}}
@keyframes fall{to{transform:translateY(960px)}}
@keyframes sway{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes ringX{from{transform:translateX(-50%) scale(.5);opacity:.8}to{transform:translateX(-50%) scale(1.5);opacity:0}}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}

.stage{background:linear-gradient(#fdf6ec,#e3f2fd)}
 .brand h1{color:#2b2b33}.brand p{color:#5a5a66}
.rb{position:absolute;bottom:-30px;left:50%;width:420px;height:230px;margin-left:-210px}
.arc{position:absolute;left:50%;bottom:0;transform:translateX(-50%);border-radius:999px 999px 0 0;border:15px solid;animation:arcIn 1.6s ease both;transform-origin:bottom center}
@keyframes arcIn{from{transform:translateX(-50%) scaleY(0);opacity:0}to{transform:translateX(-50%) scaleY(1);opacity:1}}
.sun3{position:absolute;top:10%;right:14%;width:66px;height:66px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#ffce3d);box-shadow:0 0 36px rgba(255,206,61,.75);animation:hover 6s ease-in-out infinite}
.hill{position:absolute;bottom:-90px;left:-10%;width:120%;height:200px;background:#9fd6a4;border-radius:50% 50% 0 0}
</style></head>
<body><div class="stage">
<div class="sun3"></div><div class="rb">
<span class="arc" style="width:400px;height:200px;border-color:#ff6b6b transparent transparent transparent;animation-delay:0.90s"></span>
<span class="arc" style="width:368px;height:184px;border-color:#ffa94d transparent transparent transparent;animation-delay:1.04s"></span>
<span class="arc" style="width:336px;height:168px;border-color:#ffd93d transparent transparent transparent;animation-delay:1.18s"></span>
<span class="arc" style="width:304px;height:152px;border-color:#7ddf8a transparent transparent transparent;animation-delay:1.32s"></span>
<span class="arc" style="width:272px;height:136px;border-color:#5aa9ff transparent transparent transparent;animation-delay:1.46s"></span>
<span class="arc" style="width:240px;height:120px;border-color:#b18cff transparent transparent transparent;animation-delay:1.60s"></span>
</div><div class="hill"></div>
<div class="brand"><h1>虹桥</h1><p>风雨之后 自有彩虹</p></div>
<button class="replay dk">重新播放</button>
<script>
var tpl=document.body.innerHTML;
function bind(){document.querySelector('.replay').onclick=function(){document.body.innerHTML=tpl;bind();};}
bind();
</script>
</div></body></html>
