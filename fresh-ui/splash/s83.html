<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>火山苏醒</title><style>*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{width:430px;min-height:900px;margin:0 auto;position:relative;overflow:hidden;color:#fff;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;background:linear-gradient(180deg,#12060a 0%,#2b0f14 55%,#0b0406 100%)}
#app{position:absolute;inset:0}
.brand{position:absolute;left:0;right:0;bottom:112px;text-align:center;z-index:10;opacity:0;transform:translateY(16px);animation:brandIn .9s cubic-bezier(.2,.7,.3,1.2) 2.3s both}
.brand h1{font-size:34px;letter-spacing:10px;font-weight:800;text-indent:10px}
.brand p{margin-top:10px;font-size:12px;letter-spacing:5px;opacity:.7;text-indent:5px}
@keyframes brandIn{to{opacity:1;transform:none}}
.tag{position:absolute;top:56px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:8px;text-indent:8px;opacity:0;z-index:10;animation:brandIn 1s ease 2.7s both;color:rgba(255,255,255,.65)}
.replay{position:absolute;left:50%;bottom:42px;transform:translateX(-50%);z-index:20;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:20px;padding:8px 24px;font-size:13px;letter-spacing:2px;cursor:pointer;backdrop-filter:blur(6px)}

.volc{position:absolute;bottom:120px;left:50%;width:380px;height:300px;margin-left:-190px;background:linear-gradient(180deg,#3a1c22,#170a0d);clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);animation:rise5 1.6s ease-out .3s both}
@keyframes rise5{from{transform:translateY(320px)}to{transform:none}}
.volc .lava{position:absolute;top:-6px;left:50%;width:120px;height:26px;margin-left:-60px;background:radial-gradient(circle,#ffd76e,#ff5a1a 60%,transparent 75%);border-radius:50%;animation:lava 1.8s ease-in-out -0.6s infinite}
@keyframes lava{50%{transform:scaleX(1.25);opacity:.85}}
.ember{position:absolute;bottom:400px;width:9px;height:9px;display:block;border-radius:50%;background:radial-gradient(circle,#ffe08a,#ff6a1a 65%);animation:erupt ease-out infinite}
@keyframes erupt{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--x,40px),-460px) scale(.3);opacity:0}}
.smoke{position:absolute;bottom:430px;left:50%;width:60px;height:60px;margin-left:-30px;display:block;border-radius:50%;background:rgba(120,110,115,.35);filter:blur(10px);animation:smk 5s ease-out infinite}
@keyframes smk{from{transform:translateY(0) scale(.6);opacity:.7}to{transform:translateY(-260px) scale(1.8);opacity:0}}
.flow{position:absolute;bottom:120px;left:50%;width:26px;height:250px;margin-left:-13px;background:linear-gradient(180deg,#ff8a2a,#c22e0e);filter:blur(3px);border-radius:12px;animation:flowdn 2.6s ease-in-out 1s both;transform-origin:top}
@keyframes flowdn{from{transform:scaleY(0)}to{transform:scaleY(1)}}
</style></head><body><div id="app"><div class="volc"><div class="lava"></div></div><div class="flow"></div><i class="ember" style="left:246px;animation-duration:3.2s;animation-delay:-1.2s;--x:-42px"></i><i class="ember" style="left:246px;animation-duration:2.9s;animation-delay:-0.3s;--x:-55px"></i><i class="ember" style="left:169px;animation-duration:3.4s;animation-delay:-0.7s;--x:105px"></i><i class="ember" style="left:171px;animation-duration:3.3s;animation-delay:-1.1s;--x:-111px"></i><i class="ember" style="left:202px;animation-duration:3.0s;animation-delay:-0.8s;--x:11px"></i><i class="ember" style="left:158px;animation-duration:3.0s;animation-delay:-1.0s;--x:-101px"></i><i class="ember" style="left:174px;animation-duration:3.3s;animation-delay:-2.7s;--x:55px"></i><i class="ember" style="left:220px;animation-duration:2.6s;animation-delay:-1.6s;--x:-105px"></i><i class="ember" style="left:209px;animation-duration:2.4s;animation-delay:-1.6s;--x:82px"></i><i class="ember" style="left:261px;animation-duration:3.3s;animation-delay:-0.3s;--x:107px"></i><i class="ember" style="left:192px;animation-duration:3.3s;animation-delay:-1.2s;--x:24px"></i><i class="ember" style="left:166px;animation-duration:2.7s;animation-delay:-2.0s;--x:-66px"></i><i class="ember" style="left:155px;animation-duration:2.3s;animation-delay:-1.1s;--x:-18px"></i><i class="ember" style="left:243px;animation-duration:2.4s;animation-delay:-1.6s;--x:-104px"></i><i class="ember" style="left:231px;animation-duration:2.8s;animation-delay:-1.5s;--x:-17px"></i><i class="ember" style="left:266px;animation-duration:2.8s;animation-delay:-0.6s;--x:-61px"></i><i class="ember" style="left:261px;animation-duration:3.1s;animation-delay:-1.2s;--x:53px"></i><i class="ember" style="left:227px;animation-duration:2.9s;animation-delay:-0.9s;--x:7px"></i><i class="ember" style="left:279px;animation-duration:3.1s;animation-delay:-2.9s;--x:102px"></i><i class="ember" style="left:173px;animation-duration:3.5s;animation-delay:-0.6s;--x:40px"></i><i class="ember" style="left:189px;animation-duration:3.5s;animation-delay:-0.3s;--x:2px"></i><i class="ember" style="left:183px;animation-duration:2.9s;animation-delay:-0.5s;--x:37px"></i><i class="ember" style="left:203px;animation-duration:2.8s;animation-delay:-0.5s;--x:99px"></i><i class="ember" style="left:172px;animation-duration:3.4s;animation-delay:-0.4s;--x:47px"></i><i class="ember" style="left:247px;animation-duration:2.3s;animation-delay:-1.2s;--x:-95px"></i><i class="ember" style="left:164px;animation-duration:3.5s;animation-delay:-1.7s;--x:-79px"></i><i class="smoke" style="animation-delay:-2.9s"></i><i class="smoke" style="animation-delay:-2.1s"></i><i class="smoke" style="animation-delay:-1.0s"></i><i class="smoke" style="animation-delay:-3.7s"></i><i class="smoke" style="animation-delay:-0.1s"></i><i class="smoke" style="animation-delay:-4.4s"></i><div class="tag">VOLCANO</div><div class="brand"><h1>火山苏醒</h1><p>地心之火 · 喷薄而出</p></div></div><button class="replay">&#8635; 重新播放</button><script>document.querySelector('.replay').onclick=function(){var a=document.getElementById('app');var c=a.cloneNode(true);a.replaceWith(c);};</script></body></html>
