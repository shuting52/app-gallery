<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>齿轮咬合 · 启动页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0c0e12;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.stage{width:430px;height:900px;max-width:100vw;max-height:100vh;position:relative;overflow:hidden;
background:radial-gradient(100% 70% at 50% 30%,#1b2130 0%,#0c0e14 60%,#07080c 100%)}
.gear{position:absolute;z-index:3;animation:spin var(--sp) linear infinite}
.g1{left:60px;top:200px;width:150px;height:150px;--sp:7s}
.g2{left:218px;top:236px;width:110px;height:110px;--sp:5s;animation-direction:reverse}
.g3{left:130px;top:350px;width:190px;height:190px;--sp:9s}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.plate{position:absolute;left:50%;top:330px;width:120px;height:120px;margin:-60px 0 0 -60px;z-index:5;
border-radius:28px;background:linear-gradient(145deg,#2b3348,#171c29);
border:1px solid rgba(150,170,220,.3);display:flex;align-items:center;justify-content:center;
font-size:44px;color:#ffd479;box-shadow:0 14px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12);
opacity:0;animation:plateIn 1s cubic-bezier(.2,.8,.3,1.35) both;animation-delay:1.6s}
@keyframes plateIn{0%{opacity:0;transform:scale(.4) rotate(-24deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.sparks{position:absolute;left:50%;top:330px;width:0;height:0;z-index:4}
.sp{position:absolute;left:-2px;top:-60px;width:4px;height:16px;border-radius:2px;background:#ffd479;display:block;
opacity:0;transform-origin:50% 60px;transform:rotate(var(--a));
animation:spark .8s ease-out both;animation-delay:1.55s}
.sp:nth-child(1){--a:20deg}.sp:nth-child(2){--a:75deg}.sp:nth-child(3){--a:140deg}
.sp:nth-child(4){--a:205deg}.sp:nth-child(5){--a:260deg}.sp:nth-child(6){--a:320deg}
@keyframes spark{0%{opacity:1;transform:rotate(var(--a)) translateY(0)}100%{opacity:0;transform:rotate(var(--a)) translateY(-46px)}}
.brand{position:absolute;left:0;right:0;top:620px;text-align:center;z-index:6;
opacity:0;animation:fadeUp 1s ease-out both;animation-delay:2s}
.brand h1{font-size:36px;font-weight:700;letter-spacing:14px;color:#e8ecf5;text-indent:14px}
.brand p{font-size:13px;letter-spacing:6px;color:#8b95ad;margin-top:12px;text-indent:6px}
@keyframes fadeUp{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:translateY(0)}}
.replay{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);z-index:50;
border:1px solid rgba(150,170,220,.35);background:rgba(150,170,220,.08);color:#c9d2e8;
font-size:13px;letter-spacing:3px;padding:10px 26px;border-radius:24px;cursor:pointer}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body>
<div class="stage">
  <svg class="gear g1" viewBox="0 0 120 120">
    <circle cx="60" cy="60" r="46" fill="none" stroke="#39435c" stroke-width="20" stroke-dasharray="13 11"/>
    <circle cx="60" cy="60" r="33" fill="#1a2030" stroke="#4a5878" stroke-width="3"/>
    <circle cx="60" cy="60" r="10" fill="#4a5878"/>
  </svg>
  <svg class="gear g2" viewBox="0 0 120 120">
    <circle cx="60" cy="60" r="46" fill="none" stroke="#4a4030" stroke-width="20" stroke-dasharray="13 11"/>
    <circle cx="60" cy="60" r="33" fill="#221d14" stroke="#8a6f3c" stroke-width="3"/>
    <circle cx="60" cy="60" r="10" fill="#8a6f3c"/>
  </svg>
  <svg class="gear g3" viewBox="0 0 120 120">
    <circle cx="60" cy="60" r="46" fill="none" stroke="#2c3648" stroke-width="20" stroke-dasharray="13 11"/>
    <circle cx="60" cy="60" r="33" fill="#141926" stroke="#3c4a68" stroke-width="3"/>
    <circle cx="60" cy="60" r="10" fill="#3c4a68"/>
  </svg>
  <div class="sparks"><i class="sp"></i><i class="sp"></i><i class="sp"></i><i class="sp"></i><i class="sp"></i><i class="sp"></i></div>
  <div class="plate">巧</div>
  <div class="brand"><h1>机巧</h1><p>精密之美 · 严丝合缝</p></div>
  <button class="replay">重新播放</button>
</div>
<script>
function bind(){document.querySelector('.replay').addEventListener('click',()=>{
const s=document.querySelector('.stage');const n=s.cloneNode(true);s.replaceWith(n);bind();});}
bind();
</script>
</body></html>
