<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>并蒂莲开</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overflow:hidden}
.stage{position:fixed;inset:0;overflow:hidden}
.brand{position:absolute;left:0;right:0;top:60%;text-align:center;z-index:30;animation:brandIn 1.1s cubic-bezier(.2,.7,.3,1.2) 1.7s both}
.brand h1{font-size:44px;letter-spacing:14px;text-indent:14px;font-weight:800}
.brand p{margin-top:12px;font-size:13px;letter-spacing:5px;opacity:.72}
@keyframes brandIn{from{opacity:0;transform:translateY(26px) scale(.94)}to{opacity:1;transform:none}}
.replay{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);z-index:40;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:10px 28px;font-size:13px;letter-spacing:3px;cursor:pointer;backdrop-filter:blur(6px)}
.replay.dk{border-color:rgba(0,0,0,.25);background:rgba(0,0,0,.08);color:#2a2a2a}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{transform:translateY(0);opacity:0}12%{opacity:1}to{transform:translateY(-340px) translateX(var(--dx,0px));opacity:0}}
@keyframes fall{to{transform:translateY(960px)}}
@keyframes sway{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes ringX{from{transform:translateX(-50%) scale(.5);opacity:.8}to{transform:translateX(-50%) scale(1.5);opacity:0}}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}

.stage{background:linear-gradient(#f4f1e6,#dfe8d5)}
 .brand h1{color:#2b2b33}.brand p{color:#5a5a66}
.pond{position:absolute;bottom:0;width:100%;height:320px;background:linear-gradient(#a8c8a0,#7aa884)}
.leaf{position:absolute;width:130px;height:64px;background:#4e8a5e;border-radius:50%;box-shadow:inset -6px -8px 14px rgba(0,0,0,.2)}
.l1{bottom:70px;left:8%}.l2{bottom:46px;right:6%;transform:scale(.75)}
.lot{position:absolute;bottom:185px;left:50%;width:0}
.pt{position:absolute;left:-23px;bottom:0;width:46px;height:96px;background:linear-gradient(#f9c8d8,#f78fb0);border-radius:50% 50% 50% 50%/62% 62% 38% 38%;transform-origin:bottom center;animation:bloom 2.6s ease both;box-shadow:0 4px 10px rgba(0,0,0,.12)}
@keyframes bloom{from{transform:rotate(var(--r)) scale(.15);opacity:0}to{transform:rotate(var(--r)) scale(1);opacity:1}}
.pod{position:absolute;left:-16px;bottom:6px;width:32px;height:26px;background:radial-gradient(circle at 40% 35%,#ffe9a8,#d9a83d);border-radius:50%}
.rip{position:absolute;bottom:155px;left:50%;border:2px solid rgba(255,255,255,.6);border-radius:50%;animation:ripX 3.6s ease-out infinite}
@keyframes ripX{from{transform:scale(.5);opacity:.8}to{transform:scale(1.6);opacity:0}}
.rp1{width:200px;height:44px;margin:-22px -100px}
.rp2{width:200px;height:44px;margin:-22px -100px;animation-delay:-1.8s}
</style></head>
<body><div class="stage">
<div class="pond"></div><div class="leaf l1"></div><div class="leaf l2"></div>
<div class="lot">
<span class="pt" style="--r:0deg;animation-delay:1.20s"></span>
<span class="pt" style="--r:45deg;animation-delay:1.32s"></span>
<span class="pt" style="--r:90deg;animation-delay:1.44s"></span>
<span class="pt" style="--r:135deg;animation-delay:1.56s"></span>
<span class="pt" style="--r:180deg;animation-delay:1.68s"></span>
<span class="pt" style="--r:225deg;animation-delay:1.80s"></span>
<span class="pt" style="--r:270deg;animation-delay:1.92s"></span>
<span class="pt" style="--r:315deg;animation-delay:2.04s"></span>
<span class="pod"></span></div>
<span class="rip rp1"></span><span class="rip rp2"></span>
<div class="brand"><h1>并蒂</h1><p>出淤泥而不染</p></div>
<button class="replay dk">重新播放</button>
<script>
var tpl=document.body.innerHTML;
function bind(){document.querySelector('.replay').onclick=function(){document.body.innerHTML=tpl;bind();};}
bind();
</script>
</div></body></html>
