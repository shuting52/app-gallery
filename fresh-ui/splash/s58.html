<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>枫落</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{width:430px;height:900px;margin:0 auto;position:relative;overflow:hidden;
font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
background:linear-gradient(180deg,#ff9d5c 0%,#f2705c 60%,#c9504a 100%);color:#fff}
.scene{position:absolute;inset:0}

.lf{position:absolute;top:-44px;border-radius:100% 6px 100% 6px;animation:lfFall linear infinite;box-shadow:inset -4px -4px 0 rgba(0,0,0,.12)}
@keyframes lfFall{to{transform:translateY(970px) rotate(560deg)}}
.pile{position:absolute;bottom:-60px;left:-60px;width:550px;height:170px;background:linear-gradient(#b3402f,#8f2f24);border-radius:50%}
.sun2{position:absolute;top:90px;left:50%;transform:translateX(-50%);width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 40% 38%,#fff3c0,#ffd93d 70%);box-shadow:0 0 70px 26px rgba(255,200,80,.45)}

.brand{position:absolute;left:0;right:0;bottom:118px;text-align:center;z-index:5;
color:#fff;opacity:0;animation:brandIn 1s ease 2.2s both}
.brand h1{font-size:34px;letter-spacing:8px;font-weight:800;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.brand p{font-size:13px;letter-spacing:3px;margin-top:10px;opacity:.85;text-shadow:0 1px 10px rgba(0,0,0,.35)}
@keyframes brandIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.replay{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);z-index:6;
padding:10px 28px;border-radius:24px;border:1px solid rgba(255,255,255,.45);
background:rgba(255,255,255,.14);color:#fff;font-size:14px;letter-spacing:2px;cursor:pointer}
</style></head><body>
<div class="scene"><div class="sun2"></div><i class="lf" style="left:30px;animation-duration:7s;animation-delay:-1s;background:#d63c2f;width:26px;height:26px"></i><i class="lf" style="left:90px;animation-duration:8.5s;animation-delay:-4s;background:#e8762b;width:22px;height:22px"></i><i class="lf" style="left:150px;animation-duration:7.5s;animation-delay:-2.5s;background:#f2b134;width:28px;height:28px"></i><i class="lf" style="left:210px;animation-duration:9s;animation-delay:-6s;background:#d63c2f;width:24px;height:24px"></i><i class="lf" style="left:270px;animation-duration:7s;animation-delay:-3.5s;background:#c23b2e;width:26px;height:26px"></i><i class="lf" style="left:330px;animation-duration:8s;animation-delay:-5s;background:#e8762b;width:22px;height:22px"></i><i class="lf" style="left:390px;animation-duration:7.5s;animation-delay:-1.5s;background:#f2b134;width:28px;height:28px"></i><i class="lf" style="left:60px;animation-duration:9s;animation-delay:-7s;background:#e8762b;width:24px;height:24px"></i><i class="lf" style="left:180px;animation-duration:7s;animation-delay:-0.5s;background:#d63c2f;width:26px;height:26px"></i><i class="lf" style="left:300px;animation-duration:8.5s;animation-delay:-3s;background:#f2b134;width:22px;height:22px"></i><i class="lf" style="left:240px;animation-duration:7.5s;animation-delay:-5.5s;background:#c23b2e;width:28px;height:28px"></i><i class="lf" style="left:120px;animation-duration:8s;animation-delay:-2s;background:#d63c2f;width:24px;height:24px"></i><div class="pile"></div></div>
<div class="brand"><h1>枫落</h1><p>一叶知秋 意满人间</p></div>
<button class="replay" onclick="location.reload()">重新播放</button>
</body></html>
