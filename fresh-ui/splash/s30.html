<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>心电图鉴</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#02100c;display:flex;justify-content:center;font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;overflow:hidden}
.stage{width:430px;height:900px;max-height:100vh;position:relative;overflow:hidden;background:#02100c}
.grid{position:absolute;inset:0;background:
repeating-linear-gradient(0deg,rgba(46,230,162,.07) 0 1px,transparent 1px 28px),
repeating-linear-gradient(90deg,rgba(46,230,162,.07) 0 1px,transparent 1px 28px),
repeating-linear-gradient(0deg,rgba(46,230,162,.14) 0 1px,transparent 1px 140px),
repeating-linear-gradient(90deg,rgba(46,230,162,.14) 0 1px,transparent 1px 140px)}
.ecg{position:absolute;left:-40px;right:-40px;top:330px}
.ecg path{fill:none;stroke:#2ee6a2;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 10px rgba(46,230,162,.9));stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2.4s cubic-bezier(.4,0,.3,1) .4s both}
@keyframes draw{to{stroke-dashoffset:0}}
.dot{position:absolute;top:326px;left:-40px;width:14px;height:14px;border-radius:50%;background:#baffdf;box-shadow:0 0 18px 6px rgba(46,230,162,.8);animation:travel 2.4s cubic-bezier(.4,0,.3,1) .4s both}
@keyframes travel{from{left:-40px}to{left:470px}}
.heart{position:relative;width:64px;height:64px;margin:0 auto;background:#ff4d6d;transform:rotate(45deg);animation:beat 1.1s ease-in-out -0.3s infinite}
.heart::before,.heart::after{content:"";position:absolute;width:64px;height:64px;border-radius:50%;background:#ff4d6d}
.heart::before{left:-32px}.heart::after{top:-32px}
@keyframes beat{0%,100%{transform:rotate(45deg) scale(1)}12%{transform:rotate(45deg) scale(1.18)}24%{transform:rotate(45deg) scale(1)}36%{transform:rotate(45deg) scale(1.12)}}
.hwrap{position:absolute;left:0;right:0;top:120px;animation:up 1s ease .2s both}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.brand{position:absolute;left:0;right:0;bottom:180px;text-align:center;animation:up 1.2s ease 1.4s both}
.brand h1{font-size:46px;letter-spacing:12px;text-indent:12px;color:#d8ffe9;font-weight:800}
.brand h1 b{color:#2ee6a2}
.brand p{margin-top:12px;font-size:13px;letter-spacing:6px;color:#5f9e82}
.bpm{position:absolute;top:480px;left:0;right:0;text-align:center;color:#2ee6a2;font-size:15px;letter-spacing:6px;animation:up 1s ease 2s both;font-variant-numeric:tabular-nums}
.replay{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);z-index:50;padding:10px 26px;border-radius:999px;border:1px solid rgba(46,230,162,.55);background:rgba(46,230,162,.1);color:#d8ffe9;font-size:13px;letter-spacing:4px;text-indent:4px;cursor:pointer}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body><div class="stage">
<div class="grid"></div>
<div class="hwrap"><div class="heart"></div></div>
<svg class="ecg" viewBox="0 0 510 120" preserveAspectRatio="none"><path d="M0,60 L150,60 L175,60 L190,20 L205,100 L220,45 L232,60 L300,60 L322,60 L335,8 L352,112 L368,40 L380,60 L510,60"/></svg>
<div class="dot"></div>
<div class="bpm">♥ 72 BPM ·  sinus rhythm</div>
<div class="brand"><h1>心电<b>图鉴</b></h1><p>每一次心跳 都算数</p></div>
<button class="replay" onclick="location.reload()">重新播放</button>
</div></body></html>
