<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日出破晓 · 启动页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#04060e;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.stage{width:430px;height:900px;max-width:100vw;max-height:100vh;position:relative;overflow:hidden}
.night{position:absolute;inset:0;background:linear-gradient(180deg,#060a1c 0%,#0b1030 45%,#1a1440 100%);z-index:1}
.dawn{position:absolute;inset:0;z-index:2;opacity:0;animation:dawn 3s ease-out both;
background:linear-gradient(180deg,#2b4a7a 0%,#c46a8a 48%,#f2a35e 72%,#ffd98a 100%)}
@keyframes dawn{0%{opacity:0}100%{opacity:1}}
.stars{position:absolute;inset:0;z-index:3}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;display:block;opacity:.9;
animation:twinkle 2s ease-in both}
.stars i:nth-child(1){left:60px;top:120px}.stars i:nth-child(2){left:150px;top:70px;animation-delay:.3s}
.stars i:nth-child(3){left:260px;top:140px;animation-delay:.6s}.stars i:nth-child(4){left:330px;top:80px;animation-delay:.2s}
.stars i:nth-child(5){left:210px;top:190px;animation-delay:.8s}.stars i:nth-child(6){left:90px;top:230px;animation-delay:1s}
@keyframes twinkle{0%{opacity:.9}100%{opacity:0}}
.sea{position:absolute;left:0;right:0;bottom:0;height:300px;z-index:4;background:linear-gradient(180deg,#12314f,#060d1c)}
.horizon{position:absolute;left:0;right:0;bottom:298px;height:2px;background:rgba(255,220,160,.7);z-index:4}
.sun{position:absolute;left:50%;bottom:180px;width:130px;height:130px;margin-left:-65px;z-index:3;border-radius:50%;
background:radial-gradient(circle at 50% 45%,#fff6d8 0%,#ffd98a 45%,#ff9e5e 100%);
box-shadow:0 0 60px 24px rgba(255,180,100,.55);transform:translateY(190px);
animation:rise 2.8s cubic-bezier(.3,.6,.4,1) both;animation-delay:.3s}
@keyframes rise{0%{transform:translateY(190px)}100%{transform:translateY(0)}}
.rays{position:absolute;left:50%;bottom:245px;width:340px;height:340px;margin-left:-170px;z-index:3;opacity:0;
background:conic-gradient(from 0deg,rgba(255,220,150,.28) 0 8deg,transparent 8deg 24deg,rgba(255,220,150,.28) 24deg 32deg,transparent 32deg 48deg,rgba(255,220,150,.28) 48deg 56deg,transparent 56deg 72deg,rgba(255,220,150,.28) 72deg 80deg,transparent 80deg 96deg,rgba(255,220,150,.28) 96deg 104deg,transparent 104deg 120deg,rgba(255,220,150,.28) 120deg 128deg,transparent 128deg 144deg,rgba(255,220,150,.28) 144deg 152deg,transparent 152deg 168deg,rgba(255,220,150,.28) 168deg 176deg,transparent 176deg 192deg,rgba(255,220,150,.28) 192deg 200deg,transparent 200deg 216deg,rgba(255,220,150,.28) 216deg 224deg,transparent 224deg 240deg,rgba(255,220,150,.28) 240deg 248deg,transparent 248deg 264deg,rgba(255,220,150,.28) 264deg 272deg,transparent 272deg 288deg,rgba(255,220,150,.28) 288deg 296deg,transparent 296deg 312deg,rgba(255,220,150,.28) 312deg 320deg,transparent 320deg 336deg,rgba(255,220,150,.28) 336deg 344deg,transparent 344deg 360deg);
border-radius:50%;-webkit-mask:radial-gradient(circle,transparent 60px,#000 61px);mask:radial-gradient(circle,transparent 60px,#000 61px);
animation:raysIn 2s ease-out both,spin 24s linear infinite;animation-delay:1.4s,1.4s}
@keyframes raysIn{0%{opacity:0}100%{opacity:1}}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.refl{position:absolute;left:50%;bottom:60px;width:90px;height:180px;margin-left:-45px;z-index:4;opacity:0;
background:linear-gradient(180deg,rgba(255,190,120,.5),transparent);filter:blur(8px);
animation:reflIn 1.6s ease-out both;animation-delay:1.8s}
@keyframes reflIn{0%{opacity:0;transform:scaleY(.3)}100%{opacity:1;transform:scaleY(1)}}
.brand{position:absolute;left:0;right:0;top:120px;text-align:center;z-index:6;
opacity:0;animation:fadeUp 1.2s ease-out both;animation-delay:2.2s}
.brand h1{font-size:36px;font-weight:700;letter-spacing:14px;color:#fff3dd;text-indent:14px;text-shadow:0 2px 20px rgba(255,160,80,.6)}
.brand p{font-size:13px;letter-spacing:6px;color:#ffd9a8;margin-top:12px;text-indent:6px}
@keyframes fadeUp{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:translateY(0)}}
.replay{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);z-index:50;
border:1px solid rgba(255,220,160,.5);background:rgba(255,200,130,.12);color:#ffe9c4;
font-size:13px;letter-spacing:3px;padding:10px 26px;border-radius:24px;cursor:pointer}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body>
<div class="stage">
  <div class="night"></div><div class="dawn"></div>
  <div class="stars"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="sun"></div><div class="rays"></div>
  <div class="sea"></div><div class="horizon"></div><div class="refl"></div>
  <div class="brand"><h1>破晓</h1><p>每一天都是新的开始</p></div>
  <button class="replay">重新播放</button>
</div>
<script>
function bind(){document.querySelector('.replay').addEventListener('click',()=>{
const s=document.querySelector('.stage');const n=s.cloneNode(true);s.replaceWith(n);bind();});}
bind();
</script>
</body></html>
