<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>蝶舞破茧</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:430px;height:900px}
body{overflow:hidden;position:relative;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(#0e2a1e,#1d4d33 70%,#2a6b45);color:#fff}
.stage{position:absolute;inset:0;overflow:hidden}
.brand{position:absolute;left:0;right:0;top:648px;text-align:center;z-index:5;animation:brandIn 1s ease 2s both}
.brand h1{font-size:36px;letter-spacing:10px;font-weight:800}
.brand p{font-size:13px;letter-spacing:6px;opacity:.65;margin-top:10px}
@keyframes brandIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.replay{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);z-index:9;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;font-size:13px;padding:9px 26px;border-radius:24px;cursor:pointer;backdrop-filter:blur(6px)}
.cocoon{position:absolute;left:50%;top:380px;width:110px;height:150px;transform:translate(-50%,-50%);background:linear-gradient(#c9a86a,#8a6d3b);border-radius:50%;animation:crack 3s ease both}
@keyframes crack{0%,55%{transform:translate(-50%,-50%) scale(1);opacity:1}80%,100%{transform:translate(-50%,-50%) scale(1.3);opacity:0}}
.bf{position:absolute;left:50%;top:300px;width:140px;height:100px;transform:translate(-50%,-50%);opacity:0;animation:bfly 3s ease both;animation-delay:.4s}
@keyframes bfly{0%{opacity:0;transform:translate(-50%,-30%) scale(.4)}30%{opacity:1}100%{opacity:1;transform:translate(-50%,-190%) scale(1)}}
.bf svg{display:block;width:140px;height:100px;overflow:visible}
.wl{transform-box:fill-box;transform-origin:100% 50%;animation:flap .5s ease-in-out infinite}
.wr{transform-box:fill-box;transform-origin:0% 50%;animation:flapr .5s ease-in-out infinite}
@keyframes flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.55)}}
@keyframes flapr{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.55)}}
.leaf{position:absolute;bottom:0;width:100%;height:180px;background:#0c2417;border-radius:50% 50% 0 0}
</style></head><body>
<div class="stage"><div class="leaf"></div><div class="cocoon"></div><div class="bf"><svg viewBox="0 0 140 100"><defs><linearGradient id="wg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9ff3"/><stop offset="1" stop-color="#a55cff"/></linearGradient></defs><g class="wl"><ellipse cx="36" cy="50" rx="32" ry="42" fill="url(#wg)"/><ellipse cx="30" cy="38" rx="10" ry="12" fill="#ffffff" opacity=".45"/></g><g class="wr"><ellipse cx="104" cy="50" rx="32" ry="42" fill="url(#wg)"/><ellipse cx="110" cy="38" rx="10" ry="12" fill="#ffffff" opacity=".45"/></g><rect x="64" y="16" width="12" height="68" rx="6" fill="#3b2b55"/><path d="M64 18 C 58 8, 52 6, 46 8 M76 18 C 82 8, 88 6, 94 8" stroke="#3b2b55" stroke-width="3" fill="none" stroke-linecap="round"/></svg></div></div>
<div class="brand"><h1>羽化</h1><p>BUTTERFLY · 新生</p></div>
<button class="replay" onclick="location.reload()">&#8635; 重新播放</button>
</body></html>
