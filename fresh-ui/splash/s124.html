.lan .bd2::before{content:"";position:absolute;left:8px;right:8px;top:10px;bottom:10px;border:2px solid rgba(120,50,0,.35);border-radius:48%}
.lan .tp{width:22px;height:8px;background:#5a3a1a;margin:0 auto;border-radius:3px}
.star{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}
.moon2{position:absolute;left:60px;top:110px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fef9e0,#d9cf9f 70%);box-shadow:0 0 44px #fff6c088}
