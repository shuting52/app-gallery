<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>深蓝潜行</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000}
body{width:430px;height:900px;margin:0 auto;position:relative;overflow:hidden;
font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:#fff}

body{background:linear-gradient(#06283f 0%,#042033 45%,#020f1c 100%)}
.ray{position:absolute;top:0;width:70px;height:520px;transform:skewX(-14deg);transform-origin:top;
background:linear-gradient(rgba(140,220,255,.22),transparent);animation:rayS 7s ease-in-out infinite}
@keyframes rayS{50%{opacity:.5;transform:skewX(-8deg)}}
.sub{position:absolute;left:50%;top:380px;transform:translateX(-50%);z-index:3;
animation:cruise 9s ease-in-out infinite;animation-delay:-4s}
@keyframes cruise{50%{transform:translateX(-50%) translateY(-26px)}}
.sub .hull{width:250px;height:96px;background:linear-gradient(#e8b93c,#c8922a);border-radius:48px;position:relative;
box-shadow:inset 0 -14px 24px rgba(120,70,10,.4)}
.sub .tower{position:absolute;left:50%;top:-34px;transform:translateX(-50%);width:74px;height:44px;
background:linear-gradient(#d8a832,#b88424);border-radius:12px 12px 0 0}
.sub .scope{position:absolute;left:50%;top:-58px;transform:translateX(-50%);width:10px;height:26px;background:#8a6a20}
.port{position:absolute;top:50%;width:26px;height:26px;transform:translateY(-50%);border-radius:50%;
background:radial-gradient(circle at 35% 30%,#fff8d8,#ffd94d 60%,#a87a1a);box-shadow:0 0 14px 4px rgba(255,210,90,.7)}
.bub{position:absolute;border-radius:50%;border:2px solid rgba(160,220,255,.7);animation:up 4s ease-in infinite}
@keyframes up{from{transform:translateY(0);opacity:.9}to{transform:translateY(-300px);opacity:0}}
.fish{position:absolute;font-size:22px;color:rgba(120,180,230,.7);animation:swim 11s linear infinite}
@keyframes swim{from{transform:translateX(-50px)}to{transform:translateX(520px)}}
.kelp{position:absolute;bottom:0;width:14px;border-radius:8px;background:linear-gradient(#1f7a4d,#155c39);
transform-origin:bottom;animation:kelpS 5s ease-in-out infinite}
@keyframes kelpS{50%{transform:rotate(7deg)}}

.brand{position:absolute;left:0;right:0;bottom:150px;text-align:center;z-index:20;
animation:brandIn 1.1s cubic-bezier(.2,.7,.3,1.2) .9s both}
.brand h1{font-size:36px;letter-spacing:10px;font-weight:800;text-shadow:0 4px 24px rgba(0,0,0,.45)}
.brand p{margin-top:12px;font-size:13px;letter-spacing:6px;opacity:.75}
@keyframes brandIn{from{opacity:0;transform:translateY(26px) scale(.94)}}
.replay{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);z-index:30;
background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;
border-radius:24px;padding:10px 26px;font-size:13px;letter-spacing:2px;cursor:pointer;
backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body>
<div id="st">
<div class="ray" style="left:70px;animation-delay:-2s"></div>
<div class="ray" style="left:200px;width:100px;animation-delay:-5s"></div>
<div class="ray" style="left:330px;width:56px;animation-delay:-1s"></div>
<div class="sub"><div class="scope"></div><div class="tower"></div><div class="hull">
<span class="port" style="left:36px"></span><span class="port" style="left:96px"></span>
<span class="port" style="left:156px"></span></div></div>
<div class="bub" style="left:300px;top:360px;width:14px;height:14px;animation-delay:-1s"></div>
<div class="bub" style="left:330px;top:370px;width:9px;height:9px;animation-delay:-2.6s;animation-duration:5s"></div>
<div class="bub" style="left:280px;top:350px;width:18px;height:18px;animation-delay:-3.4s;animation-duration:4.6s"></div>
<div class="fish" style="top:200px;animation-delay:-4s">🐟</div>
<div class="fish" style="top:560px;animation-delay:-9s;font-size:16px">🐟</div>
<div class="kelp" style="left:50px;height:150px;animation-delay:-1s"></div>
<div class="kelp" style="left:90px;height:110px;animation-delay:-3s"></div>
<div class="kelp" style="left:370px;height:170px;animation-delay:-2s"></div>
</div>
<div class="brand"><h1>深蓝潜行</h1><p>DEEP DIVE</p></div>
<button class="replay" onclick="var s=document.getElementById('st');var c=s.cloneNode(true);s.replaceWith(c);">重新播放</button>
</body></html>
