<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>风车田野</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000}
body{width:430px;height:900px;margin:0 auto;position:relative;overflow:hidden;
font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:#fff}

body{background:linear-gradient(#8ed4f7 0%,#c9ecff 55%,#fdf3d8 100%)}
.sun{position:absolute;left:56px;top:70px;width:80px;height:80px;border-radius:50%;
background:radial-gradient(circle at 50% 50%,#fff8dc,#ffd94d 70%);box-shadow:0 0 50px 18px rgba(255,220,100,.5)}
.cloud{position:absolute;background:#fff;border-radius:40px;animation:drift 18s linear infinite}
.cloud.c1{width:130px;height:40px;top:120px;animation-delay:-6s}
.cloud.c2{width:100px;height:32px;top:220px;animation-duration:26s;animation-delay:-18s;opacity:.8}
@keyframes drift{from{transform:translateX(-170px)}to{transform:translateX(560px)}}
.mill{position:absolute;left:50%;bottom:200px;transform:translateX(-50%);z-index:3}
.mill .tw{width:56px;height:230px;margin:0 auto;background:linear-gradient(90deg,#8a6f55,#6e5844);
clip-path:polygon(28% 0,72% 0,100% 100%,0 100%)}
.blades{position:absolute;left:50%;top:-6px;width:0;height:0;transform:translateX(-50%);
animation:spinB 5s linear infinite;animation-delay:-2s}
@keyframes spinB{to{transform:translateX(-50%) rotate(360deg)}}
.blade{position:absolute;left:-9px;top:-118px;width:18px;height:118px;background:#f5efe2;
clip-path:polygon(0 0,100% 0,72% 100%,28% 100%);transform-origin:50% 118px}
.blade.b2{transform:rotate(90deg)}.blade.b3{transform:rotate(180deg)}.blade.b4{transform:rotate(270deg)}
.hub{position:absolute;left:50%;top:-14px;width:28px;height:28px;transform:translate(-50%,-50%);
background:#c0392b;border-radius:50%;z-index:2}
.field{position:absolute;left:0;right:0;bottom:0;height:230px;background:linear-gradient(#a8d86e,#7fb84a 60%,#5f9a34);z-index:2}
.stalk{position:absolute;bottom:150px;width:3px;height:70px;background:#4e7d2c;transform-origin:bottom;
animation:sway 3.4s ease-in-out infinite}
.stalk::before{content:"";position:absolute;top:-12px;left:50%;transform:translateX(-50%);width:16px;height:24px;
background:#d8b34d;border-radius:50% 50% 40% 40%}
@keyframes sway{50%{transform:rotate(9deg)}}

.brand{position:absolute;left:0;right:0;bottom:150px;text-align:center;z-index:20;
animation:brandIn 1.1s cubic-bezier(.2,.7,.3,1.2) .9s both}
.brand h1{font-size:36px;letter-spacing:10px;font-weight:800;text-shadow:0 4px 24px rgba(0,0,0,.45)}
.brand p{margin-top:12px;font-size:13px;letter-spacing:6px;opacity:.75}
@keyframes brandIn{from{opacity:0;transform:translateY(26px) scale(.94)}}
.replay{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);z-index:30;
background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;
border-radius:24px;padding:10px 26px;font-size:13px;letter-spacing:2px;cursor:pointer;
backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body>
<div id="st">
<div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div>
<div class="mill"><div class="blades"><div class="blade"></div><div class="blade b2"></div><div class="blade b3"></div><div class="blade b4"></div></div>
<div class="hub"></div><div class="tw"></div></div>
<div class="field"></div>
<div class="stalk" style="left:60px;animation-delay:-.5s"></div>
<div class="stalk" style="left:120px;height:86px;animation-delay:-1.8s"></div>
<div class="stalk" style="left:330px;animation-delay:-2.6s"></div>
<div class="stalk" style="left:380px;height:80px;animation-delay:-1.1s"></div>
<div class="stalk" style="left:250px;height:64px;animation-delay:-3s"></div>
</div>
<div class="brand"><h1>风车田野</h1><p>WINDMILL FIELD</p></div>
<button class="replay" onclick="var s=document.getElementById('st');var c=s.cloneNode(true);s.replaceWith(c);">重新播放</button>
</body></html>
