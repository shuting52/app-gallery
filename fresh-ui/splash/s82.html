<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雪花结晶</title><style>*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{width:430px;min-height:900px;margin:0 auto;position:relative;overflow:hidden;color:#fff;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;background:linear-gradient(180deg,#0a1a33 0%,#10294f 60%,#0a1a33 100%)}
#app{position:absolute;inset:0}
.brand{position:absolute;left:0;right:0;bottom:112px;text-align:center;z-index:10;opacity:0;transform:translateY(16px);animation:brandIn .9s cubic-bezier(.2,.7,.3,1.2) 2.3s both}
.brand h1{font-size:34px;letter-spacing:10px;font-weight:800;text-indent:10px}
.brand p{margin-top:10px;font-size:12px;letter-spacing:5px;opacity:.7;text-indent:5px}
@keyframes brandIn{to{opacity:1;transform:none}}
.tag{position:absolute;top:56px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:8px;text-indent:8px;opacity:0;z-index:10;animation:brandIn 1s ease 2.7s both;color:rgba(255,255,255,.65)}
.replay{position:absolute;left:50%;bottom:42px;transform:translateX(-50%);z-index:20;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:20px;padding:8px 24px;font-size:13px;letter-spacing:2px;cursor:pointer;backdrop-filter:blur(6px)}

.flake{position:absolute;left:50%;top:300px;width:220px;height:220px;margin-left:-110px;animation:form 2s ease-out .3s both}
@keyframes form{from{transform:scale(.2) rotate(-40deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.flake .core{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;animation:spin2 24s linear infinite}
@keyframes spin2{to{transform:rotate(360deg)}}
.flake .sp{position:absolute;left:50%;top:50%;width:6px;height:190px;margin:-95px 0 0 -3px;display:block;background:linear-gradient(180deg,transparent,#bfe3ff 30%,#bfe3ff 70%,transparent);border-radius:3px}
.flake .sp:nth-child(1){transform:rotate(0deg)}.flake .sp:nth-child(2){transform:rotate(60deg)}.flake .sp:nth-child(3){transform:rotate(120deg)}
.flake .ct{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;display:block;border-radius:50%;background:radial-gradient(circle,#fff,#9fd0ff 70%);box-shadow:0 0 26px #bfe3ff}
.snw{position:absolute;top:-14px;width:7px;height:7px;display:block;border-radius:50%;background:#e8f4ff;animation:fall3 linear infinite}
@keyframes fall3{to{transform:translateY(940px) rotate(200deg);opacity:.3}}
.halo{position:absolute;left:50%;top:230px;width:360px;height:360px;transform:translateX(-50%);background:radial-gradient(circle,rgba(150,200,255,.18),transparent 70%);animation:glowp 5s ease-in-out -2s infinite}
@keyframes glowp{50%{opacity:.55}}
</style></head><body><div id="app"><div class="halo"></div><div class="flake"><div class="core"><i class="sp"></i><i class="sp"></i><i class="sp"></i></div><i class="ct"></i></div><i class="snw" style="left:365px;animation-delay:-2.42s;animation-duration:6.95s;"></i><i class="snw" style="left:132px;animation-delay:-5.72s;animation-duration:7.17s;"></i><i class="snw" style="left:256px;animation-delay:-0.50s;animation-duration:5.42s;"></i><i class="snw" style="left:187px;animation-delay:-1.54s;animation-duration:9.79s;"></i><i class="snw" style="left:235px;animation-delay:-3.57s;animation-duration:5.03s;"></i><i class="snw" style="left:386px;animation-delay:-5.60s;animation-duration:8.92s;"></i><i class="snw" style="left:262px;animation-delay:-1.52s;animation-duration:6.97s;"></i><i class="snw" style="left:163px;animation-delay:-5.91s;animation-duration:9.45s;"></i><i class="snw" style="left:91px;animation-delay:-0.34s;animation-duration:6.12s;"></i><i class="snw" style="left:28px;animation-delay:-5.74s;animation-duration:9.81s;"></i><i class="snw" style="left:334px;animation-delay:-2.81s;animation-duration:5.72s;"></i><i class="snw" style="left:181px;animation-delay:-5.15s;animation-duration:9.90s;"></i><i class="snw" style="left:389px;animation-delay:-3.83s;animation-duration:8.86s;"></i><i class="snw" style="left:96px;animation-delay:-1.04s;animation-duration:8.08s;"></i><i class="snw" style="left:123px;animation-delay:-3.40s;animation-duration:7.97s;"></i><i class="snw" style="left:121px;animation-delay:-5.62s;animation-duration:10.23s;"></i><i class="snw" style="left:53px;animation-delay:-4.41s;animation-duration:6.59s;"></i><i class="snw" style="left:201px;animation-delay:-4.11s;animation-duration:8.53s;"></i><i class="snw" style="left:385px;animation-delay:-5.09s;animation-duration:6.55s;"></i><i class="snw" style="left:348px;animation-delay:-5.24s;animation-duration:7.37s;"></i><i class="snw" style="left:9px;animation-delay:-3.49s;animation-duration:6.63s;"></i><i class="snw" style="left:203px;animation-delay:-1.75s;animation-duration:6.13s;"></i><i class="snw" style="left:164px;animation-delay:-4.18s;animation-duration:9.77s;"></i><i class="snw" style="left:104px;animation-delay:-4.46s;animation-duration:10.85s;"></i><i class="snw" style="left:352px;animation-delay:-5.89s;animation-duration:7.70s;"></i><i class="snw" style="left:399px;animation-delay:-2.91s;animation-duration:7.35s;"></i><i class="snw" style="left:267px;animation-delay:-5.44s;animation-duration:6.96s;"></i><i class="snw" style="left:288px;animation-delay:-2.75s;animation-duration:5.86s;"></i><i class="snw" style="left:176px;animation-delay:-0.36s;animation-duration:8.13s;"></i><i class="snw" style="left:225px;animation-delay:-4.41s;animation-duration:10.00s;"></i><i class="snw" style="left:108px;animation-delay:-4.57s;animation-duration:7.23s;"></i><i class="snw" style="left:6px;animation-delay:-0.04s;animation-duration:6.56s;"></i><i class="snw" style="left:327px;animation-delay:-2.12s;animation-duration:9.90s;"></i><i class="snw" style="left:56px;animation-delay:-3.10s;animation-duration:10.59s;"></i><div class="tag">SNOWFLAKE</div><div class="brand"><h1>雪花结晶</h1><p>冰姿玉骨 · 六出纷飞</p></div></div><button class="replay">&#8635; 重新播放</button><script>document.querySelector('.replay').onclick=function(){var a=document.getElementById('app');var c=a.cloneNode(true);a.replaceWith(c);};</script></body></html>
