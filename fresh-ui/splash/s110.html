<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>纸飞机</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:430px;height:900px}
body{overflow:hidden;position:relative;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(#7ec8f7,#cdeaff 70%,#eef9ff);color:#fff}
.stage{position:absolute;inset:0;overflow:hidden}
.brand{position:absolute;left:0;right:0;top:648px;text-align:center;z-index:5;animation:brandIn 1s ease 2s both}
.brand h1{font-size:36px;letter-spacing:10px;font-weight:800}
.brand p{font-size:13px;letter-spacing:6px;opacity:.65;margin-top:10px}
@keyframes brandIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.replay{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);z-index:9;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;font-size:13px;padding:9px 26px;border-radius:24px;cursor:pointer;backdrop-filter:blur(6px)}
.plane{position:absolute;width:54px;height:54px;offset-path:path('M -60 700 C 120 620, 180 420, 320 380 S 480 300, 520 120');offset-rotate:auto;animation:fly 6s linear infinite;animation-delay:-2s}
@keyframes fly{to{offset-distance:100%}}
.plane i{display:block;width:0;height:0;border-left:30px solid #fff;border-top:14px solid transparent;border-bottom:14px solid transparent;filter:drop-shadow(0 6px 8px rgba(0,0,0,.2))}
.plane b{display:block;width:0;height:0;border-left:30px solid #dbe9ff;border-top:14px solid transparent;border-bottom:0 solid transparent;margin-top:-14px;transform:scaleY(-1)}
.trail{position:absolute;left:0;top:0;width:430px;height:900px}
.cloud{position:absolute;background:#fff;border-radius:40px;opacity:.85;animation:drift 14s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:44px;height:44px;top:-20px;left:14px}
.cloud::after{width:30px;height:30px;top:-14px;left:44px}
.c1{width:90px;height:30px;top:180px;animation-delay:-4s}
.c2{width:70px;height:24px;top:420px;animation-delay:-9s}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(480px)}}
</style></head><body>
<div class="stage"><svg class="trail" viewBox="0 0 430 900"><path d="M -60 700 C 120 620, 180 420, 320 380 S 480 300, 520 120" fill="none" stroke="#8fb8dd" stroke-width="3" stroke-dasharray="10 12" opacity=".7"/></svg>
<div class="cloud c1"></div><div class="cloud c2"></div>
<div class="plane"><i></i><b></b></div></div>
<div class="brand"><h1>纸翼</h1><p>PAPER WING · 远行</p></div>
<button class="replay" onclick="location.reload()">&#8635; 重新播放</button>
</body></html>
