<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>齿轮黎明</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#160f24;display:flex;justify-content:center;font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;overflow:hidden}
.stage{width:430px;height:900px;max-height:100vh;position:relative;overflow:hidden;background:linear-gradient(180deg,#1b1030 0%,#4a1e4d 42%,#c65a3a 68%,#f5a54b 100%)}
.sun{position:absolute;left:50%;top:560px;width:150px;height:150px;margin-left:-75px;border-radius:50%;background:radial-gradient(circle at 42% 38%,#fff3c4,#ffcf6e 55%,#ff9d4d);box-shadow:0 0 80px 26px rgba(255,180,90,.6);animation:rise 2.6s cubic-bezier(.3,.7,.3,1) .2s both}
@keyframes rise{from{top:780px}to{top:560px}}
.birds{position:absolute;top:200px;left:0;right:0;text-align:center;color:#3a2040;font-size:22px;letter-spacing:30px;animation:up 1.4s ease 1.2s both}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.deck{position:absolute;left:0;right:0;bottom:0;height:340px;background:linear-gradient(180deg,#241a33,#120b1d);border-top:1px solid rgba(245,165,75,.25)}
.gear{position:absolute;transform-box:fill-box}
.gear svg{display:block;animation:spin 9s linear -3s infinite}
.gear.g2 svg{animation-duration:6s;animation-direction:reverse}
.gear.g3 svg{animation-duration:12s}
@keyframes spin{to{transform:rotate(360deg)}}
.g1{left:36px;bottom:120px;width:150px;height:150px}
.g2{left:150px;bottom:56px;width:110px;height:110px}
.g3{left:236px;bottom:110px;width:130px;height:130px}
.brand{position:absolute;left:0;right:0;bottom:300px;text-align:center;animation:up 1.2s ease 1.6s both}
.brand h1{font-size:52px;letter-spacing:20px;text-indent:20px;color:#ffe9c9;font-weight:800;text-shadow:0 2px 24px rgba(0,0,0,.4)}
.brand p{margin-top:12px;font-size:13px;letter-spacing:7px;color:#f5b98a}
.replay{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);z-index:50;padding:10px 26px;border-radius:999px;border:1px solid rgba(255,233,201,.5);background:rgba(255,255,255,.1);color:#ffe9c9;font-size:13px;letter-spacing:4px;text-indent:4px;cursor:pointer}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body><div class="stage">
<div class="sun"></div><div class="birds">﹏ ﹏ ﹏</div>
<div class="deck"></div>
<div class="gear g1"><svg viewBox="-50 -50 100 100"><g fill="#3a2c50"><rect x="-7" y="-48" width="14" height="20" rx="4"/><rect x="-7" y="-48" width="14" height="20" rx="4" transform="rotate(45)"/><rect x="-7" y="-48" width="14" height="20" rx="4" transform="rotate(90)"/><rect x="-7" y="-48" width="14" height="20" rx="4" transform="rotate(135)"/><rect x="-7" y="-48" width="14" height="20" rx="4" transform="rotate(180)"/><rect x="-7" y="-48" width="14" height="20" rx="4" transform="rotate(225)"/><rect x="-7" y="-48" width="14" height="20" rx="4" transform="rotate(270)"/><rect x="-7" y="-48" width="14" height="20" rx="4" transform="rotate(315)"/><circle r="32"/><circle r="13" fill="#f5a54b"/></g></svg></div>
<div class="gear g2"><svg viewBox="-50 -50 100 100"><g fill="#4a3a63"><rect x="-7" y="-48" width="14" height="20" rx="4"/><rect x="-7" y="-48" width="14" height="20" rx="4" transform="rotate(60)"/><rect x="-7" y="-48" width="14" height="20" rx="4" transform="rotate(120)"/><rect x="-7" y="-48" width="14" height="20" rx="4" transform="rotate(180)"/><rect x="-7" y="-48" width="14" height="20" rx="4" transform="rotate(240)"/><rect x="-7" y="-48" width="14" height="20" rx="4" transform="rotate(300)"/><circle r="32"/><circle r="13" fill="#c65a3a"/></g></svg></div>
<div class="gear g3"><svg viewBox="-50 -50 100 100"><g fill="#33254a"><rect x="-7" y="-48" width="14" height="20" rx="4"/><rect x="-7" y="-48" width="14" height="20" rx="4" transform="rotate(45)"/><rect x="-7" y="-48" width="14" height="20" rx="4" transform="rotate(90)"/><rect x="-7" y="-48" width="14" height="20" rx="4" transform="rotate(135)"/><rect x="-7" y="-48" width="14" height="20" rx="4" transform="rotate(180)"/><rect x="-7" y="-48" width="14" height="20" rx="4" transform="rotate(225)"/><rect x="-7" y="-48" width="14" height="20" rx="4" transform="rotate(270)"/><rect x="-7" y="-48" width="14" height="20" rx="4" transform="rotate(315)"/><circle r="32"/><circle r="13" fill="#8ec9ee"/></g></svg></div>
<div class="brand"><h1>齿轮黎明</h1><p>精密之美 日日更新</p></div>
<button class="replay" onclick="location.reload()">重新播放</button>
</div></body></html>
