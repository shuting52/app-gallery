<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>冰晶六角</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overflow:hidden}
.stage{position:fixed;inset:0;overflow:hidden}
.brand{position:absolute;left:0;right:0;top:60%;text-align:center;z-index:30;animation:brandIn 1.1s cubic-bezier(.2,.7,.3,1.2) 1.7s both}
.brand h1{font-size:44px;letter-spacing:14px;text-indent:14px;font-weight:800}
.brand p{margin-top:12px;font-size:13px;letter-spacing:5px;opacity:.72}
@keyframes brandIn{from{opacity:0;transform:translateY(26px) scale(.94)}to{opacity:1;transform:none}}
.replay{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);z-index:40;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:10px 28px;font-size:13px;letter-spacing:3px;cursor:pointer;backdrop-filter:blur(6px)}
.replay.dk{border-color:rgba(0,0,0,.25);background:rgba(0,0,0,.08);color:#2a2a2a}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{transform:translateY(0);opacity:0}12%{opacity:1}to{transform:translateY(-340px) translateX(var(--dx,0px));opacity:0}}
@keyframes fall{to{transform:translateY(960px)}}
@keyframes sway{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes ringX{from{transform:translateX(-50%) scale(.5);opacity:.8}to{transform:translateX(-50%) scale(1.5);opacity:0}}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}

.stage{background:linear-gradient(#0e2237,#274b6d 70%,#3a6a94)}
 .brand h1,.brand p{color:#fff}
.flake{position:absolute;top:30%;left:50%;width:220px;height:220px;margin:-110px;animation:spin 26s linear infinite}
.arm{position:absolute;top:50%;left:50%;width:200px;height:6px;margin:-3px -100px;background:linear-gradient(90deg,transparent,#d8efff 25%,#d8efff 75%,transparent);border-radius:3px;box-shadow:0 0 10px rgba(200,230,255,.7)}
.core{position:absolute;top:50%;left:50%;width:34px;height:34px;margin:-17px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#aed8f5);box-shadow:0 0 24px #bfe2ff}
.sn{position:absolute;top:-12px;border-radius:50%;background:#fff;opacity:.85;animation:fall linear infinite}
</style></head>
<body><div class="stage">
<span class="sn" style="left:97%;animation-delay:-6.0s;animation-duration:9.6s;width:8px;height:5px"></span>
<span class="sn" style="left:89%;animation-delay:-7.9s;animation-duration:7.8s;width:7px;height:8px"></span>
<span class="sn" style="left:38%;animation-delay:-2.8s;animation-duration:11.8s;width:7px;height:8px"></span>
<span class="sn" style="left:58%;animation-delay:-0.1s;animation-duration:11.8s;width:8px;height:5px"></span>
<span class="sn" style="left:31%;animation-delay:-2.3s;animation-duration:11.7s;width:5px;height:6px"></span>
<span class="sn" style="left:43%;animation-delay:-8.7s;animation-duration:9.2s;width:6px;height:6px"></span>
<span class="sn" style="left:89%;animation-delay:-2.6s;animation-duration:6.3s;width:5px;height:4px"></span>
<span class="sn" style="left:9%;animation-delay:-8.3s;animation-duration:11.3s;width:8px;height:7px"></span>
<span class="sn" style="left:34%;animation-delay:-0.3s;animation-duration:11.1s;width:7px;height:7px"></span>
<span class="sn" style="left:29%;animation-delay:-2.5s;animation-duration:11.7s;width:8px;height:7px"></span>
<span class="sn" style="left:23%;animation-delay:-9.4s;animation-duration:7.7s;width:4px;height:8px"></span>
<span class="sn" style="left:56%;animation-delay:-1.0s;animation-duration:10.5s;width:6px;height:8px"></span>
<span class="sn" style="left:25%;animation-delay:-2.7s;animation-duration:8.5s;width:5px;height:6px"></span>
<span class="sn" style="left:27%;animation-delay:-4.0s;animation-duration:11.6s;width:7px;height:5px"></span>
<span class="sn" style="left:94%;animation-delay:-6.7s;animation-duration:6.1s;width:6px;height:7px"></span>
<span class="sn" style="left:95%;animation-delay:-2.0s;animation-duration:8.7s;width:5px;height:7px"></span>
<span class="sn" style="left:6%;animation-delay:-9.1s;animation-duration:10.9s;width:6px;height:5px"></span>
<span class="sn" style="left:24%;animation-delay:-6.8s;animation-duration:8.0s;width:4px;height:4px"></span>
<span class="sn" style="left:79%;animation-delay:-1.8s;animation-duration:8.9s;width:8px;height:6px"></span>
<span class="sn" style="left:65%;animation-delay:-9.4s;animation-duration:8.1s;width:7px;height:6px"></span>
<span class="sn" style="left:11%;animation-delay:-2.6s;animation-duration:10.3s;width:8px;height:5px"></span>
<span class="sn" style="left:42%;animation-delay:-1.4s;animation-duration:8.2s;width:5px;height:7px"></span>
<div class="flake">
<span class="arm" style="transform:rotate(0deg)"></span>
<span class="arm" style="transform:rotate(60deg)"></span>
<span class="arm" style="transform:rotate(120deg)"></span>
<span class="arm" style="transform:rotate(180deg)"></span>
<span class="arm" style="transform:rotate(240deg)"></span>
<span class="arm" style="transform:rotate(300deg)"></span>
<span class="core"></span></div>
<div class="brand"><h1>冰晶</h1><p>每一片雪花 独一无二</p></div>
<button class="replay">重新播放</button>
<script>
var tpl=document.body.innerHTML;
function bind(){document.querySelector('.replay').onclick=function(){document.body.innerHTML=tpl;bind();};}
bind();
</script>
</div></body></html>
