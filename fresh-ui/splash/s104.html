<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>流星许愿</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000}
body{width:430px;height:900px;margin:0 auto;position:relative;overflow:hidden;
font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:#fff}

body{background:linear-gradient(#04061a 0%,#0a1030 60%,#141a44 100%)}
.stars i{position:absolute;border-radius:50%;background:#fff;animation:tw 2.8s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}
.meteor{position:absolute;width:170px;height:3px;border-radius:3px;
background:linear-gradient(90deg,#fff,rgba(160,200,255,0));transform:rotate(-32deg);
animation:shoot 4.5s ease-in infinite}
@keyframes shoot{0%{transform:rotate(-32deg) translateX(0);opacity:0}
8%{opacity:1}45%{transform:rotate(-32deg) translateX(-420px);opacity:0}100%{transform:rotate(-32deg) translateX(-420px);opacity:0}}
.meteor .hd{position:absolute;right:-4px;top:50%;width:10px;height:10px;transform:translateY(-50%);border-radius:50%;
background:#fff;box-shadow:0 0 16px 6px rgba(180,210,255,.9)}
.wish{position:absolute;left:50%;top:430px;transform:translateX(-50%);width:220px;height:220px;z-index:2}
.wish .ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(170,200,255,.0);
animation:ringG 4.5s ease-in-out infinite}
@keyframes ringG{0%,55%{transform:scale(.6);opacity:0;border-color:rgba(170,200,255,0)}
70%{opacity:1;border-color:rgba(190,215,255,.8)}100%{transform:scale(1.25);opacity:0}}
.wish .core{position:absolute;left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%);border-radius:50%;
background:radial-gradient(circle at 40% 35%,#fff,#bcd4ff 60%,#7a9fe8);box-shadow:0 0 40px 14px rgba(160,195,255,.65);
animation:coreP 4.5s ease-in-out infinite}
@keyframes coreP{0%,55%{transform:translate(-50%,-50%) scale(.4);opacity:0}75%,100%{transform:translate(-50%,-50%) scale(1);opacity:1}}

.brand{position:absolute;left:0;right:0;bottom:150px;text-align:center;z-index:20;
animation:brandIn 1.1s cubic-bezier(.2,.7,.3,1.2) .9s both}
.brand h1{font-size:36px;letter-spacing:10px;font-weight:800;text-shadow:0 4px 24px rgba(0,0,0,.45)}
.brand p{margin-top:12px;font-size:13px;letter-spacing:6px;opacity:.75}
@keyframes brandIn{from{opacity:0;transform:translateY(26px) scale(.94)}}
.replay{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);z-index:30;
background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;
border-radius:24px;padding:10px 26px;font-size:13px;letter-spacing:2px;cursor:pointer;
backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body>
<div id="st">
<div class="stars"><i style="left:40px;top:80px;width:3px;height:3px"></i>
<i style="left:140px;top:160px;width:2px;height:2px;animation-delay:-1s"></i>
<i style="left:260px;top:90px;width:3px;height:3px;animation-delay:-2s"></i>
<i style="left:360px;top:200px;width:2px;height:2px;animation-delay:-.5s"></i>
<i style="left:90px;top:300px;width:2px;height:2px;animation-delay:-1.6s"></i>
<i style="left:320px;top:330px;width:3px;height:3px;animation-delay:-2.4s"></i></div>
<div class="meteor" style="right:40px;top:120px;animation-delay:-.5s"><div class="hd"></div></div>
<div class="meteor" style="right:120px;top:260px;animation-delay:-2.2s;animation-duration:5.5s"><div class="hd"></div></div>
<div class="meteor" style="right:-30px;top:200px;animation-delay:-3.6s;animation-duration:4s"><div class="hd"></div></div>
<div class="wish"><div class="ring"></div><div class="core"></div></div>
</div>
<div class="brand"><h1>流星许愿</h1><p>MAKE A WISH</p></div>
<button class="replay" onclick="var s=document.getElementById('st');var c=s.cloneNode(true);s.replaceWith(c);">重新播放</button>
</body></html>
