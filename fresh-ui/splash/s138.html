<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>冰河裂变</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overflow:hidden}
.stage{position:fixed;inset:0;overflow:hidden}
.brand{position:absolute;left:0;right:0;top:60%;text-align:center;z-index:30;animation:brandIn 1.1s cubic-bezier(.2,.7,.3,1.2) 1.7s both}
.brand h1{font-size:44px;letter-spacing:14px;text-indent:14px;font-weight:800}
.brand p{margin-top:12px;font-size:13px;letter-spacing:5px;opacity:.72}
@keyframes brandIn{from{opacity:0;transform:translateY(26px) scale(.94)}to{opacity:1;transform:none}}
.replay{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);z-index:40;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:10px 28px;font-size:13px;letter-spacing:3px;cursor:pointer;backdrop-filter:blur(6px)}
.replay.dk{border-color:rgba(0,0,0,.25);background:rgba(0,0,0,.08);color:#2a2a2a}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{transform:translateY(0);opacity:0}12%{opacity:1}to{transform:translateY(-340px) translateX(var(--dx,0px));opacity:0}}
@keyframes fall{to{transform:translateY(960px)}}
@keyframes sway{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes ringX{from{transform:translateX(-50%) scale(.5);opacity:.8}to{transform:translateX(-50%) scale(1.5);opacity:0}}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}

.stage{background:linear-gradient(#062a33,#0b4a5a 70%,#0e5a6e)}
 .brand h1,.brand p{color:#fff}
.crack{position:absolute;bottom:0;left:50%;width:12px;height:430px;margin-left:-6px;background:linear-gradient(transparent,#8df9ff);filter:blur(7px);box-shadow:0 0 46px #7df9ff;animation:tw 3s infinite}
.ice{position:absolute;bottom:0;width:240px;height:310px;background:linear-gradient(#cfeef6,#7fc4d8);animation:split 3s ease 1s both}
.il{left:0;clip-path:polygon(0 18%,78% 0,100% 100%,0 100%)}
.ir{right:0;clip-path:polygon(22% 0,100% 18%,100% 100%,0 100%)}
@keyframes split{from{transform:translateX(0)}to{transform:translateX(var(--sx))}}
.il{--sx:-26px}.ir{--sx:26px}
.shd{position:absolute;background:rgba(200,235,245,.7);border-radius:3px;animation:hover 5s ease-in-out infinite}
</style></head>
<body><div class="stage">
<div class="crack"></div><div class="ice il"></div><div class="ice ir"></div>
<span class="shd" style="left:49%;bottom:5%;width:23px;height:22px;transform:rotate(70deg);animation-delay:-2.2s"></span>
<span class="shd" style="left:75%;bottom:18%;width:26px;height:27px;transform:rotate(56deg);animation-delay:-0.8s"></span>
<span class="shd" style="left:47%;bottom:24%;width:33px;height:28px;transform:rotate(64deg);animation-delay:-4.9s"></span>
<span class="shd" style="left:33%;bottom:10%;width:31px;height:23px;transform:rotate(33deg);animation-delay:-2.2s"></span>
<span class="shd" style="left:85%;bottom:21%;width:32px;height:32px;transform:rotate(30deg);animation-delay:-2.1s"></span>
<span class="shd" style="left:90%;bottom:15%;width:33px;height:19px;transform:rotate(55deg);animation-delay:-1.5s"></span>
<span class="shd" style="left:58%;bottom:28%;width:15px;height:20px;transform:rotate(34deg);animation-delay:-5.0s"></span>
<span class="shd" style="left:82%;bottom:24%;width:28px;height:33px;transform:rotate(50deg);animation-delay:-3.3s"></span>
<div class="brand"><h1>冰裂</h1><p>裂缝之处 光透进来</p></div>
<button class="replay">重新播放</button>
<script>
var tpl=document.body.innerHTML;
function bind(){document.querySelector('.replay').onclick=function(){document.body.innerHTML=tpl;bind();};}
bind();
</script>
</div></body></html>
