<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>火焰纹章</title><style>*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{width:430px;min-height:900px;margin:0 auto;position:relative;overflow:hidden;color:#fff;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;background:#160903}
#app{position:absolute;inset:0}
.brand{position:absolute;left:0;right:0;bottom:112px;text-align:center;z-index:10;opacity:0;transform:translateY(16px);animation:brandIn .9s cubic-bezier(.2,.7,.3,1.2) 2.3s both}
.brand h1{font-size:34px;letter-spacing:10px;font-weight:800;text-indent:10px}
.brand p{margin-top:10px;font-size:12px;letter-spacing:5px;opacity:.7;text-indent:5px}
@keyframes brandIn{to{opacity:1;transform:none}}
.tag{position:absolute;top:56px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:8px;text-indent:8px;opacity:0;z-index:10;animation:brandIn 1s ease 2.7s both;color:rgba(255,255,255,.65)}
.replay{position:absolute;left:50%;bottom:42px;transform:translateX(-50%);z-index:20;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:20px;padding:8px 24px;font-size:13px;letter-spacing:2px;cursor:pointer;backdrop-filter:blur(6px)}

.flame{position:absolute;bottom:-30px;width:14px;height:14px;display:block;border-radius:50%;background:radial-gradient(circle,#ffd76e,#ff7a1a 60%,transparent 70%);filter:blur(2px);animation:rise linear infinite}
@keyframes rise{from{transform:translateY(0) scale(1);opacity:0}15%{opacity:1}to{transform:translateY(-880px) scale(.3);opacity:0}}
.emblem{position:absolute;left:50%;top:330px;width:150px;height:170px;transform:translateX(-50%) scale(0);animation:emb 1.1s cubic-bezier(.2,.8,.3,1.4) .7s both;filter:drop-shadow(0 0 26px rgba(255,122,26,.8))}
@keyframes emb{to{transform:translateX(-50%) scale(1)}}
.emblem .sh{position:absolute;inset:0;background:linear-gradient(160deg,#ff9a3c,#e23c0e);clip-path:polygon(50% 0,100% 22%,100% 62%,50% 100%,0 62%,0 22%)}
.emblem .in{position:absolute;inset:16px;background:#160903;clip-path:polygon(50% 0,100% 22%,100% 62%,50% 100%,0 62%,0 22%);display:flex;align-items:center;justify-content:center}
.emblem .in b{font-size:52px;color:#ffb03c;text-shadow:0 0 18px #ff7a1a;animation:flick 1.6s ease-in-out -0.5s infinite}
@keyframes flick{50%{opacity:.75;transform:scale(.94)}}
.glow{position:absolute;left:50%;top:300px;width:340px;height:340px;transform:translateX(-50%);background:radial-gradient(circle,rgba(255,110,20,.35),transparent 70%);animation:glowp 3s ease-in-out -1s infinite}
@keyframes glowp{50%{transform:translateX(-50%) scale(1.12);opacity:.7}}
</style></head><body><div id="app"><div class="glow"></div><i class="flame" style="left:115px;animation-delay:-2.99s;animation-duration:5.26s;"></i><i class="flame" style="left:189px;animation-delay:-2.48s;animation-duration:4.95s;"></i><i class="flame" style="left:212px;animation-delay:-4.79s;animation-duration:3.44s;"></i><i class="flame" style="left:105px;animation-delay:-1.32s;animation-duration:3.10s;"></i><i class="flame" style="left:144px;animation-delay:-3.47s;animation-duration:5.21s;"></i><i class="flame" style="left:178px;animation-delay:-0.87s;animation-duration:6.75s;"></i><i class="flame" style="left:233px;animation-delay:-4.79s;animation-duration:6.50s;"></i><i class="flame" style="left:351px;animation-delay:-3.21s;animation-duration:6.19s;"></i><i class="flame" style="left:363px;animation-delay:-0.29s;animation-duration:3.92s;"></i><i class="flame" style="left:89px;animation-delay:-1.18s;animation-duration:4.08s;"></i><i class="flame" style="left:112px;animation-delay:-5.71s;animation-duration:6.05s;"></i><i class="flame" style="left:97px;animation-delay:-4.98s;animation-duration:5.45s;"></i><i class="flame" style="left:35px;animation-delay:-1.29s;animation-duration:3.33s;"></i><i class="flame" style="left:399px;animation-delay:-5.21s;animation-duration:3.57s;"></i><i class="flame" style="left:190px;animation-delay:-1.41s;animation-duration:4.95s;"></i><i class="flame" style="left:291px;animation-delay:-4.55s;animation-duration:6.43s;"></i><i class="flame" style="left:83px;animation-delay:-3.54s;animation-duration:6.21s;"></i><i class="flame" style="left:161px;animation-delay:-5.65s;animation-duration:5.88s;"></i><i class="flame" style="left:37px;animation-delay:-3.54s;animation-duration:4.37s;"></i><i class="flame" style="left:201px;animation-delay:-5.18s;animation-duration:6.70s;"></i><i class="flame" style="left:333px;animation-delay:-2.71s;animation-duration:4.20s;"></i><i class="flame" style="left:158px;animation-delay:-4.45s;animation-duration:4.63s;"></i><i class="flame" style="left:200px;animation-delay:-1.50s;animation-duration:3.38s;"></i><i class="flame" style="left:383px;animation-delay:-0.62s;animation-duration:5.14s;"></i><i class="flame" style="left:225px;animation-delay:-5.46s;animation-duration:3.87s;"></i><i class="flame" style="left:18px;animation-delay:-5.34s;animation-duration:5.89s;"></i><div class="emblem"><div class="sh"></div><div class="in"><b>&#128293;</b></div></div><div class="tag">FIRE EMBLEM</div><div class="brand"><h1>火焰纹章</h1><p>燃情而来 · 烈焰新生</p></div></div><button class="replay">&#8635; 重新播放</button><script>document.querySelector('.replay').onclick=function(){var a=document.getElementById('app');var c=a.cloneNode(true);a.replaceWith(c);};</script></body></html>
