<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>蜂鸟之舞</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overflow:hidden}
.stage{position:fixed;inset:0;overflow:hidden}
.brand{position:absolute;left:0;right:0;top:60%;text-align:center;z-index:30;animation:brandIn 1.1s cubic-bezier(.2,.7,.3,1.2) 1.7s both}
.brand h1{font-size:44px;letter-spacing:14px;text-indent:14px;font-weight:800}
.brand p{margin-top:12px;font-size:13px;letter-spacing:5px;opacity:.72}
@keyframes brandIn{from{opacity:0;transform:translateY(26px) scale(.94)}to{opacity:1;transform:none}}
.replay{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);z-index:40;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:10px 28px;font-size:13px;letter-spacing:3px;cursor:pointer;backdrop-filter:blur(6px)}
.replay.dk{border-color:rgba(0,0,0,.25);background:rgba(0,0,0,.08);color:#2a2a2a}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{transform:translateY(0);opacity:0}12%{opacity:1}to{transform:translateY(-340px) translateX(var(--dx,0px));opacity:0}}
@keyframes fall{to{transform:translateY(960px)}}
@keyframes sway{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes ringX{from{transform:translateX(-50%) scale(.5);opacity:.8}to{transform:translateX(-50%) scale(1.5);opacity:0}}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}

.stage{background:linear-gradient(#0f3d33,#1f7a5e 70%,#2a9a72)}
 .brand h1,.brand p{color:#fff}
.flw{position:absolute;bottom:8%;width:0}
.fm{position:absolute;bottom:0;left:-3px;width:6px;height:150px;background:#2f7a4e;border-radius:3px}
.fb{position:absolute;bottom:150px;left:-26px;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff9ec4,#f45a92);box-shadow:0 0 18px rgba(244,90,146,.6)}
.hum{position:absolute;top:34%;left:50%;margin-left:-27px;animation:hover2 3.2s ease-in-out infinite}
@keyframes hover2{0%,100%{transform:translate(0,0)}50%{transform:translate(24px,-22px)}}
.hb{position:absolute;width:56px;height:30px;background:linear-gradient(90deg,#27c184,#a5f2cb);border-radius:50%;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.beak{position:absolute;left:54px;top:10px;width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:22px solid #e8a33d}
.hw{position:absolute;left:8px;width:62px;height:15px;background:rgba(255,255,255,.8);border-radius:50%;transform-origin:left center}
.hu{top:-12px;animation:buzz .16s linear infinite alternate}
.hd{top:26px;animation:buzz .16s linear infinite alternate-reverse}
@keyframes buzz{from{transform:rotate(-40deg)}to{transform:rotate(40deg)}}
</style></head>
<body><div class="stage">
<div class="flw" style="left:12%"><span class="fm"></span><span class="fb"></span></div>
<div class="flw" style="left:44%"><span class="fm"></span><span class="fb"></span></div>
<div class="flw" style="left:76%"><span class="fm"></span><span class="fb"></span></div>
<div class="hum"><span class="hw hu"></span><span class="hw hd"></span><span class="hb"></span><span class="beak"></span></div>
<div class="brand"><h1>蜂鸟</h1><p>小小身躯 大大能量</p></div>
<button class="replay">重新播放</button>
<script>
var tpl=document.body.innerHTML;
function bind(){document.querySelector('.replay').onclick=function(){document.body.innerHTML=tpl;bind();};}
bind();
</script>
</div></body></html>
