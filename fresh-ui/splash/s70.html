<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>摩天轮</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{width:430px;height:900px;margin:0 auto;position:relative;overflow:hidden;
font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
background:linear-gradient(180deg,#2b1a4e 0%,#7a3f8f 55%,#e88ca0 100%);color:#fff}
.scene{position:absolute;inset:0}

.gndd{position:absolute;bottom:0;left:0;right:0;height:120px;background:#1d1030}
.leg{position:absolute;bottom:110px;width:26px;height:330px;background:linear-gradient(#3a2450,#241436)}
.leg.l{left:150px;transform:rotate(14deg);transform-origin:bottom}
.leg.r{right:150px;transform:rotate(-14deg);transform-origin:bottom}
.wheel{position:absolute;left:50%;top:180px;width:300px;height:300px;margin-left:-150px;animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rim{position:absolute;inset:0;border:10px solid rgba(255,255,255,.9);border-radius:50%;box-shadow:0 0 30px rgba(255,200,220,.5)}
.spoke{position:absolute;left:50%;top:50%;width:6px;height:292px;margin:-146px 0 0 -3px;background:rgba(255,255,255,.55);display:block}
.hub{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:radial-gradient(circle at 38% 35%,#fff,#e8b8d0);box-shadow:0 0 20px rgba(255,220,235,.8)}
.cab{position:absolute;width:36px;height:32px;margin:-16px 0 0 -18px}
.cabin{width:100%;height:100%;border-radius:9px;animation:spinRev 24s linear infinite;box-shadow:0 4px 10px rgba(0,0,0,.3)}
@keyframes spinRev{to{transform:rotate(-360deg)}}

.brand{position:absolute;left:0;right:0;bottom:118px;text-align:center;z-index:5;
color:#ffe9f2;opacity:0;animation:brandIn 1s ease 2.2s both}
.brand h1{font-size:34px;letter-spacing:8px;font-weight:800;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.brand p{font-size:13px;letter-spacing:3px;margin-top:10px;opacity:.85;text-shadow:0 1px 10px rgba(0,0,0,.35)}
@keyframes brandIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.replay{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);z-index:6;
padding:10px 28px;border-radius:24px;border:1px solid rgba(255,255,255,.45);
background:rgba(255,255,255,.14);color:#ffe9f2;font-size:14px;letter-spacing:2px;cursor:pointer}
</style></head><body>
<div class="scene"><div class="gndd"></div><div class="leg l"></div><div class="leg r"></div>
<div class="wheel"><div class="rim"></div><i class="spoke" style="transform:rotate(0deg)"></i><i class="spoke" style="transform:rotate(45deg)"></i><i class="spoke" style="transform:rotate(90deg)"></i><i class="spoke" style="transform:rotate(135deg)"></i><div class="hub"></div><div class="cab" style="left:288px;top:150px"><div class="cabin" style="background:linear-gradient(#ffd93d,#ff9d3c)"></div></div><div class="cab" style="left:248px;top:248px"><div class="cabin" style="background:linear-gradient(#ff8fb8,#e14b7a)"></div></div><div class="cab" style="left:150px;top:288px"><div class="cabin" style="background:linear-gradient(#7dc9ff,#2a7fd0)"></div></div><div class="cab" style="left:52px;top:248px"><div class="cabin" style="background:linear-gradient(#9dffb0,#3cb56e)"></div></div><div class="cab" style="left:12px;top:150px"><div class="cabin" style="background:linear-gradient(#d0a8ff,#8a5cd6)"></div></div><div class="cab" style="left:52px;top:52px"><div class="cabin" style="background:linear-gradient(#ffb27d,#e07f3c)"></div></div><div class="cab" style="left:150px;top:12px"><div class="cabin" style="background:linear-gradient(#8ef0e2,#2ea89a)"></div></div><div class="cab" style="left:248px;top:52px"><div class="cabin" style="background:linear-gradient(#ff9d9d,#d64545)"></div></div></div></div>
<div class="brand"><h1>摩天轮</h1><p>兜兜转转 皆是风景</p></div>
<button class="replay" onclick="location.reload()">重新播放</button>
</body></html>
