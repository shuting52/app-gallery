<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>霓虹勾勒 · 启动页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#030408;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.stage{width:430px;height:900px;max-width:100vw;max-height:100vh;position:relative;overflow:hidden;background:
radial-gradient(90% 60% at 50% 30%,#101428 0%,#05060c 60%,#020308 100%)}
.grid-bg{position:absolute;inset:0;opacity:.25;
background:linear-gradient(rgba(90,120,255,.25) 1px,transparent 1px),linear-gradient(90deg,rgba(90,120,255,.25) 1px,transparent 1px);
background-size:44px 44px;transform:perspective(500px) rotateX(38deg) scale(1.6);transform-origin:50% 100%}
.neon{position:absolute;left:50%;top:250px;width:220px;height:220px;margin:-110px 0 0 -110px;z-index:4;
filter:drop-shadow(0 0 10px #ff4fd8) drop-shadow(0 0 30px rgba(255,79,216,.6))}
.neon path{fill:none;stroke:#ff7ae2;stroke-width:5;stroke-linecap:round;
stroke-dasharray:640;stroke-dashoffset:640;animation:draw 2.2s ease-out both}
.neon path.p2{stroke:#5ff2ff;filter:drop-shadow(0 0 8px #5ff2ff);stroke-dasharray:200;stroke-dashoffset:200;animation-delay:.9s}
@keyframes draw{0%{stroke-dashoffset:640}100%{stroke-dashoffset:0}}
.neon path.p2{animation-name:draw2}
@keyframes draw2{0%{stroke-dashoffset:200}100%{stroke-dashoffset:0}}
.flick{animation:flick 3.2s linear both;animation-delay:2.2s}
@keyframes flick{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.4}94%{opacity:1}96%{opacity:.6}97%{opacity:1}}
.brand{position:absolute;left:0;right:0;top:600px;text-align:center;z-index:6;
opacity:0;animation:fadeUp 1s ease-out both;animation-delay:2.3s}
.brand h1{font-size:36px;font-weight:700;letter-spacing:14px;color:#ffe9fa;text-indent:14px;
text-shadow:0 0 18px rgba(255,79,216,.8)}
.brand p{font-size:13px;letter-spacing:6px;color:#8f9bd8;margin-top:12px;text-indent:6px}
@keyframes fadeUp{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:translateY(0)}}
.replay{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);z-index:50;
border:1px solid rgba(255,122,226,.5);background:rgba(255,79,216,.08);color:#ffc7ef;
font-size:13px;letter-spacing:3px;padding:10px 26px;border-radius:24px;cursor:pointer}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body>
<div class="stage">
  <div class="grid-bg"></div>
  <svg class="neon flick" viewBox="0 0 220 220">
    <path d="M110 18 L188 64 L188 156 L110 202 L32 156 L32 64 Z"/>
    <path class="p2" d="M110 70 L142 88 L142 132 L110 150 L78 132 L78 88 Z"/>
  </svg>
  <div class="brand"><h1>霓都</h1><p>点亮你的夜</p></div>
  <button class="replay">重新播放</button>
</div>
<script>
function bind(){document.querySelector('.replay').addEventListener('click',()=>{
const s=document.querySelector('.stage');const n=s.cloneNode(true);s.replaceWith(n);bind();});}
bind();
</script>
</body></html>
