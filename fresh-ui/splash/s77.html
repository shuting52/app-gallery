<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>冰川裂变</title><style>*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{width:430px;min-height:900px;margin:0 auto;position:relative;overflow:hidden;color:#fff;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;background:linear-gradient(180deg,#0a1626 0%,#0e2740 70%,#123449 100%)}
#app{position:absolute;inset:0}
.brand{position:absolute;left:0;right:0;bottom:112px;text-align:center;z-index:10;opacity:0;transform:translateY(16px);animation:brandIn .9s cubic-bezier(.2,.7,.3,1.2) 2.3s both}
.brand h1{font-size:34px;letter-spacing:10px;font-weight:800;text-indent:10px}
.brand p{margin-top:10px;font-size:12px;letter-spacing:5px;opacity:.7;text-indent:5px}
@keyframes brandIn{to{opacity:1;transform:none}}
.tag{position:absolute;top:56px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:8px;text-indent:8px;opacity:0;z-index:10;animation:brandIn 1s ease 2.7s both;color:rgba(255,255,255,.65)}
.replay{position:absolute;left:50%;bottom:42px;transform:translateX(-50%);z-index:20;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:20px;padding:8px 24px;font-size:13px;letter-spacing:2px;cursor:pointer;backdrop-filter:blur(6px)}

.crack{position:absolute;inset:0;width:430px;height:900px}
.crack path{stroke:#9fdcff;stroke-width:3;fill:none;filter:drop-shadow(0 0 8px #6ec6ff);stroke-dasharray:900;stroke-dashoffset:900;animation:crack 2.2s ease-out .3s both}
.crack path:nth-child(2){animation-delay:.8s}.crack path:nth-child(3){animation-delay:1.2s}
@keyframes crack{to{stroke-dashoffset:0}}
.shard{position:absolute;bottom:0;width:0;height:0;display:block;border-left:60px solid transparent;border-right:60px solid transparent;border-bottom:150px solid rgba(140,210,250,.28);animation:rise3 2.4s ease-out .9s both;transform-origin:bottom}
@keyframes rise3{from{transform:translateY(120px) scale(.6);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.snow{position:absolute;top:-16px;width:8px;height:8px;display:block;border-radius:50%;background:#dff2ff;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(940px);opacity:.2}}
.iceglow{position:absolute;left:50%;top:200px;width:380px;height:380px;transform:translateX(-50%);background:radial-gradient(circle,rgba(110,198,255,.22),transparent 70%);animation:glowp 4s ease-in-out -2s infinite}
@keyframes glowp{50%{opacity:.6;transform:translateX(-50%) scale(1.1)}}
</style></head><body><div id="app"><div class="iceglow"></div><svg class="crack" viewBox="0 0 430 900"><path d="M215,120 L200,300 L228,470 L198,660 L215,830"/><path d="M208,340 L120,430 L70,560"/><path d="M222,430 L320,520 L370,660"/></svg><div class="shard" style="left:60px"></div><div class="shard" style="left:250px;border-bottom-width:200px;animation-delay:1.1s"></div><div class="shard" style="left:150px;border-bottom-width:110px;animation-delay:1.3s"></div><i class="snow" style="left:317px;animation-delay:-4.03s;animation-duration:5.00s;"></i><i class="snow" style="left:182px;animation-delay:-1.45s;animation-duration:7.41s;"></i><i class="snow" style="left:147px;animation-delay:-0.84s;animation-duration:6.83s;"></i><i class="snow" style="left:383px;animation-delay:-1.65s;animation-duration:5.94s;"></i><i class="snow" style="left:261px;animation-delay:-2.11s;animation-duration:7.95s;"></i><i class="snow" style="left:280px;animation-delay:-3.64s;animation-duration:8.73s;"></i><i class="snow" style="left:245px;animation-delay:-1.30s;animation-duration:8.81s;"></i><i class="snow" style="left:247px;animation-delay:-2.81s;animation-duration:6.12s;"></i><i class="snow" style="left:39px;animation-delay:-3.06s;animation-duration:7.48s;"></i><i class="snow" style="left:153px;animation-delay:-3.02s;animation-duration:9.30s;"></i><i class="snow" style="left:354px;animation-delay:-0.63s;animation-duration:5.67s;"></i><i class="snow" style="left:87px;animation-delay:-0.85s;animation-duration:9.14s;"></i><i class="snow" style="left:85px;animation-delay:-1.33s;animation-duration:5.16s;"></i><i class="snow" style="left:160px;animation-delay:-2.23s;animation-duration:6.98s;"></i><i class="snow" style="left:350px;animation-delay:-4.71s;animation-duration:5.76s;"></i><i class="snow" style="left:179px;animation-delay:-4.38s;animation-duration:8.70s;"></i><i class="snow" style="left:282px;animation-delay:-5.33s;animation-duration:5.87s;"></i><i class="snow" style="left:25px;animation-delay:-0.25s;animation-duration:6.22s;"></i><i class="snow" style="left:72px;animation-delay:-4.24s;animation-duration:7.17s;"></i><i class="snow" style="left:65px;animation-delay:-1.77s;animation-duration:7.54s;"></i><i class="snow" style="left:141px;animation-delay:-0.22s;animation-duration:7.74s;"></i><i class="snow" style="left:288px;animation-delay:-4.06s;animation-duration:7.06s;"></i><i class="snow" style="left:379px;animation-delay:-5.01s;animation-duration:9.81s;"></i><i class="snow" style="left:117px;animation-delay:-5.92s;animation-duration:6.98s;"></i><i class="snow" style="left:343px;animation-delay:-2.37s;animation-duration:7.31s;"></i><i class="snow" style="left:13px;animation-delay:-2.81s;animation-duration:9.99s;"></i><i class="snow" style="left:339px;animation-delay:-0.95s;animation-duration:5.27s;"></i><i class="snow" style="left:70px;animation-delay:-4.16s;animation-duration:8.80s;"></i><i class="snow" style="left:233px;animation-delay:-4.15s;animation-duration:5.33s;"></i><i class="snow" style="left:125px;animation-delay:-2.11s;animation-duration:8.07s;"></i><div class="tag">GLACIER</div><div class="brand"><h1>冰川裂变</h1><p>万年冰封 · 一瞬破晓</p></div></div><button class="replay">&#8635; 重新播放</button><script>document.querySelector('.replay').onclick=function(){var a=document.getElementById('app');var c=a.cloneNode(true);a.replaceWith(c);};</script></body></html>
