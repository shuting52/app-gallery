<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>天际漫游</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overflow:hidden}
.stage{position:fixed;inset:0;overflow:hidden}
.brand{position:absolute;left:0;right:0;top:60%;text-align:center;z-index:30;animation:brandIn 1.1s cubic-bezier(.2,.7,.3,1.2) 1.7s both}
.brand h1{font-size:44px;letter-spacing:14px;text-indent:14px;font-weight:800}
.brand p{margin-top:12px;font-size:13px;letter-spacing:5px;opacity:.72}
@keyframes brandIn{from{opacity:0;transform:translateY(26px) scale(.94)}to{opacity:1;transform:none}}
.replay{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);z-index:40;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:10px 28px;font-size:13px;letter-spacing:3px;cursor:pointer;backdrop-filter:blur(6px)}
.replay.dk{border-color:rgba(0,0,0,.25);background:rgba(0,0,0,.08);color:#2a2a2a}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{transform:translateY(0);opacity:0}12%{opacity:1}to{transform:translateY(-340px) translateX(var(--dx,0px));opacity:0}}
@keyframes fall{to{transform:translateY(960px)}}
@keyframes sway{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes ringX{from{transform:translateX(-50%) scale(.5);opacity:.8}to{transform:translateX(-50%) scale(1.5);opacity:0}}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}

.stage{background:linear-gradient(#ff9a6a,#ffd9a0 48%,#aee3f5)}
 .brand h1{color:#2b2b33}.brand p{color:#5a5a66}
.bal{position:absolute;top:14%;left:50%;width:170px;margin-left:-85px;animation:hover 5.5s ease-in-out infinite}
.env{width:170px;height:150px;border-radius:50%;background:repeating-linear-gradient(90deg,#ff5a5a 0 26px,#fff4ec 26px 52px);box-shadow:inset -14px -18px 30px rgba(120,40,20,.25)}
.rope{width:2px;height:26px;margin:0 auto;background:#7a4a2a}
.rope{box-shadow:-24px 0 0 #7a4a2a,24px 0 0 #7a4a2a}
.bask{width:58px;height:44px;margin:0 auto;background:linear-gradient(#a06a3a,#7a4a24);border-radius:8px}
.cl2{position:absolute;height:30px;background:rgba(255,255,255,.9);border-radius:999px;animation:driftC linear infinite}
.mts{position:absolute;bottom:-70px;left:-10%;width:120%;height:190px;background:#7fb8d9;border-radius:50% 50% 0 0;opacity:.8}
</style></head>
<body><div class="stage">
<span class="cl2" style="top:41%;width:123px;animation-delay:-3.4s;animation-duration:20.0s"></span>
<span class="cl2" style="top:63%;width:127px;animation-delay:-13.9s;animation-duration:15.2s"></span>
<span class="cl2" style="top:50%;width:87px;animation-delay:-5.8s;animation-duration:12.4s"></span>
<span class="cl2" style="top:57%;width:105px;animation-delay:-11.1s;animation-duration:13.3s"></span>
<div class="bal"><div class="env"></div><div class="rope"></div><div class="bask"></div></div><div class="mts"></div>
<div class="brand"><h1>乘风</h1><p>升空 看更大的世界</p></div>
<button class="replay dk">重新播放</button>
<script>
var tpl=document.body.innerHTML;
function bind(){document.querySelector('.replay').onclick=function(){document.body.innerHTML=tpl;bind();};}
bind();
</script>
</div></body></html>
