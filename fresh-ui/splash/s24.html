<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>熔岩灯</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0a0512;display:flex;justify-content:center;font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;overflow:hidden}
.stage{width:430px;height:900px;max-height:100vh;position:relative;overflow:hidden;background:radial-gradient(90% 70% at 50% 40%,#1d0f2e 0%,#0a0512 70%)}
.glow{position:absolute;left:50%;top:400px;width:340px;height:340px;margin:-170px;background:radial-gradient(circle,rgba(255,110,60,.28),transparent 65%);animation:pulse 3s ease-in-out -1.5s infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.12);opacity:1}}
.lamp{position:absolute;left:50%;top:180px;width:190px;height:420px;margin-left:-95px;animation:fadein 1s ease .2s both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.cap{position:absolute;left:50%;top:158px;width:110px;height:34px;margin-left:-55px;background:linear-gradient(180deg,#4a4a58,#23232e);border-radius:10px 10px 4px 4px;z-index:5}
.glass{position:absolute;left:0;top:0;width:190px;height:420px;background:linear-gradient(180deg,rgba(255,140,80,.16),rgba(255,80,40,.07));border:3px solid rgba(255,255,255,.22);border-radius:80px 80px 90px 90px / 60px 60px 110px 110px;overflow:hidden;box-shadow:inset 0 0 40px rgba(255,120,60,.25)}
.base{position:absolute;left:50%;top:600px;width:170px;height:44px;margin-left:-85px;background:linear-gradient(180deg,#3d3d4c,#1b1b24);border-radius:12px;z-index:5}
.blob{position:absolute;left:50%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd166,#ff7b3d 55%,#e8382a);filter:blur(1px);animation:rise 5s ease-in -2s infinite}
.blob.b1{width:64px;height:64px;margin-left:-32px;bottom:-70px}
.blob.b2{width:44px;height:44px;margin-left:-22px;bottom:-50px;animation-duration:6.5s;animation-delay:-4.5s}
.blob.b3{width:84px;height:84px;margin-left:-42px;bottom:-90px;animation-duration:7.5s;animation-delay:-1s}
.blob.b4{width:34px;height:34px;margin-left:-17px;bottom:-40px;animation-duration:4.2s;animation-delay:-3.2s}
@keyframes rise{0%{transform:translateY(0) scale(1);border-radius:50%}35%{border-radius:40% 60% 55% 45%}70%{transform:translateY(-380px) scale(.92);border-radius:60% 40% 45% 55%}100%{transform:translateY(-420px) scale(.4);opacity:0;border-radius:50%}}
.brand{position:absolute;left:0;right:0;bottom:170px;text-align:center;animation:up 1.2s ease 1.1s both}
.brand h1{font-size:50px;letter-spacing:18px;text-indent:18px;color:#ffd9b8;font-weight:800;text-shadow:0 0 30px rgba(255,120,60,.6)}
.brand p{margin-top:12px;font-size:13px;letter-spacing:7px;color:#a97f66}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.replay{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);z-index:50;padding:10px 26px;border-radius:999px;border:1px solid rgba(255,180,120,.5);background:rgba(255,120,60,.12);color:#ffd9b8;font-size:13px;letter-spacing:4px;text-indent:4px;cursor:pointer}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body><div class="stage">
<div class="glow"></div>
<div class="lamp"><div class="glass">
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
</div></div>
<div class="cap"></div><div class="base"></div>
<div class="brand"><h1>熔岩灯</h1><p>慢热 也有光</p></div>
<button class="replay" onclick="location.reload()">重新播放</button>
</div></body></html>
