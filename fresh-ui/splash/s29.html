<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>棱镜万花</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#07040f;display:flex;justify-content:center;font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;overflow:hidden}
.stage{width:430px;height:900px;max-height:100vh;position:relative;overflow:hidden;background:radial-gradient(90% 70% at 50% 42%,#160b28 0%,#07040f 70%)}
.scope{position:absolute;left:50%;top:120px;width:560px;height:560px;margin-left:-280px}
.disc{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(#ff5d8f 0 15deg,#ffb84d 15deg 30deg,#4dd2ff 30deg 45deg,#7dff9a 45deg 60deg,#b14dff 60deg 75deg,#ff5d8f 75deg 90deg);opacity:.85;animation:spin 26s linear -8s infinite;-webkit-mask:radial-gradient(closest-side,transparent 30%,#000 31%);mask:radial-gradient(closest-side,transparent 30%,#000 31%)}
.disc.d2{inset:60px;background:repeating-conic-gradient(#4dd2ff 0 20deg,#ff5d8f 20deg 40deg,#ffd93d 40deg 60deg);animation:spinR 18s linear -4s infinite;opacity:.7}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinR{to{transform:rotate(-360deg)}}
.medal{position:absolute;left:50%;top:50%;width:190px;height:190px;margin:-95px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#fff3d0,#f5c86e 45%,#b97f2e 90%);box-shadow:0 0 70px rgba(245,200,110,.55),inset 0 0 0 8px rgba(120,70,20,.35);display:flex;align-items:center;justify-content:center;animation:pop 1s cubic-bezier(.2,1.5,.35,1) .5s both}
@keyframes pop{from{opacity:0;transform:scale(.3) rotate(-40deg)}to{opacity:1;transform:scale(1) rotate(0)}}
.medal span{font-size:92px;font-weight:800;color:#5e3a10}
.spark{position:absolute;width:10px;height:10px;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:tw 1.8s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(45deg)}}
.brand{position:absolute;left:0;right:0;bottom:180px;text-align:center;animation:up 1.2s ease 1.1s both}
.brand h1{font-size:52px;letter-spacing:18px;text-indent:18px;color:#ffe9c4;font-weight:800;text-shadow:0 0 26px rgba(255,93,143,.55)}
.brand p{margin-top:12px;font-size:13px;letter-spacing:7px;color:#c9a2d8}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.replay{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);z-index:50;padding:10px 26px;border-radius:999px;border:1px solid rgba(255,200,110,.55);background:rgba(255,180,80,.1);color:#ffe9c4;font-size:13px;letter-spacing:4px;text-indent:4px;cursor:pointer}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body><div class="stage">
<div class="scope"><div class="disc"></div><div class="disc d2"></div>
<div class="medal"><span>镜</span></div></div>
<div class="brand"><h1>棱镜万花</h1><p>一镜 万象</p></div>
<button class="replay" onclick="location.reload()">重新播放</button>
</div>
<script>
(function(){var st=document.querySelector('.stage');
for(var i=0;i<14;i++){var s=document.createElement('div');s.className='spark';
s.style.left=(20+Math.random()*390)+'px';s.style.top=(80+Math.random()*640)+'px';
s.style.animationDelay=(-Math.random()*1.8).toFixed(2)+'s';st.appendChild(s);}})();
</script>
</div></body></html>
