<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>双螺旋 · 启动页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#05080f;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.stage{width:430px;height:900px;max-width:100vw;max-height:100vh;position:relative;overflow:hidden;
background:radial-gradient(100% 70% at 50% 30%,#0c1626 0%,#05080f 60%,#03050a 100%)}
.dna{position:absolute;left:50%;top:180px;width:0;height:0;z-index:2}
.rung{position:absolute;left:-80px;width:160px;height:12px;display:block;top:calc(var(--i)*30px)}
.rung::before{content:"";position:absolute;left:10px;right:10px;top:5px;height:2px;background:rgba(140,180,255,.18);display:block}
.dot{position:absolute;top:1px;width:10px;height:10px;border-radius:50%;display:block;left:50%;margin-left:-5px}
.dot.a{background:#ff6ec7;box-shadow:0 0 10px #ff6ec7;animation:swayA 2.6s ease-in-out infinite;animation-delay:calc(var(--i)*-0.165s)}
.dot.b{background:#5fd8ff;box-shadow:0 0 10px #5fd8ff;animation:swayB 2.6s ease-in-out infinite;animation-delay:calc(var(--i)*-0.165s)}
@keyframes swayA{0%,100%{transform:translateX(-70px) scale(.8)}50%{transform:translateX(70px) scale(1.15)}}
@keyframes swayB{0%,100%{transform:translateX(70px) scale(1.15)}50%{transform:translateX(-70px) scale(.8)}}
.nucleus{position:absolute;left:50%;top:345px;width:120px;height:120px;margin:-60px 0 0 -60px;z-index:5;border-radius:50%;
background:radial-gradient(circle at 35% 30%,#ffe9a8,#f0a83e 55%,#b06a1a);
display:flex;align-items:center;justify-content:center;font-size:46px;color:#5e3c08;font-weight:700;
box-shadow:0 0 50px rgba(240,168,62,.5);opacity:0;animation:nucIn 1.1s cubic-bezier(.2,.8,.3,1.35) both;animation-delay:1.4s}
@keyframes nucIn{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
.scanline{position:absolute;left:0;right:0;top:0;height:70px;z-index:4;opacity:.5;
background:linear-gradient(180deg,transparent,rgba(95,216,255,.18),transparent);
animation:scanY 3.4s ease-in-out infinite}
@keyframes scanY{0%,100%{top:120px}50%{top:560px}}
.brand{position:absolute;left:0;right:0;top:640px;text-align:center;z-index:6;
opacity:0;animation:fadeUp 1s ease-out both;animation-delay:1.8s}
.brand h1{font-size:36px;font-weight:700;letter-spacing:14px;color:#eef4ff;text-indent:14px}
.brand p{font-size:13px;letter-spacing:6px;color:#7f9cc8;margin-top:12px;text-indent:6px}
@keyframes fadeUp{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:translateY(0)}}
.replay{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);z-index:50;
border:1px solid rgba(140,180,255,.4);background:rgba(140,180,255,.08);color:#c4d8f5;
font-size:13px;letter-spacing:3px;padding:10px 26px;border-radius:24px;cursor:pointer}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body>
<div class="stage">
  <div class="scanline"></div>
  <div class="dna" id="dna"></div>
  <div class="nucleus">旋</div>
  <div class="brand"><h1>旋纪</h1><p>生命的诗篇</p></div>
  <button class="replay">重新播放</button>
</div>
<script>
(function(){const dna=document.getElementById('dna');
for(let i=0;i<13;i++){const r=document.createElement('i');r.className='rung';r.style.setProperty('--i',i);
r.innerHTML='<b class="dot a"></b><b class="dot b"></b>';dna.appendChild(r);}})();
function bind(){document.querySelector('.replay').addEventListener('click',()=>{
const s=document.querySelector('.stage');const n=s.cloneNode(true);s.replaceWith(n);bind();});}
bind();
</script>
</body></html>
