<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>指纹解锁 · 启动页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#04060c;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.stage{width:430px;height:900px;max-width:100vw;max-height:100vh;position:relative;overflow:hidden;
background:radial-gradient(100% 70% at 50% 30%,#0b1626 0%,#05080f 60%,#030509 100%)}
.fp{position:absolute;left:50%;top:200px;width:200px;height:200px;margin-left:-100px;z-index:3;
filter:drop-shadow(0 0 8px rgba(57,230,255,.7))}
.fp circle{fill:none;stroke:#39e6ff;stroke-width:3;stroke-linecap:round;opacity:0;transform-origin:100px 100px;
animation:fpIn 1.2s ease-out both;animation-delay:var(--dl)}
.fp circle:nth-child(1){--dl:.1s;opacity:.95}
.fp circle:nth-child(2){--dl:.25s}
.fp circle:nth-child(3){--dl:.4s}
.fp circle:nth-child(4){--dl:.55s}
.fp circle:nth-child(5){--dl:.7s}
.fp circle:nth-child(6){--dl:.85s}
.fp circle.gap{stroke-dasharray:70 26;animation:fpIn 1.2s ease-out both,spinFp 9s linear infinite;animation-delay:var(--dl),var(--dl)}
@keyframes fpIn{0%{opacity:0;transform:scale(.85)}100%{opacity:.95;transform:scale(1)}}
@keyframes spinFp{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.scan{position:absolute;left:95px;right:95px;height:3px;z-index:4;border-radius:2px;
background:linear-gradient(90deg,transparent,#39e6ff 30%,#bff6ff 50%,#39e6ff 70%,transparent);
box-shadow:0 0 20px 4px rgba(57,230,255,.7);top:210px;opacity:0;animation:scan 1.8s ease-in-out both;animation-delay:.4s}
@keyframes scan{0%{opacity:0;top:210px}12%{opacity:1}82%{opacity:1;top:390px}100%{opacity:0;top:400px}}
.ok{position:absolute;left:50%;top:290px;width:84px;height:84px;margin:-42px 0 0 -42px;z-index:5;
border-radius:50%;background:rgba(57,230,255,.12);border:2px solid #39e6ff;display:flex;align-items:center;
justify-content:center;font-size:38px;color:#39e6ff;opacity:0;transform:scale(.5);
animation:okIn .7s cubic-bezier(.2,.9,.3,1.5) both;animation-delay:2.1s;box-shadow:0 0 34px rgba(57,230,255,.5)}
@keyframes okIn{0%{opacity:0;transform:scale(.5)}100%{opacity:1;transform:scale(1)}}
.pulse{position:absolute;left:50%;top:290px;width:84px;height:84px;margin:-42px 0 0 -42px;z-index:4;
border-radius:50%;border:2px solid rgba(57,230,255,.6);opacity:0;animation:pulse 1.4s ease-out both;animation-delay:2.2s}
@keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.1)}}
.brand{position:absolute;left:0;right:0;top:600px;text-align:center;z-index:6;
opacity:0;animation:fadeUp 1s ease-out both;animation-delay:2.4s}
.brand h1{font-size:36px;font-weight:700;letter-spacing:14px;color:#e8fbff;text-indent:14px}
.brand p{font-size:13px;letter-spacing:6px;color:#5fa8c8;margin-top:12px;text-indent:6px}
@keyframes fadeUp{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:translateY(0)}}
.replay{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);z-index:50;
border:1px solid rgba(57,230,255,.4);background:rgba(57,230,255,.07);color:#aeeaff;
font-size:13px;letter-spacing:3px;padding:10px 26px;border-radius:24px;cursor:pointer}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body>
<div class="stage">
  <svg class="fp" viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="24"/>
    <circle class="gap" cx="100" cy="100" r="38"/>
    <circle cx="100" cy="100" r="52"/>
    <circle class="gap" cx="100" cy="100" r="66"/>
    <circle cx="100" cy="100" r="80"/>
    <circle class="gap" cx="100" cy="100" r="93"/>
  </svg>
  <div class="scan"></div>
  <div class="pulse"></div>
  <div class="ok">✓</div>
  <div class="brand"><h1>纹钥</h1><p>你的专属密钥</p></div>
  <button class="replay">重新播放</button>
</div>
<script>
function bind(){document.querySelector('.replay').addEventListener('click',()=>{
const s=document.querySelector('.stage');const n=s.cloneNode(true);s.replaceWith(n);bind();});}
bind();
</script>
</body></html>
