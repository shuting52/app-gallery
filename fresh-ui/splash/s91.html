<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>潮汐灯塔</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000}
body{width:430px;height:900px;margin:0 auto;position:relative;overflow:hidden;
font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:#fff}

body{background:linear-gradient(#060b1d 0%,#0a1633 55%,#0e2148 100%)}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 2.6s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}
.beam{position:absolute;left:50%;top:430px;width:0;height:0;z-index:2;
animation:beamRot 7s linear infinite;animation-delay:-2s}
@keyframes beamRot{to{transform:rotate(360deg)}}
.beam::before{content:"";position:absolute;left:0;top:-32px;width:330px;height:64px;transform-origin:0 50%;
background:linear-gradient(90deg,rgba(255,244,200,.85),rgba(255,244,200,0));clip-path:polygon(0 42%,100% 0,100% 100%,0 58%)}
.tower{position:absolute;left:50%;top:384px;transform:translateX(-50%);z-index:3}
.tower .bd{width:64px;height:230px;margin:0 auto;background:linear-gradient(90deg,#c0392b 0 33%,#f5f0e6 33% 66%,#c0392b 66%);
clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}
.tower .lamp{width:56px;height:44px;margin:0 auto;background:#f7e7b0;border-radius:6px;
box-shadow:0 0 34px 10px rgba(255,240,190,.85);animation:lamp 3s ease-in-out infinite;animation-delay:-1s}
@keyframes lamp{50%{box-shadow:0 0 50px 18px rgba(255,240,190,.95)}}
.tower .roof{width:0;height:0;margin:0 auto;border-left:34px solid transparent;border-right:34px solid transparent;border-bottom:30px solid #2c3e50}
.rock{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);width:220px;height:60px;
background:#1a2340;border-radius:50% 50% 0 0;z-index:4}
.sea{position:absolute;left:0;right:0;bottom:0;height:170px;z-index:5}
.wv{position:absolute;left:-60px;right:-60px;height:70px;border-radius:46%;
animation:wave 5s ease-in-out infinite}
.wv.w1{bottom:96px;background:rgba(38,84,150,.55);animation-delay:-1s}
.wv.w2{bottom:48px;background:rgba(28,64,120,.7);animation-delay:-2.6s}
.wv.w3{bottom:0;background:rgba(18,44,88,.95);animation-delay:-4s}
@keyframes wave{50%{transform:translateX(46px)}}

.brand{position:absolute;left:0;right:0;bottom:150px;text-align:center;z-index:20;
animation:brandIn 1.1s cubic-bezier(.2,.7,.3,1.2) .9s both}
.brand h1{font-size:36px;letter-spacing:10px;font-weight:800;text-shadow:0 4px 24px rgba(0,0,0,.45)}
.brand p{margin-top:12px;font-size:13px;letter-spacing:6px;opacity:.75}
@keyframes brandIn{from{opacity:0;transform:translateY(26px) scale(.94)}}
.replay{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);z-index:30;
background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;
border-radius:24px;padding:10px 26px;font-size:13px;letter-spacing:2px;cursor:pointer;
backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body>
<div id="st">
<div class="stars"><i style="left:40px;top:60px"></i><i style="left:120px;top:140px;animation-delay:-.8s"></i>
<i style="left:220px;top:50px;animation-delay:-1.6s"></i><i style="left:330px;top:120px;animation-delay:-.4s"></i>
<i style="left:380px;top:220px;animation-delay:-2s"></i><i style="left:80px;top:260px;animation-delay:-1.2s"></i></div>
<div class="beam"></div>
<div class="tower"><div class="roof"></div><div class="lamp"></div><div class="bd"></div></div>
<div class="rock"></div>
<div class="sea"><div class="wv w1"></div><div class="wv w2"></div><div class="wv w3"></div></div>
</div>
<div class="brand"><h1>潮汐灯塔</h1><p>TIDE LIGHT</p></div>
<button class="replay" onclick="var s=document.getElementById('st');var c=s.cloneNode(true);s.replaceWith(c);">重新播放</button>
</body></html>
