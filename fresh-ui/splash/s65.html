<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>竹林听雨</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{width:430px;height:900px;margin:0 auto;position:relative;overflow:hidden;
font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
background:linear-gradient(180deg,#2c6b4e 0%,#4d8f66 60%,#77b183 100%);color:#fff}
.scene{position:absolute;inset:0}

.bam{position:absolute;bottom:0;width:26px;background:repeating-linear-gradient(180deg,transparent 0 64px,rgba(30,70,40,.55) 64px 68px),linear-gradient(90deg,#3c7a4b,#63a873,#3c7a4b);border-radius:13px}
.lvs{position:absolute;width:64px;height:30px;background:radial-gradient(ellipse,#5fae72,#3c7a4b);border-radius:50%;transform:rotate(-24deg)}
.rn{position:absolute;top:-46px;width:2px;height:36px;background:linear-gradient(transparent,rgba(225,242,255,.9));animation:rainFall linear infinite;display:block}
@keyframes rainFall{to{transform:translateY(970px)}}
.mist{position:absolute;bottom:-60px;left:-60px;width:550px;height:170px;background:rgba(230,245,235,.28);border-radius:50%;filter:blur(10px)}

.brand{position:absolute;left:0;right:0;bottom:118px;text-align:center;z-index:5;
color:#fff;opacity:0;animation:brandIn 1s ease 2.2s both}
.brand h1{font-size:34px;letter-spacing:8px;font-weight:800;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.brand p{font-size:13px;letter-spacing:3px;margin-top:10px;opacity:.85;text-shadow:0 1px 10px rgba(0,0,0,.35)}
@keyframes brandIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.replay{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);z-index:6;
padding:10px 28px;border-radius:24px;border:1px solid rgba(255,255,255,.45);
background:rgba(255,255,255,.14);color:#fff;font-size:14px;letter-spacing:2px;cursor:pointer}
</style></head><body>
<div class="scene"><i class="rn" style="left:30px;animation-duration:0.9s;animation-delay:-0.2s"></i><i class="rn" style="left:70px;animation-duration:1.1s;animation-delay:-0.7s"></i><i class="rn" style="left:110px;animation-duration:0.85s;animation-delay:-0.4s"></i><i class="rn" style="left:150px;animation-duration:1s;animation-delay:-0.9s"></i><i class="rn" style="left:190px;animation-duration:0.9s;animation-delay:-0.1s"></i><i class="rn" style="left:230px;animation-duration:1.05s;animation-delay:-0.6s"></i><i class="rn" style="left:270px;animation-duration:0.9s;animation-delay:-0.8s"></i><i class="rn" style="left:310px;animation-duration:1.1s;animation-delay:-0.3s"></i><i class="rn" style="left:350px;animation-duration:0.85s;animation-delay:-0.5s"></i><i class="rn" style="left:390px;animation-duration:1s;animation-delay:-0.65s"></i><i class="rn" style="left:50px;animation-duration:1s;animation-delay:-0.45s"></i><i class="rn" style="left:130px;animation-duration:0.9s;animation-delay:-0.75s"></i><i class="rn" style="left:210px;animation-duration:1.05s;animation-delay:-0.25s"></i><i class="rn" style="left:290px;animation-duration:0.9s;animation-delay:-0.55s"></i><i class="rn" style="left:370px;animation-duration:1.1s;animation-delay:-0.85s"></i><i class="rn" style="left:95px;animation-duration:0.95s;animation-delay:-0.15s"></i><i class="rn" style="left:175px;animation-duration:1s;animation-delay:-0.95s"></i><i class="rn" style="left:255px;animation-duration:0.9s;animation-delay:-0.35s"></i><i class="rn" style="left:335px;animation-duration:1.05s;animation-delay:-0.7s"></i><i class="rn" style="left:405px;animation-duration:0.9s;animation-delay:-0.5s"></i>
<div class="bam" style="left:60px;height:560px"></div><div class="lvs" style="left:30px;top:300px"></div><div class="lvs" style="left:66px;top:230px;transform:rotate(20deg)"></div>
<div class="bam" style="left:180px;height:680px"></div><div class="lvs" style="left:150px;top:180px"></div><div class="lvs" style="left:186px;top:120px;transform:rotate(18deg)"></div>
<div class="bam" style="left:320px;height:520px"></div><div class="lvs" style="left:290px;top:340px"></div>
<div class="mist"></div></div>
<div class="brand"><h1>竹林听雨</h1><p>雨打新篁 万竿生烟</p></div>
<button class="replay" onclick="location.reload()">重新播放</button>
</body></html>
