<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>磁流体</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:430px;height:900px}
body{overflow:hidden;position:relative;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#050508;color:#fff}
.stage{position:absolute;inset:0;overflow:hidden}
.brand{position:absolute;left:0;right:0;top:648px;text-align:center;z-index:5;animation:brandIn 1s ease 2s both}
.brand h1{font-size:36px;letter-spacing:10px;font-weight:800}
.brand p{font-size:13px;letter-spacing:6px;opacity:.65;margin-top:10px}
@keyframes brandIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.replay{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);z-index:9;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;font-size:13px;padding:9px 26px;border-radius:24px;cursor:pointer;backdrop-filter:blur(6px)}
.core{position:absolute;left:50%;top:300px;width:120px;height:120px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 40% 35%,#5b6cff,#101232 70%);box-shadow:0 0 60px #3d4bff88;animation:corePulse 2.4s ease-in-out infinite}
@keyframes corePulse{50%{transform:translate(-50%,-50%) scale(1.08)}}
.spike{position:absolute;left:50%;top:300px;width:14px;height:0;background:linear-gradient(#6d7bff,#1a1e5e);border-radius:7px;transform-origin:50% 0;animation:poke 2.4s ease-in-out infinite}
@keyframes poke{0%,100%{height:26px}50%{height:110px}}
</style></head><body>
<div class="stage"><div class="core"></div><div class="spike" style="transform:translate(-50%,-50%) rotate(0deg) translateY(-60px);animation-delay:0.00s"></div><div class="spike" style="transform:translate(-50%,-50%) rotate(30deg) translateY(-60px);animation-delay:-0.20s"></div><div class="spike" style="transform:translate(-50%,-50%) rotate(60deg) translateY(-60px);animation-delay:-0.40s"></div><div class="spike" style="transform:translate(-50%,-50%) rotate(90deg) translateY(-60px);animation-delay:-0.60s"></div><div class="spike" style="transform:translate(-50%,-50%) rotate(120deg) translateY(-60px);animation-delay:-0.80s"></div><div class="spike" style="transform:translate(-50%,-50%) rotate(150deg) translateY(-60px);animation-delay:-1.00s"></div><div class="spike" style="transform:translate(-50%,-50%) rotate(180deg) translateY(-60px);animation-delay:-1.20s"></div><div class="spike" style="transform:translate(-50%,-50%) rotate(210deg) translateY(-60px);animation-delay:-1.40s"></div><div class="spike" style="transform:translate(-50%,-50%) rotate(240deg) translateY(-60px);animation-delay:-1.60s"></div><div class="spike" style="transform:translate(-50%,-50%) rotate(270deg) translateY(-60px);animation-delay:-1.80s"></div><div class="spike" style="transform:translate(-50%,-50%) rotate(300deg) translateY(-60px);animation-delay:-2.00s"></div><div class="spike" style="transform:translate(-50%,-50%) rotate(330deg) translateY(-60px);animation-delay:-2.20s"></div></div>
<div class="brand"><h1>磁核</h1><p>FERRO · 涌动</p></div>
<button class="replay" onclick="location.reload()">&#8635; 重新播放</button>
</body></html>
