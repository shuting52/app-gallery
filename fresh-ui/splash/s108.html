<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>萤火虫之森</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000}
body{width:430px;height:900px;margin:0 auto;position:relative;overflow:hidden;
font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:#fff}

body{background:linear-gradient(#050d08 0%,#0a1a10 60%,#0e2414 100%)}
.moon2{position:absolute;right:60px;top:80px;width:58px;height:58px;border-radius:50%;
background:radial-gradient(circle at 38% 35%,#f4f7e8,#cfd8b8 70%);box-shadow:0 0 36px 10px rgba(220,235,190,.3)}
.tree{position:absolute;bottom:100px;width:0;height:0;z-index:2}
.tree.t1{left:10px;border-left:70px solid transparent;border-right:70px solid transparent;border-bottom:330px solid #0a1a10}
.tree.t2{left:150px;border-left:56px solid transparent;border-right:56px solid transparent;border-bottom:260px solid #0d2113}
.tree.t3{right:20px;border-left:64px solid transparent;border-right:64px solid transparent;border-bottom:300px solid #0a1a10}
.tree.t4{right:170px;border-left:44px solid transparent;border-right:44px solid transparent;border-bottom:210px solid #0d2113}
.ground2{position:absolute;left:0;right:0;bottom:0;height:110px;background:#060f09;z-index:1}
.fly{position:absolute;width:9px;height:9px;border-radius:50%;background:#eaff9a;
box-shadow:0 0 14px 6px rgba(230,255,140,.75);z-index:4;animation:driftF ease-in-out infinite}
@keyframes driftF{0%,100%{transform:translate(0,0);opacity:.35}25%{opacity:1}
50%{transform:translate(46px,-70px);opacity:.5}75%{transform:translate(-30px,-120px);opacity:1}}
.mist{position:absolute;left:-40px;right:-40px;bottom:60px;height:120px;filter:blur(24px);z-index:3;
background:linear-gradient(transparent,rgba(150,200,170,.25));animation:mistM 8s ease-in-out infinite;animation-delay:-4s}
@keyframes mistM{50%{transform:translateX(50px)}}

.brand{position:absolute;left:0;right:0;bottom:150px;text-align:center;z-index:20;
animation:brandIn 1.1s cubic-bezier(.2,.7,.3,1.2) .9s both}
.brand h1{font-size:36px;letter-spacing:10px;font-weight:800;text-shadow:0 4px 24px rgba(0,0,0,.45)}
.brand p{margin-top:12px;font-size:13px;letter-spacing:6px;opacity:.75}
@keyframes brandIn{from{opacity:0;transform:translateY(26px) scale(.94)}}
.replay{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);z-index:30;
background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;
border-radius:24px;padding:10px 26px;font-size:13px;letter-spacing:2px;cursor:pointer;
backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body>
<div id="st">
<div class="moon2"></div>
<div class="tree t1"></div><div class="tree t2"></div><div class="tree t3"></div><div class="tree t4"></div>
<div class="ground2"></div><div class="mist"></div>
<div class="fly" style="left:80px;top:400px;animation-duration:7s;animation-delay:-2s"></div>
<div class="fly" style="left:180px;top:480px;animation-duration:9s;animation-delay:-5s"></div>
<div class="fly" style="left:260px;top:360px;animation-duration:6s;animation-delay:-1s"></div>
<div class="fly" style="left:330px;top:500px;animation-duration:8s;animation-delay:-3.5s"></div>
<div class="fly" style="left:130px;top:300px;animation-duration:7.5s;animation-delay:-6s"></div>
<div class="fly" style="left:300px;top:280px;animation-duration:6.5s;animation-delay:-4.2s"></div>
<div class="fly" style="left:50px;top:540px;animation-duration:8.5s;animation-delay:-.8s"></div>
<div class="fly" style="left:220px;top:560px;animation-duration:7.2s;animation-delay:-2.8s"></div>
</div>
<div class="brand"><h1>萤火虫之森</h1><p>FIREFLY FOREST</p></div>
<button class="replay" onclick="var s=document.getElementById('st');var c=s.cloneNode(true);s.replaceWith(c);">重新播放</button>
</body></html>
