<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日出东方</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#1a2340;display:flex;justify-content:center;font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;overflow:hidden}
.stage{width:430px;height:900px;max-height:100vh;position:relative;overflow:hidden;background:linear-gradient(180deg,#1a2340 0%,#3a2a55 45%,#8a4a5a 70%,#d87a4e 100%)}
.dawn{position:absolute;inset:0;background:linear-gradient(180deg,#7fb2e8 0%,#e8a06a 55%,#ffd98e 80%);opacity:0;animation:dawn 3s ease .3s both}
@keyframes dawn{to{opacity:1}}
.rays{position:absolute;left:50%;top:470px;width:520px;height:520px;margin:-260px;background:repeating-conic-gradient(rgba(255,240,200,.35) 0 8deg,transparent 8deg 24deg);border-radius:50%;-webkit-mask:radial-gradient(closest-side,transparent 22%,#000 23%);mask:radial-gradient(closest-side,transparent 22%,#000 23%);animation:spin 30s linear -10s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sun{position:absolute;left:50%;top:470px;width:170px;height:170px;margin-left:-85px;border-radius:50%;background:radial-gradient(circle at 42% 36%,#fffbe8,#ffe9a8 55%,#ffb35e);box-shadow:0 0 90px 30px rgba(255,205,120,.65);animation:rise 2.8s cubic-bezier(.3,.75,.3,1) .4s both}
@keyframes rise{from{top:740px}to{top:470px}}
.sea{position:absolute;left:0;right:0;bottom:0;height:300px;background:linear-gradient(180deg,#e8965a,#7a4a6a 60%,#3a2a55);overflow:hidden}
.glitter{position:absolute;left:50%;top:0;width:130px;height:300px;margin-left:-65px;background:linear-gradient(180deg,rgba(255,240,200,.75),transparent);filter:blur(10px);animation:glit 2.6s ease-in-out -1s infinite}
@keyframes glit{0%,100%{opacity:.45;transform:scaleX(.9)}50%{opacity:.95;transform:scaleX(1.12)}}
.gull{position:absolute;width:34px;height:16px;border:3px solid transparent;border-top-color:#3a2a45;border-radius:50%;animation:fly 8s linear -3s infinite}
.gull.u2{top:190px;animation-duration:10s;animation-delay:-6s;transform:scale(.7)}
.gull.u3{top:150px;animation-duration:12s;animation-delay:-9s;transform:scale(.55)}
@keyframes fly{from{left:-50px}to{left:480px}}
.brand{position:absolute;left:0;right:0;bottom:340px;text-align:center;animation:up 1.3s ease 1.2s both}
.brand h1{font-size:56px;font-weight:800;letter-spacing:14px;text-indent:14px;color:#fff8e8;text-shadow:0 3px 26px rgba(120,50,30,.6)}
.brand p{margin-top:12px;font-size:13px;letter-spacing:7px;color:#ffe9c4;text-shadow:0 2px 10px rgba(120,50,30,.5)}
@keyframes up{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.replay{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);z-index:50;padding:10px 26px;border-radius:999px;border:1px solid rgba(255,255,255,.65);background:rgba(255,255,255,.16);color:#fff8e8;font-size:13px;letter-spacing:4px;text-indent:4px;cursor:pointer}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body><div class="stage">
<div class="dawn"></div>
<div class="rays"></div><div class="sun"></div>
<div class="sea"><div class="glitter"></div></div>
<div class="gull" style="top:230px"></div><div class="gull u2"></div><div class="gull u3"></div>
<div class="brand"><h1>日出东方</h1><p>万丈光芒 始于初升</p></div>
<button class="replay" onclick="location.reload()">重新播放</button>
</div></body></html>
