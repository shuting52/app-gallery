<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鲸落深海</title><style>*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{width:430px;min-height:900px;margin:0 auto;position:relative;overflow:hidden;color:#fff;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;background:linear-gradient(180deg,#06283f 0%,#041a2b 60%,#020d16 100%)}
#app{position:absolute;inset:0}
.brand{position:absolute;left:0;right:0;bottom:112px;text-align:center;z-index:10;opacity:0;transform:translateY(16px);animation:brandIn .9s cubic-bezier(.2,.7,.3,1.2) 2.3s both}
.brand h1{font-size:34px;letter-spacing:10px;font-weight:800;text-indent:10px}
.brand p{margin-top:10px;font-size:12px;letter-spacing:5px;opacity:.7;text-indent:5px}
@keyframes brandIn{to{opacity:1;transform:none}}
.tag{position:absolute;top:56px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:8px;text-indent:8px;opacity:0;z-index:10;animation:brandIn 1s ease 2.7s both;color:rgba(255,255,255,.65)}
.replay{position:absolute;left:50%;bottom:42px;transform:translateX(-50%);z-index:20;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:20px;padding:8px 24px;font-size:13px;letter-spacing:2px;cursor:pointer;backdrop-filter:blur(6px)}

.ray{position:absolute;top:-40px;width:90px;height:700px;display:block;background:linear-gradient(180deg,rgba(140,220,255,.14),transparent);transform:skewX(-12deg);animation:sway 7s ease-in-out infinite alternate}
@keyframes sway{to{transform:skewX(6deg) translateX(30px)}}
.whale{position:absolute;left:50%;top:180px;width:230px;height:120px;margin-left:-115px;animation:dive 3.2s ease-in-out .2s both}
@keyframes dive{from{transform:translateY(-260px) rotate(-8deg);opacity:0}30%{opacity:1}to{transform:translateY(60px) rotate(4deg);opacity:1}}
.whale .bd{position:absolute;left:20px;top:20px;width:170px;height:80px;background:linear-gradient(180deg,#3d6a8f,#16293c);border-radius:50%}
.whale .tl{position:absolute;left:0;top:38px;width:0;height:0;border-top:26px solid transparent;border-bottom:26px solid transparent;border-right:44px solid #16293c;animation:tail 2.2s ease-in-out -0.4s infinite}
@keyframes tail{50%{transform:rotate(14deg)}}
.whale .eye{position:absolute;left:150px;top:44px;width:10px;height:10px;display:block;border-radius:50%;background:#cfeaff}
.whale .fin{position:absolute;left:110px;top:88px;width:52px;height:18px;background:#16293c;border-radius:0 0 26px 26px;transform:rotate(18deg)}
.bub{position:absolute;bottom:-20px;width:10px;height:10px;display:block;border-radius:50%;border:2px solid rgba(160,220,255,.55);animation:rise2 linear infinite}
@keyframes rise2{to{transform:translateY(-860px);opacity:0}}
.sand{position:absolute;bottom:0;left:0;right:0;height:90px;background:radial-gradient(circle at 50% 130%,#0a2f47,#020d16 75%)}
</style></head><body><div id="app"><div class="ray" style="left:60px"></div><div class="ray" style="left:200px;animation-delay:-3s"></div><div class="ray" style="left:320px;animation-delay:-5s"></div><div class="whale"><div class="bd"></div><div class="tl"></div><div class="fin"></div><i class="eye"></i></div><i class="bub" style="left:81px;animation-delay:-1.83s;animation-duration:7.11s;"></i><i class="bub" style="left:170px;animation-delay:-1.92s;animation-duration:6.36s;"></i><i class="bub" style="left:254px;animation-delay:-2.46s;animation-duration:6.58s;"></i><i class="bub" style="left:64px;animation-delay:-0.03s;animation-duration:4.82s;"></i><i class="bub" style="left:55px;animation-delay:-4.57s;animation-duration:7.27s;"></i><i class="bub" style="left:401px;animation-delay:-0.07s;animation-duration:4.54s;"></i><i class="bub" style="left:157px;animation-delay:-1.48s;animation-duration:4.44s;"></i><i class="bub" style="left:169px;animation-delay:-2.60s;animation-duration:5.09s;"></i><i class="bub" style="left:123px;animation-delay:-3.15s;animation-duration:4.54s;"></i><i class="bub" style="left:366px;animation-delay:-3.18s;animation-duration:4.68s;"></i><i class="bub" style="left:203px;animation-delay:-3.82s;animation-duration:6.54s;"></i><i class="bub" style="left:27px;animation-delay:-3.80s;animation-duration:4.28s;"></i><i class="bub" style="left:244px;animation-delay:-3.05s;animation-duration:7.17s;"></i><i class="bub" style="left:259px;animation-delay:-2.89s;animation-duration:6.50s;"></i><i class="bub" style="left:131px;animation-delay:-2.84s;animation-duration:5.55s;"></i><i class="bub" style="left:186px;animation-delay:-3.52s;animation-duration:4.00s;"></i><i class="bub" style="left:82px;animation-delay:-2.55s;animation-duration:4.49s;"></i><i class="bub" style="left:152px;animation-delay:-1.14s;animation-duration:5.94s;"></i><div class="sand"></div><div class="tag">DEEP WHALE</div><div class="brand"><h1>鲸落深海</h1><p>潜入蔚蓝 · 梦境深处</p></div></div><button class="replay">&#8635; 重新播放</button><script>document.querySelector('.replay').onclick=function(){var a=document.getElementById('app');var c=a.cloneNode(true);a.replaceWith(c);};</script></body></html>
