<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>光束扫描 · 启动页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#05070c;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.stage{width:430px;height:900px;max-width:100vw;max-height:100vh;position:relative;overflow:hidden;background:#0b0f16}
.scanlines{position:absolute;inset:0;z-index:8;pointer-events:none;opacity:.5;
background:repeating-linear-gradient(180deg,rgba(255,255,255,.035) 0 2px,transparent 2px 5px)}
.logo{position:absolute;left:50%;top:300px;width:150px;height:150px;margin:-75px 0 0 -75px;z-index:4;text-align:center}
.logo .glyph{width:110px;height:110px;margin:0 auto;border-radius:30px;
background:linear-gradient(135deg,#5fd8ff,#2f7fe0 60%,#1a4fa8);
display:flex;align-items:center;justify-content:center;font-size:52px;color:#fff;font-weight:700;
box-shadow:0 0 44px rgba(95,216,255,.4);opacity:0;filter:blur(6px);
animation:develop 1.6s ease-out both;animation-delay:1.1s}
.logo .name{margin-top:14px;font-size:20px;letter-spacing:8px;color:#dcecff;opacity:0;
animation:develop 1.2s ease-out both;animation-delay:1.6s;text-indent:8px}
@keyframes develop{0%{opacity:0;filter:blur(10px);transform:scale(.92)}100%{opacity:1;filter:blur(0);transform:scale(1)}}
.beam{position:absolute;left:30px;right:30px;height:6px;top:200px;z-index:6;border-radius:3px;
background:linear-gradient(90deg,transparent,#9feaff 25%,#fff 50%,#9feaff 75%,transparent);
box-shadow:0 0 26px 6px rgba(120,220,255,.75);opacity:0;animation:beam 1.8s cubic-bezier(.4,0,.4,1) both}
.beam::after{content:"";position:absolute;left:0;right:0;top:-46px;height:46px;
background:linear-gradient(180deg,transparent,rgba(120,220,255,.22))}
@keyframes beam{0%{opacity:0;top:200px}10%{opacity:1}85%{opacity:1;top:460px}100%{opacity:0;top:470px}}
.pct{position:absolute;left:0;right:0;top:520px;text-align:center;z-index:5;font-size:15px;letter-spacing:4px;
color:#7fd8ff;font-variant-numeric:tabular-nums;opacity:0;animation:pct 1.8s linear both}
@keyframes pct{0%{opacity:1;content:""}100%{opacity:0}}
.pct::after{content:"显影 0%";animation:pctNum 1.8s linear both}
@keyframes pctNum{0%{content:"显影 0%"}25%{content:"显影 32%"}50%{content:"显影 61%"}75%{content:"显影 88%"}100%{content:"显影 100%"}}
.frame{position:absolute;left:50%;top:300px;width:190px;height:190px;margin:-95px 0 0 -95px;z-index:5;opacity:0;
animation:frameIn 1s ease-out both;animation-delay:.9s}
.frame i{position:absolute;width:26px;height:26px;border:3px solid #7fd8ff;display:block}
.frame i:nth-child(1){left:0;top:0;border-right:none;border-bottom:none}
.frame i:nth-child(2){right:0;top:0;border-left:none;border-bottom:none}
.frame i:nth-child(3){left:0;bottom:0;border-right:none;border-top:none}
.frame i:nth-child(4){right:0;bottom:0;border-left:none;border-top:none}
@keyframes frameIn{0%{opacity:0;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
.brand{position:absolute;left:0;right:0;top:640px;text-align:center;z-index:6;
opacity:0;animation:fadeUp 1s ease-out both;animation-delay:2.2s}
.brand h1{font-size:36px;font-weight:700;letter-spacing:14px;color:#eaf4ff;text-indent:14px}
.brand p{font-size:13px;letter-spacing:6px;color:#6f8fb8;margin-top:12px;text-indent:6px}
@keyframes fadeUp{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:translateY(0)}}
.replay{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);z-index:50;
border:1px solid rgba(120,200,255,.4);background:rgba(120,200,255,.07);color:#bfe0ff;
font-size:13px;letter-spacing:3px;padding:10px 26px;border-radius:24px;cursor:pointer}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body>
<div class="stage">
  <div class="scanlines"></div>
  <div class="frame"><i></i><i></i><i></i><i></i></div>
  <div class="beam"></div>
  <div class="logo"><div class="glyph">映</div><div class="name">映象</div></div>
  <div class="pct"></div>
  <div class="brand"><h1>映象</h1><p>逐行显影 · 清晰呈现</p></div>
  <button class="replay">重新播放</button>
</div>
<script>
function bind(){document.querySelector('.replay').addEventListener('click',()=>{
const s=document.querySelector('.stage');const n=s.cloneNode(true);s.replaceWith(n);bind();});}
bind();
</script>
</body></html>
