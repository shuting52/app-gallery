<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>熔炉星火</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000}
body{width:430px;height:900px;margin:0 auto;position:relative;overflow:hidden;
font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:#fff}

body{background:linear-gradient(#0d0505 0%,#1c0a06 60%,#2a1008 100%)}
.glow{position:absolute;left:50%;bottom:150px;width:380px;height:280px;transform:translateX(-50%);
background:radial-gradient(circle at 50% 60%,rgba(255,120,30,.5),rgba(255,60,10,.12) 60%,transparent 70%);
animation:glowP 2.4s ease-in-out infinite;animation-delay:-1s}
@keyframes glowP{50%{opacity:.75;transform:translateX(-50%) scale(1.06)}}
.pot{position:absolute;left:50%;bottom:170px;transform:translateX(-50%);width:230px;height:130px;
background:linear-gradient(#3a3f4a,#171a22);border-radius:12px 12px 110px 110px;
box-shadow:inset 0 -18px 30px rgba(0,0,0,.6)}
.lava{position:absolute;left:50%;bottom:262px;transform:translateX(-50%);width:196px;height:44px;
background:radial-gradient(circle at 50% 40%,#ffe28a,#ff9a2e 55%,#e8541a);border-radius:50%;
box-shadow:0 0 40px 12px rgba(255,140,40,.7);animation:lavaB 1.8s ease-in-out infinite;animation-delay:-.6s}
@keyframes lavaB{50%{transform:translateX(-50%) scaleY(.82)}}
.spark{position:absolute;bottom:280px;border-radius:50%;background:#ffcf6e;
box-shadow:0 0 10px 3px rgba(255,180,80,.8);animation:rise 3.2s linear infinite}
@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-380px) translateX(30px);opacity:0}}

.brand{position:absolute;left:0;right:0;bottom:150px;text-align:center;z-index:20;
animation:brandIn 1.1s cubic-bezier(.2,.7,.3,1.2) .9s both}
.brand h1{font-size:36px;letter-spacing:10px;font-weight:800;text-shadow:0 4px 24px rgba(0,0,0,.45)}
.brand p{margin-top:12px;font-size:13px;letter-spacing:6px;opacity:.75}
@keyframes brandIn{from{opacity:0;transform:translateY(26px) scale(.94)}}
.replay{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);z-index:30;
background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;
border-radius:24px;padding:10px 26px;font-size:13px;letter-spacing:2px;cursor:pointer;
backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body>
<div id="st">
<div class="glow"></div><div class="pot"></div><div class="lava"></div>
<div class="spark" style="left:150px;width:7px;height:7px;animation-delay:-.4s"></div>
<div class="spark" style="left:200px;width:5px;height:5px;animation-delay:-1.4s;animation-duration:2.6s"></div>
<div class="spark" style="left:250px;width:8px;height:8px;animation-delay:-2.2s"></div>
<div class="spark" style="left:290px;width:4px;height:4px;animation-delay:-.9s;animation-duration:3.8s"></div>
<div class="spark" style="left:120px;width:5px;height:5px;animation-delay:-2.8s;animation-duration:2.9s"></div>
<div class="spark" style="left:225px;width:6px;height:6px;animation-delay:-1.9s"></div>
<div class="spark" style="left:175px;width:4px;height:4px;animation-delay:-.2s;animation-duration:3.5s"></div>
<div class="spark" style="left:270px;width:6px;height:6px;animation-delay:-3s;animation-duration:2.7s"></div>
</div>
<div class="brand"><h1>熔炉星火</h1><p>FORGE & EMBER</p></div>
<button class="replay" onclick="var s=document.getElementById('st');var c=s.cloneNode(true);s.replaceWith(c);">重新播放</button>
</body></html>
