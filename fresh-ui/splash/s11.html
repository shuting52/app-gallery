<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>万花筒 · 启动页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#020204;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.stage{width:430px;height:900px;max-width:100vw;max-height:100vh;position:relative;overflow:hidden;background:#020204}
.kale{position:absolute;left:50%;top:290px;width:380px;height:380px;margin:-190px 0 0 -190px;border-radius:50%;
background:repeating-conic-gradient(from 0deg,#ff5fa2 0 10deg,#ffb35f 10deg 20deg,#5ff2ff 20deg 30deg,#8f7bff 30deg 40deg,#5fff8f 40deg 50deg);
-webkit-mask:radial-gradient(circle,#000 0 62%,transparent 63%);mask:radial-gradient(circle,#000 0 62%,transparent 63%);
animation:spin 16s linear infinite;filter:saturate(1.4)}
.kale2{position:absolute;left:50%;top:290px;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;opacity:.75;
background:repeating-conic-gradient(from 8deg,#5ff2ff 0 14deg,#ff5fa2 14deg 28deg,#fff35f 28deg 42deg,#8f7bff 42deg 56deg);
-webkit-mask:radial-gradient(circle,transparent 0 30%,#000 31% 58%,transparent 59%);
mask:radial-gradient(circle,transparent 0 30%,#000 31% 58%,transparent 59%);
animation:spinRev 11s linear infinite;filter:saturate(1.4) blur(1px)}
@keyframes spin{0%{transform:rotate(0) scale(.6);opacity:0}12%{opacity:1}100%{transform:rotate(360deg) scale(1)}}
@keyframes spinRev{0%{transform:rotate(0) scale(.6);opacity:0}12%{opacity:.75}100%{transform:rotate(-360deg) scale(1)}}
.medal{position:absolute;left:50%;top:290px;width:128px;height:128px;margin:-64px 0 0 -64px;z-index:5;border-radius:50%;
background:radial-gradient(circle at 35% 30%,#2a2f45,#0c0e18 70%);border:2px solid rgba(255,255,255,.35);
display:flex;align-items:center;justify-content:center;font-size:48px;color:#fff;
box-shadow:0 0 40px rgba(255,255,255,.25);opacity:0;animation:medalIn 1.1s cubic-bezier(.2,.8,.3,1.35) both;animation-delay:1.2s}
@keyframes medalIn{0%{opacity:0;transform:scale(.3) rotate(-120deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.brand{position:absolute;left:0;right:0;top:620px;text-align:center;z-index:6;
opacity:0;animation:fadeUp 1s ease-out both;animation-delay:1.6s}
.brand h1{font-size:36px;font-weight:700;letter-spacing:14px;color:#f2ecff;text-indent:14px}
.brand p{font-size:13px;letter-spacing:6px;color:#9a8fd8;margin-top:12px;text-indent:6px}
@keyframes fadeUp{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:translateY(0)}}
.replay{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);z-index:50;
border:1px solid rgba(180,160,255,.45);background:rgba(140,120,255,.1);color:#d8ccff;
font-size:13px;letter-spacing:3px;padding:10px 26px;border-radius:24px;cursor:pointer}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body>
<div class="stage">
  <div class="kale"></div><div class="kale2"></div>
  <div class="medal">幻</div>
  <div class="brand"><h1>幻镜</h1><p>万象皆在其中</p></div>
  <button class="replay">重新播放</button>
</div>
<script>
function bind(){document.querySelector('.replay').addEventListener('click',()=>{
const s=document.querySelector('.stage');const n=s.cloneNode(true);s.replaceWith(n);bind();});}
bind();
</script>
</body></html>
