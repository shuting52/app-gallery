<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>冰雪纷飞</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:430px;height:900px}
body{overflow:hidden;position:relative;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(#a8c6e8,#dfeefb 65%,#f4fafd);color:#fff}
.stage{position:absolute;inset:0;overflow:hidden}
.brand{position:absolute;left:0;right:0;top:648px;text-align:center;z-index:5;animation:brandIn 1s ease 2s both}
.brand h1{font-size:36px;letter-spacing:10px;font-weight:800}
.brand p{font-size:13px;letter-spacing:6px;opacity:.65;margin-top:10px}
@keyframes brandIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.replay{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);z-index:9;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;font-size:13px;padding:9px 26px;border-radius:24px;cursor:pointer;backdrop-filter:blur(6px)}
.flake{position:absolute;top:-20px;background:#fff;border-radius:50%;opacity:.9;animation:snow linear infinite}
@keyframes snow{to{transform:translateY(940px) translateX(40px)}}
.bigsnow{position:absolute;left:50%;top:300px;width:150px;height:150px;transform:translate(-50%,-50%);animation:spin 24s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.hill{position:absolute;bottom:0;left:-10%;width:120%;height:220px;background:#fff;border-radius:50% 50% 0 0;opacity:.9}
</style></head><body>
<div class="stage"><svg class="bigsnow" viewBox="0 0 100 100"><g stroke="#5b8fd6" stroke-width="5" stroke-linecap="round">
