<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>陶轮匠心</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000}
body{width:430px;height:900px;margin:0 auto;position:relative;overflow:hidden;
font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:#fff}

body{background:linear-gradient(#241610 0%,#3a2415 60%,#4a2f1c 100%)}
.wheel{position:absolute;left:50%;bottom:170px;transform:translateX(-50%);z-index:2}
.wheel .disc{width:250px;height:56px;margin:0 auto;border-radius:50%;
background:radial-gradient(circle at 50% 40%,#6e5844,#3e3023 70%);
animation:spinW 2.2s linear infinite;box-shadow:0 14px 30px rgba(0,0,0,.5)}
@keyframes spinW{to{transform:rotate(360deg)}}
.wheel .disc::before{content:"";position:absolute;left:50%;top:50%;width:200px;height:30px;
transform:translate(-50%,-50%);border-radius:50%;border:3px dashed rgba(255,255,255,.18)}
.wheel .leg{width:26px;height:120px;margin:0 auto;background:#2c1f14}
.vase{position:absolute;left:50%;bottom:206px;transform:translateX(-50%);z-index:3;transform-origin:50% 100%;
animation:grow 6s ease-in-out infinite;animation-delay:-3s}
@keyframes grow{0%{transform:translateX(-50%) scale(.25,.35)}45%{transform:translateX(-50%) scale(1.06,.98)}
60%,100%{transform:translateX(-50%) scale(1,1)}}
.vase .bd{width:120px;height:150px;margin:0 auto;background:linear-gradient(135deg,#c98a5c,#a86a3e 60%,#8a5228);
border-radius:46% 46% 42% 42% / 30% 30% 62% 62%;box-shadow:inset -14px -10px 24px rgba(60,30,10,.4)}
.vase .neck{width:56px;height:44px;margin:-8px auto 0;background:linear-gradient(135deg,#c98a5c,#a86a3e);
border-radius:10px 10px 0 0}
.vase .lip{width:76px;height:16px;margin:0 auto;background:#d89a68;border-radius:50%}
.chip{position:absolute;bottom:230px;width:8px;height:8px;border-radius:50%;background:#c98a5c;
animation:chipF 2.6s ease-in infinite;z-index:4}
@keyframes chipF{from{transform:translate(0,0);opacity:1}to{transform:translate(60px,-140px);opacity:0}}
.lamp2{position:absolute;left:50%;top:90px;transform:translateX(-50%);width:200px;height:120px;z-index:1;
background:radial-gradient(circle at 50% 30%,rgba(255,200,120,.35),transparent 65%)}

.brand{position:absolute;left:0;right:0;bottom:150px;text-align:center;z-index:20;
animation:brandIn 1.1s cubic-bezier(.2,.7,.3,1.2) .9s both}
.brand h1{font-size:36px;letter-spacing:10px;font-weight:800;text-shadow:0 4px 24px rgba(0,0,0,.45)}
.brand p{margin-top:12px;font-size:13px;letter-spacing:6px;opacity:.75}
@keyframes brandIn{from{opacity:0;transform:translateY(26px) scale(.94)}}
.replay{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);z-index:30;
background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;
border-radius:24px;padding:10px 26px;font-size:13px;letter-spacing:2px;cursor:pointer;
backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body>
<div id="st">
<div class="lamp2"></div>
<div class="vase"><div class="lip"></div><div class="neck"></div><div class="bd"></div></div>
<div class="wheel"><div class="disc"></div><div class="leg"></div></div>
<div class="chip" style="left:170px;animation-delay:-.7s"></div>
<div class="chip" style="left:250px;animation-delay:-1.8s"></div>
<div class="chip" style="left:210px;animation-delay:-2.3s"></div>
</div>
<div class="brand"><h1>陶轮匠心</h1><p>POTTERY SOUL</p></div>
<button class="replay" onclick="var s=document.getElementById('st');var c=s.cloneNode(true);s.replaceWith(c);">重新播放</button>
</body></html>
