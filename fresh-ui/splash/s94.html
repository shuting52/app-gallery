<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雨巷听雨</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000}
body{width:430px;height:900px;margin:0 auto;position:relative;overflow:hidden;
font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:#fff}

body{background:linear-gradient(#101623 0%,#182134 60%,#1e2a40 100%)}
.lamp{position:absolute;left:80px;top:120px;z-index:3}
.lamp .pole{width:10px;height:330px;margin:0 auto;background:#0a0d14}
.lamp .head{width:64px;height:44px;margin:0 auto;background:#2a3348;border-radius:8px 8px 4px 4px;position:relative}
.lamp .bulb{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;
background:#ffe9a8;box-shadow:0 0 40px 16px rgba(255,220,140,.55)}
.cone{position:absolute;left:80px;top:210px;transform:translateX(-50%);width:280px;height:340px;z-index:2;
background:linear-gradient(rgba(255,225,150,.28),rgba(255,225,150,0));clip-path:polygon(42% 0,58% 0,100% 100%,0 100%)}
.rain{position:absolute;inset:0;z-index:4;background:repeating-linear-gradient(105deg,transparent 0 14px,
rgba(174,194,224,.5) 14px 15px,transparent 15px 30px);animation:rainF .7s linear infinite}
@keyframes rainF{to{background-position:-46px 92px}}
.ripple{position:absolute;bottom:120px;border:2px solid rgba(174,194,224,.6);border-radius:50%;
animation:rip 2.8s ease-out infinite}
@keyframes rip{from{width:10px;height:5px;opacity:.9}to{width:90px;height:22px;opacity:0}}
.ground{position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(#232c40,#141a28);z-index:1}
.bld{position:absolute;bottom:120px;width:120px;height:420px;background:#0c101b;z-index:0}
.win{position:absolute;width:26px;height:34px;background:#ffd98a;box-shadow:0 0 18px 6px rgba(255,200,110,.5);
animation:winF 5s ease-in-out infinite}
@keyframes winF{50%{opacity:.55}}

.brand{position:absolute;left:0;right:0;bottom:150px;text-align:center;z-index:20;
animation:brandIn 1.1s cubic-bezier(.2,.7,.3,1.2) .9s both}
.brand h1{font-size:36px;letter-spacing:10px;font-weight:800;text-shadow:0 4px 24px rgba(0,0,0,.45)}
.brand p{margin-top:12px;font-size:13px;letter-spacing:6px;opacity:.75}
@keyframes brandIn{from{opacity:0;transform:translateY(26px) scale(.94)}}
.replay{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);z-index:30;
background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;
border-radius:24px;padding:10px 26px;font-size:13px;letter-spacing:2px;cursor:pointer;
backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body>
<div id="st">
<div class="bld" style="left:0"><div class="win" style="left:30px;top:80px"></div><div class="win" style="left:70px;top:180px;animation-delay:-2s"></div></div>
<div class="bld" style="right:0"><div class="win" style="left:24px;top:120px;animation-delay:-1s"></div><div class="win" style="left:66px;top:260px;animation-delay:-3.4s"></div></div>
<div class="cone"></div>
<div class="lamp"><div class="head"><div class="bulb"></div></div><div class="pole"></div></div>
<div class="ground"></div>
<div class="ripple" style="left:120px;animation-delay:-.5s"></div>
<div class="ripple" style="left:230px;animation-delay:-1.6s"></div>
<div class="ripple" style="left:320px;animation-delay:-2.4s"></div>
<div class="rain"></div>
</div>
<div class="brand"><h1>雨巷听雨</h1><p>RAINY ALLEY</p></div>
<button class="replay" onclick="var s=document.getElementById('st');var c=s.cloneNode(true);s.replaceWith(c);">重新播放</button>
</body></html>
