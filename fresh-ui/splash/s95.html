<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>磁带时光</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000}
body{width:430px;height:900px;margin:0 auto;position:relative;overflow:hidden;
font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:#fff}

body{background:linear-gradient(#ff9a5c 0%,#ff7e7e 55%,#b4528e 100%)}
.tape{position:absolute;left:50%;top:300px;transform:translateX(-50%) rotate(-6deg);width:320px;height:200px;
background:linear-gradient(135deg,#2b2f3a,#171a22);border-radius:18px;z-index:3;
box-shadow:0 24px 60px rgba(60,10,40,.45);animation:tilt 5s ease-in-out infinite;animation-delay:-2s}
@keyframes tilt{50%{transform:translateX(-50%) rotate(5deg) translateY(-10px)}}
.tape .win{position:absolute;left:40px;right:40px;top:56px;height:70px;background:#0d0f14;border-radius:10px;overflow:hidden}
.reel{position:absolute;top:50%;width:52px;height:52px;transform:translateY(-50%);border-radius:50%;
background:#e8e4da;animation:spin 3s linear infinite}
.reel::before,.reel::after{content:"";position:absolute;background:#171a22;border-radius:4px}
.reel::before{left:8px;right:8px;top:50%;height:10px;transform:translateY(-50%)}
.reel::after{top:8px;bottom:8px;left:50%;width:10px;transform:translateX(-50%)}
.reel.r1{left:22px}.reel.r2{right:22px;animation-delay:-1.2s}
@keyframes spin{to{transform:translateY(-50%) rotate(360deg)}}
.tape .lbl{position:absolute;left:40px;right:40px;bottom:22px;height:34px;border-radius:8px;
background:linear-gradient(90deg,#ffcf6e,#ff9a5c);opacity:.9}
.note{position:absolute;font-size:30px;color:rgba(255,255,255,.9);animation:float 4s ease-in infinite;z-index:4}
@keyframes float{from{transform:translateY(20px) rotate(-8deg);opacity:0}30%{opacity:1}to{transform:translateY(-160px) rotate(10deg);opacity:0}}
.line{position:absolute;left:0;right:0;bottom:0;height:190px;
background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,255,255,.25) 46px 48px);z-index:1}

.brand{position:absolute;left:0;right:0;bottom:150px;text-align:center;z-index:20;
animation:brandIn 1.1s cubic-bezier(.2,.7,.3,1.2) .9s both}
.brand h1{font-size:36px;letter-spacing:10px;font-weight:800;text-shadow:0 4px 24px rgba(0,0,0,.45)}
.brand p{margin-top:12px;font-size:13px;letter-spacing:6px;opacity:.75}
@keyframes brandIn{from{opacity:0;transform:translateY(26px) scale(.94)}}
.replay{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);z-index:30;
background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;
border-radius:24px;padding:10px 26px;font-size:13px;letter-spacing:2px;cursor:pointer;
backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body>
<div id="st">
<div class="line"></div>
<div class="tape"><div class="win"><div class="reel r1"></div><div class="reel r2"></div></div><div class="lbl"></div></div>
<div class="note" style="left:90px;bottom:200px;animation-delay:-1s">♪</div>
<div class="note" style="left:200px;bottom:170px;animation-delay:-2.6s;font-size:24px">♫</div>
<div class="note" style="left:310px;bottom:210px;animation-delay:-3.4s">♪</div>
<div class="note" style="left:150px;bottom:150px;animation-delay:-.4s;font-size:22px">♫</div>
</div>
<div class="brand"><h1>磁带时光</h1><p>CASSETTE DAYS</p></div>
<button class="replay" onclick="var s=document.getElementById('st');var c=s.cloneNode(true);s.replaceWith(c);">重新播放</button>
</body></html>
