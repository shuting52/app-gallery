<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>沙漏逆转 · 启动页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0d0a07;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.stage{width:430px;height:900px;max-width:100vw;max-height:100vh;position:relative;overflow:hidden;
background:radial-gradient(100% 70% at 50% 30%,#241a10 0%,#0d0a07 60%,#070503 100%)}
.hg{position:absolute;left:50%;top:200px;width:170px;height:260px;margin-left:-85px;z-index:3;
animation:flipHg .9s cubic-bezier(.5,0,.4,1) both;animation-delay:.2s}
@keyframes flipHg{0%{transform:rotate(0)}100%{transform:rotate(180deg)}}
.cap{position:absolute;left:10px;right:10px;height:14px;border-radius:7px;background:linear-gradient(180deg,#6b543a,#3d3020);z-index:4}
.cap.top{top:0}.cap.bot{bottom:0}
.glass{position:absolute;left:25px;right:25px;top:14px;bottom:14px;
background:rgba(255,240,210,.06);border:1px solid rgba(220,190,140,.35)}
.bulbT{position:absolute;left:25px;right:25px;top:14px;height:116px;
background:rgba(255,240,210,.06);clip-path:polygon(0 0,100% 0,50% 100%)}
.bulbB{position:absolute;left:25px;right:25px;bottom:14px;height:116px;
background:rgba(255,240,210,.06);clip-path:polygon(50% 0,100% 100%,0 100%)}
.sandT{position:absolute;left:45px;right:45px;top:20px;height:80px;transform-origin:top;
background:linear-gradient(180deg,#f5cf7a,#e0a83e);clip-path:polygon(0 0,100% 0,50% 100%);
animation:sandOut 2.2s linear both;animation-delay:1.1s}
@keyframes sandOut{0%{transform:scaleY(1);opacity:1}100%{transform:scaleY(.06);opacity:1}}
.stream{position:absolute;left:50%;top:120px;width:6px;height:120px;margin-left:-3px;border-radius:3px;
background:linear-gradient(180deg,#f5cf7a,rgba(245,207,122,.1));opacity:0;
animation:stream 2.2s linear both;animation-delay:1.1s}
@keyframes stream{0%{opacity:0}12%{opacity:1}92%{opacity:1}100%{opacity:0}}
.pile{position:absolute;left:45px;right:45px;bottom:20px;height:80px;transform-origin:bottom;
background:linear-gradient(180deg,#f5cf7a,#d8952e);clip-path:polygon(50% 0,100% 100%,0 100%);
transform:scaleY(.06);animation:pileUp 2.2s linear both;animation-delay:1.1s}
@keyframes pileUp{0%{transform:scaleY(.06)}100%{transform:scaleY(1)}}
.mark{position:absolute;left:50%;top:540px;width:104px;height:104px;margin-left:-52px;z-index:5;border-radius:50%;
border:2px solid rgba(245,207,122,.8);display:flex;align-items:center;justify-content:center;
font-size:44px;color:#f5d894;background:rgba(30,22,12,.6);box-shadow:0 0 34px rgba(245,207,122,.3);
opacity:0;animation:pop 1s cubic-bezier(.2,.8,.3,1.4) both;animation-delay:2.6s}
@keyframes pop{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:scale(1)}}
.brand{position:absolute;left:0;right:0;top:680px;text-align:center;z-index:6;
opacity:0;animation:fadeUp 1s ease-out both;animation-delay:2.9s}
.brand h1{font-size:36px;font-weight:700;letter-spacing:14px;color:#f5e8cf;text-indent:14px}
.brand p{font-size:13px;letter-spacing:6px;color:#a88f62;margin-top:12px;text-indent:6px}
@keyframes fadeUp{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:translateY(0)}}
.replay{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);z-index:50;
border:1px solid rgba(220,190,140,.4);background:rgba(220,190,140,.08);color:#e8d3a8;
font-size:13px;letter-spacing:3px;padding:10px 26px;border-radius:24px;cursor:pointer}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body>
<div class="stage">
  <div class="hg">
    <div class="glass"></div>
    <div class="bulbT"></div><div class="bulbB"></div>
    <div class="sandT"></div><div class="stream"></div><div class="pile"></div>
    <div class="cap top"></div><div class="cap bot"></div>
  </div>
  <div class="mark">时</div>
  <div class="brand"><h1>沙时</h1><p>时间为你倒流</p></div>
  <button class="replay">重新播放</button>
</div>
<script>
function bind(){document.querySelector('.replay').addEventListener('click',()=>{
const s=document.querySelector('.stage');const n=s.cloneNode(true);s.replaceWith(n);bind();});}
bind();
</script>
</body></html>
