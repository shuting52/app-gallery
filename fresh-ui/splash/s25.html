<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>钟表匠</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#e9dcc3;display:flex;justify-content:center;font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;overflow:hidden}
.stage{width:430px;height:900px;max-height:100vh;position:relative;overflow:hidden;background:radial-gradient(100% 80% at 50% 30%,#f7efdd 0%,#e9dcc3 60%,#d9c8a6 100%)}
.face{position:absolute;left:50%;top:170px;width:280px;height:280px;margin-left:-140px;border-radius:50%;background:radial-gradient(circle at 40% 32%,#fffdf6,#f3e8d2 70%);box-shadow:0 24px 60px rgba(120,90,40,.28),inset 0 0 0 10px #8a6d43,inset 0 0 0 14px #f3e8d2;animation:pop 1s cubic-bezier(.2,1.4,.4,1) .1s both}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.ticks{position:absolute;inset:22px;border-radius:50%;background:repeating-conic-gradient(#5a4a33 0 2deg,transparent 2deg 30deg);-webkit-mask:radial-gradient(closest-side,transparent 88%,#000 89%);mask:radial-gradient(closest-side,transparent 88%,#000 89%)}
.num{position:absolute;font-size:22px;font-weight:700;color:#5a4a33;animation:fadein .8s ease 1.6s both}
.num.n12{left:50%;top:34px;transform:translateX(-50%)}
.num.n3{right:38px;top:50%;transform:translateY(-50%)}
.num.n6{left:50%;bottom:34px;transform:translateX(-50%)}
.num.n9{left:38px;top:50%;transform:translateY(-50%)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:6px}
.hand.h{width:10px;height:70px;margin-left:-5px;background:#3d3d3d;animation:spinH 2.4s cubic-bezier(.25,.9,.3,1.05) .5s both}
.hand.m{width:7px;height:104px;margin-left:-3.5px;background:#8a6d43;animation:spinM 2.4s cubic-bezier(.25,.9,.3,1.05) .5s both}
@keyframes spinH{from{transform:rotate(-540deg)}to{transform:rotate(0deg)}}
@keyframes spinM{from{transform:rotate(-900deg)}to{transform:rotate(0deg)}}
.pin{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d8b06a,#8a5f2b);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.gearsm{position:absolute;font-size:15px;letter-spacing:6px;color:#8a6d43}
.brand{position:absolute;left:0;right:0;bottom:180px;text-align:center;animation:up 1.2s ease 1.9s both}
.brand h1{font-size:54px;letter-spacing:20px;text-indent:20px;color:#4a3a26;font-weight:800}
.brand p{margin-top:14px;font-size:14px;letter-spacing:6px;color:#8a6d43}
@keyframes up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.replay{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);z-index:50;padding:10px 26px;border-radius:999px;border:1px solid rgba(74,58,38,.5);background:rgba(255,255,255,.5);color:#4a3a26;font-size:13px;letter-spacing:4px;text-indent:4px;cursor:pointer}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body><div class="stage">
<div class="face"><div class="ticks"></div>
<span class="num n12">12</span><span class="num n3">3</span><span class="num n6">6</span><span class="num n9">9</span>
<div class="hand h"></div><div class="hand m"></div><div class="pin"></div>
</div>
<div class="brand"><h1>钟表匠</h1><p>时间 匠心打磨</p></div>
<button class="replay" onclick="location.reload()">重新播放</button>
</div></body></html>
