<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>暮钟飞鸽</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000}
body{width:430px;height:900px;margin:0 auto;position:relative;overflow:hidden;
font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:#fff}

body{background:linear-gradient(#2b1e4e 0%,#7a3f6e 45%,#e88a5c 75%,#f7b95c 100%)}
.tower{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);z-index:3}
.tower .bd{width:130px;height:380px;margin:0 auto;background:linear-gradient(90deg,#3a2c50,#2c213e);
clip-path:polygon(8% 0,92% 0,100% 100%,0 100%)}
.tower .top{width:150px;height:60px;margin:0 auto;background:#241b33;border-radius:8px}
.tower .spire{width:0;height:0;margin:0 auto;border-left:26px solid transparent;border-right:26px solid transparent;
border-bottom:64px solid #1c1528}
.face{position:absolute;left:50%;top:110px;transform:translateX(-50%);width:84px;height:84px;border-radius:50%;
background:#f5eeda;border:6px solid #1c1528;z-index:4}
.face .h{position:absolute;left:50%;bottom:50%;width:6px;height:24px;margin-left:-3px;background:#2c213e;transform-origin:50% 100%;
animation:clkH 24s linear infinite}
.face .m{position:absolute;left:50%;bottom:50%;width:4px;height:34px;margin-left:-2px;background:#2c213e;transform-origin:50% 100%;
animation:clkM 6s linear infinite;animation-delay:-2s}
@keyframes clkH{to{transform:rotate(360deg)}}
@keyframes clkM{to{transform:rotate(360deg)}}
.dove{position:absolute;font-size:26px;color:#2c213e;animation:fly 10s linear infinite;z-index:2}
@keyframes fly{from{transform:translateX(-70px) translateY(10px)}to{transform:translateX(540px) translateY(-70px)}}
.ground{position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(#241b33,#171126);z-index:2}
.win2{position:absolute;width:18px;height:26px;background:#ffca7a;box-shadow:0 0 14px 5px rgba(255,200,110,.55);
animation:winF 4s ease-in-out infinite}
@keyframes winF{50%{opacity:.6}}

.brand{position:absolute;left:0;right:0;bottom:150px;text-align:center;z-index:20;
animation:brandIn 1.1s cubic-bezier(.2,.7,.3,1.2) .9s both}
.brand h1{font-size:36px;letter-spacing:10px;font-weight:800;text-shadow:0 4px 24px rgba(0,0,0,.45)}
.brand p{margin-top:12px;font-size:13px;letter-spacing:6px;opacity:.75}
@keyframes brandIn{from{opacity:0;transform:translateY(26px) scale(.94)}}
.replay{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);z-index:30;
background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;
border-radius:24px;padding:10px 26px;font-size:13px;letter-spacing:2px;cursor:pointer;
backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body>
<div id="st">
<div class="tower"><div class="spire"></div><div class="top"></div><div class="bd">
<div class="win2" style="left:24px;top:60px"></div><div class="win2" style="right:24px;top:140px;animation-delay:-2s"></div>
<div class="win2" style="left:24px;top:230px;animation-delay:-1s"></div></div></div>
<div class="face"><div class="h"></div><div class="m"></div></div>
<div class="ground"></div>
<div class="dove" style="top:180px;animation-delay:-2s">﹏</div>
<div class="dove" style="top:240px;animation-delay:-5.5s;font-size:20px">﹏</div>
<div class="dove" style="top:150px;animation-delay:-8s;font-size:22px">﹏</div>
</div>
<div class="brand"><h1>暮钟飞鸽</h1><p>DUSK BELLS</p></div>
<button class="replay" onclick="var s=document.getElementById('st');var c=s.cloneNode(true);s.replaceWith(c);">重新播放</button>
</body></html>
