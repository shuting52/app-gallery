<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>水母漂流</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overflow:hidden}
.stage{position:fixed;inset:0;overflow:hidden}
.brand{position:absolute;left:0;right:0;top:60%;text-align:center;z-index:30;animation:brandIn 1.1s cubic-bezier(.2,.7,.3,1.2) 1.7s both}
.brand h1{font-size:44px;letter-spacing:14px;text-indent:14px;font-weight:800}
.brand p{margin-top:12px;font-size:13px;letter-spacing:5px;opacity:.72}
@keyframes brandIn{from{opacity:0;transform:translateY(26px) scale(.94)}to{opacity:1;transform:none}}
.replay{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);z-index:40;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:10px 28px;font-size:13px;letter-spacing:3px;cursor:pointer;backdrop-filter:blur(6px)}
.replay.dk{border-color:rgba(0,0,0,.25);background:rgba(0,0,0,.08);color:#2a2a2a}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{transform:translateY(0);opacity:0}12%{opacity:1}to{transform:translateY(-340px) translateX(var(--dx,0px));opacity:0}}
@keyframes fall{to{transform:translateY(960px)}}
@keyframes sway{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes ringX{from{transform:translateX(-50%) scale(.5);opacity:.8}to{transform:translateX(-50%) scale(1.5);opacity:0}}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}

.stage{background:linear-gradient(#041a2e,#0a3a5e 70%,#0e5578)}
 .brand h1,.brand p{color:#fff}
.ray{position:absolute;top:-5%;width:90px;height:70%;background:linear-gradient(rgba(160,220,255,.14),transparent);transform:skewX(-14deg);filter:blur(4px)}
.r1{left:18%}.r2{left:62%;animation-delay:-3s}
.jel{position:absolute;left:50%;top:44%;animation:jdrift 9s ease-in-out infinite}
@keyframes jdrift{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-46px)}}
.dome{width:132px;height:82px;margin-left:-66px;background:radial-gradient(circle at 50% 22%,rgba(255,190,225,.95),rgba(205,130,225,.6) 62%,rgba(205,130,225,.12) 75%);border-radius:66px 66px 14px 14px;box-shadow:0 0 34px rgba(220,150,230,.5);animation:jpulse 3s ease-in-out infinite}
@keyframes jpulse{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.12) scaleY(.94)}}
.ten{position:absolute;top:80px;width:8px;background:linear-gradient(rgba(255,180,220,.75),transparent);border-radius:4px;transform-origin:top center;animation:sway 2.6s ease-in-out infinite alternate}
.bub{position:absolute;bottom:-10px;border-radius:50%;border:1px solid rgba(180,225,255,.6);background:rgba(180,225,255,.12);animation:rise linear infinite}
</style></head>
<body><div class="stage">
<div class="ray r1"></div><div class="ray r2"></div>
<span class="bub" style="left:49%;animation-delay:-4.6s;animation-duration:8.1s;width:6px;height:10px"></span>
<span class="bub" style="left:44%;animation-delay:-3.4s;animation-duration:5.2s;width:10px;height:10px"></span>
<span class="bub" style="left:79%;animation-delay:-4.5s;animation-duration:8.0s;width:5px;height:7px"></span>
<span class="bub" style="left:59%;animation-delay:-4.0s;animation-duration:7.6s;width:8px;height:6px"></span>
<span class="bub" style="left:92%;animation-delay:-5.2s;animation-duration:7.7s;width:7px;height:9px"></span>
<span class="bub" style="left:53%;animation-delay:-6.2s;animation-duration:8.2s;width:11px;height:6px"></span>
<span class="bub" style="left:57%;animation-delay:-5.8s;animation-duration:7.0s;width:10px;height:6px"></span>
<span class="bub" style="left:27%;animation-delay:-1.2s;animation-duration:6.5s;width:6px;height:11px"></span>
<span class="bub" style="left:37%;animation-delay:-1.7s;animation-duration:6.2s;width:11px;height:8px"></span>
<span class="bub" style="left:20%;animation-delay:-3.8s;animation-duration:5.0s;width:5px;height:7px"></span>
<span class="bub" style="left:10%;animation-delay:-2.3s;animation-duration:7.5s;width:7px;height:12px"></span>
<span class="bub" style="left:72%;animation-delay:-5.7s;animation-duration:8.4s;width:6px;height:6px"></span>
<div class="jel"><div class="dome"></div>
<span class="ten" style="left:-48px;animation-delay:-0.0s;height:80px"></span>
<span class="ten" style="left:-32px;animation-delay:-0.3s;height:98px"></span>
<span class="ten" style="left:-16px;animation-delay:-0.6s;height:116px"></span>
<span class="ten" style="left:0px;animation-delay:-0.9s;height:80px"></span>
<span class="ten" style="left:16px;animation-delay:-1.2s;height:98px"></span>
<span class="ten" style="left:32px;animation-delay:-1.5s;height:116px"></span>
<span class="ten" style="left:48px;animation-delay:-1.8s;height:80px"></span>
</div>
<div class="brand"><h1>深蓝</h1><p>在深海里 做一场梦</p></div>
<button class="replay">重新播放</button>
<script>
var tpl=document.body.innerHTML;
function bind(){document.querySelector('.replay').onclick=function(){document.body.innerHTML=tpl;bind();};}
bind();
</script>
</div></body></html>
