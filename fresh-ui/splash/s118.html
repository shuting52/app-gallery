<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">

<title>流星划夜</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:430px;height:900px}
body{overflow:hidden;position:relative;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#04040e;color:#fff}
.stage{position:absolute;inset:0;overflow:hidden}
.brand{position:absolute;left:0;right:0;top:648px;text-align:center;z-index:5;animation:brandIn 1s ease 2s both}
.brand h1{font-size:36px;letter-spacing:10px;font-weight:800}
.brand p{font-size:13px;letter-spacing:6px;opacity:.65;margin-top:10px}
@keyframes brandIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.replay{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);z-index:9;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;font-size:13px;padding:9px 26px;border-radius:24px;cursor:pointer;backdrop-filter:blur(6px)}
.star{position:absolute;width:4px;height:4px;background:#fff;border-radius:50%;animation:tw 2.6s ease-in-out infinite}
@keyframes tw{50%{opacity:.25;transform:scale(.7)}}
.meteor{position:absolute;width:130px;height:3px;border-radius:2px;background:linear-gradient(90deg,#fff,transparent);transform:rotate(-32deg);opacity:0;animation:shoot 5s linear infinite}
@keyframes shoot{0%,72%{opacity:0;transform:rotate(-32deg) translateX(0)}74%{opacity:1}88%{opacity:0;transform:rotate(-32deg) translateX(-420px)}100%{opacity:0}}
.moon{position:absolute;right:70px;top:120px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe8,#e8ddba 70%);box-shadow:0 0 50px #fff8d088}
</style></head><body>
