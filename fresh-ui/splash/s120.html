<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>风车慢转</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:430px;height:900px}
body{overflow:hidden;position:relative;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(#9fdcff,#e3f5e9 62%,#b8e0a8 62%,#8fc97e);color:#fff}
.stage{position:absolute;inset:0;overflow:hidden}
.brand{position:absolute;left:0;right:0;top:648px;text-align:center;z-index:5;animation:brandIn 1s ease 2s both}
.brand h1{font-size:36px;letter-spacing:10px;font-weight:800}
.brand p{font-size:13px;letter-spacing:6px;opacity:.65;margin-top:10px}
@keyframes brandIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.replay{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);z-index:9;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;font-size:13px;padding:9px 26px;border-radius:24px;cursor:pointer;backdrop-filter:blur(6px)}
.mill{position:absolute;left:50%;bottom:180px;transform:translateX(-50%)}
.tower{width:34px;height:220px;background:linear-gradient(#a9805a,#7a5a38);margin:0 auto;clip-path:polygon(20% 0,80% 0,100% 100%,0 100%)}
.blades{position:absolute;left:50%;top:-8px;width:0;height:0;transform:translateX(-50%);animation:rot 7s linear infinite;animation-delay:-3s}
@keyframes rot{to{transform:translateX(-50%) rotate(360deg)}}
.blade{position:absolute;left:-9px;top:-86px;width:18px;height:86px;background:linear-gradient(#fff,#cfe3f5);border-radius:9px;transform-origin:50% 86px}
.cloud{position:absolute;background:#fff;border-radius:40px;opacity:.9;animation:drift 18s linear infinite}
.cloud::before{content:"";position:absolute;width:40px;height:40px;background:#fff;border-radius:50%;top:-18px;left:14px}
.c1{width:90px;height:28px;top:150px;animation-delay:-6s}
.c2{width:70px;height:22px;top:300px;animation-delay:-13s}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(480px)}}
.birds{position:absolute;top:200px;left:60px;font-size:20px;color:#335;animation:flyb 9s linear infinite;letter-spacing:14px}
@keyframes flyb{from{transform:translateX(-80px)}to{transform:translateX(480px)}}
</style></head><body>
<div class="stage"><div class="cloud c1"></div><div class="cloud c2"></div><div class="birds">～ ～</div><div class="mill"><div class="blades"><div class="blade" style="transform:rotate(0deg)"></div><div class="blade" style="transform:rotate(90deg)"></div><div class="blade" style="transform:rotate(180deg)"></div><div class="blade" style="transform:rotate(270deg)"></div></div><div class="tower"></div></div></div>
<div class="brand"><h1>田野</h1><p>WINDMILL · 微风</p></div>
<button class="replay" onclick="location.reload()">&#8635; 重新播放</button>
</body></html>
