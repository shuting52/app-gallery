<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>折纸鹤</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#dfeef7;display:flex;justify-content:center;font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;overflow:hidden}
.stage{width:430px;height:900px;max-height:100vh;position:relative;overflow:hidden;background:linear-gradient(180deg,#8ec9ee 0%,#c4e4f7 45%,#eef8ff 100%)}
.sun{position:absolute;right:44px;top:70px;width:86px;height:86px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff6d8,#ffd76e 60%,#ffb84d);box-shadow:0 0 60px 18px rgba(255,205,110,.55)}
.cloud{position:absolute;background:#fff;border-radius:999px;filter:blur(2px);opacity:.92;animation:drift 26s linear -8s infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud.c1{width:120px;height:38px;top:150px;left:-140px}
.cloud.c1::before{width:56px;height:56px;left:18px;top:-26px}
.cloud.c1::after{width:40px;height:40px;left:64px;top:-18px}
.cloud.c2{width:90px;height:30px;top:300px;left:-110px;animation-duration:34s;animation-delay:-20s;opacity:.8}
.cloud.c2::before{width:44px;height:44px;left:14px;top:-20px}
.cloud.c2::after{width:32px;height:32px;left:50px;top:-14px}
@keyframes drift{to{transform:translateX(620px)}}
.fly{position:absolute;top:330px;left:0;animation:cross 7s linear -2s infinite}
@keyframes cross{from{transform:translate(-90px,0)}50%{transform:translate(215px,-46px)}to{transform:translate(520px,10px)}}
.crane{position:relative;width:120px;height:70px;animation:bob 1.6s ease-in-out -0.5s infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
.body{position:absolute;left:44px;top:26px;width:34px;height:18px;background:linear-gradient(135deg,#ff9d7a,#f2664d);transform:skewX(-24deg) rotate(8deg);border-radius:4px}
.neck{position:absolute;left:72px;top:16px;width:34px;height:8px;background:#f2664d;transform:rotate(-32deg);border-radius:4px}
.head{position:absolute;left:96px;top:2px;width:12px;height:12px;background:#e04f36;border-radius:50%}
.wing{position:absolute;top:30px;width:0;height:0;transform-origin:top center}
.wing.l{left:52px;border-left:26px solid transparent;border-right:26px solid transparent;border-bottom:52px solid #ffd9a8;animation:flapL .55s ease-in-out -0.2s infinite}
.wing.r{left:52px;border-left:26px solid transparent;border-right:26px solid transparent;border-bottom:52px solid #ffc48f;animation:flapR .55s ease-in-out -0.2s infinite}
@keyframes flapL{0%,100%{transform:rotateX(0) rotate(-14deg)}50%{transform:rotateX(58deg) rotate(-14deg)}}
@keyframes flapR{0%,100%{transform:rotateX(0) rotate(14deg) scaleX(-1)}50%{transform:rotateX(58deg) rotate(14deg) scaleX(-1)}}
.tail{position:absolute;left:36px;top:30px;border-top:10px solid transparent;border-bottom:10px solid transparent;border-right:22px solid #f2664d}
.brand{position:absolute;left:0;right:0;bottom:170px;text-align:center;animation:up 1.2s ease .8s both}
.brand h1{font-size:54px;letter-spacing:22px;text-indent:22px;color:#274b63;font-weight:800}
.brand p{margin-top:14px;font-size:14px;letter-spacing:6px;color:#5b7f99}
@keyframes up{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.replay{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);z-index:50;padding:10px 26px;border-radius:999px;border:1px solid rgba(39,75,99,.4);background:rgba(255,255,255,.55);color:#274b63;font-size:13px;letter-spacing:4px;text-indent:4px;cursor:pointer}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body><div class="stage">
<div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div>
<div class="fly"><div class="crane">
<div class="wing l"></div><div class="wing r"></div>
<div class="tail"></div><div class="body"></div><div class="neck"></div><div class="head"></div>
</div></div>
<div class="brand"><h1>纸鹤</h1><p>折一只鹤 寄一份念</p></div>
<button class="replay" onclick="location.reload()">重新播放</button>
</div></body></html>
