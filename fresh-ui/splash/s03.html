<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>书页翻飞 · 启动页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#2b2620;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",serif}
.stage{width:430px;height:900px;max-width:100vw;max-height:100vh;position:relative;overflow:hidden;
background:linear-gradient(180deg,#f5efe0 0%,#ece2cc 60%,#e0d2b4 100%)}
.book{position:absolute;left:50%;top:230px;width:280px;height:360px;margin-left:-140px;perspective:1200px;z-index:3}
.cover{position:absolute;inset:0;background:linear-gradient(135deg,#8a2f2b,#5e1f1d);border-radius:6px 14px 14px 6px;
box-shadow:14px 18px 40px rgba(60,30,20,.35)}
.cover span{position:absolute;inset:26px;border:1px solid rgba(240,220,180,.5);border-radius:4px 10px 10px 4px;
display:flex;align-items:center;justify-content:center;color:#f0dcb4;font-size:30px;letter-spacing:8px;text-indent:8px}
.page{position:absolute;left:8px;top:8px;width:264px;height:344px;transform-origin:left center;
background:linear-gradient(90deg,#fffdf6 0%,#f7f0dd 90%,#e8dcc0 100%);border-radius:4px 10px 10px 4px;
box-shadow:2px 0 6px rgba(0,0,0,.12);transform:rotateY(0deg);opacity:0;
animation:flip 1.1s cubic-bezier(.4,0,.3,1) both;animation-delay:var(--dl);backface-visibility:hidden}
.page:nth-child(2){--dl:.15s}.page:nth-child(3){--dl:.55s}.page:nth-child(4){--dl:.95s}
.page:nth-child(5){--dl:1.35s;background:linear-gradient(90deg,#fffdf6,#f3ead2)}
.page i{position:absolute;left:30px;right:30px;height:8px;border-radius:4px;background:#e2d6b8;display:block}
.page i:nth-child(1){top:60px}.page i:nth-child(2){top:84px;width:70%}.page i:nth-child(3){top:108px}
@keyframes flip{0%{opacity:1;transform:rotateY(0deg)}100%{opacity:1;transform:rotateY(-168deg)}}
.seal{position:absolute;left:50%;top:400px;width:110px;height:110px;margin:-55px 0 0 -55px;z-index:5;
display:flex;align-items:center;justify-content:center;opacity:0;animation:sealIn .7s cubic-bezier(.2,.9,.3,1.4) both;animation-delay:2.2s}
.seal b{width:96px;height:96px;border-radius:18px;background:#b03a2e;color:#fdf3df;font-size:52px;
display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(176,58,46,.4);transform:rotate(-8deg)}
@keyframes sealIn{0%{opacity:0;transform:scale(2.4)}60%{opacity:1;transform:scale(.94)}100%{opacity:1;transform:scale(1)}}
.brand{position:absolute;left:0;right:0;top:600px;text-align:center;z-index:6;
opacity:0;animation:fadeUp 1s ease-out both;animation-delay:2.5s}
.brand h1{font-size:36px;font-weight:700;letter-spacing:14px;color:#4a3b28;text-indent:14px}
.brand p{font-size:13px;letter-spacing:6px;color:#9a8464;margin-top:12px;text-indent:6px}
@keyframes fadeUp{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:translateY(0)}}
.replay{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);z-index:50;
border:1px solid rgba(120,90,50,.45);background:rgba(255,255,255,.5);color:#6b543a;
font-size:13px;letter-spacing:3px;padding:10px 26px;border-radius:24px;cursor:pointer}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body>
<div class="stage">
  <div class="book">
    <div class="cover"><span>纸间</span></div>
    <div class="page"><i></i><i></i><i></i></div>
    <div class="page"><i></i><i></i><i></i></div>
    <div class="page"><i></i><i></i><i></i></div>
    <div class="page"><i></i><i></i><i></i></div>
  </div>
  <div class="seal"><b>间</b></div>
  <div class="brand"><h1>纸间</h1><p>翻开新的一页</p></div>
  <button class="replay">重新播放</button>
</div>
<script>
function bind(){document.querySelector('.replay').addEventListener('click',()=>{
const s=document.querySelector('.stage');const n=s.cloneNode(true);s.replaceWith(n);bind();});}
bind();
</script>
</body></html>
