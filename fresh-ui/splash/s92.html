<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>纸翼环游</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000}
body{width:430px;height:900px;margin:0 auto;position:relative;overflow:hidden;
font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:#fff}

body{background:linear-gradient(#7ec8f7 0%,#bfe6fd 55%,#e8f7ff 100%)}
.sun{position:absolute;right:52px;top:64px;width:86px;height:86px;border-radius:50%;
background:radial-gradient(circle at 50% 50%,#fff6d8,#ffd94d 70%);box-shadow:0 0 60px 20px rgba(255,220,100,.55);
animation:sunP 4s ease-in-out infinite;animation-delay:-2s}
@keyframes sunP{50%{transform:scale(1.07)}}
.cloud{position:absolute;background:#fff;border-radius:40px;opacity:.92;animation:drift 16s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud.c1{width:120px;height:38px;top:150px;animation-delay:-4s}
.cloud.c1::before{width:52px;height:52px;left:18px;top:-26px}
.cloud.c1::after{width:36px;height:36px;left:64px;top:-18px}
.cloud.c2{width:90px;height:30px;top:330px;animation-duration:22s;animation-delay:-12s;opacity:.75}
.cloud.c2::before{width:40px;height:40px;left:14px;top:-20px}
.cloud.c2::after{width:28px;height:28px;left:50px;top:-14px}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(560px)}}
.globe{position:absolute;left:50%;top:330px;width:230px;height:230px;transform:translateX(-50%);
border-radius:50%;background:radial-gradient(circle at 35% 30%,#9fdcff,#3f8fd6 60%,#1f5fa8);
box-shadow:inset -18px -22px 40px rgba(0,20,60,.45),0 0 60px rgba(120,200,255,.5);overflow:hidden}
.land{position:absolute;background:#7ccf8a;border-radius:50%;opacity:.9}
.path{position:absolute;left:50%;top:330px;width:330px;height:330px;transform:translate(-50%,-50%)}
.path svg{width:100%;height:100%}
.orbit{position:absolute;left:50%;top:330px;width:330px;height:330px;transform:translate(-50%,-50%);
animation:orb 6s linear infinite;animation-delay:-1.5s}
@keyframes orb{to{transform:translate(-50%,-50%) rotate(360deg)}}
.plane{position:absolute;left:50%;top:-14px;transform:translateX(-50%);
width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-bottom:30px solid #fff;
filter:drop-shadow(0 4px 6px rgba(0,0,0,.25));animation:bank 6s ease-in-out infinite;animation-delay:-1.5s}
@keyframes bank{0%,100%{transform:translateX(-50%) rotate(-14deg)}50%{transform:translateX(-50%) rotate(14deg)}}

.brand{position:absolute;left:0;right:0;bottom:150px;text-align:center;z-index:20;
animation:brandIn 1.1s cubic-bezier(.2,.7,.3,1.2) .9s both}
.brand h1{font-size:36px;letter-spacing:10px;font-weight:800;text-shadow:0 4px 24px rgba(0,0,0,.45)}
.brand p{margin-top:12px;font-size:13px;letter-spacing:6px;opacity:.75}
@keyframes brandIn{from{opacity:0;transform:translateY(26px) scale(.94)}}
.replay{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);z-index:30;
background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;
border-radius:24px;padding:10px 26px;font-size:13px;letter-spacing:2px;cursor:pointer;
backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body>
<div id="st">
<div class="sun"></div>
<div class="cloud c1"></div><div class="cloud c2"></div>
<div class="globe"><div class="land" style="width:80px;height:56px;left:40px;top:60px"></div>
<div class="land" style="width:56px;height:70px;left:140px;top:110px"></div>
<div class="land" style="width:64px;height:44px;left:80px;top:150px"></div></div>
<div class="path"><svg viewBox="0 0 330 330"><circle cx="165" cy="165" r="165" fill="none"
stroke:#fff stroke-width="3" stroke-dasharray="10 12" opacity=".85"/></svg></div>
<div class="orbit"><div class="plane"></div></div>
</div>
<div class="brand"><h1>纸翼环游</h1><p>AROUND THE WORLD</p></div>
<button class="replay" onclick="var s=document.getElementById('st');var c=s.cloneNode(true);s.replaceWith(c);">重新播放</button>
</body></html>
