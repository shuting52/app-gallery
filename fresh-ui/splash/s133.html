<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>火凤涅槃</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overflow:hidden}
.stage{position:fixed;inset:0;overflow:hidden}
.brand{position:absolute;left:0;right:0;top:60%;text-align:center;z-index:30;animation:brandIn 1.1s cubic-bezier(.2,.7,.3,1.2) 1.7s both}
.brand h1{font-size:44px;letter-spacing:14px;text-indent:14px;font-weight:800}
.brand p{margin-top:12px;font-size:13px;letter-spacing:5px;opacity:.72}
@keyframes brandIn{from{opacity:0;transform:translateY(26px) scale(.94)}to{opacity:1;transform:none}}
.replay{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);z-index:40;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:10px 28px;font-size:13px;letter-spacing:3px;cursor:pointer;backdrop-filter:blur(6px)}
.replay.dk{border-color:rgba(0,0,0,.25);background:rgba(0,0,0,.08);color:#2a2a2a}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{transform:translateY(0);opacity:0}12%{opacity:1}to{transform:translateY(-340px) translateX(var(--dx,0px));opacity:0}}
@keyframes fall{to{transform:translateY(960px)}}
@keyframes sway{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes ringX{from{transform:translateX(-50%) scale(.5);opacity:.8}to{transform:translateX(-50%) scale(1.5);opacity:0}}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}

.stage{background:radial-gradient(circle at 50% 82%,#3d1010,#0a0505 72%)}
 .brand h1,.brand p{color:#fff}
.fring{position:absolute;bottom:26%;left:50%;border:3px solid rgba(255,150,50,.55);border-radius:50%;animation:ringX 3.2s ease-out infinite}
.femb{position:absolute;bottom:36%;width:7px;height:7px;border-radius:50%;background:#ffd23e;box-shadow:0 0 12px #ff9a1f;animation:rise linear infinite}
.phx{position:absolute;bottom:22%;left:50%;width:0;animation:phxUp 4.4s ease 1s both}
@keyframes phxUp{from{transform:translateY(60px) scale(.7);opacity:0}to{transform:translateY(-150px) scale(1);opacity:1}}
.pb{position:absolute;left:-13px;top:-70px;width:26px;height:64px;background:linear-gradient(#ffd23e,#ff5a1f);border-radius:50%;box-shadow:0 0 26px rgba(255,140,40,.9)}
.pw{position:absolute;top:-72px;width:96px;height:36px;background:linear-gradient(90deg,#ff9a3e,#ff3d00);animation:flap2 .45s ease-in-out infinite alternate}
.pl{right:6px;border-radius:90% 10% 60% 40%;transform-origin:right center}
.pr{left:6px;border-radius:10% 90% 40% 60%;transform-origin:left center;animation-name:flap2R}
@keyframes flap2{from{transform:rotate(14deg)}to{transform:rotate(-34deg)}}
@keyframes flap2R{from{transform:rotate(-14deg)}to{transform:rotate(34deg)}}
.pt{position:absolute;left:-4px;top:-16px;width:8px;height:44px;background:linear-gradient(transparent,#ff9a3e);filter:blur(2px);border-radius:4px}
</style></head>
<body><div class="stage">
<span class="fring" style="width:120px;height:120px;margin:-60px;animation-delay:-0.0s"></span>
<span class="fring" style="width:170px;height:170px;margin:-85px;animation-delay:-1.0s"></span>
<span class="fring" style="width:220px;height:220px;margin:-110px;animation-delay:-2.0s"></span>
<span class="femb" style="left:41%;--dx:-10px;animation-delay:-1.1s;animation-duration:3.6s"></span>
<span class="femb" style="left:60%;--dx:50px;animation-delay:-1.1s;animation-duration:3.4s"></span>
<span class="femb" style="left:57%;--dx:-8px;animation-delay:-0.8s;animation-duration:3.5s"></span>
<span class="femb" style="left:58%;--dx:39px;animation-delay:-2.5s;animation-duration:3.4s"></span>
<span class="femb" style="left:54%;--dx:42px;animation-delay:-0.9s;animation-duration:2.6s"></span>
<span class="femb" style="left:42%;--dx:-52px;animation-delay:-1.9s;animation-duration:3.0s"></span>
<span class="femb" style="left:42%;--dx:-16px;animation-delay:-0.3s;animation-duration:3.1s"></span>
<span class="femb" style="left:40%;--dx:33px;animation-delay:-1.7s;animation-duration:2.6s"></span>
<span class="femb" style="left:51%;--dx:-26px;animation-delay:-0.5s;animation-duration:3.0s"></span>
<span class="femb" style="left:42%;--dx:18px;animation-delay:-2.6s;animation-duration:2.8s"></span>
<span class="femb" style="left:56%;--dx:28px;animation-delay:-0.9s;animation-duration:3.2s"></span>
<span class="femb" style="left:59%;--dx:29px;animation-delay:-0.6s;animation-duration:2.9s"></span>
<div class="phx"><span class="pw pl"></span><span class="pw pr"></span><span class="pb"></span><span class="pt"></span></div>
<div class="brand"><h1>火凤</h1><p>浴火重生 光芒万丈</p></div>
<button class="replay">重新播放</button>
<script>
var tpl=document.body.innerHTML;
function bind(){document.querySelector('.replay').onclick=function(){document.body.innerHTML=tpl;bind();};}
bind();
</script>
</div></body></html>
