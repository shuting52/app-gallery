<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>羽化飞翔</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overflow:hidden}
.stage{position:fixed;inset:0;overflow:hidden}
.brand{position:absolute;left:0;right:0;top:60%;text-align:center;z-index:30;animation:brandIn 1.1s cubic-bezier(.2,.7,.3,1.2) 1.7s both}
.brand h1{font-size:44px;letter-spacing:14px;text-indent:14px;font-weight:800}
.brand p{margin-top:12px;font-size:13px;letter-spacing:5px;opacity:.72}
@keyframes brandIn{from{opacity:0;transform:translateY(26px) scale(.94)}to{opacity:1;transform:none}}
.replay{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);z-index:40;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:10px 28px;font-size:13px;letter-spacing:3px;cursor:pointer;backdrop-filter:blur(6px)}
.replay.dk{border-color:rgba(0,0,0,.25);background:rgba(0,0,0,.08);color:#2a2a2a}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{transform:translateY(0);opacity:0}12%{opacity:1}to{transform:translateY(-340px) translateX(var(--dx,0px));opacity:0}}
@keyframes fall{to{transform:translateY(960px)}}
@keyframes sway{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes ringX{from{transform:translateX(-50%) scale(.5);opacity:.8}to{transform:translateX(-50%) scale(1.5);opacity:0}}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}

.stage{background:linear-gradient(#2b1a3d,#5e2f4a 55%,#c96f4a)}
 .brand h1,.brand p{color:#fff}
.coc{position:absolute;bottom:24%;left:50%;width:92px;height:132px;margin-left:-46px;background:linear-gradient(#9a7a52,#5e4630);border-radius:50%;box-shadow:inset -8px -10px 20px rgba(0,0,0,.35);animation:cocOpen 2.6s ease 1.4s both}
@keyframes cocOpen{0%{transform:scale(1);opacity:1}55%{transform:scale(1.08);opacity:1}100%{transform:scaleX(1.35) scaleY(.9);opacity:0}}
.bfly{position:absolute;bottom:30%;left:50%;width:0;height:0;animation:bflyUp 3.4s ease 1.6s both}
@keyframes bflyUp{from{transform:translateY(50px);opacity:0}to{transform:translateY(-190px);opacity:1}}
.w{position:absolute;top:-70px;width:56px;height:72px;background:linear-gradient(135deg,#ffc4de,#ff6fa5);animation:flap .55s ease-in-out infinite alternate}
.wl{right:2px;border-radius:90% 10% 60% 40%;transform-origin:right center}
.wr{left:2px;border-radius:10% 90% 40% 60%;transform-origin:left center;animation-name:flapR}
@keyframes flap{from{transform:rotateY(8deg)}to{transform:rotateY(62deg)}}
@keyframes flapR{from{transform:rotateY(-8deg)}to{transform:rotateY(-62deg)}}
.bd{position:absolute;top:-64px;left:-4px;width:8px;height:60px;background:#5e2f4a;border-radius:4px}
</style></head>
<body><div class="stage">
<div class="coc"></div>
<div class="bfly"><span class="w wl"></span><span class="w wr"></span><span class="bd"></span></div>
<div class="brand"><h1>羽化</h1><p>破茧 是为了飞翔</p></div>
<button class="replay">重新播放</button>
<script>
var tpl=document.body.innerHTML;
function bind(){document.querySelector('.replay').onclick=function(){document.body.innerHTML=tpl;bind();};}
bind();
</script>
</div></body></html>
