<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>山水印章 · 启动页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#3a342a;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",serif}
.stage{width:430px;height:900px;max-width:100vw;max-height:100vh;position:relative;overflow:hidden;
background:linear-gradient(180deg,#f4eddc 0%,#ece1c8 60%,#e2d3b2 100%)}
.stage::before{content:"";position:absolute;inset:0;opacity:.5;
background:radial-gradient(80% 50% at 50% 0%,rgba(255,255,255,.5),transparent)}
.sun{position:absolute;left:50%;top:196px;width:84px;height:84px;margin-left:-42px;border-radius:50%;z-index:2;
background:radial-gradient(circle,#d84a3a 0%,#c03a2c 70%);opacity:0;
animation:sunUp 1.8s ease-out both;animation-delay:.3s}
@keyframes sunUp{0%{opacity:0;transform:translateY(40px)}100%{opacity:.92;transform:translateY(0)}}
.mt{position:absolute;left:0;right:0;z-index:3;opacity:0}
.mt svg{display:block;width:100%;height:100%}
.m1{top:230px;height:220px;animation:fadeIn 1.6s ease-out both;animation-delay:.5s;filter:blur(1px)}
.m2{top:330px;height:240px;animation:fadeIn 1.6s ease-out both;animation-delay:.9s}
.m3{top:450px;height:220px;animation:fadeIn 1.6s ease-out both;animation-delay:1.3s}
@keyframes fadeIn{0%{opacity:0;transform:translateY(26px)}100%{opacity:1;transform:translateY(0)}}
.mist{position:absolute;left:0;right:0;top:430px;height:90px;z-index:4;
background:linear-gradient(180deg,transparent,rgba(244,237,220,.85),transparent);
opacity:0;animation:fadeIn 1.8s ease-out both;animation-delay:1.6s}
.seal{position:absolute;left:50%;top:600px;width:104px;height:104px;margin-left:-52px;z-index:6;
opacity:0;transform:rotate(-8deg);animation:stamp .8s cubic-bezier(.3,1.2,.4,1) both;animation-delay:2.1s}
.seal b{width:104px;height:104px;border-radius:16px;background:#b03a2e;color:#fdf3df;font-size:56px;
display:flex;align-items:center;justify-content:center;box-shadow:0 8px 26px rgba(176,58,46,.45)}
@keyframes stamp{0%{opacity:0;transform:rotate(-8deg) scale(2.4)}
60%{opacity:1;transform:rotate(-8deg) scale(.94)}80%{transform:rotate(-8deg) scale(1.05)}
100%{opacity:1;transform:rotate(-8deg) scale(1)}}
.brand{position:absolute;left:0;right:0;top:90px;text-align:center;z-index:6;
opacity:0;animation:fadeUp 1.2s ease-out both;animation-delay:2.4s}
.brand h1{font-size:34px;font-weight:700;letter-spacing:16px;color:#3d3226;text-indent:16px}
.brand p{font-size:13px;letter-spacing:8px;color:#8a755a;margin-top:12px;text-indent:8px}
@keyframes fadeUp{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:translateY(0)}}
.replay{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);z-index:50;
border:1px solid rgba(120,95,60,.5);background:rgba(255,255,255,.55);color:#6b543a;
font-size:13px;letter-spacing:3px;padding:10px 26px;border-radius:24px;cursor:pointer}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body>
<div class="stage">
  <div class="sun"></div>
  <div class="mt m1"><svg viewBox="0 0 430 220" preserveAspectRatio="none">
    <path d="M0 200 L90 90 L150 150 L230 50 L310 140 L370 80 L430 170 L430 220 L0 220 Z" fill="#b9ac93" opacity=".55"/></svg></div>
  <div class="mt m2"><svg viewBox="0 0 430 240" preserveAspectRatio="none">
    <path d="M0 220 L70 110 L140 180 L220 70 L300 170 L360 110 L430 190 L430 240 L0 240 Z" fill="#8d8271" opacity=".8"/></svg></div>
  <div class="mt m3"><svg viewBox="0 0 430 220" preserveAspectRatio="none">
    <path d="M0 200 L100 80 L180 160 L270 60 L350 150 L430 100 L430 220 L0 220 Z" fill="#5e5648"/></svg></div>
  <div class="mist"></div>
  <div class="seal"><b>印</b></div>
  <div class="brand"><h1>山水印</h1><p>方寸之间见天地</p></div>
  <button class="replay">重新播放</button>
</div>
<script>
function bind(){document.querySelector('.replay').addEventListener('click',()=>{
const s=document.querySelector('.stage');const n=s.cloneNode(true);s.replaceWith(n);bind();});}
bind();
</script>
</body></html>
