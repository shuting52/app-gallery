<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>霓虹雨夜</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#03040a;display:flex;justify-content:center;font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;overflow:hidden}
.stage{width:430px;height:900px;max-height:100vh;position:relative;overflow:hidden;background:linear-gradient(180deg,#070a18 0%,#0a1030 55%,#120a24 100%)}
.rain{position:absolute;inset:-60px;background:repeating-linear-gradient(105deg,transparent 0 14px,rgba(140,180,255,.28) 14px 15px,transparent 15px 34px);animation:rain .5s linear -0.2s infinite}
.rain.b{background:repeating-linear-gradient(105deg,transparent 0 26px,rgba(120,160,255,.16) 26px 28px,transparent 28px 60px);animation-duration:.9s}
@keyframes rain{to{transform:translateY(60px)}}
.sign{position:absolute;left:0;right:0;top:300px;text-align:center;animation:signin 1.1s ease .3s both}
@keyframes signin{from{opacity:0;transform:scale(1.15)}to{opacity:1;transform:scale(1)}}
.sign h1{font-size:88px;font-weight:800;letter-spacing:20px;text-indent:20px;color:#fff;
text-shadow:0 0 8px #fff,0 0 24px #ff2fb3,0 0 60px #ff2fb3,0 0 120px #b31fff;animation:flick 4s linear -1s infinite}
@keyframes flick{0%,100%{opacity:1}3%{opacity:.55}5%{opacity:1}42%{opacity:1}44%{opacity:.4}46%{opacity:1}78%{opacity:1}80%{opacity:.7}82%{opacity:1}}
.sign .en{margin-top:10px;font-size:13px;letter-spacing:10px;text-indent:10px;color:#7df9ff;text-shadow:0 0 14px #22d3ee}
.reflect{position:absolute;left:0;right:0;top:470px;text-align:center;transform:scaleY(-1);filter:blur(5px);opacity:.28;pointer-events:none}
.reflect span{font-size:88px;font-weight:800;letter-spacing:20px;color:#ff2fb3;animation:rip 2.6s ease-in-out -1s infinite}
@keyframes rip{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.06) skewX(3deg)}}
.ground{position:absolute;left:0;right:0;bottom:0;height:220px;background:linear-gradient(180deg,transparent,rgba(20,10,40,.9));border-top:1px solid rgba(125,249,255,.25)}
.puddle{position:absolute;bottom:120px;left:60px;right:60px;height:26px;border-radius:50%;background:radial-gradient(ellipse,rgba(125,249,255,.25),transparent 70%);animation:rip 2.6s ease-in-out -0.4s infinite}
.tag{position:absolute;left:0;right:0;bottom:200px;text-align:center;color:#9fb4d8;font-size:14px;letter-spacing:8px;text-indent:8px;animation:up 1.2s ease 1s both}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.replay{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);z-index:50;padding:10px 26px;border-radius:999px;border:1px solid rgba(255,47,179,.6);background:rgba(255,47,179,.12);color:#ffd7ef;font-size:13px;letter-spacing:4px;text-indent:4px;cursor:pointer}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body><div class="stage">
<div class="rain"></div><div class="rain b"></div>
<div class="sign"><h1>霓虹</h1><div class="en">NEON RAIN</div></div>
<div class="reflect"><span>霓虹</span></div>
<div class="ground"></div><div class="puddle"></div>
<div class="tag">雨夜不打烊</div>
<button class="replay" onclick="location.reload()">重新播放</button>
</div></body></html>
