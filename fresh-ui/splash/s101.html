<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>麦浪金风</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000}
body{width:430px;height:900px;margin:0 auto;position:relative;overflow:hidden;
font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:#fff}

body{background:linear-gradient(#ffe9b8 0%,#ffd98f 50%,#f7b95c 100%)}
.sun{position:absolute;left:50%;top:130px;transform:translateX(-50%);width:110px;height:110px;z-index:1}
.sun .core{position:absolute;inset:14px;border-radius:50%;
background:radial-gradient(circle at 50% 50%,#fff6d0,#ffcf4d 70%);box-shadow:0 0 50px 16px rgba(255,200,80,.55)}
.sun .ry{position:absolute;inset:0;animation:spinR 24s linear infinite;animation-delay:-8s}
@keyframes spinR{to{transform:rotate(360deg)}}
.sun .ry i{position:absolute;left:50%;top:0;width:6px;height:22px;margin-left:-3px;background:#ffcf4d;border-radius:3px;
transform-origin:3px 55px}
.layer{position:absolute;left:-80px;right:-80px;border-radius:50% 50% 0 0;animation:roll 6s ease-in-out infinite}
@keyframes roll{50%{transform:translateX(50px)}}
.layer.l1{bottom:150px;height:220px;background:#e8b84d;animation-delay:-1s}
.layer.l2{bottom:70px;height:220px;background:#d8a038;animation-delay:-3s}
.layer.l3{bottom:-30px;height:220px;background:#c08f2c;animation-delay:-5s}
.ear{position:absolute;bottom:120px;width:4px;background:#8a6a20;transform-origin:bottom;animation:sway 3.2s ease-in-out infinite;z-index:3}
.ear::before{content:"";position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:20px;height:32px;
background:linear-gradient(#f7d774,#d8a83c);border-radius:50% 50% 40% 40%}
@keyframes sway{50%{transform:rotate(10deg)}}
.bird{position:absolute;font-size:20px;color:#7a5a28;animation:fly 13s linear infinite}
@keyframes fly{from{transform:translateX(-60px)}to{transform:translateX(520px)}}

.brand{position:absolute;left:0;right:0;bottom:150px;text-align:center;z-index:20;
animation:brandIn 1.1s cubic-bezier(.2,.7,.3,1.2) .9s both}
.brand h1{font-size:36px;letter-spacing:10px;font-weight:800;text-shadow:0 4px 24px rgba(0,0,0,.45)}
.brand p{margin-top:12px;font-size:13px;letter-spacing:6px;opacity:.75}
@keyframes brandIn{from{opacity:0;transform:translateY(26px) scale(.94)}}
.replay{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);z-index:30;
background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;
border-radius:24px;padding:10px 26px;font-size:13px;letter-spacing:2px;cursor:pointer;
backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body>
<div id="st">
<div class="sun"><div class="ry"><i style="transform:rotate(0deg)"></i><i style="transform:rotate(45deg)"></i>
<i style="transform:rotate(90deg)"></i><i style="transform:rotate(135deg)"></i><i style="transform:rotate(180deg)"></i>
<i style="transform:rotate(225deg)"></i><i style="transform:rotate(270deg)"></i><i style="transform:rotate(315deg)"></i></div>
<div class="core"></div></div>
<div class="bird" style="top:220px;animation-delay:-5s">﹏</div>
<div class="layer l1"></div><div class="layer l2"></div><div class="layer l3"></div>
<div class="ear" style="left:70px;height:90px;animation-delay:-.6s"></div>
<div class="ear" style="left:140px;height:110px;animation-delay:-1.8s"></div>
<div class="ear" style="left:230px;height:96px;animation-delay:-2.7s"></div>
<div class="ear" style="left:310px;height:104px;animation-delay:-1.2s"></div>
<div class="ear" style="left:370px;height:88px;animation-delay:-2.2s"></div>
</div>
<div class="brand"><h1>麦浪金风</h1><p>GOLDEN WHEAT</p></div>
<button class="replay" onclick="var s=document.getElementById('st');var c=s.cloneNode(true);s.replaceWith(c);">重新播放</button>
</body></html>
