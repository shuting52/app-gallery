<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>蘑菇物语</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overflow:hidden}
.stage{position:fixed;inset:0;overflow:hidden}
.brand{position:absolute;left:0;right:0;top:60%;text-align:center;z-index:30;animation:brandIn 1.1s cubic-bezier(.2,.7,.3,1.2) 1.7s both}
.brand h1{font-size:44px;letter-spacing:14px;text-indent:14px;font-weight:800}
.brand p{margin-top:12px;font-size:13px;letter-spacing:5px;opacity:.72}
@keyframes brandIn{from{opacity:0;transform:translateY(26px) scale(.94)}to{opacity:1;transform:none}}
.replay{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);z-index:40;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:10px 28px;font-size:13px;letter-spacing:3px;cursor:pointer;backdrop-filter:blur(6px)}
.replay.dk{border-color:rgba(0,0,0,.25);background:rgba(0,0,0,.08);color:#2a2a2a}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{transform:translateY(0);opacity:0}12%{opacity:1}to{transform:translateY(-340px) translateX(var(--dx,0px));opacity:0}}
@keyframes fall{to{transform:translateY(960px)}}
@keyframes sway{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes ringX{from{transform:translateX(-50%) scale(.5);opacity:.8}to{transform:translateX(-50%) scale(1.5);opacity:0}}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}

.stage{background:linear-gradient(#0d2417,#1d4a2e 70%,#2a5e3a)}
 .brand h1,.brand p{color:#fff}
.gnd{position:absolute;bottom:-60px;left:-10%;width:120%;height:170px;background:#0a1c12;border-radius:50% 50% 0 0}
.msh{position:absolute;bottom:13%;transform-origin:bottom center;animation:grow 2.8s ease both}
.m1{left:50%;margin-left:-75px;animation-delay:1s}
.m2{left:16%;animation:grow2 2.8s ease 1.5s both}
.m3{right:14%;animation:grow3 2.8s ease 1.8s both}
@keyframes grow{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}
@keyframes grow2{from{transform:scale(.55) scaleY(0);opacity:0}to{transform:scale(.55) scaleY(1);opacity:1}}
@keyframes grow3{from{transform:scale(.7) scaleY(0);opacity:0}to{transform:scale(.7) scaleY(1);opacity:1}}
.cap{position:relative;width:150px;height:82px;background:radial-gradient(circle at 50% 28%,#ff8a8a,#d93a3a 75%);border-radius:50% 50% 10px 10px;margin:0 auto;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.m2 .cap,.m3 .cap{width:150px}
.stem{width:36px;height:96px;margin:-10px auto 0;background:linear-gradient(#f7ecd4,#e0cba0);border-radius:14px}
.cdot{position:absolute;border-radius:50%;background:#fff;opacity:.9}
.spo{position:absolute;bottom:20%;width:6px;height:6px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 10px #ffe9a8;animation:rise linear infinite}
</style></head>
<body><div class="stage">
<span class="spo" style="left:76%;animation-delay:-2.4s;animation-duration:5.6s"></span>
<span class="spo" style="left:23%;animation-delay:-1.5s;animation-duration:6.1s"></span>
<span class="spo" style="left:81%;animation-delay:-5.9s;animation-duration:7.5s"></span>
<span class="spo" style="left:17%;animation-delay:-3.8s;animation-duration:6.2s"></span>
<span class="spo" style="left:88%;animation-delay:-3.9s;animation-duration:7.0s"></span>
<span class="spo" style="left:20%;animation-delay:-1.6s;animation-duration:7.1s"></span>
<span class="spo" style="left:43%;animation-delay:-1.2s;animation-duration:7.4s"></span>
<span class="spo" style="left:60%;animation-delay:-2.3s;animation-duration:7.3s"></span>
<span class="spo" style="left:73%;animation-delay:-5.3s;animation-duration:7.3s"></span>
<span class="spo" style="left:42%;animation-delay:-4.6s;animation-duration:5.5s"></span>
<div class="gnd"></div>
<div class="msh m1"><div class="cap"><span class="cdot" style="left:30%;top:20%;width:12px;height:12px"></span>
<span class="cdot" style="left:38%;top:24%;width:9px;height:9px"></span>
<span class="cdot" style="left:66%;top:20%;width:12px;height:12px"></span>
<span class="cdot" style="left:74%;top:25%;width:9px;height:9px"></span>
<span class="cdot" style="left:58%;top:16%;width:10px;height:10px"></span></div><div class="stem"></div></div>
<div class="msh m2"><div class="cap"></div><div class="stem"></div></div>
<div class="msh m3"><div class="cap"></div><div class="stem"></div></div>
<div class="brand"><h1>菌语</h1><p>向下扎根 向上生长</p></div>
<button class="replay">重新播放</button>
<script>
var tpl=document.body.innerHTML;
function bind(){document.querySelector('.replay').onclick=function(){document.body.innerHTML=tpl;bind();};}
bind();
</script>
</div></body></html>
