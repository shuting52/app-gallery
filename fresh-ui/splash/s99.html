<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>火柴微光</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000}
body{width:430px;height:900px;margin:0 auto;position:relative;overflow:hidden;
font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:#fff}

body{background:radial-gradient(circle at 50% 62%,#2a1a10 0%,#0b0605 55%,#030202 100%)}
.halo{position:absolute;left:50%;top:330px;width:340px;height:340px;transform:translate(-50%,-50%);
background:radial-gradient(circle at 50% 50%,rgba(255,170,60,.35),transparent 65%);
animation:haloF 1.6s ease-in-out infinite;animation-delay:-.7s}
@keyframes haloF{50%{transform:translate(-50%,-50%) scale(1.12);opacity:.8}}
.stick{position:absolute;left:50%;top:470px;width:12px;height:200px;transform:translateX(-50%) rotate(8deg);
background:linear-gradient(#d8a860,#b07f3e);border-radius:6px;z-index:2}
.stick .tip{position:absolute;top:-26px;left:50%;transform:translateX(-50%);width:26px;height:32px;
background:#5a2c1a;border-radius:50% 50% 40% 40%}
.flame{position:absolute;left:50%;top:330px;transform:translateX(-50%);z-index:3;transform-origin:50% 100%;
animation:flick 1.1s ease-in-out infinite;animation-delay:-.4s}
@keyframes flick{0%,100%{transform:translateX(-50%) scale(1) skewX(0)}30%{transform:translateX(-50%) scale(1.06,1.12) skewX(4deg)}
60%{transform:translateX(-50%) scale(.94,1.04) skewX(-5deg)}}
.flame .o{width:74px;height:110px;background:radial-gradient(circle at 50% 70%,#fff3c4,#ffb52e 55%,#ff7a1a 80%,transparent 82%);
border-radius:50% 50% 50% 50% / 62% 62% 38% 38%}
.flame .i{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:30px;height:48px;
background:radial-gradient(circle at 50% 70%,#fffbe8,#ffe28a 70%,transparent 75%);border-radius:50% 50% 50% 50% / 62% 62% 38% 38%}
.ember{position:absolute;left:50%;top:420px;width:6px;height:6px;border-radius:50%;background:#ffb52e;
box-shadow:0 0 12px 4px rgba(255,160,60,.8);animation:emb 2.8s ease-in infinite}
@keyframes emb{from{transform:translate(0,0);opacity:1}to{transform:translate(36px,-260px);opacity:0}}

.brand{position:absolute;left:0;right:0;bottom:150px;text-align:center;z-index:20;
animation:brandIn 1.1s cubic-bezier(.2,.7,.3,1.2) .9s both}
.brand h1{font-size:36px;letter-spacing:10px;font-weight:800;text-shadow:0 4px 24px rgba(0,0,0,.45)}
.brand p{margin-top:12px;font-size:13px;letter-spacing:6px;opacity:.75}
@keyframes brandIn{from{opacity:0;transform:translateY(26px) scale(.94)}}
.replay{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);z-index:30;
background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;
border-radius:24px;padding:10px 26px;font-size:13px;letter-spacing:2px;cursor:pointer;
backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.replay:active{transform:translateX(-50%) scale(.94)}
</style></head><body>
<div id="st">
<div class="halo"></div>
<div class="stick"><div class="tip"></div></div>
<div class="flame"><div class="o"></div><div class="i"></div></div>
<div class="ember" style="animation-delay:-.8s"></div>
<div class="ember" style="margin-left:-30px;animation-delay:-1.9s;animation-duration:3.4s"></div>
<div class="ember" style="margin-left:20px;animation-delay:-2.4s;animation-duration:2.5s"></div>
</div>
<div class="brand"><h1>火柴微光</h1><p>A SINGLE MATCH</p></div>
<button class="replay" onclick="var s=document.getElementById('st');var c=s.cloneNode(true);s.replaceWith(c);">重新播放</button>
</body></html>
