<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>深海水母</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{width:430px;height:900px;margin:0 auto;position:relative;overflow:hidden;
font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
background:linear-gradient(180deg,#02182e 0%,#063a63 60%,#0a4f86 100%);color:#fff}
.scene{position:absolute;inset:0}

.ray{position:absolute;top:-40px;width:120px;height:500px;background:linear-gradient(rgba(160,210,255,.14),transparent);transform:skewX(-14deg)}
.jf{position:absolute;left:50%;top:290px;width:130px;margin-left:-65px;animation:rise 8s ease-in-out infinite}
@keyframes rise{50%{transform:translateY(-72px)}}
.dome{width:130px;height:82px;margin:0 auto;background:radial-gradient(circle at 50% 100%,rgba(255,180,220,.95),rgba(255,120,180,.5) 60%,rgba(255,120,180,.12));border-radius:65px 65px 14px 14px;animation:pulse 2.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes pulse{50%{transform:scaleY(.8) scaleX(1.07)}}
.ten{position:absolute;top:78px;width:5px;background:linear-gradient(rgba(255,160,200,.85),transparent);border-radius:3px;animation:sway 2.6s ease-in-out infinite alternate;transform-origin:top center;display:block}
@keyframes sway{to{transform:rotate(9deg)}}
.bb{position:absolute;bottom:-30px;border-radius:50%;background:rgba(180,220,255,.35);animation:bbUp linear infinite}
@keyframes bbUp{to{transform:translateY(-980px)}}
.jf2{position:absolute;left:70px;top:560px;width:80px;opacity:.7;animation:rise 10s ease-in-out infinite;animation-delay:-4s}
.jf2 .dome{width:80px;height:52px}

.brand{position:absolute;left:0;right:0;bottom:118px;text-align:center;z-index:5;
color:#dff2ff;opacity:0;animation:brandIn 1s ease 2.2s both}
.brand h1{font-size:34px;letter-spacing:8px;font-weight:800;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.brand p{font-size:13px;letter-spacing:3px;margin-top:10px;opacity:.85;text-shadow:0 1px 10px rgba(0,0,0,.35)}
@keyframes brandIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.replay{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);z-index:6;
padding:10px 28px;border-radius:24px;border:1px solid rgba(255,255,255,.45);
background:rgba(255,255,255,.14);color:#dff2ff;font-size:14px;letter-spacing:2px;cursor:pointer}
</style></head><body>
<div class="scene"><div class="ray" style="left:60px"></div><div class="ray" style="left:250px;animation-delay:-2s"></div>
<i class="bb" style="left:80px;width:10px;height:10px;animation-duration:7s;animation-delay:-2s"></i><i class="bb" style="left:150px;width:7px;height:7px;animation-duration:9s;animation-delay:-5s"></i><i class="bb" style="left:260px;width:12px;height:12px;animation-duration:8s;animation-delay:-1s"></i><i class="bb" style="left:330px;width:8px;height:8px;animation-duration:10s;animation-delay:-6s"></i><i class="bb" style="left:200px;width:6px;height:6px;animation-duration:7.5s;animation-delay:-3.5s"></i><i class="bb" style="left:380px;width:9px;height:9px;animation-duration:8.5s;animation-delay:-4s"></i>
<div class="jf"><div class="dome"></div><i class="ten" style="left:24px;animation-delay:-0.2s;height:110px"></i><i class="ten" style="left:44px;animation-delay:-1.1s;height:130px"></i><i class="ten" style="left:64px;animation-delay:-0.6s;height:100px"></i><i class="ten" style="left:84px;animation-delay:-1.5s;height:125px"></i><i class="ten" style="left:104px;animation-delay:-0.9s;height:110px"></i><i class="ten" style="left:40px;animation-delay:-0.4s;height:120px"></i><i class="ten" style="left:74px;animation-delay:-1.3s;height:105px"></i></div>
<div class="jf2"><div class="dome"></div></div></div>
<div class="brand"><h1>深海水母</h1><p>深蓝之下 自在浮游</p></div>
<button class="replay" onclick="location.reload()">重新播放</button>
</body></html>
