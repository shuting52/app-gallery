<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>画布笔触</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:430px;height:900px}
body{overflow:hidden;position:relative;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4efe6;color:#fff}
.stage{position:absolute;inset:0;overflow:hidden}
.brand{position:absolute;left:0;right:0;top:648px;text-align:center;z-index:5;animation:brandIn 1s ease 2s both}
.brand h1{font-size:36px;letter-spacing:10px;font-weight:800}
.brand p{font-size:13px;letter-spacing:6px;opacity:.65;margin-top:10px}
@keyframes brandIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.replay{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);z-index:9;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;font-size:13px;padding:9px 26px;border-radius:24px;cursor:pointer;backdrop-filter:blur(6px)}
.stroke{position:absolute;left:50%;top:330px;height:44px;border-radius:22px;transform:translate(-50%,-50%) rotate(-8deg) scaleX(0);animation:draw 1s cubic-bezier(.3,.7,.3,1) both}
@keyframes draw{to{transform:translate(-50%,-50%) rotate(-8deg) scaleX(1)}}
.dot{position:absolute;border-radius:50%;transform:scale(0);animation:pop .5s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes pop{to{transform:scale(1)}}
body .brand h1{color:#2b2b2b}
body .brand p{color:#2b2b2b}
body .replay{background:rgba(0,0,0,.08);border-color:rgba(0,0,0,.2);color:#2b2b2b}
</style></head><body>
<div class="stage"><div class="stroke" style="width:300px;background:#ff5d7e;animation-delay:.2s"></div><div class="stroke" style="width:250px;background:#4dd2ff;top:392px;animation-delay:.55s"></div><div class="stroke" style="width:280px;background:#ffd93d;top:270px;animation-delay:.9s"></div><div class="dot" style="width:26px;height:26px;background:#6bff9e;left:110px;top:250px;animation-delay:1.2s"></div><div class="dot" style="width:18px;height:18px;background:#b14dff;left:310px;top:420px;animation-delay:1.35s"></div><div class="dot" style="width:34px;height:34px;background:#ff9f43;left:300px;top:230px;animation-delay:1.5s"></div></div>
<div class="brand"><h1>调色</h1><p>CANVAS · 落笔</p></div>
<button class="replay" onclick="location.reload()">&#8635; 重新播放</button>
</body></html>
