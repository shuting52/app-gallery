<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>果冻回弹</title><style>*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0b0d12;display:flex;justify-content:center;align-items:flex-start;
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
-webkit-font-smoothing:antialiased}
.phone{width:430px;height:900px;position:relative;overflow:hidden;background:#f2f3f6}
header{position:absolute;top:0;left:0;right:0;z-index:30}
main{position:absolute;inset:0;overflow-y:auto;padding:96px 14px 40px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.card{background:#fff;border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:12px;
box-shadow:0 2px 12px rgba(25,30,50,.07)}
.thumb{width:58px;height:58px;border-radius:13px;flex-shrink:0;display:block}
.ct{flex:1;min-width:0}
.ct b{display:block;font-size:14.5px;color:#23262f;margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct span{display:block;height:8px;border-radius:4px;background:#eceef3;margin-bottom:6px}
.ct span:last-child{margin-bottom:0;width:62%}
.meta{font-size:11px;color:#a3a8b5;flex-shrink:0}

.bar{padding:42px 16px 12px;background:linear-gradient(135deg,#ffd9e8,#e3d0ff)}
.jelly{background:#fff;border-radius:22px;padding:14px 18px;display:flex;align-items:center;gap:12px;
box-shadow:0 8px 24px rgba(190,120,180,.25);transform-origin:center top}
.jelly .face{width:40px;height:40px;border-radius:14px;flex-shrink:0;display:block;
background:linear-gradient(135deg,#ff7ab8,#a06bff)}
.jelly h1{font-size:19px;font-weight:800;color:#4a3550}
.jelly p{font-size:11.5px;color:#a08bb0;margin-top:3px}
.bar.scrolled .jelly{animation:jelly .7s ease}
@keyframes jelly{0%{transform:scale(1,1)}25%{transform:scale(1.12,.82)}45%{transform:scale(.92,1.1)}65%{transform:scale(1.05,.95)}82%{transform:scale(.98,1.02)}100%{transform:scale(1,1)}}
.bar.scrolled .jelly p{opacity:0;height:0;margin:0}
.bar.scrolled .jelly{padding:10px 18px}</style></head>
<body><div class="phone">
<header id="bar"><div class="bar" id="barx"><div class="jelly"><span class="face"></span><div><h1>果冻铺</h1><p>上滑 · 顶栏会Q弹一下</p></div></div></div></header>
<main id="sc"><div class="card"><span class="thumb" style="background:linear-gradient(135deg,hsl(210,70%,62%),hsl(260,70%,48%))"></span><div class="ct"><b>灵感手记 · 第01期</b><span style="width:88%"></span><span></span></div><span class="meta">3k</span></div>
<div class="card"><span class="thumb" style="background:linear-gradient(135deg,hsl(247,70%,62%),hsl(297,70%,48%))"></span><div class="ct"><b>灵感手记 · 第02期</b><span style="width:80%"></span><span></span></div><span class="meta">4k</span></div>
<div class="card"><span class="thumb" style="background:linear-gradient(135deg,hsl(284,70%,62%),hsl(334,70%,48%))"></span><div class="ct"><b>灵感手记 · 第03期</b><span style="width:72%"></span><span></span></div><span class="meta">5k</span></div>
<div class="card"><span class="thumb" style="background:linear-gradient(135deg,hsl(321,70%,62%),hsl(11,70%,48%))"></span><div class="ct"><b>灵感手记 · 第04期</b><span style="width:64%"></span><span></span></div><span class="meta">6k</span></div>
<div class="card"><span class="thumb" style="background:linear-gradient(135deg,hsl(358,70%,62%),hsl(48,70%,48%))"></span><div class="ct"><b>灵感手记 · 第05期</b><span style="width:88%"></span><span></span></div><span class="meta">7k</span></div>
<div class="card"><span class="thumb" style="background:linear-gradient(135deg,hsl(35,70%,62%),hsl(85,70%,48%))"></span><div class="ct"><b>灵感手记 · 第06期</b><span style="width:80%"></span><span></span></div><span class="meta">8k</span></div>
<div class="card"><span class="thumb" style="background:linear-gradient(135deg,hsl(72,70%,62%),hsl(122,70%,48%))"></span><div class="ct"><b>灵感手记 · 第07期</b><span style="width:72%"></span><span></span></div><span class="meta">9k</span></div>
<div class="card"><span class="thumb" style="background:linear-gradient(135deg,hsl(109,70%,62%),hsl(159,70%,48%))"></span><div class="ct"><b>灵感手记 · 第08期</b><span style="width:64%"></span><span></span></div><span class="meta">10k</span></div>
<div class="card"><span class="thumb" style="background:linear-gradient(135deg,hsl(146,70%,62%),hsl(196,70%,48%))"></span><div class="ct"><b>灵感手记 · 第09期</b><span style="width:88%"></span><span></span></div><span class="meta">11k</span></div>
<div class="card"><span class="thumb" style="background:linear-gradient(135deg,hsl(183,70%,62%),hsl(233,70%,48%))"></span><div class="ct"><b>灵感手记 · 第10期</b><span style="width:80%"></span><span></span></div><span class="meta">3k</span></div>
<div style="text-align:center;color:#b9bec9;font-size:12px;padding:14px">— 到底啦 · 上滑试试顶栏变化 —</div>
</main></div>
<script>
const sc=document.getElementById('sc'),bar=document.getElementById('bar');
sc.addEventListener('scroll',()=>{bar.classList.toggle('scrolled',sc.scrollTop>48);document.getElementById('barx').classList.toggle('scrolled',sc.scrollTop>48);});
</script></body></html>
