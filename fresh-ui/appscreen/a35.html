<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>心绪气象</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0d14;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:#3c4a5e}
.phone{width:430px;height:900px;border-radius:44px;overflow:hidden;position:relative;background:linear-gradient(180deg,#8ec9ee 0%,#bfe0f5 32%,#f6d9c2 62%,#f9c9a8 100%);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.15);display:flex;flex-direction:column}
@keyframes riseIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes sunSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(-90px)}to{transform:translateX(470px)}}
@keyframes rainDrop{0%{transform:translateY(0);opacity:0}30%{opacity:1}100%{transform:translateY(26px);opacity:0}}
@keyframes popIn{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.1)}100%{opacity:1;transform:scale(1)}}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:18px 28px 6px;font-size:14px;color:#5d7186;z-index:5}
.topbar{padding:8px 24px 2px;z-index:5;animation:riseIn .8s -0.4s both}
.topbar .d{font-size:14px;color:#5d7186}
.topbar .t{font-size:23px;font-weight:800;color:#2e3c4e;margin-top:2px}
.cloud{position:absolute;top:110px;left:0;width:110px;height:36px;background:rgba(255,255,255,.9);border-radius:36px;z-index:1;animation:drift 30s -10s linear infinite}
.cloud::after{content:"";position:absolute;left:22px;top:-18px;width:52px;height:34px;background:rgba(255,255,255,.9);border-radius:50%}
.cloud.c2{top:56px;animation-duration:42s;animation-delay:-28s;transform:scale(.65)}
.mood-stage{position:relative;height:250px;margin:14px 24px 0;z-index:5;animation:riseIn .9s -0.25s both}
.mood-face{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:170px;height:170px;transition:opacity .3s,transform .3s}
.mood-face.hide{opacity:0;transform:translateX(-50%) scale(.7);pointer-events:none}
.face-sun .disc{display:block;width:120px;height:120px;margin:6px auto 0;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff3b0,#ffd23e 65%,#f0a92e);box-shadow:0 0 34px rgba(255,205,60,.8)}
.face-sun .rays{display:block;position:absolute;inset:-8px;animation:sunSpin 24s linear infinite}
.face-sun .rays i{position:absolute;display:block;width:8px;height:22px;border-radius:4px;background:#ffd23e;left:81px;top:-6px;transform-origin:4px 99px}
.face-cloud .cl{position:absolute;left:15px;top:52px;width:140px;height:56px;background:#fff;border-radius:40px;display:block;box-shadow:0 8px 18px rgba(120,150,180,.25)}
.face-cloud .cl::before{content:"";position:absolute;left:24px;top:-30px;width:66px;height:52px;background:#fff;border-radius:50%}
.face-cloud .cl::after{content:"";position:absolute;left:76px;top:-20px;width:48px;height:38px;background:#fff;border-radius:50%}
.face-cloud .drop{position:absolute;display:block;width:5px;height:12px;border-radius:3px;background:#6fb3e0;top:118px;animation:rainDrop 1.6s -0.5s infinite}
.face-bolt .cl{position:absolute;left:25px;top:44px;width:120px;height:50px;background:#8d9aae;border-radius:36px;display:block}
.face-bolt .cl::before{content:"";position:absolute;left:20px;top:-26px;width:58px;height:46px;background:#8d9aae;border-radius:50%}
.face-bolt .bolt{position:absolute;left:72px;top:88px;width:26px;height:56px;background:#ffd23e;clip-path:polygon(60% 0,15% 55%,45% 55%,35% 100%,90% 42%,58% 42%);display:block}
.face-snow .cl{position:absolute;left:25px;top:44px;width:120px;height:50px;background:#e8eef5;border-radius:36px;display:block}
.face-snow .cl::before{content:"";position:absolute;left:20px;top:-26px;width:58px;height:46px;background:#e8eef5;border-radius:50%}
.face-snow .fl{position:absolute;display:block;width:8px;height:8px;border-radius:50%;background:#fff;top:110px;animation:rainDrop 2.4s -1s infinite}
.face-wind .ln{display:block;position:absolute;left:20px;height:7px;border-radius:4px;background:#9fb6cc}
.mood-label{text-align:center;margin-top:2px;font-size:17px;font-weight:700;color:#2e3c4e}
.mood-label small{display:block;font-size:12px;font-weight:400;color:#7b8fa3;margin-top:4px}
.picker{display:flex;justify-content:center;gap:10px;margin-top:12px}
.pk{width:52px;height:52px;border-radius:50%;border:2.5px solid rgba(255,255,255,.7);background:rgba(255,255,255,.55);cursor:pointer;font-size:24px;display:flex;align-items:center;justify-content:center;transition:transform .2s,border-color .2s,background .2s;animation:popIn .6s -0.3s both}
.pk:nth-child(2){animation-delay:-0.2s}.pk:nth-child(3){animation-delay:-0.1s}.pk:nth-child(4){animation-delay:0s}.pk:nth-child(5){animation-delay:.05s}
.pk:active{transform:scale(.88)}
.pk.on{border-color:#fff;background:#fff;transform:scale(1.15);box-shadow:0 6px 16px rgba(120,150,190,.4)}
.week{margin:16px 24px 0;background:rgba(255,255,255,.6);border-radius:18px;padding:14px 16px;z-index:5;animation:riseIn .9s -0.05s both;border:1px solid rgba(255,255,255,.8)}
.week .t{font-size:14px;font-weight:700;color:#2e3c4e;margin-bottom:10px}
.days{display:flex;justify-content:space-between}
.day{text-align:center}
.day .e{font-size:22px;display:block;animation:popIn .6s -0.25s both}
.day .w{font-size:11px;color:#7b8fa3;margin-top:4px}
.day.today .w{color:#e07b39;font-weight:700}
.day.today .e{background:#fff;border-radius:12px;padding:2px 6px;box-shadow:0 4px 10px rgba(200,140,80,.25)}
.notes{margin:14px 24px 0;z-index:5;animation:riseIn .9s .05s both}
.notes .t{font-size:14px;font-weight:700;color:#2e3c4e;margin-bottom:8px}
.note{background:rgba(255,255,255,.65);border-radius:14px;padding:10px 14px;font-size:13px;color:#4a5c70;margin-bottom:8px;border:1px solid rgba(255,255,255,.8);animation:riseIn .5s -0.2s both}
.note b{color:#e07b39}
.action{margin:auto 24px 14px;z-index:5;animation:riseIn .9s .15s both}
.btn{width:100%;border:none;border-radius:999px;padding:16px;font-size:16px;font-weight:700;letter-spacing:4px;color:#fff;background:linear-gradient(120deg,#7fb8e8,#5a8fd0);cursor:pointer;box-shadow:0 10px 24px rgba(110,160,220,.45);transition:transform .2s}
.btn:active{transform:scale(.96)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fffdf8;border-radius:28px 28px 0 0;padding:22px 24px 30px;z-index:20;transform:translateY(105%);transition:transform .35s ease;box-shadow:0 -12px 40px rgba(80,60,40,.25)}
.sheet.show{transform:translateY(0)}
.sheet .h{font-size:16px;font-weight:700;color:#2e3c4e;margin-bottom:12px}
.sheet textarea{width:100%;height:96px;border:1.5px solid #e3d5bc;border-radius:14px;padding:12px;font-size:14px;font-family:inherit;color:#3c4a5e;outline:none;resize:none;background:#fff}
.sheet textarea:focus{border-color:#e0a34f}
.sheet .row{display:flex;gap:10px;margin-top:14px}
.sheet .row button{flex:1;border-radius:999px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.sheet .cancel{border:1.5px solid #e3d5bc;background:#fff;color:#7b8fa3}
.sheet .save{border:none;background:linear-gradient(120deg,#f0a24a,#e07b39);color:#fff}
.tabbar{margin:0 18px 22px;background:rgba(255,255,255,.85);border-radius:26px;display:flex;justify-content:space-around;padding:12px 6px;z-index:5;animation:riseIn .9s .25s both;box-shadow:0 8px 20px rgba(150,120,90,.2)}
.tab{text-align:center;flex:1;cursor:pointer}
.tab .d{display:block;width:26px;height:26px;margin:0 auto 4px;border-radius:50%;background:#d9e2ec;position:relative;transition:background .25s}
.tab.on .d{background:linear-gradient(135deg,#ffd23e,#f0a92e)}
.tab .l{font-size:11px;color:#8a99ab}
.tab.on .l{color:#2e3c4e;font-weight:600}
.tab .d.wx::after{content:"";position:absolute;left:6px;top:9px;width:14px;height:8px;background:#5d7186;border-radius:8px}
.tab .d.cal::after{content:"";position:absolute;left:6px;top:6px;width:14px;height:13px;border:2px solid #5d7186;border-radius:3px}
.tab .d.me::after{content:"";position:absolute;left:9px;top:6px;width:8px;height:8px;border-radius:50%;background:#5d7186;box-shadow:0 9px 0 -1px #5d7186}
</style>
</head>
<body>
<div class="phone">
  <div class="cloud"></div><div class="cloud c2"></div>
  <div class="statusbar"><span>18:42</span><span>今日 · 多云转晴</span></div>
  <div class="topbar"><div class="d">10 月 19 日 星期一</div><div class="t">今天的心情天气如何？</div></div>
  <div class="mood-stage">
    <div class="mood-face face-sun" id="face">
      <span class="rays"><i></i><i style="transform:rotate(45deg)"></i><i style="transform:rotate(90deg)"></i><i style="transform:rotate(135deg)"></i><i style="transform:rotate(180deg)"></i><i style="transform:rotate(225deg)"></i><i style="transform:rotate(270deg)"></i><i style="transform:rotate(315deg)"></i></span>
      <span class="disc"></span>
    </div>
  </div>
  <div class="mood-label" id="moodLabel">晴空万里<small>点一点，换一种心情天气</small></div>
  <div class="picker">
    <div class="pk on" data-m="晴空万里" data-f="sun">☀️</div>
    <div class="pk" data-m="云卷云舒" data-f="cloud">☁️</div>
    <div class="pk" data-m="细雨绵绵" data-f="rain">🌧️</div>
    <div class="pk" data-m="电闪雷鸣" data-f="bolt">⛈️</div>
    <div class="pk" data-m="清风徐来" data-f="wind">🍃</div>
  </div>
  <div class="week">
    <div class="t">本周心情云图</div>
    <div class="days">
      <div class="day"><span class="e">☀️</span><div class="w">一</div></div>
      <div class="day"><span class="e">☁️</span><div class="w">二</div></div>
      <div class="day"><span class="e">☀️</span><div class="w">三</div></div>
      <div class="day"><span class="e">🌧️</span><div class="w">四</div></div>
      <div class="day"><span class="e">☀️</span><div class="w">五</div></div>
      <div class="day"><span class="e">🍃</span><div class="w">六</div></div>
      <div class="day today"><span class="e">☀️</span><div class="w">今天</div></div>
    </div>
  </div>
  <div class="notes">
    <div class="t">今日一句</div>
    <div id="noteList">
      <div class="note"><b>晨间：</b>阳光正好，适合出门走走。</div>
    </div>
  </div>
  <div class="action"><button class="btn" id="writeBtn">写一句</button></div>
  <div class="sheet" id="sheet">
    <div class="h">记录此刻的心情</div>
    <textarea id="ta" placeholder="写下一句心里话吧……"></textarea>
    <div class="row">
      <button class="cancel" id="cancelBtn">取消</button>
      <button class="save" id="saveBtn">保存</button>
    </div>
  </div>
  <div class="tabbar">
    <div class="tab on"><span class="d wx"></span><div class="l">今日</div></div>
    <div class="tab"><span class="d cal"></span><div class="l">历程</div></div>
    <div class="tab"><span class="d me"></span><div class="l">我的</div></div>
  </div>
</div>
<script>
var face=document.getElementById('face'),label=document.getElementById('moodLabel');
var faces={
  sun:'<span class="rays"><i></i><i style="transform:rotate(45deg)"></i><i style="transform:rotate(90deg)"></i><i style="transform:rotate(135deg)"></i><i style="transform:rotate(180deg)"></i><i style="transform:rotate(225deg)"></i><i style="transform:rotate(270deg)"></i><i style="transform:rotate(315deg)"></i></span><span class="disc"></span>',
  cloud:'<span class="cl"></span>',
  rain:'<span class="cl"></span><span class="drop" style="left:50px"></span><span class="drop" style="left:80px;animation-delay:-0.7s"></span><span class="drop" style="left:110px;animation-delay:-1.1s"></span>',
  bolt:'<span class="cl"></span><span class="bolt"></span>',
  wind:'<span class="ln" style="top:60px;width:110px"></span><span class="ln" style="top:84px;width:130px;left:14px"></span><span class="ln" style="top:108px;width:96px"></span>'
};
var classes={sun:'mood-face face-sun',cloud:'mood-face face-cloud',rain:'mood-face face-cloud',bolt:'mood-face face-bolt',wind:'mood-face face-wind'};
document.querySelectorAll('.pk').forEach(function(el){
  el.addEventListener('click',function(){
    document.querySelectorAll('.pk').forEach(function(x){x.classList.remove('on')});
    el.classList.add('on');
    face.classList.add('hide');
    setTimeout(function(){
      var f=el.dataset.f;
      face.className=classes[f];
      face.innerHTML=faces[f];
      face.classList.remove('hide');
    },180);
    label.innerHTML=el.dataset.m+'<small>点一点，换一种心情天气</small>';
    document.querySelector('.day.today .e').textContent=el.textContent;
  });
});
var sheet=document.getElementById('sheet'),ta=document.getElementById('ta');
document.getElementById('writeBtn').addEventListener('click',function(){sheet.classList.add('show')});
document.getElementById('cancelBtn').addEventListener('click',function(){sheet.classList.remove('show')});
document.getElementById('saveBtn').addEventListener('click',function(){
  var v=ta.value.trim();if(!v){sheet.classList.remove('show');return}
  var div=document.createElement('div');div.className='note';
  var esc=v.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  div.innerHTML='<b>刚刚：</b>'+esc;
  document.getElementById('noteList').appendChild(div);
  ta.value='';sheet.classList.remove('show');
});
document.querySelectorAll('.tab').forEach(function(el){
  el.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on')});
    el.classList.add('on');
  });
});
</script>
</body>
</html>
