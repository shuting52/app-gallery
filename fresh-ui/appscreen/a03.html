<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>脉动健身</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%}body{background:#06080c;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:#fff;overflow:hidden}.stage{width:430px;height:900px;position:relative;overflow:hidden;background:radial-gradient(110% 80% at 50% 0%,#1c2438 0%,#0c0f18 60%,#07090f 100%)}.top{display:flex;justify-content:space-between;padding:56px 26px 0;align-items:center}.top b{font-size:19px;letter-spacing:2px}.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#ff6a88,#ffb86a);display:flex;align-items:center;justify-content:center;font-size:18px}.rings{position:relative;width:260px;height:260px;margin:26px auto 0}.rings svg{transform:rotate(-90deg)}.rc{fill:none;stroke-width:14;stroke-linecap:round;stroke-dasharray:628;stroke-dashoffset:628;animation:fill 1.6s cubic-bezier(.3,.7,.3,1) forwards}.r1{stroke:#ff6a88;animation-delay:-.2s;--o:150}.r2{stroke:#00d4ff;animation-delay:-.5s;--o:260}.r3{stroke:#a18cd1;animation-delay:-.8s;--o:380}@keyframes fill{to{stroke-dashoffset:var(--o)}}.rbg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:14}.rcen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.rcen b{font-size:44px}.rcen span{font-size:12px;color:#8b93a8;margin-top:6px}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:26px 20px 0}.st{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:14px;text-align:center}.st b{font-size:22px;display:block}.st span{font-size:11px;color:#8b93a8}.st i{font-style:normal;font-size:16px}.bars{display:flex;align-items:flex-end;gap:10px;height:110px;margin:24px 30px 0}.bars i{flex:1;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,#00d4ff,#2b6cff);transform-origin:bottom;animation:grow 1s cubic-bezier(.3,.7,.3,1) both}@keyframes grow{from{transform:scaleY(0)}}.bl{display:flex;gap:10px;margin:8px 30px 0;font-size:10px;color:#8b93a8}.bl span{flex:1;text-align:center}.go{display:block;margin:26px 20px 0;padding:17px;border:none;border-radius:18px;font-size:17px;font-weight:700;color:#06121f;background:linear-gradient(135deg,#00e6a0,#00d4ff);cursor:pointer;box-shadow:0 12px 30px rgba(0,230,160,.35);animation:pulse 2.2s ease-in-out infinite;animation-delay:-1s}@keyframes pulse{50%{transform:scale(1.025);box-shadow:0 12px 40px rgba(0,230,160,.55)}}</style></head><body><div class="stage"><div class="top"><b>脉动健身</b><div class="av">🏃</div></div><div class="rings"><svg width="260" height="260"><circle class="rbg" cx="130" cy="130" r="100"/><circle class="rc r1" cx="130" cy="130" r="100"/><circle class="rbg" cx="130" cy="130" r="78"/><circle class="rc r2" cx="130" cy="130" r="78"/><circle class="rbg" cx="130" cy="130" r="56"/><circle class="rc r3" cx="130" cy="130" r="56"/></svg><div class="rcen"><b>76%</b><span>今日目标完成度</span></div></div><div class="stats"><div class="st"><i>👣</i><b>8,432</b><span>步数</span></div><div class="st"><i>🔥</i><b>486</b><span>千卡</span></div><div class="st"><i>⏱</i><b>52分</b><span>运动时长</span></div></div><div class="bars"><i style="height:45%;animation-delay:-0.0s"></i><i style="height:70%;animation-delay:-0.09s"></i><i style="height:55%;animation-delay:-0.18s"></i><i style="height:85%;animation-delay:-0.27s"></i><i style="height:60%;animation-delay:-0.36s"></i><i style="height:95%;animation-delay:-0.45s"></i><i style="height:76%;animation-delay:-0.54s"></i></div><div class="bl"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><button class="go" id="go">开始训练</button><script>var g=document.getElementById("go"),t=0,on=false,tm;g.onclick=function(){on=!on;g.textContent=on?"训练中 00:00 · 点击暂停":"开始训练";if(on){tm=setInterval(function(){t++;var m=String(Math.floor(t/60)).padStart(2,"0"),s=String(t%60).padStart(2,"0");g.textContent="训练中 "+m+":"+s+" · 点击暂停";},1000);}else{clearInterval(tm);}};</script></div></body></html>
