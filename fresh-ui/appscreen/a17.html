<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>醇香咖啡</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%}body{background:#06080c;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:#fff;overflow:hidden}.stage{width:430px;height:900px;position:relative;overflow:hidden;background:linear-gradient(180deg,#241610 0%,#180e08 60%,#100906 100%)}.top{padding:56px 26px 0;display:flex;justify-content:space-between;align-items:center}.top h2{font-size:22px;letter-spacing:2px}.top h2 span{color:#d8a05c}.shop{margin:14px 26px 0;display:flex;gap:12px;align-items:center;background:rgba(216,160,92,.1);border:1px solid rgba(216,160,92,.25);border-radius:16px;padding:14px}.shop i{font-style:normal;font-size:30px}.shop b{font-size:14px;display:block}.shop span{font-size:11px;color:#a08a68}.menu{margin:16px 26px 0}.mi{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;margin-bottom:10px;cursor:pointer;border:1px solid transparent;transition:all .25s}.mi i{font-style:normal;font-size:34px;width:60px;height:60px;border-radius:16px;background:rgba(216,160,92,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0}.mi div{flex:1}.mi b{font-size:15px;display:block}.mi span{font-size:11px;color:#a08a68}.mi em{font-style:normal;color:#d8a05c;font-weight:800;font-size:16px}.mi.on{background:rgba(216,160,92,.1);border-color:rgba(216,160,92,.5)}h3.sec{font-size:14px;margin:20px 26px 12px;color:#d8c8a8}.sizes{display:flex;gap:10px;margin:0 26px}.sz{flex:1;border:1px solid rgba(216,160,92,.3);background:none;color:#c8a878;border-radius:14px;padding:12px 0;font-size:13px;cursor:pointer}.sz.on{background:#d8a05c;border-color:#d8a05c;color:#241610;font-weight:800}.qty{display:flex;align-items:center;justify-content:center;gap:26px;margin:22px 0 0}.qty button{width:44px;height:44px;border-radius:50%;border:1px solid rgba(216,160,92,.4);background:none;color:#d8a05c;font-size:22px;cursor:pointer}.qty b{font-size:24px;min-width:40px;text-align:center}.bar{position:absolute;left:0;right:0;bottom:0;background:rgba(20,12,7,.92);backdrop-filter:blur(12px);border-top:1px solid rgba(216,160,92,.2);padding:18px 26px 34px;display:flex;align-items:center;justify-content:space-between}.bar .t b{font-size:26px;color:#ffd98a;display:block}.bar .t span{font-size:11px;color:#a08a68}#order{border:none;border-radius:16px;background:linear-gradient(135deg,#d8a05c,#b57a32);color:#241610;font-size:16px;font-weight:800;padding:15px 44px;cursor:pointer}#toast{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%) scale(.8);background:rgba(0,0,0,.8);color:#fff;padding:16px 30px;border-radius:16px;font-size:15px;opacity:0;transition:all .3s;pointer-events:none}#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}</style></head><body><div class="stage"><div class="top"><h2>醇香<span>咖啡</span></h2><span style="color:#a08a68">🛒</span></div><div class="shop"><i>🏠</i><div><b>街角二店 · 步行 5 分钟</b><span>营业中 · 08:00–22:00</span></div></div><div class="menu"><div class="miTrue" data-p="28"><i>☕</i><div><b>拿铁</b><span>醇香顺滑 · 热/冰</span></div><em>¥28</em></div><div class="miFalse" data-p="32"><i>🍵</i><div><b>燕麦抹茶</b><span>清新回甘 · 冰</span></div><em>¥32</em></div><div class="miFalse" data-p="35"><i>🥤</i><div><b>生椰 Dirty</b><span>椰香浓郁 · 冰</span></div><em>¥35</em></div><div class="miFalse" data-p="25"><i>🥛</i><div><b>澳白</b><span>小杯浓缩 · 热</span></div><em>¥25</em></div></div><h3 class="sec">杯型</h3><div class="sizes"><button class="sz">小杯</button><button class="sz on">中杯</button><button class="sz">大杯 +¥4</button></div><div class="qty"><button id="dec">−</button><b id="qn">1</b><button id="inc">＋</button></div><div class="bar"><div class="t"><b id="tot">¥28</b><span>拿铁 · 中杯 × 1</span></div><button id="order">下单</button></div><div id="toast">☕ 已下单！约 10 分钟后取餐</div><script>var price=28,qty=1,name="拿铁",size="中杯",szp=[0,0,4],szi=1;function upd(){var t=(price+szp[szi])*qty;document.getElementById("tot").textContent="¥"+t;document.querySelector(".bar .t span").textContent=name+" · "+size+" × "+qty;}document.querySelectorAll(".mi").forEach(function(m){m.onclick=function(){document.querySelectorAll(".mi").forEach(function(x){x.classList.remove("on");});m.classList.add("on");price=+m.dataset.p;name=m.querySelector("b").textContent;upd();};});document.querySelectorAll(".sz").forEach(function(s,i){s.onclick=function(){document.querySelectorAll(".sz").forEach(function(x){x.classList.remove("on");});s.classList.add("on");szi=i;size=s.textContent.replace(" +¥4","");upd();};});document.getElementById("inc").onclick=function(){qty++;document.getElementById("qn").textContent=qty;upd();};document.getElementById("dec").onclick=function(){qty=Math.max(1,qty-1);document.getElementById("qn").textContent=qty;upd();};document.getElementById("order").onclick=function(){var t=document.getElementById("toast");t.classList.add("show");setTimeout(function(){t.classList.remove("show");},1800);};upd();</script></div></body></html>
