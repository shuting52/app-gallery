<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>钱袋有数</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#05070d;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
.phone{width:430px;height:900px;background:linear-gradient(180deg,#0a0f1e,#0d1428);border-radius:44px;overflow:hidden;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.08);display:flex;flex-direction:column;color:#fff}
.topbar{padding:56px 24px 0;display:flex;justify-content:space-between;align-items:center}
.topbar .m{font-size:15px;color:#8f97b8}
.topbar .m b{color:#fff;font-size:17px}
.bell{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;position:relative}
.bell::after{content:"";position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:#ff5c5c;display:block}
.hero{margin:20px 24px 0;background:linear-gradient(135deg,#1b2a5e,#101a3d);border:1px solid rgba(120,150,255,.2);border-radius:24px;padding:24px;position:relative;overflow:hidden;animation:slidein .6s ease both;animation-delay:-.15s}
@keyframes slidein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero::before{content:"";position:absolute;top:-60px;right:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(110,140,255,.35),transparent 70%);display:block}
.hero .lb{font-size:13px;color:#8f97b8;letter-spacing:1px}
.hero .amt{font-size:46px;font-weight:800;margin-top:8px;letter-spacing:1px;overflow:hidden;height:60px}
.hero .amt span{display:inline-block;animation:roll .9s cubic-bezier(.2,.8,.3,1) both;animation-delay:-.9s}
@keyframes roll{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.hero .cmp{font-size:12px;color:#8f97b8;margin-top:8px}
.hero .cmp b{color:#5ee8a0}
.cats{margin:18px 24px 0}
.cats .th{font-size:14px;font-weight:700;margin-bottom:12px;color:#dfe4ff}
.crow{margin-bottom:13px}
.crow .hd{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px}
.crow .hd .cn{color:#cfd6f5}
.crow .hd .ca{color:#fff;font-weight:700}
.cbar{height:10px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.cbar i{display:block;height:100%;border-radius:6px;animation:grow 1.1s cubic-bezier(.2,.8,.3,1) both;width:50%}
@keyframes grow{from{width:0}to{width:var(--w)}}
.recent{margin:16px 24px 0;flex:1;overflow:hidden}
.recent .th{font-size:14px;font-weight:700;margin-bottom:10px;color:#dfe4ff}
.tx{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.tx .e{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.tx .inf{flex:1}.tx .n{font-size:14px;font-weight:600}.tx .t{font-size:12px;color:#6b7394;margin-top:3px}
.tx .v{font-size:15px;font-weight:700;color:#ff8f8f}
.tx .v.in{color:#5ee8a0}
.fab{position:absolute;right:24px;bottom:120px;width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,#6e8cff,#4a5fd9);border:none;color:#fff;font-size:30px;font-weight:300;cursor:pointer;box-shadow:0 12px 30px rgba(110,140,255,.5);transition:transform .2s;z-index:10;display:flex;align-items:center;justify-content:center}
.fab:active{transform:scale(.9) rotate(45deg)}
.pad{position:absolute;inset:0;background:rgba(3,5,12,.7);z-index:20;display:none;align-items:flex-end;backdrop-filter:blur(3px)}
.pad.show{display:flex}
.sheet{width:100%;background:#141b33;border-radius:28px 28px 0 0;padding:20px 24px 44px;animation:up .35s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes up{from{transform:translateY(60%);opacity:0}to{transform:none;opacity:1}}
.sheet .st{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sheet .st .t{font-size:16px;font-weight:700}
.sheet .st .x{font-size:20px;color:#8f97b8;cursor:pointer;padding:4px 8px}
.disp{text-align:right;font-size:38px;font-weight:800;color:#ffd97a;padding:10px 4px;min-height:66px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px}
.key{background:rgba(255,255,255,.07);border:none;border-radius:14px;color:#fff;font-size:20px;padding:15px 0;cursor:pointer;transition:transform .1s}
.key:active{transform:scale(.93);background:rgba(255,255,255,.14)}
.key.ok{background:linear-gradient(135deg,#6e8cff,#4a5fd9);font-size:16px;font-weight:700;grid-column:span 2}
.tabbar{display:flex;background:rgba(10,15,32,.95);border-top:1px solid rgba(255,255,255,.08);padding:12px 8px 34px}
.tab{flex:1;text-align:center;color:#5b6285;font-size:11px;cursor:pointer;padding:6px 0}
.tab .ic{font-size:22px;display:block;margin-bottom:4px;transition:transform .25s}
.tab.on{color:#7c8fff}
.tab.on .ic{transform:translateY(-3px) scale(1.15)}
</style>
</head>
<body>
<div class="phone">
  <div class="topbar">
    <div class="m">📊 <b>10月</b> 账单 ▾</div>
    <div class="bell">🔔</div>
  </div>
  <div class="hero">
    <div class="lb">本月总支出</div>
    <div class="amt"><span>¥ 4,862.50</span></div>
    <div class="cmp">较上月 <b>↓ 12.6%</b> · 预算剩余 ¥2,137.50</div>
  </div>
  <div class="cats">
    <div class="th">分类支出</div>
    <div class="crow"><div class="hd"><span class="cn">🍜 餐饮</span><span class="ca">¥1,842</span></div><div class="cbar"><i style="--w:82%;background:linear-gradient(90deg,#ff9a5c,#ff6b4a);animation-delay:-.2s"></i></div></div>
    <div class="crow"><div class="hd"><span class="cn">🚇 交通</span><span class="ca">¥986</span></div><div class="cbar"><i style="--w:44%;background:linear-gradient(90deg,#6ec8ff,#4a8fe8);animation-delay:-.45s"></i></div></div>
    <div class="crow"><div class="hd"><span class="cn">🛍️ 购物</span><span class="ca">¥1,205</span></div><div class="cbar"><i style="--w:54%;background:linear-gradient(90deg,#c58fff,#8f5ce8);animation-delay:-.7s"></i></div></div>
    <div class="crow"><div class="hd"><span class="cn">🎮 娱乐</span><span class="ca">¥829</span></div><div class="cbar"><i style="--w:37%;background:linear-gradient(90deg,#5ee8a0,#2fc87f);animation-delay:-.9s"></i></div></div>
  </div>
  <div class="recent">
    <div class="th">最近记录</div>
    <div class="tx"><div class="e" style="background:rgba(255,154,92,.15)">🍜</div><div class="inf"><div class="n">兰州拉面</div><div class="t">餐饮 · 今天 12:32</div></div><div class="v">-18.00</div></div>
    <div class="tx"><div class="e" style="background:rgba(110,200,255,.15)">🚇</div><div class="inf"><div class="n">地铁通勤</div><div class="t">交通 · 今天 08:15</div></div><div class="v">-6.00</div></div>
    <div class="tx"><div class="e" style="background:rgba(94,232,160,.15)">💰</div><div class="inf"><div class="n">工资到账</div><div class="t">收入 · 10月10日</div></div><div class="v in">+12,500.00</div></div>
  </div>
  <button class="fab" id="fab">＋</button>
  <div class="pad" id="pad">
    <div class="sheet">
      <div class="st"><div class="t">记一笔</div><div class="x" id="close">✕</div></div>
      <div class="disp" id="disp">0</div>
      <div class="keys" id="keys">
        <button class="key">1</button><button class="key">2</button><button class="key">3</button><button class="key">⌫</button>
        <button class="key">4</button><button class="key">5</button><button class="key">6</button><button class="key">00</button>
        <button class="key">7</button><button class="key">8</button><button class="key">9</button><button class="key">.</button>
        <button class="key ok">记 录 ✓</button><button class="key">0</button>
      </div>
    </div>
  </div>
  <div class="tabbar" id="tabbar">
    <div class="tab on"><span class="ic">💳</span>账单</div>
    <div class="tab"><span class="ic">📊</span>统计</div>
    <div class="tab"><span class="ic">🎯</span>预算</div>
    <div class="tab"><span class="ic">👤</span>我的</div>
  </div>
</div>
<script>
(function(){
  var pad=document.getElementById('pad'),disp=document.getElementById('disp'),val='';
  document.getElementById('fab').addEventListener('click',function(){pad.classList.add('show');});
  document.getElementById('close').addEventListener('click',function(){pad.classList.remove('show');});
  pad.addEventListener('click',function(e){if(e.target===pad)pad.classList.remove('show');});
  document.getElementById('keys').addEventListener('click',function(e){
    var k=e.target.closest('.key');if(!k)return;var t=k.textContent.trim();
    if(t==='⌫'){val=val.slice(0,-1);}
    else if(t==='记 录 ✓'){if(val){disp.textContent='已记录 ✓';setTimeout(function(){pad.classList.remove('show');val='';disp.textContent='0';},700);}return;}
    else{if(val.length<9)val+=t;}
    disp.textContent=val||'0';
  });
  var tb=document.getElementById('tabbar');
  tb.addEventListener('click',function(e){
    var t=e.target.closest('.tab');if(!t)return;
    tb.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on')});
    t.classList.add('on');
  });
})();
</script>
</body>
</html>
