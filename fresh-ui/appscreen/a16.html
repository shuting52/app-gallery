<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星火打卡</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%}body{background:#06080c;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:#fff;overflow:hidden}.stage{width:430px;height:900px;position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#2b1a0e 0%,#17100a 55%,#0d0906 100%)}.top{padding:56px 26px 0;display:flex;justify-content:space-between;align-items:center}.top h2{font-size:22px;letter-spacing:2px}.flame{font-size:40px;animation:flick 1.8s ease-in-out infinite alternate;animation-delay:-.9s;display:inline-block}@keyframes flick{to{transform:scale(1.15) rotate(-4deg);filter:brightness(1.25)}}.hero{margin:16px 26px 0;background:linear-gradient(135deg,#f5a942,#e2703a);border-radius:22px;padding:22px;display:flex;align-items:center;gap:18px;box-shadow:0 16px 40px rgba(245,169,66,.3)}.hero .n{font-size:52px;font-weight:800;color:#2c1a05}.hero p{color:#5c3a10;font-size:13px;line-height:1.7}.hero p b{color:#2c1a05}.wk{display:flex;gap:8px;margin:20px 26px 0}.wd{flex:1;text-align:center;font-size:11px;color:#a08a68}.wd i{font-style:normal;display:flex;width:100%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.07);align-items:center;justify-content:center;margin-top:6px;font-size:13px}.wd.today i{background:#f5a942;color:#2c1a05;font-weight:800}#hlist{margin:18px 26px 0}.hb{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:16px;margin-bottom:12px}.hi{font-size:30px;width:52px;height:52px;border-radius:16px;background:rgba(245,169,66,.14);display:flex;align-items:center;justify-content:center;flex-shrink:0}.hm{flex:1}.hm b{font-size:15px;display:block}.hm span{font-size:11px;color:#a08a68}.dots{display:flex;gap:6px}.dots i{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.1);cursor:pointer;transition:all .2s;display:block}.dots i.on{background:radial-gradient(circle at 35% 30%,#ffe27a,#f5a942);box-shadow:0 0 10px rgba(245,169,66,.7);transform:scale(1.12)}</style></head><body><div class="stage"><div class="top"><h2>星火打卡</h2><span class="flame">🔥</span></div><div class="hero"><div class="n" id="tot">16</div><p><b>天连续打卡！</b><br>再坚持 5 天，点亮"恒星"徽章</p></div><div class="wk"><div class="wd today"><span>一</span><i>19</i></div><div class="wd"><span>二</span><i>18</i></div><div class="wd"><span>三</span><i>17</i></div><div class="wd"><span>四</span><i>16</i></div><div class="wd"><span>五</span><i>15</i></div><div class="wd"><span>六</span><i>14</i></div><div class="wd"><span>日</span><i>13</i></div></div><div id="hlist"><div class="hb"><div class="hi">📖</div><div class="hm"><b>晨读 20 分钟</b><span>🔥 连续 5 天</span></div><div class="dots"><i class="on" data-h="0" data-d="0"></i><i class="on" data-h="0" data-d="1"></i><i class="on" data-h="0" data-d="2"></i><i class="on" data-h="0" data-d="3"></i><i class="" data-h="0" data-d="4"></i><i class="" data-h="0" data-d="5"></i><i class="" data-h="0" data-d="6"></i></div></div><div class="hb"><div class="hi">🏃</div><div class="hm"><b>跑步 3 公里</b><span>🔥 连续 3 天</span></div><div class="dots"><i class="on" data-h="1" data-d="0"></i><i class="on" data-h="1" data-d="1"></i><i class="on" data-h="1" data-d="2"></i><i class="on" data-h="1" data-d="3"></i><i class="on" data-h="1" data-d="4"></i><i class="" data-h="1" data-d="5"></i><i class="" data-h="1" data-d="6"></i></div></div><div class="hb"><div class="hi">💧</div><div class="hm"><b>喝 8 杯水</b><span>🔥 连续 6 天</span></div><div class="dots"><i class="on" data-h="2" data-d="0"></i><i class="on" data-h="2" data-d="1"></i><i class="on" data-h="2" data-d="2"></i><i class="on" data-h="2" data-d="3"></i><i class="on" data-h="2" data-d="4"></i><i class="on" data-h="2" data-d="5"></i><i class="" data-h="2" data-d="6"></i></div></div><div class="hb"><div class="hi">🧘</div><div class="hm"><b>冥想 10 分钟</b><span>🔥 连续 2 天</span></div><div class="dots"><i class="on" data-h="3" data-d="0"></i><i class="on" data-h="3" data-d="1"></i><i class="on" data-h="3" data-d="2"></i><i class="on" data-h="3" data-d="3"></i><i class="on" data-h="3" data-d="4"></i><i class="on" data-h="3" data-d="5"></i><i class="on" data-h="3" data-d="6"></i></div></div></div><script>var tot=16,te=document.getElementById("tot");document.querySelectorAll(".dots i").forEach(function(d){d.onclick=function(){var on=d.classList.toggle("on");tot+=on?1:-1;te.textContent=tot;};});</script></div></body></html>
