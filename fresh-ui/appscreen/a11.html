<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>青柠清单</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%}body{background:#06080c;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:#fff;overflow:hidden}.stage{width:430px;height:900px;position:relative;overflow:hidden;background:linear-gradient(180deg,#f4f7fb 0%,#e8eef5 100%)}body{color:#1f2a3a}.stage{color:#1f2a3a}.top{padding:56px 26px 0;display:flex;justify-content:space-between;align-items:center}.top h2{font-size:24px}.top h2 span{color:#22b07d}.top p{font-size:12px;color:#8a97a8;margin-top:6px}.pwrap{margin:18px 26px 0;background:#fff;border-radius:16px;padding:16px;box-shadow:0 6px 18px rgba(31,42,58,.06)}.pwrap .lab{display:flex;justify-content:space-between;font-size:12px;color:#8a97a8;margin-bottom:8px}.pbar{height:8px;border-radius:4px;background:#e8eef5;overflow:hidden}#pfill{height:100%;width:40%;border-radius:4px;background:linear-gradient(90deg,#22b07d,#7ce3a8);transition:width .4s}.add{display:flex;gap:10px;margin:16px 26px 0}#inp{flex:1;border:1px solid #dde5ee;border-radius:14px;padding:14px 16px;font-size:14px;outline:none;background:#fff;color:#1f2a3a}#addb{width:52px;border:none;border-radius:14px;background:linear-gradient(135deg,#22b07d,#1a8f66);color:#fff;font-size:24px;cursor:pointer}.filters{display:flex;gap:8px;margin:16px 26px 0}.f{border:none;background:#e8eef5;color:#8a97a8;border-radius:16px;padding:7px 16px;font-size:12px;cursor:pointer}.f.on{background:#1f2a3a;color:#fff}#list{margin:12px 26px 0}.it{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:0 4px 12px rgba(31,42,58,.05);animation:slidein .35s both}@keyframes slidein{from{opacity:0;transform:translateY(12px)}}.ck{width:24px;height:24px;border-radius:50%;border:2px solid #c6d2df;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;transition:all .25s}.it.done .ck{background:#22b07d;border-color:#22b07d}.it span{flex:1;font-size:14px}.it.done span{text-decoration:line-through;color:#a5b0bf}.del{border:none;background:none;color:#c6d2df;font-size:18px;cursor:pointer}</style></head><body><div class="stage"><div class="top"><div><h2>青柠<span>清单</span></h2><p id="date">10月19日 星期一 · 今日待办</p></div><span style="font-size:26px">🍋</span></div><div class="pwrap"><div class="lab"><span>完成进度</span><span id="pl">2/5</span></div><div class="pbar"><div id="pfill"></div></div></div><div class="add"><input id="inp" placeholder="添加一件待办…"><button id="addb">＋</button></div><div class="filters"><button class="f on" data-f="all">全部</button><button class="f" data-f="todo">未完成</button><button class="f" data-f="done">已完成</button></div><div id="list"></div><script>var items=[["晨跑 3 公里",true],["读《雾屿漫游》一章",true],["给阳台的薄荷浇水",false],["整理桌面文件",false],["22:30 前睡觉",false]],filter="all";var list=document.getElementById("list");function render(){list.innerHTML="";var done=0;items.forEach(function(it,i){if(it[1])done++;if(filter==="todo"&&it[1]||filter==="done"&&!it[1])return;var d=document.createElement("div");d.className="it"+(it[1]?" done":"");d.innerHTML='<div class="ck">✓</div><span></span><button class="del">×</button>';d.querySelector("span").textContent=it[0];d.querySelector(".ck").onclick=function(){it[1]=!it[1];render();};d.querySelector(".del").onclick=function(){items.splice(i,1);render();};list.appendChild(d);});document.getElementById("pl").textContent=done+"/"+items.length;document.getElementById("pfill").style.width=(items.length?done/items.length*100:0)+"%";}document.getElementById("addb").onclick=function(){var v=document.getElementById("inp").value.trim();if(!v)return;items.push([v,false]);document.getElementById("inp").value="";render();};document.querySelectorAll(".f").forEach(function(f){f.onclick=function(){document.querySelectorAll(".f").forEach(function(x){x.classList.remove("on");});f.classList.add("on");filter=f.dataset.f;render();};});render();</script></div></body></html>
