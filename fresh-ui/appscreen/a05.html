<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>潮汐专注</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%}body{background:#06080c;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:#fff;overflow:hidden}.stage{width:430px;height:900px;position:relative;overflow:hidden;background:linear-gradient(180deg,#0d2b33 0%,#0a1c22 55%,#071318 100%)}.wave{position:absolute;bottom:0;left:0;right:0;height:190px;overflow:hidden;opacity:.5}.wave svg{position:absolute;bottom:0;width:200%;animation:wmove 7s linear infinite;animation-delay:-3s}@keyframes wmove{to{transform:translateX(-50%)}}.top{text-align:center;padding:64px 0 0}.top p{font-size:13px;color:#7fa3ad;letter-spacing:6px}.tabs{display:flex;justify-content:center;gap:10px;margin:22px 0 0}.tab{border:1px solid rgba(127,163,173,.35);color:#7fa3ad;background:none;border-radius:20px;padding:8px 22px;font-size:13px;cursor:pointer}.tab.on{background:#2dd4bf;border-color:#2dd4bf;color:#062a26;font-weight:700}.clock{position:relative;width:300px;height:300px;margin:34px auto 0}.clock svg{transform:rotate(-90deg)}.cbg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:12}#cring{fill:none;stroke:url(#tg);stroke-width:12;stroke-linecap:round;stroke-dasharray:880;stroke-dashoffset:0;transition:stroke-dashoffset 1s linear}.ct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.ct b{font-size:64px;font-weight:200;font-variant-numeric:tabular-nums}.ct span{font-size:13px;color:#7fa3ad;margin-top:10px}.start{display:block;margin:36px auto 0;width:150px;padding:16px;border:none;border-radius:40px;font-size:17px;font-weight:700;background:linear-gradient(135deg,#2dd4bf,#22d3ee);color:#062a26;cursor:pointer;box-shadow:0 12px 32px rgba(45,212,191,.4)}.rec{display:flex;justify-content:center;gap:34px;margin-top:30px;font-size:12px;color:#7fa3ad;text-align:center}.rec b{display:block;font-size:20px;color:#fff;margin-bottom:4px}</style></head><body><div class="stage"><div class="wave"><svg viewBox="0 0 860 190" preserveAspectRatio="none" style="height:190px"><path d="M0,100 Q107,60 215,100 T430,100 T645,100 T860,100 V190 H0 Z" fill="#134e5e"/></svg></div><div class="top"><p>潮汐专注</p></div><div class="tabs"><button class="tab on" data-m="25">专注 25</button><button class="tab" data-m="5">短休 5</button><button class="tab" data-m="15">长休 15</button></div><div class="clock"><svg width="300" height="300"><defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><circle class="cbg" cx="150" cy="150" r="140"/><circle id="cring" cx="150" cy="150" r="140"/></svg><div class="ct"><b id="tm">25:00</b><span>保持专注，潮汐会陪着你</span></div></div><button class="start" id="st">开始专注</button><div class="rec"><div><b>4</b>今日番茄</div><div><b>1.6h</b>专注时长</div><div><b>12</b>连续天数</div></div><script>var total=25*60,left=total,run=false,iv,tm=document.getElementById("tm"),ring=document.getElementById("cring"),st=document.getElementById("st");function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}function draw(){tm.textContent=fmt(left);ring.style.strokeDashoffset=880*(1-left/total);}st.onclick=function(){run=!run;st.textContent=run?"暂停":"开始专注";if(run){iv=setInterval(function(){left--;if(left<0){left=total;run=false;clearInterval(iv);st.textContent="开始专注";}draw();},1000);}else clearInterval(iv);};document.querySelectorAll(".tab").forEach(function(t){t.onclick=function(){document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("on");});t.classList.add("on");total=+t.dataset.m*60;left=total;run=false;clearInterval(iv);st.textContent="开始专注";draw();};});draw();</script></div></body></html>
