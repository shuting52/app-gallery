<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>风驰跑步</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%}body{background:#06080c;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:#fff;overflow:hidden}.stage{width:430px;height:900px;position:relative;overflow:hidden;background:linear-gradient(180deg,#101623 0%,#0a0e18 60%,#070a12 100%)}.map{margin:0;height:380px;position:relative;overflow:hidden}.map svg{position:absolute;inset:0}.dot{fill:#00e6a0;filter:drop-shadow(0 0 8px #00e6a0)}.grid-bg{position:absolute;inset:0;opacity:.14;background-image:linear-gradient(rgba(120,160,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(120,160,255,.5) 1px,transparent 1px);background-size:34px 34px}.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:56px 26px 0;z-index:3}.top b{font-size:19px;letter-spacing:2px}.live{position:absolute;top:120px;left:26px;z-index:3;background:rgba(0,230,160,.14);border:1px solid rgba(0,230,160,.5);color:#00e6a0;font-size:12px;border-radius:16px;padding:6px 14px;animation:blink 1.6s ease-in-out infinite}@keyframes blink{50%{opacity:.5}}.nums{display:grid;grid-template-columns:1fr 1fr 1fr;margin:-60px 22px 0;position:relative;z-index:4}.nm{background:rgba(16,22,35,.85);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:18px 0;text-align:center;backdrop-filter:blur(10px);margin:0 5px}.nm b{font-size:30px;display:block;font-variant-numeric:tabular-nums}.nm b small{font-size:13px;color:#8b93a8;font-weight:400}.nm span{font-size:11px;color:#8b93a8}.nm.hot b{color:#00e6a0}.pace{margin:18px 26px 0}.pace h3{font-size:13px;color:#8b93a8;margin-bottom:10px}.prow{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:11px;color:#8b93a8}.prow span{width:34px}.ptrack{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.08)}.prow b{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#00e6a0,#00c6ff)}.go{display:block;width:calc(100% - 52px);margin:26px 26px 0;padding:18px;border:none;border-radius:20px;font-size:18px;font-weight:800;color:#06130d;background:linear-gradient(135deg,#00e6a0,#00c6ff);cursor:pointer;box-shadow:0 14px 36px rgba(0,230,160,.35)}</style></head><body><div class="stage"><div class="map"><div class="grid-bg"></div><svg viewBox="0 0 430 380" preserveAspectRatio="xMidYMid slice"><path d="M40,320 C90,300 70,240 130,230 C190,220 170,160 240,160 C310,160 290,100 360,90" fill="none" stroke="rgba(0,230,160,.35)" stroke-width="14" stroke-linecap="round"/><path d="M40,320 C90,300 70,240 130,230 C190,220 170,160 240,160 C310,160 290,100 360,90" fill="none" stroke="#00e6a0" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 10"/><circle class="dot" r="9"><animateMotion dur="9s" repeatCount="indefinite" path="M40,320 C90,300 70,240 130,230 C190,220 170,160 240,160 C310,160 290,100 360,90"/></circle><circle cx="40" cy="320" r="7" fill="#fff"/><circle cx="360" cy="90" r="7" fill="#ffd479"/></svg><div class="top"><b>风驰跑步</b><span style="color:#8b93a8">🏁</span></div><div class="live">● GPS 信号良好 · 记录中</div></div><div class="nums"><div class="nm hot"><b id="km">3.2<small> km</small></b><span>距离</span></div><div class="nm"><b>5'42"<small></small></b><span>配速 /km</span></div><div class="nm"><b id="tm2">18:24<small></small></b><span>时长</span></div></div><div class="pace"><h3>分段配速</h3><div class="prow"><span>1km</span><div class="ptrack"><b style="width:72%"></b></div><span>5'50"</span></div><div class="prow"><span>2km</span><div class="ptrack"><b style="width:80%"></b></div><span>5'38"</span></div><div class="prow"><span>3km</span><div class="ptrack"><b style="width:88%"></b></div><span>5'30"</span></div></div><button class="go" id="go">⏸ 暂停</button><script>var on=true,s=1104,km=3.2,iv=setInterval(tick,1000);function tick(){if(!on)return;s++;km+=0.0016;document.getElementById("tm2").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");document.getElementById("km").innerHTML=km.toFixed(2)+"<small> km</small>";}var g=document.getElementById("go");g.onclick=function(){on=!on;g.textContent=on?"⏸ 暂停":"▶ 继续跑";};</script></div></body></html>
