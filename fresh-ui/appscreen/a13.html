<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>声岛播客</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%}body{background:#06080c;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:#fff;overflow:hidden}.stage{width:430px;height:900px;position:relative;overflow:hidden;background:linear-gradient(180deg,#1c1030 0%,#120b22 60%,#0a0716 100%)}.top{display:flex;justify-content:space-between;align-items:center;padding:56px 26px 0}.top b{font-size:19px;letter-spacing:2px}.cover{margin:22px auto 0;width:210px;height:210px;border-radius:28px;position:relative;background:conic-gradient(from 40deg,#7b5cff,#00d4ff,#ff6a88,#ffd479,#7b5cff);box-shadow:0 20px 50px rgba(123,92,255,.4);animation:spin 24s linear infinite;animation-delay:-9s}@keyframes spin{to{transform:rotate(360deg)}}.cover::after{content:"🎙";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:72px;animation:spin 24s linear infinite reverse;animation-delay:-9s}.now{text-align:center;margin-top:20px}.now h2{font-size:20px}.now p{color:#9a8fb8;font-size:13px;margin-top:6px}.pbar{margin:18px 40px 0;height:5px;border-radius:3px;background:rgba(255,255,255,.12);position:relative}#pf{position:absolute;left:0;top:0;bottom:0;width:12%;border-radius:3px;background:linear-gradient(90deg,#7b5cff,#00d4ff);transition:width .3s}.tm{display:flex;justify-content:space-between;margin:8px 40px 0;font-size:11px;color:#9a8fb8}.ctl{display:flex;justify-content:center;align-items:center;gap:30px;margin-top:20px}.cb{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);color:#fff;font-size:18px;cursor:pointer}.cb.big{width:76px;height:76px;font-size:28px;background:linear-gradient(135deg,#7b5cff,#00d4ff);border:none}.spd{display:flex;justify-content:center;gap:10px;margin-top:18px}.sp{border:1px solid rgba(255,255,255,.2);background:none;color:#9a8fb8;border-radius:16px;padding:6px 18px;font-size:12px;cursor:pointer}.sp.on{background:#7b5cff;border-color:#7b5cff;color:#fff;font-weight:700}h3.sec{font-size:14px;margin:24px 26px 10px;color:#c9bfe0}.ep{display:flex;align-items:center;gap:14px;margin:0 26px 10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:12px 14px;cursor:pointer}.ep.playing{border-color:#7b5cff;background:rgba(123,92,255,.12)}.epp{width:44px;height:44px;border-radius:50%;border:none;flex-shrink:0;background:rgba(123,92,255,.25);color:#fff;font-size:16px;cursor:pointer}.ep.playing .epp{background:linear-gradient(135deg,#7b5cff,#00d4ff)}.ep div{flex:1}.ep b{font-size:14px;display:block}.ep span{font-size:11px;color:#9a8fb8}.ep em{font-style:normal;font-size:11px;color:#9a8fb8}</style></head><body><div class="stage"><div class="top"><b>声岛播客</b><span style="color:#9a8fb8">☰</span></div><div class="cover"></div><div class="now"><h2>雾屿电台 · 深夜特辑</h2><p>潮汐电台 · 已订阅</p></div><div class="pbar"><div id="pf"></div></div><div class="tm"><span id="ct">03:58</span><span>32:10</span></div><div class="ctl"><button class="cb">⏮</button><button class="cb big" id="pp">⏸</button><button class="cb">⏭</button></div><div class="spd"><button class="sp">0.8x</button><button class="sp on">1x</button><button class="sp">1.5x</button><button class="sp">2x</button></div><h3 class="sec">往期节目</h3><div class="ep" data-t="32:10"><button class="epp">▶</button><div><b>001 · 雾屿电台的诞生</b><span>32分钟 · 10-18</span></div><em></em></div><div class="ep" data-t="28:45"><button class="epp">▶</button><div><b>002 · 和潮汐乐队聊创作</b><span>28分钟 · 10-11</span></div><em></em></div><div class="ep" data-t="41:20"><button class="epp">▶</button><div><b>003 · 深夜电台：给失眠的你</b><span>41分钟 · 10-04</span></div><em></em></div><div class="ep" data-t="25:12"><button class="epp">▶</button><div><b>004 · 声音设计入门</b><span>25分钟 · 09-27</span></div><em></em></div><script>var on=true,pp=document.getElementById("pp"),pf=document.getElementById("pf"),ct=document.getElementById("ct"),sec=238;pp.onclick=function(){on=!on;pp.textContent=on?"⏸":"▶";document.querySelector(".cover").style.animationPlayState=on?"running":"paused";};setInterval(function(){if(!on)return;sec=Math.min(1930,sec+1);ct.textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");pf.style.width=(sec/1930*100)+"%";},1000);document.querySelectorAll(".ep").forEach(function(e){e.onclick=function(){document.querySelectorAll(".ep").forEach(function(x){x.classList.remove("playing");x.querySelector(".epp").textContent="▶";});e.classList.add("playing");e.querySelector(".epp").textContent="⏸";document.querySelector(".now h2").textContent=e.querySelector("b").textContent;};});document.querySelectorAll(".sp").forEach(function(s){s.onclick=function(){document.querySelectorAll(".sp").forEach(function(x){x.classList.remove("on");});s.classList.add("on");};});</script></div></body></html>
