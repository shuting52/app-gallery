<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>烟火厨房</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%}body{background:#06080c;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:#fff;overflow:hidden}.stage{width:430px;height:900px;position:relative;overflow:hidden;background:linear-gradient(180deg,#2b1206 0%,#1a0c05 60%,#100804 100%)}.steam{position:absolute;top:250px;left:0;right:0;display:flex;justify-content:center;gap:26px;pointer-events:none}.steam i{width:8px;height:70px;border-radius:4px;background:linear-gradient(rgba(255,255,255,.5),transparent);filter:blur(5px);animation:rise 2.6s ease-in infinite;opacity:0}@keyframes rise{0%{opacity:0;transform:translateY(24px) scaleX(1)}30%{opacity:.8}100%{opacity:0;transform:translateY(-46px) translateX(12px) scaleX(1.6)}}.top{padding:56px 26px 0;display:flex;justify-content:space-between;align-items:center;position:relative}.top h2{font-size:22px;letter-spacing:2px}.top h2 span{color:#ff9a5c}.hero{margin:18px 26px 0;border-radius:24px;overflow:hidden;position:relative;height:300px;background:linear-gradient(135deg,#e2703a,#8f3b12);box-shadow:0 18px 44px rgba(226,112,58,.35)}.hero .dish{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:120px;animation:bob 4s ease-in-out infinite alternate;animation-delay:-2s}@keyframes bob{to{transform:translateY(-12px) rotate(4deg)}}.hero .cap{position:absolute;left:0;right:0;bottom:0;padding:40px 20px 18px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65))}.hero .cap h3{font-size:21px}.hero .cap p{font-size:12px;opacity:.85;margin-top:6px}.fav{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:50%;border:none;background:rgba(0,0,0,.35);color:#fff;font-size:20px;cursor:pointer;backdrop-filter:blur(6px)}.fav.on{color:#ff5c8a}h3.sec{font-size:15px;margin:24px 26px 12px}.scroll{display:flex;gap:14px;overflow:hidden;padding:0 26px}.rc{min-width:150px}.rp{height:110px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:52px}.rc b{font-size:14px;display:block;margin-top:8px}.rc p{font-size:11px;color:#a08a72;margin-top:4px}.steps{margin:6px 26px 0;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:6px 16px}.stp{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:13px;cursor:pointer}.stp:last-child{border:none}.stp i{font-style:normal;width:24px;height:24px;border-radius:50%;flex-shrink:0;border:2px solid #ff9a5c;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent}.stp.done{color:#8a7a68;text-decoration:line-through}.stp.done i{background:#ff9a5c;color:#fff}</style></head><body><div class="stage"><div class="steam"><i style="animation-delay:-.4s"></i><i style="animation-delay:-1.3s"></i><i style="animation-delay:-2.1s"></i></div><div class="top"><h2>烟火<span>厨房</span></h2><span style="font-size:13px;color:#a08a72">🔍</span></div><div class="hero"><div class="dish">🍲</div><button class="fav" id="fv">♡</button><div class="cap"><h3>今日推荐 · 番茄牛腩煲</h3><p>酸甜开胃，肉质软烂 · 1286 人做过</p></div></div><h3 class="sec">热门菜谱</h3><div class="scroll"><div class="rc"><div class="rp" style="background:linear-gradient(135deg,#ff9a5c,#e2703a)"><span>🍲</span></div><b>番茄牛腩煲</b><p>⏱ 45分钟 · 中等</p></div><div class="rc"><div class="rp" style="background:linear-gradient(135deg,#f5b942,#e2703a)"><span>🥘</span></div><b>蒜香黄油虾</b><p>⏱ 20分钟 · 简单</p></div><div class="rc"><div class="rp" style="background:linear-gradient(135deg,#7fb069,#2d6a4f)"><span>🥗</span></div><b>牛油果沙拉</b><p>⏱ 15分钟 · 简单</p></div><div class="rc"><div class="rp" style="background:linear-gradient(135deg,#a18cd1,#5c4d9e)"><span>🍰</span></div><b>蓝莓芝士蛋糕</b><p>⏱ 60分钟 · 困难</p></div></div><h3 class="sec">烹饪步骤 · 点按打勾</h3><div class="steps"><div class="stp"><i>✓</i>牛腩切块，冷水下锅焯去血沫</div><div class="stp"><i>✓</i>热油爆香葱姜，番茄炒出红油</div><div class="stp"><i>✓</i>加水没过食材，小火炖 40 分钟</div><div class="stp"><i>✓</i>大火收汁，撒葱花出锅</div></div><script>var f=document.getElementById("fv");f.onclick=function(){var on=f.classList.toggle("on");f.textContent=on?"♥":"♡";};document.querySelectorAll(".stp").forEach(function(s){s.onclick=function(){s.classList.toggle("done");};});</script></div></body></html>
