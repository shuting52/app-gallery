<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>林间呼吸</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%}body{background:#06080c;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:#fff;overflow:hidden}.stage{width:430px;height:900px;position:relative;overflow:hidden;background:radial-gradient(120% 100% at 50% 0%,#123524 0%,#0b2117 55%,#060f0a 100%)}.leaf{position:absolute;font-size:22px;opacity:.7;animation:fall linear infinite;top:-40px}@keyframes fall{to{transform:translateY(960px) rotate(340deg)}}.top{text-align:center;padding:64px 0 0}.top p{font-size:13px;color:#8fb8a0;letter-spacing:8px}.bwrap{position:relative;width:320px;height:320px;margin:60px auto 0}.orb{position:absolute;inset:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(180,255,210,.9),rgba(90,200,150,.55) 45%,rgba(30,120,90,.25) 75%);filter:blur(2px);animation:breath 8s ease-in-out infinite;animation-delay:-4s;box-shadow:0 0 80px rgba(90,220,160,.45),inset 0 0 60px rgba(255,255,255,.25)}@keyframes breath{0%,100%{transform:scale(.72)}50%{transform:scale(1.12)}}.ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(140,220,180,.35);animation:ringx 8s ease-in-out infinite;animation-delay:-4s}.ring.r2{inset:24px;animation-delay:-6s;opacity:.6}@keyframes ringx{0%,100%{transform:scale(.8);opacity:.9}50%{transform:scale(1.18);opacity:.25}}.word{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;letter-spacing:12px;color:#eafff3;text-shadow:0 2px 20px rgba(90,220,160,.6)}.durs{display:flex;justify-content:center;gap:12px;margin:56px 0 0}.dur{border:1px solid rgba(140,220,180,.35);background:none;color:#8fb8a0;border-radius:22px;padding:10px 26px;font-size:14px;cursor:pointer}.dur.on{background:#5adca0;border-color:#5adca0;color:#06231a;font-weight:700}.stat{display:flex;justify-content:center;gap:40px;margin-top:34px;text-align:center;color:#8fb8a0;font-size:12px}.stat b{display:block;font-size:24px;color:#fff;margin-bottom:6px}.hint{text-align:center;color:#5d8570;font-size:12px;margin-top:26px;line-height:2}</style></head><body><div class="stage"><div class="top"><p>林间呼吸</p></div><div class="bwrap"><div class="ring"></div><div class="ring r2"></div><div class="orb"></div><div class="word" id="wd">呼气</div></div><div class="durs"><button class="dur">5 分钟</button><button class="dur on">10 分钟</button><button class="dur">15 分钟</button></div><div class="stat"><div><b>128</b>冥想次数</div><div><b>21天</b>连续</div><div><b>32h</b>总时长</div></div><div class="hint">跟随光球的节奏呼吸<br>吸气 4 秒 · 屏息 4 秒 · 呼气 4 秒</div><script>var leaves=["🍃","🍂","🌿"];for(var i=0;i<10;i++){var s=document.createElement("span");s.className="leaf";s.textContent=leaves[i%3];s.style.left=(i*47%400)+"px";s.style.animationDuration=(7+i%5)+"s";s.style.animationDelay=(-(i*1.7))+"s";s.style.fontSize=(16+i%14)+"px";document.querySelector(".stage").appendChild(s);}var wd=document.getElementById("wd"),inhale=false;setInterval(function(){inhale=!inhale;wd.textContent=inhale?"吸气":"呼气";},4000);document.querySelectorAll(".dur").forEach(function(d){d.onclick=function(){document.querySelectorAll(".dur").forEach(function(x){x.classList.remove("on");});d.classList.add("on");};});</script></div></body></html>
