<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>追风者</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#05070d;display:flex;align-items:center;justify-content:center;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:#e8f4ff;min-height:100vh}
.phone{width:430px;height:900px;border-radius:44px;overflow:hidden;position:relative;background:radial-gradient(600px 500px at 50% -10%,#14243f 0%,#080d18 55%,#04060b 100%);box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 0 10px #0c111c,0 0 0 12px #233046,0 0 60px rgba(0,229,255,.12)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,229,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.05) 1px,transparent 1px);background-size:34px 34px;mask-image:radial-gradient(360px 500px at 50% 40%,#000 30%,transparent 75%);-webkit-mask-image:radial-gradient(360px 500px at 50% 40%,#000 30%,transparent 75%)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:24px 22px 0;z-index:2}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.rise{animation:rise .8s cubic-bezier(.2,.8,.25,1) both}
.topbar{display:flex;align-items:center;justify-content:space-between}
.user{display:flex;align-items:center;gap:10px}
.avatar{width:44px;height:44px;border-radius:50%;background:conic-gradient(from 120deg,#00e5ff,#7c4dff,#ff2d78,#00e5ff);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 0 18px rgba(0,229,255,.5)}
.user .n{font-size:14px;font-weight:700}
.user .s{font-size:11px;color:#6f87a8}
.gps{display:flex;align-items:center;gap:6px;font-size:11px;color:#39ff88;background:rgba(57,255,136,.08);border:1px solid rgba(57,255,136,.3);padding:6px 12px;border-radius:20px}
.gps .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#39ff88;box-shadow:0 0 10px #39ff88;animation:blink 1.4s ease-in-out -1s infinite}
@keyframes blink{50%{opacity:.25}}
.big{margin-top:26px;text-align:center}
.big .label{font-size:12px;letter-spacing:6px;color:#6f87a8}
.big .pace{font-size:84px;font-weight:800;letter-spacing:-2px;background:linear-gradient(180deg,#fff,#9be9ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 44px rgba(0,229,255,.35);font-variant-numeric:tabular-nums;line-height:1.15}
.big .unit{font-size:14px;color:#6f87a8;margin-top:2px}
.stats{display:flex;gap:12px;margin-top:20px}
.stat{flex:1;background:rgba(14,24,42,.72);border:1px solid rgba(0,229,255,.16);border-radius:16px;padding:14px 6px;text-align:center;backdrop-filter:blur(6px)}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat:nth-child(1) b{color:#00e5ff;text-shadow:0 0 16px rgba(0,229,255,.6)}
.stat:nth-child(2) b{color:#ff2d78;text-shadow:0 0 16px rgba(255,45,120,.6)}
.stat:nth-child(3) b{color:#ffe14d;text-shadow:0 0 16px rgba(255,225,77,.6)}
.stat span{font-size:11px;color:#6f87a8}
.map{margin-top:18px;background:rgba(10,18,34,.8);border:1px solid rgba(0,229,255,.16);border-radius:18px;padding:10px;position:relative;overflow:hidden}
.map svg{display:block;width:100%;height:210px}
.map .cap{position:absolute;left:18px;top:16px;font-size:11px;color:#6f87a8;letter-spacing:2px}
.route{stroke-dasharray:640;stroke-dashoffset:640;animation:draw 4s ease-out -3s forwards;filter:drop-shadow(0 0 6px #00e5ff)}
@keyframes draw{to{stroke-dashoffset:150}}
.pulse{animation:pping 2s ease-out -1s infinite;transform-origin:center;transform-box:fill-box}
@keyframes pping{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.6);opacity:0}}
.ctrl{margin-top:auto;margin-bottom:18px;display:flex;align-items:center;justify-content:center;gap:18px}
.mainbtn{width:104px;height:104px;border-radius:50%;border:none;cursor:pointer;font-family:inherit;font-size:16px;font-weight:700;letter-spacing:2px;color:#04121a;background:radial-gradient(circle at 32% 28%,#bdf6ff,#00e5ff 60%,#0090b3);box-shadow:0 0 34px rgba(0,229,255,.65),inset 0 3px 8px rgba(255,255,255,.55);transition:transform .15s,box-shadow .3s}
.mainbtn:active{transform:scale(.94)}
.mainbtn.pause{background:radial-gradient(circle at 32% 28%,#ffc2d6,#ff2d78 60%,#b3124a);box-shadow:0 0 34px rgba(255,45,120,.65),inset 0 3px 8px rgba(255,255,255,.55);color:#2a0512}
.sidebtn{width:56px;height:56px;border-radius:50%;border:1px solid rgba(0,229,255,.35);background:rgba(0,229,255,.07);color:#9be9ff;font-size:22px;cursor:pointer;font-family:inherit}
.tabbar{height:86px;background:rgba(8,13,24,.9);backdrop-filter:blur(12px);border-top:1px solid rgba(0,229,255,.14);display:flex;margin:0 -22px;padding:0 10px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:#5b7191;cursor:pointer;border:none;background:none;font-family:inherit}
.tab .ic{display:block;width:26px;height:26px;font-size:21px;line-height:26px;text-align:center;transition:transform .2s;filter:grayscale(1) brightness(.8)}
.tab.on{color:#00e5ff;font-weight:700}
.tab.on .ic{filter:none;transform:translateY(-2px)}
</style>
</head>
<body>
<div class="phone">
  <div class="grid"></div>
  <div class="screen">
    <div class="topbar rise" style="animation-delay:-.7s">
      <div class="user"><div class="avatar">🏃</div><div><div class="n">夜跑第 12 周</div><div class="s">目标 30 公里 / 周</div></div></div>
      <div class="gps"><span class="dot"></span>信号良好</div>
    </div>
    <div class="big rise" style="animation-delay:-.55s">
      <div class="label">当前配速</div>
      <div class="pace" id="pace">5'32"</div>
      <div class="unit">每公里 · 实时心率 148</div>
    </div>
    <div class="stats">
      <div class="stat rise" style="animation-delay:-.45s"><b id="dist">3.24</b><span>公里</span></div>
      <div class="stat rise" style="animation-delay:-.38s"><b id="time">18:05</b><span>用时</span></div>
      <div class="stat rise" style="animation-delay:-.31s"><b>212</b><span>千卡</span></div>
    </div>
    <div class="map rise" style="animation-delay:-.24s">
      <span class="cap">跑步轨迹</span>
      <svg viewBox="0 0 380 210">
        <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#ff2d78"/></linearGradient></defs>
        <path d="M40 170 C70 120 60 90 110 80 C160 70 150 130 200 120 C250 110 240 60 290 55 C330 52 340 90 355 110" fill="none" stroke="rgba(0,229,255,.18)" stroke-width="10" stroke-linecap="round"/>
        <path class="route" d="M40 170 C70 120 60 90 110 80 C160 70 150 130 200 120 C250 110 240 60 290 55 C330 52 340 90 355 110" fill="none" stroke="url(#rg)" stroke-width="5" stroke-linecap="round"/>
        <circle cx="40" cy="170" r="7" fill="#39ff88"/>
        <g><circle class="pulse" cx="355" cy="110" r="9" fill="none" stroke="#ff2d78" stroke-width="2"/><circle cx="355" cy="110" r="7" fill="#ff2d78"/></g>
      </svg>
    </div>
    <div class="ctrl rise" style="animation-delay:-.12s">
      <button class="sidebtn" onclick="lap(this)">🏁</button>
      <button class="mainbtn" id="mainBtn" onclick="toggleRun()">开始</button>
      <button class="sidebtn" onclick="this.style.transform='scale(.9)';setTimeout(()=>this.style.transform='',150)">🎵</button>
    </div>
    <div class="tabbar">
      <button class="tab on" onclick="setTab(this)"><span class="ic">🏃</span>跑步</button>
      <button class="tab" onclick="setTab(this)"><span class="ic">📊</span>数据</button>
      <button class="tab" onclick="setTab(this)"><span class="ic">🏅</span>挑战</button>
      <button class="tab" onclick="setTab(this)"><span class="ic">👤</span>我的</button>
    </div>
  </div>
</div>
<script>
var running=false,timer=null,sec=1085,dist=3.24;
function fmt(s){var m=Math.floor(s/60),h=Math.floor(m/60);m%=60;var x=s%60;return (h>0?h+':':'')+(m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
function toggleRun(){
  var b=document.getElementById('mainBtn');running=!running;
  if(running){b.textContent='暂停';b.classList.add('pause');
    timer=setInterval(function(){sec++;dist+=0.0082;
      document.getElementById('time').textContent=fmt(sec);
      document.getElementById('dist').textContent=dist.toFixed(2);},1000);
  }else{b.textContent='开始';b.classList.remove('pause');clearInterval(timer);}
}
function lap(el){el.style.transform='scale(.85)';setTimeout(function(){el.style.transform='';},180);
  var p=document.getElementById('pace');p.style.transform='scale(1.08)';setTimeout(function(){p.style.transform='';},200);}
function setTab(el){document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('on')});el.classList.add('on');}
</script>
</body>
</html>
