<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>蜜罐记账</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%}body{background:#06080c;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:#fff;overflow:hidden}.stage{width:430px;height:900px;position:relative;overflow:hidden;background:linear-gradient(180deg,#241a08 0%,#171106 55%,#0e0a04 100%)}.top{display:flex;justify-content:space-between;align-items:center;padding:56px 26px 0}.top b{font-size:19px;letter-spacing:2px;color:#ffd98a}.bal{margin:20px 22px 0;border-radius:22px;padding:24px;position:relative;overflow:hidden;background:linear-gradient(135deg,#f5b942,#e2703a);box-shadow:0 16px 40px rgba(245,185,66,.3)}.bal::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-60px;top:-60px;background:rgba(255,255,255,.16)}.bal p{font-size:13px;color:#5c3a10}.bal h1{font-size:44px;color:#2c1c05;margin:6px 0}.bal span{font-size:12px;color:#5c3a10}.chips{display:flex;gap:10px;margin:20px 22px 0}.chip{flex:1;border:1px solid rgba(255,217,138,.3);background:rgba(255,217,138,.08);color:#ffd98a;border-radius:14px;padding:12px 0;font-size:13px;cursor:pointer;text-align:center;transition:transform .15s}.chip:active{transform:scale(.94)}.chip i{font-style:normal;display:block;font-size:20px;margin-bottom:4px}.list{margin:20px 22px 0}.list h3{font-size:14px;color:#a08c5c;margin-bottom:6px;display:flex;justify-content:space-between}.row{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid rgba(255,217,138,.12);animation:slidein .4s both}@keyframes slidein{from{opacity:0;transform:translateX(-18px)}}.row i{font-style:normal;font-size:22px;width:44px;height:44px;border-radius:14px;background:rgba(255,217,138,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0}.row div{flex:1}.row b{font-size:15px;display:block}.row span{font-size:11px;color:#8a7a55}.row em{font-style:normal;color:#ff9a7a;font-weight:700}.tip{margin:18px 22px 0;background:rgba(255,217,138,.07);border:1px dashed rgba(255,217,138,.3);border-radius:14px;padding:14px;font-size:12px;color:#c8ab6a;line-height:1.8}</style></head><body><div class="stage"><div class="top"><b>🍯 蜜罐记账</b><span style="color:#a08c5c;font-size:13px">6月 ▾</span></div><div class="bal"><p>本月支出</p><h1>¥<span id="tot" style="font-size:44px;color:#2c1c05">2,480</span></h1><span>预算剩余 ¥1,520 · 已用 62%</span></div><div class="chips"><button class="chip" data-n="午餐" data-p="32"><i>🍜</i>餐饮 +32</button><button class="chip" data-n="打车" data-p="18"><i>🚕</i>交通 +18</button><button class="chip" data-n="奶茶" data-p="15"><i>🧋</i>饮品 +15</button><button class="chip" data-n="购物" data-p="99"><i>🛍</i>购物 +99</button></div><div class="list"><h3>今日明细 <span>共 4 笔</span></h3><div id="rows"><div class="row"><i>🍜</i><div><b>午餐 · 公司楼下</b><span>12:30</span></div><em>-32</em></div><div class="row"><i>🚇</i><div><b>地铁通勤</b><span>08:15</span></div><em>-6</em></div><div class="row"><i>☕</i><div><b>拿铁 · 醇香</b><span>09:02</span></div><em>-28</em></div><div class="row"><i>📚</i><div><b>《雾屿漫游》</b><span>昨天</span></div><em>-45</em></div></div></div><div class="tip">💡 小蜜蜂提示：本周饮品支出偏高，比上周多了 ¥42，要不要挑战"无奶茶周"？</div><script>var tot=2480,te=document.getElementById("tot"),box=document.getElementById("rows");function fmt(n){return n.toLocaleString("en-US");}document.querySelectorAll(".chip").forEach(function(c){c.onclick=function(){var p=+c.dataset.p;tot+=p;te.textContent=fmt(tot);var d=document.createElement("div");d.className="row";d.innerHTML="<i>"+c.querySelector("i").textContent+"</i><div><b>"+c.dataset.n+" · 快捷记账</b><span>刚刚</span></div><em>-"+p+"</em>";box.insertBefore(d,box.firstChild);};});</script></div></body></html>
