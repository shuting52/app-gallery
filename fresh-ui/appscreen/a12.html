<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>语桥翻译</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%}body{background:#06080c;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:#fff;overflow:hidden}.stage{width:430px;height:900px;position:relative;overflow:hidden;background:linear-gradient(160deg,#0f2a5c 0%,#123a7d 45%,#0b1f45 100%)}.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.4;animation:drift 10s ease-in-out infinite alternate}.o1{width:260px;height:260px;background:#2f7bff;top:-40px;right:-60px;animation-delay:-3s}.o2{width:220px;height:220px;background:#7b5cff;bottom:120px;left:-70px;animation-delay:-7s}@keyframes drift{to{transform:translate(-40px,50px) scale(1.12)}}.top{text-align:center;padding:64px 0 0;position:relative}.top h2{font-size:20px;letter-spacing:6px}.langs{display:flex;align-items:center;justify-content:center;gap:16px;margin:24px 26px 0;position:relative}.lg{flex:1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:16px;padding:14px;font-size:15px;font-weight:700;backdrop-filter:blur(8px);cursor:pointer}#swap{width:52px;height:52px;border-radius:50%;border:none;flex-shrink:0;font-size:22px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#2f7bff,#7b5cff);box-shadow:0 8px 24px rgba(47,123,255,.5);transition:transform .5s}#ta{margin:18px 26px 0;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:18px;min-height:150px;backdrop-filter:blur(8px);position:relative}#tin{width:100%;background:none;border:none;outline:none;color:#fff;font-size:17px;resize:none;font-family:inherit}#tin::placeholder{color:rgba(255,255,255,.4)}.x{position:absolute;top:12px;right:14px;color:rgba(255,255,255,.5);font-size:18px;cursor:pointer}#go{display:block;width:calc(100% - 52px);margin:16px 26px 0;padding:16px;border:none;border-radius:16px;background:linear-gradient(135deg,#2f7bff,#00c6ff);color:#fff;font-size:16px;font-weight:700;cursor:pointer}#out{margin:16px 26px 0;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:18px;padding:20px 18px;min-height:130px;font-size:17px;line-height:1.8;backdrop-filter:blur(8px);position:relative}#out .cp{position:absolute;top:12px;right:14px;font-size:12px;color:rgba(255,255,255,.6);cursor:pointer}h3.sec{font-size:13px;color:rgba(255,255,255,.6);margin:22px 26px 10px}.hi{margin:0 26px;background:rgba(255,255,255,.07);border-radius:12px;padding:12px 16px;font-size:13px;margin-bottom:8px}.hi b{display:block;font-size:14px}.hi span{color:rgba(255,255,255,.55)}</style></head><body><div class="stage"><div class="orb o1"></div><div class="orb o2"></div><div class="top"><h2>语桥翻译</h2></div><div class="langs"><button class="lg" id="l1">中文</button><button id="swap">⇄</button><button class="lg" id="l2">English</button></div><div id="ta"><textarea id="tin" rows="4" placeholder="输入要翻译的文字…">山间清晨的雾，是夜晚留下的信。</textarea><span class="x" id="clr">×</span></div><button id="go">立即翻译</button><div id="out"><span class="cp" id="cp">复制</span><span id="ot">The morning mist in the mountains is a letter left by the night.</span></div><h3 class="sec">历史记录</h3><div class="hi"><b>潮汐会把故事带回岸上</b><span>The tide brings stories back to shore</span></div><div class="hi"><b>今晚月色真美</b><span>The moon is beautiful tonight</span></div><script>var dict={"你好":"Hello","谢谢":"Thank you","山间清晨的雾，是夜晚留下的信。":"The morning mist in the mountains is a letter left by the night.","潮汐会把故事带回岸上":"The tide brings stories back to shore","我爱你":"I love you"};document.getElementById("go").onclick=function(){var v=document.getElementById("tin").value.trim();document.getElementById("ot").textContent=dict[v]||"[译] "+v;};document.getElementById("clr").onclick=function(){document.getElementById("tin").value="";};var sw=document.getElementById("swap"),deg=0,l1=document.getElementById("l1"),l2=document.getElementById("l2");sw.onclick=function(){deg+=180;sw.style.transform="rotate("+deg+"deg)";var t=l1.textContent;l1.textContent=l2.textContent;l2.textContent=t;};document.getElementById("cp").onclick=function(){var c=document.getElementById("cp");c.textContent="已复制 ✓";setTimeout(function(){c.textContent="复制";},1200);};</script></div></body></html>
