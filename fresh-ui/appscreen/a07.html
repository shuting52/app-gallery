<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾光相册</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%}body{background:#06080c;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:#fff;overflow:hidden}.stage{width:430px;height:900px;position:relative;overflow:hidden;background:#faf7f1}body{color:#2c2620}.stage{color:#2c2620}.top{padding:56px 24px 0;display:flex;justify-content:space-between;align-items:center}.top h2{font-size:22px;letter-spacing:2px}.top span{font-size:13px;color:#a08c6c}.search{margin:16px 24px 0;background:#fff;border:1px solid #ece2cf;border-radius:14px;padding:12px 16px;font-size:13px;color:#b3a488;box-shadow:0 4px 14px rgba(160,140,108,.08)}.tabs{display:flex;gap:8px;margin:16px 24px 0}.tab{border:none;background:none;font-size:14px;color:#a08c6c;padding:8px 16px;border-radius:18px;cursor:pointer}.tab.on{background:#2c2620;color:#faf7f1;font-weight:700}.grid{columns:2;column-gap:12px;margin:16px 24px 0}.ph{break-inside:avoid;border-radius:14px;margin-bottom:12px;position:relative;overflow:hidden;display:flex;align-items:flex-end;animation:pin .7s both;box-shadow:0 6px 18px rgba(60,40,20,.15)}@keyframes pin{from{opacity:0;transform:translateY(24px)}}.ph span{font-size:12px;color:#fff;padding:10px 12px;text-shadow:0 1px 6px rgba(0,0,0,.4)}.ht{position:absolute;top:8px;right:8px;border:none;background:rgba(0,0,0,.32);color:#fff;border-radius:16px;padding:5px 10px;font-size:13px;cursor:pointer;backdrop-filter:blur(4px)}.ht b{font-weight:400;font-size:11px;margin-left:3px}.ht.on{background:#ff5c8a}.fab{position:absolute;right:26px;bottom:34px;width:60px;height:60px;border-radius:50%;border:none;background:linear-gradient(135deg,#ff9a5c,#ff5c8a);color:#fff;font-size:28px;cursor:pointer;box-shadow:0 10px 26px rgba(255,92,138,.45)}</style></head><body><div class="stage"><div class="top"><div><h2>拾光相册</h2><span>1,248 张照片 · 36 个相册</span></div><span>编辑</span></div><div class="search">🔍 搜索照片、地点、人物…</div><div class="tabs"><button class="tab on">全部</button><button class="tab">风景</button><button class="tab">人像</button><button class="tab">美食</button></div><div class="grid"><div class="ph" style="height:150px;background:linear-gradient(135deg,#ff9a8b,#ff6a88)"><span>海边日落</span><button class="ht" data-n="0">♡<b>12</b></button></div><div class="ph" style="height:110px;background:linear-gradient(135deg,#a18cd1,#7b5cff)"><span>城市夜景</span><button class="ht" data-n="1">♡<b>15</b></button></div><div class="ph" style="height:190px;background:linear-gradient(135deg,#43e97b,#38f9d7)"><span>山间清晨</span><button class="ht" data-n="2">♡<b>18</b></button></div><div class="ph" style="height:120px;background:linear-gradient(135deg,#fbc2eb,#a6c1ee)"><span>樱花小径</span><button class="ht" data-n="3">♡<b>21</b></button></div><div class="ph" style="height:170px;background:linear-gradient(135deg,#fddb92,#d1fdff)"><span>沙漠星空</span><button class="ht" data-n="4">♡<b>24</b></button></div><div class="ph" style="height:130px;background:linear-gradient(135deg,#f6d365,#fda085)"><span>秋日林间</span><button class="ht" data-n="5">♡<b>27</b></button></div><div class="ph" style="height:160px;background:linear-gradient(135deg,#5ee7df,#b490ca)"><span>湖面微光</span><button class="ht" data-n="6">♡<b>30</b></button></div><div class="ph" style="height:115px;background:linear-gradient(135deg,#ffecd2,#fcb69f)"><span>午后咖啡</span><button class="ht" data-n="7">♡<b>33</b></button></div></div><button class="fab">＋</button><script>document.querySelectorAll(".ht").forEach(function(b){b.onclick=function(e){e.stopPropagation();var n=+b.dataset.n,on=b.classList.toggle("on");b.dataset.n=on?n+1:n-1;b.innerHTML=(on?"♥":"♡")+"<b>"+b.dataset.n+"</b>";};});document.querySelectorAll(".tab").forEach(function(t){t.onclick=function(){document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("on");});t.classList.add("on");};});</script></div></body></html>
