<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>绿野养护</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%}body{background:#06080c;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:#fff;overflow:hidden}.stage{width:430px;height:900px;position:relative;overflow:hidden;background:linear-gradient(180deg,#eef7e8 0%,#dcebd2 60%,#c9dfc0 100%)}body{color:#22331f}.stage{color:#22331f}.top{padding:56px 26px 0;display:flex;justify-content:space-between;align-items:center}.top h2{font-size:22px;letter-spacing:2px}.top h2 span{color:#4a9e4f}.banner{margin:16px 26px 0;border-radius:20px;padding:18px;background:linear-gradient(135deg,#2d6a4f,#74c69d);color:#fff;box-shadow:0 12px 28px rgba(45,106,79,.3);position:relative;overflow:hidden}.banner::after{content:"🌧";position:absolute;right:16px;top:8px;font-size:56px;opacity:.35}.banner b{font-size:16px;display:block}.banner p{font-size:12px;opacity:.9;margin-top:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 26px 0}.pc{background:#fffdf8;border-radius:18px;padding:18px 14px;text-align:center;box-shadow:0 8px 20px rgba(60,90,50,.1);animation:pin .6s both}@keyframes pin{from{opacity:0;transform:scale(.92)}}.pot{font-size:52px;animation:sway 4s ease-in-out infinite alternate;animation-delay:-2s;display:inline-block}@keyframes sway{to{transform:rotate(6deg)}}.pc>b{font-size:15px;display:block;margin-top:8px}.pc>span{font-size:11px;color:#8aa184}.wl{height:8px;border-radius:4px;background:#e4ecdf;margin:10px 4px 0;overflow:hidden}.wl b{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#4a9e4f,#95d5b2);transition:width .6s}.wt{margin-top:10px;border:none;background:#e8f4e4;color:#2d6a4f;border-radius:12px;padding:8px 20px;font-size:13px;cursor:pointer;font-weight:700}.wt:active{transform:scale(.94)}.rem{margin:16px 26px 0;background:#fffdf8;border-radius:16px;padding:16px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 20px rgba(60,90,50,.1)}.rem i{font-style:normal;font-size:26px}.rem b{font-size:14px;display:block}.rem span{font-size:12px;color:#8aa184}.switch{position:relative;width:46px;height:26px;border-radius:13px;background:#d5e2cf;cursor:pointer;transition:background .3s;margin-left:auto;flex-shrink:0}.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .3s;box-shadow:0 2px 5px rgba(0,0,0,.2)}.switch.on{background:#4a9e4f}.switch.on::after{left:23px}</style></head><body><div class="stage"><div class="top"><h2>绿野<span>养护</span></h2><span style="font-size:13px;color:#8aa184">4 株植物</span></div><div class="banner"><b>🌧 明日有雨，室外植物不用浇水</b><p>已为 2 株植物跳过明日提醒</p></div><div class="grid"><div class="pc"><div class="pot">🌵</div><b>仙人掌</b><span>多肉 · 耐旱</span><div class="wl"><b style="width:80%"></b></div><button class="wt" data-i="0">💧 浇水</button></div><div class="pc"><div class="pot">🌿</div><b>薄荷</b><span>香草 · 喜湿</span><div class="wl"><b style="width:45%"></b></div><button class="wt" data-i="1">💧 浇水</button></div><div class="pc"><div class="pot">🌱</div><b>豆芽</b><span>观叶 · 幼苗</span><div class="wl"><b style="width:30%"></b></div><button class="wt" data-i="2">💧 浇水</button></div><div class="pc"><div class="pot">🌷</div><b>郁金香</b><span>球根 · 花期</span><div class="wl"><b style="width:60%"></b></div><button class="wt" data-i="3">💧 浇水</button></div></div><div class="rem"><i>⏰</i><div><b>浇水提醒</b><span>每天 08:00 · 推送通知</span></div><div class="switch on" id="rs"></div></div><script>document.querySelectorAll(".wt").forEach(function(b){b.onclick=function(){var bar=b.parentElement.querySelector(".wl b");bar.style.width="100%";b.textContent="✓ 已浇水";setTimeout(function(){b.innerHTML="💧 浇水";},1500);};});var rs=document.getElementById("rs");rs.onclick=function(){rs.classList.toggle("on");};</script></div></body></html>
