<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>极光之幕 · 更新弹窗</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07090d;display:flex;justify-content:center;min-height:100vh;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#fff}
.phone{width:430px;height:900px;position:relative;overflow:hidden;background:#0d1117;flex-shrink:0}
.app{position:absolute;inset:0;padding:14px;transition:filter .4s}
.app.blur{filter:blur(8px) brightness(.55)}
.status{display:flex;justify-content:space-between;font-size:12px;color:#8b93a5;padding:8px 4px 16px}
.hello{font-size:22px;font-weight:700;margin:2px 0 2px}
.sub{font-size:12px;color:#8b93a5;margin-bottom:14px}
.acard{background:#161c26;border:1px solid #232c3d;border-radius:16px;padding:16px;margin-bottom:12px}
.acard .t{font-size:14px;font-weight:600}
.acard .d{font-size:12px;color:#8b93a5;margin-top:6px}
.skel{height:10px;border-radius:5px;background:#232c3d;margin-top:10px}
.tabbar{position:absolute;bottom:0;left:0;right:0;height:78px;background:#11161f;border-top:1px solid #232c3d;display:flex;justify-content:space-around;align-items:center}
.tabbar i{width:44px;height:30px;border-radius:9px;background:#1c2330;display:block}
.tabbar i.on{background:#31405c}
.mask{position:absolute;inset:0;background:rgba(4,6,10,.55);opacity:0;pointer-events:none;transition:opacity .4s}
.phone.show .mask{opacity:1}
.modal{position:absolute;left:50%;top:50%;width:340px;border-radius:26px;overflow:hidden;background:#141a24;border:1px solid #262f42;box-shadow:0 30px 80px rgba(0,0,0,.6);opacity:0;transform:translate(-50%,-50%) scale(.82);pointer-events:none}
.phone.show .modal{animation:pop .55s cubic-bezier(.2,.9,.3,1.25) forwards;pointer-events:auto}
@keyframes pop{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.hero{position:relative;height:188px;overflow:hidden}
.mbody{padding:18px 20px 20px}
.ver{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:rgba(110,242,200,.13);color:#6ef2c8;margin-bottom:8px}
.mbody h2{font-size:19px;margin-bottom:4px}
.tag{font-size:12px;color:#8b93a5;margin-bottom:12px}
.log{list-style:none;margin-bottom:14px}
.log li{font-size:12.5px;color:#c3cad8;padding:7px 0 7px 22px;position:relative;border-bottom:1px dashed #232c3d}
.log li:last-child{border:none}
.log li::before{content:"";position:absolute;left:2px;top:11px;width:8px;height:8px;border-radius:50%;background:#6ef2c8;box-shadow:0 0 8px #6ef2c8}
.prow{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.pbar{flex:1;height:10px;border-radius:6px;background:#232c3d;overflow:hidden}
.fill{height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#1f9e78,#6ef2c8);animation:fillin 2.8s ease forwards}
@keyframes fillin{to{width:68%}}
.pct{font-size:13px;font-weight:700;color:#6ef2c8;min-width:44px;text-align:right}
.go{width:100%;border:none;border-radius:14px;padding:13px;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,#1f9e78,#43cfa0);cursor:pointer;transition:transform .12s,filter .2s}
.go:active{transform:scale(.97)}
.go.busy{filter:saturate(.6) brightness(.85);cursor:wait}
.go.ok{background:linear-gradient(135deg,#22c07a,#0e9d5f)}
.later{width:100%;background:none;border:none;color:#8b93a5;font-size:13px;margin-top:10px;cursor:pointer;padding:6px}
.note{font-size:11px;color:#22c07a;text-align:center;min-height:16px;margin-top:8px}
.rep{position:absolute;top:12px;right:12px;z-index:5;border:1px solid #2c3a52;background:rgba(20,26,36,.85);color:#aeb8cc;font-size:11px;border-radius:16px;padding:6px 12px;cursor:pointer}


.hero{background:linear-gradient(180deg,#040918 0%,#081226 70%,#0a1428 100%)}
.astar{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 2.4s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.15}}
.a0{top:18px;left:40px}.a1{top:30px;left:120px;animation-delay:-.8s}.a2{top:14px;left:210px}.a3{top:44px;left:290px;animation-delay:-1.4s}
.a4{top:60px;left:80px}.a5{top:24px;left:330px;animation-delay:-.5s}.a6{top:70px;left:180px;animation-delay:-1.9s}
.a7{top:52px;left:250px}.a8{top:80px;left:320px;animation-delay:-1.1s}.a9{top:36px;left:20px;animation-delay:-.3s}
.aurora{position:absolute;top:-40px;width:120px;height:220px;border-radius:50%;filter:blur(22px);opacity:.75;transform-origin:top center;animation:curtain 6s ease-in-out infinite alternate}
.au1{left:60px;background:linear-gradient(180deg,#22e6a2,transparent)}
.au2{left:150px;background:linear-gradient(180deg,#7a5cff,transparent);animation-delay:-2s}
.au3{left:230px;background:linear-gradient(180deg,#39c6ff,transparent);animation-delay:-4s}
@keyframes curtain{from{transform:skewX(-12deg) translateY(0)}to{transform:skewX(12deg) translateY(14px)}}
.mount{position:absolute;bottom:-50px;left:-10%;width:120%;height:100px;background:#060b14;border-radius:50%}
</style></head>
<body><div class="phone show" id="ph">
<div class="app blur" id="app">
<div class="status"><span>21:47</span><span>5G ▰▰▰ 82%</span></div>
<div class="hello">晚上好，陈淑婷</div><div class="sub">今日有 3 个应用等待更新</div>
<div class="acard"><div class="t">灵感笔记</div><div class="d">v2.1.0 → v2.2.0 · 可更新</div><div class="skel" style="width:70%"></div></div>
<div class="acard"><div class="t">慢时光</div><div class="d">v4.5.3 → v4.6.0 · 可更新</div><div class="skel" style="width:52%"></div></div>
<div class="acard"><div class="t">拾光相册</div><div class="d">v1.9.8 → v2.0.0 · 可更新</div><div class="skel" style="width:84%"></div></div>
<div class="tabbar"><i class="on"></i><i></i><i></i><i></i></div>
</div>
<div class="mask"></div>
<div class="modal">
<div class="hero"><span class="astar a0"></span><span class="astar a1"></span><span class="astar a2"></span><span class="astar a3"></span><span class="astar a4"></span><span class="astar a5"></span><span class="astar a6"></span><span class="astar a7"></span><span class="astar a8"></span><span class="astar a9"></span><div class="aurora au1"></div><div class="aurora au2"></div><div class="aurora au3"></div><div class="mount"></div></div>
<div class="mbody">
<span class="ver">v3.0.5</span>
<h2>极光之幕</h2>
<div class="tag">头顶极光，脚下是新功能</div>
<ul class="log"><li>极光主题：随时间流转色彩</li><li>夜空模式支持自定义星图</li><li>通知光效柔和不刺眼</li></ul>
<div class="prow"><div class="pbar"><div class="fill" id="fill"></div></div><div class="pct" id="pct">68%</div></div>
<button class="go" id="go">立即更新</button>
<button class="later" id="later">稍后再说</button>
<div class="note" id="note"></div>
</div></div>
<button class="rep" id="rep">↻ 重新弹出</button>
</div>
<script>
const ph=document.getElementById('ph'),go=document.getElementById('go'),later=document.getElementById('later'),
rep=document.getElementById('rep'),fill=document.getElementById('fill'),pct=document.getElementById('pct'),
note=document.getElementById('note'),app=document.getElementById('app');
const INIT=68;let busy=false;
go.onclick=()=>{if(busy)return;busy=true;go.textContent='更新中…';go.classList.add('busy');
fill.style.animation='none';fill.style.transition='width 2.2s ease';fill.style.width='100%';
let p=INIT;const t=setInterval(()=>{p+=Math.ceil((100-p)/7)+1;if(p>=100){p=100;clearInterval(t);done();}pct.textContent=p+'%';},130);};
function done(){go.textContent='✓ 更新完成';go.classList.remove('busy');go.classList.add('ok');
note.textContent='已是最新版本，重启 App 生效';setTimeout(closeM,1500);}
function closeM(){ph.classList.remove('show');app.classList.remove('blur');}
later.onclick=closeM;
rep.onclick=()=>{busy=false;clearInterval(0);fill.style.transition='none';fill.style.animation='none';fill.style.width='0';
void fill.offsetWidth;fill.style.animation='';pct.textContent=INIT+'%';go.textContent='立即更新';go.className='go';
note.textContent='';app.classList.add('blur');ph.classList.remove('show');void ph.offsetWidth;ph.classList.add('show');};

</script>
</body></html>
