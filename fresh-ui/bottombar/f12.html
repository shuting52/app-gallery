<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星轨环绕 · 底部栏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{display:flex;align-items:center;justify-content:center;background:#020308;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
.phone{width:430px;height:900px;max-width:100vw;max-height:100vh;border-radius:44px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:linear-gradient(180deg,#0b1030 0%,#060818 55%,#03040c 100%)}
.stars{position:absolute;inset:0;background:
 radial-gradient(1.6px 1.6px at 15% 10%,#fff,transparent),
 radial-gradient(1px 1px at 66% 6%,#fff,transparent),
 radial-gradient(1.3px 1.3px at 38% 20%,#cfe3ff,transparent),
 radial-gradient(1px 1px at 85% 24%,#fff,transparent),
 radial-gradient(1.5px 1.5px at 55% 34%,#fff,transparent),
 radial-gradient(1px 1px at 10% 40%,#cfe3ff,transparent),
 radial-gradient(1.2px 1.2px at 74% 48%,#fff,transparent),
 radial-gradient(1px 1px at 28% 58%,#fff,transparent);opacity:.8;pointer-events:none}
.planet{position:absolute;top:96px;right:64px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#8fa8ff,#3a4a9e 60%,#1a2150);box-shadow:0 0 34px rgba(120,150,255,.5);pointer-events:none}
.planet::after{content:'';position:absolute;left:-24px;top:50%;width:138px;height:34px;margin-top:-17px;border:2px solid rgba(160,190,255,.5);border-radius:50%;transform:rotate(-16deg)}
.content{flex:1;padding:64px 26px 20px;position:relative;z-index:1}
.kicker{font-size:12px;letter-spacing:4px;color:#7f96e8;margin-bottom:10px}
h1{font-size:32px;font-weight:700;color:#eef1ff;margin-bottom:24px;text-shadow:0 0 26px rgba(120,150,255,.45)}
.card{background:rgba(24,30,66,.55);border:1px solid rgba(130,160,255,.22);border-radius:18px;min-height:112px;margin-bottom:14px;display:flex;align-items:center;justify-content:center;color:#8b9bd6;font-size:14px;letter-spacing:2px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.tabbar{position:relative;display:flex;height:104px;padding:10px 6px 24px;background:rgba(6,8,20,.88);border-top:1px solid rgba(130,160,255,.28);z-index:2}
.tab{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#6b76a8;font-family:inherit;transition:color .3s}
.tab svg{width:26px;height:26px;display:block;position:relative;z-index:2}
.tab span{font-size:11px;display:block;letter-spacing:1px;position:relative;z-index:2}
.orb{position:relative;width:64px;height:44px;display:flex;align-items:center;justify-content:center}
.orbitbox{position:absolute;inset:0;opacity:0;transform:scale(.5);transition:opacity .45s ease,transform .45s ease;pointer-events:none}
.tab.active .orbitbox{opacity:1;transform:scale(1)}
.tilt{position:absolute;inset:0;transform:rotate(-18deg)}
.ring{position:absolute;left:50%;top:50%;width:58px;height:24px;margin:-12px 0 0 -29px;border:1.5px solid rgba(160,190,255,.6);border-radius:50%;box-shadow:0 0 10px rgba(140,170,255,.35)}
.satw{position:absolute;left:50%;top:50%;width:58px;height:24px;margin:-12px 0 0 -29px;animation:orbit 3.6s linear infinite;animation-delay:-1.8s}
.satw i{display:block;width:7px;height:7px;border-radius:50%;background:#e6efff;box-shadow:0 0 10px 2px #9fc2ff;position:absolute;left:50%;top:-3.5px;margin-left:-3.5px}
@keyframes orbit{to{transform:rotate(360deg)}}
.tab.active{color:#dbe7ff}
.tab.active svg{filter:drop-shadow(0 0 8px rgba(160,190,255,.9))}
</style>
</head>
<body>
<div class="phone">
  <div class="stars"></div>
  <div class="planet"></div>
  <div class="content">
    <div class="kicker">ORBITAL</div>
    <h1 id="ctitle">深空站</h1>
    <div class="card">引力 · 占位卡片一</div>
    <div class="card">光年 · 占位卡片二</div>
    <div class="card">尘埃 · 占位卡片三</div>
  </div>
  <nav class="tabbar">
    <button class="tab"><span class="orb"><span class="orbitbox"><span class="tilt"><i class="ring"></i><span class="satw"><i></i></span></span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 9.5V20h12V9.5"/></svg></span><span>首页</span></button>
    <button class="tab"><span class="orb"><span class="orbitbox"><span class="tilt"><i class="ring"></i><span class="satw"><i></i></span></span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg></span><span>星云</span></button>
    <button class="tab"><span class="orb"><span class="orbitbox"><span class="tilt"><i class="ring"></i><span class="satw"><i></i></span></span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></span><span>探索</span></button>
    <button class="tab"><span class="orb"><span class="orbitbox"><span class="tilt"><i class="ring"></i><span class="satw"><i></i></span></span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4V6z"/></svg></span><span>消息</span></button>
    <button class="tab"><span class="orb"><span class="orbitbox"><span class="tilt"><i class="ring"></i><span class="satw"><i></i></span></span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></span><span>我的</span></button>
  </nav>
</div>
<script>
const T=[{t:'首页',h:'深空站'},{t:'星云',h:'星云图鉴'},{t:'探索',h:'轨道探索'},{t:'消息',h:'引力消息'},{t:'我的',h:'我的舱室'}];
const btns=[...document.querySelectorAll('.tab')];
const h1=document.getElementById('ctitle');
function act(k){
  k=Math.max(0,Math.min(T.length-1,k));
  btns.forEach((b,i)=>b.classList.toggle('active',i===k));
  h1.textContent=T[k].h;
  try{history.replaceState(null,'','?tab='+k)}catch(e){}
}
btns.forEach((b,i)=>b.addEventListener('click',()=>act(i)));
let k=parseInt(new URLSearchParams(location.search).get('tab'),10);
if(isNaN(k))k=0;
act(k);
</script>
</body>
</html>
