<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>全息投影 · 底部栏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#141416;display:flex;justify-content:center;align-items:flex-start;padding:0;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
.phone{width:430px;height:900px;border-radius:48px;overflow:hidden;position:relative;background:#04090f;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 10px #0a0a0c,0 0 0 12px #3a3a3e;flex:none}
.content{padding:64px 28px 0}
.content h1{font-size:40px;letter-spacing:3px;color:#dffaff}
.content .sub{margin-top:12px;font-size:15px;color:#5f7d8c;line-height:1.8;min-height:54px}
.card{margin-top:22px;height:148px;border-radius:20px;background:linear-gradient(135deg,#07202b,#0b3342);position:relative;overflow:hidden;box-shadow:0 8px 24px rgba(0,240,255,.07);border:1px solid rgba(0,240,255,.12)}
.card::before{content:"";position:absolute;left:22px;top:26px;width:36%;height:14px;border-radius:7px;background:rgba(0,240,255,.25)}
.card::after{content:"";position:absolute;left:22px;top:54px;width:62%;height:10px;border-radius:5px;background:rgba(0,240,255,.13);box-shadow:0 24px 0 rgba(0,240,255,.09)}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:138px;background:rgba(3,10,16,.95);border-top:1px solid rgba(0,240,255,.28);display:flex;justify-content:space-around;align-items:flex-start;padding:18px 10px 0}
.tabbar::before{content:"";position:absolute;bottom:0;left:8%;right:8%;height:30px;background:radial-gradient(ellipse at center,rgba(0,240,255,.45),transparent 70%);filter:blur(8px);pointer-events:none}
.tab{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0;width:64px}
.icon{position:relative;width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:#3d5a68;transition:color .3s}
.icon svg{width:27px;height:27px;display:block}
.tab.on .icon{color:#00f0ff}
.tab.on .icon::before{content:"";position:absolute;bottom:-4px;left:10px;right:10px;height:3px;border-radius:2px;background:#00f0ff;filter:blur(2px);box-shadow:0 0 12px 2px rgba(0,240,255,.9)}
.tab.on .icon::after{content:"";position:absolute;inset:-6px;border-radius:10px;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,240,255,.30) 3px 5px);animation:sweep 2.2s linear infinite;animation-delay:-1.1s;pointer-events:none}
.tab.on .icon svg{filter:drop-shadow(0 0 7px rgba(0,240,255,.9));animation:flick 2.8s linear infinite;animation-delay:-1.4s}
@keyframes sweep{to{background-position:0 22px}}
@keyframes flick{0%,100%{opacity:1}8%{opacity:.72}10%{opacity:1}36%{opacity:.85}38%{opacity:1}70%{opacity:.9}72%{opacity:1}}
.tlabel{font-size:12px;color:#4d6472;letter-spacing:3px;display:block;transition:color .3s}
.tab.on .tlabel{color:#aef7ff;text-shadow:0 0 10px rgba(0,240,255,.8)}
</style>
</head>
<body>
<div class="phone">
  <div class="content">
    <h1 id="ctitle">首页</h1>
    <p class="sub" id="csub">光从底座升起，把图标投成全息影像。</p>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
  </div>
  <nav class="tabbar" id="bar"></nav>
</div>
<script>
var ICONS=[
'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 3l9 8.5"/><path d="M5.5 10.5V21h5v-6h3v6h5V10.5"/></svg>',
'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5 13 13l-4.5 2.5L11 11z"/></svg>',
'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>',
'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-5.5 8-5.5s6.5 1.5 8 5.5"/></svg>'
];
var TABS=[
 {t:'首页',s:'光从底座升起，把图标投成全息影像。'},
 {t:'发现',s:'扫描线一遍遍刷过，信号始终在线。'},
 {t:'发布',s:'按下发射键，想法被投射到空中。'},
 {t:'消息',s:'每条提醒都带着轻微的电流闪烁。'},
 {t:'我的',s:'全息档案展开，身份清晰可辨。'}
];
var bar=document.getElementById('bar');
TABS.forEach(function(tb,i){
  var b=document.createElement('button');b.className='tab';b.setAttribute('aria-label',tb.t);
  b.innerHTML='<span class="icon">'+ICONS[i]+'</span><span class="tlabel">'+tb.t+'</span>';
  b.addEventListener('click',function(){select(i);});
  bar.appendChild(b);
});
var tabs=Array.prototype.slice.call(bar.querySelectorAll('.tab'));
var ctitle=document.getElementById('ctitle'),csub=document.getElementById('csub');
function select(k){
  k=Math.max(0,Math.min(k,TABS.length-1));
  tabs.forEach(function(t,i){t.classList.toggle('on',i===k);});
  ctitle.textContent=TABS[k].t;csub.textContent=TABS[k].s;
  try{history.replaceState(null,'','?tab='+k);}catch(e){}
}
var start=parseInt(new URLSearchParams(location.search).get('tab'),10);
if(isNaN(start)||start<0||start>=TABS.length)start=0;
select(start);
</script>
</body>
</html>
