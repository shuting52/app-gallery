<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>云端漫步 · 底部栏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{display:flex;align-items:center;justify-content:center;background:#0e1620;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
.phone{width:430px;height:900px;max-width:100vw;max-height:100vh;border-radius:44px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:linear-gradient(180deg,#a8d4f5 0%,#c9e6fb 45%,#eaf6ff 100%)}
.sky{position:absolute;top:0;left:0;right:0;bottom:100px;overflow:hidden;pointer-events:none}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.92;animation:drift linear infinite}
.cloud::before{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud.c1{width:110px;height:30px;top:110px;animation-duration:34s;animation-delay:-12s}
.cloud.c1::before{width:52px;height:52px;top:-24px;left:18px}
.cloud.c1::after{width:38px;height:38px;top:-16px;left:58px}
.cloud.c2{width:84px;height:24px;top:260px;animation-duration:26s;animation-delay:-22s;opacity:.8}
.cloud.c2::before{width:40px;height:40px;top:-18px;left:14px}
.cloud.c2::after{width:30px;height:30px;top:-12px;left:44px}
.cloud.c3{width:130px;height:34px;top:420px;animation-duration:42s;animation-delay:-30s;opacity:.7}
.cloud.c3::before{width:60px;height:60px;top:-28px;left:24px}
.cloud.c3::after{width:44px;height:44px;top:-20px;left:70px}
@keyframes drift{from{transform:translateX(-170px)}to{transform:translateX(600px)}}
.content{flex:1;padding:64px 26px 20px;position:relative;z-index:1}
.kicker{font-size:12px;letter-spacing:4px;color:#5b8fc4;margin-bottom:10px}
h1{font-size:32px;font-weight:700;color:#1d4e7e;margin-bottom:24px}
.card{background:rgba(255,255,255,.7);border:1px solid rgba(140,190,235,.5);border-radius:18px;min-height:112px;margin-bottom:14px;display:flex;align-items:center;justify-content:center;color:#5b8fc4;font-size:14px;letter-spacing:2px;box-shadow:0 8px 20px rgba(120,175,225,.25)}
.tabbar{position:relative;display:flex;height:104px;padding:10px 6px 24px;background:rgba(255,255,255,.72);border-top:1px solid rgba(140,190,235,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:2}
.tab{flex:1;background:none;border:none;cursor:pointer;color:#6d93b8;font-family:inherit;transition:transform .35s cubic-bezier(.34,1.56,.64,1),color .3s}
.tab .inner{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.tab svg{width:26px;height:26px;display:block}
.tab span{font-size:11px;display:block;letter-spacing:1px}
.footcloud{position:relative;display:block;width:44px;height:13px;background:#fff;border-radius:999px;opacity:0;transform:scale(.5);transition:opacity .35s,transform .35s;box-shadow:0 3px 10px rgba(120,170,220,.55);margin-top:2px}
.footcloud::before{content:'';position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;top:-9px;left:8px}
.footcloud::after{content:'';position:absolute;width:15px;height:15px;background:#fff;border-radius:50%;top:-6px;left:24px}
.tab.active{transform:translateY(-13px);color:#1d6fd1}
.tab.active .inner{animation:bob 2.6s ease-in-out infinite;animation-delay:-1.3s}
.tab.active .footcloud{opacity:1;transform:scale(1)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
</style>
</head>
<body>
<div class="phone">
  <div class="sky">
    <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  </div>
  <div class="content">
    <div class="kicker">SKY WALK</div>
    <h1 id="ctitle">云上晨间</h1>
    <div class="card">晴空 · 占位卡片一</div>
    <div class="card">微风 · 占位卡片二</div>
    <div class="card">云海 · 占位卡片三</div>
  </div>
  <nav class="tabbar">
    <button class="tab"><span class="inner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 9.5V20h12V9.5"/></svg><span>首页</span><i class="footcloud"></i></span></button>
    <button class="tab"><span class="inner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 18a4 4 0 0 0 .6-7.96A5.5 5.5 0 0 0 6.9 8.6 4.5 4.5 0 0 0 7 18h10z"/></svg><span>天空</span><i class="footcloud"></i></span></button>
    <button class="tab"><span class="inner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg><span>漫步</span><i class="footcloud"></i></span></button>
    <button class="tab"><span class="inner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4V6z"/></svg><span>消息</span><i class="footcloud"></i></span></button>
    <button class="tab"><span class="inner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span>我的</span><i class="footcloud"></i></span></button>
  </nav>
</div>
<script>
const T=[{t:'首页',h:'云上晨间'},{t:'天空',h:'天空观测'},{t:'漫步',h:'云端漫步'},{t:'消息',h:'风信消息'},{t:'我的',h:'我的云朵'}];
const btns=[...document.querySelectorAll('.tab')];
const h1=document.getElementById('ctitle');
function act(k){
  k=Math.max(0,Math.min(T.length-1,k));
  btns.forEach((b,i)=>b.classList.toggle('active',i===k));
  h1.textContent=T[k].h;
  try{history.replaceState(null,'','?tab='+k)}catch(e){}
}
btns.forEach((b,i)=>b.addEventListener('click',()=>act(i)));
let k=parseInt(new URLSearchParams(location.search).get('tab'),10);
if(isNaN(k))k=0;
act(k);
</script>
</body>
</html>
