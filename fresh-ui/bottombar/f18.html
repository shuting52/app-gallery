<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>黑洞引力 · 底部栏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#141416;display:flex;justify-content:center;align-items:flex-start;padding:0;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
.phone{width:430px;height:900px;border-radius:48px;overflow:hidden;position:relative;background:#020204;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 10px #0a0a0c,0 0 0 12px #3a3a3e;flex:none}
.stars{position:absolute;inset:0;pointer-events:none;background:
 radial-gradient(1.5px 1.5px at 12% 18%,rgba(255,255,255,.8),transparent),
 radial-gradient(1px 1px at 32% 8%,rgba(255,255,255,.5),transparent),
 radial-gradient(1.5px 1.5px at 55% 22%,rgba(255,255,255,.7),transparent),
 radial-gradient(1px 1px at 74% 12%,rgba(255,255,255,.5),transparent),
 radial-gradient(1px 1px at 88% 30%,rgba(255,255,255,.6),transparent),
 radial-gradient(1.5px 1.5px at 22% 42%,rgba(255,255,255,.5),transparent),
 radial-gradient(1px 1px at 45% 55%,rgba(255,255,255,.4),transparent),
 radial-gradient(1px 1px at 66% 48%,rgba(255,255,255,.55),transparent),
 radial-gradient(1.5px 1.5px at 84% 62%,rgba(255,255,255,.5),transparent)}
.content{position:relative;padding:64px 28px 0;z-index:1}
.content h1{font-size:40px;letter-spacing:3px;color:#eceaff}
.content .sub{margin-top:12px;font-size:15px;color:#6f6c8c;line-height:1.8;min-height:54px}
.card{margin-top:22px;height:148px;border-radius:20px;background:linear-gradient(135deg,#101018,#0a0a14);position:relative;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.5);border:1px solid rgba(140,120,255,.14)}
.card::before{content:"";position:absolute;left:22px;top:26px;width:36%;height:14px;border-radius:7px;background:rgba(150,135,255,.28)}
.card::after{content:"";position:absolute;left:22px;top:54px;width:62%;height:10px;border-radius:5px;background:rgba(150,135,255,.14);box-shadow:0 24px 0 rgba(150,135,255,.1)}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:150px;background:rgba(2,2,6,.92);border-top:1px solid rgba(140,120,255,.22);display:flex;justify-content:space-around;align-items:flex-start;padding:16px 10px 0;z-index:2}
.tab{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0;width:70px}
.core{position:relative;width:62px;height:62px;display:flex;align-items:center;justify-content:center;color:#4c4a66;transition:color .3s}
.core svg{width:28px;height:28px;display:block;position:relative;z-index:2}
.core svg.suck{animation:suck .32s ease-in forwards}
.core svg.burst{animation:burst .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes suck{to{transform:scale(0) rotate(160deg);opacity:0}}
@keyframes burst{0%{transform:scale(0);opacity:0}55%{transform:scale(1.35);opacity:1}78%{transform:scale(.92)}100%{transform:scale(1)}}
.tab.on .core{color:#cfd6ff}
.tab.on .core svg{filter:drop-shadow(0 0 9px rgba(143,123,255,.95))}
.tab.on .core::before{content:"";position:absolute;inset:-9px;border-radius:50%;z-index:1;background:conic-gradient(from 0deg,transparent 0 40deg,rgba(140,120,255,.75) 62deg,transparent 95deg,transparent 175deg,rgba(255,120,200,.55) 208deg,transparent 245deg);animation:spin 7s linear infinite;animation-delay:-3.5s;filter:blur(1.5px)}
.tab.on .core::after{content:"";position:absolute;inset:8px;border-radius:50%;z-index:1;background:radial-gradient(circle,rgba(40,28,90,.85),transparent 70%)}
.shock{position:absolute;inset:-9px;border-radius:50%;border:2px solid rgba(160,140,255,.85);opacity:0;pointer-events:none;z-index:3;display:block}
.core.wave .shock{animation:shock .8s ease-out}
@keyframes shock{0%{transform:scale(.25);opacity:.95}100%{transform:scale(2.5);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.tlabel{font-size:12px;color:#4c4a66;letter-spacing:3px;display:block}
.tab.on .tlabel{color:#b9adff}
</style>
</head>
<body>
<div class="phone">
  <div class="stars"></div>
  <div class="content">
    <h1 id="ctitle">首页</h1>
    <p class="sub" id="csub">旧图标被吸成奇点，新的从爆发里弹出来。</p>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
  </div>
  <nav class="tabbar" id="bar"></nav>
</div>
<script>
var ICONS=[
'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 3l9 8.5"/><path d="M5.5 10.5V21h5v-6h3v6h5V10.5"/></svg>',
'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5 13 13l-4.5 2.5L11 11z"/></svg>',
'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>',
'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-5.5 8-5.5s6.5 1.5 8 5.5"/></svg>'
];
var TABS=[
 {t:'首页',s:'旧图标被吸成奇点，新的从爆发里弹出来。'},
 {t:'发现',s:'视界边缘转动的，是未读的好奇心。'},
 {t:'消息',s:'连光都逃不掉，何况一条提醒。'},
 {t:'我的',s:'坍缩之后，剩下的全是精华。'}
];
var bar=document.getElementById('bar');
TABS.forEach(function(tb,i){
  var b=document.createElement('button');b.className='tab';b.setAttribute('aria-label',tb.t);
  b.innerHTML='<span class="core">'+ICONS[i]+'<i class="shock"></i></span><span class="tlabel">'+tb.t+'</span>';
  b.addEventListener('click',function(){select(i,true);});
  bar.appendChild(b);
});
var tabs=Array.prototype.slice.call(bar.querySelectorAll('.tab'));
var ctitle=document.getElementById('ctitle'),csub=document.getElementById('csub');
var cur=0;
function paint(k){
  tabs.forEach(function(t,i){t.classList.toggle('on',i===k);});
  ctitle.textContent=TABS[k].t;csub.textContent=TABS[k].s;
}
function ignite(k){
  var core=tabs[k].querySelector('.core'),svg=tabs[k].querySelector('svg');
  svg.classList.remove('burst');void svg.offsetWidth;svg.classList.add('burst');
  core.classList.remove('wave');void core.offsetWidth;core.classList.add('wave');
}
function select(k,anim){
  k=Math.max(0,Math.min(k,TABS.length-1));
  var prev=cur;cur=k;paint(k);
  if(!anim)return;
  if(k===prev){ignite(k);}
  else{
    var oldSvg=tabs[prev].querySelector('svg');
    oldSvg.classList.add('suck');
    setTimeout(function(){
      oldSvg.classList.remove('suck');
      ignite(k);
    },320);
  }
  try{history.replaceState(null,'','?tab='+k);}catch(e){}
}
var start=parseInt(new URLSearchParams(location.search).get('tab'),10);
if(isNaN(start)||start<0||start>=TABS.length)start=0;
cur=start;paint(start);
</script>
</body>
</html>
