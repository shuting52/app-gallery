<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>重力滚球</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{display:flex;align-items:center;justify-content:center;background:#141419;
font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
.phone{width:430px;height:900px;border-radius:48px;overflow:hidden;position:relative;
display:flex;flex-direction:column;background:#0d0d14;color:#eceaf6;
box-shadow:0 30px 80px rgba(0,0,0,.6)}
.content{flex:1;padding:56px 28px 20px;position:relative;z-index:1}
.content .tag{display:inline-block;font-size:12px;letter-spacing:4px;color:#8ea2ff;margin-bottom:14px}
.content h1{font-size:44px;font-weight:800;letter-spacing:2px;margin-bottom:26px}
.card{height:150px;border-radius:20px;margin-bottom:18px;position:relative;overflow:hidden;
background:linear-gradient(135deg,rgba(142,162,255,.13),rgba(255,255,255,.04));
border:1px solid rgba(255,255,255,.08)}
.card::after{content:"";position:absolute;left:22px;right:60px;top:28px;height:14px;border-radius:7px;background:rgba(255,255,255,.15)}
.card::before{content:"";position:absolute;left:22px;right:120px;top:58px;height:10px;border-radius:5px;background:rgba(255,255,255,.08)}
/* tabbar */
.barwrap{position:relative;flex:0 0 auto;z-index:2}
.tabbar{position:relative;height:88px;display:flex;background:#12121b;
border-top:1px solid rgba(255,255,255,.08)}
/* rolling ball + its shadow */
.ball{position:absolute;top:-16px;left:4px;width:32px;height:32px;border-radius:50%;z-index:3;
background:radial-gradient(circle at 32% 28%,#ffffff 0%,#d7e2ff 30%,#8ea2ff 62%,#4a5fd0 100%);
box-shadow:0 8px 16px rgba(110,130,255,.45),inset -3px -5px 8px rgba(40,50,120,.5);
transition:left .5s cubic-bezier(.3,1.35,.4,1)}
.ball.land{animation:squash .34s ease-out}
@keyframes squash{0%{transform:scale(1,1)}35%{transform:scale(1.35,.62)}70%{transform:scale(.88,1.14)}100%{transform:scale(1,1)}}
.bshadow{position:absolute;top:16px;width:26px;height:7px;border-radius:50%;z-index:2;
background:radial-gradient(ellipse,rgba(0,0,0,.5),transparent 70%);
transition:left .5s cubic-bezier(.3,1.35,.4,1)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
background:none;border:0;cursor:pointer;color:#6f6f88;position:relative;z-index:1;padding-top:8px}
.tab svg{width:26px;height:26px;transition:transform .3s,color .3s}
.tab .lb{font-size:11px;letter-spacing:1px;transition:color .3s}
.tab.active{color:#aebfff}
.tab.active svg{transform:scale(1.15);color:#fff}
.tab.active .lb{color:#8ea2ff;font-weight:600}
</style>
</head>
<body>
<div class="phone">
  <div class="content">
    <span class="tag">GRAVITY</span>
    <h1 id="t">坠落</h1>
    <div class="card"></div><div class="card"></div><div class="card"></div>
  </div>
  <div class="barwrap">
    <div class="bshadow" id="bsh"></div>
    <div class="ball" id="ball"></div>
    <nav class="tabbar" id="bar">
      <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg><span class="lb">坠落</span></button>
      <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg><span class="lb">斜坡</span></button>
      <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span class="lb">弹跳</span></button>
      <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M10.3 21a2 2 0 0 0 3.4 0"/></svg><span class="lb">撞击</span></button>
      <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg><span class="lb">静止</span></button>
    </nav>
  </div>
</div>
<script>
var names=["坠落","斜坡","弹跳","撞击","静止"];
var tabs=[].slice.call(document.querySelectorAll(".tab"));
var ball=document.getElementById("ball");
var bsh=document.getElementById("bsh");
var cur=-1,timer=null;
function cxOf(el){return el.offsetLeft+el.offsetWidth/2;}
function moveBall(k){
  ball.style.left=(cxOf(tabs[k])-16)+"px";
  bsh.style.left=(cxOf(tabs[k])-13)+"px";
  if(timer)clearTimeout(timer);
  timer=setTimeout(function(){
    ball.classList.remove("land");
    void ball.offsetWidth;
    ball.classList.add("land");
  },520);
}
function activate(k){
  if(k===cur)return;
  cur=k;
  tabs.forEach(function(b,i){b.classList.toggle("active",i===k);});
  document.getElementById("t").textContent=names[k];
  moveBall(k);
  try{history.replaceState(null,"","?tab="+k);}catch(e){}
}
var q=parseInt(new URLSearchParams(location.search).get("tab"),10);
if(isNaN(q)||q<0||q>4)q=0;
tabs.forEach(function(b,i){b.addEventListener("click",function(){activate(i);});});
requestAnimationFrame(function(){activate(q);});
</script>
</body>
</html>
