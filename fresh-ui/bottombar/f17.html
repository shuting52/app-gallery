<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>万花筒 · 底部栏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#141416;display:flex;justify-content:center;align-items:flex-start;padding:0;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
.phone{width:430px;height:900px;border-radius:48px;overflow:hidden;position:relative;background:#0a0a11;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 10px #0a0a0c,0 0 0 12px #3a3a3e;flex:none}
.content{padding:64px 28px 0}
.content h1{font-size:40px;letter-spacing:3px;color:#f2efff}
.content .sub{margin-top:12px;font-size:15px;color:#7d7a94;line-height:1.8;min-height:54px}
.card{margin-top:22px;height:148px;border-radius:20px;background:linear-gradient(135deg,#171726,#1e1e33);position:relative;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.45);border:1px solid rgba(150,130,255,.14)}
.card::before{content:"";position:absolute;left:22px;top:26px;width:36%;height:14px;border-radius:7px;background:rgba(170,150,255,.28)}
.card::after{content:"";position:absolute;left:22px;top:54px;width:62%;height:10px;border-radius:5px;background:rgba(170,150,255,.14);box-shadow:0 24px 0 rgba(170,150,255,.1)}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:150px;background:rgba(8,8,14,.96);border-top:1px solid rgba(150,130,255,.25);display:flex;justify-content:space-around;align-items:flex-start;padding:14px 6px 0}
.tab{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0;width:66px}
.orb{position:relative;width:60px;height:60px;display:flex;align-items:center;justify-content:center;color:#565670;transition:color .3s}
.orb svg{width:27px;height:27px;display:block;position:relative;z-index:2}
.tab.on .orb{color:#fff}
.tab.on .orb::before{content:"";position:absolute;inset:-9px;border-radius:50%;z-index:0;background:repeating-conic-gradient(from 0deg,#ff2fb3 0 12deg,#7b2ff7 12deg 24deg,#2fd8ff 24deg 36deg,#2fff9e 36deg 48deg,#ffe62f 48deg 60deg,#ff6a2f 60deg 72deg);animation:spin 9s linear infinite,hue 5s linear infinite;animation-delay:-4.5s,-2.5s;opacity:.95}
.tab.on .orb::after{content:"";position:absolute;inset:3px;border-radius:50%;z-index:1;background:#0a0a11;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes hue{from{filter:saturate(1.5) hue-rotate(0deg)}to{filter:saturate(1.5) hue-rotate(360deg)}}
.tlabel{font-size:12px;color:#565670;letter-spacing:3px;display:block}
.tab.on .tlabel{color:#e6dcff}
</style>
</head>
<body>
<div class="phone">
  <div class="content">
    <h1 id="ctitle">首页</h1>
    <p class="sub" id="csub">转一下镜筒，世界碎成好看的样子。</p>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
  </div>
  <nav class="tabbar" id="bar"></nav>
</div>
<script>
var ICONS=[
'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 3l9 8.5"/><path d="M5.5 10.5V21h5v-6h3v6h5V10.5"/></svg>',
'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5 13 13l-4.5 2.5L11 11z"/></svg>',
'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="9"/></svg>',
'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>',
'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-5.5 8-5.5s6.5 1.5 8 5.5"/></svg>'
];
var TABS=[
 {t:'首页',s:'转一下镜筒，世界碎成好看的样子。'},
 {t:'发现',s:'每一次转动，图案都不重样。'},
 {t:'灵感',s:'棱镜把光拆开，想法也是。'},
 {t:'消息',s:'碎片重新拼好，变成一句话。'},
 {t:'我的',s:'对称的美，藏着一点点任性。'}
];
var bar=document.getElementById('bar');
TABS.forEach(function(tb,i){
  var b=document.createElement('button');b.className='tab';b.setAttribute('aria-label',tb.t);
  b.innerHTML='<span class="orb">'+ICONS[i]+'</span><span class="tlabel">'+tb.t+'</span>';
  b.addEventListener('click',function(){select(i);});
  bar.appendChild(b);
});
var tabs=Array.prototype.slice.call(bar.querySelectorAll('.tab'));
var ctitle=document.getElementById('ctitle'),csub=document.getElementById('csub');
function select(k){
  k=Math.max(0,Math.min(k,TABS.length-1));
  tabs.forEach(function(t,i){t.classList.toggle('on',i===k);});
  ctitle.textContent=TABS[k].t;csub.textContent=TABS[k].s;
  try{history.replaceState(null,'','?tab='+k);}catch(e){}
}
var start=parseInt(new URLSearchParams(location.search).get('tab'),10);
if(isNaN(start)||start<0||start>=TABS.length)start=0;
select(start);
</script>
</body>
</html>
