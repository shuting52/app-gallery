<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>声波律动 · 底部栏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{display:flex;align-items:center;justify-content:center;background:#050508;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
.phone{width:430px;height:900px;max-width:100vw;max-height:100vh;border-radius:44px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:linear-gradient(180deg,#0c0c18 0%,#080812 60%,#05050c 100%)}
.wave{position:absolute;left:0;right:0;height:120px;pointer-events:none;opacity:.5}
.wave.w1{top:150px;background:repeating-linear-gradient(90deg,transparent 0 14px,rgba(34,211,238,.14) 14px 16px);mask:radial-gradient(ellipse at center,black 30%,transparent 75%);-webkit-mask:radial-gradient(ellipse at center,black 30%,transparent 75%)}
.wave.w2{top:330px;background:repeating-linear-gradient(90deg,transparent 0 10px,rgba(232,80,180,.12) 10px 12px);mask:radial-gradient(ellipse at center,black 30%,transparent 75%);-webkit-mask:radial-gradient(ellipse at center,black 30%,transparent 75%)}
.content{flex:1;padding:64px 26px 20px;position:relative;z-index:1}
.kicker{font-size:12px;letter-spacing:4px;color:#3ec6dd;margin-bottom:10px}
h1{font-size:32px;font-weight:700;color:#f2f4ff;margin-bottom:24px;text-shadow:0 0 24px rgba(34,211,238,.35)}
.card{background:rgba(30,32,58,.55);border:1px solid rgba(80,120,220,.25);border-radius:18px;min-height:112px;margin-bottom:14px;display:flex;align-items:center;justify-content:center;color:#8f97c9;font-size:14px;letter-spacing:2px}
.tabbar{position:relative;display:flex;height:104px;padding:10px 6px 24px;background:rgba(8,8,16,.92);border-top:1px solid rgba(34,211,238,.25);z-index:2}
.tab{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#7b82a3;font-family:inherit;opacity:.35;transition:opacity .3s,color .3s}
.tab svg{width:24px;height:24px;display:block}
.eq{display:flex;align-items:flex-end;gap:3px;height:16px}
.eq i{display:block;width:3px;border-radius:2px;background:linear-gradient(180deg,#e850b4,#22d3ee);transform-origin:bottom;transform:scaleY(.3)}
.tab span{font-size:11px;display:block;letter-spacing:1px}
.tab.active{opacity:1;color:#22d3ee}
.tab.active svg{filter:drop-shadow(0 0 8px rgba(34,211,238,.8))}
.tab.active span{color:#fff}
.tab.active .eq i{animation:eqb 1s ease-in-out infinite}
.tab.active .eq i:nth-child(1){height:9px;animation-delay:-.15s}
.tab.active .eq i:nth-child(2){height:15px;animation-delay:-.55s}
.tab.active .eq i:nth-child(3){height:11px;animation-delay:-.85s}
.tab.active .eq i:nth-child(4){height:16px;animation-delay:-.35s}
.tab.active .eq i:nth-child(5){height:8px;animation-delay:-.7s}
@keyframes eqb{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
</style>
</head>
<body>
<div class="phone">
  <div class="wave w1"></div><div class="wave w2"></div>
  <div class="content">
    <div class="kicker">BASS LINE</div>
    <h1 id="ctitle">午夜电台</h1>
    <div class="card">低频 · 占位卡片一</div>
    <div class="card">混音 · 占位卡片二</div>
    <div class="card">节拍 · 占位卡片三</div>
  </div>
  <nav class="tabbar">
    <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 9.5V20h12V9.5"/></svg><i class="eq"><i></i><i></i><i></i><i></i><i></i></i><span>首页</span></button>
    <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg><i class="eq"><i></i><i></i><i></i><i></i><i></i></i><span>发现</span></button>
    <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8"/></svg><i class="eq"><i></i><i></i><i></i><i></i><i></i></i><span>电台</span></button>
    <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4V6z"/></svg><i class="eq"><i></i><i></i><i></i><i></i><i></i></i><span>消息</span></button>
    <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><i class="eq"><i></i><i></i><i></i><i></i><i></i></i><span>我的</span></button>
  </nav>
</div>
<script>
const T=[{t:'首页',h:'午夜电台'},{t:'发现',h:'声浪发现'},{t:'电台',h:'直播电台'},{t:'消息',h:'私信节拍'},{t:'我的',h:'我的歌单'}];
const btns=[...document.querySelectorAll('.tab')];
const h1=document.getElementById('ctitle');
function act(k){
  k=Math.max(0,Math.min(T.length-1,k));
  btns.forEach((b,i)=>b.classList.toggle('active',i===k));
  h1.textContent=T[k].h;
  try{history.replaceState(null,'','?tab='+k)}catch(e){}
}
btns.forEach((b,i)=>b.addEventListener('click',()=>act(i)));
let k=parseInt(new URLSearchParams(location.search).get('tab'),10);
if(isNaN(k))k=0;
act(k);
</script>
</body>
</html>
