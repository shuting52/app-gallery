<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>沙画流痕 · 底部栏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{display:flex;align-items:center;justify-content:center;background:#141210;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
.phone{width:430px;height:900px;max-width:100vw;max-height:100vh;border-radius:44px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:linear-gradient(180deg,#fdf7ec 0%,#f9ecd4 55%,#f2ddba 100%)}
.sun{position:absolute;top:70px;right:56px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,#ffe9bd 0%,rgba(255,214,140,.55) 45%,transparent 70%);pointer-events:none}
.content{flex:1;padding:64px 26px 20px;position:relative;z-index:1}
.kicker{font-size:12px;letter-spacing:4px;color:#b98d55;margin-bottom:10px}
h1{font-size:32px;font-weight:700;color:#6d4a26;margin-bottom:24px}
.card{background:rgba(255,255,255,.62);border:1px solid rgba(196,148,84,.28);border-radius:18px;min-height:112px;margin-bottom:14px;display:flex;align-items:center;justify-content:center;color:#96703f;font-size:14px;letter-spacing:2px;box-shadow:0 8px 20px rgba(180,130,60,.12)}
.tabbar{position:relative;display:flex;height:96px;padding:10px 6px 22px;background:rgba(255,251,242,.94);border-top:1px solid rgba(196,148,84,.35);z-index:2}
.tab{flex:1;position:relative;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#a07c4c;font-family:inherit;transition:color .3s}
.tab svg{width:26px;height:26px;display:block}
.tab span{font-size:11px;display:block;letter-spacing:1px}
.tab.active{color:#b26a1c}
.sandpile{position:absolute;bottom:8px;left:50%;transform:translateX(-50%) scale(.5);width:44px;height:12px;border-radius:50%;background:radial-gradient(ellipse,rgba(233,185,106,.95) 0%,rgba(214,158,80,.55) 55%,transparent 75%);box-shadow:0 0 14px 4px rgba(233,185,106,.55);opacity:0;transition:opacity .4s,transform .4s;pointer-events:none}
.tab.active .sandpile{opacity:1;transform:translateX(-50%) scale(1)}
.grain{position:absolute;display:block;border-radius:50%;background:radial-gradient(circle,#f0c078 0%,#c07f2e 100%);opacity:.95;transform:translate(0,0);pointer-events:none;z-index:5}
</style>
</head>
<body>
<div class="phone">
  <div class="sun"></div>
  <div class="content">
    <div class="kicker">DESERT FLOW</div>
    <h1 id="ctitle">今日流沙</h1>
    <div class="card">暖阳 · 占位卡片一</div>
    <div class="card">微风 · 占位卡片二</div>
    <div class="card">沙丘 · 占位卡片三</div>
  </div>
  <nav class="tabbar" id="bar">
    <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 9.5V20h12V9.5"/></svg><span>首页</span><i class="sandpile"></i></button>
    <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg><span>市集</span><i class="sandpile"></i></button>
    <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>创作</span><i class="sandpile"></i></button>
    <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4V6z"/></svg><span>消息</span><i class="sandpile"></i></button>
    <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span>我的</span><i class="sandpile"></i></button>
  </nav>
</div>
<script>
const T=[{t:'首页',h:'今日流沙'},{t:'市集',h:'沙画市集'},{t:'创作',h:'开始创作'},{t:'消息',h:'消息流'},{t:'我的',h:'我的沙漏'}];
const bar=document.getElementById('bar');
const btns=[...bar.querySelectorAll('.tab')];
const h1=document.getElementById('ctitle');
function center(i){const b=btns[i].getBoundingClientRect(),r=bar.getBoundingClientRect();return{x:b.left-r.left+b.width/2,y:b.top-r.top+30};}
function flowSand(a,b){
  const A=center(a),B=center(b);
  for(let i=0;i<14;i++){
    const d=document.createElement('i');d.className='grain';
    const s=3+Math.random()*4;d.style.width=d.style.height=s+'px';
    d.style.left=(A.x+(Math.random()-.5)*40-s/2)+'px';
    d.style.top=(A.y+(Math.random()-.5)*22-s/2)+'px';
    bar.appendChild(d);
    const dx=B.x-A.x+(Math.random()-.5)*26,dy=B.y-A.y+(Math.random()-.5)*26;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      d.style.transition='transform .65s cubic-bezier(.3,.7,.4,1) '+(i*26)+'ms, opacity .35s ease '+(i*26+400)+'ms';
      d.style.transform='translate('+dx+'px,'+dy+'px)';
      d.style.opacity='0';
    }));
    setTimeout(()=>d.remove(),1700+i*26);
  }
}
function act(k,flow){
  k=Math.max(0,Math.min(T.length-1,k));
  const old=btns.findIndex(b=>b.classList.contains('active'));
  btns.forEach((b,i)=>b.classList.toggle('active',i===k));
  h1.textContent=T[k].h;
  if(flow&&old>-1&&old!==k)flow(old,k);
  try{history.replaceState(null,'','?tab='+k)}catch(e){}
}
btns.forEach((b,i)=>b.addEventListener('click',()=>act(i,flowSand)));
let k=parseInt(new URLSearchParams(location.search).get('tab'),10);
if(isNaN(k))k=0;
act(k,null);
</script>
</body>
</html>
