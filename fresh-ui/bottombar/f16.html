<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>流沙之漏 · 底部栏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#141416;display:flex;justify-content:center;align-items:flex-start;padding:0;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
.phone{width:430px;height:900px;border-radius:48px;overflow:hidden;position:relative;background:#131009;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 10px #0a0a0c,0 0 0 12px #3a3a3e;flex:none}
.content{padding:64px 28px 0}
.content h1{font-size:40px;letter-spacing:3px;color:#f0dfb2}
.content .sub{margin-top:12px;font-size:15px;color:#8d7c55;line-height:1.8;min-height:54px}
.card{margin-top:22px;height:148px;border-radius:20px;background:linear-gradient(135deg,#241c0e,#1a1409);position:relative;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.4);border:1px solid rgba(216,179,74,.14)}
.card::before{content:"";position:absolute;left:22px;top:26px;width:36%;height:14px;border-radius:7px;background:rgba(216,179,74,.28)}
.card::after{content:"";position:absolute;left:22px;top:54px;width:62%;height:10px;border-radius:5px;background:rgba(216,179,74,.14);box-shadow:0 24px 0 rgba(216,179,74,.1)}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:158px;background:#0b0906;border-top:1px solid rgba(216,179,74,.35);display:flex;justify-content:space-around;align-items:flex-start;padding:6px 8px 0}
.tab{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0;width:72px}
.cell{position:relative;width:72px;height:112px;display:flex;flex-direction:column;align-items:center;padding-top:14px}
.cell svg{width:27px;height:27px;display:block;color:#7d6c45;transition:color .3s,filter .3s}
.tab.on .cell svg{color:#f3d27a;filter:drop-shadow(0 0 8px rgba(243,210,122,.85))}
.tlabel{font-size:12px;color:#6f6142;letter-spacing:3px;display:block}
.tab.on .tlabel{color:#f3d27a}
.sand{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);width:36px;height:56px;display:none;pointer-events:none}
.tab.on .sand{display:block}
.drop{position:absolute;left:50%;top:2px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#f3d27a;display:block;animation:fall 1.5s linear infinite}
.drop:nth-child(1){animation-delay:0s}
.drop:nth-child(2){animation-delay:-.375s}
.drop:nth-child(3){animation-delay:-.75s}
.drop:nth-child(4){animation-delay:-1.125s}
@keyframes fall{0%{top:2px;opacity:0}18%{opacity:1}82%{opacity:1}100%{top:38px;opacity:0}}
.pile{position:absolute;bottom:0;left:3px;right:3px;height:0;border-radius:50% 50% 5px 5px;background:linear-gradient(180deg,#f6dd9a,#a8812f);animation:pilefill 6s linear both;display:block}
@keyframes pilefill{from{height:0}to{height:15px}}
</style>
</head>
<body>
<div class="phone">
  <div class="content">
    <h1 id="ctitle">首页</h1>
    <p class="sub" id="csub">时间是沙，漏下来就成了形状。</p>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
  </div>
  <nav class="tabbar" id="bar"></nav>
</div>
<script>
var ICONS=[
'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 3l9 8.5"/><path d="M5.5 10.5V21h5v-6h3v6h5V10.5"/></svg>',
'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5 13 13l-4.5 2.5L11 11z"/></svg>',
'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>',
'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-5.5 8-5.5s6.5 1.5 8 5.5"/></svg>'
];
var TABS=[
 {t:'首页',s:'时间是沙，漏下来就成了形状。'},
 {t:'发现',s:'细沙不断线，好奇心不断流。'},
 {t:'发布',s:'翻转一次，新的计时重新开始。'},
 {t:'消息',s:'每一粒沙落下，都是一声轻响。'},
 {t:'我的',s:'沙堆越积越高，日子有了分量。'}
];
var bar=document.getElementById('bar');
TABS.forEach(function(tb,i){
  var b=document.createElement('button');b.className='tab';b.setAttribute('aria-label',tb.t);
  b.innerHTML='<span class="cell">'+ICONS[i]+'<span class="sand"><i class="drop"></i><i class="drop"></i><i class="drop"></i><i class="drop"></i><i class="pile"></i></span></span><span class="tlabel">'+tb.t+'</span>';
  b.addEventListener('click',function(){select(i);});
  bar.appendChild(b);
});
var tabs=Array.prototype.slice.call(bar.querySelectorAll('.tab'));
var ctitle=document.getElementById('ctitle'),csub=document.getElementById('csub');
function select(k){
  k=Math.max(0,Math.min(k,TABS.length-1));
  tabs.forEach(function(t,i){t.classList.toggle('on',i===k);});
  ctitle.textContent=TABS[k].t;csub.textContent=TABS[k].s;
  try{history.replaceState(null,'','?tab='+k);}catch(e){}
}
var start=parseInt(new URLSearchParams(location.search).get('tab'),10);
if(isNaN(start)||start<0||start>=TABS.length)start=0;
select(start);
</script>
</body>
</html>
