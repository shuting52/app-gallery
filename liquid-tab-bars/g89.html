<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>棱镜分光</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;background:#07090d;display:flex;justify-content:center;color:#eef2f8}
.phone{width:430px;height:900px;position:relative;overflow:hidden;background:var(--bg,#0d1117)}
.hd{padding:54px 22px 10px;background:linear-gradient(180deg,var(--hd1,rgba(255,255,255,.08)),transparent)}
.hd h1{font-size:22px;letter-spacing:2px}
.hd p{font-size:12px;opacity:.55;margin-top:6px;letter-spacing:1px}
.bd{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.cardx{border-radius:16px;padding:16px;background:var(--cx,rgba(255,255,255,.05));border:1px solid var(--cb,rgba(255,255,255,.08))}
.sk{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--s1,rgba(255,255,255,.14)),var(--s2,rgba(255,255,255,.05)));margin:8px 0}
.sk.w60{width:60%}.sk.w80{width:80%}
.tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--tb,rgba(16,20,28,.92));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--tbd,rgba(255,255,255,.08));padding:10px 6px calc(22px + env(safe-area-inset-bottom))}
.tab{flex:1;background:none;border:0;color:var(--tc,#8b93a5);display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;cursor:pointer;font-family:inherit;position:relative;padding:6px 0}
.tab .ic{width:26px;height:26px;display:block}
.tab .ic svg{width:100%;height:100%;display:block}
.tab.on{color:var(--ac,#ffd479)}
.g89{--bg:#f0f2f8;--hd1:rgba(255,255,255,.7);--cx:rgba(255,255,255,.65);--cb:rgba(25,35,60,.09);--s1:rgba(25,35,60,.12);--s2:rgba(25,35,60,.04);--tb:rgba(255,255,255,.78);--tbd:rgba(25,35,60,.1);--tc:#9aa1b2;--ac:#ff2e63;}
.g89{color:#23262e}
.g89 .phone::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 100%,rgba(255,233,60,.16),transparent 55%),radial-gradient(circle at 50% 0%,rgba(0,194,255,.12),transparent 50%)}
.g89 .tabbar{left:18px;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));border-radius:26px;border:1px solid rgba(25,35,60,.1);padding:10px 4px;box-shadow:0 14px 32px rgba(40,50,90,.16),inset 0 1px 0 rgba(255,255,255,.7)}
.g89 .tab:nth-child(3){margin-top:-30px}
.g89 .tab:nth-child(3) .ic{width:54px;height:54px;border-radius:50%;background:conic-gradient(#ff2e63,#ff9f1c,#ffe93c,#3ddc84,#00c2ff,#7c5cff,#ff2e63);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 8px 22px rgba(255,80,140,.5),inset 0 2px 4px rgba(255,255,255,.5)}
.g89 .tab:nth-child(3) .ic svg{width:26px;height:26px}
.g89 .tab:nth-child(3).on .ic{animation:prism89 5s linear infinite}
@keyframes prism89{to{filter:hue-rotate(360deg)}}
.g89 .tab:nth-child(1).on{color:#ff2e63}.g89 .tab:nth-child(1).on .ic{filter:drop-shadow(0 0 7px rgba(255,46,99,.8))}
.g89 .tab:nth-child(2).on{color:#ff9f1c}.g89 .tab:nth-child(2).on .ic{filter:drop-shadow(0 0 7px rgba(255,159,28,.8))}
.g89 .tab:nth-child(4).on{color:#00a8ff}.g89 .tab:nth-child(4).on .ic{filter:drop-shadow(0 0 7px rgba(0,168,255,.8))}
.g89 .tab:nth-child(5).on{color:#12b76a}.g89 .tab:nth-child(5).on .ic{filter:drop-shadow(0 0 7px rgba(18,183,106,.8))}
.g89 .dot{position:absolute;top:6px;width:8px;height:8px;border-radius:50%;background:conic-gradient(#ff2e63,#ffe93c,#00c2ff,#7c5cff,#ff2e63);box-shadow:0 0 9px rgba(255,120,160,.8);opacity:0;transition:opacity .3s;display:block}
.g89 .tab.on .dot{opacity:1}</style></head>
<body class="g89"><div class="phone">
<div class="hd"><h1>新鲜 UI 画廊</h1><p>FRESH · BOTTOMBAR · 棱镜分光</p></div>
<div class="bd">
<div class="cardx"><div class="sk w60"></div><div class="sk"></div><div class="sk w80"></div></div>
<div class="cardx"><div class="sk w80"></div><div class="sk w60"></div></div>
<div class="cardx"><div class="sk"></div><div class="sk w60"></div><div class="sk w80"></div></div>
<div class="cardx"><div class="sk"></div><div class="sk w80"></div><div class="sk w60"></div></div>
</div>
<nav class="tabbar"></nav>
<script>
const nav=document.querySelector('.tabbar');
const LBL={home:'首页',find:'发现',pub:'发布',msg:'消息',me:'我的'};const IC={home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-5h-6v5H4z"/></svg>',find:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M15.5 8.5l-2.2 4.8-4.8 2.2 2.2-4.8z"/></svg>',msg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v10H9l-5 4z"/></svg>',me:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.2-4 4.2-6 8-6s6.8 2 8 6"/></svg>',pub:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'};
Object.keys(LBL).forEach(k=>{const b=document.createElement('button');b.className='tab';
b.innerHTML='<span class="ic">'+IC[k]+'</span><span>'+LBL[k]+'</span>';nav.appendChild(b);});
const tabs=[...document.querySelectorAll('.tab')];
let cur=0;
function act(i){cur=i;tabs.forEach((t,j)=>t.classList.toggle('on',i===j));}
const svgNS='http://www.w3.org/2000/svg';
tabs.forEach(t=>{const d=document.createElement('i');d.className='dot';t.prepend(d);});
tabs.forEach((t,i)=>t.addEventListener('click',()=>{act(i);try{history.replaceState(null,'','?tab='+i);}catch(e){}}));
(function(){const n=+new URLSearchParams(location.search).get('tab');
act(Number.isInteger(n)&&n>=0&&n<tabs.length?n:0);})();
</script>
</div></body></html>
