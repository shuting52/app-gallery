<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>橙焰中岛</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;background:#07090d;display:flex;justify-content:center;color:#eef2f8}
.phone{width:430px;height:900px;position:relative;overflow:hidden;background:var(--bg,#0d1117)}
.hd{padding:54px 22px 10px;background:linear-gradient(180deg,var(--hd1,rgba(255,255,255,.08)),transparent)}
.hd h1{font-size:22px;letter-spacing:2px}
.hd p{font-size:12px;opacity:.55;margin-top:6px;letter-spacing:1px}
.bd{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.cardx{border-radius:16px;padding:16px;background:var(--cx,rgba(255,255,255,.05));border:1px solid var(--cb,rgba(255,255,255,.08))}
.sk{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--s1,rgba(255,255,255,.14)),var(--s2,rgba(255,255,255,.05)));margin:8px 0}
.sk.w60{width:60%}.sk.w80{width:80%}
.tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--tb,rgba(16,20,28,.92));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--tbd,rgba(255,255,255,.08));padding:10px 6px calc(22px + env(safe-area-inset-bottom))}
.tab{flex:1;background:none;border:0;color:var(--tc,#8b93a5);display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;cursor:pointer;font-family:inherit;position:relative;padding:6px 0}
.tab .ic{width:26px;height:26px;display:block}
.tab .ic svg{width:100%;height:100%;display:block}
.tab.on{color:var(--ac,#ffd479)}

.g44{--bg:radial-gradient(120% 55% at 25% 0%,rgba(255,122,26,.12),transparent 60%),radial-gradient(100% 50% at 85% 30%,rgba(255,45,85,.08),transparent 60%),#0d0705;--hd1:rgba(255,122,26,.08)}
.g44 .tabbar{left:44px;right:44px;bottom:30px;border-radius:26px;background:rgba(26,14,8,.78);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid rgba(255,122,26,.35);box-shadow:0 14px 44px rgba(255,122,26,.20),inset 0 1px 0 rgba(255,255,255,.22);padding:26px 6px 12px;overflow:visible}
.g44 .tabbar .flame{position:absolute;top:-14px;left:0;width:200%;height:26px;pointer-events:none;opacity:.9}
.g44 .tabbar .flame path{fill:rgba(255,122,26,.30);filter:drop-shadow(0 0 8px rgba(255,122,26,.8))}
.g44 .tabbar .flame{animation:waveX 5s linear infinite;animation-delay:-2s}
@keyframes waveX{to{transform:translateX(-25%)}}
.g44 .tab{color:#8a6f5c}
.g44 .tab .dot{display:block;position:absolute;bottom:2px;left:50%;margin-left:-6px;width:12px;height:12px;background:#ff7a1a;border-radius:50% 4px 50% 50%;transform:rotate(45deg) scale(0);box-shadow:0 0 14px #ff7a1a;transition:transform .35s cubic-bezier(.34,1.8,.4,1)}
.g44 .tab.on{color:#ffb066}
.g44 .tab.on .dot{transform:rotate(45deg) scale(1)}
.g44 .tab.on .ic{filter:drop-shadow(0 0 8px #ff7a1a) drop-shadow(0 0 24px rgba(255,122,26,.55))}</style></head>
<body class="g44"><div class="phone">
<div class="hd"><h1>液态玻璃 · 底部栏</h1><p>LIQUID GLASS · TABBAR · 橙焰中岛</p></div>
<div class="bd">
<div class="cardx"><div class="sk w60"></div><div class="sk"></div><div class="sk w80"></div></div>
<div class="cardx"><div class="sk w80"></div><div class="sk w60"></div></div>
<div class="cardx"><div class="sk"></div><div class="sk w60"></div><div class="sk w80"></div></div>
<div class="cardx"><div class="sk"></div><div class="sk w80"></div><div class="sk w60"></div></div>
</div>
<nav class="tabbar"></nav>
<script>
const nav=document.querySelector('.tabbar');
const svgNS='http://www.w3.org/2000/svg';
const LBL={home:'首页',find:'发现',msg:'消息',me:'我的'};
const IC={home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-5h-6v5H4z"/></svg>',find:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M15.5 8.5l-2.2 4.8-4.8 2.2 2.2-4.8z"/></svg>',msg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v10H9l-5 4z"/></svg>',me:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.2-4 4.2-6 8-6s6.8 2 8 6"/></svg>'};
Object.keys(LBL).forEach(k=>{const b=document.createElement('button');b.className='tab';
b.innerHTML='<span class="ic">'+IC[k]+'</span><span class="lb">'+LBL[k]+'</span>';nav.appendChild(b);});
const fl=document.createElementNS(svgNS,'svg');fl.setAttribute('class','flame');
fl.setAttribute('viewBox','0 0 860 26');fl.setAttribute('preserveAspectRatio','none');
const fp=document.createElementNS(svgNS,'path');
fp.setAttribute('d','M0 18 Q27 6 54 18 T108 18 T162 18 T216 18 T270 18 T324 18 T378 18 T432 18 T486 18 T540 18 T594 18 T648 18 T702 18 T756 18 T810 18 T860 18 L860 26 L0 26 Z');
fl.appendChild(fp);nav.prepend(fl);
const tabs=[...document.querySelectorAll('.tab')];
let cur=0;
function act(i){cur=i;tabs.forEach((t,j)=>t.classList.toggle('on',i===j));}

tabs.forEach(t=>{const d=document.createElement('i');d.className='dot';t.prepend(d);});

tabs.forEach((t,i)=>t.addEventListener('click',()=>{act(i);try{history.replaceState(null,'','?tab='+i);}catch(e){}}));
(function(){const n=+new URLSearchParams(location.search).get('tab');
act(Number.isInteger(n)&&n>=0&&n<tabs.length?n:0);})();
</script>
</div></body></html>
