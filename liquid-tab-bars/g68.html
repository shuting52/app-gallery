<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>扫描线镜</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;background:#07090d;display:flex;justify-content:center;color:#eef2f8}
.phone{width:430px;height:900px;position:relative;overflow:hidden;background:var(--bg,#0d1117)}
.hd{padding:54px 22px 10px;background:linear-gradient(180deg,var(--hd1,rgba(255,255,255,.08)),transparent)}
.hd h1{font-size:22px;letter-spacing:2px}
.hd p{font-size:12px;opacity:.55;margin-top:6px;letter-spacing:1px}
.bd{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.cardx{border-radius:16px;padding:16px;background:var(--cx,rgba(255,255,255,.05));border:1px solid var(--cb,rgba(255,255,255,.08))}
.sk{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--s1,rgba(255,255,255,.14)),var(--s2,rgba(255,255,255,.05)));margin:8px 0}
.sk.w60{width:60%}.sk.w80{width:80%}
.tabbar{position:absolute;display:flex;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.tab{flex:1;background:none;border:0;color:var(--tc,#8b93a5);display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;cursor:pointer;font-family:inherit;position:relative;padding:6px 0}
.tab .ic{width:26px;height:26px;display:block}
.tab .ic svg{width:100%;height:100%;display:block}
.g68{--bg:#0a0812}

.g68 .tabbar{left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(52,44,72,.55),rgba(14,12,22,.9));border-top:1px solid rgba(167,139,250,.4);padding:12px 6px calc(24px + env(safe-area-inset-bottom));box-shadow:inset 0 1px 0 rgba(200,180,255,.3)}
.g68 .tabbar::before{content:"";position:absolute;top:-1px;left:-90px;width:90px;height:2px;background:linear-gradient(90deg,transparent,#a78bfa,#22d3ee,transparent);box-shadow:0 0 14px rgba(167,139,250,.9);animation:g68scan 4s linear infinite;animation-delay:-1.2s;pointer-events:none}
@keyframes g68scan{from{left:-90px}to{left:430px}}
.g68 .tabbar::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 42%,rgba(167,139,250,.22) 50%,transparent 58%);background-size:280% 100%;animation:g68sw 5.2s linear infinite;animation-delay:-2.8s}
@keyframes g68sw{to{background-position:-280% 0}}
.g68 .tab{color:#9890ac}
.g68 .tab.on{color:#e6dcff;text-shadow:0 0 12px rgba(167,139,250,.9)}
.g68 .tab.on .ic{filter:drop-shadow(0 0 8px rgba(34,211,238,.8))}
.g68 .dot{display:block;position:absolute;top:8px;left:50%;width:4px;height:22px;margin-left:-2px;border-radius:2px;background:linear-gradient(180deg,#22d3ee,#a78bfa);opacity:0;transition:opacity .3s;box-shadow:0 0 10px rgba(34,211,238,.9)}
.g68 .tab.on .dot{opacity:1;animation:g68blk 1.4s ease-in-out infinite;animation-delay:-.7s}
@keyframes g68blk{50%{transform:scaleY(1.35)}}
.g68 .glide{display:none}
</style></head>
<body class="g68"><div class="phone">
<div class="hd"><h1>新鲜 UI 画廊</h1><p>FRESH · BOTTOMBAR · 扫描线镜</p></div>
<div class="bd">
<div class="cardx"><div class="sk w60"></div><div class="sk"></div><div class="sk w80"></div></div>
<div class="cardx"><div class="sk w80"></div><div class="sk w60"></div></div>
<div class="cardx"><div class="sk"></div><div class="sk w60"></div><div class="sk w80"></div></div>
<div class="cardx"><div class="sk"></div><div class="sk w80"></div><div class="sk w60"></div></div>
</div>
<nav class="tabbar"></nav>
<script>
const nav=document.querySelector('.tabbar');
const LBL={home:'首页',find:'发现',msg:'消息',me:'我的'};
const IC={home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-5h-6v5H4z"/></svg>',find:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M15.5 8.5l-2.2 4.8-4.8 2.2 2.2-4.8z"/></svg>',msg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v10H9l-5 4z"/></svg>',me:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.2-4 4.2-6 8-6s6.8 2 8 6"/></svg>',post:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'};
Object.keys(LBL).forEach(k=>{const b=document.createElement('button');b.className='tab';b.dataset.k=k;
b.innerHTML='<span class="ic">'+IC[k]+'</span><span>'+LBL[k]+'</span>';nav.appendChild(b);});
const tabs=[...document.querySelectorAll('.tab')];
let cur=0;
const glide=document.createElement('i');glide.className='glide';nav.appendChild(glide);
function moveGlide(){const t=tabs[cur];if(!t)return;const nr=nav.getBoundingClientRect(),tr=t.getBoundingClientRect();glide.style.transform='translateX('+(tr.left-nr.left+tr.width/2)+'px)';}
function act(i){cur=i;tabs.forEach((t,j)=>t.classList.toggle('on',i===j));moveGlide();}
tabs.forEach(t=>{const d=document.createElement('i');d.className='dot';t.prepend(d);});
tabs.forEach((t,i)=>t.addEventListener('click',()=>{act(i);try{history.replaceState(null,'','?tab='+i);}catch(e){}}));
(function(){const n=+new URLSearchParams(location.search).get('tab');act(Number.isInteger(n)&&n>=0&&n<tabs.length?n:0);requestAnimationFrame(()=>{moveGlide();setTimeout(moveGlide,60);});window.addEventListener('resize',moveGlide);})();

</script>
</div></body></html>
