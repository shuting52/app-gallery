<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>火山</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#0b0d12;color:#f2f4f8;
min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:26px 14px}
.head{text-align:center;margin-bottom:18px}
.head .tag{display:inline-block;font-size:11px;letter-spacing:1px;padding:4px 12px;border-radius:99px;
background:rgba(138,180,255,.12);border:1px solid rgba(138,180,255,.35);color:#8ab4ff;margin-bottom:10px}
.head h1{font-size:21px;font-weight:800}
.head p{font-size:12px;color:#8b93a5;margin-top:6px}
.acc{display:flex;width:100%;max-width:430px;height:560px;gap:10px}
.item{position:relative;flex:1;border-radius:18px;overflow:hidden;cursor:pointer;min-width:0;
transition:flex .6s cubic-bezier(.22,1,.36,1)}
.item.active{flex:3.5}
.sc{position:absolute;inset:0;overflow:hidden}
.item::after{content:"";position:absolute;inset:0;pointer-events:none;
background:linear-gradient(to top,rgba(0,0,0,.72) 0%,rgba(0,0,0,.15) 45%,rgba(0,0,0,.05) 100%)}
.item .vt{position:absolute;left:0;right:0;bottom:24px;z-index:2;text-align:center;font-size:15px;font-weight:700;
letter-spacing:6px;writing-mode:vertical-rl;text-orientation:upright;white-space:nowrap;transition:opacity .3s}
.item.active .vt{opacity:0}
.item .ct{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:22px 20px;opacity:0;transform:translateY(14px);
transition:opacity .45s ease .15s,transform .45s ease .15s}
.item.active .ct{opacity:1;transform:none}
.item .ct .num{font-size:11px;letter-spacing:3px;color:#ffd479;margin-bottom:8px}
.item .ct h2{font-size:20px;font-weight:800;margin-bottom:7px}
.item .ct p{font-size:13px;line-height:1.7;color:#c9d1e0}
.foot{margin-top:18px;font-size:11px;color:#5b6373}

.cone{position:absolute;left:50%;bottom:8%;width:86%;height:52%;transform:translateX(-50%);
clip-path:polygon(34% 0,66% 0,100% 100%,0 100%);
background:linear-gradient(180deg,#57534e,#292524)}
.cone.sleep{background:linear-gradient(180deg,#e7e5e4 0%,#a8a29e 22%,#57534e 60%,#292524)}
.crater{position:absolute;left:50%;bottom:calc(8% + 52% - 14px);width:34%;height:16px;transform:translateX(-50%);
background:#1c1917;border-radius:50%}
.smoke{position:absolute;width:26px;height:26px;border-radius:50%;background:rgba(214,211,209,.85);
filter:blur(3px);opacity:0}
.item.active .smoke{animation:rise 3.2s ease-out infinite}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:.75}
100%{transform:translateY(-190px) translateX(26px) scale(1.7);opacity:0}}
.lava{position:absolute;left:50%;bottom:calc(8% + 52% - 10px);width:30%;height:150px;transform:translateX(-50%);
clip-path:polygon(42% 0,58% 0,78% 100%,22% 100%);
background:linear-gradient(180deg,#facc15,#f97316,#dc2626);opacity:0}
.item.active .lava{opacity:1;animation:glow 1.2s ease-in-out infinite}
@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.45)}}
.spark{position:absolute;width:7px;height:7px;border-radius:50%;background:#fb923c;
box-shadow:0 0 10px #f97316;opacity:0}
.item.active .spark{animation:spray var(--t) ease-out infinite;animation-delay:var(--d)}
@keyframes spray{0%{transform:translate(0,0) scale(1);opacity:1}
100%{transform:translate(var(--x),-170px) scale(.3);opacity:0}}
.ember{position:absolute;width:5px;height:5px;border-radius:50%;background:#f97316;
box-shadow:0 0 8px #f97316;opacity:0}
.item.active .ember{animation:blink 1.8s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.15}50%{opacity:1}}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.8}
</style></head><body>
<div class="head"><div class="tag">创意手风琴 · cr-11</div><h1>火山</h1><p>一座火山的四种状态：展开时烟、岩浆与火星依次登场</p></div>
<div class="acc" id="acc"><div class="item active"><div class="sc"><div style="position:absolute;inset:0;background:linear-gradient(180deg,#1e293b,#0f172a)"></div><div class="cone sleep"></div><div class="crater"></div><div class="star" style="left:18%;top:14%"></div><div class="star" style="left:70%;top:22%"></div><div class="star" style="left:42%;top:9%"></div><div class="star" style="left:85%;top:30%"></div></div><div class="vt">沉睡</div><div class="ct"><div class="num">01 / 04</div><h2>沉睡</h2><p>雪顶之下，岩浆在深处安静地睡着。</p></div></div><div class="item"><div class="sc"><div style="position:absolute;inset:0;background:linear-gradient(180deg,#334155,#1c1917)"></div><div class="cone"></div><div class="crater"></div><div class="smoke" style="left:42%;bottom:58%;animation-delay:0s"></div><div class="smoke" style="left:50%;bottom:58%;animation-delay:1.1s"></div><div class="smoke" style="left:58%;bottom:58%;animation-delay:2s"></div></div><div class="vt">冒烟</div><div class="ct"><div class="num">02 / 04</div><h2>冒烟</h2><p>火山口飘起灰烟，山体开始低鸣。</p></div></div><div class="item"><div class="sc"><div style="position:absolute;inset:0;background:linear-gradient(180deg,#450a0a,#1c1917)"></div><div class="cone"></div><div class="crater"></div><div class="lava"></div><div class="spark" style="left:44%;bottom:58%;--x:12px;--t:1.96s;--d:0.47s"></div><div class="spark" style="left:53%;bottom:58%;--x:-52px;--t:1.86s;--d:0.11s"></div><div class="spark" style="left:45%;bottom:58%;--x:-56px;--t:1.93s;--d:0.26s"></div><div class="spark" style="left:52%;bottom:58%;--x:41px;--t:1.53s;--d:0.29s"></div><div class="spark" style="left:47%;bottom:58%;--x:38px;--t:1.25s;--d:0.68s"></div><div class="spark" style="left:47%;bottom:58%;--x:-55px;--t:1.66s;--d:0.48s"></div><div class="spark" style="left:50%;bottom:58%;--x:-59px;--t:1.65s;--d:0.16s"></div><div class="spark" style="left:52%;bottom:58%;--x:-34px;--t:1.63s;--d:0.69s"></div><div class="spark" style="left:47%;bottom:58%;--x:-24px;--t:1.28s;--d:0.69s"></div><div class="spark" style="left:53%;bottom:58%;--x:25px;--t:1.28s;--d:0.85s"></div><div class="spark" style="left:52%;bottom:58%;--x:-55px;--t:1.7s;--d:0.6s"></div><div class="spark" style="left:51%;bottom:58%;--x:39px;--t:1.82s;--d:0.56s"></div></div><div class="vt">喷发</div><div class="ct"><div class="num">03 / 04</div><h2>喷发</h2><p>岩浆冲上夜空，火星像一场倒流的雨。</p></div></div><div class="item"><div class="sc"><div style="position:absolute;inset:0;background:linear-gradient(180deg,#292524,#0c0a09)"></div><div class="cone"></div><div class="crater"></div><div class="lava" style="background:linear-gradient(180deg,#7f1d1d,#450a0a);animation:none"></div><div class="ember" style="left:38%;bottom:52%;animation-delay:0s"></div><div class="ember" style="left:55%;bottom:44%;animation-delay:.7s"></div><div class="ember" style="left:48%;bottom:36%;animation-delay:1.2s"></div><div class="ember" style="left:62%;bottom:58%;animation-delay:.4s"></div></div><div class="vt">冷却</div><div class="ct"><div class="num">04 / 04</div><h2>冷却</h2><p>熔岩凝成黑岩，只剩零星火星未眠。</p></div></div></div>
<div class="foot">创意手风琴 · 悬停或点按展开</div>
<script>
var acc=document.getElementById('acc'),items=acc.querySelectorAll('.item'),cur=0;
function act(i){items[cur].classList.remove('active');cur=i;items[cur].classList.add('active');}
items.forEach(function(it,i){it.addEventListener('mouseenter',function(){act(i);});
it.addEventListener('click',function(){act(i);});});
</script></body></html>
