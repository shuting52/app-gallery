<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>盲盒开箱 · 创意手风琴</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#221a12;color:#f2f4f8;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:26px 14px}
.head{text-align:center;margin-bottom:16px}
.head .tag{display:inline-block;font-size:11px;letter-spacing:1px;padding:4px 12px;border-radius:99px;background:rgba(217,177,129,.15);border:1px solid rgba(217,177,129,.5);color:#e8c795;margin-bottom:10px}
.head h1{font-size:22px;font-weight:800}
.head p{font-size:12px;color:#8b93a5;margin-top:6px}
.reset{margin-bottom:16px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;font-size:13px;padding:10px 20px;border-radius:99px;cursor:pointer}
.reset:active{transform:scale(.96)}
.acc{display:flex;width:100%;max-width:430px;height:540px;gap:10px}
.item{position:relative;flex:1;border-radius:18px;overflow:hidden;cursor:pointer;min-width:0;transition:flex .6s cubic-bezier(.22,1,.36,1)}
.item.active{flex:3.5}
.vt{position:absolute;z-index:4;left:0;right:0;bottom:20px;text-align:center;font-size:14px;font-weight:800;letter-spacing:3px;color:#5b3a1a;writing-mode:vertical-rl;text-orientation:upright;white-space:nowrap;transition:opacity .3s}
.item.active .vt{opacity:0}
.inner{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(180deg,#fdf6e3,#f3e2b8);opacity:0;transform:scale(.82);transition:opacity .5s ease .2s,transform .5s ease .2s}
.item.opened .inner{opacity:1;transform:scale(1)}
.inner .label{font-size:14px;font-weight:800;color:#5b3a1a}
.inner .sub{font-size:11px;color:#8a6a45;margin-top:-8px}
.seal{position:absolute;inset:0;z-index:2;background-color:#d9b183;background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.03) 0 6px,transparent 6px 12px);transition:opacity .45s ease,transform .45s ease}
.item.opened .seal{opacity:0;transform:scale(.92);pointer-events:none}
.seal .q{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:54px;font-weight:900;color:#7a5230}
.seal .tape{position:absolute;left:0;right:0;top:52%;height:22px;background:rgba(255,255,255,.42);transform:rotate(-2deg)}
.lid{position:absolute;left:0;right:0;top:0;height:46%;z-index:3;background-color:#c99e6b;background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.03) 0 6px,transparent 6px 12px);clip-path:polygon(0 0,100% 0,100% 86%,93% 100%,85% 86%,76% 100%,68% 86%,59% 100%,50% 86%,41% 100%,32% 86%,24% 100%,15% 86%,7% 100%,0 86%);transition:transform .6s cubic-bezier(.3,1.2,.4,1),opacity .5s ease}
.lid .tape2{position:absolute;left:50%;top:16px;transform:translateX(-50%) rotate(-3deg);width:70%;height:20px;background:rgba(255,255,255,.45)}
.item.opened .lid{transform:translateY(-115%) rotate(-16deg);opacity:0;pointer-events:none}
.hint{position:absolute;z-index:2;left:0;right:0;bottom:16px;text-align:center;font-size:11px;color:#7a5230;transition:opacity .3s}
.item.opened .hint{opacity:0}
.ct{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:16px;text-align:center;opacity:0;transform:translateY(10px);transition:opacity .4s ease .35s,transform .4s ease .35s}
.item.opened .ct{opacity:1;transform:none}
.ct b{font-size:15px;color:#5b3a1a}
.ct p{font-size:11px;color:#8a6a45;margin-top:4px}
/* ---- 内含小场景（纯 CSS） ---- */
.plant{position:relative;width:110px;height:110px}
.pot{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:74px;height:52px;background:#c96f4a;clip-path:polygon(0 0,100% 0,86% 100%,14% 100%)}
.pot::after{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:#a85a3a}
.leaf{position:absolute;bottom:44px;width:34px;height:52px;background:#3e9b5f;border-radius:50%}
.leaf.l1{left:22px;transform:rotate(-28deg)}
.leaf.l2{left:50%;transform:translateX(-50%);bottom:52px;background:#55b877}
.leaf.l3{right:22px;transform:rotate(28deg)}
.car{position:relative;width:140px;height:84px}
.car-body{position:absolute;left:0;bottom:14px;width:140px;height:34px;background:#e23b3b;border-radius:16px 16px 10px 10px}
.car-top{position:absolute;left:28px;bottom:44px;width:76px;height:30px;background:#e23b3b;border-radius:16px 16px 0 0}
.car-win{position:absolute;left:40px;bottom:50px;width:52px;height:20px;background:#bfe6f5;border-radius:6px}
.wheel{position:absolute;bottom:0;width:30px;height:30px;background:#1a1a1a;border-radius:50%}
.wheel::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:12px;height:12px;background:#d7dce8;border-radius:50%}
.wheel.l{left:18px}.wheel.r{right:18px}
.balloon{position:relative;width:110px;height:130px}
.b-body{position:absolute;left:50%;top:0;transform:translateX(-50%);width:88px;height:100px;background:radial-gradient(circle at 35% 30%,#ff9ecb,#e23b8a);border-radius:50%}
.b-knot{position:absolute;left:50%;top:98px;transform:translateX(-50%);width:14px;height:12px;background:#e23b8a;clip-path:polygon(50% 0,0 100%,100% 100%)}
.b-string{position:absolute;left:50%;top:110px;transform:translateX(-50%);width:2px;height:20px;background:#8a6a45}
.cat{position:relative;width:110px;height:104px}
.cat-head{position:absolute;left:50%;top:0;transform:translateX(-50%);width:62px;height:56px;background:#1a1a1a;border-radius:50%}
.cat-ear{position:absolute;top:-8px;width:22px;height:24px;background:#1a1a1a;clip-path:polygon(50% 0,0 100%,100% 100%)}
.cat-ear.l{left:26px;transform:rotate(-10deg)}
.cat-ear.r{right:26px;transform:rotate(10deg)}
.cat-eye{position:absolute;top:22px;width:7px;height:7px;background:#ffd166;border-radius:50%}
.cat-eye.l{left:42px}.cat-eye.r{right:42px}
.cat-body{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:72px;height:46px;background:#1a1a1a;border-radius:50%}
.cat-tail{position:absolute;right:-2px;bottom:6px;width:46px;height:40px;border:9px solid #1a1a1a;border-left:none;border-bottom:none;border-radius:0 50% 0 0}
.foot{margin-top:18px;font-size:11px;color:#5b6373}
</style>
</head>
<body>
<div class="head"><div class="tag">创意手风琴 · CR-07</div><h1>盲盒开箱</h1><p>点面板展开并撕开盒子，看看里面藏着什么</p></div>
<button class="reset" id="reset">↺ 全部重新封好</button>
<div class="acc" id="acc">
  <div class="item active">
    <div class="inner"><div class="plant"><div class="leaf l1"></div><div class="leaf l2"></div><div class="leaf l3"></div><div class="pot"></div></div><div class="label">小多肉</div><div class="sub">不用浇太多水，也能长得很好</div></div>
    <div class="seal"><div class="q">?</div><div class="tape"></div></div>
    <div class="lid"><div class="tape2"></div></div>
    <div class="vt">盲盒 01</div><div class="hint">点按开箱</div>
    <div class="ct"><b>开出：小多肉</b><p>隐藏款概率 1 / 144，你抽中了它</p></div>
  </div>
  <div class="item">
    <div class="inner"><div class="car"><div class="car-top"></div><div class="car-win"></div><div class="car-body"></div><div class="wheel l"></div><div class="wheel r"></div></div><div class="label">小赛车</div><div class="sub">一推就跑，客厅就是赛道</div></div>
    <div class="seal"><div class="q">?</div><div class="tape"></div></div>
    <div class="lid"><div class="tape2"></div></div>
    <div class="vt">盲盒 02</div><div class="hint">点按开箱</div>
    <div class="ct"><b>开出：小赛车</b><p>红色车身，轮子转得飞快</p></div>
  </div>
  <div class="item">
    <div class="inner"><div class="balloon"><div class="b-body"></div><div class="b-knot"></div><div class="b-string"></div></div><div class="label">粉气球</div><div class="sub">抓紧线，别让它飞走</div></div>
    <div class="seal"><div class="q">?</div><div class="tape"></div></div>
    <div class="lid"><div class="tape2"></div></div>
    <div class="vt">盲盒 03</div><div class="hint">点按开箱</div>
    <div class="ct"><b>开出：粉气球</b><p>轻轻一放，它就想往天上飘</p></div>
  </div>
  <div class="item">
    <div class="inner"><div class="cat"><div class="cat-ear l"></div><div class="cat-ear r"></div><div class="cat-head"></div><div class="cat-eye l"></div><div class="cat-eye r"></div><div class="cat-body"></div><div class="cat-tail"></div></div><div class="label">黑猫</div><div class="sub">高冷，但允许你摸一下</div></div>
    <div class="seal"><div class="q">?</div><div class="tape"></div></div>
    <div class="lid"><div class="tape2"></div></div>
    <div class="vt">盲盒 04</div><div class="hint">点按开箱</div>
    <div class="ct"><b>开出：黑猫</b><p>隐藏款！它正用金眼睛看着你</p></div>
  </div>
</div>
<div class="foot">手风琴结构对标 №324 · 盒盖 clip-path 锯齿撕口 + translateY 翻开</div>
<script>
var acc=document.getElementById('acc'),items=acc.querySelectorAll('.item'),cur=0;
function act(i){items[cur].classList.remove('active');cur=i;items[cur].classList.add('active');}
items.forEach(function(it,i){
  it.addEventListener('mouseenter',function(){act(i);});
  it.addEventListener('click',function(){act(i);it.classList.add('opened');});
});
document.getElementById('reset').addEventListener('click',function(){
  items.forEach(function(it){it.classList.remove('opened');});
});
</script>
</body>
</html>
