<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>种子生长</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#0b0d12;color:#f2f4f8;
min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:26px 14px}
.head{text-align:center;margin-bottom:18px}
.head .tag{display:inline-block;font-size:11px;letter-spacing:1px;padding:4px 12px;border-radius:99px;
background:rgba(138,180,255,.12);border:1px solid rgba(138,180,255,.35);color:#8ab4ff;margin-bottom:10px}
.head h1{font-size:21px;font-weight:800}
.head p{font-size:12px;color:#8b93a5;margin-top:6px}
.acc{display:flex;width:100%;max-width:430px;height:560px;gap:10px}
.item{position:relative;flex:1;border-radius:18px;overflow:hidden;cursor:pointer;min-width:0;
transition:flex .6s cubic-bezier(.22,1,.36,1)}
.item.active{flex:3.5}
.sc{position:absolute;inset:0;overflow:hidden}
.item::after{content:"";position:absolute;inset:0;pointer-events:none;
background:linear-gradient(to top,rgba(0,0,0,.72) 0%,rgba(0,0,0,.15) 45%,rgba(0,0,0,.05) 100%)}
.item .vt{position:absolute;left:0;right:0;bottom:24px;z-index:2;text-align:center;font-size:15px;font-weight:700;
letter-spacing:6px;writing-mode:vertical-rl;text-orientation:upright;white-space:nowrap;transition:opacity .3s}
.item.active .vt{opacity:0}
.item .ct{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:22px 20px;opacity:0;transform:translateY(14px);
transition:opacity .45s ease .15s,transform .45s ease .15s}
.item.active .ct{opacity:1;transform:none}
.item .ct .num{font-size:11px;letter-spacing:3px;color:#ffd479;margin-bottom:8px}
.item .ct h2{font-size:20px;font-weight:800;margin-bottom:7px}
.item .ct p{font-size:13px;line-height:1.7;color:#c9d1e0}
.foot{margin-top:18px;font-size:11px;color:#5b6373}

.soil{position:absolute;left:-10%;right:-10%;bottom:0;height:34px;background:linear-gradient(180deg,#8b5a2b,#5b3a17);
border-radius:50% 50% 0 0}
.plant{position:absolute;left:50%;bottom:30px;width:130px;height:280px;transform:translateX(-50%) scaleY(.15);
transform-origin:bottom center;opacity:0}
.item.active .plant{animation:grow 1.2s cubic-bezier(.2,.8,.3,1.15) forwards}
@keyframes grow{to{transform:translateX(-50%) scaleY(1);opacity:1}}
.stem{position:absolute;left:50%;bottom:0;width:6px;height:100%;transform:translateX(-50%);
background:linear-gradient(180deg,#4ade80,#15803d);border-radius:3px}
.leaf{position:absolute;width:42px;height:24px;background:#22c55e;border-radius:50% 50% 50% 0;opacity:0}
.leaf.l{left:calc(50% - 46px);transform:rotate(-32deg)}
.leaf.r{left:calc(50% + 4px);transform:rotate(32deg) scaleX(-1)}
.item.active .leaf{animation:pop .5s forwards}
@keyframes pop{from{opacity:0;transform:scale(.3) rotate(-32deg)}to{opacity:1}}
.seed{position:absolute;left:50%;bottom:4px;width:32px;height:22px;transform:translateX(-50%);
background:#7c2d12;border-radius:50%;box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),inset 3px 3px 0 rgba(255,255,255,.25)}
.petal{position:absolute;width:26px;height:26px;border-radius:50%;background:#f9a8d4;
border:2px solid #f472b6;opacity:0}
.item.active .petal{animation:pop2 .5s forwards}
@keyframes pop2{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
.center{position:absolute;width:26px;height:26px;border-radius:50%;background:#facc15;
border:2px solid #eab308;left:50%;top:26px;transform:translateX(-50%);opacity:0}
.item.active .center{animation:pop2 .5s forwards;animation-delay:1.15s}
.fruit{position:absolute;width:24px;height:24px;border-radius:50%;background:#ef4444;
border:2px solid #b91c1c;box-shadow:0 3px 8px rgba(0,0,0,.3);opacity:0}
.item.active .fruit{animation:drop .6s forwards}
@keyframes drop{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:translateY(0)}}

.item .ct h2{color:#1f2937}.item .ct p{color:#4b5563}.item .ct .num{color:#b45309}
.item .vt{color:#1f2937}.item::after{background:linear-gradient(to top,rgba(255,255,255,.75),rgba(255,255,255,0) 55%)}
</style></head><body>
<div class="head"><div class="tag">创意手风琴 · cr-10</div><h1>种子生长</h1><p>从一颗种子到满枝果实：展开时植物从下往上长出来</p></div>
<div class="acc" id="acc"><div class="item active"><div class="sc"><div style="position:absolute;inset:0;background:linear-gradient(180deg,#fef3c7,#fde68a)"></div><div class="plant"><div class="seed"></div></div><div class="soil"></div></div><div class="vt">种子</div><div class="ct"><div class="num">01 / 04</div><h2>种子</h2><p>一颗种子躺进泥土，等待一场雨。</p></div></div><div class="item"><div class="sc"><div style="position:absolute;inset:0;background:linear-gradient(180deg,#dcfce7,#bbf7d0)"></div><div class="plant"><div class="stem" style="height:150px"></div><div class="leaf l" style="bottom:60px;animation-delay:.7s"></div><div class="leaf r" style="bottom:95px;animation-delay:.9s"></div></div><div class="soil"></div></div><div class="vt">发芽</div><div class="ct"><div class="num">02 / 04</div><h2>发芽</h2><p>嫩茎顶破土面，两片小叶展开。</p></div></div><div class="item"><div class="sc"><div style="position:absolute;inset:0;background:linear-gradient(180deg,#fce7f3,#fbcfe8)"></div><div class="plant"><div class="stem" style="height:230px"></div><div class="leaf l" style="bottom:60px;animation-delay:.7s"></div><div class="leaf r" style="bottom:95px;animation-delay:.9s"></div><div class="petal" style="left:52px;top:3px;animation-delay:1.00s"></div><div class="petal" style="left:81px;top:20px;animation-delay:1.08s"></div><div class="petal" style="left:81px;top:54px;animation-delay:1.16s"></div><div class="petal" style="left:52px;top:71px;animation-delay:1.24s"></div><div class="petal" style="left:23px;top:54px;animation-delay:1.32s"></div><div class="petal" style="left:23px;top:20px;animation-delay:1.40s"></div><div class="center"></div></div><div class="soil"></div></div><div class="vt">开花</div><div class="ct"><div class="num">03 / 04</div><h2>开花</h2><p>六片花瓣围成一圈，迎来第一只蜂。</p></div></div><div class="item"><div class="sc"><div style="position:absolute;inset:0;background:linear-gradient(180deg,#ffedd5,#fed7aa)"></div><div class="plant"><div class="stem" style="height:250px"></div><div class="leaf l" style="bottom:60px;animation-delay:.7s"></div><div class="leaf r" style="bottom:95px;animation-delay:.9s"></div><div class="leaf l" style="bottom:120px;animation-delay:.7s"></div><div class="leaf r" style="bottom:160px;animation-delay:.9s"></div><div class="fruit" style="left:22px;top:60px;animation-delay:1.1s"></div><div class="fruit" style="left:84px;top:88px;animation-delay:1.25s"></div><div class="fruit" style="left:52px;top:38px;animation-delay:1.4s;background:#f97316;border-color:#c2410c"></div></div><div class="soil"></div></div><div class="vt">结果</div><div class="ct"><div class="num">04 / 04</div><h2>结果</h2><p>果实坠弯枝头，秋天有了回音。</p></div></div></div>
<div class="foot">创意手风琴 · 悬停或点按展开</div>
<script>
var acc=document.getElementById('acc'),items=acc.querySelectorAll('.item'),cur=0;
function act(i){items[cur].classList.remove('active');cur=i;items[cur].classList.add('active');}
items.forEach(function(it,i){it.addEventListener('mouseenter',function(){act(i);});
it.addEventListener('click',function(){act(i);});});
</script></body></html>
