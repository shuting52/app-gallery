<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>液态玻璃开关</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;
background:radial-gradient(120% 90% at 50% 0%,#1c2a44 0%,#0b1220 55%,#060a14 100%);
color:#eef3fa;display:flex;align-items:center;justify-content:center;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.75;animation:drift 9s ease-in-out infinite alternate}
.b1{width:280px;height:280px;background:#5aa9ff;left:-60px;top:-40px}
.b2{width:240px;height:240px;background:#ff9ecb;right:-50px;top:30%;animation-delay:-3s}
.b3{width:220px;height:220px;background:#ffd166;left:30%;bottom:-70px;animation-delay:-6s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(30px,24px) scale(1.12)}}
.glass{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.08));
-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);
border:1px solid rgba(255,255,255,.38);border-radius:26px;
box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.12)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
background:linear-gradient(115deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 42%)}
.tag{position:absolute;top:18px;left:18px;font-size:11px;color:#9fb3d1;letter-spacing:1px}
h2{font-size:20px;margin-bottom:6px}p{font-size:13px;color:#c6d4e8;line-height:1.7}
.panel{width:300px;padding:30px 26px}
.swrow{display:flex;align-items:center;gap:14px;margin-top:20px;font-size:14px}
.sw{width:62px;height:34px;border-radius:999px;position:relative;cursor:pointer;flex:none;
background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);
-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 2px 8px rgba(0,0,0,.25);transition:background .3s,box-shadow .3s}
.sw .knob{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;
background:linear-gradient(135deg,#fff,#dbe7f5);box-shadow:0 3px 10px rgba(0,0,0,.4),inset 0 1px 0 #fff;
transition:left .32s cubic-bezier(.34,1.56,.64,1)}
.sw.on{background:rgba(90,169,255,.45);box-shadow:0 0 18px rgba(90,169,255,.65),inset 0 1px 0 rgba(255,255,255,.5);animation:breathe 2.4s ease-in-out infinite}
.sw.on .knob{left:31px}
@keyframes breathe{0%,100%{box-shadow:0 0 12px rgba(90,169,255,.5),inset 0 1px 0 rgba(255,255,255,.5)}50%{box-shadow:0 0 26px rgba(90,169,255,.85),inset 0 1px 0 rgba(255,255,255,.5)}}</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<span class="tag">LIQUID GLASS · 复刻</span>
<div class="glass panel"><h2>液态玻璃开关</h2><p>点按切换，旋钮弹簧滑过玻璃轨道，开启时整条轨道泛起辉光。</p>
<div class="swrow"><div class="sw on" id="sw1"><div class="knob"></div></div><span>夜间模式</span></div>
<div class="swrow"><div class="sw" id="sw2"><div class="knob"></div></div><span>自动同步</span></div></div>
<script>document.querySelectorAll('.sw').forEach(function(s){s.addEventListener('click',function(){s.classList.toggle('on');});});</script></body></html>
