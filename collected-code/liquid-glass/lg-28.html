<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>液态玻璃 Toast 提示</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;
background:radial-gradient(120% 90% at 50% 0%,#1c2a44 0%,#0b1220 55%,#060a14 100%);
color:#eef3fa;display:flex;align-items:center;justify-content:center;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.75;animation:drift 9s ease-in-out infinite alternate}
.b1{width:280px;height:280px;background:#5aa9ff;left:-60px;top:-40px}
.b2{width:240px;height:240px;background:#ff9ecb;right:-50px;top:30%;animation-delay:-3s}
.b3{width:220px;height:220px;background:#ffd166;left:30%;bottom:-70px;animation-delay:-6s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(30px,24px) scale(1.12)}}
.glass{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.08));
-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);
border:1px solid rgba(255,255,255,.38);border-radius:26px;
box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.12)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
background:linear-gradient(115deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 42%)}
.tag{position:absolute;top:18px;left:18px;font-size:11px;color:#9fb3d1;letter-spacing:1px}
h2{font-size:20px;margin-bottom:6px}p{font-size:13px;color:#c6d4e8;line-height:1.7}
button{cursor:pointer}
.toastbox{width:300px;padding:28px 26px;text-align:center}
.tbtn{display:block;width:100%;border:none;color:#fff;font-size:14px;padding:13px;border-radius:13px;margin-top:14px;
background:linear-gradient(135deg,#4ade80,#1da05c);transition:transform .15s}
.tbtn:active{transform:scale(.97)}
.tbtn.warn{background:linear-gradient(135deg,#ffb020,#ff6a3d)}
.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);z-index:5;padding:13px 22px;border-radius:99px;
font-size:14px;opacity:0;pointer-events:none;transition:all .4s cubic-bezier(.2,.9,.3,1.2);
background:linear-gradient(135deg,rgba(40,50,70,.85),rgba(30,40,60,.85));
-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);
border:1px solid rgba(255,255,255,.4);box-shadow:0 14px 34px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translate(-50%,0)}</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<span class="tag">LIQUID GLASS · 复刻</span>
<div class="glass toastbox"><h2>液态玻璃 Toast</h2><p>点按钮弹出玻璃提示，3 秒自动消失。</p>
<button class="tbtn" id="t1">✓ 成功提示</button>
<button class="tbtn warn" id="t2">⚠ 警告提示</button>
<div class="toast" id="toast">✓ 已保存到云端</div></div>
<script>var toast=document.getElementById('toast'),tm;
function show(t){toast.textContent=t;toast.classList.add('show');
clearTimeout(tm);tm=setTimeout(function(){toast.classList.remove('show');},2600);}
document.getElementById('t1').addEventListener('click',function(){show('✓ 已保存到云端');});
document.getElementById('t2').addEventListener('click',function(){show('⚠ 网络不太稳定，已切换离线模式');});</script></body></html>
