<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>液态玻璃下拉选择</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;
background:radial-gradient(120% 90% at 50% 0%,#1c2a44 0%,#0b1220 55%,#060a14 100%);
color:#eef3fa;display:flex;align-items:center;justify-content:center;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.75;animation:drift 9s ease-in-out infinite alternate}
.b1{width:280px;height:280px;background:#5aa9ff;left:-60px;top:-40px}
.b2{width:240px;height:240px;background:#ff9ecb;right:-50px;top:30%;animation-delay:-3s}
.b3{width:220px;height:220px;background:#ffd166;left:30%;bottom:-70px;animation-delay:-6s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(30px,24px) scale(1.12)}}
.glass{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.08));
-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);
border:1px solid rgba(255,255,255,.38);border-radius:26px;
box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.12)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
background:linear-gradient(115deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 42%)}
.tag{position:absolute;top:18px;left:18px;font-size:11px;color:#9fb3d1;letter-spacing:1px}
h2{font-size:20px;margin-bottom:6px}p{font-size:13px;color:#c6d4e8;line-height:1.7}
button{cursor:pointer}
.sel{width:300px;padding:28px 26px}
.selbox{position:relative;margin-top:18px}
.cur{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:14px;
background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);cursor:pointer;font-size:14px}
.cur i{transition:transform .3s}
.opts{position:absolute;left:0;right:0;top:calc(100% + 8px);padding:8px;border-radius:16px;display:none;flex-direction:column;z-index:3;
background:linear-gradient(135deg,rgba(50,60,85,.92),rgba(35,45,70,.92));
-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);
border:1px solid rgba(255,255,255,.35);box-shadow:0 16px 40px rgba(0,0,0,.5)}
.opts.open{display:flex}
.opts a{color:#eef3fa;text-decoration:none;font-size:14px;padding:11px 13px;border-radius:11px;animation:drop .35s ease both}
.opts a:nth-child(2){animation-delay:.05s}.opts a:nth-child(3){animation-delay:.1s}.opts a:nth-child(4){animation-delay:.15s}
.opts a:hover{background:rgba(255,255,255,.14)}
@keyframes drop{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<span class="tag">LIQUID GLASS · 复刻</span>
<div class="glass sel"><h2>液态玻璃下拉选择</h2><p>点框体展开，选项逐条滑入。</p>
<div class="selbox" id="selbox"><div class="cur" id="cur"><span>🌐 选择主题风格</span><i id="arr">▾</i></div>
<div class="opts" id="opts"><a href="#" onclick="return false">💎 液态玻璃</a><a href="#" onclick="return false">🧱 黏土拟态</a>
<a href="#" onclick="return false">🌑 暗夜霓虹</a><a href="#" onclick="return false">🌸 樱花粉调</a></div></div></div>
<script>var box=document.getElementById('selbox'),opts=document.getElementById('opts'),cur=document.getElementById('cur'),arr=document.getElementById('arr');
cur.addEventListener('click',function(){var o=opts.classList.toggle('open');
arr.style.transform=o?'rotate(180deg)':'none';});
opts.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){
cur.querySelector('span').textContent=a.textContent;opts.classList.remove('open');arr.style.transform='none';});});</script></body></html>
