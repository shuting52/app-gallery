<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>液态玻璃日历</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;
background:radial-gradient(120% 90% at 50% 0%,#1c2a44 0%,#0b1220 55%,#060a14 100%);
color:#eef3fa;display:flex;align-items:center;justify-content:center;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.75;animation:drift 9s ease-in-out infinite alternate}
.b1{width:280px;height:280px;background:#5aa9ff;left:-60px;top:-40px}
.b2{width:240px;height:240px;background:#ff9ecb;right:-50px;top:30%;animation-delay:-3s}
.b3{width:220px;height:220px;background:#ffd166;left:30%;bottom:-70px;animation-delay:-6s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(30px,24px) scale(1.12)}}
.glass{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.08));
-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);
border:1px solid rgba(255,255,255,.38);border-radius:26px;
box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.12)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
background:linear-gradient(115deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 42%)}
.tag{position:absolute;top:18px;left:18px;font-size:11px;color:#9fb3d1;letter-spacing:1px}
h2{font-size:20px;margin-bottom:6px}p{font-size:13px;color:#c6d4e8;line-height:1.7}
button{cursor:pointer}
.cal{width:310px;padding:24px}
.chead{display:flex;justify-content:space-between;align-items:baseline}
.chead b{font-size:19px}.chead span{font-size:12px;color:#9fb3d1}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px;text-align:center;font-size:12px}
.grid i{font-style:normal;color:#8fa5c4;padding:4px 0}
.grid span{padding:8px 0;border-radius:10px;cursor:pointer;transition:all .25s;position:relative}
.grid span:hover{background:rgba(255,255,255,.14)}
.grid span.today{background:linear-gradient(135deg,#5aa9ff,#7b6cff);font-weight:700;box-shadow:0 0 16px rgba(90,120,255,.6);animation:pulse 2.2s ease-in-out infinite}
.grid span.sel{outline:2px solid rgba(255,255,255,.7)}
.grid span.dot::after{content:"";position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:#ffd166}
@keyframes pulse{0%,100%{box-shadow:0 0 10px rgba(90,120,255,.5)}50%{box-shadow:0 0 22px rgba(90,120,255,.9)}}
.foot{margin-top:14px;font-size:11px;color:#9fb3d1}</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<span class="tag">LIQUID GLASS · 复刻</span>
<div class="glass cal"><div class="chead"><b>10 月</b><span>2026 · 今日 24 日</span></div>
<div class="grid" id="grid"></div><p class="foot">● 有安排 &nbsp; ○ 空闲 · 点日期可切换选中</p></div>
<script>var g=document.getElementById('grid');
['日','一','二','三','四','五','六'].forEach(function(d){var i=document.createElement('i');i.textContent=d;g.appendChild(i);});
for(var d=1;d<=31;d++){var s=document.createElement('span');s.textContent=d;
if(d===24)s.classList.add('today');if([3,9,15,21].indexOf(d)>=0)s.classList.add('dot');
s.addEventListener('click',function(){document.querySelectorAll('.grid span').forEach(function(o){o.classList.remove('sel');});this.classList.add('sel');});
g.appendChild(s);}</script></body></html>
