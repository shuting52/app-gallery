<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>液态玻璃对话框</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;
background:radial-gradient(120% 90% at 50% 0%,#1c2a44 0%,#0b1220 55%,#060a14 100%);
color:#eef3fa;display:flex;align-items:center;justify-content:center;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.75;animation:drift 9s ease-in-out infinite alternate}
.b1{width:280px;height:280px;background:#5aa9ff;left:-60px;top:-40px}
.b2{width:240px;height:240px;background:#ff9ecb;right:-50px;top:30%;animation-delay:-3s}
.b3{width:220px;height:220px;background:#ffd166;left:30%;bottom:-70px;animation-delay:-6s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(30px,24px) scale(1.12)}}
.glass{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.08));
-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);
border:1px solid rgba(255,255,255,.38);border-radius:26px;
box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.12)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
background:linear-gradient(115deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 42%)}
.tag{position:absolute;top:18px;left:18px;font-size:11px;color:#9fb3d1;letter-spacing:1px}
h2{font-size:20px;margin-bottom:6px}p{font-size:13px;color:#c6d4e8;line-height:1.7}
.dialog{width:300px;padding:30px 26px 26px;text-align:center;position:relative;animation:pop .45s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(16px)}to{opacity:1;transform:none}}
.dialog .x{position:absolute;top:14px;right:16px;color:#9fb3d1;cursor:pointer;font-size:14px}
.btns{display:flex;gap:10px;margin-top:20px}
.btns button{flex:1;padding:11px;border-radius:14px;font-size:14px;cursor:pointer;border:1px solid rgba(255,255,255,.3)}
.btns .ghost{background:rgba(255,255,255,.12);color:#fff}
.btns .solid{background:linear-gradient(135deg,#5aa9ff,#7b6cff);color:#fff;border:none}
.reopen{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);padding:11px 20px;color:#fff;
font-size:13px;border-radius:999px;cursor:pointer}</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<span class="tag">LIQUID GLASS · 复刻</span>
<div class="glass dialog" id="dlg"><div class="x" id="x">✕</div>
<div style="font-size:40px">🎉</div><h2 style="margin-top:10px">解析完成</h2>
<p>视频已去水印并保存到相册，<br>原画质 1080P · 无水印。</p>
<div class="btns"><button class="ghost" id="later">稍后再看</button><button class="solid" id="open">立即查看</button></div></div>
<button class="glass reopen" id="reopen">再次弹出对话框</button>
<script>var d=document.getElementById('dlg');
function hide(){d.style.display='none';}
document.getElementById('x').addEventListener('click',hide);
document.getElementById('later').addEventListener('click',hide);
document.getElementById('open').addEventListener('click',hide);
document.getElementById('reopen').addEventListener('click',function(){d.style.display='block';
d.style.animation='none';void d.offsetWidth;d.style.animation='';});</script></body></html>
