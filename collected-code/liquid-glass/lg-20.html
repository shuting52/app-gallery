<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>液态玻璃购物车</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;
background:radial-gradient(120% 90% at 50% 0%,#1c2a44 0%,#0b1220 55%,#060a14 100%);
color:#eef3fa;display:flex;align-items:center;justify-content:center;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.75;animation:drift 9s ease-in-out infinite alternate}
.b1{width:280px;height:280px;background:#5aa9ff;left:-60px;top:-40px}
.b2{width:240px;height:240px;background:#ff9ecb;right:-50px;top:30%;animation-delay:-3s}
.b3{width:220px;height:220px;background:#ffd166;left:30%;bottom:-70px;animation-delay:-6s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(30px,24px) scale(1.12)}}
.glass{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.08));
-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);
border:1px solid rgba(255,255,255,.38);border-radius:26px;
box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.12)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
background:linear-gradient(115deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 42%)}
.tag{position:absolute;top:18px;left:18px;font-size:11px;color:#9fb3d1;letter-spacing:1px}
h2{font-size:20px;margin-bottom:6px}p{font-size:13px;color:#c6d4e8;line-height:1.7}
button{cursor:pointer}
.cart{width:320px;padding:26px}
.item{display:flex;align-items:center;gap:12px;margin-top:18px;padding:14px;background:rgba(255,255,255,.1);
border:1px solid rgba(255,255,255,.2);border-radius:18px}
.pic{width:48px;height:48px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;
background:linear-gradient(135deg,#5aa9ff,#7b6cff)}
.tx{flex:1}.tx b{font-size:14px}.tx p{font-size:12px;color:#9fb3d1;margin-top:3px}
.step{display:flex;align-items:center;gap:8px}
.step button{width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);
color:#fff;font-size:16px}
.step b{font-size:14px;min-width:16px;text-align:center}
.total{display:flex;align-items:center;gap:10px;margin-top:18px}
.total b{font-size:18px;color:#ffd166}
.buy{margin-left:auto;border:none;color:#fff;font-size:13px;padding:11px 20px;border-radius:99px;
background:linear-gradient(135deg,#ff9a5c,#ff5a5a);box-shadow:0 6px 18px rgba(255,90,90,.45)}</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<span class="tag">LIQUID GLASS · 复刻</span>
<div class="glass cart"><h2>液态玻璃购物车</h2>
<div class="item"><span class="pic">🎧</span><div class="tx"><b>无线降噪耳机</b><p>曜石黑 · ¥<span id="price">899</span></p></div>
<div class="step"><button id="minus">−</button><b id="qty">1</b><button id="plus">+</button></div></div>
<div class="total">合计 <b>¥<span id="total">899</span></b><button class="buy">去结算 →</button></div></div>
<script>var q=1,price=899;
function sync(){document.getElementById('qty').textContent=q;document.getElementById('total').textContent=q*price;}
document.getElementById('plus').addEventListener('click',function(){q++;sync();});
document.getElementById('minus').addEventListener('click',function(){if(q>1)q--;sync();});</script></body></html>
