<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>液态玻璃滑块</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;
background:radial-gradient(120% 90% at 50% 0%,#1c2a44 0%,#0b1220 55%,#060a14 100%);
color:#eef3fa;display:flex;align-items:center;justify-content:center;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.75;animation:drift 9s ease-in-out infinite alternate}
.b1{width:280px;height:280px;background:#5aa9ff;left:-60px;top:-40px}
.b2{width:240px;height:240px;background:#ff9ecb;right:-50px;top:30%;animation-delay:-3s}
.b3{width:220px;height:220px;background:#ffd166;left:30%;bottom:-70px;animation-delay:-6s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(30px,24px) scale(1.12)}}
.glass{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.08));
-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);
border:1px solid rgba(255,255,255,.38);border-radius:26px;
box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.12)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
background:linear-gradient(115deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 42%)}
.tag{position:absolute;top:18px;left:18px;font-size:11px;color:#9fb3d1;letter-spacing:1px}
h2{font-size:20px;margin-bottom:6px}p{font-size:13px;color:#c6d4e8;line-height:1.7}
.panel{width:300px;padding:30px 26px}
.slider{position:relative;margin-top:26px;height:34px}
.slider input{position:absolute;inset:0;width:100%;opacity:0;cursor:pointer}
.slider::before{content:"";position:absolute;left:0;right:0;top:13px;height:8px;border-radius:99px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25)}
.fill{position:absolute;left:0;top:13px;height:8px;border-radius:99px;background:linear-gradient(90deg,#5aa9ff,#ff9ecb)}
.thumb{position:absolute;top:4px;width:26px;height:26px;border-radius:50%;transform:translateX(-50%);
background:linear-gradient(135deg,#fff,#cfe0f7);box-shadow:0 4px 14px rgba(0,0,0,.45),inset 0 1px 0 #fff}
.thumb span{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;
background:rgba(20,28,46,.9);border:1px solid rgba(255,255,255,.3);padding:3px 9px;border-radius:99px}
.marks{display:flex;justify-content:space-between;font-size:11px;color:#9fb3d1;margin-top:10px}</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<span class="tag">LIQUID GLASS · 复刻</span>
<div class="glass panel"><h2>液态玻璃滑块</h2><p>拖动玻璃轨道，数值气泡跟随滑块，填充带彩色渐变。</p>
<div class="slider"><div class="fill" id="fill"></div><div class="thumb" id="thumb"><span id="bub">65</span></div>
<input type="range" min="0" max="100" value="65" id="rg"></div>
<div class="marks"><span>0</span><span>亮度</span><span>100</span></div></div>
<script>var rg=document.getElementById('rg'),fill=document.getElementById('fill'),th=document.getElementById('thumb'),bub=document.getElementById('bub');
function sync(){var v=+rg.value;fill.style.width=v+'%';th.style.left=v+'%';bub.textContent=v;}
rg.addEventListener('input',sync);sync();</script></body></html>
