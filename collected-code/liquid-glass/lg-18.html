<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>液态玻璃聊天框</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;
background:radial-gradient(120% 90% at 50% 0%,#1c2a44 0%,#0b1220 55%,#060a14 100%);
color:#eef3fa;display:flex;align-items:center;justify-content:center;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.75;animation:drift 9s ease-in-out infinite alternate}
.b1{width:280px;height:280px;background:#5aa9ff;left:-60px;top:-40px}
.b2{width:240px;height:240px;background:#ff9ecb;right:-50px;top:30%;animation-delay:-3s}
.b3{width:220px;height:220px;background:#ffd166;left:30%;bottom:-70px;animation-delay:-6s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(30px,24px) scale(1.12)}}
.glass{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.08));
-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);
border:1px solid rgba(255,255,255,.38);border-radius:26px;
box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.12)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
background:linear-gradient(115deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 42%)}
.tag{position:absolute;top:18px;left:18px;font-size:11px;color:#9fb3d1;letter-spacing:1px}
h2{font-size:20px;margin-bottom:6px}p{font-size:13px;color:#c6d4e8;line-height:1.7}
button{cursor:pointer}
.chat{width:320px;padding:20px}
.chead2{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid rgba(255,255,255,.15);padding-bottom:12px}
.chead2 b{font-size:15px}.chead2 span{font-size:11px;color:#d1fae5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.msgs{display:flex;flex-direction:column;gap:9px;margin:14px 0}
.m{max-width:78%;font-size:13px;line-height:1.6;padding:9px 13px;border-radius:16px;animation:rowIn .4s ease both}
@keyframes rowIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.m.left{align-self:flex-start;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-bottom-left-radius:5px}
.m.right{align-self:flex-end;background:linear-gradient(135deg,#5aa9ff,#7b6cff);border-bottom-right-radius:5px}
.send{display:flex;gap:8px}
.send input{flex:1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:99px;
padding:10px 15px;color:#fff;font-size:13px;outline:none}
.send button{border:none;color:#fff;font-size:13px;padding:10px 18px;border-radius:99px;background:linear-gradient(135deg,#5aa9ff,#7b6cff)}</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<span class="tag">LIQUID GLASS · 复刻</span>
<div class="glass chat"><div class="chead2"><b>💬 设计小组</b><span>4 人在线</span></div>
<div class="msgs" id="msgs"><div class="m left">新版玻璃卡片做好了，大家看看 👆</div>
<div class="m right">质感很棒！模糊再高一点？</div>
<div class="m left">已经调到 22px，亮边也加了 ✨</div></div>
<div class="send"><input id="cin" placeholder="输入消息…"><button id="send">发送</button></div></div>
<script>var msgs=document.getElementById('msgs'),cin=document.getElementById('cin');
function send(){var v=cin.value.trim();if(!v)return;var d=document.createElement('div');d.className='m right';d.textContent=v;
msgs.appendChild(d);cin.value='';setTimeout(function(){var r=document.createElement('div');r.className='m left';r.textContent='收到，马上看 👀';msgs.appendChild(r);},700);}
document.getElementById('send').addEventListener('click',send);
cin.addEventListener('keydown',function(e){if(e.key==='Enter')send();});</script></body></html>
