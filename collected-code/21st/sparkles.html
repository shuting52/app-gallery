<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sparkles · 星空闪烁</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body {
    background:#050510;
    font-family:-apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color:#fff;
    -webkit-user-select:none; user-select:none;
  }
  #sky { position:fixed; inset:0; display:block; }
  .src {
    position:fixed; top:14px; left:0; right:0; z-index:2;
    text-align:center; font-size:11px; letter-spacing:2px; color:rgba(255,255,255,.45);
  }
  .hero {
    position:fixed; inset:0; z-index:2;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:0 32px; pointer-events:none;
  }
  .hero h1 {
    font-size:34px; font-weight:700; letter-spacing:6px; line-height:1.5;
    background:linear-gradient(180deg,#ffffff 30%,#a8c4ff 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 40px rgba(150,180,255,.25);
  }
  .hero p {
    margin-top:16px; font-size:14px; letter-spacing:3px; color:rgba(200,215,255,.6);
  }
  .hero .btn {
    pointer-events:auto; margin-top:34px;
    padding:13px 42px; border-radius:999px;
    border:1px solid rgba(170,195,255,.45);
    background:rgba(120,150,255,.08);
    color:#dbe6ff; font-size:15px; letter-spacing:4px;
    cursor:pointer; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
    transition:box-shadow .3s, background .3s;
  }
  .hero .btn:hover { background:rgba(120,150,255,.18); box-shadow:0 0 28px rgba(140,170,255,.35); }
  .hint {
    position:fixed; bottom:26px; left:0; right:0; z-index:2;
    text-align:center; font-size:11px; letter-spacing:2px; color:rgba(255,255,255,.3);
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="src">复刻自 21st.dev · Sparkles</div>
<div class="hero">
  <h1>星空闪烁</h1>
  <p>Canvas 粒子 · 鼠标靠近点亮</p>
  <button class="btn" id="burst">绽 放</button>
</div>
<div class="hint">移动手指 / 鼠标，星星会为你亮起</div>
<script>
(function(){
  var canvas = document.getElementById('sky');
  var ctx = canvas.getContext('2d');
  var W, H, stars = [];
  var mouse = { x:-9999, y:-9999 };
  var boost = 0;

  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    initStars();
  }

  function initStars(){
    stars = [];
    var n = Math.round(Math.min(180, Math.max(120, W * H / 2600)));
    for (var i = 0; i < n; i++){
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.6 + 0.5,
        phase: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.6 + 0.15,          // 闪烁速度
        dx: (Math.random() - 0.5) * 0.25,          // 漂移速度
        dy: (Math.random() - 0.5) * 0.25,
        hue: Math.random() < 0.85 ? 0 : 220        // 少量蓝星
      });
    }
  }

  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', function(e){ mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('touchmove', function(e){
    var t = e.touches[0]; mouse.x = t.clientX; mouse.y = t.clientY;
  }, {passive:true});

  document.getElementById('burst').addEventListener('click', function(){
    boost = 1; // 全部星星闪一下
    setTimeout(function(){ boost = 0; }, 500);
  });

  var R = 160; // 鼠标影响半径
  function frame(t){
    ctx.clearRect(0, 0, W, H);
    var time = t / 1000;
    for (var i = 0; i < stars.length; i++){
      var s = stars[i];
      // 漂移
      s.x += s.dx; s.y += s.dy;
      if (s.x < -10) s.x = W + 10; if (s.x > W + 10) s.x = -10;
      if (s.y < -10) s.y = H + 10; if (s.y > H + 10) s.y = -10;

      // 呼吸闪烁 0.15 ~ 1
      var twinkle = 0.575 + 0.425 * Math.sin(time * s.speed + s.phase);

      // 鼠标靠近加亮
      var dxm = s.x - mouse.x, dym = s.y - mouse.y;
      var d = Math.sqrt(dxm*dxm + dym*dym);
      var near = d < R ? (1 - d / R) : 0;

      var a = Math.min(1, twinkle * 0.75 + near * 0.9 + boost * twinkle);
      var rad = s.r * (1 + near * 1.6 + boost * 0.8);

      var col = s.hue ? '200,220,255' : '255,255,255';
      // 发光晕
      var g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, rad * 4);
      g.addColorStop(0, 'rgba(' + col + ',' + (a * 0.9) + ')');
      g.addColorStop(0.4, 'rgba(' + col + ',' + (a * 0.25) + ')');
      g.addColorStop(1, 'rgba(' + col + ',0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(s.x, s.y, rad * 4, 0, Math.PI * 2);
      ctx.fill();
      // 星核
      ctx.fillStyle = 'rgba(' + col + ',' + a + ')';
      ctx.beginPath();
      ctx.arc(s.x, s.y, rad, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
