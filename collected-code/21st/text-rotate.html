<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Rotate · 21st 复刻</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #09090b;
    color: #fafafa;
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    overflow: hidden;
  }
  .credit {
    position: absolute;
    top: 24px;
    font-size: 12px;
    letter-spacing: 2px;
    color: #52525b;
  }
  h1 {
    font-size: clamp(34px, 9vw, 56px);
    font-weight: 800;
    line-height: 1.35;
    text-align: center;
    letter-spacing: -1px;
    max-width: 380px;
  }
  .rotator {
    display: inline-block;
    position: relative;
    height: 1.35em;
    overflow: hidden;
    vertical-align: bottom;
    color: #a78bfa;
  }
  .rotator .word {
    display: inline-block;
    white-space: nowrap;
    transition: transform .55s cubic-bezier(.65,0,.35,1),
                opacity .55s ease,
                filter .55s ease;
  }
  .word.out {
    transform: translateY(-100%);
    opacity: 0;
    filter: blur(8px);
  }
  .word.in {
    transform: translateY(100%);
    opacity: 0;
    filter: blur(8px);
  }
  .word.show {
    transform: translateY(0);
    opacity: 1;
    filter: blur(0);
  }
  .sub {
    margin-top: 28px;
    font-size: 14px;
    color: #71717a;
    text-align: center;
    line-height: 1.8;
    max-width: 320px;
  }
  .dots {
    margin-top: 32px;
    display: flex;
    gap: 8px;
  }
  .dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: #27272a;
    transition: background .3s;
  }
  .dots span.on { background: #a78bfa; }
</style>
</head>
<body>
  <div class="credit">复刻自 21st.dev · Text Rotate</div>
  <h1>
    为独立开发者打造的<br>
    「<span class="rotator"><span class="word show" id="w">效率</span></span>」工具箱
  </h1>
  <p class="sub">一个词，一种可能<br>灵感每 2.5 秒刷新一次</p>
  <div class="dots" id="dots"></div>

<script>
  var words = ["效率", "设计", "灵感", "代码", "自由"];
  var el = document.getElementById("w");
  var dotsBox = document.getElementById("dots");
  var i = 0;

  words.forEach(function(_, k) {
    var s = document.createElement("span");
    if (k === 0) s.className = "on";
    dotsBox.appendChild(s);
  });
  var dots = dotsBox.children;

  setInterval(function() {
    el.classList.remove("show");
    el.classList.add("out");
    dots[i].className = "";
    setTimeout(function() {
      i = (i + 1) % words.length;
      el.textContent = words[i];
      el.classList.remove("out");
      el.classList.add("in");
      /* 强制回流，让 in 状态先生效 */
      void el.offsetWidth;
      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          el.classList.remove("in");
          el.classList.add("show");
        });
      });
      dots[i].className = "on";
    }, 550);
  }, 2500);
</script>
</body>
</html>
