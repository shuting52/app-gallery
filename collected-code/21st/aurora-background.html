<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aurora Background · 极光背景复刻</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#05070f}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:#fff}
.stage{position:relative;width:100%;height:100%;min-height:100svh;overflow:hidden;display:flex;flex-direction:column}
.blob{position:absolute;border-radius:50%;filter:blur(60px);will-change:transform,opacity}
.b1{width:340px;height:340px;top:-70px;left:-90px;background:radial-gradient(circle at 40% 40%,rgba(34,211,238,.85),rgba(34,211,238,0) 70%);animation:drift1 18s ease-in-out infinite}
.b2{width:420px;height:420px;top:22%;right:-130px;background:radial-gradient(circle at 60% 50%,rgba(139,92,246,.8),rgba(139,92,246,0) 70%);animation:drift2 14s ease-in-out infinite}
.b3{width:300px;height:300px;bottom:8%;left:8%;background:radial-gradient(circle at 50% 50%,rgba(236,72,153,.75),rgba(236,72,153,0) 70%);animation:drift3 20s ease-in-out infinite}
.b4{width:260px;height:260px;top:44%;left:-70px;background:radial-gradient(circle at 50% 50%,rgba(52,211,153,.7),rgba(52,211,153,0) 70%);animation:drift4 16s ease-in-out infinite}
.b5{width:380px;height:380px;bottom:-110px;right:-60px;background:radial-gradient(circle at 50% 50%,rgba(59,130,246,.65),rgba(59,130,246,0) 70%);animation:drift5 12s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1);opacity:.9}33%{transform:translate(90px,60px) scale(1.25);opacity:.65}66%{transform:translate(-40px,110px) scale(.9);opacity:1}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1.1);opacity:.8}40%{transform:translate(-110px,50px) scale(.85);opacity:1}70%{transform:translate(-60px,-70px) scale(1.3);opacity:.6}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1);opacity:.7}35%{transform:translate(70px,-90px) scale(1.2);opacity:1}70%{transform:translate(-50px,-40px) scale(.9);opacity:.55}}
@keyframes drift4{0%,100%{transform:translate(0,0) scale(.95);opacity:.85}50%{transform:translate(100px,-60px) scale(1.25);opacity:.5}}
@keyframes drift5{0%,100%{transform:translate(0,0) scale(1.15);opacity:.75}45%{transform:translate(-80px,-100px) scale(.9);opacity:1}80%{transform:translate(60px,-50px) scale(1.3);opacity:.6}}
.mask{position:absolute;inset:0;background:radial-gradient(ellipse 90% 60% at 50% 46%,rgba(5,7,15,.35),rgba(5,7,15,.78) 90%);pointer-events:none}
.credit{position:absolute;top:calc(10px + env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:11px;letter-spacing:.14em;color:rgba(255,255,255,.42);z-index:3}
.hero{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 32px}
.badge{display:inline-block;font-size:12px;letter-spacing:.2em;color:#a5f3fc;border:1px solid rgba(165,243,252,.35);border-radius:999px;padding:7px 16px;margin-bottom:26px;background:rgba(165,243,252,.06);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hero h1{font-size:44px;line-height:1.25;font-weight:800;letter-spacing:.04em;background:linear-gradient(180deg,#fff 30%,#bae6fd 75%,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin-top:18px;font-size:15px;line-height:1.8;color:rgba(226,232,240,.82);max-width:320px}
.btns{margin-top:36px;display:flex;gap:14px}
.btn{font-size:15px;font-weight:600;border-radius:999px;padding:13px 30px;cursor:pointer;border:none;transition:transform .2s}
.btn:active{transform:scale(.96)}
.btn.primary{color:#062033;background:linear-gradient(135deg,#a5f3fc,#f0abfc);box-shadow:0 8px 28px rgba(165,243,252,.35)}
.btn.ghost{color:#e2e8f0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hint{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:12px;color:rgba(255,255,255,.4);letter-spacing:.1em;z-index:3}
</style>
</head>
<body>
<div class="stage">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>
  <div class="blob b5"></div>
  <div class="mask"></div>
  <div class="credit">复刻自 21st.dev · AURORA BACKGROUND</div>
  <div class="hero">
    <div class="badge">动态氛围背景</div>
    <h1>把夜空<br>装进口袋</h1>
    <p>五团光雾各自呼吸、漂移、流转，<br>每一帧都是不一样的极光。</p>
    <div class="btns">
      <button class="btn primary" onclick="alert('开始创作吧')">立即体验</button>
      <button class="btn ghost" onclick="alert('查看更多组件')">看看更多</button>
    </div>
  </div>
  <div class="hint">CSS keyframes · 零 JS 动画</div>
</div>
</body>
</html>
