<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>案例画廊 · App 版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0c12;color:#fff;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.phone{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:#11131A;box-shadow:0 0 0 1px #22263a}
.status{display:flex;justify-content:space-between;align-items:center;padding:10px 18px 4px;font-size:13px;font-weight:600}
.status .bat{display:flex;align-items:center;gap:6px}
.status .bat i{display:block;width:22px;height:11px;border:1.5px solid #fff;border-radius:3px;position:relative}
.status .bat i:after{content:"";position:absolute;inset:1.5px 2px 1.5px 1.5px;background:#7AD07A;border-radius:1.5px}
.appbar{padding:10px 18px 12px}
.appbar h1{font-size:26px;letter-spacing:.5px}
.appbar p{font-size:12px;color:#9AA3B8;margin-top:5px}
.searchbox{display:flex;gap:8px;padding:0 18px 12px}
.searchbox input{flex:1;background:#1C2233;border:0;outline:0;color:#fff;font-size:14px;padding:11px 14px;border-radius:12px}
.searchbox input::placeholder{color:#667088}
.searchbox button{background:#FFC94D;border:0;border-radius:12px;padding:0 16px;font-size:14px;font-weight:700;color:#222}
.content{flex:1;padding:0 18px 20px}
.newbanner{background:linear-gradient(135deg,#FF5E3A,#FFB03A);border-radius:16px;padding:14px 16px;margin-bottom:16px;cursor:pointer}
.newbanner b{font-size:15px}
.newbanner span{display:block;font-size:12px;opacity:.9;margin-top:3px}
.gcard{background:#1C2233;border-radius:18px;padding:16px;margin-bottom:12px;cursor:pointer}
.gcard h3{font-size:17px}
.gcard .cnt{font-size:13px;color:#C6CCDD;margin-top:4px}
.gcard .subs{font-size:12px;color:#9AA3B8;margin-top:5px;line-height:1.6}
.gcard .go{font-size:13px;color:#FFC94D;margin-top:8px;display:block}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;background:#1C2233;color:#C6CCDD;border:0;border-radius:20px;padding:8px 14px;font-size:13px}
.chips button.on{background:#FFC94D;color:#222;font-weight:700}
.row{display:flex;align-items:center;gap:10px;background:#1C2233;border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer}
.row .no{color:#FFC94D;font-weight:800;font-size:13px;white-space:nowrap}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mid span{font-size:12px;color:#9AA3B8}
.row .newb{background:#E84D3D;color:#fff;font-size:11px;font-weight:700;border-radius:8px;padding:3px 7px}
.sect{font-size:13px;color:#9AA3B8;margin:4px 0 12px}
.empty{color:#9AA3B8;font-size:14px;text-align:center;padding:30px 0}
.tabbar{position:sticky;bottom:0;display:flex;background:rgba(28,34,51,.92);backdrop-filter:blur(16px);border-top:1px solid #2A3049;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;background:0;border:0;color:#9AA3B8;font-size:12px;padding:8px 0 6px;border-radius:12px}
.tabbar button.on{color:#FFC94D;font-weight:700}
.tabbar button i{display:block;font-size:19px;font-style:normal;margin-bottom:2px}
.detail{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:100%;background:#11131A;z-index:50;overflow:auto;display:none}
.detail.open{display:block;animation:up .28s ease}
@keyframes up{from{transform:translate(-50%,30px);opacity:.4}to{transform:translate(-50%,0);opacity:1}}
.detail .dhead{display:flex;align-items:center;gap:12px;padding:14px 18px}
.detail .dhead button{background:#1C2233;color:#fff;border:0;border-radius:10px;padding:8px 14px;font-size:14px}
.detail .dhead h2{font-size:18px}
.detail .meta{padding:0 18px 12px;font-size:13px;color:#9AA3B8}
.detail .demo{padding:0 18px 24px}
.detail iframe{width:100%;height:580px;border:0;border-radius:18px;background:#11131A}
.detail .note{margin:0 18px;background:#1C2233;border-radius:16px;padding:18px;font-size:14px;color:#C6CCDD;line-height:1.7}
.detail .note a{display:block;margin-top:14px;background:#FFC94D;color:#222;text-align:center;text-decoration:none;font-weight:700;border-radius:12px;padding:12px}
</style></head>
<body>
<div class="phone">

  </div>
</div>

m<\/div><h2>海面<\/h2><p>阳光斜斜地穿进水里，波浪在头顶碎成一片亮斑。<\/p><\/div>\n  <\/div>\n  <div class=\"item\">\n    <div class=\"sea s1\"><div class=\"pk\" style=\"left:18%;animation-delay:0s\"><\/div><div class=\"pk\" style=\"left:58%;animation-delay:2s\"><\/div><div class=\"pk\" style=\"left:80%;animation-delay:4s\"><\/div><\/div>\n    <div class=\"vt\">浅海<\/div><div class=\"depth\">−200 m<\/div>\n    <div class=\"ct\"><div class=\"num\">02 / 04 · −200 m<\/div><h2>浅海<\/h2><p>光线开始变弱，浮游生物的光点一闪一闪往上飘。<\/p><\/div>\n  <\/div>\n  <div class=\"item\">\n    <div class=\"sea s2\"><div class=\"pk\" style=\"left:12%;animation-delay:1s\"><\/div><div class=\"pk\" style=\"left:44%;animation-delay:3s\"><\/div><div class=\"pk\" style=\"left:70%;animation-delay:5s\"><\/div>\n      <div class=\"jelly\"><div class=\"dome\"><\/div><div class=\"t\"><\/div><div class=\"t\"><\/div><div class=\"t\"><\/div><\/div><\/div>\n    <div class=\"vt\">深海<\/div><div class=\"depth\">−1000 m<\/div>\n    <div class=\"ct\"><div class=\"num\">03 / 04 · −1000 m<\/div><h2>深海<\/h2><p>这里几乎没有阳光，水母提着粉色的灯，独自漂浮。<\/p><\/div>\n  <\/div>\n  <div class=\"item\">\n    <div class=\"sea s3\"><div class=\"pk\" style=\"left:24%;animation-delay:.5s\"><\/div><div class=\"pk\" style=\"left:64%;animation-delay:2.5s\"><\/div><div class=\"wreck\"><\/div><\/div>\n    <div class=\"vt\">海沟<\/div><div class=\"depth\">−6000 m<\/div>\n    <div class=\"ct\"><div class=\"num\">04 / 04 · −6000 m<\/div><h2>海沟<\/h2><p>绝对的黑暗与寂静，只有沉船的剪影，和几点不肯熄灭的光。<\/p><\/div>\n  <\/div>\n<\/div>\n<div class=\"foot\">悬停或点按，下潜到下一层<\/div>\n<script>\nvar acc=document.getElementById('acc'),items=acc.querySelectorAll('.item'),cur=0;\nfunction act(i){items[cur].classList.remove('active');cur=i;items[cur].classList.add('active');}\nitems.forEach(function(it,i){it.addEventListener('mouseenter',function(){act(i);});it.addEventListener('click',function(){act(i);});});\n<\/script>\n<\/body>\n<\/html>\n", "四季列车": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n<title>四季列车 · 创意手风琴<\/title>\n<style>\n*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nbody{font-family:-apple-system,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;background:#141210;color:#fdf8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:26px 14px}\n.head{text-align:center;margin-bottom:18px}\n.head .tag{display:inline-block;font-size:11px;letter-spacing:1px;padding:4px 12px;border-radius:99px;margin-bottom:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2)}\n.head h1{font-size:21px;font-weight:800}\n.head p{font-size:12px;color:#9a8f80;margin-top:6px}\n.acc{display:flex;width:100%;max-width:430px;height:560px;gap:10px}\n.item{position:relative;flex:1;border-radius:20px;overflow:hidden;cursor:pointer;min-width:0;transition:flex .6s cubic-bezier(.22,1,.36,1);border:5px solid #4a3226;box-shadow:0 10px 26px rgba(0,0,0,.45)}\n.item.active{flex:3.5}\n/* 车窗：窗外景色 + 十字窗框 */\n.view{position:absolute;inset:0;overflow:hidden}\n.spring{background:linear-gradient(180deg,#a5d8ff 0%,#fbcfe8 70%,#f9a8d4 100%)}\n.summer{background:linear-gradient(180deg,#0284c7 0%,#7dd3fc 70%,#fef08a 100%)}\n.autumn{background:linear-gradient(180deg,#fdba74 0%,#fb923c 60%,#7c2d12 100%)}\n.winter{background:linear-gradient(180deg,#cbd5e1 0%,#e2e8f0 60%,#f8fafc 100%)}\n.frame{position:absolute;inset:0;z-index:4;pointer-events:none}\n.frame::before{content:\"\";position:absolute;left:0;right:0;top:50%;height:7px;margin-top:-3px;background:#4a3226}\n.frame::after{content:\"\";position:absolute;top:0;bottom:0;left:50%;width:7px;margin-left:-3px;background:#4a3226}\n.ground{position:absolute;left:0;right:0;bottom:0;height:26%;z-index:2}\n.spring .ground{background:#3f7a4e;clip-path:polygon(0 100%,0 55%,30% 30%,55% 55%,80% 35%,100% 55%,100% 100%)}\n.summer .ground{background:#2c6e3f;clip-path:polygon(0 100%,0 65%,2 x rgba(0,0,0,.5)}\n.item.active .vt{opacity:0}\n.ct{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:40px 18px 20px;opacity:0;transform:translateY(14px);transition:opacity .45s ease .15s,transform .45s ease .15s;text-shadow:0 2px 10px rgba(0,0,0,.5);background:linear-gradient(180deg,transparent,rgba(0,0,0,.45))}\n.item.active .ct{opacity:1;transform:none}\n.ct .num{font-size:11px;letter-spacing:3px;color:#ffe08a;margin-bottom:7px}\n.ct h2{font-size:20px;font-weight:800;margin-bottom:6px}\n.ct p{font-size:12px;line-height:1.7;opacity:.92}\n.foot{margin-top:18px;font-size:11px;color:#6b5f52}\n<\/style>\n<\/head>\n<body>\n<div class=\"head\"><div class=\"tag\">创意手风琴 · 纯 CSS 场景<\/div><h1>四季列车<\/h1><p>展开车窗，窗外的花瓣、阳光、枫叶、雪花才会飘起来<\/p><\/div>\n<div class=\"acc\" id=\"acc\">\n  <div class=\"item active\">\n    <div class=\"view spring\">\n      <span class=\"fall petal\" style=\"left:16%;animation-delay:0s\"><\/span>\n      <span class=\"fall petal\" style=\"left:48%;animation-delay:1.4s\"><\/span>\n      <span class=\"fall petal\" style=\"left:74%;animation-delay:2.6s\"><\/span>\n      <span class=\"fall petal\" style=\"left:30%;animation-delay:3.8s;background:#fbcfe8\"><\/span>\n      <div class=\"ground\"><\/div>\n    <\/div><div class=\"frame\"><\/div>\n    <div class=\"vt\">春<\/div>\n    <div class=\"ct\"><div class=\"num\">01 / 04 · 春<\/div><h2>春之窗<\/h2><p>列车穿过花海，粉色的花瓣追着车窗跑，一路落英缤纷。<\/p><\/div>\n  <\/div>\n  <div class=\"item\">\n    <div class=\"view summer\">\n      <div class=\"suns\"><div class=\"rays\"><\/div><div class=\"core\"><\/div><\/div>\n      <div class=\"ground\"><\/div>\n    <\/div><div class=\"frame\"><\/div>\n    <div class=\"vt\">夏<\/div>\n    <div class=\"ct\"><div class=\"num\">02 / 04 · 夏<\/div><h2>夏之窗<\/h2><p>阳光在窗外旋转，远山青翠，蝉鸣被列车抛在身后。<\/p><\/div>\n  <\/div>\n  <div class=\"item\">\n    <div class=\"view autumn\">\n      <span class=\"fall leaf\" style=\"left:20%;animation-delay:.4s\"><\/span>\n      <span class=\"fall leaf leaf2\" style=\"left:52%;animation-delay:1.8s\"><\/span>\n      <span class=\"fall leaf\" style=\"left:76%;animation-delay:3s\"><\/span>\n      <span class=\"fall leaf leaf2\" style=\"left:36%;animation-delay:4.4s\"><\/span>\n      <div class=\"ground\"><\/div>\n    <\/div><div class=\"frame\"><\/div>\n    <div class=\"vt\">秋<\/div>\n    <div class=\"ct\"><div class=\"num\">03 / 04 · 秋<\/div><h2>秋之窗<\/h2><p>枫叶打着旋儿落下来，铺满窗外的山坡，金黄一片。<\/p><\/div>\n  <\/div>\n  <div class=\"item\">\n    <div class=\"view winter\">\n      <span class=\"fall snow\" style=\"left:14%;animation-delay:0s\"><\/span>\n      <span class=\"fall snow\" style=\"left:38%;animation-delay:1.2s\"><\/span>\n      <span class=\"fall snow\" style=\"left:62%;animation-delay:2.4s\"><\/span>\n      <span class=\"fall snow\" style=\"left:84%;animation-delay:3.6s\"><\/span>\n      <span class=\"fall snow\" style=\"left:50%;animation-delay:4.8s\"><\/span>\n      <div class=\"ground\"><\/div>\n    <\/div><div class=\"frame\"><\/div>\n    <div class=\"vt\">冬<\/div>\n    <div class=\"ct\"><div class=\"num\">04 / 04 · 冬<\/div><h2>冬之窗<\/h2><p>雪花轻轻地飘，窗外一片洁白，车厢里却很暖和。<\/p><\/div>\n  <\/div>\n<\/div>\n<div class=\"foot\">悬停或点按，打开下一扇车窗<\/div>\n<script>\nvar acc=document.getElementById('acc'),items=acc.querySelectorAll('.item'),cur=0;\nfunction act(i){items[cur].classList.remove('active');cur=i;items[cur].classList.add('active');}\nitems.forEach(function(it,i){it.addEventListener('mouseenter',function(){act(i);});it.addEventListener('click',function(){act(i);});});\n<\/script>\n<\/body>\n<\/html>\n", "天气情绪": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n<title>天气情绪 · 创意手风琴<\/title>\n<style>\n*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nbody{font-family:-apple-system,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;background:#0b0d12;color:#f2f4f8;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:26px 14px}\n.head{text-align:center;margin-bottom:18px}\n.head .tag{display:inline-block;font-size:11px;letter-spacing:1px;padding:4px 12px;border-radius:99px;margin-bottom:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2)}\n.head h1{font-size:21px;font-weight:800}\n.head p{font-size:12px;color:#8b93a5;margin-top:6px}\n.acc{display:flex;width:100%;max-width:430px;height:560px;gap:10px}\n.item{position:relative;flex:1;border-radius:20px;overflow:hidden;cursor:pointer;min-width:0;transition:flex .6s cubic-bezier(.22,1,.36,1)}\n.item.active{flex:3.5}\n.sky{position:absolute;inset:0}\n.sunny{background:linear-gradient(180deg,#38bdf8 0%,#bae6fd 100%)}\n.rainy{background:linear-gradient(180deg,#475569 0%,#94a3b8 100%)}\n.snowy{background:linear-gradient(180deg,#cbd5e1 0%,#f1f5f9 100%)}\n.stormy{background:linear-gradient(180deg,#1e293b 0%,#0f172a 100%)}\n/* 晴：旋转光线太阳 */\n.wsun{position:absolute;left:50%;top:16%;width:84px;height:84px;margin-left:-42px}\n.wsun .rays{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(253,224,71,.9) 0deg 10deg,transparent 10deg 24deg);-webkit-mask:radial-gradient(circle,transparent 0 24px,#000 25px);mask:radial-gradient(circle,transparent 0 24px,#000 25px);animation:spin 16s linear infinite}\n.wsun .core{position:absolute;inset:20px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fef9c3,#facc15);box-shadow:0 0 30px 10px rgba(250,204,21,.65)}\n@keyframes spin{to{transform:rotate(360deg)}}\n/* 云：圆角拼合 */\n.cloud{position:absolute;left:50%;top:14%;width:96px;height:30px;margin-left:-48px;border-radius:999px;background:#f1f5f9;box-shadow:0 8px 20px rgba(0,0,0,.2)}\n.cloud::before,.cloud::after{content:\"\";position:absolute;background:#f1f5f9;border-radius:50%}\n.cloud::before{width:42px;height:42px;left:14px;top:-20px}\n.cloud::after{width:30px;height:30px;right:14px;top:-13px}\n.stormy .cloud{background:#334155}\n.stormy .cloud::before,.stormy .cloud::after{background:#334155}\n/* 雨丝 */\n.drop{position:absolute;top:26%;width:2px;height:30px;border-radius:99px;background:linear-gradient(180deg,transparent,#7dd3fc);transform:skewX(-14deg);opacity:0;animation:rain 1.1s linear infinite}\n@keyframes rain{0%{transform:translateY(0) skewX(-14deg);opacity:0}15%{opacity:1}100%{transform:translateY(340px) skewX(-14deg);opacity:0}}\n/* 雪点 */\n.flake{position:absolute;top:-12px;width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.95);opacity:0;animation:snowfall 7s ease-in-out infinite}\n@keyframes snowfall{0%{transform:translate(0,0);opacity:0}12%{opacity:1}50%{transform:translate(16px,280px)}100%{transform:translate(-10px,560px);opacity:.2}}\n/* 闪电：clip-path 折线 */\n.bolt{position:absolute;left:50%;top:24%;width:34px;height:74px;margin-left:-17px;background:#fde047;clip-path:polygon(55% 0,100% 0,45% 45%,70% 45%,20% 100%,38% 52%,10% 52%);filter:drop-shadow(0 0 14px rgba(253,224,71,.9));opacity:0}\n.item.active .bolt{animation:flash 3.4s linear infinite}\n@keyframes flash{0%,86%,100%{opacity:0}87%{opacity:1}89%{opacity:.1}91%{opacity:1}94%{opacity:0}}\n.flashbg{position:absolute;inset:0;background:#fef9c3;opacity:0;pointer-events:none}\n.item.active .flashbg{animation:flash 3.4s linear infinite}\n.vt{position:absolute;z-index:3;left:0;right:0;bottom:22px;text-align:center;font-size:15px;font-weight:700;letter-spacing:6px;writing-mode:vertical-rl;text-orientation:upright;white-space:nowrap;transition:opacity .3s;text-shadow:0 2px 8px rgba(0,0,0,.45)}\n.item.active .vt{opacity:0}\n.ct{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:22px 18px;opacity:0;transform:translateY(14px);transition:opacity .45s ease .15s,transform .45s ease .15s;text-shadow:0 2px 10px rgba(0,0,0,.5)}\n.item.active .ct{opacity:1;transform:none}\n.ct .num{font-size:11px;letter-spacing:3px;color:#fde047;margin-bottom:7px}\n.ct h2{font-size:20px;font-weight:800;margin-bottom:6px}\n.ct p{font-size:12px;line-height:1.7;opacity:.92}\n.snowy .ct h2,.snowy .ct p,.snowy .ct .num{color:#334155;text-shadow:none}\n.snowy .ct .num{color:#0284c7}\n.foot{margin-top:18px;font-size:11px;color:#5b6373}\n<\/style>\n<\/head>\n<body>\n<div class=\"head\"><div class=\"tag\">创意手风琴 · 纯 CSS 场景<\/div><h1>天气情绪<\/h1><p>展开面板，天气就真的动起来<\/p><\/div>\n<div class=\"acc\" id=\"acc\">\n  <div class=\"item active\">\n    <div class=\"sky sunny\"><div class=\"wsun\"><div class=\"rays\"><\/div><div class=\"core\"><\/div><\/div><\/div>\n    <div class=\"vt\">晴<\/div>\n    <div class=\"ct\"><div class=\"num\">01 / 04 · 晴<\/div><h2>晴空万里<\/h2><p>太阳的光线一圈圈旋转，心情也跟着亮起来。<\/p><\/div>\n  <\/div>\n  <div class=\"item\">\n    <div class=\"sky rainy\"><div class=\"cloud\"><\/div>\n      <span class=\"drop\" style=\"left:20%;animation-delay:0s\"><\/span>\n      <span class=\"drop\" style=\"left:38%;animation-delay:.35s\"><\/span>\n      <span class=\"drop\" style=\"left:56%;animation-delay:.7s\"><\/span>\n      <span class=\"drop\" style=\"left:74%;animation-delay:.2s\"><\/span>\n      <span class=\"drop\" style=\"left:88%;animation-delay:.55s\"><\/span><\/div>\n    <div class=\"vt\">雨<\/div>\n    <div class=\"ct\"><div class=\"num\">02 / 04 · 雨<\/div><h2>绵绵细雨<\/h2><p>雨丝斜斜地落下来，云层低低的，适合听一首老歌。<\/p><\/div>\n  <\/div>\n  <div class=\"item\">\n    <div class=\"sky snowy\">\n      <span class=\"flake\" style=\"left:16%;animation-delay:0s\"><\/span>\n      <span class=\"flake\" style=\"left:40%;animation-delay:1.4s\"><\/span>\n      <span class=\"flake\" style=\"left:64%;animation-delay:2.6s\"><\/span>\n      <span class=\"flake\" style=\"left:84%;animation-delay:3.8s\"><\/span>\n      <span class=\"flake\" style=\"left:28%;animation-delay:5s\"><\/span><\/div>\n    <div class=\"vt\">雪<\/div>\n    <div class=\"ct\"><div class=\"num\">03 / 04 · 雪<\/div><h2>初雪纷纷<\/h2><p>雪点打着旋儿往下飘，世界被盖上一层柔软的白。<\/p><\/div>\n  <\/div>\n  <div class=\"item\">\n    <div class=\"sky stormy\"><div class=\"cloud\"><\/div><div class=\"flashbg\"><\/div><div class=\"bolt\"><\/div><\/div>\n    <div class=\"vt\">雷<\/div>\n    <div class=\"ct\"><div class=\"num\">04 / 04 · 雷<\/div><h2>雷雨将至<\/h2><p>云层翻滚，闪电划破夜空，亮一下，又暗下去。<\/p><\/div>\n  <\/div>\n<\/div>\n<div class=\"foot\">悬停或点按，切换一种天气<\/div>\n<script>\nvar acc=document.getElementById('acc'),items=acc.querySelectorAll('.item'),cur=0;\nfunction act(i){items[cur].classList.remove('active');cur=i;items[cur].classList.add('active');}\nitems.forEach(function(it,i){it.addEventListener('mouseenter',function(){act(i);});it.addEventListener('click',function(){act(i);});});\n<\/script>\n<\/body>\n<\/html>\n", "音阶阶梯": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n<title>音阶阶梯 · 创意手风琴<\/title>\n<style>\n*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nbody{font-family:-apple-system,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;background:#0e0a1e;color:#f2f4f8;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:26px 14px}\n.head{text-align:center;margin-bottom:16px}\n.head .tag{display:inline-block;font-size:11px;letter-spacing:1px;padding:4px 12px;border-radius:99px;background:rgba(167,139,250,.15);border:1px solid rgba(167,139,250,.4);color:#c4b5fd;margin-bottom:10px}\n.head h1{font-size:22px;font-weight:800}\n.head p{font-size:12px;color:#8b93a5;margin-top:6px}\n.playall{margin-bottom:16px;border:none;cursor:pointer;color:#fff;font-size:14px;font-weight:700;padding:12px 26px;border-radius:99px;background:linear-gradient(135deg,#7b6cff,#ff5a9c);box-shadow:0 8px 22px rgba(123,108,255,.5);transition:transform .15s}\n.playall:active{transform:scale(.95)}\n.acc{display:flex;width:100%;max-width:430px;height:540px;gap:10px}\n.item{position:relative;flex:1;border-radius:18px;overflow:hidden;cursor:pointer;min-width:0;transition:flex .6s cubic-bezier(.22,1,.36,1),box-shadow .3s}\n.item.active{flex:3.5;box-shadow:0 18px 40px rgba(0,0,0,.5)}\n.item::after{content:\"\";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.45),transparent 55%);pointer-events:none}\n.vt{position:absolute;z-index:2;left:0;right:0;top:16px;text-align:center;font-size:15px;font-weight:800;letter-spacing:4px;writing-mode:vertical-rl;text-orientation:upright;white-space:nowrap;transition:opacity .3s}\n.item.active .vt{opacity:0}\n.key{position:absolute;left:8px;right:8px;bottom:0;z-index:1;border-radius:12px 12px 0 0;background:linear-gradient(180deg,#ffffff,#d7e2f2);box-shadow:inset 0 -8px 0 rgba(0,0,0,.12),0 -4px 14px rgba(0,0,0,.25);transition:background .3s,box-shadow .3s}\n.item.active .key{background:linear-gradient(180deg,#fffbe6,#ffd166);box-shadow:0 0 34px rgba(255,209,102,.95),inset 0 -8px 0 rgba(0,0,0,.08)}\n.key i{display:block;text-align:center;font-style:normal;font-weight:800;color:#2b2b3a;padding-top:10px;font-size:13px}\n.ct{position:absolute;left:0;right:0;top:26px;z-index:2;text-align:center;padding:0 14px;opacity:0;transform:translateY(-12px);transition:opacity .45s ease .15s,transform .45s ease .15s}\n.item.active .ct{opacity:1;transform:none}\n.ct .num{font-size:11px;letter-spacing:3px;color:#ffd479;margin-bottom:8px}\n.ct h2{font-size:30px;font-weight:900}\n.ct p{font-size:12px;color:#d7dce8;margin-top:6px;line-height:1.7}\n.ct .hint{font-size:12px;color:#ffd479;margin-top:10px}\n.waves{position:absolute;left:50%;bottom:60px;z-index:2;width:0;height:0;pointer-events:none}\n.waves i{position:absolute;left:50%;top:50%;width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,209,102,.9);transform:translate(-50%,-50%) scale(.4);opacity:0}\n.item.playing .waves i{animation:ping 1s ease-out infinite}\n.item.playing .waves i:nth-child(2){animation-delay:.3s}\n.item.playing .waves i:nth-child(3){animation-delay:.6s}\n@keyframes ping{0%{transform:translate(-50%,-50%) scale(.4);opacity:.95}100%{transform:translate(-50%,-50%) scale(2.6);opacity:0}}\n.foot{margin-top:18px;font-size:11px;color:#5b6373}\n<\/style>\n<\/head>\n<body>\n<div class=\"head\"><div class=\"tag\">创意手风琴 · CR-05<\/div><h1>音阶阶梯<\/h1><p>四级台阶就是四个音：点面板发声，点下面连起来弹一遍<\/p><\/div>\n<button class=\"playall\" id=\"playall\">▶ 播放音阶 Do – Mi – Sol – Do′<\/button>\n<div class=\"acc\" id=\"acc\">\n  <div class=\"item active\" style=\"background:linear-gradient(160deg,#5aa9ff,#1e3a8a)\" data-freq=\"261.63\">\n    <div class=\"key\" style=\"height:110px\"><i>Do<\/i><\/div>\n    <div class=\"vt\">Do<\/div>\n    <div class=\"ct\"><div class=\"num\">第 1 级 · STEP 01<\/div><h2>Do<\/h2><p>C4 · 261.6 Hz<br>第一级台阶，最低也最稳。<\/p><p class=\"hint\">再点一次，听它发声<\/p><\/div>\n    <div class=\"waves\"><i><\/i><i><\/i><i><\/i><\/div>\n  <\/div>\n  <div class=\"item\" style=\"background:linear-gradient(160deg,#4ade80,#14532d)\" data-freq=\"329.63\">\n    <div class=\"key\" style=\"height:150px\"><i>Mi<\/i><\/div>\n    <div class=\"vt\">Mi<\/div>\n    <div class=\"ct\"><div class=\"num\">第 2 级 · STEP 02<\/div><h2>Mi<\/h2><p>E4 · 329.6 Hz<br>往上一步，亮了一点。<\/p><p class=\"hint\">再点一次，听它发声<\/p><\/div>\n    <div class=\"waves\"><i><\/i><i><\/i><i><\/i><\/div>\n  <\/div>\n  <div class=\"item\" style=\"background:linear-gradient(160deg,#fb923c,#7c2d12)\" data-freq=\"392.00\">\n    <div class=\"key\" style=\"height:190px\"><i>Sol<\/i><\/div>\n    <div class=\"vt\">Sol<\/div>\n    <div class=\"ct\"><div class=\"num\">第 3 级 · STEP 03<\/div><h2>Sol<\/h2><p>G4 · 392.0 Hz<br>爬到第三级，视野已经开阔。<\/p><p class=\"hint\">再点一次，听它发声<\/p><\/div>\n    <div class=\"waves\"><i><\/i><i><\/i><i><\/i><\/div>\n  <\/div>\n  <div class=\"item\" style=\"background:linear-gradient(160deg,#c084fc,#4c1d95)\" data-freq=\"523.25\">\n    <div class=\"key\" style=\"height:230px\"><i>Do′<\/i><\/div>\n    <div class=\"vt\">Do′<\/div>\n    <div class=\"ct\"><div class=\"num\">第 4 级 · STEP 04<\/div><h2>Do′<\/h2><p>C5 · 523.3 Hz<br>高八度的 Do，台阶的顶端。<\/p><p class=\"hint\">再点一次，听它发声<\/p><\/div>\n    <div class=\"waves\"><i><\/i><i><\/i><i><\/i><\/div>\n  <\/div>\n<\/div>\n<div class=\"foot\">手风琴结构对标 №324 · 发声用 WebAudio 正弦波<\/div>\n<script>\nvar acc=document.getElementById('acc'),items=acc.querySelectorAll('.item'),cur=0,AC=null;\nfunction act(i){items[cur].classList.remove('active');cur=i;items[cur].classList.add('active');}\nitems.forEach(function(it,i){\n  it.addEventListener('mouseenter',function(){act(i);});\n  it.addEventListener('click',function(){act(i);play(i);});\n});\nfunction tone(freq){\n  AC=AC||new (window.AudioContext||window.webkitAudioContext)();\n  if(AC.state==='suspended')AC.resume();\n  var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;\n  o.type='sine';o.frequency.value=freq;\n  g.gain.setValueAtTime(0.0001,t);\n  g.gain.exponentialRampToValueAtTime(0.25,t+0.02);\n  g.gain.exponentialRampToValueAtTime(0.0001,t+0.9);\n  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+1);\n}\nfunction play(i){\n  tone(parseFloat(items[i].dataset.freq));\n  items[i].classList.add('playing');\n  setTimeout(function(){items[i].classList.remove('playing');},1100);\n}\ndocument.getElementById('playall').addEventListener('click',function(){\n  items.forEach(function(it,i){\n    setTimeout(function(){act(i);play(i);},i*750);\n  });\n});\n<\/script>\n<\/body>\n<\/html>\n", "故事接龙": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n<title>故事接龙 · 创意手风琴<\/title>\n<style>\n*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nbody{font-family:-apple-system,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;background:#14101f;color:#f2f4f8;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:26px 14px}\n.head{text-align:center;margin-bottom:18px}\n.head .tag{display:inline-block;font-size:11px;letter-spacing:1px;padding:4px 12px;border-radius:99px;background:rgba(251,146,60,.15);border:1px solid rgba(251,146,60,.45);color:#fdba74;margin-bottom:10px}\n.head h1{font-size:22px;font-weight:800}\n.head p{font-size:12px;color:#8b93a5;margin-top:6px}\n.acc{display:flex;width:100%;max-width:430px;height:560px;gap:10px}\n.item{position:relative;flex:1;border-radius:18px;overflow:hidden;cursor:pointer;min-width:0;transition:flex .6s cubic-bezier(.22,1,.36,1)}\n.item.active{flex:3.5}\n.item::after{content:\"\";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.72) 0%,rgba(0,0,0,.12) 55%,transparent 75%);pointer-events:none;z-index:1}\n.vt{position:absolute;z-index:3;left:0;right:0;bottom:20px;text-align:center;font-size:14px;font-weight:800;letter-spacing:4px;writing-mode:vertical-rl;text-orientation:upright;white-space:nowrap;transition:opacity .3s}\n.item.active .vt{opacity:0}\n.item.active .fox{bottom:200px !important}\n.badge{position:absolute;z-index:3;top:14px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;letter-spacing:1px;padding:4px 9px;border-radius:99px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.35)}\n.scene{position:absolute;inset:0;z-index:0}\n.ct{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:20px 18px;opacity:0;transform:translateY(14px);transition:opacity .45s ease .15s,transform .45s ease .15s}\n.item.active .ct{opacity:1;transform:none}\n.ct .num{font-size:11px;letter-spacing:3px;color:#ffd479;margin-bottom:7px}\n.ct h2{font-size:19px;font-weight:800;margin-bottom:6px}\n.ct p{font-size:12px;line-height:1.8;color:#e2e8f0}\n/* ---- 狐狸剪影（圆形 + 三角形拼出） ---- */\n.fox{position:absolute;width:110px;height:96px}\n.f-head{position:absolute;left:50%;top:0;transform:translateX(-50%);width:58px;height:52px;background:#e07b39;border-radius:50%}\n.f-ear{position:absolute;top:-8px;width:22px;height:24px;background:#e07b39;clip-path:polygon(50% 0,0 100%,100% 100%)}\n.f-ear.l{left:26px;transform:rotate(-10deg)}\n.f-ear.r{right:26px;transform:rotate(10deg)}\n.f-ear i{position:absolute;left:50%;bottom:3px;transform:translateX(-50%);width:10px;height:11px;background:#5b2a12;clip-path:polygon(50% 0,0 100%,100% 100%)}\n.f-eye{position:absolute;top:20px;width:6px;height:6px;background:#1a1a1a;border-radius:50%}\n.f-eye.l{left:40px}.f-eye.r{right:40px}\n.f-nose{position:absolute;left:50%;top:34px;transform:translateX(-50%);width:9px;height:8px;background:#1a1a1a;border-radius:50%}\n.f-cheek{position:absolute;top:30px;width:14px;height:10px;background:#fff2df;border-radius:50%}\n.f-cheek.l{left:32px}.f-cheek.r{right:32px}\n.f-body{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:66px;height:44px;background:#e07b39;border-radius:50%}\n.f-tail{position:absolute;right:-6px;bottom:2px;width:52px;height:34px;background:#e07b39;clip-path:polygon(0 65%,100% 0,100% 100%,18% 100%)}\n.f-tail i{position:absolute;right:0;top:0;width:20px;height:22px;background:#fff2df;clip-path:polygon(0 55%,100% 0,100% 100%)}\n/* ---- 森林 ---- */\n.pine{position:absolute;bottom:34px}\n.pine .t1,.pine .t2{margin:0 auto;clip-path:polygon(50% 0,0 100%,100% 100%)}\n.pine .t1{width:56px;height:44px;background:#2f7d4f}\n.pine .t2{width:72px;height:48px;background:#1f5c38;margin-top:-14px}\n.pine .tr{width:10px;height:16px;background:#6b4226;margin:-2px auto 0}\n.ground{position:absolute;left:0;right:0;bottom:0;height:34px;background:#1c3a26}\n.firefly{position:absolute;width:6px;height:6px;border-radius:50%;background:#fef08a;box-shadow:0 0 10px 3px rgba(254,240,138,.8);animation:blink 1.8s ease-in-out infinite}\n@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}\n/* ---- 星星 ---- */\n.star5{position:absolute;background:#ffd166;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:twinkle 2.6s ease-in-out infinite}\n@keyframes twinkle{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.12) rotate(8deg)}}\n.sdot{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff}\n/* ---- 小屋 ---- */\n.house{position:absolute;width:120px;height:104px}\n.h-body{position:absolute;left:0;bottom:0;width:120px;height:72px;background:#f3d9a4;border-radius:4px}\n.h-roof{position:absolute;left:-10px;top:0;width:140px;height:44px;background:#b4532a;clip-path:polygon(50% 0,100% 100%,0 100%)}\n.h-door{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:26px;height:40px;background:#7c3f21;border-radius:12px 12px 0 0}\n.h-win{position:absolute;top:52px;width:24px;height:24px;background:#ffe58a;box-shadow:0 0 16px 4px rgba(255,229,138,.9);border-radius:4px}\n.h-win.l{left:12px}.h-win.r{right:12px}\n.h-chim{position:absolute;right:16px;top:-6px;width:14px;height:26px;background:#8a8a8a}\n.moon{position:absolute;width:52px;height:52px;border-radius:50%;box-shadow:16px 8px 0 0 #ffe9a8}\n.sun{position:absolute;width:56px;height:56px;border-radius:50%;background:#ffd166;box-shadow:0 0 30px 8px rgba(255,209,102,.7)}\n.path{position:absolute;bottom:0;width:100%;height:30px;background:#e8dcc0;clip-path:polygon(38% 0,62% 0,100% 100%,0 100%)}\n.foot{margin-top:18px;font-size:11px;color:#5b6373}\n<\/style>\n<\/head>\n<body>\n<div class=\"head\"><div class=\"tag\">创意手风琴 · CR-06<\/div><h1>故事接龙<\/h1><p>四块面板讲完一个故事：按 01 → 04 的顺序展开它<\/p><\/div>\n<div class=\"acc\" id=\"acc\">\n  <!-- 01 出门 -->\n  <div class=\"item active\" style=\"background:linear-gradient(180deg,#fbbf24 0%,#fb923c 45%,#f472b6 100%)\">\n    <div class=\"scene\">\n      <div class=\"sun\" style=\"right:22px;top:26px\"><\/div>\n      <div class=\"fox\" style=\"left:50%;bottom:44px;transform:translateX(-50%)\">\n        <div class=\"f-ear l\"><i><\/i><\/div><div class=\"f-ear r\"><i><\/i><\/div>\n        <div class=\"f-head\"><\/div><div class=\"f-eye l\"><\/div><div class=\"f-eye r\"><\/div>\n        <div class=\"f-cheek l\"><\/div><div class=\"f-cheek r\"><\/div><div class=\"f-nose\"><\/div>\n        <div class=\"f-body\"><\/div><div class=\"f-tail\"><i><\/i><\/div>\n      <\/div>\n      <div class=\"path\"><\/div>\n    <\/div>\n    <div class=\"badge\">01<\/div><div class=\"vt\">小狐狸出门<\/div>\n    <div class=\"ct\"><div class=\"num\">第 1 章 · 01 / 04<\/div><h2>小狐狸出门<\/h2><p>清晨，阳光漫过山坡。小狐狸背起小布包，推开篱笆门——今天，它要去森林的那一边看看。<\/p><\/div>\n  <\/div>\n  <!-- 02 森林 -->\n  <div class=\"item\" style=\"background:linear-gradient(180deg,#0f2e1d 0%,#14532d 60%,#1c3a26 100%)\">\n    <div class=\"scene\">\n      <div class=\"pine\" style=\"left:12px\"><div class=\"t1\"><\/div><div class=\"t2\"><\/div><div class=\"tr\"><\/div><\/div>\n      <div class=\"pine\" style=\"left:50%;transform:translateX(-50%) scale(1.25)\"><div class=\"t1\"><\/div><div class=\"t2\"><\/div><div class=\"tr\"><\/div><\/div>\n      <div class=\"pine\" style=\"right:12px\"><div class=\"t1\"><\/div><div class=\"t2\"><\/div><div class=\"tr\"><\/div><\/div>\n      <div class=\"firefly\" style=\"left:24%;top:30%\"><\/div>\n      <div class=\"firefly\" style=\"left:68%;top:22%;animation-delay:-.6s\"><\/div>\n      <div class=\"firefly\" style=\"left:46%;top:42%;animation-delay:-1.2s\"><\/div>\n      <div class=\"ground\"><\/div>\n      <div class=\"fox\" style=\"left:50%;bottom:34px;transform:translateX(-50%) scale(.8)\">\n        <div class=\"f-ear l\"><i><\/i><\/div><div class=\"f-ear r\"><i><\/i><\/div>\n        <div class=\"f-head\"><\/div><div class=\"f-eye l\"><\/div><div class=\"f-eye r\"><\/div>\n        <div class=\"f-cheek l\"><\/div><div class=\"f-cheek r\"><\/div><div class=\"f-nose\"><\/div>\n        <div class=\"f-body\"><\/div><div class=\"f-tail\"><i><\/i><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"badge\">02<\/div><div class=\"vt\">穿过森林<\/div>\n    <div class=\"ct\"><div class=\"num\">第 2 章 · 02 / 04<\/div><h2>穿过森林<\/h2><p>松林又深又静，只有萤火虫在前面引路。小狐狸跟着光点走，脚步轻轻的，生怕吵醒熟睡的森林。<\/p><\/div>\n  <\/div>\n  <!-- 03 星星 -->\n  <div class=\"item\" style=\"background:linear-gradient(180deg,#0b1035 0%,#1e1b4b 55%,#312e81 100%)\">\n    <div class=\"scene\">\n      <div class=\"star5\" style=\"left:50%;top:16%;transform:translateX(-50%);width:104px;height:104px\"><\/div>\n      <div class=\"sdot\" style=\"left:18%;top:14%\"><\/div><div class=\"sdot\" style=\"left:78%;top:26%\"><\/div>\n      <div class=\"sdot\" style=\"left:64%;top:10%\"><\/div><div class=\"sdot\" style=\"left:28%;top:38%\"><\/div>\n      <div class=\"sdot\" style=\"left:84%;top:44%\"><\/div>\n      <div class=\"fox\" style=\"left:50%;bottom:40px;transform:translateX(-50%) scale(.85)\">\n        <div class=\"f-ear l\"><i><\/i><\/div><div class=\"f-ear r\"><i><\/i><\/div>\n        <div class=\"f-head\"><\/div><div class=\"f-eye l\"><\/div><div class=\"f-eye r\"><\/div>\n        <div class=\"f-cheek l\"><\/div><div class=\"f-cheek r\"><\/div><div class=\"f-nose\"><\/div>\n        <div class=\"f-body\"><\/div><div class=\"f-tail\"><i><\/i><\/div>\n      <\/div>\n      <div class=\"ground\" style=\"background:#1e1b4b\"><\/div>\n    <\/div>\n    <div class=\"badge\">03<\/div><div class=\"vt\">遇见星星<\/div>\n    <div class=\"ct\"><div class=\"num\">第 3 章 · 03 / 04<\/div><h2>遇见星星<\/h2><p>林子尽头，一颗星星落在草地上。它说：“迷路了吗？跟我来。”星光铺成一条小路，一直铺到天边。<\/p><\/div>\n  <\/div>\n  <!-- 04 回家 -->\n  <div class=\"item\" style=\"background:linear-gradient(180deg,#312e81 0%,#7c3aed 50%,#f472b6 100%)\">\n    <div class=\"scene\">\n      <div class=\"moon\" style=\"right:26px;top:24px\"><\/div>\n      <div class=\"house\" style=\"left:50%;bottom:36px;transform:translateX(-50%)\">\n        <div class=\"h-chim\"><\/div><div class=\"h-roof\"><\/div><div class=\"h-body\"><\/div>\n        <div class=\"h-win l\"><\/div><div class=\"h-win r\"><\/div><div class=\"h-door\"><\/div>\n      <\/div>\n      <div class=\"path\"><\/div>\n    <\/div>\n    <div class=\"badge\">04<\/div><div class=\"vt\">回到家里<\/div>\n    <div class=\"ct\"><div class=\"num\">第 4 章 · 04 / 04<\/div><h2>回到家里<\/h2><p>星光把小狐狸送到家门口，屋里亮着暖黄的灯。它回头挥挥手：“谢谢你，明天见。”然后推开了家门。<\/p><\/div>\n  <\/div>\n<\/div>\n<div class=\"foot\">手风琴结构对标 №324 · 狐狸 / 松树 / 星星 / 小屋全部由 CSS 形状拼出<\/div>\n<script>\nvar acc=document.getElementById('acc'),items=acc.querySelectorAll('.item'),cur=0;\nfunction act(i){items[cur].classList.remove('active');cur=i;items[cur].classList.add('active');}\nitems.forEach(function(it,i){\n  it.addEventListener('mouseenter',function(){act(i);});\n  it.addEventListener('click',function(){act(i);});\n});\n<\/script>\n<\/body>\n<\/html>\n", "盲盒开箱": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n<title>盲盒开箱 · 创意手风琴<\/title>\n<style>\n*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nbody{font-family:-apple-system,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;background:#221a12;color:#f2f4f8;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:26px 14px}\n.head{text-align:center;margin-bottom:16px}\n.head .tag{display:inline-block;font-size:11px;letter-spacing:1px;padding:4px 12px;border-radius:99px;background:rgba(217,177,129,.15);border:1px solid rgba(217,177,129,.5);color:#e8c795;margin-bottom:10px}\n.head h1{font-size:22px;font-weight:800}\n.head p{font-size:12px;color:#8b93a5;margin-top:6px}\n.reset{margin-bottom:16px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;font-size:13px;padding:10px 20px;border-radius:99px;cursor:pointer}\n.reset:active{transform:scale(.96)}\n.acc{display:flex;width:100%;max-width:430px;height:540px;gap:10px}\n.item{position:relative;flex:1;border-radius:18px;overflow:hidden;cursor:pointer;min-width:0;transition:flex .6s cubic-bezier(.22,1,.36,1)}\n.item.active{flex:3.5}\n.vt{position:absolute;z-index:4;left:0;right:0;bottom:20px;text-align:center;font-size:14px;font-weight:800;letter-spacing:3px;color:#5b3a1a;writing-mode:vertical-rl;text-orientation:upright;white-space:nowrap;transition:opacity .3s}\n.item.active .vt{opacity:0}\n.inner{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;  ---- 内含小场景（纯 CSS） ---- */\n.plant{position:relative;width:110px;height:110px}\n.pot{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:74px;height:52px;background:#c96f4a;clip-path:polygon(0 0,100% 0,86% 100%,14% 100%)}\n.pot::after{content:\"\";position:absolute;left:0;right:0;top:0;height:10px;background:#a85a3a}\n.leaf{position:absolute;bottom:44px;width:34px;height:52px;background:#3e9b5f;border-radius:50%}\n.leaf.l1{left:22px;transform:rotate(-28deg)}\n.leaf.l2{left:50%;transform:translateX(-50%);bottom:52px;background:#55b877}\n.leaf.l3{right:22px;transform:rotate(28deg)}\n.car{position:relative;width:140px;height:84px}\n.car-body{position:absolute;left:0;bottom:14px;width:140px;height:34px;background:#e23b3b;border-radius:16px 16px 10px 10px}\n.car-top{position:absolute;left:28px;bottom:44px;width:76px;height:30px;background:#e23b3b;border-radius:16px 16px 0 0}\n.car-win{position:absolute;left:40px;bottom:50px;width:52px;height:20px;background:#bfe6f5;border-radius:6px}\n.wheel{position:absolute;bottom:0;width:30px;height:30px;background:#1a1a1a;border-radius:50%}\n.wheel::after{content:\"\";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:12px;height:12px;background:#d7dce8;border-radius:50%}\n.wheel.l{left:18px}.wheel.r{right:18px}\n.balloon{position:relative;width:110px;height:130px}\n.b-body{position:absolute;left:50%;top:0;transform:translateX(-50%);width:88px;height:100px;background:radial-gradient(circle at 35% 30%,#ff9ecb,#e23b8a);border-radius:50%}\n.b-knot{position:absolute;left:50%;top:98px;transform:translateX(-50%);width:14px;height:12px;background:#e23b8a;clip-path:polygon(50% 0,0 100%,100% 100%)}\n.b-string{position:absolute;left:50%;top:110px;transform:translateX(-50%);width:2px;height:20px;background:#8a6a45}\n.cat{position:relative;width:110px;height:104px}\n.cat-head{position:absolute;left:50%;top:0;transform:translateX(-50%);width:62px;height:56px;background:#1a1a1a;border-radius:50%}\n.cat-ear{position:absolute;top:-8px;width:22px;height:24px;background:#1a1a1a;clip-path:polygon(50% 0,0 100%,100% 100%)}\n.cat-ear.l{left:26px;transform:rotate(-10deg)}\n.cat-ear.r{right:26px;transform:rotate(10deg)}\n.cat-eye{position:absolute;top:22px;width:7px;height:7px;background:#ffd166;border-radius:50%}\n.cat-eye.l{left:42px}.cat-eye.r{right:42px}\n.cat-body{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:72px;height:46px;background:#1a1a1a;border-radius:50%}\n.cat-tail{position:absolute;right:-2px;bottom:6px;width:46px;height:40px;border:9px solid #1a1a1a;border-left:none;border-bottom:none;border-radius:0 50% 0 0}\n.foot{margin-top:18px;font-size:11px;color:#5b6373}\n<\/style>\n<\/head>\n<body>\n<div class=\"head\"><div class=\"tag\">创意手风琴 · CR-07<\/div><h1>盲盒开箱<\/h1><p>点面板展开并撕开盒子，看看里面藏着什么<\/p><\/div>\n<button class=\"reset\" id=\"reset\">↺ 全部重新封好<\/button>\n<div class=\"acc\" id=\"acc\">\n  <div class=\"item active\">\n    <div class=\"inner\"><div class=\"plant\"><div class=\"leaf l1\"><\/div><div class=\"leaf l2\"><\/div><div class=\"leaf l3\"><\/div><div class=\"pot\"><\/div><\/div><div class=\"label\">小多肉<\/div><div class=\"sub\">不用浇太多水，也能长得很好<\/div><\/div>\n    <div class=\"seal\"><div class=\"q\">?<\/div><div class=\"tape\"><\/div><\/div>\n    <div class=\"lid\"><div class=\"tape2\"><\/div><\/div>\n    <div class=\"vt\">盲盒 01<\/div><div class=\"hint\">点按开箱<\/div>\n    <div class=\"ct\"><b>开出：小多肉<\/b><p>隐藏款概率 1 / 144，你抽中了它<\/p><\/div>\n  <\/div>\n  <div class=\"item\">\n    <div class=\"inner\"><div class=\"car\"><div class=\"car-top\"><\/div><div class=\"car-win\"><\/div><div class=\"car-body\"><\/div><div class=\"wheel l\"><\/div><div class=\"wheel r\"><\/div><\/div><div class=\"label\">小赛车<\/div><div class=\"sub\">一推就跑，客厅就是赛道<\/div><\/div>\n    <div class=\"seal\"><div class=\"q\">?<\/div><div class=\"tape\"><\/div><\/div>\n    <div class=\"lid\"><div class=\"tape2\"><\/div><\/div>\n    <div class=\"vt\">盲盒 02<\/div><div class=\"hint\">点按开箱<\/div>\n    <div class=\"ct\"><b>开出：小赛车<\/b><p>红色车身，轮子转得飞快<\/p><\/div>\n  <\/div>\n  <div class=\"item\">\n    <div class=\"inner\"><div class=\"balloon\"><div class=\"b-body\"><\/div><div class=\"b-knot\"><\/div><div class=\"b-string\"><\/div><\/div><div class=\"label\">粉气球<\/div><div class=\"sub\">抓紧线，别让它飞走<\/div><\/div>\n    <div class=\"seal\"><div class=\"q\">?<\/div><div class=\"tape\"><\/div><\/div>\n    <div class=\"lid\"><div class=\"tape2\"><\/div><\/div>\n    <div class=\"vt\">盲盒 03<\/div><div class=\"hint\">点按开箱<\/div>\n    <div class=\"ct\"><b>开出：粉气球<\/b><p>轻轻一放，它就想往天上飘<\/p><\/div>\n  <\/div>\n  <div class=\"item\">\n    <div class=\"inner\"><div class=\"cat\"><div class=\"cat-ear l\"><\/div><div class=\"cat-ear r\"><\/div><div class=\"cat-head\"><\/div><div class=\"cat-eye l\"><\/div><div class=\"cat-eye r\"><\/div><div class=\"cat-body\"><\/div><div class=\"cat-tail\"><\/div><\/div><div class=\"label\">黑猫<\/div><div class=\"sub\">高冷，但允许你摸一下<\/div><\/div>\n    <div class=\"seal\"><div class=\"q\">?<\/div><div class=\"tape\"><\/div><\/div>\n    <div class=\"lid\"><div class=\"tape2\"><\/div><\/div>\n    <div class=\"vt\">盲盒 04<\/div><div class=\"hint\">点按开箱<\/div>\n    <div class=\"ct\"><b>开出：黑猫<\/b><p>隐藏款！它正用金眼睛看着你<\/p><\/div>\n  <\/div>\n<\/div>\n<div class=\"foot\">手风琴结构对标 №324 · 盒盖 clip-path 锯齿撕口 + translateY 翻开<\/div>\n<script>\nvar acc=document.getElementById('acc'),items=acc.querySelectorAll('.item'),cur=0;\nfunction act(i){items[cur].classList.remove('active');cur=i;items[cur].classList.add('active');}\nitems.forEach(function(it,i){\n  it.addEventListener('mouseenter',function(){act(i);});\n  it.addEventListener('click',function(){act(i);it.classList.add('opened');});\n});\ndocument.getElementById('reset').addEventListener('click',function(){\n  items.forEach(function(it){it.classList.remove('opened');});\n});\n<\/script>\n<\/body>\n<\/html>\n", "塔罗牌阵": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"vi l\" style=\"left:81px;top:54px;animation-delay:1.16s\"><\/div><div class=\"petal\" style=\"left:52px;top:71px;animation-delay:1.24s\"><\/div><div class=\"petal\" style=\"left:23px;top:54px;animation-delay:1.32s\"><\/div><div class=\"petal\" style=\"left:23px;top:20px;animation-delay:1.40s\"><\/div><div class=\"center\"><\/div><\/div><div class=\"soil\"><\/div><\/div><div class=\"vt\">开花<\/div><div class=\"ct\"><div class=\"num\">03 / 04<\/div><h2>开花<\/h2><p>六片花瓣围成一圈，迎来第一只蜂。<\/p><\/div><\/div><div class=\"item\"><div class=\"sc\"><div style=\"position:absolute;inset:0;background:linear-gradient(180deg,#ffedd5,#fed7aa)\"><\/div><div class=\"plant\"><div class=\"stem\" style=\"height:250px\"><\/div><div class=\"leaf l\" style=\"bottom:60px;animation-delay:.7s\"><\/div><div class=\"leaf r\" style=\"bottom:95px;animation-delay:.9s\"><\/div><div class=\"leaf l\" style=\"bottom:120px;animation-delay:.7s\"><\/div><div class=\"leaf r\" style=\"bottom:160px;animation-delay:.9s\"><\/div><div class=\"fruit\" style=\"left:22px;top:60px;animation-delay:1.1s\"><\/div><div class=\"fruit\" style=\"left:84px;top:88px;animation-delay:1.25s\"><\/div><div class=\"fruit\" style=\"left:52px;top:38px;animation-delay:1.4s;background:#f97316;border-color:#c2410c\"><\/div><\/div><div class=\"soil\"><\/div><\/div><div class=\"vt\">结果<\/div><div class=\"ct\"><div class=\"num\">04 / 04<\/div><h2>结果<\/h2><p>果实坠弯枝头，秋天有了回音。<\/p><\/div><\/div><\/div>\n<div class=\"foot\">创意手风琴 · 悬停或点按展开<\/div>\n<script>\nvar acc=document.getElementById('acc'),items=acc.querySelectorAll('.item'),cur=0;\nfunction act(i){items[cur].classList.remove('active');cur=i;items[cur].classList.add('active');}\nitems.forEach(function(it,i){it.addEventListener('mouseenter',function(){act(i);});\nit.addEventListener('click',function(){act(i);});});\n<\/script><\/body><\/html>", "火山": "<!DOCTYPE html><html lang=\"zh-CN\"><head><meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n<title>火山<\/title><style>\n*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nbody{font-family:-apple-system,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;background:#0b0d12;color:#f2f4f8;\nmin-height:100vh;display:flex;flex-direction:column;align-items:center;padding:26px 14px}\n.head{text-align:center;margin-bottom:18px}\n.head .tag{display:inline-block;font-size:11px;letter-spacing:1px;padding:4px 12px;border-radius:99px;\nbackground:rgba(138,180,255,.12);border:1px solid rgba(138,180,255,.35);color:#8ab4ff;margin-bottom:10px}\n.head h1{font-size:21px;font-weight:800}\n.head p{font-size:12px;color:#8b93a5;margin-top:6px}\n.acc{display:flex;width:100%;max-width:430px;height:560px;gap:10px}\n.item{position:relative;flex:1;border-radius:18px;overflow:hidden;cursor:pointer;min-width:0;\ntransition:flex .6s cubic-bezier(.22,1,.36,1)}\n.item.active{flex:3.5}\n.sc{position:absolute;inset:0;overflow:hidden}\n.item::after{content:\"\";position:absolute;inset:0;pointer-events:none;\nbackground:linear-gradient(to top,rgba(0,0,0,.72) 0%,rgba(0,0,0,.15) 45%,rgba(0,0,0,.05) 100%)}\n.item .vt{position:absolute;left:0;right:0;bottom:24px;z-index:2;text-align:center;font-size:15px;font-weight:700;\nletter-spacing:6px;writing-mode:vertical-rl;text-orientation:upright;white-space:nowrap;transition:opacity .3s}\n.item.active .vt{opacity:0}\n.item .ct{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:22px 20px;opacity:0;transform:translateY(14px);\ntransition:opacity .45s ease .15s,transform .45s ease .15s}\n.item.active .ct{opacity:1;transform:none}\n.item .ct .num{font-size:11px;letter-spacing:3px;color:#ffd479;margin-bottom:8px}\n.item .ct h2{font-size:20px;font-weight:800;margin-bottom:7px}\n.item .ct p{font-size:13px;line-height:1.7;color:#c9d1e0}\n.foot{margin-top:18px;font-size:11px;color:#5b6373}\n\n.cone{position:absolute;left:50%;bottom:8%;width:86%;height:52%;transform:translateX(-50%);\nclip-path:polygon(34% 0,66% 0,100% 100%,0 100%);\nbackground:linear-gradient(180deg,#57534e,#292524)}\n.cone.sleep{background:linear-gradient(180deg,#e7e5e4 0%,#a8a29e 22%,#57534e 60%,#292524)}\n.crater{position:absolute;left:50%;bottom:calc(8% + 52% - 14px);width:34%;height:16px;transform:translateX(-50%);\nbackground:#1c1917;border-radius:50%}\n.smoke{position:absolute;width:26px;height:26px;border-radius:50%;background:rgba(214,211,209,.85);\nfilter:blur(3px);opacity:0}\n.item.active .smoke{animation:rise 3.2s ease-out infinite}\n@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:.75}\n100%{transform:translateY(-190px) translateX(26px) scale(1.7);opacity:0}}\n.lava{position:absolute;left:50%;bottom:calc(8% + 52% - 10px);width:30%;height:150px;transform:translateX(-50%);\nclip-path:polygon(42% 0,58% 0,78% 100%,22% 100%);\nbackground:linear-gradient(180deg,#facc15,#f97316,#dc2626);opacity:0}\n.item.active .lava{opacity:1;animation:glow 1.2s ease-in-out infinite}\n@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.45)}}\n.spark{position:absolute;width:7px;height:7px;border-radius:50%;background:#fb923c;\nbox-shadow:0 0 10px #f97316;opacity:0}\n.item.active .spark{animation:spray var(--t) ease-out infinite;animation-delay:var(--d)}\n@keyframes spray{0%{transform:translate(0,0) scale(1);opacity:1}\n100%{transform:translate(var(--x),-170px) scale(.3);opacity:0}}\n.ember{position:absolute;width:5px;height:5px;border-radius:50%;background:#f97316;\nbox-shadow:0 0 8px #f97316;opacity:0}\n.item.active .ember{animation:blink 1.8s ease-in-out infinite}\n@keyframes blink{0%,100%{opacity:.15}50%{opacity:1}}\n.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.8}\n<\/style><\/head><body>\n<div class=\"head\"><div class=\"tag\">创意手风琴 · cr-11<\/div><h1>火山<\/h1><p>一座火山的四种状态：展开时烟、岩浆与火星依次登场<\/p><\/div>\n<div class=\"acc\" id=\"acc\"><div class=\"item active\"><div class=\"sc\"><div style=\"position:absolute;inset:0;background:linear-g 8s;--d:0.69s\"><\/div><div class=\"spark\" style=\"left:53%;bottom:58%;--x:25px;--t:1.28s;--d:0.85s\"><\/div><div class=\"spark\" style=\"left:52%;bottom:58%;--x:-55px;--t:1.7s;--d:0.6s\"><\/div><div class=\"spark\" style=\"left:51%;bottom:58%;--x:39px;--t:1.82s;--d:0.56s\"><\/div><\/div><div class=\"vt\">喷发<\/div><div class=\"ct\"><div class=\"num\">03 / 04<\/div><h2>喷发<\/h2><p>岩浆冲上夜空，火星像一场倒流的雨。<\/p><\/div><\/div><div class=\"item\"><div class=\"sc\"><div style=\"position:absolute;inset:0;background:linear-gradient(180deg,#292524,#0c0a09)\"><\/div><div class=\"cone\"><\/div><div class=\"crater\"><\/div><div class=\"lava\" style=\"background:linear-gradient(180deg,#7f1d1d,#450a0a);animation:none\"><\/div><div class=\"ember\" style=\"left:38%;bottom:52%;animation-delay:0s\"><\/div><div class=\"ember\" style=\"left:55%;bottom:44%;animation-delay:.7s\"><\/div><div class=\"ember\" style=\"left:48%;bottom:36%;animation-delay:1.2s\"><\/div><div class=\"ember\" style=\"left:62%;bottom:58%;animation-delay:.4s\"><\/div><\/div><div class=\"vt\">冷却<\/div><div class=\"ct\"><div class=\"num\">04 / 04<\/div><h2>冷却<\/h2><p>熔岩凝成黑岩，只剩零星火星未眠。<\/p><\/div><\/div><\/div>\n<div class=\"foot\">创意手风琴 · 悬停或点按展开<\/div>\n<script>\nvar acc=document.getElementById('acc'),items=acc.querySelectorAll('.item'),cur=0;\nfunction act(i){items[cur].classList.remove('active');cur=i;items[cur].classList.add('active');}\nitems.forEach(function(it,i){it.addEventListener('mouseenter',function(){act(i);});\nit.addEventListener('click',function(){act(i);});});\n<\/script><\/body><\/html>", "极光": "<!DOCTYPE html><html lang=\"zh-CN\"><head><meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n<title>极光<\/title><style>\n*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nbody{font-family:-apple-system,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;background:#0b0d12;color:#f2f4f8;\nmin-height:100vh;display:flex;flex- t(1px 1px at 55% 12%,#fff,transparent),\nradial-gradient(1.5px 1.5px at 30% 8%,#fff,transparent)}\n.band{position:absolute;height:110px;border-radius:50%;filter:blur(16px);opacity:.5;\ntransition:width .8s ease,left .8s ease,opacity .8s ease}\n.band-in{position:absolute;inset:0;border-radius:50%}\n.item.active .band{opacity:.95}\n@keyframes sway1{0%,100%{transform:rotate(-11deg) translateX(-4%)}50%{transform:rotate(-7deg) translateX(4%)}}\n@keyframes sway2{0%,100%{transform:rotate(-14deg) translateX(5%)}50%{transform:rotate(-9deg) translateX(-5%)}}\n@keyframes sway3{0%,100%{transform:rotate(-8deg) translateX(0)}50%{transform:rotate(-13deg) translateX(6%)}}\n\n.item.active .band{width:215%;left:-57%}\n<\/style><\/head><body>\n<div class=\"head\"><div class=\"tag\">创意手风琴 · cr-12<\/div><h1>极光<\/h1><p>四色极光在夜空里流动：展开时光带变亮变宽<\/p><\/div>\n<div class=\"acc\" id=\"acc\"><div class=\"item active\"><div class=\"sc\"><div class=\"sky\"><\/div><div class=\"stars\"><\/div><div class=\"band\" style=\"top:16%;width:165%;left:-32%;\"><div class=\"band-in\" style=\"background:linear-gradient(90deg,transparent,#4ade80 30%,#bbf7d0 55%,transparent);animation:sway1 8s ease-in-out infinite\"><\/div><\/div><div class=\"band\" style=\"top:30%;width:165%;left:-32%;\"><div class=\"band-in\" style=\"background:linear-gradient(90deg,transparent,#4ade80 30%,#bbf7d0 55%,transparent);animation:sway2 12s ease-in-out infinite\"><\/div><\/div><div class=\"band\" style=\"top:44%;width:165%;left:-32%;\"><div class=\"band-in\" style=\"background:linear-gradient(90deg,transparent,#4ade80 30%,#bbf7d0 55%,transparent);animation:sway3 15s ease-in-out infinite\"><\/div><\/div><div style=\"position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(transparent,rgba(2,6,23,.9))\"><\/div><\/div><div class=\"vt\">绿极光<\/div><div class=\"ct\"><div class=\"num\">01 / 04<\/div><h2>绿极光<\/h2><p>最常见的极光，氧原子在高空被点亮。<\/p><\/div><\/div><div class=\"item\"><div class=\"sc\"><div class=\"sky\"><\/div><div class=\"stars\"><\/div><div class=\"band\" style=\"top:16%;width:165%;left:-32%;\"><div class=\"band-in\" style=\"background:linear-gradient(90deg,transparent,#a78bfa 30%,#ddd6fe 55%,transparent);animation:sway1 8s ease-in-out infinite\"><\/div><\/div><div class=\"band\" style=\"top:30%;width:165%;left:-32%;\"><div class=\"band-in\" style=\"background:linear-gradient(90deg,transparent,#a78bfa 30%,#ddd6fe 55%,transparent);animation:sway2 12s ease-in-out infinite\"><\/div><\/div><div class=\"band\" style=\"top:44%;width:165%;left:-32%;\"><div class=\"band-in\" style=\"background:linear-gradient(90deg,transparent,#a78bfa 30%,#ddd6fe 55%,transparent);animation:sway3 15s ease-in-out infinite\"><\/div><\/div><div style=\"position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(transparent,rgba(2,6,23,.9))\"><\/div><\/div><div class=\"vt\">紫极光<\/div><div class=\"ct\"><div class=\"num\">02 / 04<\/div><h2>紫极光<\/h2><p>太阳风最强时，天空会翻出紫色。<\/p><\/div><\/div><div class=\"item\"><div class=\"sc\"><div class=\"sky\"><\/div><div class=\"stars\"><\/div><div class=\"band\" style=\"top:16%;width:165%;left:-32%;\"><div class=\"band-in\" style=\"background:linear-gradient(90deg,transparent,#f472b6 30%,#fbcfe8 55%,transparent);animation:sway1 8s ease-in-out infinite\"><\/div><\/div><div class=\"band\" style=\"top:30%;width:165%;left:-32%;\"><div class=\"band-in\" style=\"background:linear-gradient(90deg,transparent,#f472b6 30%,#fbcfe8 55%,transparent);animation:sway2 12s ease-in-out infinite\"><\/div><\/div><div class=\"band\" style=\"top:44%;width:165%;left:-32%;\"><div class=\"band-in\" style=\"background:linear-gradient(90deg,transparent,#f472b6 30%,#fbcfe8 55%,transparent);animation:sway3 15s ease-in-out infinite\"><\/div><\/div><div style=\"position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(transparent,rgba(2,6,23,.9))\"><\/div><\/div><div class=\"vt\">粉极光<\/div><div class=\"ct\"><div class=\"num\">03 / 04<\/div><h2>粉极光<\/h2><p>罕见的粉色光带，像夜空里的霓虹。<\/p><\/div><\/div><div class=\"item\"><div class=\"sc\"><div class=\"sky\"><\/div><div class=\"stars\"><\/div><div class=\"band\" style=\"top:16%;width:165%;left:-32%;\"><div class=\"band-in\" style=\"background:linear-gradient(90deg,transparent,#38bdf8 30%,#bae6fd 55%,transparent);animation:sway1 8s ease-in-out infinite\"><\/div><\/div><div class=\"band\" style=\"top:30%;width:165%;left:-32%;\"><div class=\"band-in\" style=\"background:linear-gradient(90deg,transparent,#38bdf8 30%,#bae6fd 55%,transparent);animation:sway2 12s ease-in-out infinite\"><\/div><\/div><div class=\"band\" style=\"top:44%;width:165%;left:-32%;\"><div class=\"band-in\" style=\"background:linear-gradient(90deg,transparent,#38bdf8 30%,#bae6fd 55%,transparent);animation:sway3 15s ease-in-out infinite\"><\/div><\/div><div style=\"position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(transparent,rgba(2,6,23,.9))\"><\/div><\/div><div class=\"vt\">蓝极光<\/div><div class=\"ct\"><div class=\"num\">04 / 04<\/div><h2>蓝极光<\/h2><p>蓝色极光贴着地平线，冷而安静。<\/p><\/div><\/div><\/div>\n<div class=\"foot\">创意手风琴 · 悬停或点按展开<\/div>\n<script>\nvar acc=document.getElementById('acc'),items=acc.querySelectorAll('.item'),cur=0;\nfunction act(i){items[cur].classList.remove('active');cur=i;items[cur].classList.add('active');}\nitems.forEach(function(it,i){it.addEventListener('mouseenter',function(){act(i);});\nit.addEventListener('click',function(){act(i);});});\n<\/script><\/body><\/html>"};
const CAT2G = {};
DATA.groups.forEach((g, gi) => g.cats.forEach(c => CAT2G[c] = gi));
const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
let tab = 'home', curGroup = 0, curCat = -1, query = '';

function rowHTML(it) {
  return `<div class="row" onclick='openDetail(${it.n})'><span class="no">№${String(it.n).padStart(3, '0')}</span><div class="mid"><b>${esc(it.t)}</b><span>${DATA.cats[it.c]}</span></div>${it.new ? '<span class="newb">NEW</span>' : ''}</div>`;
}
function setTab(t) {
  tab = t;
  document.querySelectorAll('#tabbar button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  if (t === 'home') renderHome();
  if (t === 'cats') renderCats();
  if (t === 'search') renderSearch();
  if (t === 'new') renderNew();
}
document.querySelectorAll('#tabbar button').forEach(b => b.onclick = () => setTab(b.dataset.t));

function renderHome() {
  const news = DATA.items.filter(i => i.new);
  let h = `<div class="newbanner" onclick="setTab('new')"><b>✨ 新增 创意手风琴 12</b><span>${news.length} 组新内容 · 点我直达</span></div>`;
  DATA.groups.forEach((g, gi) => {
    const n = DATA.items.filter(i => CAT2G[i.c] === gi).length;
    const subs = g.cats.map(c => `${DATA.cats[c]} ${DATA.items.filter(i => i.c === c).length}组`).join(' · ');
    h += `<div class="gcard" onclick="openGroup(${gi})"><h3>${g.name}</h3><div class="cnt">共 ${n} 组</div><div class="subs">${subs}</div><span class="go">进入大组 →</span></div>`;
  });
  $('#content').innerHTML = h;
}
function openGroup(gi) { curGroup = gi; curCat = -1; setTab('cats'); }
function renderCats() {
  const g = DATA.groups[curGroup];
  let h = `<div class="chips"><button class="${curCat === -1 ? 'on' : ''}" onclick="pickCat(-1)">全部</button>` +
    g.cats.map(c => `<button class="${curCat === c ? 'on' : ''}" onclick="pickCat(${c})">${DATA.cats[c]}</button>`).join('') + `</div>`;
  const list = curCat === -1 ? DATA.items.filter(i => CAT2G[i.c] === curGroup) : DATA.items.filter(i => i.c === curCat);
  h += `<div class="sect">${g.name} · 共 ${list.length} 组</div>` + list.map(rowHTML).join('');
  $('#content').innerHTML = h;
}
function pickCat(c) { curCat = c; renderCats(); }
function renderSearch() {
  const list = query ? DATA.items.filter(i => i.t.toLowerCase().includes(query.toLowerCase())) : [];
  $('#content').innerHTML = `<div class="searchbox" style="padding:0 0 14px"><input id="q" placeholder="搜索标题，如：手风琴、底栏" value="${esc(query)}"><button onclick="doSearch()">搜索</button></div>` +
    (query ? `<div class="sect">共 ${list.length} 组</div>` + (list.length ? list.map(rowHTML).join('') : '<div class="empty">没有匹配的案例</div>') : '<div class="empty">输入关键词搜索全部案例</div>');
  const inp = $('#q');
  if (inp) { inp.focus(); inp.onkeydown = e => { if (e.key === 'Enter') doSearch(); }; inp.oninput = () => { query = inp.value.trim(); if (query) { const l = DATA.items.filter(i => i.t.toLowerCase().includes(query.toLowerCase())); const box = $('#sres'); if (box) box.innerHTML = `<div class="sect">共 ${l.length} 组</div>` + (l.length ? l.map(rowHTML).join('') : '<div class="empty">没有匹配的案例</div>'); } }; }
  const wrap = document.createElement('div'); wrap.id = 'sres';
  $('#content').appendChild(wrap);
}
function doSearch() { query = ($('#q') ? $('#q').value.trim() : ''); renderSearch(); }
function renderNew() {
  const list = DATA.items.filter(i => i.new);
  $('#content').innerHTML = `<div class="sect">最新上架 · 共 ${list.length} 组</div>` + list.map(rowHTML).join('');
}
function openDetail(n) {
  const it = DATA.items.find(i => i.n === n);
  const gi = CAT2G[it.c];
  const suf = it.t.includes('创意手风琴 · ') ? it.t.split('创意手风琴 · ')[1] : '';
  let demo = '';
  if (suf && DEMOS[suf]) {
    demo = `<div class="demo"><iframe id="demoFrame" sandbox="allow-scripts"></iframe></div>`;
  } else {
    demo = `<div class="note">该演示的原生 App 风格版正在按分类分批制作中，先去画廊主站查看演示效果。<a href="https://shuting52.github.io/app-gallery/?g=${gi}&s=${it.c}" target="_blank">去画廊主站查看 ↗</a></div>`;
  }
  $('#detail').innerHTML = `<div class="dhead"><button onclick="closeDetail()">‹ 返回</button><h2>${esc(it.t)}</h2></div><div class="meta">№${String(it.n).padStart(3, '0')} · ${DATA.groups[gi].name} / ${DATA.cats[it.c]}${it.new ? ' · NEW' : ''}</div>${demo}`;
  $('#detail').classList.add('open');
  const fr = $('#demoFrame');
  if (fr && suf && DEMOS[suf]) fr.srcdoc = DEMOS[suf];
  window.scrollTo(0, 0);
}
function closeDetail() { $('#detail').classList.remove('open'); }
document.getElementById('subtitle').textContent = `${DATA.items.length} 组 · ${DATA.groups.length} 大组 · ${Object.keys(DATA.cats).length} 分类`;
renderHome();
</script></body></html>
